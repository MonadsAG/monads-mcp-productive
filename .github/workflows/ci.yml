name: CI

# Nothing ran these checks automatically before -- the only workflow was the
# weekly API-spec sync, so `npm test` only happened when someone remembered.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Two tsconfigs on purpose: the worker one type-checks everything, the
      # stdio build excludes every edge-runtime file (see CLAUDE.md).
      - name: Typecheck (worker)
        run: npx tsc -p tsconfig.worker.json

      - name: Typecheck (scripts)
        run: npx tsc -p tsconfig.scripts.json

      - name: Build (stdio)
        run: npm run build

      - name: Format
        run: npx prettier --check src scripts tests

      # The integration suites skip themselves without PRODUCTIVE_API_TOKEN,
      # which is never set here -- CI runs the unit tests only.
      - name: Tests
        run: npm test

      # Fails when src/api uses an endpoint, filter key or attribute the
      # committed spec does not have. Same check the weekly sync PR runs.
      - name: API spec drift
        run: npm run spec:impact

      # What npm would ship: the stdio build plus README, LICENSE and NOTICE
      # (Apache-2.0 requires NOTICE, and npm does not add it on its own).
      - name: Package contents
        run: |
          npm pack --dry-run --json | node -e '
            const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((f) => f.path);
            const required = ["build/index.js", "LICENSE", "NOTICE", "README.md", "package.json"];
            const missing = required.filter((f) => !files.includes(f));
            const extra = files.filter((f) => !required.includes(f) && !/^build\/.+\.js$/.test(f));
            console.log(files.join("\n"));
            if (missing.length || extra.length) {
              console.error(`missing: ${missing.join(", ") || "-"}; unexpected: ${extra.join(", ") || "-"}`);
              process.exit(1);
            }'

      - name: Package smoke test
        run: npm run package:smoke

  # Every push to main publishes @monadsag/productive-mcp; the MCP hub runs
  # `npx @monadsag/productive-mcp@latest`. Cloudflare Workers Builds deploys the
  # Worker from the same push independently of this job.
  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    # One publish at a time, in push order, so `latest` never moves backwards.
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Require NPM_TOKEN
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Repository secret NPM_TOKEN is not set -- nothing was published. Add a granular npm token with publish rights for @monadsag."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Major.minor come from package.json, the patch is this workflow's run
      # number: monotonic, unique per run, and nothing is committed back.
      # Bumping major or minor in package.json is a normal commit.
      - name: Set version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          npm version --no-git-tag-version "$base.$GITHUB_RUN_NUMBER"

      # A re-run of an older workflow run would otherwise publish an older
      # build and move `latest` back onto it. `prepublishOnly` builds.
      - name: Publish
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          latest=$(npm view "$name" version 2>/dev/null || true)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n1)" != "$version" ]; then
            echo "::error::$name@$latest is already published and newer than $version -- not publishing."
            exit 1
          fi
          npm publish --provenance --access public
          echo "Published $name@$version" >> "$GITHUB_STEP_SUMMARY"
