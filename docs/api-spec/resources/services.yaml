openapi: 3.1.0
info:
  title: Productive.io API – Services
  version: 2.0.0
description: |-
  **Services** are line items on a deal or budget that define the scope, pricing, and tracking for a deliverable. Each service specifies a billing type (`fixed_fee`, `hourly`, or `days`), a budget amount, and links time tracking to invoicing.

  Services can have **per-person assignments** that restrict who can log time against them.
x-filters:
  service:
    after:
      description: 'Filter by a date range: return services bookable after this date.'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    before:
      description: 'Filter by a date range: return services bookable before this date.'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    billable:
      description: Filter by whether the service is billable (true) or non-billable (false).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    billable_time:
      description: Filter by total billable time logged against the service (in minutes).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    billing_type:
      description: Filter by billing type (hourly, fixed, non-billable, etc.).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookable_after:
      description: Filter services with a bookable start date after this value.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookable_before:
      description: Filter services with a bookable end date before this value.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookable_date:
      description: Filters services to those bookable on the specified date, based on the budget's active period. Services on deals are always included.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    booked_time:
      description: Filter by total booked time scheduled against the service (in minutes).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    booking_tracking_enabled:
      description: Filter by whether booking tracking is enabled on the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_cap_enabled:
      description: Filter by whether a budget cap is enabled on the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_date:
      description: Filter by the start date of the associated budget (quotes.date).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_id:
      description: Filter by the associated budget ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_remaining:
      description: Filter by remaining budget amount (budget total minus budget used) in the deal currency.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_status:
      description: Filter by budget status (open or delivered).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_total:
      description: Filter by total budget amount range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_used:
      description: Filter by amount of budget already used.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budgeted_time:
      description: Filter by the service's budgeted time (in minutes).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budgets_and_deals:
      description: Filter services linked to a specific set of budgets and deals.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by client company.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    contract_id:
      description: Filter by the associated contract ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    cost:
      description: Filter by work cost (labor cost) range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_fields:
      description: Filter by custom field values.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      description: Filter by the associated deal or budget.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_stage_id:
      description: Filter by deal stage (deprecated; use deal_status_id instead).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_status_id:
      description: Filter by the associated deal status (pipeline stage).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    discount:
      description: Filter by the service's discount percentage range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    discount_amount:
      description: Filter by discount amount (monetary).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    estimated_cost:
      description: Filter by estimated cost range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    estimated_time:
      description: Filter by estimated time range (in minutes).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    expense_cost:
      description: Filter by total expense cost range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    expense_tracking_enabled:
      description: Filter by whether expense tracking is enabled on the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    for_tracking:
      description: Filter to services that the current person is allowed to track time against.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    future_booked_time:
      description: Filter by total future booked time (upcoming bookings) in minutes.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    future_budget_used:
      description: Filter by the amount of budget that will be consumed by future bookings.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by service ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    initial_service_id:
      description: Filter by the original service this service was derived from (across contract periods).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    left_to_schedule_time:
      description: Filter by time remaining to schedule (estimated time minus booked time) in minutes.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    limitation_type:
      description: Filter by limitation type (none, time, budget, etc.) applied to the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    markup:
      description: Filter by the service's markup percentage range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    markup_amount:
      description: Filter by markup amount (monetary).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by service name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    origin_deal_id:
      description: Filter by the deal this service's budget originated from.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    origin_service_id:
      description: Filter by the service this service was copied or derived from.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter to services accessible to the specified person for time tracking.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    pipeline_id:
      description: Filter by the associated pipeline.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    price:
      description: Filter by service price range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    probability:
      description: Filter by the associated deal's probability of closing (as a percentage).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    profit:
      description: Filter by profit (revenue minus cost) range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    profit_margin:
      description: Filter by profit margin percentage range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_type:
      description: Filter by project type (deal or budget).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    projected_revenue:
      description: Filter by projected revenue range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    projectless_budgets:
      description: When true, includes services from budgets not linked to any project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    quantity:
      description: Filter by service quantity range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Full-text search across service names and descriptions.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    remaining_scheduled_time:
      description: Filter by remaining scheduled time (budgeted minus worked minus future booked) in minutes.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    responsible_id:
      description: Filter by the responsible person on the associated deal or budget.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    revamped_unit:
      description: Filter by unit type (revamped unit dimension) for the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    revenue:
      description: Filter by recognized revenue range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    rolled_over_time:
      description: Filter by rolled-over time (time carried over from previous periods) in minutes.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    sales_status_id:
      description: Filter by sales pipeline stage status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    section_id:
      description: Filter by the section (group of services) within the deal or budget.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_type_id:
      description: Filter by the associated service type.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    stage_status_id:
      description: Filter by budget pipeline stage status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    stage_type:
      description: Filter by deal stage type (e.g. open, won, lost).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter by the associated subsidiary.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      description: Filter by the associated task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    template:
      description: Filter template services.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    time_tracking_enabled:
      description: Filter by whether time tracking is enabled on the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    trackable_by_person_id:
      description: Filter to services that the specified person has permission to track time on.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    type:
      description: Filter by service parent type (deal or budget).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    unapproved_time:
      description: Filter by total unapproved time (in minutes) logged against the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    unit:
      description: Filter by service unit type (e.g. hours, days, items).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updated_at:
      description: Filter by service last-updated date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    with_memberships:
      description: When true, includes membership data with the service results (internal use).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    worked_cost:
      description: Filter by worked cost (cost of time already logged) range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    worked_time:
      description: Filter by total worked time logged against the service (in minutes).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookable_date_for_period:
      description: '**Deprecated — use `bookable_date` instead**, which now returns identical results. Filters services to those bookable on the specified date, based on the budget''s active period. This filter will be removed in a future API version.'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    explicit_access:
      description: Filter services to only those the current user has explicit (non-implicit) access permissions on.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    overtime_time:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/services:
    get:
      tags:
        - Services
      summary: Get services
      operationId: services-index
      description: List services with optional filters and pagination.
      parameters:
        - $ref: '#/components/parameters/filter_service'
        - $ref: '#/components/parameters/sort_service'
        - $ref: '#/components/parameters/changed_since'
      responses:
        '200':
          $ref: '#/components/responses/collection_service'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Services
      summary: Create a service
      operationId: services-create
      description: Create a new service on a deal.
      requestBody:
        $ref: '#/components/requestBodies/service'
      responses:
        '201':
          $ref: '#/components/responses/single_service'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/services/{id}:
    get:
      tags:
        - Services
      summary: Gets a service
      operationId: services-show
      description: Retrieve a single service by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the service.
      responses:
        '200':
          $ref: '#/components/responses/single_service'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Services
      summary: Update a service
      operationId: services-update
      description: Update a service.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the service.
      requestBody:
        $ref: '#/components/requestBodies/service'
      responses:
        '200':
          $ref: '#/components/responses/single_service'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Services
      summary: Deletes a service
      operationId: services-destroy
      description: Delete a service.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the service.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/services/{id}/move:
    patch:
      tags:
        - Services
      summary: Move a service
      description: Moves the service, with its expenses, to another deal or budget.
      operationId: services-move-move
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        $ref: '#/components/requestBodies/service_move'
      responses:
        '200':
          $ref: '#/components/responses/single_service'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_service'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content_service:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_service'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                      properties:
                        bulk_index:
                          type: integer
                          title: Bulk Index
                          description: The position in the request's `data` array of the entry the error belongs to; only bulk requests set it.
                        id:
                          type:
                            - string
                            - 'null'
                          title: Id
                          description: The id of the service the error belongs to; null for a service being created.
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
