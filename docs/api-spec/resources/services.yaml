openapi: 3.1.0
info:
  title: Productive.io API – Services
  version: 2.0.0
description: |-
  **Services** are line items on a deal or budget that define the scope, pricing, and tracking for a deliverable. Each service specifies a billing type (`fixed_fee`, `hourly`, or `days`), a budget amount, and links time tracking to invoicing.

  Services can have **per-person assignments** that restrict who can log time against them.
x-filters:
  service:
    person_id:
      description: Filter to services accessible to the specified person for time tracking.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_type:
      description: Filter by project type (deal or budget).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    unit:
      description: Filter by service unit type (e.g. hours, days, items).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookable_date:
      description: Filters services to those bookable on the specified date, based on the budget's active period. Services on deals are always included.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    origin_deal_id:
      description: Filter by the deal this service's budget originated from.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    explicit_access:
      description: Filter services to only those the current user has explicit (non-implicit) access permissions on.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    before:
      description: 'Filter by a date range: return services bookable before this date.'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by client company.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Full-text search across service names and descriptions.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    revamped_unit:
      description: Filter by unit type (revamped unit dimension) for the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_cap_enabled:
      description: Filter by whether a budget cap is enabled on the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    pipeline_id:
      description: Filter by the associated pipeline.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    billable_time:
      description: Filter by total billable time logged against the service (in minutes).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      description: Filter by the associated deal or budget.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    stage_status_id:
      description: Filter by budget pipeline stage status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    future_budget_used:
      description: Filter by the amount of budget that will be consumed by future bookings.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    profit:
      description: Filter by profit (revenue minus cost) range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    unapproved_time:
      description: Filter by total unapproved time (in minutes) logged against the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_stage_id:
      description: Filter by deal stage (deprecated; use deal_status_id instead).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    limitation_type:
      description: Filter by limitation type (none, time, budget, etc.) applied to the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_used:
      description: Filter by amount of budget already used.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    responsible_id:
      description: Filter by the responsible person on the associated deal or budget.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_fields:
      description: Filter by custom field values.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budgets_and_deals:
      description: Filter services linked to a specific set of budgets and deals.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    discount_amount:
      description: Filter by discount amount (monetary).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    estimated_time:
      description: Filter by estimated time range (in minutes).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    booking_tracking_enabled:
      description: Filter by whether booking tracking is enabled on the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updated_at:
      description: Filter by service last-updated date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    remaining_scheduled_time:
      description: Filter by remaining scheduled time (budgeted minus worked minus future booked) in minutes.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    for_tracking:
      description: Filter to services that the current person is allowed to track time against.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    template:
      description: Filter template services.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    trackable_by_person_id:
      description: Filter to services that the specified person has permission to track time on.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    section_id:
      description: Filter by the section (group of services) within the deal or budget.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    projectless_budgets:
      description: When true, includes services from budgets not linked to any project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_status:
      description: Filter by budget status (open or delivered).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    markup_amount:
      description: Filter by markup amount (monetary).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    future_booked_time:
      description: Filter by total future booked time (upcoming bookings) in minutes.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    sales_status_id:
      description: Filter by sales pipeline stage status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_type_id:
      description: Filter by the associated service type.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_remaining:
      description: Filter by remaining budget amount (budget total minus budget used) in the deal currency.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    probability:
      description: Filter by the associated deal's probability of closing (as a percentage).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    estimated_cost:
      description: Filter by estimated cost range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by service name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    worked_cost:
      description: Filter by worked cost (cost of time already logged) range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budgeted_time:
      description: Filter by the service's budgeted time (in minutes).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    billable:
      description: Filter by whether the service is billable (true) or non-billable (false).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_total:
      description: Filter by total budget amount range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    markup:
      description: Filter by the service's markup percentage range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookable_before:
      description: Filter services with a bookable end date before this value.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    initial_service_id:
      description: Filter by the original service this service was derived from (across contract periods).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    revenue:
      description: Filter by recognized revenue range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    cost:
      description: Filter by work cost (labor cost) range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    rolled_over_time:
      description: Filter by rolled-over time (time carried over from previous periods) in minutes.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    expense_cost:
      description: Filter by total expense cost range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by service ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookable_after:
      description: Filter services with a bookable start date after this value.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    billing_type:
      description: Filter by billing type (hourly, fixed, non-billable, etc.).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_date:
      description: Filter by the start date of the associated budget (quotes.date).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_status_id:
      description: Filter by the associated deal status (pipeline stage).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_id:
      description: Filter by the associated budget ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    with_memberships:
      description: When true, includes membership data with the service results (internal use).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    projected_revenue:
      description: Filter by projected revenue range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    quantity:
      description: Filter by service quantity range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    stage_type:
      description: Filter by deal stage type (e.g. open, won, lost).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter by the associated subsidiary.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    worked_time:
      description: Filter by total worked time logged against the service (in minutes).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    origin_service_id:
      description: Filter by the service this service was copied or derived from.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    profit_margin:
      description: Filter by profit margin percentage range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    expense_tracking_enabled:
      description: Filter by whether expense tracking is enabled on the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookable_date_for_period:
      description: '**Deprecated — use `bookable_date` instead**, which now returns identical results. Filters services to those bookable on the specified date, based on the budget''s active period. This filter will be removed in a future API version.'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    booked_time:
      description: Filter by total booked time scheduled against the service (in minutes).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    contract_id:
      description: Filter by the associated contract ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    after:
      description: 'Filter by a date range: return services bookable after this date.'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    left_to_schedule_time:
      description: Filter by time remaining to schedule (estimated time minus booked time) in minutes.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    time_tracking_enabled:
      description: Filter by whether time tracking is enabled on the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    price:
      description: Filter by service price range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    discount:
      description: Filter by the service's discount percentage range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    type:
      description: Filter by service parent type (deal or budget).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      description: Filter by the associated task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/services:
    get:
      tags:
        - Services
      summary: Get services
      responses:
        '200':
          $ref: '#/components/responses/collection_service'
      parameters:
        - $ref: '#/components/parameters/sort_service'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_service'
      operationId: services-index
      description: List services with optional filters and pagination.
    post:
      tags:
        - Services
      summary: Create a service
      responses:
        '201':
          $ref: '#/components/responses/single_service'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: services-create
      requestBody:
        $ref: '#/components/requestBodies/service'
      description: Create a new service on a deal.
  /api/v2/services/{id}:
    get:
      tags:
        - Services
      summary: Gets a service
      responses:
        '200':
          $ref: '#/components/responses/single_service'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the service.
        - $ref: '#/components/parameters/header_organization'
      operationId: services-show
      description: Retrieve a single service by ID.
    patch:
      tags:
        - Services
      summary: Update a service
      responses:
        '200':
          $ref: '#/components/responses/single_service'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the service.
        - $ref: '#/components/parameters/header_organization'
      operationId: services-update
      requestBody:
        $ref: '#/components/requestBodies/service'
      description: Update a service.
    delete:
      tags:
        - Services
      summary: Deletes a service
      responses:
        '204':
          description: No Content
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the service.
        - $ref: '#/components/parameters/header_organization'
      operationId: services-destroy
      description: Delete a service.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_service:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.service at the top of this file.
      required: false
      description: Filter parameter for querying services.
    sort_service:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - budget
            - -budget
            - company
            - -company
            - custom_fields
            - -custom_fields
            - name
            - -name
            - project_name
            - -project_name
          type: string
        title: Sort service
      explode: false
      required: false
      description: Sort order for service list results. Accepts one or more field names, comma-separated; prefix with `-` for descending. --branch descriptions
  requestBodies:
    service:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - name
                      - deal_id
                      - limitation_type
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_service/properties/name'
                      price:
                        $ref: '#/components/schemas/resource_service/properties/price'
                      markup:
                        $ref: '#/components/schemas/resource_service/properties/markup'
                      deal_id:
                        $ref: '#/components/schemas/resource_service/properties/deal_id'
                      unit_id:
                        $ref: '#/components/schemas/resource_service/properties/unit_id'
                      discount:
                        $ref: '#/components/schemas/resource_service/properties/discount'
                      position:
                        $ref: '#/components/schemas/resource_service/properties/position'
                      quantity:
                        $ref: '#/components/schemas/resource_service/properties/quantity'
                      person_id:
                        $ref: '#/components/schemas/resource_service/properties/person_id'
                      section_id:
                        $ref: '#/components/schemas/resource_service/properties/section_id'
                      custom_fields:
                        $ref: '#/components/schemas/resource_service/properties/custom_fields'
                      editor_config:
                        $ref: '#/components/schemas/resource_service/properties/editor_config'
                      estimated_cost:
                        $ref: '#/components/schemas/resource_service/properties/estimated_cost'
                      estimated_time:
                        $ref: '#/components/schemas/resource_service/properties/estimated_time'
                      billing_type_id:
                        $ref: '#/components/schemas/resource_service/properties/billing_type_id'
                      limitation_type:
                        $ref: '#/components/schemas/resource_service/properties/limitation_type'
                      service_type_id:
                        $ref: '#/components/schemas/resource_service/properties/service_type_id'
                      rolled_over_time:
                        $ref: '#/components/schemas/resource_service/properties/rolled_over_time'
                      budget_cap_enabled:
                        $ref: '#/components/schemas/resource_service/properties/budget_cap_enabled'
                      time_tracking_enabled:
                        $ref: '#/components/schemas/resource_service/properties/time_tracking_enabled'
                      booking_tracking_enabled:
                        $ref: '#/components/schemas/resource_service/properties/booking_tracking_enabled'
                      expense_tracking_enabled:
                        $ref: '#/components/schemas/resource_service/properties/expense_tracking_enabled'
      description: Request body for creating or updating a service.
  schemas:
    resource_service:
      type: object
      title: Service Resource
      properties:
        work_cost:
          title: Work Cost
          description: Labor cost from tracked time.
          example:
            eq: value
        expense_billable_amount_default:
          title: Expense Billable Amount Default
          description: Billable portion of expenses in the organization's default currency.
          example:
            gt: 0
        projectless_budgets:
          type: boolean
          title: Projectless Budgets
          description: Whether this service belongs to a budget without a linked project.
          example:
            gt: 0
        section_id:
          type: integer
          title: Section
          description: The section grouping this service within the deal.
          example:
            - 123
        budget_used:
          title: Budget Used
          description: Budget consumed so far.
          example:
            gt: 0
        for_tracking:
          type: boolean
          title: For Tracking
          description: Whether this service is available for time tracking.
          example:
            eq: value
        probability:
          type: integer
          title: Probability
          description: Win probability of the parent deal (percentage).
          example:
            eq: value
        bookable_before:
          type: string
          title: Bookable Before
          format: date
          description: End date until which resource bookings are allowed.
          example:
            eq: value
        expense_amount:
          title: Expense Amount
          description: Total expense amount on this service.
          example:
            gt: 0
        bookable_date:
          type: string
          title: Bookable Date
          format: date
          description: Filters services to those bookable on the specified date, based on the budget's active period. Services on deals are always included.
          example:
            gt: '2026-01-01'
        company_id:
          type: integer
          title: Company
          description: The company (client) linked to the deal this service is on.
          example:
            - 123
        deleted_at:
          type: string
          title: Deleted At
          format: date-time
          description: Soft-deletion timestamp.
          example:
            gt: '2026-01-01'
        left_to_schedule_time:
          type: integer
          title: Left To Schedule Time
          description: Time remaining to be scheduled on this service.
          example:
            gt: 0
        budget_cap_enabled:
          type: boolean
          title: Budget Cap Enabled
          description: Whether a hard budget cap prevents tracking beyond the budget total.
          example:
            gt: 0
        rolled_over_time:
          type: integer
          title: Rolled Over Time
          description: Time rolled over from a previous retainer period.
          example:
            gt: 0
        before:
          type: string
          title: Before
          format: date
          description: Latest bookable date for this service.
          example:
            eq: value
        deal:
          title: Deal
          description: The deal or budget this service is part of.
          example:
            eq: value
        sales_status_id:
          enum:
            - 1
            - 2
            - 3
            - 4
          type: integer
          title: Sales Status
          description: The sales status ID of the parent deal.
          example:
            - 123
        projected_revenue_default:
          title: Projected Revenue Default
          description: Expected revenue including future scheduled work in the organization's default currency.
          example:
            eq: value
        time_tracking_enabled:
          type: boolean
          title: Time Tracking Enabled
          description: Whether team members can track time against this service.
          example:
            gt: 0
        future_revenue_default:
          title: Future Revenue Default
          description: Revenue projected from future bookings in the organization's default currency.
          example:
            eq: value
        task_id:
          type: integer
          title: Task
          description: The task this service is linked to.
          example:
            - 123
        budgeted_time:
          type: integer
          title: Budgeted Time
          description: Budgeted hours allocated for this service.
          example:
            gt: 0
        projected_revenue:
          title: Projected Revenue
          description: Expected revenue including future scheduled work.
          example:
            eq: value
        currency_default:
          title: Currency Default
          description: Currency code in the organization's default currency.
          example:
            eq: value
        markup_amount:
          title: Markup Amount
          description: Total markup in monetary terms.
          example:
            gt: 0
        budget_used_default:
          title: Budget Used Default
          description: Budget consumed so far in the organization's default currency.
          example:
            gt: 0
        unapproved_time:
          type: integer
          title: Unapproved Time
          description: Total unapproved time entries in minutes.
          example:
            gt: 0
        budget_total:
          title: Budget Total
          description: Total budget for this service.
          example:
            gt: 0
        person:
          title: Person
          description: The person assigned to this service (for person-scoped services).
          example:
            eq: value
        budget_id:
          type: integer
          title: Budget
          description: The ID of the budget this service belongs to.
          example:
            - 123
        budget_remaining:
          type: integer
          title: Budget Remaining
          description: Budget amount remaining unused.
          example:
            gt: 0
        id:
          type: integer
          title: Id
          description: Unique identifier of the service.
          example:
            - 123
        projected_revenue_normalized:
          title: Projected Revenue Normalized
          description: Expected revenue including future scheduled work in the organization's normalized currency.
          example:
            eq: value
        expense_amount_normalized:
          title: Expense Amount Normalized
          description: Total expense amount on this service in the organization's normalized currency.
          example:
            gt: 0
        deal_stage_id:
          type: integer
