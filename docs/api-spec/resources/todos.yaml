      example:
        type: tasks
        id: '42'
    resource_todo:
      type: object
      title: Todo Resource
      description: Checklist item on a task or deal. Supports description, assignee, due date (with optional time), position ordering, and completion tracking via closed_at timestamp.
      properties:
        assignee:
          title: Assignee
          description: The person assigned to complete this checklist item.
          example:
            eq: value
        assignee_id:
          type: integer
          title: Assignee
          description: The ID of the person assigned to complete this checklist item.
          example:
            - 123
        closed:
          type: boolean
          title: Closed
          description: Indicates whether this checklist item has been completed.
          example: true
        closed_at:
          type: string
          title: Closed At
          format: date-time
          description: Timestamp when this checklist item was completed, or null if still open.
          example:
            gt: '2026-01-01'
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this checklist item was created.
          example:
            gt: '2026-01-01'
        deal:
          title: Deal
          description: The deal this checklist item belongs to, if attached to a deal.
          example:
            eq: value
        deal_id:
          type: integer
          title: Deal
          description: The ID of the deal this checklist item belongs to, if applicable.
          example:
            - 123
        due_date:
          type: string
          title: Due Date
          format: date
          description: The due date for completing this checklist item.
          example:
            gt: '2026-01-01'
        due_time:
          type: string
          title: Due Time
          format: time
          description: The specific time of day the checklist item is due.
          example:
            gt: 0
        id:
          type: integer
          title: Id
          description: Unique identifier for the checklist item.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this checklist item belongs to.
          example:
            eq: value
        position:
          type: integer
          title: Position
          description: The display order of this todo within its parent list.
          example:
            eq: value
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
          description: 'Filter by todo status: 1 = open, 2 = closed.'
          example:
            eq: active
        task:
          title: Task
          description: The task this todo belongs to.
          example:
            eq: value
        task_id:
          type: integer
          title: Task
          description: ID of the task this todo belongs to.
          example:
            - 123
        todoable_type:
          type: string
          title: Todoable Type
          description: The type of the parent resource this todo is attached to (task or deal).
          example:
            eq: active
        description:
          type: string
          title: Description
          description: Text of the todo — the content of the checklist item.
      example:
        id: '24747'
        type: todos
        attributes:
          description: Write unit tests for authentication module
          closed: false
          closed_at: null
          due_date: '2026-03-20'
          due_time: null
          created_at: '2026-03-01T10:00:00.000+00:00'
          todoable_type: task
          position: 1
        relationships:
          assignee:
            data:
              type: people
              id: '12'
          task:
            data:
              type: tasks
              id: '120501'
          deal:
            data: null
  requestBodies:
    todo_update:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a todo.
            properties:
              data:
                type: object
                description: The JSON:API data object containing the todo resource attributes and relationships.
                properties:
                  attributes:
                    type: object
                    description: Todo attributes.
                    properties:
                      assignee_id:
                        $ref: '#/components/schemas/resource_todo/properties/assignee_id'
                      closed:
                        $ref: '#/components/schemas/resource_todo/properties/closed'
                      deal_id:
                        $ref: '#/components/schemas/resource_todo/properties/deal_id'
                      description:
                        $ref: '#/components/schemas/resource_todo/properties/description'
                      due_date:
                        $ref: '#/components/schemas/resource_todo/properties/due_date'
                      position:
                        $ref: '#/components/schemas/resource_todo/properties/position'
                      task_id:
                        $ref: '#/components/schemas/resource_todo/properties/task_id'
                    example:
                      closed: true
                example:
                  type: todos
                  attributes:
                    closed: true
            example:
              data:
                type: todos
                attributes:
                  closed: true
      description: Request body for creating or updating a todo (checklist item). Specify the description, parent resource (task or deal), optional assignee, due date, due time, and position. Set closed_at to mark as complete.
    todo:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a todo.
            properties:
              data:
                type: object
                description: The JSON:API data object containing the todo resource attributes and relationships.
                properties:
                  attributes:
                    type: object
                    description: Todo attributes.
                    properties:
                      assignee_id:
                        $ref: '#/components/schemas/resource_todo/properties/assignee_id'
                      closed:
                        $ref: '#/components/schemas/resource_todo/properties/closed'
                      deal_id:
                        $ref: '#/components/schemas/resource_todo/properties/deal_id'
                      due_date:
                        $ref: '#/components/schemas/resource_todo/properties/due_date'
                      position:
                        $ref: '#/components/schemas/resource_todo/properties/position'
                      task_id:
                        $ref: '#/components/schemas/resource_todo/properties/task_id'
                      description:
                        $ref: '#/components/schemas/resource_todo/properties/description'
                    required:
                      - description
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: todos
                attributes:
                  description: Write unit tests for authentication module
                  due_date: '2026-03-20'
                relationships:
                  task:
                    data:
                      type: tasks
                      id: '120501'
                  assignee:
                    data:
                      type: people
                      id: '12'
      description: Request body for creating or updating a todo (checklist item). Specify the description, parent resource (task or deal), optional assignee, due date, due time, and position. Set closed_at to mark as complete.
