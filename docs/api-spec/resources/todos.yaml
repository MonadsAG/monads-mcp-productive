    single_todo:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single todo record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned todo resource.
                properties:
                  attributes:
                    type: object
                    description: Todo attributes.
                    properties:
                      closed:
                        $ref: '#/components/schemas/resource_todo/properties/closed'
                      closed_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_todo/properties/closed_at'
                          - type: 'null'
                        description: The timestamp when this todo was completed.
                      created_at:
                        $ref: '#/components/schemas/resource_todo/properties/created_at'
                      due_date:
                        anyOf:
                          - $ref: '#/components/schemas/resource_todo/properties/due_date'
                          - type: 'null'
                        description: The due date for this todo.
                      due_time:
                        anyOf:
                          - type: string
                            title: Due Time
                            pattern: ^\d{2}:\d{2}$
                            description: The time of day the todo is due, as `HH:MM`.
                          - type: 'null'
                        description: The due time for this todo.
                      position:
                        $ref: '#/components/schemas/resource_todo/properties/position'
                      todoable_type:
                        $ref: '#/components/schemas/resource_todo/properties/todoable_type'
                      description:
                        $ref: '#/components/schemas/resource_todo/properties/description'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Todo relationships.
                    properties:
                      assignee:
                        $ref: '#/components/schemas/_single_relationship'
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      task:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '24747'
                type: todos
                attributes:
                  description: Write unit tests for authentication module
                  closed: false
                  closed_at: null
                  due_date: '2026-03-20'
                  due_time: null
                  created_at: '2026-03-01T10:00:00.000+00:00'
                  todoable_type: task
                  position: 1
                relationships:
                  assignee:
                    data:
                      type: people
                      id: '12'
                  task:
                    data:
                      type: tasks
                      id: '120501'
                  deal:
                    data: null
              included: []
      description: Single todo
    collection_todo:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of todo records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A todo resource object.
                  properties:
                    attributes:
                      type: object
                      description: Todo attributes.
                      properties:
                        closed:
                          $ref: '#/components/schemas/resource_todo/properties/closed'
                        closed_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_todo/properties/closed_at'
                            - type: 'null'
                          description: Timestamp when this todo was completed.
                        created_at:
                          $ref: '#/components/schemas/resource_todo/properties/created_at'
                        due_date:
                          anyOf:
                            - $ref: '#/components/schemas/resource_todo/properties/due_date'
                            - type: 'null'
                          description: The due date for this todo.
                        due_time:
                          anyOf:
                            - type: string
                              title: Due Time
                              pattern: ^\d{2}:\d{2}$
                              description: The time of day the todo is due, as `HH:MM`.
                            - type: 'null'
                          description: The time of day this todo is due.
                        position:
                          $ref: '#/components/schemas/resource_todo/properties/position'
                        todoable_type:
                          $ref: '#/components/schemas/resource_todo/properties/todoable_type'
                        description:
                          $ref: '#/components/schemas/resource_todo/properties/description'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Todo relationships.
                      properties:
                        assignee:
                          $ref: '#/components/schemas/_single_relationship'
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        task:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of todo resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '24747'
                  type: todos
                  attributes:
                    description: Write unit tests for authentication module
                    closed: false
                    closed_at: null
                    due_date: '2026-03-20'
                    due_time: null
                    created_at: '2026-03-01T10:00:00.000+00:00'
                    todoable_type: task
                    position: 1
                  relationships:
                    assignee:
                      data:
                        type: people
                        id: '12'
                    task:
                      data:
                        type: tasks
                        id: '120501'
                    deal:
                      data: null
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection todo
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_not_acceptable:
      enum:
        - bulk_extensions_headers_invalid
        - not_acceptable
        - read_only_mode_violation
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 406.
    error_code_not_found:
      enum:
        - not_found
        - record_not_found
        - route_not_found
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 404.
    error_code_forbidden:
      enum:
        - access_denied
        - account_inactive
        - agent_role_impersonation_denied
        - automatic_invoicing_not_manageable
        - billing_catalog_list_unavailable
        - booking_conflict_resolver_unavailable
        - budget_inaccessible
        - budgets_not_manageable
        - cascade_deletion_blocked
        - custom_roles_unavailable
        - deactivated_organization
        - deal_proposal_analytics_unavailable
        - deal_proposal_public_link_unavailable
        - document_styler_unavailable
        - document_templates_unavailable
        - email_inbox_unavailable
        - entry_not_editable
        - expense_not_editable
        - feature_unavailable
        - finalized_invoice_permission
        - financials_unavailable
        - impersonation_on_account_not_allowed
        - insufficient_automation_permission
        - insufficient_project_access
        - insufficient_seats
        - invalid_impersonate_role_id_header
        - invoices_unavailable
        - login_unavailable
        - mcp_access_disabled
        - mcp_connectors_disabled
        - mcp_provider_unavailable
        - missing_slack_integration
        - no_client_access
        - no_organization_id
        - no_person
        - no_sandbox_access
        - organization_red_flagged
        - other_timer_running
        - outgoing_emails_limit_exceeded
        - payment_reminders_unavailable
        - personal_access_token_limit_exceeded
        - pipelines_limit_exceeded
        - placeholders_limit_exceeded
        - plan_limit_exceeded
        - plan_unavailable
        - private_channel_forbidden
        - recipients_limit_exceeded
        - record_not_owned
