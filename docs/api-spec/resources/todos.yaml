openapi: 3.1.0
info:
  title: Productive.io API – Todos
  version: 2.0.0
description: |-
  A to-do is a component of a task that requires completion and can be assigned to an individual. 

  Once to-do is assigned, task appears in the assignee's list of assigned tasks. 

  There's no cap on the number of to-dos a single task can include. 

  To-dos can be either open or closed.

  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  project: Project
  folder: Folder
  task_list: Task list
  task: Task
  comments: Comments
  subtasks: Subtasks
  todos: Todos  {
    class: primary
  }

  # define connections
  project -> folder -> task_list -> task
  task -> comments
  task -> subtasks
  task -> todos
  ```

  You can find out more about To-dos in our [Help documentation] (https://help.productive.io/en/articles/4097412-task-to-do)
x-filters:
  todo:
    assignee_id:
      description: Filter by the assigned person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      description: Filter by the associated deal.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    due_date:
      description: Filter by due date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by todo ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by completion status (open or closed).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      description: Filter by the associated task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    todoable_type:
      description: Filter by the type of parent resource the todo belongs to (task or deal).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/todos:
    get:
      tags:
        - Todos
      summary: Get todos
      operationId: todos-index
      description: Returns a paginated list of todos — checklist items attached to tasks or deals. Supports filtering by assignee, due date, task, deal, todoable type, and status (open/closed).
      parameters:
        - $ref: '#/components/parameters/filter_todo'
        - $ref: '#/components/parameters/sort_todo'
      responses:
        '200':
          $ref: '#/components/responses/collection_todo'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Todos
      summary: Create a todo
      operationId: todos-create
      description: |-
        Creates a todo on either a task or a deal — provide the `description` and one of `task_id` or `deal_id`. Optionally set `assignee_id` and `closed`.

        `due_date` applies only to **deal todos**.

        ### Task todo
        ```json
        {
          "data": {
            "type": "todos",
            "attributes": {
              "description": "Review the design draft",
              "task_id": 4421188,
              "assignee_id": 314
            }
          }
        }
        ```

        ### Deal todo
        ```json
        {
          "data": {
            "type": "todos",
            "attributes": {
              "description": "Follow up on contract terms",
              "deal_id": 88401,
              "assignee_id": 314,
              "due_date": "2026-06-01"
            }
          }
        }
        ```
      requestBody:
        $ref: '#/components/requestBodies/todo'
      responses:
        '201':
          $ref: '#/components/responses/single_todo'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/todos/{id}:
    get:
      tags:
        - Todos
      summary: Gets a todo
      operationId: todos-show
      description: Returns a single todo by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_todo'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Todos
      summary: Update a todo
      operationId: todos-update
      description: Updates a todo. Only the provided attributes are modified — typically to toggle `closed`, change the `assignee_id`, or adjust the `description` or `due_date`.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/todo_update'
      responses:
        '200':
          $ref: '#/components/responses/single_todo'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Todos
      summary: Deletes a todo
      operationId: todos-destroy
      description: Deletes a todo.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
