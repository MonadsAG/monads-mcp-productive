openapi: 3.1.0
info:
  title: Productive.io API – Todos
  version: 2.0.0
description: |-
  A to-do is a component of a task that requires completion and can be assigned to an individual. 

  Once to-do is assigned, task appears in the assignee's list of assigned tasks. 

  There's no cap on the number of to-dos a single task can include. 

  To-dos can be either open or closed.

  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  project: Project
  folder: Folder
  task_list: Task list
  task: Task
  comments: Comments
  subtasks: Subtasks
  todos: Todos  {
    class: primary
  }

  # define connections
  project -> folder -> task_list -> task
  task -> comments
  task -> subtasks
  task -> todos
  ```

  You can find out more about To-dos in our [Help documentation] (https://help.productive.io/en/articles/4097412-task-to-do)
x-filters:
  todo:
    task_id:
      description: Filter by the associated task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    assignee_id:
      description: Filter by the assigned person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by todo ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    due_date:
      description: Filter by due date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by completion status (open or closed).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      description: Filter by the associated deal.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    todoable_type:
      description: Filter by the type of parent resource the todo belongs to (task or deal).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/todos:
    get:
      tags:
        - Todos
      summary: Get todos
      operationId: todos-index
      description: Returns a paginated list of todos — checklist items attached to tasks or deals. Supports filtering by assignee, due date, task, deal, todoable type, and status (open/closed).
      parameters:
        - $ref: '#/components/parameters/filter_todo'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_todo'
      responses:
        '200':
          $ref: '#/components/responses/collection_todo'
    post:
      tags:
        - Todos
      summary: Create a todo
      operationId: todos-create
      description: |-
        Creates a todo on either a task or a deal — provide the `description` and one of `task_id` or `deal_id`. Optionally set `assignee_id` and `closed`.

        `due_date` applies only to **deal todos**.

        ### Task todo
        ```json
        {
          "data": {
            "type": "todos",
            "attributes": {
              "description": "Review the design draft",
              "task_id": 4421188,
              "assignee_id": 314
            }
          }
        }
        ```

        ### Deal todo
        ```json
        {
          "data": {
            "type": "todos",
            "attributes": {
              "description": "Follow up on contract terms",
              "deal_id": 88401,
              "assignee_id": 314,
              "due_date": "2026-06-01"
            }
          }
        }
        ```
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/todo'
      responses:
        '201':
          $ref: '#/components/responses/single_todo'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/todos/{id}:
    get:
      tags:
        - Todos
      summary: Gets a todo
      operationId: todos-show
      description: Returns a single todo by ID.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_todo'
    patch:
      tags:
        - Todos
      summary: Update a todo
      operationId: todos-update
      description: Updates a todo. Only the provided attributes are modified — typically to toggle `closed`, change the `assignee_id`, or adjust the `description` or `due_date`.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/todo'
      responses:
        '200':
          $ref: '#/components/responses/single_todo'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
    delete:
      tags:
        - Todos
      summary: Deletes a todo
      operationId: todos-destroy
      description: Deletes a todo.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_todo:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort todo
      explode: false
      required: false
      description: Sort todo
    filter_todo:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.todo at the top of this file.
      required: false
      description: Filters
  responses:
    single_todo:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single todo record in JSON:API format.
            properties:
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              data:
                type: object
                description: The JSON:API data object for the returned todo resource.
                properties:
                  attributes:
                    type: object
                    description: Todo attributes.
                    properties:
                      created_at:
                        $ref: '#/components/schemas/resource_todo/properties/created_at'
                      due_date:
                        $ref: '#/components/schemas/resource_todo/properties/due_date'
                      position:
                        $ref: '#/components/schemas/resource_todo/properties/position'
                      due_time:
                        $ref: '#/components/schemas/resource_todo/properties/due_time'
                      closed_at:
                        $ref: '#/components/schemas/resource_todo/properties/closed_at'
                      closed:
                        $ref: '#/components/schemas/resource_todo/properties/closed'
                      description:
                        $ref: '#/components/schemas/resource_todo/properties/description'
                      todoable_type:
                        $ref: '#/components/schemas/resource_todo/properties/todoable_type'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Todo relationships.
                    properties:
                      assignee:
                        $ref: '#/components/schemas/_single_relationship'
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      task:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                id: '24747'
                type: todos
                attributes:
                  description: Write unit tests for authentication module
                  closed: false
                  closed_at: null
                  due_date: '2026-03-20'
                  due_time: null
                  created_at: '2026-03-01T10:00:00.000+00:00'
                  todoable_type: task
                  position: 1
                relationships:
                  assignee:
                    data:
                      type: people
                      id: '12'
                  task:
                    data:
                      type: tasks
                      id: '120501'
                  deal:
                    data: null
              included: []
      description: Single todo
    collection_todo:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of todo records in JSON:API format.
            properties:
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              data:
                type: array
                items:
                  type: object
                  description: A todo resource object.
                  properties:
                    attributes:
                      type: object
                      description: Todo attributes.
                      properties:
                        due_date:
                          $ref: '#/components/schemas/resource_todo/properties/due_date'
                        closed:
                          $ref: '#/components/schemas/resource_todo/properties/closed'
                        due_time:
                          $ref: '#/components/schemas/resource_todo/properties/due_time'
                        description:
                          $ref: '#/components/schemas/resource_todo/properties/description'
                        position:
                          $ref: '#/components/schemas/resource_todo/properties/position'
                        todoable_type:
                          $ref: '#/components/schemas/resource_todo/properties/todoable_type'
                        closed_at:
                          $ref: '#/components/schemas/resource_todo/properties/closed_at'
                        created_at:
                          $ref: '#/components/schemas/resource_todo/properties/created_at'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Todo relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        assignee:
                          $ref: '#/components/schemas/_single_relationship'
                        task:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of todo resource objects.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '24747'
                  type: todos
                  attributes:
                    description: Write unit tests for authentication module
                    closed: false
                    closed_at: null
                    due_date: '2026-03-20'
                    due_time: null
                    created_at: '2026-03-01T10:00:00.000+00:00'
                    todoable_type: task
                    position: 1
                  relationships:
                    assignee:
                      data:
                        type: people
                        id: '12'
                    task:
                      data:
                        type: tasks
                        id: '120501'
                    deal:
                      data: null
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection todo
  schemas:
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    resource_todo:
      type: object
      title: Todo Resource
      description: Checklist item on a task or deal. Supports description, assignee, due date (with optional time), position ordering, and completion tracking via closed_at timestamp.
      properties:
        position:
          type: integer
          title: Position
          description: The display order of this todo within its parent list.
          example:
            eq: value
        task:
          title: Task
          description: The task this todo belongs to.
          example:
            eq: value
        deal_id:
          type: integer
          title: Deal
          description: The ID of the deal this checklist item belongs to, if applicable.
          example:
            - 123
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this checklist item was created.
          example:
            gt: '2026-01-01'
        description:
          type: string
          title: Description
          description: Text of the todo — the content of the checklist item.
        id:
          type: integer
          title: Id
          description: Unique identifier for the checklist item.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this checklist item belongs to.
          example:
            eq: value
        assignee_id:
          type: integer
          title: Assignee
          description: The ID of the person assigned to complete this checklist item.
          example:
            - 123
        deal:
          title: Deal
          description: The deal this checklist item belongs to, if attached to a deal.
          example:
            eq: value
        assignee:
          title: Assignee
          description: The person assigned to complete this checklist item.
          example:
            eq: value
        due_time:
          type: string
          title: Due Time
          format: time
          description: The specific time of day the checklist item is due.
          example:
            gt: 0
        task_id:
          type: integer
          title: Task
          description: ID of the task this todo belongs to.
          example:
            - 123
        closed_at:
          type: string
          title: Closed At
          format: date-time
          description: Timestamp when this checklist item was completed, or null if still open.
          example:
            gt: '2026-01-01'
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
          description: 'Filter by todo status: 1 = open, 2 = closed.'
          example:
            eq: active
        closed:
          type: boolean
          title: Closed
          description: Indicates whether this checklist item has been completed.
          example: true
        todoable_type:
          type: string
          title: Todoable Type
          description: The type of the parent resource this todo is attached to (task or deal).
          example:
            eq: active
        due_date:
          type: string
          title: Due Date
          format: date
          description: The due date for completing this checklist item.
          example:
            gt: '2026-01-01'
      example:
        id: '24747'
        type: todos
        attributes:
          description: Write unit tests for authentication module
          closed: false
          closed_at: null
          due_date: '2026-03-20'
          due_time: null
          created_at: '2026-03-01T10:00:00.000+00:00'
          todoable_type: task
          position: 1
        relationships:
          assignee:
            data:
              type: people
              id: '12'
          task:
            data:
              type: tasks
              id: '120501'
          deal:
            data: null
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  requestBodies:
    todo:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a todo.
            properties:
              data:
                type: object
                description: The JSON:API data object containing the todo resource attributes and relationships.
                properties:
                  attributes:
                    type: object
                    description: Todo attributes.
                    properties:
                      due_date:
                        $ref: '#/components/schemas/resource_todo/properties/due_date'
                      position:
                        $ref: '#/components/schemas/resource_todo/properties/position'
                      deal_id:
                        $ref: '#/components/schemas/resource_todo/properties/deal_id'
                      closed:
                        $ref: '#/components/schemas/resource_todo/properties/closed'
                      task_id:
                        $ref: '#/components/schemas/resource_todo/properties/task_id'
                      description:
                        $ref: '#/components/schemas/resource_todo/properties/description'
                      assignee_id:
                        $ref: '#/components/schemas/resource_todo/properties/assignee_id'
                    required:
                      - description
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: todos
                attributes:
                  description: Write unit tests for authentication module
                  due_date: '2026-03-20'
                relationships:
                  task:
                    data:
                      type: tasks
                      id: '120501'
                  assignee:
                    data:
                      type: people
                      id: '12'
      description: Request body for creating or updating a todo (checklist item). Specify the description, parent resource (task or deal), optional assignee, due date, due time, and position. Set closed_at to mark as complete.
