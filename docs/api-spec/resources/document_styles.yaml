openapi: 3.1.0
info:
  title: Productive.io API – Document Styles
  version: 2.0.0
description: |-
  **Document styles** control the visual presentation of generated PDFs — fonts, colors, logos, and layout settings. They are applied to document types to produce consistently branded, client-facing documents.

  Update a style to propagate branding changes across all documents that reference it.
x-filters:
  document_style:
    id:
      description: Filter by document style ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by document style name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/document_styles/copy:
    post:
      tags:
        - Document Styles
      summary: Duplicates a document style
      operationId: document_styles-copy-copy
      description: Copy an existing document style.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_document_style'
        '201':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Created
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/document_styles:
    get:
      tags:
        - Document Styles
      summary: Get document_styles
      operationId: document_styles-index
      description: List document styles.
      parameters:
        - $ref: '#/components/parameters/filter_document_style'
        - $ref: '#/components/parameters/sort_document_style'
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/collection_document_style'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
    post:
      tags:
        - Document Styles
      summary: Create a document_style
      operationId: document_styles-create
      description: Create a new document style.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/document_style'
      responses:
        '201':
          $ref: '#/components/responses/single_document_style'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/document_styles/{id}:
    get:
      tags:
        - Document Styles
      summary: Gets a document_style
      operationId: document_styles-show
      description: Retrieve a single document style.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_document_style'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
    patch:
      tags:
        - Document Styles
      summary: Update a document_style
      operationId: document_styles-update
      description: Update a document style.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/document_style'
      responses:
        '200':
          $ref: '#/components/responses/single_document_style'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
    delete:
      tags:
        - Document Styles
      summary: Destroys a document style
      operationId: document_styles-destroy
      description: Delete a document style.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_document_style:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort document style
      explode: false
      required: false
      description: Sort document style
    filter_document_style:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.document_style at the top of this file.
      required: false
      description: Filters
  responses:
    single_document_style:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single document style record in JSON:API format.
            properties:
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              data:
                type: object
                description: The document style resource object.
                properties:
                  attributes:
                    type: object
                    description: Document style attributes.
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_document_style/properties/name'
                      styles:
                        $ref: '#/components/schemas/resource_document_style/properties/styles'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Document style relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      attachments:
                        $ref: '#/components/schemas/_collection_relationship'
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                id: '2'
                type: document_styles
                attributes:
                  name: Modern Blue
                  created_at: '2026-01-01T00:00:00.000+00:00'
                relationships: {}
              included: []
      description: Single document style
    collection_document_style:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of document style records in JSON:API format.
            properties:
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              data:
                type: array
                items:
                  type: object
                  description: A document style resource object.
                  properties:
                    relationships:
                      type: object
                      description: Document style relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        attachments:
                          $ref: '#/components/schemas/_collection_relationship'
                      example:
                        eq: value
                    attributes:
                      type: object
                      description: Document style attributes.
                      properties:
                        styles:
                          $ref: '#/components/schemas/resource_document_style/properties/styles'
                        name:
                          $ref: '#/components/schemas/resource_document_style/properties/name'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of document style resource objects.
                example:
                  eq: value
            example:
              data:
                - id: '2'
                  type: document_styles
                  attributes:
                    name: Modern Blue
                    created_at: '2026-01-01T00:00:00.000+00:00'
                  relationships: {}
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection document style
  schemas:
    _collection_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Collection data
          description: Included variant — related resource identifiers are present in `data`.
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          example:
            data:
              - type: tasks
                id: '42'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    resource_document_style:
      type: object
      title: Document style Resource
      description: A visual styling preset for documents such as proposals and contracts, containing CSS styles and branding assets.
      properties:
        id:
          type: integer
          title: Id
          description: The unique identifier of this document style.
          example:
            - 123
        styles:
          type: object
          title: Styles
          description: A JSON object containing the CSS and layout settings that define the visual appearance of documents using this style.
          example:
            eq: value
        attachment_ids:
          title: Attachment Ids
          description: IDs of attachments (e.g. logo images) associated with this document style.
          example:
            - 123
            - 456
        attachments:
          title: Attachments
          description: Attachments (e.g. logo images) used as branding assets for this document style.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this document style belongs to.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The display name of this document style.
          example:
            eq: value
      example:
        id: '2'
        type: document_styles
        attributes:
          name: Modern Blue
          created_at: '2026-01-01T00:00:00.000+00:00'
        relationships: {}
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  requestBodies:
    document_style:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a document style.
            properties:
              data:
                type: object
                description: The document style resource object.
                properties:
                  attributes:
                    type: object
                    description: Document style attributes.
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_document_style/properties/name'
                      styles:
                        $ref: '#/components/schemas/resource_document_style/properties/styles'
                      attachment_ids:
                        $ref: '#/components/schemas/resource_document_style/properties/attachment_ids'
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: document_styles
                attributes:
                  name: Modern Blue
      description: Request body for creating or updating a document style.
