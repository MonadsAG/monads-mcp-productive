openapi: 3.1.0
info:
  title: Productive.io API – Expense Line Items
  version: 2.0.0
x-filters:
  expense_line_item:
    id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    tax_rate_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    expense_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/expense_line_items:
    get:
      tags:
        - Expense Line Items
      summary: Get expense line items
      operationId: expense_line_items-index
      parameters:
        - $ref: '#/components/parameters/sort_expense_line_item'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_expense_line_item'
      responses:
        '200':
          $ref: '#/components/responses/collection_expense_line_item'
  /api/v2/expense_line_items/{id}:
    get:
      tags:
        - Expense Line Items
      summary: Gets an expense line item
      operationId: expense_line_items-show
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_expense_line_item'
components:
  responses:
    single_expense_line_item:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              included:
                type: array
                items: {}
                example: []
              data:
                type: object
                properties:
                  relationships:
                    type: object
                    properties:
                      tax_rate:
                        $ref: '#/components/schemas/_single_relationship'
                      expense:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      expense:
                        data:
                          type: expenses
                          id: '17'
                      tax_rate:
                        data:
                          type: tax_rates
                          id: '3'
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_expense_line_item/properties/name'
                      quantity:
                        $ref: '#/components/schemas/resource_expense_line_item/properties/quantity'
                      unit_price:
                        $ref: '#/components/schemas/resource_expense_line_item/properties/unit_price'
                      unit_price_normalized:
                        $ref: '#/components/schemas/resource_expense_line_item/properties/unit_price_normalized'
                      unit_price_default:
                        $ref: '#/components/schemas/resource_expense_line_item/properties/unit_price_default'
                    example:
                      name: AWS hosting
                      quantity: 2
                      unit_price: 15000
                      unit_price_default: 16500
                      unit_price_normalized: 16500
                      currency: EUR
                      currency_default: USD
                      currency_normalized: USD
                example:
                  id: '42'
                  type: expense_line_items
                  attributes:
                    name: AWS hosting
                    quantity: 2
                    unit_price: 15000
                    unit_price_default: 16500
                    unit_price_normalized: 16500
                    currency: EUR
                    currency_default: USD
                    currency_normalized: USD
                  relationships:
                    expense:
                      data:
                        type: expenses
                        id: '17'
                    tax_rate:
                      data:
                        type: tax_rates
                        id: '3'
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '42'
                type: expense_line_items
                attributes:
                  name: AWS hosting
                  quantity: 2
                  unit_price: 15000
                  unit_price_default: 16500
                  unit_price_normalized: 16500
                  currency: EUR
                  currency_default: USD
                  currency_normalized: USD
                relationships:
                  expense:
                    data:
                      type: expenses
                      id: '17'
                  tax_rate:
                    data:
                      type: tax_rates
                      id: '3'
              meta:
                current_page: 1
                total_pages: 1
                total_count: 1
              included: []
      description: Single expense line item
    collection_expense_line_item:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              included:
                type: array
                items: {}
                example: []
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        unit_price:
                          $ref: '#/components/schemas/resource_expense_line_item/properties/unit_price'
                        quantity:
                          $ref: '#/components/schemas/resource_expense_line_item/properties/quantity'
                        unit_price_normalized:
                          $ref: '#/components/schemas/resource_expense_line_item/properties/unit_price_normalized'
                        name:
                          $ref: '#/components/schemas/resource_expense_line_item/properties/name'
                        unit_price_default:
                          $ref: '#/components/schemas/resource_expense_line_item/properties/unit_price_default'
                      example:
                        name: AWS hosting
                        quantity: 2
                        unit_price: 15000
                        unit_price_default: 16500
                        unit_price_normalized: 16500
                        currency: EUR
                        currency_default: USD
                        currency_normalized: USD
                    relationships:
                      type: object
                      properties:
                        expense:
                          $ref: '#/components/schemas/_single_relationship'
                        tax_rate:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        expense:
                          data:
                            type: expenses
                            id: '17'
                        tax_rate:
                          data:
                            type: tax_rates
                            id: '3'
                  example:
                    id: '42'
                    type: expense_line_items
                    attributes:
                      name: AWS hosting
                      quantity: 2
                      unit_price: 15000
                      unit_price_default: 16500
                      unit_price_normalized: 16500
                      currency: EUR
                      currency_default: USD
                      currency_normalized: USD
                    relationships:
                      expense:
                        data:
                          type: expenses
                          id: '17'
                      tax_rate:
                        data:
                          type: tax_rates
                          id: '3'
                example:
                  - id: '42'
                    type: expense_line_items
                    attributes:
                      name: AWS hosting
                      quantity: 2
                      unit_price: 15000
                      unit_price_default: 16500
                      unit_price_normalized: 16500
                      currency: EUR
                      currency_default: USD
                      currency_normalized: USD
                    relationships:
                      expense:
                        data:
                          type: expenses
                          id: '17'
                      tax_rate:
                        data:
                          type: tax_rates
                          id: '3'
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '42'
                  type: expense_line_items
                  attributes:
                    name: AWS hosting
                    quantity: 2
                    unit_price: 15000
                    unit_price_default: 16500
                    unit_price_normalized: 16500
                    currency: EUR
                    currency_default: USD
                    currency_normalized: USD
                  relationships:
                    expense:
                      data:
                        type: expenses
                        id: '17'
                    tax_rate:
                      data:
                        type: tax_rates
                        id: '3'
              meta:
                current_page: 1
                total_pages: 1
                total_count: 1
              included: []
      description: Collection expense line item
  schemas:
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    resource_expense_line_item:
      type: object
      title: Expense line item Resource
      properties:
        expense:
          title: Expense
          example:
            data:
              type: expenses
              id: '17'
        position:
          type: integer
          title: Position
          example: 1
        tax_rate_id:
          type: integer
          title: Tax Rate
          example: 3
        expense_id:
          type: integer
          title: Expense
          example: 17
        unit_price:
          type: integer
          title: Unit Price
          example: 15000
        name:
          type: string
          title: Name
          example: AWS hosting
        tax_rate:
          title: Tax Rate
          example:
            data:
              type: tax_rates
              id: '3'
        id:
          type: integer
          title: Id
          example: '42'
        unit_price_default:
          title: Unit Price Default
          example: 16500
        quantity:
          type: number
          title: Quantity
          example: 2
        unit_price_normalized:
          title: Unit Price Normalized
          example: 16500
      example:
        id: '42'
        type: expense_line_items
        attributes:
          name: AWS hosting
          quantity: 2
          unit_price: 15000
          unit_price_default: 16500
          unit_price_normalized: 16500
          currency: EUR
          currency_default: USD
          currency_normalized: USD
        relationships:
          expense:
            data:
              type: expenses
              id: '17'
          tax_rate:
            data:
              type: tax_rates
              id: '3'
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_expense_line_item:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.expense_line_item at the top of this file.
      required: false
    sort_expense_line_item:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - expense_id
            - -expense_id
            - id
            - -id
            - tax_rate_id
            - -tax_rate_id
          type: string
        title: Sort expense line item
      explode: false
      required: false
