    resource_discussion:
      type: object
      title: Discussion Resource
      description: A threaded discussion attached to a page, task, or other resource, allowing team members to comment and resolve topics.
      properties:
        created_at:
          title: Created At
          description: Timestamp when this discussion was created.
          example:
            gt: '2026-01-01'
        excerpt:
          type: string
          title: Excerpt
          description: A short text preview of the first comment or content in this discussion.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: The unique identifier of this discussion.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this discussion belongs to.
          example:
            eq: value
        page:
          title: Page
          description: The page this discussion is attached to.
          example:
            eq: value
        page_id:
          type: integer
          title: Page
          description: ID of the page this discussion is attached to.
          example:
            - 123
        resolved_at:
          type: string
          title: Resolved At
          format: date-time
          description: Timestamp when this discussion was marked as resolved, or null if it is still active.
          example:
            gt: '2026-01-01'
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
          description: The status of this discussion, either active (1) or resolved (2).
          example:
            eq: active
        subscriber_ids:
          title: Subscriber Ids
          description: An array of IDs of people who are subscribed to notifications for this discussion.
          example:
            - 123
            - 456
        updated_at:
          title: Updated At
          description: Timestamp when this discussion was last updated.
          example:
            gt: '2026-01-01'
      example:
        id: '78'
        type: discussions
        attributes:
          title: API Design Review
          note: Let's discuss the new API endpoint design for the authentication module
          created_at: '2026-02-01T10:00:00.000+00:00'
          updated_at: '2026-03-01T09:00:00.000+00:00'
          last_activity_at: '2026-03-01T09:00:00.000+00:00'
        relationships:
          project:
            data:
              type: projects
              id: '6899'
          author:
            data:
              type: people
              id: '12'
