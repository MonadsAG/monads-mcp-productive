openapi: 3.1.0
info:
  title: Productive.io API – Timesheets
  version: 2.0.0
description: |-
  **Timesheets** aggregate a person's time entries by day and are the unit of submission in the time approval workflow.

  Manage daily timesheet submissions, track approval status, and retrieve timesheet data by person or date range. Timesheets move through `draft` → `submitted` → `approved` / `rejected` states.
x-filters:
  timesheet:
    person_id:
      description: Filter by the associated person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    date:
      description: Filter by the timesheet date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who created the timesheet.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/timesheets:
    get:
      tags:
        - Timesheets
      summary: Get timesheets
      responses:
        '200':
          $ref: '#/components/responses/collection_timesheet'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_timesheet'
        - $ref: '#/components/parameters/filter_timesheet'
      operationId: timesheets-index
      description: List all timesheets.
    post:
      tags:
        - Timesheets
      summary: Create a timesheet
      responses:
        '201':
          $ref: '#/components/responses/single_timesheet'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: timesheets-create
      requestBody:
        $ref: '#/components/requestBodies/timesheet'
      description: Create a new timesheet.
  /api/v2/timesheets/{id}:
    get:
      tags:
        - Timesheets
      summary: Gets a timesheet
      responses:
        '200':
          $ref: '#/components/responses/single_timesheet'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the timesheet to retrieve.
      operationId: timesheets-show
      description: Retrieve a single timesheet by ID.
    delete:
      tags:
        - Timesheets
      summary: Deletes a timesheet
      responses:
        '204':
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the timesheet to delete.
      operationId: timesheets-destroy
      description: Delete a timesheet by ID.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_timesheet:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.timesheet at the top of this file.
      required: false
      description: Filter parameter for querying timesheets.
    sort_timesheet:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - date
            - -date
            - id
            - -id
            - person_id
            - -person_id
          type: string
        title: Sort timesheet
      explode: false
      required: false
      description: Sort order for timesheet list results. Accepts one or more field names, comma-separated; prefix with `-` for descending. --branch descriptions
  responses:
    single_timesheet:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      date:
                        $ref: '#/components/schemas/resource_timesheet/properties/date'
                      created_at:
                        $ref: '#/components/schemas/resource_timesheet/properties/created_at'
                  relationships:
                    type: object
                    properties:
                      person:
                        $ref: '#/components/schemas/_single_relationship'
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single timesheet
    collection_timesheet:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        date:
                          $ref: '#/components/schemas/resource_timesheet/properties/date'
                        created_at:
                          $ref: '#/components/schemas/resource_timesheet/properties/created_at'
                    relationships:
                      type: object
                      properties:
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection timesheet
  schemas:
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    resource_timesheet:
      type: object
      title: Timesheet Resource
      properties:
        organization:
          title: Organization
          description: The organization this timesheet belongs to.
          example:
            eq: value
        person_id:
          type: integer
          title: Person
          description: The ID of the person this timesheet belongs to.
          example:
            - 123
        creator:
          title: Creator
          description: The person who created this timesheet.
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when the timesheet was created.
          example:
            gt: '2026-01-01'
        person:
          title: Person
          description: The person this timesheet belongs to.
          example:
            eq: value
        date:
          type: string
          title: Date
          format: date
          description: The date this timesheet covers.
          example:
            gt: '2026-01-01'
        creator_id:
          type: integer
          title: Creator
          description: The ID of the person who created this timesheet.
          example:
            - 123
        id:
          title: Id
          description: Unique identifier for the timesheet.
          example:
            - 123
      description: A daily aggregate of a person's time entries, serving as the unit of submission in the time approval workflow.
      example:
        id: '123'
        type: timesheets
        attributes:
          week_starting: '2026-01-13'
          status: submitted
          total_hours: 40
        relationships:
          person:
            data:
              type: people
              id: '12'
  requestBodies:
    timesheet:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      date:
                        $ref: '#/components/schemas/resource_timesheet/properties/date'
                      person_id:
                        $ref: '#/components/schemas/resource_timesheet/properties/person_id'
      description: Request body for creating or updating a timesheet.
