openapi: 3.1.0
info:
  title: Productive.io API – Timesheets
  version: 2.0.0
description: |-
  **Timesheets** aggregate a person's time entries by day and are the unit of submission in the time approval workflow.

  Manage daily timesheet submissions, track approval status, and retrieve timesheet data by person or date range. Timesheets move through `draft` → `submitted` → `approved` / `rejected` states.
x-filters:
  timesheet:
    person_id:
      description: Filter by the associated person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    date:
      description: Filter by the timesheet date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who created the timesheet.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/timesheets:
    get:
      tags:
        - Timesheets
      summary: Get timesheets
      operationId: timesheets-index
      description: List all timesheets.
      parameters:
        - $ref: '#/components/parameters/filter_timesheet'
        - $ref: '#/components/parameters/sort_timesheet'
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/collection_timesheet'
    post:
      tags:
        - Timesheets
      summary: Create a timesheet
      operationId: timesheets-create
      description: Create a new timesheet.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/timesheet'
      responses:
        '201':
          $ref: '#/components/responses/single_timesheet'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/timesheets/{id}:
    get:
      tags:
        - Timesheets
      summary: Gets a timesheet
      operationId: timesheets-show
      description: Retrieve a single timesheet by ID.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the timesheet to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/single_timesheet'
    delete:
      tags:
        - Timesheets
      summary: Deletes a timesheet
      operationId: timesheets-destroy
      description: Delete a timesheet by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the timesheet to delete.
        - $ref: '#/components/parameters/header_organization'
      responses:
        '204':
          description: No Content
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_timesheet:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - date
            - -date
            - id
            - -id
            - person_id
            - -person_id
          type: string
        title: Sort timesheet
      explode: false
      required: false
      description: Sort order for timesheet list results. Accepts one or more field names, comma-separated; prefix with `-` for descending. --branch descriptions
    filter_timesheet:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.timesheet at the top of this file.
      required: false
      description: Filter parameter for querying timesheets.
  responses:
    single_timesheet:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single timesheet record in JSON:API format.
            properties:
              meta:
                $ref: '#/components/schemas/_meta'
              data:
                type: object
                description: The JSON:API data object for the returned timesheet resource.
                properties:
                  attributes:
                    type: object
                    description: Timesheet attributes.
                    properties:
                      date:
                        $ref: '#/components/schemas/resource_timesheet/properties/date'
                      created_at:
                        $ref: '#/components/schemas/resource_timesheet/properties/created_at'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Timesheet relationships.
                    properties:
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      person:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                id: '567'
                type: timesheets
                attributes:
                  status: submitted
                  week_starting: '2026-03-10'
                  total_time: 2400
                  submitted_at: '2026-03-17T09:00:00.000+00:00'
                  approved_at: null
                relationships:
                  person:
                    data:
                      type: people
                      id: '12'
              included: []
      description: Single timesheet
    collection_timesheet:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of timesheet records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A timesheet resource object.
                  properties:
                    relationships:
                      type: object
                      description: Timesheet relationships.
                      properties:
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                    attributes:
                      type: object
                      description: Timesheet attributes.
                      properties:
                        created_at:
                          $ref: '#/components/schemas/resource_timesheet/properties/created_at'
                        date:
                          $ref: '#/components/schemas/resource_timesheet/properties/date'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of timesheet resource objects.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                - id: '567'
                  type: timesheets
                  attributes:
                    status: submitted
                    week_starting: '2026-03-10'
                    total_time: 2400
                    submitted_at: '2026-03-17T09:00:00.000+00:00'
                    approved_at: null
                  relationships:
                    person:
                      data:
                        type: people
                        id: '12'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection timesheet
  schemas:
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    resource_timesheet:
      type: object
      title: Timesheet Resource
      description: A daily aggregate of a person's time entries, serving as the unit of submission in the time approval workflow.
      properties:
        id:
          title: Id
          description: Unique identifier for the timesheet.
          example:
            - 123
        creator:
          title: Creator
          description: The person who created this timesheet.
          example:
            eq: value
        creator_id:
          type: integer
          title: Creator
          description: The ID of the person who created this timesheet.
          example:
            - 123
        person:
          title: Person
          description: The person this timesheet belongs to.
          example:
            eq: value
        person_id:
          type: integer
          title: Person
          description: The ID of the person this timesheet belongs to.
          example:
            - 123
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when the timesheet was created.
          example:
            gt: '2026-01-01'
        date:
          type: string
          title: Date
          format: date
          description: The date this timesheet covers.
          example:
            gt: '2026-01-01'
        organization:
          title: Organization
          description: The organization this timesheet belongs to.
          example:
            eq: value
      example:
        id: '123'
        type: timesheets
        attributes:
          week_starting: '2026-01-13'
          status: submitted
          total_hours: 40
        relationships:
          person:
            data:
              type: people
              id: '12'
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  requestBodies:
    timesheet:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a timesheet.
            properties:
              data:
                type: object
                description: The JSON:API data object containing the timesheet resource attributes and relationships.
                properties:
                  attributes:
                    type: object
                    description: Timesheet attributes.
                    properties:
                      date:
                        $ref: '#/components/schemas/resource_timesheet/properties/date'
                      person_id:
                        $ref: '#/components/schemas/resource_timesheet/properties/person_id'
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: timesheets
                attributes:
                  status: submitted
                relationships:
                  person:
                    data:
                      type: people
                      id: '12'
      description: Request body for creating or updating a timesheet.
