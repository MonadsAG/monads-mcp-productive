openapi: 3.1.0
info:
  title: Productive.io API – Holiday calendars
  version: 2.0.0
description: |-
  For more details on how to work with holiday calendars and holidays, please refer to [Holidays Settings](https://help.productive.io/en/articles/2179650-holidays-settings) article.
  Holiday calendar is an entity that represents an outer container for multiple holidays.
  Holidays within the calendar define the persons availability and capacity on a particular date. For more details on how to work with holidays, please refer to [Holidays](https://developer.productive.io/holidays.html#holidays) documentation.
  A holiday calendar is associated with person's cost rate (salary). Each cost rate has exactly one holiday calendar.
  You can find more about relationship between cost rates and holiday calendars in our help documentation: [Understanding and Setting Up Cost Rates in Productive](https://help.productive.io/en/articles/2179644-understanding-and-setting-up-cost-rates-in-productive).

  The following diagram shows holiday calendars in our data hierarchy:

  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  person: Person
  holiday_calendar: Holiday Calendar {
    class: primary
  }
  salaries: Salaries
  holidays: Holidays

  # define connections
  person -> salaries
  holiday_calendar -> salaries
  holiday_calendar -> holidays
  ```
x-filters:
  holiday_calendar:
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/holiday_calendars:
    get:
      tags:
        - Holiday calendars
      summary: Get all holiday calendars
      operationId: holiday_calendars-index
      description: List holiday calendars.
      parameters:
        - $ref: '#/components/parameters/filter_holiday_calendar'
        - $ref: '#/components/parameters/sort_holiday_calendar'
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/collection_holiday_calendar'
    post:
      tags:
        - Holiday calendars
      summary: Create a holiday calendar
      operationId: holiday_calendars-create
      description: Create a new holiday calendar.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/holiday_calendar'
      responses:
        '201':
          $ref: '#/components/responses/single_holiday_calendar'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/holiday_calendars/{id}:
    get:
      tags:
        - Holiday calendars
      summary: Get a holiday calendar
      operationId: holiday_calendars-show
      description: Retrieve a single holiday calendar.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_holiday_calendar'
    patch:
      tags:
        - Holiday calendars
      summary: Update a holiday calendar
      operationId: holiday_calendars-update
      description: Update a holiday calendar.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/holiday_calendar'
      responses:
        '200':
          $ref: '#/components/responses/single_holiday_calendar'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
    delete:
      tags:
        - Holiday calendars
      summary: Deletes a holiday calendar
      operationId: holiday_calendars-destroy
      description: Delete a holiday calendar.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '204':
          description: No Content
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_holiday_calendar:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort holiday calendar
      explode: false
      required: false
      description: Sort holiday calendar
    filter_holiday_calendar:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.holiday_calendar at the top of this file.
      required: false
      description: Filters
  responses:
    single_holiday_calendar:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single holiday calendar record in JSON:API format.
            properties:
              data:
                type: object
                description: The holiday calendar resource object.
                properties:
                  attributes:
                    type: object
                    description: Holiday calendar attributes.
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_holiday_calendar/properties/name'
                      state:
                        $ref: '#/components/schemas/resource_holiday_calendar/properties/state'
                      country:
                        $ref: '#/components/schemas/resource_holiday_calendar/properties/country'
                      autogenerate_holidays:
                        $ref: '#/components/schemas/resource_holiday_calendar/properties/autogenerate_holidays'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Holiday calendar relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                id: '3'
                type: holiday_calendars
                attributes:
                  name: United States
                  country: US
                  state: US-CA
                  autogenerate_holidays: true
                relationships:
                  organization:
                    data:
                      type: organizations
                      id: '1'
              included: []
      description: Single holiday calendar
    collection_holiday_calendar:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of holiday calendar records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A holiday calendar resource object.
                  properties:
                    attributes:
                      type: object
                      description: Holiday calendar attributes.
                      properties:
                        country:
                          $ref: '#/components/schemas/resource_holiday_calendar/properties/country'
                        name:
                          $ref: '#/components/schemas/resource_holiday_calendar/properties/name'
                        state:
                          $ref: '#/components/schemas/resource_holiday_calendar/properties/state'
                        autogenerate_holidays:
                          $ref: '#/components/schemas/resource_holiday_calendar/properties/autogenerate_holidays'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Holiday calendar relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of holiday calendar resource objects.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                - id: '3'
                  type: holiday_calendars
                  attributes:
                    name: United States
                    country: US
                    state: US-CA
                    autogenerate_holidays: true
                  relationships:
                    organization:
                      data:
                        type: organizations
                        id: '1'
              included: []
              meta:
                current_page: 1
                total_pages: 1
                total_count: 1
                page_size: 30
                max_page_size: 200
      description: Collection holiday calendar
  schemas:
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    resource_holiday_calendar:
      type: object
      title: Holiday calendar Resource
      description: A set of holidays for a country or region that affects person availability and capacity calculations.
      properties:
        id:
          type: integer
          title: Id
          description: The unique identifier of this holiday calendar.
          example:
            - 123
        country:
          type: string
          title: Country
          description: The country code used to determine which national holidays to include in this calendar.
          example: US
        state:
          type: string
          title: State
          description: The state or region code used to narrow holidays to a specific sub-national region.
          example: US-CA
        organization:
          title: Organization
          description: The organization this holiday calendar belongs to.
          example:
            data:
              type: organizations
              id: '1'
        autogenerate_holidays:
          type: boolean
          title: Autogenerate Holidays
          description: When true, holidays for this calendar are automatically generated based on the configured country and state.
          example: true
        name:
          type: string
          title: Name
          description: The display name of this holiday calendar.
          example: United States
      example:
        id: '3'
        type: holiday_calendars
        attributes:
          name: United States
          country: US
          state: US-CA
          autogenerate_holidays: true
        relationships:
          organization:
            data:
              type: organizations
              id: '1'
  requestBodies:
    holiday_calendar:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a holiday calendar.
            properties:
              data:
                type: object
                description: The holiday calendar resource object.
                properties:
                  attributes:
                    type: object
                    description: Holiday calendar attributes.
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_holiday_calendar/properties/name'
                      country:
                        $ref: '#/components/schemas/resource_holiday_calendar/properties/country'
                      state:
                        $ref: '#/components/schemas/resource_holiday_calendar/properties/state'
                      autogenerate_holidays:
                        $ref: '#/components/schemas/resource_holiday_calendar/properties/autogenerate_holidays'
                    required:
                      - name
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: holiday_calendars
                attributes:
                  name: United States
                  country: US
                  state: US-CA
                  autogenerate_holidays: true
      description: Request body for creating or updating a holiday calendar.
