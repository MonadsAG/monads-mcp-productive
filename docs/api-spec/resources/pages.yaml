  requestBodies:
    page_apply_template:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: JSON:API document wrapping the template attributes.
            properties:
              data:
                type: object
                description: The page resource object.
                properties:
                  attributes:
                    type: object
                    description: Template application attributes.
                    properties:
                      template_id:
                        $ref: '#/components/schemas/resource_page/properties/template_id'
                    required:
                      - template_id
                    example:
                      template_id: 47710
                example:
                  type: pages
                  attributes:
                    template_id: 47710
            example:
              data:
                type: pages
                attributes:
                  template_id: 47710
      description: Request body for applying a doc template onto an existing page or under a parent page.
    page_apply_template_as_doc:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: JSON:API document wrapping the template attributes.
            properties:
              data:
                type: object
                description: The page resource object.
                properties:
                  attributes:
                    type: object
                    description: Template application attributes.
                    properties:
                      project_id:
                        $ref: '#/components/schemas/resource_page/properties/project_id'
                      template_id:
                        $ref: '#/components/schemas/resource_page/properties/template_id'
                    required:
                      - template_id
                    example:
                      template_id: 47710
                      project_id: 31002
                example:
                  type: pages
                  attributes:
                    template_id: 47710
                    project_id: 31002
            example:
              data:
                type: pages
                attributes:
                  template_id: 47710
                  project_id: 31002
      description: Request body for creating a doc from a doc template.
    page_markdown_body:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Plain JSON object (not a JSON:API document) carrying the `markdown` string.
            properties:
              markdown:
                type: string
                title: Markdown
                description: Markdown content that is converted to the page's rich-text representation before being persisted.
                example: |-
                  ## Notes

                  Kickoff summary with **decisions**.
            required:
              - markdown
            example:
              markdown: |-
                ## Notes

                Kickoff summary with **decisions**.
      description: Markdown content to apply to a page body. Used by the append-markdown and replace-body-with-markdown endpoints.
    page_html_body:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Plain JSON object (not a JSON:API document) carrying the `html` string.
            properties:
              html:
                type: string
                title: Html
                description: HTML content that is converted to the page's rich-text representation before being persisted.
                example: <h2>Notes</h2><p>Kickoff summary with <strong>decisions</strong>.</p>
            required:
              - html
            example:
              html: <h2>Notes</h2><p>Kickoff summary with <strong>decisions</strong>.</p>
      description: HTML content to apply to a page body. Used by the append-html and replace-body-with-html endpoints.
    page_create_with_markdown:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: JSON:API document wrapping the page data.
            properties:
              data:
                type: object
                description: The page resource object.
                properties:
                  attributes:
                    type: object
                    description: Attributes of the page to create. `markdown` is required; the rest are the standard page attributes.
                    properties:
                      attachment_ids:
                        $ref: '#/components/schemas/resource_page/properties/attachment_ids'
                      cover_image_url:
                        $ref: '#/components/schemas/resource_page/properties/cover_image_url'
                      custom_fields:
                        $ref: '#/components/schemas/resource_page/properties/custom_fields'
                      icon_id:
                        $ref: '#/components/schemas/resource_page/properties/icon_id'
                      markdown:
                        type: string
                        title: Markdown
                        description: Markdown source that is converted to the page's rich-text body. Required.
                        example: |-
                          ## Notes

                          This is a paragraph with **bold** text and a [link](https://productive.io).

                          - bullet one
                          - bullet two
                      parent_page_id:
                        $ref: '#/components/schemas/resource_page/properties/parent_page_id'
                      position:
                        $ref: '#/components/schemas/resource_page/properties/position'
                      preferences:
                        $ref: '#/components/schemas/resource_page/properties/preferences'
                      project_id:
                        $ref: '#/components/schemas/resource_page/properties/project_id'
                      root_page_id:
                        $ref: '#/components/schemas/resource_page/properties/root_page_id'
                      title:
                        $ref: '#/components/schemas/resource_page/properties/title'
                    required:
                      - markdown
                    example:
                      title: Project Notes
                      markdown: |-
                        ## Notes

                        This is a paragraph with **bold** text and a [link](https://productive.io).

                        - bullet one
                        - bullet two
                      project_id: 5
                      icon_id: null
                      parent_page_id: null
                      position: 1
                      public_access: false
                example:
                  type: pages
                  attributes:
                    title: Project Notes
                    markdown: |-
                      ## Notes

                      This is a paragraph with **bold** text and a [link](https://productive.io).

                      - bullet one
                      - bullet two
                    project_id: 5
                    icon_id: null
                    parent_page_id: null
                    position: 1
                    public_access: false
            example:
              data:
                type: pages
                attributes:
                  title: Project Notes
                  markdown: |-
                    ## Notes

                    This is a paragraph with **bold** text and a [link](https://productive.io).

                    - bullet one
                    - bullet two
                  project_id: 5
                  icon_id: null
                  parent_page_id: null
                  position: 1
                  public_access: false
      description: Request body for creating a new page from markdown. The `markdown` attribute is required and is converted server-side to the page's rich-text body. All standard page attributes (title, icon, parent, project, custom fields, etc.) can be set in the same request.
    page_move:
