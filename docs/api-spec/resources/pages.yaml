openapi: 3.1.0
info:
  title: Productive.io API – Pages
  version: 2.0.0
description: |-
  Docs are rich-text pages in a two-level hierarchy: a **doc** (root page) owns sharing settings, memberships and the project link; **subpages** nest under it. Page bodies are ProseMirror JSON — write them through the markdown/HTML endpoints; raw body writes are not part of the public API.

  Edit history lives in [`page_versions`](openapi:group:pageversions); root pages on a project also carry custom fields.
x-filters:
  page:
    created_at:
      description: Filter by creation date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who created the page.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_fields:
      description: Filter by custom field values.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    edited_at:
      description: Filter by last edited date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    full_query:
      description: Full-text search across all fields of a page, including title and body content.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    fuzzy_dates:
      description: Filter pages by fuzzy date expressions mentioned in the page content.
      operators:
        - eq
        - not_eq
    fuzzy_people:
      description: Filter pages by people mentioned in the page content.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    jump_query:
      description: Filter pages by a quick search query used in jump navigation.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_activity_at:
      description: Filter by last activity date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    parent_page_id:
      description: Filter by the direct parent page.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_type:
      description: Filter by the person type (used in search context, e.g. assignee or subscriber).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_status:
      description: Filter by the status of the parent project (active or archived).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Filter by title or content (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    root_page_id:
      description: Filter by the top-level ancestor page.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by page status (used in search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subscriber_id:
      description: Filter by the person subscribed to the page.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    template:
      description: Filter to include only pages that are based on a template.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/pages/{id}/convert_to_doc:
    patch:
      tags:
        - Pages
      summary: Converts a subpage into a doc
      operationId: pages-convert-to-doc-convert-to-doc
      description: 'Promotes a subpage into a standalone doc: it is detached from its parent, keeps the project of the doc it came from, gets its own `public_uuid`, and its subpages move with it. The caller gets full access and the original doc''s person memberships are copied over. No request body.'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the page.
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/pages/copy:
    post:
      tags:
        - Pages
      summary: Copies a page
      operationId: pages-copy-copy
      description: Creates a copy of a page together with its subpages. `template_id` is the ID of the source page. `title` is optional and defaults to `Copy of <source title>`. When copying a doc, pass `project_id` to place the copy in a project; a subpage copy stays next to the source and takes no `project_id`. Template docs cannot be copied this way — use [`apply_template_as_doc`](openapi:operation:pages-template-apply-template-as-doc).
      requestBody:
        $ref: '#/components/requestBodies/page_copy'
      responses:
        '201':
          $ref: '#/components/responses/single_page'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_page'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/pages/{id}:
    get:
      tags:
        - Pages
      summary: Gets a page
      operationId: pages-show
      description: 'Returns a single page: its ProseMirror `body`, place in the hierarchy (`root_page`, `parent_page`), attachments and sharing state (`public_access`, `public_uuid`).'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Pages
      summary: Deletes a page
      operationId: pages-destroy
      description: Deletes a page together with all of its subpages. Template docs cannot be deleted (`409`).
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page to delete.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/pages:
    get:
      tags:
        - Pages
      summary: Get pages
      operationId: pages-index
      description: Returns a paginated list of pages — docs (root pages) and their subpages alike. Scope the list with `filter[project_id]` (pages of a project), `filter[root_page_id]` (every page inside one doc) or `filter[parent_page_id]` (direct children of a page). `filter[query]` matches page titles, `filter[full_query]` searches titles and body content; `filter[creator_id]`, `filter[subscriber_id]`, `filter[edited_at]` and `filter[last_activity_at]` narrow the result further. Pass `filter[template]` to list only template docs.
      parameters:
        - $ref: '#/components/parameters/filter_page'
        - $ref: '#/components/parameters/sort_page'
      responses:
        '200':
          $ref: '#/components/responses/collection_page'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/pages/{id}/move:
    patch:
      tags:
        - Pages
      summary: Moves a page
      operationId: pages-move-move
      description: Moves a page and its subpages under another page. `target_doc_id` is the ID of the destination page; the moved page becomes its last child and joins the destination's doc. Requires write access on the destination; published docs cannot be moved. When a doc is moved it stops being a doc — its memberships and project link are dropped and access follows the destination.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page to move.
      requestBody:
        $ref: '#/components/requestBodies/page_move'
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_page'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/pages/{id}/append_html:
    patch:
      tags:
        - Pages
      summary: Append HTML to a page body
      operationId: pages-proxy-append-html
      description: |-
        Append HTML to the end of a page's body. The HTML is converted to the page's rich-text representation and applied through the docs-realtime collaboration service so concurrent editors see the change immediately.

        The request body is a plain JSON object `{"html": "…"}`, not a JSON:API document; an empty `html` returns `422`.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page to append HTML content to.
      requestBody:
        $ref: '#/components/requestBodies/page_html_body'
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
        '502':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Bad Gateway — the docs-realtime service returned an error or could not be reached.
  /api/v2/pages/{id}/append_markdown:
    patch:
      tags:
        - Pages
      summary: Append markdown to a page body
      operationId: pages-proxy-append-markdown
      description: |-
        Append markdown to the end of a page's body. The markdown is converted to the page's rich-text representation and applied through the docs-realtime collaboration service so concurrent editors see the change immediately.

        The request body is a plain JSON object `{"markdown": "…"}`, not a JSON:API document; an empty `markdown` returns `422`.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page to append markdown content to.
      requestBody:
        $ref: '#/components/requestBodies/page_markdown_body'
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
        '502':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Bad Gateway — the docs-realtime service returned an error or could not be reached.
  /api/v2/pages/create_with_markdown:
    post:
      tags:
        - Pages
      summary: Create a page with markdown body
      operationId: pages-proxy-create-with-markdown
      description: Create a new page from a markdown body. The markdown is converted to the page's rich-text representation server-side and the page is then created with all standard page attributes (title, icon, parent, project, custom fields, etc.).
      requestBody:
        $ref: '#/components/requestBodies/page_create_with_markdown'
      responses:
        '201':
          $ref: '#/components/responses/single_page'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_page'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
        '502':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Bad Gateway — the docs-realtime service returned an error or could not be reached while processing the markdown body.
  /api/v2/pages/{id}/replace_body_with_html:
    patch:
      tags:
        - Pages
      summary: Replace a page body with HTML
      operationId: pages-proxy-replace-body-with-html
      description: |-
        Replace a page's entire body with the supplied HTML. The HTML is converted to the page's rich-text representation and applied through the docs-realtime collaboration service so concurrent editors see the change immediately.

        The request body is a plain JSON object `{"html": "…"}`, not a JSON:API document; an empty `html` returns `422`.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page whose body will be replaced.
      requestBody:
        $ref: '#/components/requestBodies/page_html_body'
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
        '502':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Bad Gateway — the docs-realtime service returned an error or could not be reached.
  /api/v2/pages/{id}/replace_body_with_markdown:
    patch:
      tags:
        - Pages
      summary: Replace a page body with markdown
      operationId: pages-proxy-replace-body-with-markdown
      description: |-
        Replace a page's entire body with the supplied markdown. The markdown is converted to the page's rich-text representation and applied through the docs-realtime collaboration service so concurrent editors see the change immediately.

        The request body is a plain JSON object `{"markdown": "…"}`, not a JSON:API document; an empty `markdown` returns `422`.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page whose body will be replaced.
      requestBody:
        $ref: '#/components/requestBodies/page_markdown_body'
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
        '502':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Bad Gateway — the docs-realtime service returned an error or could not be reached.
  /api/v2/pages/{id}/publish:
    patch:
      tags:
        - Pages
      summary: Publishes a page
      operationId: pages-publish-publish
      description: 'Publishes a doc: sets `public_access` to `true` so anyone with the link can read it without authentication through [`GET /public/pages/{uuid}`](openapi:operation:public-pages-show), using the doc''s `public_uuid`. Only docs can be published — subpages are covered by their doc. Template docs cannot be published. No request body.'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page to publish.
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/unprocessable_content_page'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/pages/apply_template_as_doc:
    post:
      tags:
        - Pages
      summary: Creates a doc from a template
      operationId: pages-template-apply-template-as-doc
      description: Creates a new doc from a template doc. `template_id` is the page ID of that template doc. Pass `project_id` to create the doc inside a project, or omit it for a standalone doc under *My organization*.
      requestBody:
        $ref: '#/components/requestBodies/page_apply_template_as_doc'
      responses:
        '201':
          $ref: '#/components/responses/single_page'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_page'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/pages/{id}/apply_template_as_target:
    patch:
      tags:
        - Pages
      summary: Applies a template onto a page
      operationId: pages-template-apply-template-as-target
      description: 'Applies a template doc onto an existing page: the page takes the template''s title and receives copies of the template''s subpages, attachments and mentions — template subpages are placed before the page''s existing ones. The page''s own body is kept. `template_id` is the page ID of the template doc.'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the page.
      requestBody:
        $ref: '#/components/requestBodies/page_apply_template'
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_page'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/pages/{id}/apply_template_on_parent:
    patch:
      tags:
        - Pages
      summary: Creates a subpage from a template
      operationId: pages-template-apply-template-on-parent
      description: 'Creates a new subpage under page `{id}` from a template doc: the template''s title, body, subpages, attachments and mentions are copied into a new page appended as the last child. Returns the new subpage, not the parent. `template_id` is the page ID of the template doc.'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the page.
      requestBody:
        $ref: '#/components/requestBodies/page_apply_template'
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
