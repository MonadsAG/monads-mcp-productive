  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_not_found:
      enum:
        - not_found
        - record_not_found
        - route_not_found
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 404.
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _collection_relationship:
      anyOf:
        - $ref: '#/components/schemas/_collection_linkage'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          required:
            - included
          example:
            included: false
      required:
        - meta
      example:
        meta:
          included: false
    _collection_linkage:
      type: object
      title: Collection linkage
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/_resource'
      required:
        - data
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: string
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      required:
        - id
        - type
      example:
        type: tasks
        id: '42'
    resource_page:
      type: object
      title: Page Resource
      description: A rich text document page. Root pages are standalone Docs with sharing settings; child pages form a hierarchy within a Doc.
      properties:
        attachment_ids:
          title: Attachment Ids
          description: IDs of attachments associated with this page.
          example:
            - 123
            - 456
        attachments:
          title: Attachments
          description: Attachments linked to this page.
          example:
            eq: value
        body:
          title: Body
          description: Rich text body of the page in ProseMirror JSON format.
          example:
            eq: value
        cover_image_meta:
          type: string
          title: Cover Image Meta
          description: Metadata for the cover image, such as dimensions and focal point.
          example:
            eq: value
        cover_image_url:
          type: string
          title: Cover Image Url
          description: URL of the cover image displayed at the top of the page.
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when the page was created.
          example:
            gt: '2026-01-01'
        creator:
          title: Creator
          description: The person who created this page.
          example:
            eq: value
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who created this page.
          example:
            - 123
        creator_name:
          title: Creator Name
          description: Display name of the page creator.
          example:
            eq: value
        custom_fields:
          type: object
          title: Custom Fields
          description: Custom field values set on this page. Only available on root pages that belong to a project.
          example:
            eq: value
        edited_at:
          type: string
          title: Edited At
          format: date-time
          description: Timestamp when the page content was last edited.
          example:
            gt: '2026-01-01'
        full_query:
          type: string
          title: Full Query
          description: Full-text search query matching across all page fields including title and body.
          example:
            eq: value
        fuzzy_dates:
          type: string
          title: Fuzzy Dates
          format: date
          description: Fuzzy date values extracted from page content for search matching.
          example:
            gt: '2026-01-01'
        fuzzy_people:
          type: integer
          title: Fuzzy People
          description: Person IDs associated with the page for fuzzy search matching.
          example:
            eq: value
        icon_id:
          type: string
          title: Icon
          description: Emoji or icon identifier displayed next to the page title.
          example:
            - 123
        id:
          type: integer
          title: Id
          description: Unique identifier of the page.
          example:
            - 123
        jump_query:
          type: string
          title: Jump Query
          description: Short query used for jump-to search navigation across pages.
          example:
            eq: value
        last_activity_at:
          type: string
          title: Last Activity At
          format: date-time
          description: Timestamp of the most recent activity on this page.
          example:
            gt: '2026-01-01'
        organization:
          title: Organization
          description: The organization this page belongs to.
          example:
            eq: value
        parent_page:
          title: Parent Page
          description: The parent page of this page in the hierarchy, if any.
