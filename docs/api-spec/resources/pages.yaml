          example:
            eq: value
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when the page record was last updated.
          example:
            gt: '2026-01-01'
        version_number:
          type: integer
          title: Version Number
          description: Incremental version counter for the page body, used to detect and prevent conflicting edits.
          example:
            eq: value
        target_doc_id:
          type: integer
          title: Target Doc
          description: ID of the destination page for `PATCH /pages/{id}/move`; the moved page becomes its last child.
