openapi: 3.1.0
info:
  title: Productive.io API – Pages
  version: 2.0.0
description: Rich text pages organized in a Doc hierarchy. Root pages (Docs) support public sharing and permission management. Child pages inherit from their parent Doc. Pages support custom fields, edit history, and inline discussions.
x-filters:
  page:
    custom_fields:
      description: Filter by custom field values.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    jump_query:
      description: Filter pages by a quick search query used in jump navigation.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by page status (used in search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    parent_page_id:
      description: Filter by the direct parent page.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subscriber_id:
      description: Filter by the person subscribed to the page.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_status:
      description: Filter by the status of the parent project (active or archived).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    fuzzy_people:
      description: Filter pages by people mentioned in the page content.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Filter by title or content (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    fuzzy_dates:
      description: Filter pages by fuzzy date expressions mentioned in the page content.
      operators:
        - eq
        - not_eq
    last_activity_at:
      description: Filter by last activity date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    root_page_id:
      description: Filter by the top-level ancestor page.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    template:
      description: Filter to include only pages that are based on a template.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    edited_at:
      description: Filter by last edited date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filter by creation date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who created the page.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    full_query:
      description: Full-text search across all fields of a page, including title and body content.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_type:
      description: Filter by the person type (used in search context, e.g. assignee or subscriber).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/pages/copy:
    post:
      tags:
        - Pages
      summary: Copies a page
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '201':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Created
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: pages-copy-copy
      description: Copy an existing page.
  /api/v2/pages/{id}:
    get:
      tags:
        - Pages
      summary: Gets a page
      responses:
        '200':
          $ref: '#/components/responses/single_page'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page to retrieve.
        - $ref: '#/components/parameters/header_organization'
      operationId: pages-show
      description: Retrieve a single page.
    delete:
      tags:
        - Pages
      summary: Deletes a page
      responses:
        '204':
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page to delete.
      operationId: pages-destroy
      description: Delete a page.
  /api/v2/pages:
    get:
      tags:
        - Pages
      summary: Get pages
      responses:
        '200':
          $ref: '#/components/responses/collection_page'
      parameters:
        - $ref: '#/components/parameters/sort_page'
        - $ref: '#/components/parameters/filter_page'
        - $ref: '#/components/parameters/header_organization'
      operationId: pages-index
      description: List pages.
  /api/v2/pages/{id}/move:
    patch:
      tags:
        - Pages
      summary: Moves a page
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page to move.
        - $ref: '#/components/parameters/header_organization'
      operationId: pages-move-move
      description: Move a page to a different location.
  /api/v2/pages/{id}/append_html:
    patch:
      tags:
        - Pages
      summary: Append HTML to a page body
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden — the current user does not have permission to edit the target page.
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity — the request body is missing the required `html` field.
        '502':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Bad Gateway — the docs-realtime service returned an error or could not be reached.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page to append HTML content to.
      operationId: pages-proxy-append-html
      requestBody:
        $ref: '#/components/requestBodies/page_html_body'
      description: Append HTML to the end of a page's body. The HTML is converted to the page's rich-text representation and applied through the docs-realtime collaboration service so concurrent editors see the change immediately.
  /api/v2/pages/{id}/append_markdown:
    patch:
      tags:
        - Pages
      summary: Append markdown to a page body
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden — the current user does not have permission to edit the target page.
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity — the request body is missing the required `markdown` field.
        '502':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Bad Gateway — the docs-realtime service returned an error or could not be reached.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page to append markdown content to.
        - $ref: '#/components/parameters/header_organization'
      operationId: pages-proxy-append-markdown
      requestBody:
        $ref: '#/components/requestBodies/page_markdown_body'
      description: Append markdown to the end of a page's body. The markdown is converted to the page's rich-text representation and applied through the docs-realtime collaboration service so concurrent editors see the change immediately.
  /api/v2/pages/create_with_markdown:
    post:
      tags:
        - Pages
      summary: Create a page with markdown body
      responses:
        '201':
          $ref: '#/components/responses/single_page'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden — the current user does not have permission to create a page in the target project or under the target parent page.
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity — the request body is missing required fields or the supplied markdown could not be converted to a valid page body.
        '502':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Bad Gateway — the docs-realtime service returned an error or could not be reached while processing the markdown body.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: pages-proxy-create-with-markdown
      requestBody:
        $ref: '#/components/requestBodies/page_create_with_markdown'
      description: Create a new page from a markdown body. The markdown is converted to the page's rich-text representation server-side and the page is then created with all standard page attributes (title, icon, parent, project, custom fields, etc.).
  /api/v2/pages/{id}/replace_body_with_html:
    patch:
      tags:
        - Pages
      summary: Replace a page body with HTML
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden — the current user does not have permission to edit the target page.
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity — the request body is missing the required `html` field.
        '502':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Bad Gateway — the docs-realtime service returned an error or could not be reached.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page whose body will be replaced.
      operationId: pages-proxy-replace-body-with-html
      requestBody:
        $ref: '#/components/requestBodies/page_html_body'
      description: Replace a page's entire body with the supplied HTML. The HTML is converted to the page's rich-text representation and applied through the docs-realtime collaboration service so concurrent editors see the change immediately.
  /api/v2/pages/{id}/replace_body_with_markdown:
    patch:
      tags:
        - Pages
      summary: Replace a page body with markdown
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden — the current user does not have permission to edit the target page.
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity — the request body is missing the required `markdown` field.
        '502':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Bad Gateway — the docs-realtime service returned an error or could not be reached.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page whose body will be replaced.
        - $ref: '#/components/parameters/header_organization'
      operationId: pages-proxy-replace-body-with-markdown
      requestBody:
        $ref: '#/components/requestBodies/page_markdown_body'
      description: Replace a page's entire body with the supplied markdown. The markdown is converted to the page's rich-text representation and applied through the docs-realtime collaboration service so concurrent editors see the change immediately.
  /api/v2/pages/{id}/publish:
    patch:
      tags:
        - Pages
      summary: Publishes a page
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page to publish.
      operationId: pages-publish-publish
      description: Publish a page to make it publicly visible.
  /api/v2/pages/{id}/unpublish:
    patch:
      tags:
        - Pages
      summary: Unpublishes a page
      responses:
        '200':
          $ref: '#/components/responses/single_page'
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the page to unpublish.
      operationId: pages-unpublish-unpublish
      description: Unpublish a page to remove it from public visibility.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_page:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.page at the top of this file.
      required: false
      description: Filter parameter for querying pages.
    sort_page:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - created_at
            - -created_at
            - creator_name
            - -creator_name
            - edited_at
            - -edited_at
            - id
            - -id
            - last_activity_at
            - -last_activity_at
            - project
            - -project
            - project_name
            - -project_name
            - title
            - -title
            - updated_at
            - -updated_at
          type: string
        title: Sort page
      explode: false
      required: false
      description: Sort order for page list results. Accepts one or more field names, comma-separated; prefix with `-` for descending. --branch descriptions
  responses:
    single_page:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      body:
                        $ref: '#/components/schemas/resource_page/properties/body'
                      title:
                        $ref: '#/components/schemas/resource_page/properties/title'
                      public:
                        $ref: '#/components/schemas/resource_page/properties/public'
                      icon_id:
                        $ref: '#/components/schemas/resource_page/properties/icon_id'
                      position:
                        $ref: '#/components/schemas/resource_page/properties/position'
                      edited_at:
                        $ref: '#/components/schemas/resource_page/properties/edited_at'
                      created_at:
                        $ref: '#/components/schemas/resource_page/properties/created_at'
                      updated_at:
                        $ref: '#/components/schemas/resource_page/properties/updated_at'
                      preferences:
                        $ref: '#/components/schemas/resource_page/properties/preferences'
                      public_uuid:
                        $ref: '#/components/schemas/resource_page/properties/public_uuid'
                      root_page_id:
                        $ref: '#/components/schemas/resource_page/properties/root_page_id'
                      custom_fields:
                        $ref: '#/components/schemas/resource_page/properties/custom_fields'
                      public_access:
                        $ref: '#/components/schemas/resource_page/properties/public_access'
                      parent_page_id:
                        $ref: '#/components/schemas/resource_page/properties/parent_page_id'
                      version_number:
                        $ref: '#/components/schemas/resource_page/properties/version_number'
                      cover_image_url:
                        $ref: '#/components/schemas/resource_page/properties/cover_image_url'
                      cover_image_meta:
                        $ref: '#/components/schemas/resource_page/properties/cover_image_meta'
                      last_activity_at:
                        $ref: '#/components/schemas/resource_page/properties/last_activity_at'
                  relationships:
                    type: object
                    properties:
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      project:
                        $ref: '#/components/schemas/_single_relationship'
                      root_page:
                        $ref: '#/components/schemas/_single_relationship'
                      attachments:
                        $ref: '#/components/schemas/_collection_relationship'
                      parent_page:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      template_object:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single page
    collection_page:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        body:
                          $ref: '#/components/schemas/resource_page/properties/body'
                        title:
                          $ref: '#/components/schemas/resource_page/properties/title'
                        public:
                          $ref: '#/components/schemas/resource_page/properties/public'
                        icon_id:
                          $ref: '#/components/schemas/resource_page/properties/icon_id'
                        position:
                          $ref: '#/components/schemas/resource_page/properties/position'
                        edited_at:
                          $ref: '#/components/schemas/resource_page/properties/edited_at'
                        created_at:
                          $ref: '#/components/schemas/resource_page/properties/created_at'
                        updated_at:
                          $ref: '#/components/schemas/resource_page/properties/updated_at'
                        preferences:
                          $ref: '#/components/schemas/resource_page/properties/preferences'
                        public_uuid:
                          $ref: '#/components/schemas/resource_page/properties/public_uuid'
                        root_page_id:
                          $ref: '#/components/schemas/resource_page/properties/root_page_id'
                        custom_fields:
                          $ref: '#/components/schemas/resource_page/properties/custom_fields'
                        public_access:
                          $ref: '#/components/schemas/resource_page/properties/public_access'
                        parent_page_id:
                          $ref: '#/components/schemas/resource_page/properties/parent_page_id'
                        version_number:
                          $ref: '#/components/schemas/resource_page/properties/version_number'
                        cover_image_url:
                          $ref: '#/components/schemas/resource_page/properties/cover_image_url'
                        cover_image_meta:
                          $ref: '#/components/schemas/resource_page/properties/cover_image_meta'
                        last_activity_at:
                          $ref: '#/components/schemas/resource_page/properties/last_activity_at'
                    relationships:
                      type: object
                      properties:
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        project:
                          $ref: '#/components/schemas/_single_relationship'
                        root_page:
                          $ref: '#/components/schemas/_single_relationship'
                        attachments:
                          $ref: '#/components/schemas/_collection_relationship'
                        parent_page:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        template_object:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection page
  schemas:
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    _collection_relationship:
      anyOf:
        - type: object
          title: Collection data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          description: Included variant — related resource identifiers are present in `data`.
          example:
            data:
              - type: tasks
                id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    resource_page:
      type: object
      title: Page Resource
      properties:
        full_query:
          type: string
          title: Full Query
          description: Full-text search query matching across all page fields including title and body.
          example:
            eq: value
        public_access:
          type: boolean
          title: Public Access
          description: Controls whether the page can be viewed publicly without authentication.
          example:
            eq: value
        attachment_ids:
          title: Attachment Ids
          description: IDs of attachments associated with this page.
          example:
            - 123
            - 456
        id:
          type: integer
          title: Id
          description: Unique identifier of the page.
          example:
            - 123
        query:
          type: string
          title: Query
          description: Search query matched against page title only.
          example:
            eq: value
        creator:
          title: Creator
          description: The person who created this page.
          example:
            eq: value
        creator_name:
          title: Creator Name
          description: Display name of the page creator.
          example:
            eq: value
        subscriber_id:
          type: integer
          title: Subscriber
          description: ID of the subscriber (person) watching this page for updates.
          example:
            - 123
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when the page record was last updated.
          example:
            gt: '2026-01-01'
        project_id:
          type: integer
          title: Project
          description: ID of the project this page belongs to.
          example:
            - 123
        root_page:
          title: Root Page
          description: The root Doc page of the hierarchy this page belongs to. Null for root pages themselves.
          example:
            eq: value
        position:
          type: integer
          title: Position
          description: The display order position of this page among its siblings.
          example:
            eq: value
        attachments:
          title: Attachments
          description: Attachments linked to this page.
          example:
            eq: value
        custom_fields:
