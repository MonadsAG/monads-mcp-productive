    patch:
      tags:
        - Pages
      summary: Unpublishes a page
      operationId: pages-unpublish-unpublish
      description: 'Unpublishes a doc: sets `public_access` to `false`, so the public link stops resolving. Only docs can be unpublished — subpages are covered by their doc. No request body.'
