openapi: 3.1.0
info:
  title: Productive.io API – Approval Policy Assignment
  version: 2.0.0
description: |-
  **Approval policy assignments** link an approval policy to a person, determining who approves their time entries, expenses, or absence requests. Each person can have different policies for different approval types.

  Manage assignments to configure the approval chain for individuals across your organization.
x-filters:
  approval_policy_assignment:
    target_id:
      description: Filter by the ID of the assigned target (person or deal/budget).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    target_type:
      description: Filter by the type of the assigned target (person, deal, or budget).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/approval_policy_assignments:
    get:
      tags:
        - Approval Policy Assignment
      summary: Get approval policy assignments
      responses:
        '200':
          $ref: '#/components/responses/collection_approval_policy_assignment'
      parameters:
        - $ref: '#/components/parameters/sort_approval_policy_assignment'
        - $ref: '#/components/parameters/filter_approval_policy_assignment'
        - $ref: '#/components/parameters/header_organization'
      operationId: approval_policy_assignments-index
      description: List approval policy assignments with optional filters and pagination.
    post:
      tags:
        - Approval Policy Assignment
      summary: Creates the approval policy assignment
      responses:
        '201':
          $ref: '#/components/responses/single_approval_policy_assignment'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: approval_policy_assignments-create
      requestBody:
        $ref: '#/components/requestBodies/approval_policy_assignment'
      description: Create a new approval policy assignment.
  /api/v2/approval_policy_assignments/{id}:
    get:
      tags:
        - Approval Policy Assignment
      summary: Gets the approval policy assignment
      responses:
        '200':
          $ref: '#/components/responses/single_approval_policy_assignment'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy assignment to retrieve.
        - $ref: '#/components/parameters/header_organization'
      operationId: approval_policy_assignments-show
      description: Retrieve a single approval policy assignment by ID.
    patch:
      tags:
        - Approval Policy Assignment
      summary: Updates the approval policy assignment
      responses:
        '200':
          $ref: '#/components/responses/single_approval_policy_assignment'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy assignment to update.
      operationId: approval_policy_assignments-update
      requestBody:
        $ref: '#/components/requestBodies/approval_policy_assignment'
      description: Update an approval policy assignment.
    delete:
      tags:
        - Approval Policy Assignment
      summary: Deletes the approval policy assignment
      responses:
        '204':
          description: No Content
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy assignment to delete.
        - $ref: '#/components/parameters/header_organization'
      operationId: approval_policy_assignments-destroy
      description: Delete an approval policy assignment.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_approval_policy_assignment:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.approval_policy_assignment at the top of this file.
      required: false
      description: Filter parameter for querying approval policy assignments.
    sort_approval_policy_assignment:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort approval policy assignment
      explode: false
      required: false
      description: Sort parameter for ordering approval policy assignments.
  requestBodies:
    approval_policy_assignment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      target_type:
                        $ref: '#/components/schemas/resource_approval_policy_assignment/properties/target_type'
      description: Request body for creating or updating an approval policy assignment.
  schemas:
    resource_approval_policy_assignment:
      type: object
      title: Approval policy assignment Resource
      properties:
        organization:
          title: Organization
          description: The organization this approval policy assignment belongs to.
          example:
            eq: value
        person:
          title: Person
          description: The person this assignment applies to, if the target is a person (for absence approvals).
          example:
            eq: value
        target_type:
          type: string
          title: Target Type
          description: 'The type of target this policy is assigned to: ''Person'' for absence approvals or ''Quote'' for budget approvals.'
          example:
            eq: active
        approval_policy:
          title: Approval Policy
          description: The approval policy assigned to this target.
          example:
            eq: value
        deal:
          title: Deal
          description: The budget (deal) this assignment applies to, if the target is a budget.
          example:
            eq: value
        target_id:
          type: integer
          title: Target
          description: The ID of the target record (person ID or budget ID) this policy is assigned to.
          example:
            - 123
      description: An approval policy assignment links an approval policy to a specific target (person or budget).
      example:
        id: '55'
        type: approval_policy_assignments
        attributes:
          created_at: '2023-01-01T00:00:00.000+01:00'
        relationships:
          organization:
            data:
              type: organizations
              id: '109'
          approval_policy:
            data:
              type: approval_policies
              id: '11'
          assignee:
            data:
              type: people
              id: '12'
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  responses:
    single_approval_policy_assignment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      target_type:
                        $ref: '#/components/schemas/resource_approval_policy_assignment/properties/target_type'
                  relationships:
                    type: object
                    properties:
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      person:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      approval_policy:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single approval policy assignment
    collection_approval_policy_assignment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        target_type:
                          $ref: '#/components/schemas/resource_approval_policy_assignment/properties/target_type'
                    relationships:
                      type: object
                      properties:
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        approval_policy:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection approval policy assignment
