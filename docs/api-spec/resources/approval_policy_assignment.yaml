openapi: 3.1.0
info:
  title: Productive.io API – Approval Policy Assignment
  version: 2.0.0
description: |-
  **Approval policy assignments** link an approval policy to a person, determining who approves their time entries, expenses, or absence requests. Each person can have different policies for different approval types.

  Manage assignments to configure the approval chain for individuals across your organization.
x-filters:
  approval_policy_assignment:
    target_id:
      description: Filter by the ID of the assigned target (person or deal/budget).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    target_type:
      description: Filter by the type of the assigned target (person, deal, or budget).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/approval_policy_assignments:
    get:
      tags:
        - Approval Policy Assignment
      summary: Get approval policy assignments
      operationId: approval_policy_assignments-index
      description: List approval policy assignments with optional filters and pagination.
      parameters:
        - $ref: '#/components/parameters/filter_approval_policy_assignment'
        - $ref: '#/components/parameters/sort_approval_policy_assignment'
      responses:
        '200':
          $ref: '#/components/responses/collection_approval_policy_assignment'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Approval Policy Assignment
      summary: Creates the approval policy assignment
      operationId: approval_policy_assignments-create
      description: Create a new approval policy assignment.
      requestBody:
        $ref: '#/components/requestBodies/approval_policy_assignment'
      responses:
        '201':
          $ref: '#/components/responses/single_approval_policy_assignment'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_approval_policy_assignment'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Approval Policy Assignment
      summary: Bulk deletes approval policy assignments
      description: |
        Deletes several approval policy assignments in one request. Requires the JSON:API bulk extension headers
        (`Content-Type` and `Accept`: `application/vnd.api+json; ext=bulk`). The same headers on
        `POST /api/v2/approval_policy_assignments` create several assignments at once, reusing the existing
        assignment of a target, and respond with a collection; validation errors then carry the index of the
        failing item in `meta.bulk_index`. Bulk create is not atomic: valid items are saved even when the
        response is 422, which lists only the failing items. Responds with not found when no requested
        assignment is visible.
      operationId: approval_policy_assignments-destroy-bulk
      requestBody:
        $ref: '#/components/requestBodies/approval_policy_assignment_bulk_delete'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/approval_policy_assignments/{id}:
    get:
      tags:
        - Approval Policy Assignment
      summary: Gets the approval policy assignment
      operationId: approval_policy_assignments-show
      description: Retrieve a single approval policy assignment by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy assignment to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/single_approval_policy_assignment'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Approval Policy Assignment
      summary: Updates the approval policy assignment
      operationId: approval_policy_assignments-update
      description: Update an approval policy assignment.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy assignment to update.
      requestBody:
        $ref: '#/components/requestBodies/approval_policy_assignment'
      responses:
        '200':
          $ref: '#/components/responses/single_approval_policy_assignment'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_approval_policy_assignment'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Approval Policy Assignment
      summary: Deletes the approval policy assignment
      operationId: approval_policy_assignments-destroy
      description: Delete an approval policy assignment.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy assignment to delete.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
