openapi: 3.1.0
info:
  title: Productive.io API – Approval Policy Assignment
  version: 2.0.0
description: |-
  **Approval policy assignments** link an approval policy to a person, determining who approves their time entries, expenses, or absence requests. Each person can have different policies for different approval types.

  Manage assignments to configure the approval chain for individuals across your organization.
x-filters:
  approval_policy_assignment:
    target_id:
      description: Filter by the ID of the assigned target (person or deal/budget).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    target_type:
      description: Filter by the type of the assigned target (person, deal, or budget).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/approval_policy_assignments:
    get:
      tags:
        - Approval Policy Assignment
      summary: Get approval policy assignments
      operationId: approval_policy_assignments-index
      description: List approval policy assignments with optional filters and pagination.
      parameters:
        - $ref: '#/components/parameters/sort_approval_policy_assignment'
        - $ref: '#/components/parameters/filter_approval_policy_assignment'
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/collection_approval_policy_assignment'
    post:
      tags:
        - Approval Policy Assignment
      summary: Creates the approval policy assignment
      operationId: approval_policy_assignments-create
      description: Create a new approval policy assignment.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/approval_policy_assignment'
      responses:
        '201':
          $ref: '#/components/responses/single_approval_policy_assignment'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/approval_policy_assignments/{id}:
    get:
      tags:
        - Approval Policy Assignment
      summary: Gets the approval policy assignment
      operationId: approval_policy_assignments-show
      description: Retrieve a single approval policy assignment by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy assignment to retrieve.
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_approval_policy_assignment'
    patch:
      tags:
        - Approval Policy Assignment
      summary: Updates the approval policy assignment
      operationId: approval_policy_assignments-update
      description: Update an approval policy assignment.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy assignment to update.
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/approval_policy_assignment'
      responses:
        '200':
          $ref: '#/components/responses/single_approval_policy_assignment'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
    delete:
      tags:
        - Approval Policy Assignment
      summary: Deletes the approval policy assignment
      operationId: approval_policy_assignments-destroy
      description: Delete an approval policy assignment.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy assignment to delete.
      responses:
        '204':
          description: No Content
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_approval_policy_assignment:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.approval_policy_assignment at the top of this file.
      required: false
      description: Filter parameter for querying approval policy assignments.
    sort_approval_policy_assignment:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort approval policy assignment
      explode: false
      required: false
      description: Sort parameter for ordering approval policy assignments.
  responses:
    single_approval_policy_assignment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single approval policy assignment record in JSON:API format.
            properties:
              meta:
                $ref: '#/components/schemas/_meta'
              data:
                type: object
                description: The approval policy assignment resource object.
                properties:
                  attributes:
                    type: object
                    description: Approval policy assignment attributes.
                    properties:
                      target_type:
                        $ref: '#/components/schemas/resource_approval_policy_assignment/properties/target_type'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Approval policy assignment relationships.
                    properties:
                      approval_policy:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      person:
                        $ref: '#/components/schemas/_single_relationship'
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                id: '45'
                type: approval_policy_assignments
                attributes:
                  created_at: '2026-01-15T10:00:00.000+00:00'
                relationships:
                  person:
                    data:
                      type: people
                      id: '12'
                  approval_policy:
                    data:
                      type: approval_policies
                      id: '7'
              included: []
      description: Single approval policy assignment
    collection_approval_policy_assignment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of approval policy assignment records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: An approval policy assignment resource object.
                  properties:
                    relationships:
                      type: object
                      description: Approval policy assignment relationships.
                      properties:
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        approval_policy:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                    attributes:
                      type: object
                      description: Approval policy assignment attributes.
                      properties:
                        target_type:
                          $ref: '#/components/schemas/resource_approval_policy_assignment/properties/target_type'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of approval policy assignment resource objects.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                - id: '45'
                  type: approval_policy_assignments
                  attributes:
                    created_at: '2026-01-15T10:00:00.000+00:00'
                  relationships:
                    person:
                      data:
                        type: people
                        id: '12'
                    approval_policy:
                      data:
                        type: approval_policies
                        id: '7'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection approval policy assignment
  schemas:
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    resource_approval_policy_assignment:
      type: object
      title: Approval policy assignment Resource
      description: An approval policy assignment links an approval policy to a specific target (person or budget).
      properties:
        deal:
          title: Deal
          description: The budget (deal) this assignment applies to, if the target is a budget.
          example:
            eq: value
        target_id:
          type: integer
          title: Target
          description: The ID of the target record (person ID or budget ID) this policy is assigned to.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this approval policy assignment belongs to.
          example:
            eq: value
        approval_policy:
          title: Approval Policy
          description: The approval policy assigned to this target.
          example:
            eq: value
        target_type:
          type: string
          title: Target Type
          description: 'The type of target this policy is assigned to: ''Person'' for absence approvals or ''Quote'' for budget approvals.'
          example:
            eq: active
        person:
          title: Person
          description: The person this assignment applies to, if the target is a person (for absence approvals).
          example:
            eq: value
      example:
        id: '55'
        type: approval_policy_assignments
        attributes:
          created_at: '2023-01-01T00:00:00.000+01:00'
        relationships:
          organization:
            data:
              type: organizations
              id: '109'
          approval_policy:
            data:
              type: approval_policies
              id: '11'
          assignee:
            data:
              type: people
              id: '12'
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  requestBodies:
    approval_policy_assignment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: JSON:API document containing the approval policy assignment data.
            properties:
              data:
                type: object
                description: The JSON:API data object containing the approval_policy_assignment resource attributes and relationships.
                properties:
                  attributes:
                    type: object
                    description: The attributes of the approval_policy_assignment resource to create or update.
                    properties:
                      target_type:
                        $ref: '#/components/schemas/resource_approval_policy_assignment/properties/target_type'
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: approval_policy_assignments
                relationships:
                  person:
                    data:
                      type: people
                      id: '12'
                  approval_policy:
                    data:
                      type: approval_policies
                      id: '7'
      description: Request body for creating or updating an approval policy assignment.
