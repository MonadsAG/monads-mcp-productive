          included: false
    _single_linkage_nullable:
      type: object
      title: Single nullable linkage
      properties:
        data:
          anyOf:
            - $ref: '#/components/schemas/_resource'
            - type: 'null'
      required:
        - data
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: string
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      required:
        - id
        - type
      example:
        type: tasks
        id: '42'
    resource_organization_champion:
      type: object
      title: Organization champion Resource
      properties:
        type_id:
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
            - 8
          type: integer
          title: Type
  requestBodies:
    organization_champion:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      person_id:
                        type: integer
                      type_id:
                        $ref: '#/components/schemas/resource_organization_champion/properties/type_id'
