            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    single_contract:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single contract record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned contract resource.
                properties:
                  attributes:
                    type: object
                    description: Contract attributes.
                    properties:
                      copy_expenses:
                        $ref: '#/components/schemas/resource_contract/properties/copy_expenses'
                      copy_purchase_order_number:
                        $ref: '#/components/schemas/resource_contract/properties/copy_purchase_order_number'
                      ends_on:
                        anyOf:
                          - $ref: '#/components/schemas/resource_contract/properties/ends_on'
                          - type: 'null'
                        description: The date when the contract ends, or null if ongoing.
                      interval_id:
                        $ref: '#/components/schemas/resource_contract/properties/interval_id'
                      next_occurrence_on:
                        anyOf:
                          - $ref: '#/components/schemas/resource_contract/properties/next_occurrence_on'
                          - type: 'null'
                        description: The date when the next budget period will be generated.
                      starts_on:
                        $ref: '#/components/schemas/resource_contract/properties/starts_on'
                      use_rollover_hours:
                        $ref: '#/components/schemas/resource_contract/properties/use_rollover_hours'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Contract relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      template:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '11'
                type: contracts
                attributes:
                  name: Master Services Agreement
                  status: active
                  start_date: '2026-01-01'
                  end_date: '2026-12-31'
                  created_at: '2026-01-01T00:00:00.000+00:00'
                relationships:
                  company:
                    data:
                      type: companies
                      id: '65111'
              included: []
      description: Single contract
    unprocessable_content_contract:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_contract'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      properties:
                        bulk_index:
                          type: integer
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
