          type: integer
          title: Id
          description: The unique identifier of this contract.
          example:
            - 123
        interval_id:
          type: integer
          title: Interval
          description: ID of the recurrence interval of this contract (alias for contract_interval_id).
          example:
            - 123
        next_occurrence_on:
          type: string
          title: Next Occurrence On
          format: date
          description: The date of the next occurrence.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this contract belongs to.
          example:
            eq: value
        starts_on:
          type: string
          title: Starts On
          format: date
          description: Date when this contract starts.
          example:
            eq: value
        template:
          title: Template
          description: The budget used as the template for generating new budgets from this contract.
          example:
            eq: value
        template_id:
          title: Template
          description: ID of the budget used as the template for generating new budgets from this contract.
          example:
            - 123
        use_rollover_hours:
          type: boolean
          title: Use Rollover Hours
          description: Whether to roll over unused hours.
          example:
            eq: value
        generate_until:
          type: string
          title: Generate Until
          format: date
          description: Optional. Generates every budget starting on or before this date (max 12) instead of just the next one.
      example:
        id: '11'
        type: contracts
        attributes:
          name: Master Services Agreement
          status: active
          start_date: '2026-01-01'
          end_date: '2026-12-31'
          created_at: '2026-01-01T00:00:00.000+00:00'
