openapi: 3.1.0
info:
  title: Productive.io API – Contracts
  version: 2.0.0
description: |-
  For more details on contracts please refer to the [help article](https://help.productive.io/en/articles/2179582-recurring-budgets).

  The contract object represents recurring financial commitments such as recurring budgets. Recurring commitments are either created automatically or triggered manually.

  Please note that we rate limit POST requests for generating recurring budgets to 50 requests per minute.
x-filters:
  contract:
    contract_interval_id:
      description: Filter by the associated contract interval.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    ends_on:
      description: Filter by contract end date range (`ends_on`).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by contract ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    next_occurrence_on:
      description: Filter by next occurrence date range (`next_occurrence_on`).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    starts_on:
      description: Filter by contract start date range (`starts_on`).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/contracts/generate:
    post:
      tags:
        - Contracts
      summary: Generates new budgets for several contracts
      description: |
        Generates budgets for several contracts in one request. Requires the JSON:API bulk extension
        header (`Content-Type: application/vnd.api+json; ext=bulk`); the single-contract endpoint lives
        at `/api/v2/contracts/{id}/generate`. Each item may carry its own `generate_until`, and the
        request generates at most 36 budgets in total, so it holds at most 36 contracts. Validation is
        all or nothing — when any contract is rejected, none of them generate. The generated budget
        IDs are returned under `meta.generated_budget_ids`, keyed by contract ID. When generation stops
        on a conflict partway through, the contracts before it stay generated and the 409 lists the
        budgets generated so far under the same keyed `meta.generated_budget_ids`.
      operationId: contracts-bulk-generate
      requestBody:
        $ref: '#/components/requestBodies/contract_bulk_generate'
      responses:
        '200':
          $ref: '#/components/responses/contract_bulk_generate'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_contract'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/contracts:
    get:
      tags:
        - Contracts
      summary: Get contracts
      operationId: contracts-index
      description: List contracts with optional filters and pagination.
      parameters:
        - $ref: '#/components/parameters/filter_contract'
        - $ref: '#/components/parameters/sort_contract'
      responses:
        '200':
          $ref: '#/components/responses/collection_contract'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Contracts
      summary: Create a contract
      operationId: contracts-create
      description: Create a new contract.
      requestBody:
        $ref: '#/components/requestBodies/contract'
      responses:
        '201':
          $ref: '#/components/responses/single_contract'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_contract'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/contracts/{id}:
    get:
      tags:
        - Contracts
      summary: Gets a contract
      operationId: contracts-show
      description: Retrieve a single contract by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_contract'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Contracts
      summary: Update a contract
      operationId: contracts-update
      description: Update a contract.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/contract'
      responses:
        '200':
          $ref: '#/components/responses/single_contract'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_contract'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Contracts
      summary: Deletes a contract
      operationId: contracts-destroy
      description: Delete a contract.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/contracts/{id}/generate:
    post:
      tags:
        - Contracts
      summary: Generates new budget
      operationId: contracts-generate-generate
      description: Generate a contract.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/contract_generate'
      responses:
        '200':
          $ref: '#/components/responses/contract_generate'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_contract'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/contracts/{id}/recalculate_rolled_over_time:
    patch:
      tags:
        - Contracts
      summary: Recalculate rolled over time
      description: |
        Schedules the recalculation of rolled over time for the contract's budgets when the contract uses
        rollover hours. An optional `deal_id` limits it to one budget of the contract.
      operationId: contracts-recalculate-rolled-over-time
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        deal_id:
                          type: integer
      responses:
        '200':
          $ref: '#/components/responses/single_contract'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unprocessable_content'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
