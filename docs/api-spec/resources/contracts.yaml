        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    conflict:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_conflict'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Conflict
    contract_generate:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      copy_expenses:
                        $ref: '#/components/schemas/resource_contract/properties/copy_expenses'
                      copy_purchase_order_number:
                        $ref: '#/components/schemas/resource_contract/properties/copy_purchase_order_number'
                      ends_on:
                        anyOf:
                          - $ref: '#/components/schemas/resource_contract/properties/ends_on'
                          - type: 'null'
                      interval_id:
                        $ref: '#/components/schemas/resource_contract/properties/interval_id'
                      next_occurrence_on:
                        anyOf:
                          - $ref: '#/components/schemas/resource_contract/properties/next_occurrence_on'
                          - type: 'null'
                      starts_on:
                        $ref: '#/components/schemas/resource_contract/properties/starts_on'
                      use_rollover_hours:
                        $ref: '#/components/schemas/resource_contract/properties/use_rollover_hours'
                  relationships:
                    type: object
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      template:
                        $ref: '#/components/schemas/_single_relationship'
              included:
                type: array
                items: {}
              meta:
                type: object
                properties:
                  generated_budget_ids:
                    type: array
                    items:
                      type: string
      description: Contract with the budgets the request generated
    collection_contract:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of contract records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A contract resource object.
                  properties:
                    attributes:
                      type: object
                      description: Contract attributes.
                      properties:
                        copy_expenses:
                          $ref: '#/components/schemas/resource_contract/properties/copy_expenses'
                        copy_purchase_order_number:
                          $ref: '#/components/schemas/resource_contract/properties/copy_purchase_order_number'
                        ends_on:
                          anyOf:
                            - $ref: '#/components/schemas/resource_contract/properties/ends_on'
                            - type: 'null'
                          description: Date when this contract ends.
                        interval_id:
                          $ref: '#/components/schemas/resource_contract/properties/interval_id'
                        next_occurrence_on:
                          anyOf:
                            - $ref: '#/components/schemas/resource_contract/properties/next_occurrence_on'
                            - type: 'null'
                          description: Date when the next rollover budget will be created.
                        starts_on:
                          $ref: '#/components/schemas/resource_contract/properties/starts_on'
                        use_rollover_hours:
                          $ref: '#/components/schemas/resource_contract/properties/use_rollover_hours'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Contract relationships.
                      properties:
                        organization:
