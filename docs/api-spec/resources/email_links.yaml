    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_single_linkage_nullable'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          required:
            - included
          example:
            included: false
      required:
        - meta
      example:
        meta:
          included: false
    _single_linkage_nullable:
      type: object
      title: Single nullable linkage
      properties:
        data:
          anyOf:
            - $ref: '#/components/schemas/_resource'
            - type: 'null'
      required:
        - data
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: string
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      required:
        - id
        - type
      example:
        type: tasks
        id: '42'
    resource_email_link:
      type: object
      title: Email link Resource
      properties:
        company_id:
          type: integer
          title: Company
        created_at:
          type: string
          title: Created At
          format: date-time
        creator:
          title: Creator
        deal_id:
          type: integer
          title: Deal
        email:
          title: Email
        email_id:
          type: integer
          title: Email
        id:
          type: integer
          title: Id
        invoice_id:
          type: integer
          title: Invoice
        linked_id:
          type: integer
          title: Linked
        linked_type:
          enum:
            - Deal
            - Invoice
            - Project
            - Task
            - Company
            - Person
          type: string
          title: Linked Type
        organization:
          title: Organization
        person_id:
          type: integer
          title: Person
        project_id:
          type: integer
          title: Project
        task_id:
          type: integer
          title: Task
