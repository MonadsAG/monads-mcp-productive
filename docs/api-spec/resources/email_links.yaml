openapi: 3.1.0
info:
  title: Productive.io API – Email Links
  version: 2.0.0
x-filters:
  email_link:
    company_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    email_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    invoice_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/email_links:
    get:
      tags:
        - Email Links
      summary: Get email links
      description: Lists the links between emails and the deals, invoices, projects, tasks, companies and people the person sees.
      operationId: email_links-index
      parameters:
        - $ref: '#/components/parameters/filter_email_link'
      responses:
        '200':
          $ref: '#/components/responses/collection_email_link'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Email Links
      summary: Create an email link
      description: Links an email of the person's mailbox to exactly one target. Only the mailbox owner links.
      operationId: email_links-create
      requestBody:
        $ref: '#/components/requestBodies/email_link'
      responses:
        '201':
          $ref: '#/components/responses/single_email_link'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_email_link'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/email_links/{id}:
    delete:
      tags:
        - Email Links
      summary: Delete an email link
      description: Unlinks the email from its target. Only the mailbox owner unlinks.
      operationId: email_links-destroy
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the email link.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
