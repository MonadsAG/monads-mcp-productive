                      project_id:
                        $ref: '#/components/schemas/resource_placeholder/properties/project_id'
                      type:
                        $ref: '#/components/schemas/resource_placeholder/properties/type'
                    example:
                      name: Senior Developer (renamed)
                      color: electric
                example:
                  type: placeholders
                  attributes:
                    name: Senior Developer (renamed)
                    color: electric
            example:
              data:
                type: placeholders
                attributes:
                  name: Senior Developer (renamed)
                  color: electric
      description: Request body for updating a placeholder. All attributes are optional; only provided attributes are changed.
