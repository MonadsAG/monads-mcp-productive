            type: object
            description: Request body for updating a placeholder.
            properties:
              data:
                type: object
                description: The placeholder resource object.
                properties:
                  attributes:
                    type: object
                    description: Placeholder attributes.
                    properties:
                      category:
                        $ref: '#/components/schemas/resource_placeholder/properties/category'
                      color:
                        $ref: '#/components/schemas/resource_placeholder/properties/color'
                      icon:
                        $ref: '#/components/schemas/resource_placeholder/properties/icon'
                      name:
