openapi: 3.1.0
info:
  title: Productive.io API – Placeholders
  version: 2.0.0
description: |-
  **Placeholders** are named person or date slots defined on a template project. When a project is created from the template, each placeholder is resolved to a concrete person or date, and the resolved value is applied wherever the placeholder is used.

  Not to be confused with placeholder people in resource planning — those are `people` records with the `placeholder` attribute.
x-filters:
  placeholder:
    category:
      description: Filter by placeholder category.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filter by creation date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    type:
      description: Filter by placeholder type.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Filter placeholders by name (text search on the name field).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    usage_project_id:
      description: Filter placeholders that are used in tasks or todos belonging to the specified project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/placeholders:
    get:
      tags:
        - Placeholders
      summary: Get placeholders
      operationId: placeholders-index
      description: Returns a paginated list of placeholders — named person or date slots defined on template projects. Supports filtering by name, category, type, and project, or by the project whose tasks and todos use the placeholder (`usage_project_id`).
      parameters:
        - $ref: '#/components/parameters/filter_placeholder'
        - $ref: '#/components/parameters/sort_placeholder'
      responses:
        '200':
          $ref: '#/components/responses/collection_placeholder'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Placeholders
      summary: Create a placeholder
      operationId: placeholders-create
      description: |-
        Creates a placeholder on a template project. Requires `name`, `category`, `type`, `color`, `icon`, and `project_id` — the project must be a template. The `type` determines what the placeholder resolves to when a project is created from the template: a person or a date.

        ### Create a person placeholder

        ```json
        {
          "data": {
            "type": "placeholders",
            "attributes": {
              "name": "Project Manager",
              "category": "project",
              "type": "person",
              "color": "electric",
              "icon": "icon-cowboy-hat-filled",
              "project_id": 7388870
            }
          }
        }
        ```

        ### Create a date placeholder

        ```json
        {
          "data": {
            "type": "placeholders",
            "attributes": {
              "name": "Kickoff date",
              "category": "project",
              "type": "date",
              "color": "canary",
              "icon": "icon-calendar",
              "project_id": 7388870
            }
          }
        }
        ```
      requestBody:
        $ref: '#/components/requestBodies/placeholder'
      responses:
        '201':
          $ref: '#/components/responses/single_placeholder'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_placeholder'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/placeholders/{id}:
    get:
      tags:
        - Placeholders
      summary: Gets a placeholder
      operationId: placeholders-show
      description: Returns a single placeholder by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the placeholder to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/single_placeholder'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Placeholders
      summary: Update a placeholder
      operationId: placeholders-update
      description: Updates a placeholder. Only the provided attributes are modified. The project can only be changed to another template project.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the placeholder to update.
      requestBody:
        $ref: '#/components/requestBodies/placeholder_update'
      responses:
        '200':
          $ref: '#/components/responses/single_placeholder'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_placeholder'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Placeholders
      summary: Deletes a placeholder
      operationId: placeholders-destroy
      description: Deletes a placeholder along with all of its placeholder usages.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the placeholder to delete.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
