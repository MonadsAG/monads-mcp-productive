        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_single_linkage_nullable'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          required:
            - included
          example:
            included: false
      required:
        - meta
      example:
        meta:
          included: false
    _single_linkage_nullable:
      type: object
      title: Single nullable linkage
      properties:
        data:
          anyOf:
            - $ref: '#/components/schemas/_resource'
            - type: 'null'
      required:
        - data
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: string
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      required:
        - id
        - type
      example:
        type: tasks
        id: '42'
    resource_placeholder:
      type: object
      title: Placeholder Resource
      description: A named person or date slot defined on a template project. Carries a name, category, type (person or date), and a color and icon for display. Resolved to a concrete person or date when a project is created from the template.
      properties:
        category:
          enum:
            - project
          type: string
          title: Category
          description: The category of this placeholder, indicating the context in which it is used (e.g. project).
          example:
            eq: active
        color:
          type: string
          title: Color
          description: The color identifier used to visually represent the placeholder. The API accepts any string — the Productive UI uses tokens from its color palette (e.g. `electric`).
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this placeholder was created.
          example:
            gt: '2026-01-01'
        icon:
          type: string
          title: Icon
          description: The icon identifier used to visually represent the placeholder. The API accepts any string — the Productive UI uses identifiers from its icon set (e.g. `icon-cowboy-hat-filled`).
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: The unique identifier of this placeholder.
          example:
            - 123
        name:
          type: string
          title: Name
          description: The display name of this placeholder (e.g. Frontend Developer).
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this placeholder belongs to.
          example:
            eq: value
        project:
          title: Project
          description: The template project this placeholder belongs to.
          example:
            eq: value
        project_id:
          type: integer
          title: Project
          description: ID of the template project this placeholder belongs to.
          example:
            - 123
        type:
          enum:
            - person
            - date
          type: string
          title: Type
          description: The type of placeholder, either person or date.
          example:
            eq: active
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when this placeholder was last updated.
          example:
            gt: '2026-01-01'
        query:
          type: string
          title: Query
          description: A text search query to filter placeholders by name.
          example:
            eq: value
        usage_project_id:
          type: integer
          title: Usage Project
          description: Filter placeholders to those used in tasks or todos within the specified project.
          example:
            - 123
      example:
        id: '88'
        type: placeholders
        attributes:
          name: Employee
          category: project
          color: electric
          icon: icon-cowboy-hat-filled
          type: person
          created_at: '2026-09-02T11:48:32.010+02:00'
          updated_at: '2026-09-02T11:48:42.251+02:00'
        relationships:
          organization:
            data:
              type: organizations
              id: '109'
          project:
            data:
              type: projects
              id: '7388870'
  requestBodies:
