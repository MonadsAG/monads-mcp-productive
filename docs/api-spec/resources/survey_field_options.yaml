openapi: 3.1.0
info:
  title: Productive.io API – Survey Field Options
  version: 2.0.0
description: Selectable options for dropdown and multi-select survey fields. Each option has a label and position for ordering in the dropdown.
x-filters:
  survey_field_option:
    archived:
      description: Filter to include only archived (or non-archived) field options.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_field_id:
      description: Filter by the associated custom field.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    survey_field_id:
      description: Filter by the associated survey field.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/survey_field_options/{id}/archive:
    patch:
      tags:
        - Survey Field Options
      summary: Archives a survey field option
      operationId: survey_field_options-archive-archive
      description: Archive a survey field option to deactivate it.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the survey field option to archive.
      responses:
        '200':
          $ref: '#/components/responses/single_survey_field_option'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/survey_field_options:
    get:
      tags:
        - Survey Field Options
      summary: Get survey field options
      operationId: survey_field_options-index
      description: List all survey field options.
      parameters:
        - $ref: '#/components/parameters/filter_survey_field_option'
        - $ref: '#/components/parameters/sort_survey_field_option'
      responses:
        '200':
          $ref: '#/components/responses/collection_survey_field_option'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Survey Field Options
      summary: Creates a survey field option
      operationId: survey_field_options-create
      description: Create a new survey field option.
      requestBody:
        $ref: '#/components/requestBodies/survey_field_option'
      responses:
        '201':
          $ref: '#/components/responses/single_survey_field_option'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_survey_field_option'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/survey_field_options/{id}:
    get:
      tags:
        - Survey Field Options
      summary: Gets a survey field option
      operationId: survey_field_options-show
      description: Retrieve a single survey field option by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the survey field option to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/single_survey_field_option'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Survey Field Options
      summary: Updates a survey field option
      operationId: survey_field_options-update
      description: Update a survey field option.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the survey field option to update.
      requestBody:
        $ref: '#/components/requestBodies/survey_field_option'
      responses:
        '200':
          $ref: '#/components/responses/single_survey_field_option'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_survey_field_option'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
