openapi: 3.1.0
info:
  title: Productive.io API – Survey Field Options
  version: 2.0.0
description: Selectable options for dropdown and multi-select survey fields. Each option has a label and position for ordering in the dropdown.
x-filters:
  survey_field_option:
    survey_field_id:
      description: Filter by the associated survey field.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_field_id:
      description: Filter by the associated custom field.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    archived:
      description: Filter to include only archived (or non-archived) field options.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/survey_field_options/{id}/archive:
    patch:
      tags:
        - Survey Field Options
      summary: Archives a survey field option
      operationId: survey_field_options-archive-archive
      description: Archive a survey field option to deactivate it.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the survey field option to archive.
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_survey_field_option'
  /api/v2/survey_field_options:
    get:
      tags:
        - Survey Field Options
      summary: Get survey field options
      operationId: survey_field_options-index
      description: List all survey field options.
      parameters:
        - $ref: '#/components/parameters/filter_survey_field_option'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_survey_field_option'
      responses:
        '200':
          $ref: '#/components/responses/collection_survey_field_option'
    post:
      tags:
        - Survey Field Options
      summary: Creates a survey field option
      operationId: survey_field_options-create
      description: Create a new survey field option.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/survey_field_option'
      responses:
        '201':
          $ref: '#/components/responses/single_survey_field_option'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/survey_field_options/{id}:
    get:
      tags:
        - Survey Field Options
      summary: Gets a survey field option
      operationId: survey_field_options-show
      description: Retrieve a single survey field option by ID.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the survey field option to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/single_survey_field_option'
    patch:
      tags:
        - Survey Field Options
      summary: Updates a survey field option
      operationId: survey_field_options-update
      description: Update a survey field option.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the survey field option to update.
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/survey_field_option'
      responses:
        '200':
          $ref: '#/components/responses/single_survey_field_option'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
components:
  responses:
    single_survey_field_option:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single survey_field_option record in JSON:API format.
            properties:
              meta:
                $ref: '#/components/schemas/_meta'
              data:
                type: object
                description: The JSON:API data object for the returned survey_field_option resource.
                properties:
                  relationships:
                    type: object
                    description: Survey field option relationships.
                    properties:
                      survey_field:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                  attributes:
                    type: object
                    description: Survey field option attributes.
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_survey_field_option/properties/name'
                      color_id:
                        $ref: '#/components/schemas/resource_survey_field_option/properties/color_id'
                      archived_at:
                        $ref: '#/components/schemas/resource_survey_field_option/properties/archived_at'
                      position:
                        $ref: '#/components/schemas/resource_survey_field_option/properties/position'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                id: '123'
                type: survey_field_options
                attributes:
                  label: Very Satisfied
                  value: '5'
                  position: 1
                relationships:
                  survey_field:
                    data:
                      type: survey_fields
                      id: '45'
              included: []
      description: Single survey field option
    collection_survey_field_option:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of survey field option records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A survey field option resource object.
                  properties:
                    relationships:
                      type: object
                      description: Survey field option relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        survey_field:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                    attributes:
                      type: object
                      description: Survey field option attributes.
                      properties:
                        archived_at:
                          $ref: '#/components/schemas/resource_survey_field_option/properties/archived_at'
                        name:
                          $ref: '#/components/schemas/resource_survey_field_option/properties/name'
                        color_id:
                          $ref: '#/components/schemas/resource_survey_field_option/properties/color_id'
                        position:
                          $ref: '#/components/schemas/resource_survey_field_option/properties/position'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of survey field option resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '123'
                  type: survey_field_options
                  attributes:
                    label: Very Satisfied
                    value: '5'
                    position: 1
                  relationships:
                    survey_field:
                      data:
                        type: survey_fields
                        id: '45'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection survey field option
  schemas:
    resource_survey_field_option:
      type: object
      title: Survey field option Resource
      description: Selectable option for a dropdown or multi-select survey field. Has a label and position for ordering.
      properties:
        archived:
          type: boolean
          title: Archived
          description: Whether this option has been archived.
          example: true
        position:
          type: integer
          title: Position
          description: The display order position of this option within the survey field.
          example:
            eq: value
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this option was archived, or null if not archived.
          example:
            gt: '2026-01-01'
        survey_field:
          title: Survey Field
          description: The survey field this option belongs to.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The display label for this answer option.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this option belongs to.
          example:
            eq: value
        color_id:
          type: integer
          title: Color
          description: ID of the color associated with this option.
          example:
            - 123
        survey_field_id:
          type: integer
          title: Survey Field
          description: ID of the survey field this option belongs to.
          example:
            - 123
        custom_field_id:
          type: integer
          title: Custom Field
          description: ID of the survey field this option belongs to.
          example:
            - 123
      example:
        id: '123'
        type: survey_field_options
        attributes:
          label: Very Satisfied
          value: '5'
          position: 1
        relationships: {}
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  requestBodies:
    survey_field_option:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a survey field option.
            properties:
              data:
                type: object
                description: The survey field option resource object.
                properties:
                  attributes:
                    type: object
                    description: Survey field option attributes.
                    properties:
                      survey_field_id:
                        $ref: '#/components/schemas/resource_survey_field_option/properties/survey_field_id'
                      position:
                        $ref: '#/components/schemas/resource_survey_field_option/properties/position'
                      color_id:
                        $ref: '#/components/schemas/resource_survey_field_option/properties/color_id'
                      name:
                        $ref: '#/components/schemas/resource_survey_field_option/properties/name'
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: survey_field_options
                attributes:
                  label: Very Satisfied
                  value: '5'
                relationships:
                  survey_field:
                    data:
                      type: survey_fields
                      id: '45'
      description: Request body for creating or updating a survey field option. Specify the parent survey field, option label, and position.
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_survey_field_option:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort survey field option
      explode: false
      required: false
      description: The sort survey field option.
    filter_survey_field_option:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.survey_field_option at the top of this file.
      required: false
      description: Filter parameter for querying survey field options.
