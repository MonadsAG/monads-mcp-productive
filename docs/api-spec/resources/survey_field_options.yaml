    single_survey_field_option:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single survey_field_option record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned survey_field_option resource.
                properties:
                  attributes:
                    type: object
                    description: Survey field option attributes.
                    properties:
                      archived_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_survey_field_option/properties/archived_at'
                          - type: 'null'
                        description: The timestamp when this option was archived, or null if active.
                      color_id:
                        anyOf:
                          - type: string
                          - type: 'null'
                        description: The color identifier for this option.
                      name:
                        $ref: '#/components/schemas/resource_survey_field_option/properties/name'
                      position:
                        $ref: '#/components/schemas/resource_survey_field_option/properties/position'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Survey field option relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      survey_field:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '123'
                type: survey_field_options
                attributes:
                  label: Very Satisfied
                  value: '5'
                  position: 1
                relationships:
                  survey_field:
                    data:
                      type: survey_fields
                      id: '45'
              included: []
      description: Single survey field option
    collection_survey_field_option:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of survey field option records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A survey field option resource object.
                  properties:
                    attributes:
                      type: object
                      description: Survey field option attributes.
                      properties:
                        archived_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_survey_field_option/properties/archived_at'
                            - type: 'null'
                          description: Timestamp when this option was archived.
                        color_id:
                          anyOf:
                            - type: string
                            - type: 'null'
                          description: The color identifier for this option.
                        name:
                          $ref: '#/components/schemas/resource_survey_field_option/properties/name'
                        position:
                          $ref: '#/components/schemas/resource_survey_field_option/properties/position'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Survey field option relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        survey_field:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of survey field option resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '123'
                  type: survey_field_options
                  attributes:
                    label: Very Satisfied
                    value: '5'
                    position: 1
                  relationships:
                    survey_field:
                      data:
                        type: survey_fields
                        id: '45'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection survey field option
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
