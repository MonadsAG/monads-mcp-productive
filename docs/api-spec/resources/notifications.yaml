openapi: 3.1.0
info:
  title: Productive.io API – Notifications
  version: 2.0.0
description: |-
  **Notifications** are inbox items generated by activity on tasks, deals, comments, and other resources — triggered by mentions, assignments, approval requests, and status changes.

  List a user's notifications and mark them as read through these endpoints.
x-filters:
  notification:
    mention:
      description: Filter to include only notifications that are direct mentions.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    after:
      description: Filter by after.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    date_after:
      description: Filter notifications where the last action occurred on or after this date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    date_before:
      description: Filter notifications where the last action occurred on or before this date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_action_at:
      description: Filter by the timestamp of the last action triggering this notification.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    dismissed:
      description: Filter to include only dismissed (or non-dismissed) notifications.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter to notifications related to tasks or todos in the given project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    before:
      description: Filter by before.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    type:
      description: Filter by notification type (the resource type that triggered the notification).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    important:
      description: Filter to include only high-importance notifications.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/notifications/{id}/dismiss:
    patch:
      tags:
        - Notifications
      summary: Dismisses a notification
      responses:
        '200':
          $ref: '#/components/responses/single_notification'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: notifications-dismiss-dismiss
      description: Dismiss a notification.
  /api/v2/notifications:
    get:
      tags:
        - Notifications
      summary: Get notifications
      responses:
        '200':
          $ref: '#/components/responses/collection_notification'
      parameters:
        - $ref: '#/components/parameters/filter_notification'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_notification'
      operationId: notifications-index
      description: List notifications.
  /api/v2/notifications/{id}/read:
    patch:
      tags:
        - Notifications
      summary: Reads a notification
      responses:
        '200':
          $ref: '#/components/responses/single_notification'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: notifications-read-read
      description: Mark a notification as read.
  /api/v2/notifications/{id}:
    get:
      tags:
        - Notifications
      summary: Shows a notification
      responses:
        '200':
          $ref: '#/components/responses/single_notification'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: notifications-show
      description: Retrieve a single notification.
  /api/v2/notifications/{id}/undismiss:
    patch:
      tags:
        - Notifications
      summary: Undismisses a notification
      responses:
        '200':
          $ref: '#/components/responses/single_notification'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: notifications-undismiss-undismiss
      description: Restore a dismissed notification to the inbox.
  /api/v2/notifications/{id}/unread:
    patch:
      tags:
        - Notifications
      summary: Marks a notification as unread
      responses:
        '200':
          $ref: '#/components/responses/single_notification'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - $ref: '#/components/parameters/header_organization'
      operationId: notifications-unread-unread
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_notification:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort notification
      explode: false
      required: false
      description: Sort notification
    filter_notification:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.notification at the top of this file.
      required: false
      description: Filters
  responses:
    single_notification:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      read:
                        $ref: '#/components/schemas/resource_notification/properties/read'
                      title:
                        $ref: '#/components/schemas/resource_notification/properties/title'
                      excerpt:
                        $ref: '#/components/schemas/resource_notification/properties/excerpt'
                      mention:
                        $ref: '#/components/schemas/resource_notification/properties/mention'
                      root_id:
                        $ref: '#/components/schemas/resource_notification/properties/root_id'
                      changeset:
                        $ref: '#/components/schemas/resource_notification/properties/changeset'
                      dismissed:
                        $ref: '#/components/schemas/resource_notification/properties/dismissed'
                      important:
                        $ref: '#/components/schemas/resource_notification/properties/important'
                      parent_id:
                        $ref: '#/components/schemas/resource_notification/properties/parent_id'
                      root_type:
                        $ref: '#/components/schemas/resource_notification/properties/root_type'
                      target_id:
                        $ref: '#/components/schemas/resource_notification/properties/target_id'
                      parent_type:
                        $ref: '#/components/schemas/resource_notification/properties/parent_type'
                      target_type:
                        $ref: '#/components/schemas/resource_notification/properties/target_type'
                      parent_title:
                        $ref: '#/components/schemas/resource_notification/properties/parent_title'
                      target_label:
                        $ref: '#/components/schemas/resource_notification/properties/target_label'
                      target_title:
                        $ref: '#/components/schemas/resource_notification/properties/target_title'
                      last_action_at:
                        $ref: '#/components/schemas/resource_notification/properties/last_action_at'
                      made_by_automation:
                        $ref: '#/components/schemas/resource_notification/properties/made_by_automation'
                      new_activities_count:
                        $ref: '#/components/schemas/resource_notification/properties/new_activities_count'
                      first_unread_activity_id:
                        $ref: '#/components/schemas/resource_notification/properties/first_unread_activity_id'
                  relationships:
                    type: object
                    properties:
                      actor:
                        $ref: '#/components/schemas/_single_relationship'
                      owner:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single notification
    collection_notification:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        read:
                          $ref: '#/components/schemas/resource_notification/properties/read'
                        title:
                          $ref: '#/components/schemas/resource_notification/properties/title'
                        excerpt:
                          $ref: '#/components/schemas/resource_notification/properties/excerpt'
                        mention:
                          $ref: '#/components/schemas/resource_notification/properties/mention'
                        root_id:
                          $ref: '#/components/schemas/resource_notification/properties/root_id'
                        changeset:
                          $ref: '#/components/schemas/resource_notification/properties/changeset'
                        dismissed:
                          $ref: '#/components/schemas/resource_notification/properties/dismissed'
                        important:
                          $ref: '#/components/schemas/resource_notification/properties/important'
                        parent_id:
                          $ref: '#/components/schemas/resource_notification/properties/parent_id'
                        root_type:
                          $ref: '#/components/schemas/resource_notification/properties/root_type'
                        target_id:
                          $ref: '#/components/schemas/resource_notification/properties/target_id'
                        parent_type:
                          $ref: '#/components/schemas/resource_notification/properties/parent_type'
                        target_type:
                          $ref: '#/components/schemas/resource_notification/properties/target_type'
                        parent_title:
                          $ref: '#/components/schemas/resource_notification/properties/parent_title'
                        target_label:
                          $ref: '#/components/schemas/resource_notification/properties/target_label'
                        target_title:
                          $ref: '#/components/schemas/resource_notification/properties/target_title'
                        last_action_at:
                          $ref: '#/components/schemas/resource_notification/properties/last_action_at'
                        made_by_automation:
                          $ref: '#/components/schemas/resource_notification/properties/made_by_automation'
                        new_activities_count:
                          $ref: '#/components/schemas/resource_notification/properties/new_activities_count'
                        first_unread_activity_id:
                          $ref: '#/components/schemas/resource_notification/properties/first_unread_activity_id'
                    relationships:
                      type: object
                      properties:
                        actor:
                          $ref: '#/components/schemas/_single_relationship'
                        owner:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection notification
  schemas:
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    resource_notification:
      type: object
      title: Notification Resource
      properties:
        excerpt:
          title: Excerpt
          description: A short preview of the content that triggered this notification.
          example:
            eq: value
        new_activities_count:
          title: New Activities Count
          description: The number of new activity events since the notification was last read.
          example:
            gt: 0
        changeset:
          title: Changeset
          description: A summary of the field changes that triggered this notification.
          example:
            eq: value
        target_id:
          type: integer
          title: Target
          description: The ID of the target resource this notification is about.
          example:
            - 123
        title:
          title: Title
          description: The localized title text describing what happened in this notification.
          example:
            eq: value
        target_title:
          title: Target Title
          description: The display name of the target resource this notification is about.
          example:
            eq: value
        last_action_at:
          type: string
          title: Last Action At
          format: date-time
          description: Timestamp of the most recent activity that updated this notification.
          example:
            gt: '2026-01-01'
        target_label:
          title: Target Label
          description: A human-readable label for the notification target type (e.g. 'budget' for production pipeline deals).
          example:
            eq: value
        date_after:
          type: string
          title: Date After
          format: date
          description: The end of the date range for filtering notification activity.
          example:
            eq: value
        project_id:
          type: integer
          title: Project
          description: The ID of the project associated with the notification target.
          example:
            - 123
        after:
          type: string
          title: After
          format: date-time
          description: The value of the changed field after the action that triggered this notification.
          example:
            eq: value
        target_type:
          type: string
          title: Target Type
          description: The type of the target resource this notification is about (e.g. task, deal, project).
          example:
            eq: active
        first_unread_activity_id:
          type: integer
          title: First Unread Activity
          description: ID of the first unread activity in this notification thread.
          example:
            - 123
        id:
          type: integer
          title: Id
          description: Unique identifier for the notification.
          example:
            - 123
        actor:
          title: Actor
          description: The person who performed the action that triggered this notification.
          example:
            eq: value
        parent_id:
          type: integer
          title: Parent
          description: The ID of the parent resource containing the notification target (e.g. project ID for a task).
          example:
            - 123
        type:
          type: string
          title: Type
          description: Filters notifications by the target resource type (e.g. task, deal, project, page, invoice).
          example:
            eq: active
        organization:
          title: Organization
          description: The organization this notification belongs to.
          example:
            eq: value
        date_before:
          type: string
          title: Date Before
          format: date
          description: The start of the date range for filtering notification activity.
          example:
            eq: value
        parent_type:
          title: Parent Type
          description: The type of the parent resource containing the notification target.
          example:
            eq: active
        important:
          type: boolean
          title: Important
          description: When true, this notification is marked as important and shown prominently in the inbox.
          example:
            eq: value
        root_type:
          title: Root Type
          description: The type of the root resource this notification traces back to.
          example:
            eq: active
        parent_title:
          title: Parent Title
          description: The display name of the parent resource containing the notification target.
          example:
            eq: value
        dismissed:
          type: boolean
          title: Dismissed
          description: When true, this notification has been dismissed by the user.
          example:
            eq: value
        owner:
          title: Owner
          description: The organization membership (inbox) that owns this notification.
          example:
            eq: value
        root_id:
          type: integer
          title: Root
          description: The ID of the root resource this notification traces back to (e.g. for shared report membership).
          example:
            - 123
        mention:
          type: boolean
          title: Mention
          description: When true, the current user was directly mentioned in the content that triggered this notification.
          example:
            eq: value
        made_by_automation:
          title: Made By Automation
          description: When true, this notification was triggered by an automation rule rather than a person.
          example:
            eq: value
        before:
          type: string
          title: Before
          format: date-time
          description: The value of the changed field before the action that triggered this notification.
          example:
            eq: value
        read:
          type: boolean
          title: Read
          description: When true, the current user has read this notification.
          example:
            eq: value
      description: An inbox notification for a user about changes to subscribed entities.
      example:
        id: '123'
        type: notifications
        attributes:
          message: You have been assigned to a task
          read: false
          created_at: '2026-01-15T10:00:00Z'
        relationships: {}
