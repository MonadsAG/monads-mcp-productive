    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_single_linkage_nullable'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          required:
            - included
          example:
            included: false
      required:
        - meta
      example:
        meta:
          included: false
    _single_linkage_nullable:
      type: object
      title: Single nullable linkage
      properties:
        data:
          anyOf:
            - $ref: '#/components/schemas/_resource'
            - type: 'null'
      required:
        - data
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: string
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      required:
        - id
        - type
      example:
        type: tasks
        id: '42'
    resource_notification:
      type: object
      title: Notification Resource
      description: An inbox notification for a user about changes to subscribed entities.
      properties:
        actor:
          title: Actor
          description: The person who performed the action that triggered this notification.
          example:
            eq: value
        after:
          type: string
          title: After
          format: date-time
          description: The value of the changed field after the action that triggered this notification.
          example:
            eq: value
        before:
          type: string
          title: Before
          format: date-time
          description: The value of the changed field before the action that triggered this notification.
          example:
            eq: value
        changeset:
          title: Changeset
          description: A summary of the field changes that triggered this notification.
          example:
            eq: value
        date_after:
          type: string
          title: Date After
          format: date
          description: The end of the date range for filtering notification activity.
          example:
            eq: value
        date_before:
          type: string
          title: Date Before
          format: date
          description: The start of the date range for filtering notification activity.
          example:
            eq: value
        dismissed:
          type: boolean
          title: Dismissed
          description: When true, this notification has been dismissed by the user.
          example:
            eq: value
        excerpt:
          title: Excerpt
          description: A short preview of the content that triggered this notification.
          example:
            eq: value
        first_unread_activity_id:
          type: integer
          title: First Unread Activity
          description: ID of the first unread activity in this notification thread.
          example:
            - 123
        id:
          type: integer
          title: Id
          description: Unique identifier for the notification.
          example:
            - 123
        important:
          type: boolean
          title: Important
          description: When true, this notification is marked as important and shown prominently in the inbox.
          example:
            eq: value
        last_action_at:
          type: string
          title: Last Action At
          format: date-time
          description: Timestamp of the most recent activity that updated this notification.
          example:
            gt: '2026-01-01'
        made_by_automation:
          title: Made By Automation
          description: When true, this notification was triggered by an automation rule rather than a person.
          example:
            eq: value
        mention:
          type: boolean
          title: Mention
          description: When true, the current user was directly mentioned in the content that triggered this notification.
          example:
            eq: value
        new_activities_count:
          title: New Activities Count
          description: The number of new activity events since the notification was last read.
          example:
            gt: 0
        organization:
          title: Organization
          description: The organization this notification belongs to.
          example:
            eq: value
        owner:
          title: Owner
          description: The organization membership (inbox) that owns this notification.
          example:
            eq: value
        parent_id:
          type: integer
          title: Parent
          description: The ID of the parent resource containing the notification target (e.g. project ID for a task).
          example:
            - 123
        parent_title:
          title: Parent Title
          description: The display name of the parent resource containing the notification target.
          example:
            eq: value
        parent_type:
          title: Parent Type
          description: The type of the parent resource containing the notification target.
          example:
            eq: active
        project_id:
          type: integer
          title: Project
          description: The ID of the project associated with the notification target.
          example:
            - 123
        read:
          type: boolean
          title: Read
          description: When true, the current user has read this notification.
          example:
            eq: value
        root_id:
          type: integer
          title: Root
          description: The ID of the root resource this notification traces back to (e.g. for shared report membership).
          example:
            - 123
        root_type:
          title: Root Type
          description: The type of the root resource this notification traces back to.
          example:
            eq: active
        target_id:
          type: integer
          title: Target
          description: The ID of the target resource this notification is about.
          example:
            - 123
        target_label:
          title: Target Label
          description: A human-readable label for the notification target type (e.g. 'budget' for production pipeline deals).
          example:
            eq: value
        target_title:
          title: Target Title
          description: The display name of the target resource this notification is about.
          example:
            eq: value
        target_type:
          type: string
          title: Target Type
          description: The type of the target resource this notification is about (e.g. task, deal, project).
          example:
            eq: active
        title:
          title: Title
          description: The localized title text describing what happened in this notification.
          example:
            eq: value
        type:
          type: string
          title: Type
          description: Filters notifications by the target resource type (e.g. task, deal, project, page, invoice).
          example:
            eq: active
        agent_session_status:
          title: Agent Session Status
          description: What happened in an agent chat ("has finished"); null for other targets
      example:
        id: '123'
        type: notifications
        attributes:
          message: You have been assigned to a task
          read: false
          created_at: '2026-01-15T10:00:00Z'
        relationships: {}
