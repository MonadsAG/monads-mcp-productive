openapi: 3.1.0
info:
  title: Productive.io API – Notifications
  version: 2.0.0
description: |-
  **Notifications** are inbox items generated by activity on tasks, deals, comments, and other resources — triggered by mentions, assignments, approval requests, and status changes.

  List a user's notifications and mark them as read through these endpoints.
x-filters:
  notification:
    after:
      description: Filter by after.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    before:
      description: Filter by before.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    date_after:
      description: Filter notifications where the last action occurred on or after this date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    date_before:
      description: Filter notifications where the last action occurred on or before this date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    dismissed:
      description: Filter to include only dismissed (or non-dismissed) notifications.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    important:
      description: Filter to include only high-importance notifications.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    mention:
      description: Filter to include only notifications that are direct mentions.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter to notifications related to tasks or todos in the given project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    type:
      description: Filter by notification type (the resource type that triggered the notification).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_action_at:
      description: Filter by the timestamp of the last action triggering this notification.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/notifications/{id}/dismiss:
    patch:
      tags:
        - Notifications
      summary: Dismisses a notification
      operationId: notifications-dismiss-dismiss
      description: Dismiss a notification.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_notification'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/notifications:
    get:
      tags:
        - Notifications
      summary: Get notifications
      operationId: notifications-index
      description: List notifications.
      parameters:
        - $ref: '#/components/parameters/filter_notification'
        - $ref: '#/components/parameters/sort_notification'
      responses:
        '200':
          $ref: '#/components/responses/collection_notification'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/notifications/{id}/read:
    patch:
      tags:
        - Notifications
      summary: Reads a notification
      operationId: notifications-read-read
      description: Mark a notification as read.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_notification'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/notifications/{id}:
    get:
      tags:
        - Notifications
      summary: Shows a notification
      operationId: notifications-show
      description: Retrieve a single notification.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_notification'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/notifications/{id}/undismiss:
    patch:
      tags:
        - Notifications
      summary: Undismisses a notification
      operationId: notifications-undismiss-undismiss
      description: Restore a dismissed notification to the inbox.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_notification'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/notifications/{id}/unread:
    patch:
      tags:
        - Notifications
      summary: Marks a notification as unread
      operationId: notifications-unread-unread
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_notification'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    single_notification:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single notification record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned notification resource.
                properties:
                  attributes:
                    type: object
                    description: Notification attributes.
                    properties:
                      changeset:
                        $ref: '#/components/schemas/resource_notification/properties/changeset'
                      dismissed:
                        $ref: '#/components/schemas/resource_notification/properties/dismissed'
                      excerpt:
                        $ref: '#/components/schemas/resource_notification/properties/excerpt'
                      first_unread_activity_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_notification/properties/first_unread_activity_id'
                          - type: 'null'
                        description: ID of the first unread activity in this notification thread.
                      important:
                        $ref: '#/components/schemas/resource_notification/properties/important'
                      last_action_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_notification/properties/last_action_at'
                          - type: 'null'
                        description: The date and time of the most recent activity that triggered this notification.
                      made_by_automation:
                        $ref: '#/components/schemas/resource_notification/properties/made_by_automation'
                      mention:
                        $ref: '#/components/schemas/resource_notification/properties/mention'
                      new_activities_count:
                        $ref: '#/components/schemas/resource_notification/properties/new_activities_count'
                      parent_id:
                        anyOf:
                          - type: integer
                          - type: string
                          - type: 'null'
                        description: The ID of the parent resource of the notification target.
                      parent_title:
                        $ref: '#/components/schemas/resource_notification/properties/parent_title'
                      parent_type:
                        $ref: '#/components/schemas/resource_notification/properties/parent_type'
                      read:
                        $ref: '#/components/schemas/resource_notification/properties/read'
                      root_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_notification/properties/root_id'
                          - type: 'null'
                        description: The ID of the root ancestor resource in the notification hierarchy.
                      root_type:
                        $ref: '#/components/schemas/resource_notification/properties/root_type'
                      target_id:
                        $ref: '#/components/schemas/resource_notification/properties/target_id'
                      target_label:
                        $ref: '#/components/schemas/resource_notification/properties/target_label'
                      target_title:
                        $ref: '#/components/schemas/resource_notification/properties/target_title'
                      target_type:
                        $ref: '#/components/schemas/resource_notification/properties/target_type'
                      title:
                        $ref: '#/components/schemas/resource_notification/properties/title'
                      agent_session_status:
                        $ref: '#/components/schemas/resource_notification/properties/agent_session_status'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Notification relationships.
                    properties:
                      actor:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      owner:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '9012'
                type: notifications
                attributes:
                  target_id: 120501
                  target_type: task
                  target_title: '#42: Implement user authentication'
                  target_label: task
                  parent_id: 6899
                  parent_type: project
                  parent_title: Website Redesign
                  title: Alex Smith changed the status to In Progress
                  read: false
                  dismissed: false
                  new_activities_count: 1
                  excerpt: Status changed from Open to In Progress
                  last_action_at: '2026-03-15T10:30:00.000+00:00'
                  first_unread_activity_id: 259275372
                  important: false
                  mention: false
                  made_by_automation: false
                  root_id: 6899
                  root_type: project
                relationships:
                  actor:
                    data:
                      type: people
                      id: '12'
              included: []
      description: Single notification
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    collection_notification:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of notification records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A notification resource object.
                  properties:
                    attributes:
                      type: object
                      description: Notification attributes.
                      properties:
                        changeset:
                          $ref: '#/components/schemas/resource_notification/properties/changeset'
                        dismissed:
                          $ref: '#/components/schemas/resource_notification/properties/dismissed'
                        excerpt:
                          $ref: '#/components/schemas/resource_notification/properties/excerpt'
                        first_unread_activity_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_notification/properties/first_unread_activity_id'
                            - type: 'null'
                          description: ID of the first unread activity in this notification thread.
                        important:
                          $ref: '#/components/schemas/resource_notification/properties/important'
                        last_action_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_notification/properties/last_action_at'
                            - type: 'null'
                          description: Timestamp of the last action that generated this notification.
                        made_by_automation:
                          $ref: '#/components/schemas/resource_notification/properties/made_by_automation'
                        mention:
                          $ref: '#/components/schemas/resource_notification/properties/mention'
                        new_activities_count:
                          $ref: '#/components/schemas/resource_notification/properties/new_activities_count'
                        parent_id:
                          anyOf:
                            - type: integer
                            - type: string
                            - type: 'null'
                          description: The ID of the parent resource (e.g. the project containing a task).
                        parent_title:
                          $ref: '#/components/schemas/resource_notification/properties/parent_title'
                        parent_type:
                          $ref: '#/components/schemas/resource_notification/properties/parent_type'
                        read:
                          $ref: '#/components/schemas/resource_notification/properties/read'
                        root_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_notification/properties/root_id'
                            - type: 'null'
                          description: The ID of the root resource (e.g. the top-level container).
                        root_type:
                          $ref: '#/components/schemas/resource_notification/properties/root_type'
                        target_id:
                          $ref: '#/components/schemas/resource_notification/properties/target_id'
                        target_label:
                          $ref: '#/components/schemas/resource_notification/properties/target_label'
                        target_title:
                          $ref: '#/components/schemas/resource_notification/properties/target_title'
                        target_type:
                          $ref: '#/components/schemas/resource_notification/properties/target_type'
                        title:
                          $ref: '#/components/schemas/resource_notification/properties/title'
                        agent_session_status:
                          $ref: '#/components/schemas/resource_notification/properties/agent_session_status'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Notification relationships.
                      properties:
                        actor:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        owner:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of notification resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '9012'
                  type: notifications
                  attributes:
                    target_id: 120501
                    target_type: task
                    target_title: '#42: Implement user authentication'
                    target_label: task
                    parent_id: 6899
                    parent_type: project
                    parent_title: Website Redesign
                    title: Alex Smith changed the status to In Progress
                    read: false
                    dismissed: false
                    new_activities_count: 1
                    excerpt: Status changed from Open to In Progress
                    last_action_at: '2026-03-15T10:30:00.000+00:00'
                    first_unread_activity_id: 259275372
                    important: false
                    mention: false
                    made_by_automation: false
                    root_id: 6899
                    root_type: project
                  relationships:
                    actor:
                      data:
                        type: people
                        id: '12'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection notification
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_not_acceptable:
      enum:
        - bulk_extensions_headers_invalid
        - not_acceptable
        - read_only_mode_violation
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 406.
    error_code_not_found:
      enum:
        - not_found
        - record_not_found
        - route_not_found
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 404.
    error_code_forbidden:
      enum:
        - access_denied
        - account_inactive
        - agent_role_impersonation_denied
        - automatic_invoicing_not_manageable
        - billing_catalog_list_unavailable
        - booking_conflict_resolver_unavailable
        - budget_inaccessible
        - budgets_not_manageable
        - cascade_deletion_blocked
        - custom_roles_unavailable
        - deactivated_organization
        - deal_proposal_analytics_unavailable
