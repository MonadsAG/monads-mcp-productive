openapi: 3.1.0
info:
  title: Productive.io API – Integrations
  version: 2.0.0
description: |-
  **Integrations** connect Productive to external systems — accounting software, SSO providers, and communication tools. Manage settings, credentials, and sync configuration for each connected service.

  Supported integrations include QuickBooks, Xero, NetSuite, Slack, and SAML-based single sign-on.
x-filters:
  integration:
    integration_type_id:
      description: Filter by integration type ID (e.g. Jira, Slack, QuickBooks).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    jira_organization:
      description: Filter by Jira organization name or key (Jira integrations only).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    jira_project:
      description: Filter by Jira project key (Jira integrations only).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_status:
      description: Filter by project status (e.g. active, archived).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      description: Filter by the associated deal.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter by the associated subsidiary.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/integrations/{id}/check:
    get:
      tags:
        - Integrations
      summary: Checks if integration is valid
      operationId: integrations-check-check
      description: Check the connection status of an integration.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_integration'
        '405':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Method Not Allowed
  /api/v2/integrations/{id}/connect:
    patch:
      tags:
        - Integrations
      operationId: integrations-connect-connect
      description: Completes the OAuth connection flow for an integration by exchanging the authorization code for access tokens.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the integration.
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_integration'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: The integration could not be connected due to validation errors.
  /api/v2/integrations:
    get:
      tags:
        - Integrations
      summary: Get integration
      operationId: integrations-index
      description: List integrations.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_integration'
        - $ref: '#/components/parameters/sort_integration'
      responses:
        '200':
          $ref: '#/components/responses/collection_integration'
    post:
      tags:
        - Integrations
      summary: Create an integration
      operationId: integrations-create
      description: Create a new integration.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/integration'
      responses:
        '201':
          $ref: '#/components/responses/single_integration'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/integrations/{id}:
    get:
      tags:
        - Integrations
      summary: Gets an integration
      operationId: integrations-show
      description: Retrieve a single integration.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_integration'
    delete:
      tags:
        - Integrations
      summary: Deletes an integration
      operationId: integrations-destroy
      description: Delete an integration.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '204':
          description: No Content
  /api/v2/integrations/{id}/sync:
    get:
      tags:
        - Integrations
      summary: Synchronizes an integration
      operationId: integrations-sync-sync
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_integration'
