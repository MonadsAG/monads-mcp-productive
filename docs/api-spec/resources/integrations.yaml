openapi: 3.1.0
info:
  title: Productive.io API – Integrations
  version: 2.0.0
description: |-
  **Integrations** connect Productive to external systems — accounting software, SSO providers, and communication tools. Manage settings, credentials, and sync configuration for each connected service.

  Supported integrations include QuickBooks, Xero, NetSuite, Slack, and SAML-based single sign-on.
x-filters:
  integration:
    deal_id:
      description: Filter by the associated deal.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    integration_type_id:
      description: Filter by integration type ID (e.g. Jira, Slack, QuickBooks).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    jira_organization:
      description: Filter by Jira organization name or key (Jira integrations only).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    jira_project:
      description: Filter by Jira project key (Jira integrations only).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_status:
      description: Filter by project status (e.g. active, archived).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter by the associated subsidiary.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/integrations/{id}/check:
    get:
      tags:
        - Integrations
      summary: Checks if integration is valid
      operationId: integrations-check-check
      description: Check the connection status of an integration.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_integration'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '405':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Method Not Allowed
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/integrations/{id}/check_dependencies:
    patch:
      tags:
        - Integrations
      summary: Checks the NetSuite scripts an integration depends on
      operationId: integrations-check-dependencies
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/integration_dependencies'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/integrations/{id}/connect:
    patch:
      tags:
        - Integrations
      operationId: integrations-connect-connect
      description: Completes the OAuth connection flow for an integration by exchanging the authorization code for access tokens.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the integration.
      responses:
        '200':
          $ref: '#/components/responses/single_integration'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_integration'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/integrations:
    get:
      tags:
        - Integrations
      summary: Get integration
      operationId: integrations-index
      description: List integrations.
      parameters:
        - $ref: '#/components/parameters/filter_integration'
        - $ref: '#/components/parameters/sort_integration'
      responses:
        '200':
          $ref: '#/components/responses/collection_integration'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Integrations
      summary: Create an integration
      operationId: integrations-create
      description: Create a new integration.
      requestBody:
        $ref: '#/components/requestBodies/integration'
      responses:
        '201':
          $ref: '#/components/responses/single_integration'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_integration'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/integrations/{id}:
    get:
      tags:
        - Integrations
      summary: Gets an integration
      operationId: integrations-show
      description: Retrieve a single integration.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_integration'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Integrations
      summary: Updates an integration
      operationId: integrations-update
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        $ref: '#/components/requestBodies/integration'
      responses:
        '200':
          $ref: '#/components/responses/single_integration'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_integration'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Integrations
      summary: Deletes an integration
      operationId: integrations-destroy
      description: Delete an integration.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/integrations/{id}/sync:
    get:
      tags:
        - Integrations
      summary: Synchronizes an integration
      operationId: integrations-sync-sync
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_integration'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    single_integration:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Single integration record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned integration resource.
                properties:
                  attributes:
                    type: object
                    description: Integration attributes.
                    properties:
                      account_code:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/account_code'
                          - type: 'null'
                        description: Account code used when exporting invoices to the accounting integration.
                      account_code_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/account_code_mapping'
                      bamboo_custom_field_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/bamboo_custom_field_mapping'
                      bamboo_default_subsidiary_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/bamboo_default_subsidiary_id'
                          - type: 'null'
                        description: Default subsidiary ID to use when syncing data from BambooHR.
                      bamboo_enable_cost_rates:
                        $ref: '#/components/schemas/resource_integration/properties/bamboo_enable_cost_rates'
                      bamboo_enable_time_offs:
                        $ref: '#/components/schemas/resource_integration/properties/bamboo_enable_time_offs'
                      bamboo_enable_user_provisioning:
                        $ref: '#/components/schemas/resource_integration/properties/bamboo_enable_user_provisioning'
                      bamboo_workplace_field:
                        $ref: '#/components/schemas/resource_integration/properties/bamboo_workplace_field'
                      bamboo_workplace_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/bamboo_workplace_mapping'
                      calendar_write_options:
                        $ref: '#/components/schemas/resource_integration/properties/calendar_write_options'
                      calendar_write_status:
                        $ref: '#/components/schemas/resource_integration/properties/calendar_write_status'
                      calendars:
                        $ref: '#/components/schemas/resource_integration/properties/calendars'
                      connected_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/connected_at'
                          - type: 'null'
                        description: Timestamp when the integration was successfully connected.
                      customer_memo_cf_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/customer_memo_cf_id'
                          - type: 'null'
                        description: ID of the custom field used to populate the customer memo in the accounting system.
                      deactivated_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/deactivated_at'
                          - type: 'null'
                        description: Timestamp when the integration was deactivated, or null if currently active.
                      default_item:
                        $ref: '#/components/schemas/resource_integration/properties/default_item'
                      default_product:
                        $ref: '#/components/schemas/resource_integration/properties/default_product'
                      economic_export_subject:
                        $ref: '#/components/schemas/resource_integration/properties/economic_export_subject'
                      economic_product_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/economic_product_mapping'
                      exact_country:
                        $ref: '#/components/schemas/resource_integration/properties/exact_country'
                      exact_default_journal:
                        $ref: '#/components/schemas/resource_integration/properties/exact_default_journal'
                      exact_default_ledger:
                        $ref: '#/components/schemas/resource_integration/properties/exact_default_ledger'
                      exact_division:
                        $ref: '#/components/schemas/resource_integration/properties/exact_division'
                      exact_division_id:
                        type:
                          - string
                          - 'null'
                        description: Exact Online division ID used for the integration.
                      exact_divisions:
                        $ref: '#/components/schemas/resource_integration/properties/exact_divisions'
                      exact_ledger_manually:
                        $ref: '#/components/schemas/resource_integration/properties/exact_ledger_manually'
                      exact_ledger_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/exact_ledger_mapping'
                      expense_account_code_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/expense_account_code_mapping'
                      export_attachment:
                        $ref: '#/components/schemas/resource_integration/properties/export_attachment'
                      export_expense_attachment:
                        $ref: '#/components/schemas/resource_integration/properties/export_expense_attachment'
                      export_number:
                        $ref: '#/components/schemas/resource_integration/properties/export_number'
                      export_purchase_order_number:
                        $ref: '#/components/schemas/resource_integration/properties/export_purchase_order_number'
                      folders:
                        $ref: '#/components/schemas/resource_integration/properties/folders'
                      fortnox_account_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/fortnox_account_mapping'
                      fortnox_article_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/fortnox_article_mapping'
                      fortnox_default_account:
                        $ref: '#/components/schemas/resource_integration/properties/fortnox_default_account'
                      fortnox_default_article:
                        $ref: '#/components/schemas/resource_integration/properties/fortnox_default_article'
                      google_events_write_scope:
                        $ref: '#/components/schemas/resource_integration/properties/google_events_write_scope'
                      hubspot_default_company_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/hubspot_default_company_id'
                          - type: 'null'
                        description: Default HubSpot company ID linked to new deals synced from HubSpot.
                      hubspot_default_deal_owner_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/hubspot_default_deal_owner_id'
                          - type: 'null'
                        description: Default HubSpot deal owner ID assigned to synced deals.
                      hubspot_default_subsidiary_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/hubspot_default_subsidiary_id'
                          - type: 'null'
                        description: Default subsidiary ID for HubSpot-synced deals.
                      hubspot_default_template_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/hubspot_default_template_id'
                          - type: 'null'
                        description: Default HubSpot template ID used when creating deals.
                      hubspot_pipelines:
                        $ref: '#/components/schemas/resource_integration/properties/hubspot_pipelines'
                      hubspot_stages_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/hubspot_stages_mapping'
                      hubspot_sync_deals:
                        $ref: '#/components/schemas/resource_integration/properties/hubspot_sync_deals'
                      import_attachment:
                        $ref: '#/components/schemas/resource_integration/properties/import_attachment'
                      import_number:
                        $ref: '#/components/schemas/resource_integration/properties/import_number'
                      integration_type_id:
                        $ref: '#/components/schemas/resource_integration/properties/integration_type_id'
                      item_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/item_mapping'
                      jira_organization:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/jira_organization'
                          - type: 'null'
                        description: Jira organization slug or ID for the Jira integration.
                      jira_project:
                        $ref: '#/components/schemas/resource_integration/properties/jira_project'
                      last_synced_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/last_synced_at'
                          - type: 'null'
                        description: Timestamp when the integration was last synced with the external system.
                      name:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/name'
                          - type: 'null'
                        description: Display name of the integration.
                      netsuite_customer_field_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/netsuite_customer_field_mapping'
                      netsuite_customer_form_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/netsuite_customer_form_id'
                          - type: 'null'
                        description: NetSuite customer record form ID used when creating customers.
                      netsuite_default_item:
                        $ref: '#/components/schemas/resource_integration/properties/netsuite_default_item'
                      netsuite_default_subsidiary_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/netsuite_default_subsidiary_id'
                          - type: 'null'
                        description: Default NetSuite subsidiary ID used when exporting records.
                      netsuite_invoice_field_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/netsuite_invoice_field_mapping'
                      netsuite_invoice_form_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/netsuite_invoice_form_id'
                          - type: 'null'
                        description: NetSuite invoice record form ID used when creating invoices.
                      netsuite_item_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/netsuite_item_mapping'
                      netsuite_line_item_field_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/netsuite_line_item_field_mapping'
                      netsuite_project_field_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/netsuite_project_field_mapping'
                      netsuite_project_form_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/netsuite_project_form_id'
                          - type: 'null'
                        description: NetSuite project record form ID used when creating projects.
                      netsuite_relationship_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/netsuite_relationship_mapping'
                      netsuite_sales_order_field_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/netsuite_sales_order_field_mapping'
                      netsuite_sales_order_form_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_integration/properties/netsuite_sales_order_form_id'
                          - type: 'null'
                        description: NetSuite sales order record form ID used when creating sales orders.
                      options:
                        type: object
                        description: Raw integration options object containing provider-specific configuration.
                      payments_import:
                        $ref: '#/components/schemas/resource_integration/properties/payments_import'
                      purchase_order_account_code_mapping:
                        $ref: '#/components/schemas/resource_integration/properties/purchase_order_account_code_mapping'
                      quickbooks_default_expense_account_code:
