                        eq: value
                  example:
                    eq: value
                description: Array of team membership resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
