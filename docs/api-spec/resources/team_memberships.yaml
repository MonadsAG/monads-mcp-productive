            example:
              data:
                id: '78'
                type: team_memberships
                attributes: {}
                relationships:
                  person:
                    data:
                      type: people
                      id: '12'
                  team:
                    data:
                      type: teams
                      id: '3'
              included: []
      description: Single team membership
