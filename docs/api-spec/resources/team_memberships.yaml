    collection_team_membership:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of team membership records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A team membership resource object.
                  properties:
                    attributes:
                      type: object
                      properties: {}
                      description: Team membership attributes.
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Team membership relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                        team:
                          $ref: '#/components/schemas/_single_relationship'
