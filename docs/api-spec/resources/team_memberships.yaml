openapi: 3.1.0
info:
  title: Productive.io API – Team Memberships
  version: 2.0.0
description: Person-team links. Each membership adds a person to a team. Teams are used for access control on projects and other resources, and for reporting groupings.
x-filters:
  team_membership:
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    team_id:
      description: Filter by the associated team.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    active:
      description: Filter to include only memberships with an active person (not deactivated).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter by the associated person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/team_memberships:
    get:
      tags:
        - Team Memberships
      summary: Get team memberships
      responses:
        '200':
          $ref: '#/components/responses/collection_team_membership'
      parameters:
        - $ref: '#/components/parameters/sort_team_membership'
        - $ref: '#/components/parameters/filter_team_membership'
        - $ref: '#/components/parameters/header_organization'
      operationId: team_memberships-index
      description: List all team memberships.
    post:
      tags:
        - Team Memberships
      summary: Create a team membership
      responses:
        '201':
          $ref: '#/components/responses/single_team_membership'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: team_memberships-create
      requestBody:
        $ref: '#/components/requestBodies/team_membership'
      description: Create a new team membership.
  /api/v2/team_memberships/{id}:
    get:
      tags:
        - Team Memberships
      summary: Gets a team membership
      responses:
        '200':
          $ref: '#/components/responses/single_team_membership'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: team_memberships-show
      description: Retrieve a single team membership by ID.
    delete:
      tags:
        - Team Memberships
      summary: Deletes a team membership
      responses:
        '204':
          description: No Content
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: team_memberships-destroy
      description: Delete a team membership by ID.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_team_membership:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.team_membership at the top of this file.
      required: false
      description: Filters
    sort_team_membership:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - person_name
            - -person_name
          type: string
        title: Sort team membership
      explode: false
      required: false
      description: Sort team membership
  responses:
    single_team_membership:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties: {}
                  relationships:
                    type: object
                    properties:
                      team:
                        $ref: '#/components/schemas/_single_relationship'
                      person:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single team membership
    collection_team_membership:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties: {}
                    relationships:
                      type: object
                      properties:
                        team:
                          $ref: '#/components/schemas/_single_relationship'
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection team membership
  schemas:
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    resource_team_membership:
      type: object
      title: Team membership Resource
      properties:
        id:
          type: integer
          title: Id
          description: The unique identifier of this team membership.
          example:
            - 123
        team:
          title: Team
          description: The team this membership belongs to.
          example:
            eq: value
        team_id:
          type: integer
          title: Team
          description: ID of the team this membership belongs to.
          example:
            - 123
        active:
          type: boolean
          title: Active
          description: Whether this team membership is currently active.
          example: true
        organization:
          title: Organization
          description: The organization this team membership belongs to.
          example:
            eq: value
        person:
          title: Person
          description: The person who is a member of the team.
          example:
            eq: value
        person_name:
          title: Person Name
          description: The full name of the person who is a member of the team.
          example:
            eq: value
        person_id:
          type: integer
          title: Person
          description: ID of the person who is a member of the team.
          example:
            - 123
      description: Person-team link record. Associates a person with a team for access control and reporting purposes.
      example:
        id: '123'
        type: team_memberships
        attributes:
          role: member
          joined_at: '2026-01-01T00:00:00Z'
        relationships:
          person:
            data:
              type: people
              id: '12'
          team:
            data:
              type: teams
              id: '5'
  requestBodies:
    team_membership:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - person_id
                      - team_id
                    properties:
                      team_id:
                        $ref: '#/components/schemas/resource_team_membership/properties/team_id'
                      person_id:
                        $ref: '#/components/schemas/resource_team_membership/properties/person_id'
      description: Request body for creating or deleting a team membership. Specify the team and person to add as a member.
