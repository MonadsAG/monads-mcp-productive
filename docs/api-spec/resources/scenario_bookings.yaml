openapi: 3.1.0
info:
  title: Productive.io API – Scenario Bookings
  version: 2.0.0
description: Time bookings scheduled for scenario items, applied to the deal as real bookings when the scenario is applied with `apply_bookings`. All scenario endpoints require the Scenario Builder feature on the organization's plan.
x-filters:
  scenario_booking:
    after:
      description: Filter to bookings ending on or after this date.
      operators:
        - eq
    before:
      description: Filter to bookings starting on or before this date.
      operators:
        - eq
    created_at:
      description: Filter by creation date.
      operators:
        - eq
        - gt
        - gt_eq
        - lt
        - lt_eq
        - not_eq
    ended_on:
      description: Filter by end date.
      operators:
        - eq
        - gt
        - gt_eq
        - lt
        - lt_eq
        - not_eq
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_activity_at:
      description: Filter by last activity date.
      operators:
        - eq
        - gt
        - gt_eq
        - lt
        - lt_eq
        - not_eq
    note:
      description: Filter by note.
      operators:
        - contains
    person_id:
      description: Filter by assigned person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    scenario_item_id:
      description: Filter by scenario item.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    started_on:
      description: Filter by start date.
      operators:
        - eq
        - gt
        - gt_eq
        - lt
        - lt_eq
        - not_eq
    updated_at:
      description: Filter by last update date.
      operators:
        - eq
        - gt
        - gt_eq
        - lt
        - lt_eq
        - not_eq
paths:
  /api/v2/scenario_bookings:
    get:
      tags:
        - Scenario Bookings
      summary: Get scenario bookings
      operationId: scenario_bookings-index
      description: List scenario bookings with optional filters. Returns paginated scenario booking records the caller has access to.
      parameters:
        - $ref: '#/components/parameters/filter_scenario_booking'
        - $ref: '#/components/parameters/sort_scenario_booking'
      responses:
        '200':
          $ref: '#/components/responses/collection_scenario_booking'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Scenario Bookings
      summary: Create a scenario booking
      operationId: scenario_bookings-create
      description: Create a new scenario booking. Requires the Scenario Builder feature on the organization's plan.
      requestBody:
        $ref: '#/components/requestBodies/scenario_booking'
      responses:
        '201':
          $ref: '#/components/responses/single_scenario_booking'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_scenario_booking'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/scenario_bookings/{id}:
    get:
      tags:
        - Scenario Bookings
      summary: Gets a scenario booking
      operationId: scenario_bookings-show
      description: Retrieve a single scenario booking by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_scenario_booking'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Scenario Bookings
      summary: Update a scenario booking
      operationId: scenario_bookings-update
      description: Update a scenario booking's attributes.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/scenario_booking_update'
      responses:
        '200':
          $ref: '#/components/responses/single_scenario_booking'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_scenario_booking'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Scenario Bookings
      summary: Deletes a scenario booking
      operationId: scenario_bookings-destroy
      description: Delete a scenario booking.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
