    single_scenario_booking:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Single scenario booking record in JSON:API format.
            properties:
              data:
                type: object
                description: A scenario booking resource object.
                properties:
                  attributes:
                    type: object
                    description: Scenario booking attributes.
                    properties:
                      booking_method_id:
                        $ref: '#/components/schemas/resource_scenario_booking/properties/booking_method_id'
                      created_at:
                        $ref: '#/components/schemas/resource_scenario_booking/properties/created_at'
                      custom_fields:
                        $ref: '#/components/schemas/resource_scenario_booking/properties/custom_fields'
                      ended_on:
                        $ref: '#/components/schemas/resource_scenario_booking/properties/ended_on'
                      hours:
                        $ref: '#/components/schemas/resource_scenario_booking/properties/hours'
                      last_activity_at:
                        $ref: '#/components/schemas/resource_scenario_booking/properties/last_activity_at'
                      note:
                        $ref: '#/components/schemas/resource_scenario_booking/properties/note'
                      percentage:
                        $ref: '#/components/schemas/resource_scenario_booking/properties/percentage'
                      started_on:
                        $ref: '#/components/schemas/resource_scenario_booking/properties/started_on'
                      time:
                        $ref: '#/components/schemas/resource_scenario_booking/properties/time'
                      total_time:
                        $ref: '#/components/schemas/resource_scenario_booking/properties/total_time'
                      total_working_days:
                        $ref: '#/components/schemas/resource_scenario_booking/properties/total_working_days'
                      updated_at:
                        $ref: '#/components/schemas/resource_scenario_booking/properties/updated_at'
                    example:
                      time: 240
                      total_time: 2400
                      started_on: '2026-03-02'
                      ended_on: '2026-03-13'
                      booking_method_id: 1
                      total_working_days: 10
                      note: Kickoff sprint
                  relationships:
                    type: object
                    description: Scenario booking relationships.
                    properties:
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      scenario_item:
                        $ref: '#/components/schemas/_single_relationship'
                      updater:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      organization:
                        data:
                          type: organizations
                          id: '1'
                      scenario_item:
                        data:
                          type: scenario_items
                          id: '301'
                      creator:
                        data:
                          type: people
                          id: '7'
                example:
                  id: '401'
                  type: scenario_bookings
                  attributes:
                    time: 240
                    total_time: 2400
                    started_on: '2026-03-02'
                    ended_on: '2026-03-13'
                    booking_method_id: 1
                    total_working_days: 10
                    note: Kickoff sprint
                  relationships:
                    organization:
                      data:
                        type: organizations
                        id: '1'
                    scenario_item:
                      data:
                        type: scenario_items
                        id: '301'
                    creator:
                      data:
                        type: people
                        id: '7'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    id: '301'
                    type: scenario_items
                    attributes:
                      used_quantity: '40.0'
                description: Sideloaded related resources.
                example:
                  - id: '301'
                    type: scenario_items
                    attributes:
                      used_quantity: '40.0'
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '401'
                type: scenario_bookings
                attributes:
                  time: 240
                  total_time: 2400
