    resource_scenario_booking:
      type: object
      title: Scenario Booking Resource
      description: A time booking scheduled for a scenario item, applied to the deal as a real booking when the scenario is applied with `apply_bookings`.
      properties:
        booking_method_id:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Booking Method
          description: ID of the booking method used to create this booking (e.g. hours per day, percentage, total hours).
          example: 1
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Date when the booking was created.
          example: '2026-01-15T09:30:00.000+01:00'
        custom_fields:
          type: object
          title: Custom Fields
          nullable: true
          description: Custom field values for this booking.
          example:
            '1234': Phase 1
        ended_on:
          type: string
          title: Ended On
          format: date
          description: Booking end date.
          example: '2026-03-13'
        hours:
          type: integer
          title: Hours
          nullable: true
          description: Scheduled hours per day for this booking.
          example: 4
        last_activity_at:
          type: string
          title: Last Activity At
          format: date-time
          nullable: true
          description: Timestamp of the last activity recorded on this booking.
          example: '2026-02-20T14:00:00.000+01:00'
        note:
          type: string
          title: Note
          nullable: true
          description: An optional note or description for this booking.
          example: Kickoff sprint
        percentage:
          type: integer
          title: Percentage
          nullable: true
          description: Scheduled time as a percentage of the person's daily capacity.
          example: 50
        started_on:
          type: string
          title: Started On
          format: date
          description: The start date of the booking.
          example: '2026-03-02'
        time:
          type: integer
          title: Time
          nullable: true
          description: The booked time in minutes per day.
          example: 240
        total_time:
          type: integer
          title: Total Time
          description: The total booked time in minutes across the entire booking period.
          example: 2400
        total_working_days:
          type: integer
          title: Total Working Days
          nullable: true
          description: The total number of working days covered by this booking.
          example: 10
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when this booking was last updated.
          example: '2026-02-20T14:00:00.000+01:00'
        after:
          type: string
          title: After
          format: date
          description: Internal field used for date-range filtering.
          example: '2026-03-01'
        before:
          type: string
          title: Before
          format: date
          description: Internal field used for date-range filtering.
          example: '2026-06-30'
        creator:
          title: Creator
          description: The person who created this booking.
          example:
            data:
              type: people
              id: '7'
        id:
          type: integer
          title: Id
          description: Unique identifier of the booking.
          example: 401
        organization:
          title: Organization
          description: The organization this booking belongs to.
          example:
            data:
              type: organizations
              id: '1'
        person_id:
          type: integer
          title: Person
          description: ID of the person assigned to this booking.
          example: 7
        scenario_item:
          title: Scenario Item
          description: The scenario item this booking belongs to.
          example:
            data:
              type: scenario_items
              id: '301'
        scenario_item_id:
          type: integer
          title: Scenario Item
          description: ID of the scenario item this booking belongs to.
          example: 301
        updater:
          title: Updater
          description: The person who last updated this booking.
          example:
            data:
              type: people
              id: '7'
      example:
        scenario_item_id: 301
        booking_method_id: 1
        time: 240
        total_time: 2400
        started_on: '2026-03-02'
        ended_on: '2026-03-13'
        total_working_days: 10
        note: Kickoff sprint
