                      properties:
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        scenario_item:
                          $ref: '#/components/schemas/_single_relationship'
                        updater:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        organization:
                          data:
                            type: organizations
                            id: '1'
                        scenario_item:
                          data:
