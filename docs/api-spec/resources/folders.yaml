                        '102': 206
                        '103': 207
                example:
                  type: folders
                  attributes:
                    project_id: 31055
                    map:
                      '101': 205
                      '102': 206
                      '103': 207
            example:
              data:
                type: folders
                attributes:
                  project_id: 31055
                  map:
                    '101': 205
                    '102': 206
                    '103': 207
      description: Request body for moving a folder to a different project. The target `project_id` is required; provide `map` when the target project uses a different workflow than the source.
