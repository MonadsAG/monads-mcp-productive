          schema:
            type: object
            description: JSON:API request envelope for the folder reposition operation.
            properties:
              data:
                type: object
                description: The resource object being repositioned. `type` must be `folders`.
                properties:
                  attributes:
                    type: object
                    description: 'Positioning attributes: `move_before_id` and/or `move_after_id`, the IDs of the folders to position this folder relative to.'
                    properties:
                      move_after_id:
                        type: integer
                        description: Place the folder directly after the folder with this ID. When both move_before_id and move_after_id are passed, the folder is placed between them.
                      move_before_id:
                        type: integer
                        description: Place the folder directly before the folder with this ID.
                    example:
                      move_after_id: 5521
                example:
                  type: folders
                  attributes:
                    move_after_id: 5521
            example:
              data:
                type: folders
                attributes:
                  move_after_id: 5521
      description: Request body for reordering a folder among the other folders in its project. Pass `move_before_id` and/or `move_after_id`.
    folder_move:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: JSON:API request envelope for the folder move operation.
            properties:
              data:
                type: object
                description: The resource object being updated. `type` must be `folders`.
                properties:
                  attributes:
                    type: object
                    description: 'Move attributes: the target `project_id` (required) and an optional workflow status `map` (required only when the target project''s workflow differs from the source).'
                    properties:
                      map:
                        type: object
                        description: Workflow status ID mapping, required when the target project uses a different workflow than the source. Keys are source workflow status IDs, values are target workflow status IDs; the map must cover every status in the source workflow.
                        additionalProperties:
                          type: integer
                      project_id:
                        $ref: '#/components/schemas/resource_folder/properties/project_id'
                    required:
                      - project_id
                    example:
                      project_id: 31055
                      map:
