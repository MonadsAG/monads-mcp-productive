openapi: 3.1.0
info:
  title: Productive.io API – Folders
  version: 2.0.0
description: |-
  The Folder object represents a folder within the project management system. It sits between Projects and Task lists, meaning it belongs to a project and contains multiple task lists.

  You can find out more about folders in our Help documentation: [Folders](https://help.productive.io/en/articles/2179655-multiple-boards)

  Following diagram shows folders in our data hierarchy:

  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  project: Project
  folder: Folder {
    class: primary
  }
  task_list: Task list
  task: Task
  comments: Comments
  subtasks: Subtasks
  todos: Todos

  # define connections
  project -> folder -> task_list -> task
  task -> comments
  task -> subtasks
  task -> todos
  ```
x-filters:
  folder:
    id:
      description: Filter by folder ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the ID of the project the folder belongs to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Filter by folder name using a text search query.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by folder archive status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/folders/{id}/archive:
    patch:
      tags:
        - Folders
      summary: Archives a folder
      operationId: folders-archive-archive
      description: Archives a folder and all of its task lists, hiding them from active views. Reversible via [`/folders/{id}/restore`](#tag/Folders/operation/folders-restore-restore).
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the folder.
      responses:
        '200':
          $ref: '#/components/responses/single_folder'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/folders/copy:
    post:
      tags:
        - Folders
      summary: Copy a folder
      operationId: folders-copy-copy
      description: |-
        Creates a new folder by copying a **source folder** (`template_id`) into a target project. By default only the folder shell is copied; enable the `copy_*` flags to duplicate its task lists, tasks, and their details.

        Required: `name`, `template_id` (the source folder), and `project_id`.

        ### Copy flags

        Copying cascades through levels: enable `copy_task_lists` to bring over the folder's task lists, then `copy_open_tasks` / `copy_closed_tasks` to bring over their tasks, then the per-task flags to bring over task details. All `copy_*` flags default to `false`.

        | Flag(s) | Prerequisite | Notes |
        |---|---|---|
        | `copy_task_lists` | — | The "task lists" gate |
        | `copy_open_tasks`, `copy_closed_tasks` | `copy_task_lists` | The "tasks" gate |
        | `copy_task_comments`, `copy_task_description`, `copy_task_subscribers`, `copy_task_attachments` | `copy_open_tasks` or `copy_closed_tasks` | — |
        | `copy_task_open_todos`, `copy_task_closed_todos` | `copy_open_tasks` or `copy_closed_tasks` | — |
        | `copy_task_open_subtasks`, `copy_task_closed_subtasks` | `copy_open_tasks` or `copy_closed_tasks` | — |
        | `copy_task_dependencies` | `copy_open_tasks` or `copy_closed_tasks` | — |
        | `copy_assignees`, `copy_tags`, `copy_date`, `copy_repeat`, `copy_estimate` | `copy_open_tasks` or `copy_closed_tasks` | — |
        | `copy_custom_fields` | `copy_open_tasks` or `copy_closed_tasks` | Task custom field values |

        Enabling tasks without `copy_task_lists` returns `422` (`task_lists_required`); enabling any per-task flag without a tasks gate returns `422` (`tasks_required`).

        ### Minimal copy (shell only)
        ```json
        {
          "data": {
            "type": "folders",
            "attributes": {
              "name": "Design (copy)",
              "template_id": 88440,
              "project_id": 31002
            }
          }
        }
        ```

        ### Full copy with task lists and tasks
        ```json
        {
          "data": {
            "type": "folders",
            "attributes": {
              "name": "Design (copy)",
              "template_id": 88440,
              "project_id": 31002,
              "copy_task_lists": true,
              "copy_open_tasks": true,
              "copy_task_comments": true,
              "copy_task_description": true,
              "copy_task_subscribers": true,
              "copy_task_attachments": true,
              "copy_task_open_todos": true,
              "copy_task_open_subtasks": true,
              "copy_task_dependencies": true,
              "copy_assignees": true,
              "copy_tags": true,
              "copy_date": true,
              "copy_repeat": true,
              "copy_estimate": true,
              "copy_custom_fields": true
            }
          }
        }
        ```
      requestBody:
        $ref: '#/components/requestBodies/folder_copy'
      responses:
        '201':
          $ref: '#/components/responses/single_folder'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_folder'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/folders:
    get:
      tags:
        - Folders
      summary: Get folders
      operationId: folders-index
      description: Returns a paginated list of folders — the top-level groupings inside a project that hold its task lists. Supports filtering by project, status, and free-text query.
      parameters:
        - $ref: '#/components/parameters/filter_folder'
        - $ref: '#/components/parameters/sort_folder'
      responses:
        '200':
          $ref: '#/components/responses/collection_folder'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Folders
      summary: Create a folder
      operationId: folders-create
      description: |-
        Creates a folder inside a project. Requires a `name` and the `project_id`.

        ```json
        {
          "data": {
            "type": "folders",
            "attributes": {
              "name": "Design",
              "project_id": 31002
            }
          }
        }
        ```
      requestBody:
        $ref: '#/components/requestBodies/folder'
      responses:
        '201':
          $ref: '#/components/responses/single_folder'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_folder'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/folders/{id}/move:
    patch:
      tags:
        - Folders
      summary: Move a folder
      operationId: folders-move-move
      description: |-
        Moves a folder — and all of its task lists and tasks — to a different project. Provide the target `project_id`.

        When the target project uses a **different workflow** than the source, a `map` of workflow status IDs is required: keys are the source workflow's status IDs, values are the target workflow's status IDs. The map must cover **every** status in the source workflow.

        Tasks are reassigned to the target project and their statuses remapped accordingly. Assignees and subscribers who are not members of the target project are removed from the moved tasks.

        ```json
        {
          "data": {
            "type": "folders",
            "attributes": {
              "project_id": 31055,
              "map": { "101": 205, "102": 206, "103": 207 }
            }
          }
        }
        ```
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the folder.
      requestBody:
        $ref: '#/components/requestBodies/folder_move'
      responses:
        '200':
          $ref: '#/components/responses/single_folder'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_folder'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/folders/{id}/reposition:
    patch:
      tags:
        - Folders
      summary: Reposition a folder
      operationId: folders-reposition-reposition
      description: |-
        Reorders a folder among the other folders in its project. Pass `move_before_id` and/or `move_after_id` — the IDs of the folders to position it relative to. When both are provided, the folder is placed between them.

        ```json
        {
          "data": {
            "type": "folders",
            "attributes": { "move_after_id": 5521 }
          }
        }
        ```
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the folder.
      requestBody:
        $ref: '#/components/requestBodies/folder_reposition'
      responses:
        '200':
          $ref: '#/components/responses/single_folder'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/folders/{id}/restore:
    patch:
      tags:
        - Folders
      summary: Restores a folder
      operationId: folders-restore-restore
      description: Restores an archived folder — and its task lists — back to active status.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the folder.
      responses:
        '200':
          $ref: '#/components/responses/single_folder'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/folders/{id}:
    get:
      tags:
        - Folders
      summary: Gets a folder
      operationId: folders-show
      description: Returns a single folder by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the folder.
      responses:
        '200':
          $ref: '#/components/responses/single_folder'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Folders
      summary: Update a folder
      operationId: folders-update
      description: Updates a folder. Only the provided attributes are modified — rename it or toggle its visibility via `hidden`. To move a folder to a **different project** (which reassigns its task lists and tasks and remaps workflow statuses), use [`PATCH /folders/{id}/move`](#tag/Folders/operation/folders-move-move) instead.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the folder.
      requestBody:
        $ref: '#/components/requestBodies/folder_update'
      responses:
        '200':
          $ref: '#/components/responses/single_folder'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_folder'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content_folder:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_folder'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                      properties:
                        bulk_index:
                          type: integer
                          title: Bulk Index
                          description: The position in the request's `data` array of the entry the error belongs to; only bulk requests set it.
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    single_folder:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: JSON:API response schema for a single folder.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned folder resource.
                properties:
                  attributes:
                    type: object
                    description: The attributes of the folder resource.
                    properties:
                      archived_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_folder/properties/archived_at'
                          - type: 'null'
                        description: The timestamp when this folder was archived, or null if not archived.
                      hidden:
                        $ref: '#/components/schemas/resource_folder/properties/hidden'
                      name:
                        $ref: '#/components/schemas/resource_folder/properties/name'
                      placement:
                        anyOf:
                          - $ref: '#/components/schemas/resource_folder/properties/placement'
                          - type: 'null'
                        description: The placement type of the folder within the project. Controls visibility and ordering.
                      position:
                        anyOf:
                          - $ref: '#/components/schemas/resource_folder/properties/position'
                          - type: 'null'
                        description: The sort order position of the folder within the project.
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: The relationships of the folder resource.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      project:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A single included related resource object.
                  example:
                    eq: value
                description: An array of included related resources (side-loaded data).
                example:
                  eq: value
              meta:
