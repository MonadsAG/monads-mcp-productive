    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    single_custom_field:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single custom field record in JSON:API format.
            properties:
              data:
                type: object
                description: The custom field resource object.
                properties:
                  attributes:
                    type: object
                    description: Custom field attributes.
                    properties:
                      aggregation_type_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_custom_field/properties/aggregation_type_id'
                          - type: 'null'
                        description: The aggregation type for reporting on this custom field (e.g. sum, average).
                      archived_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_custom_field/properties/archived_at'
                          - type: 'null'
                        description: The date and time when the custom field was archived, or null if active.
                      created_at:
                        $ref: '#/components/schemas/resource_custom_field/properties/created_at'
                      customizable_type:
                        $ref: '#/components/schemas/resource_custom_field/properties/customizable_type'
                      data_type_id:
                        $ref: '#/components/schemas/resource_custom_field/properties/data_type_id'
                      formatting_type_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_custom_field/properties/formatting_type_id'
                          - type: 'null'
                        description: The formatting style for display (e.g. currency, percentage).
                      global:
                        anyOf:
                          - $ref: '#/components/schemas/resource_custom_field/properties/global'
                          - type: 'null'
                        description: Whether this custom field is available across all projects in the organization.
                      name:
                        $ref: '#/components/schemas/resource_custom_field/properties/name'
                      position:
                        $ref: '#/components/schemas/resource_custom_field/properties/position'
                      quick_add_enabled:
                        $ref: '#/components/schemas/resource_custom_field/properties/quick_add_enabled'
                      required:
                        $ref: '#/components/schemas/resource_custom_field/properties/required'
                      sensitive:
                        $ref: '#/components/schemas/resource_custom_field/properties/sensitive'
                      show_in_add_edit_views:
                        $ref: '#/components/schemas/resource_custom_field/properties/show_in_add_edit_views'
                      updated_at:
                        $ref: '#/components/schemas/resource_custom_field/properties/updated_at'
                      tag_field:
                        $ref: '#/components/schemas/resource_custom_field/properties/tag_field'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Custom field relationships.
                    properties:
                      custom_field_people:
                        $ref: '#/components/schemas/_collection_relationship'
                      options:
                        $ref: '#/components/schemas/_collection_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      project:
                        $ref: '#/components/schemas/_single_relationship'
                      section:
                        $ref: '#/components/schemas/_single_relationship'
                      survey:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '53455'
                type: custom_fields
                attributes:
                  name: Priority
                  field_type: dropdown
                  position: 1
                  required: false
                  filterable: true
                  archived_at: null
                relationships:
                  custom_field_section:
                    data:
                      type: custom_field_sections
                      id: '12'
              included: []
      description: Single custom field
    collection_custom_field:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of custom field records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A custom field resource object.
                  properties:
                    attributes:
                      type: object
                      description: Custom field attributes.
                      properties:
                        aggregation_type_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_custom_field/properties/aggregation_type_id'
                            - type: 'null'
                          description: Aggregation type for report summaries (e.g. sum, average, count).
                        archived_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_custom_field/properties/archived_at'
                            - type: 'null'
                          description: Timestamp when this custom field was archived, or null if active.
                        created_at:
                          $ref: '#/components/schemas/resource_custom_field/properties/created_at'
                        customizable_type:
                          $ref: '#/components/schemas/resource_custom_field/properties/customizable_type'
                        data_type_id:
                          $ref: '#/components/schemas/resource_custom_field/properties/data_type_id'
                        formatting_type_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_custom_field/properties/formatting_type_id'
                            - type: 'null'
                          description: Formatting type for number fields (e.g. integer, decimal, currency, percentage).
                        global:
                          anyOf:
                            - $ref: '#/components/schemas/resource_custom_field/properties/global'
                            - type: 'null'
                          description: Whether this custom field is available globally across all projects/deals (true) or scoped to a specific resource.
                        name:
                          $ref: '#/components/schemas/resource_custom_field/properties/name'
                        position:
                          $ref: '#/components/schemas/resource_custom_field/properties/position'
                        quick_add_enabled:
                          $ref: '#/components/schemas/resource_custom_field/properties/quick_add_enabled'
                        required:
                          $ref: '#/components/schemas/resource_custom_field/properties/required'
                        sensitive:
                          $ref: '#/components/schemas/resource_custom_field/properties/sensitive'
                        show_in_add_edit_views:
                          $ref: '#/components/schemas/resource_custom_field/properties/show_in_add_edit_views'
                        updated_at:
                          $ref: '#/components/schemas/resource_custom_field/properties/updated_at'
                        tag_field:
                          $ref: '#/components/schemas/resource_custom_field/properties/tag_field'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Custom field relationships.
                      properties:
                        custom_field_people:
                          $ref: '#/components/schemas/_collection_relationship'
                        options:
                          $ref: '#/components/schemas/_collection_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        project:
                          $ref: '#/components/schemas/_single_relationship'
                        section:
                          $ref: '#/components/schemas/_single_relationship'
                        survey:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of custom field resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '53455'
                  type: custom_fields
                  attributes:
                    name: Priority
                    field_type: dropdown
                    position: 1
                    required: false
                    filterable: true
                    archived_at: null
                  relationships:
                    custom_field_section:
                      data:
                        type: custom_field_sections
                        id: '12'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection custom field
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_custom_field:
      enum:
        - bad_decimal_format
        - invalid_attribute
        - invalid_attribute_value
        - maximum_value_not_greater_than_minimum
        - name_not_unique
