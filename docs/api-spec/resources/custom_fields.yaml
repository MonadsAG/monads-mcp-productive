openapi: 3.1.0
info:
  title: Productive.io API – Custom Fields
  version: 2.0.0
description: |-
  Custom fields allow you to use unique categorizations that are not available in Productive's default settings, allowing you to organize data based on your specific criteria and use it throughout the app.

  For more details on how to work with custom fields please refer to [Working with custom fields](https://developer.productive.io/working_with_custom_fields.html#working_with_custom_fields) guide.

  ### Aggregation type
  The `aggregation_type_id` attribute can have one of the following integer values:

  - 1 (sum)
  - 2 (avg)

  ### Customizable type
  The `customizable_type` attribute can have one of the following string values:

  - deals
  - projects
  - companies
  - budgets
  - invoices
  - tasks
  - projects
  - bookings
  - project_expenses
  - services
  - employees
  - contacts
  - pages
  - survey_responses

  ### Data type
  The `data_type_id` attribute can have one of the following integer values:

  - 1 (Text field)
  - 2 (Number field)
  - 3 (Select field)
  - 4 (Date field)
  - 5 (Multiple select field)
  - 6 (Person field)
  - 7 (Attachment field)

  ### Formatting type
  The `formatting_type_id` attribute can have one of the following integer values:

  - 1 (decimal)
  - 2 (percentage)
x-filters:
  custom_field:
    customizable_type:
      description: Filter by the resource type the custom field is attached to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    global:
      description: Filter by whether the custom field is global (applies to all records of its type).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    archived:
      description: Filter by whether the custom field is archived.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by custom field name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    show_in_add_edit_views:
      description: Filter by whether the custom field is shown in add/edit views.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    survey_id:
      description: Filter by the associated survey.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/custom_fields/{id}/archive:
    patch:
      tags:
        - Custom Fields
      summary: Archives a custom field
      responses:
        '200':
          $ref: '#/components/responses/single_custom_field'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: custom_fields-archive-archive
      description: Archive a custom field.
  /api/v2/custom_fields:
    get:
      tags:
        - Custom Fields
      summary: Get custom fields
      responses:
        '200':
          $ref: '#/components/responses/collection_custom_field'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_custom_field'
        - $ref: '#/components/parameters/filter_custom_field'
      operationId: custom_fields-index
      description: List custom fields with optional filters and pagination.
    post:
      tags:
        - Custom Fields
      summary: Creates a custom field
      responses:
        '201':
          $ref: '#/components/responses/single_custom_field'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: custom_fields-create
      requestBody:
        $ref: '#/components/requestBodies/custom_field'
      description: Create a new custom field.
  /api/v2/custom_fields/{id}:
    get:
      tags:
        - Custom Fields
      summary: Gets a custom field
      responses:
        '200':
          $ref: '#/components/responses/single_custom_field'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: custom_fields-show
      description: Retrieve a single custom field by ID.
    patch:
      tags:
        - Custom Fields
      summary: Updates a custom field
      responses:
        '200':
          $ref: '#/components/responses/single_custom_field'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: custom_fields-update
      requestBody:
        $ref: '#/components/requestBodies/custom_field'
      description: Update a custom field.
components:
  requestBodies:
    custom_field:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - name
                      - data_type_id
                      - customizable_type
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_custom_field/properties/name'
                      global:
                        $ref: '#/components/schemas/resource_custom_field/properties/global'
                      position:
                        $ref: '#/components/schemas/resource_custom_field/properties/position'
                      required:
                        $ref: '#/components/schemas/resource_custom_field/properties/required'
                      sensitive:
                        $ref: '#/components/schemas/resource_custom_field/properties/sensitive'
                      survey_id:
                        $ref: '#/components/schemas/resource_custom_field/properties/survey_id'
                      project_id:
                        $ref: '#/components/schemas/resource_custom_field/properties/project_id'
                      section_id:
                        $ref: '#/components/schemas/resource_custom_field/properties/section_id'
                      data_type_id:
                        $ref: '#/components/schemas/resource_custom_field/properties/data_type_id'
                      maximum_value:
                        $ref: '#/components/schemas/resource_custom_field/properties/maximum_value'
                      minimum_value:
                        $ref: '#/components/schemas/resource_custom_field/properties/minimum_value'
                      customizable_type:
                        $ref: '#/components/schemas/resource_custom_field/properties/customizable_type'
                      quick_add_enabled:
                        $ref: '#/components/schemas/resource_custom_field/properties/quick_add_enabled'
                      formatting_type_id:
                        $ref: '#/components/schemas/resource_custom_field/properties/formatting_type_id'
                      aggregation_type_id:
                        $ref: '#/components/schemas/resource_custom_field/properties/aggregation_type_id'
                      show_in_add_edit_views:
                        $ref: '#/components/schemas/resource_custom_field/properties/show_in_add_edit_views'
      description: Request body for creating or updating a custom field. Specify the customizable type, data type (data_type_id), name, and optional configuration (required, global, sensitive, show_in_add_edit_views, position, description). Link to a project or section to scope the field.
  schemas:
    resource_custom_field:
      type: object
      title: Custom field Resource
      properties:
        project:
          title: Project
          description: The project this custom field is scoped to, or null if it is a global field.
          example:
            eq: value
        quick_add_enabled:
          type: boolean
          title: Quick Add Enabled
          description: Whether this custom field appears in quick-add forms for faster data entry.
          example:
            eq: value
        archived:
          type: boolean
          title: Archived
          description: Whether this custom field has been archived.
          example: true
        section_id:
          type: integer
          title: Section
          description: ID of the custom field section this field belongs to.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this custom field belongs to.
          example:
            eq: value
        required:
          type: boolean
          title: Required
          description: Whether a value for this custom field is required when creating or editing the associated resource.
          example:
            eq: value
        show_in_add_edit_views:
          type: boolean
          title: Show In Add Edit Views
          description: The show in add edit views.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The display name of this custom field.
          example:
            eq: value
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this custom field was archived, or null if not archived.
          example:
            gt: '2026-01-01'
        survey_id:
          type: integer
          title: Survey
          description: ID of the survey this custom field is associated with.
          example:
            - 123
        aggregation_type_id:
          enum:
            - 1
            - 2
          type: integer
          title: Aggregation Type
          description: ID of the aggregation type defining how values of this custom field are aggregated in reports.
          example:
            - 123
        sensitive:
          type: boolean
          title: Sensitive
          description: Whether this custom field is sensitive and its values are restricted to authorized users.
          example:
            eq: value
        customizable_type:
          type: string
          title: Customizable Type
          description: The type of resource this custom field is attached to (e.g. tasks, projects, people).
          example:
            eq: active
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this custom field was created.
          example:
            gt: '2026-01-01'
        options:
          title: Options
          description: The selectable options available for this custom field, applicable for dropdown and multi-select types.
          example:
            eq: value
        position:
          type: integer
          title: Position
          description: The display order position of this custom field within its section.
          example:
            eq: value
        data_type_id:
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
            - 8
          type: integer
          title: Data Type
          description: ID of the data type that determines what kind of value this custom field stores (e.g. text, number, date).
          example:
            - 123
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when this custom field was last updated.
          example:
            gt: '2026-01-01'
        formatting_type_id:
          enum:
            - 1
            - 2
          type: integer
          title: Formatting Type
          description: ID of the formatting type that controls how this custom field's value is displayed.
          example:
            - 123
        survey:
          title: Survey
          description: The survey this custom field is associated with, if it was created from a survey response field.
          example:
            eq: value
        project_id:
          type: integer
          title: Project
          description: ID of the project this custom field is scoped to, or null if it is a global field.
          example:
            - 123
        section:
          title: Section
          description: The custom field section this field belongs to for grouping in the UI.
          example:
            eq: value
        custom_field_people:
          title: Custom Field People
          description: People associated with this custom field via person-type values.
          example:
            eq: value
        global:
          type: boolean
          title: Global
          description: Whether this custom field is available globally across all projects, rather than scoped to a specific project.
          example:
            eq: value
      description: User-defined field on tasks, deals, people, pages, or other resources. Supports text, number, date, dropdown, multi-select, person, and file data types. Can be marked required, sensitive, global, or scoped to a project or section. Dropdown fields have selectable options via custom_field_options.
      example:
        id: '53455'
        type: custom_fields
        attributes:
          name: Priority
          field_type: dropdown
          position: 1
          required: false
          filterable: true
          archived_at: null
        relationships:
          custom_field_section:
            data:
              type: custom_field_sections
              id: '12'
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _collection_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Collection data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          description: Included variant — related resource identifiers are present in `data`.
          example:
            data:
              - type: tasks
                id: '42'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_custom_field:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.custom_field at the top of this file.
      required: false
      description: Filters
    sort_custom_field:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort custom field
      explode: false
      required: false
      description: Sort custom field
  responses:
    single_custom_field:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_custom_field/properties/name'
                      global:
                        $ref: '#/components/schemas/resource_custom_field/properties/global'
                      position:
                        $ref: '#/components/schemas/resource_custom_field/properties/position'
                      required:
                        $ref: '#/components/schemas/resource_custom_field/properties/required'
                      sensitive:
                        $ref: '#/components/schemas/resource_custom_field/properties/sensitive'
                      created_at:
                        $ref: '#/components/schemas/resource_custom_field/properties/created_at'
                      updated_at:
                        $ref: '#/components/schemas/resource_custom_field/properties/updated_at'
                      archived_at:
                        $ref: '#/components/schemas/resource_custom_field/properties/archived_at'
                      data_type_id:
                        $ref: '#/components/schemas/resource_custom_field/properties/data_type_id'
                      customizable_type:
                        $ref: '#/components/schemas/resource_custom_field/properties/customizable_type'
                      quick_add_enabled:
                        $ref: '#/components/schemas/resource_custom_field/properties/quick_add_enabled'
                      formatting_type_id:
                        $ref: '#/components/schemas/resource_custom_field/properties/formatting_type_id'
                      aggregation_type_id:
                        $ref: '#/components/schemas/resource_custom_field/properties/aggregation_type_id'
                      show_in_add_edit_views:
                        $ref: '#/components/schemas/resource_custom_field/properties/show_in_add_edit_views'
                  relationships:
                    type: object
                    properties:
                      survey:
                        $ref: '#/components/schemas/_single_relationship'
                      options:
                        $ref: '#/components/schemas/_collection_relationship'
                      project:
                        $ref: '#/components/schemas/_single_relationship'
                      section:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      custom_field_people:
                        $ref: '#/components/schemas/_collection_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single custom field
    collection_custom_field:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_custom_field/properties/name'
                        global:
                          $ref: '#/components/schemas/resource_custom_field/properties/global'
                        position:
                          $ref: '#/components/schemas/resource_custom_field/properties/position'
                        required:
                          $ref: '#/components/schemas/resource_custom_field/properties/required'
                        sensitive:
                          $ref: '#/components/schemas/resource_custom_field/properties/sensitive'
                        created_at:
                          $ref: '#/components/schemas/resource_custom_field/properties/created_at'
                        updated_at:
                          $ref: '#/components/schemas/resource_custom_field/properties/updated_at'
                        archived_at:
                          $ref: '#/components/schemas/resource_custom_field/properties/archived_at'
                        data_type_id:
                          $ref: '#/components/schemas/resource_custom_field/properties/data_type_id'
                        customizable_type:
                          $ref: '#/components/schemas/resource_custom_field/properties/customizable_type'
                        quick_add_enabled:
                          $ref: '#/components/schemas/resource_custom_field/properties/quick_add_enabled'
                        formatting_type_id:
                          $ref: '#/components/schemas/resource_custom_field/properties/formatting_type_id'
                        aggregation_type_id:
                          $ref: '#/components/schemas/resource_custom_field/properties/aggregation_type_id'
                        show_in_add_edit_views:
                          $ref: '#/components/schemas/resource_custom_field/properties/show_in_add_edit_views'
                    relationships:
                      type: object
                      properties:
                        survey:
                          $ref: '#/components/schemas/_single_relationship'
                        options:
                          $ref: '#/components/schemas/_collection_relationship'
                        project:
                          $ref: '#/components/schemas/_single_relationship'
                        section:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        custom_field_people:
                          $ref: '#/components/schemas/_collection_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection custom field
