openapi: 3.1.0
info:
  title: Productive.io API – BankAccounts
  version: 2.0.0
description: |-
  **Bank accounts** store payment destination details for subsidiaries, displayed on invoices and financial documents. They contain IBAN, SWIFT/BIC, bank name, and account number fields.

  Manage which bank accounts are associated with each subsidiary to control what payment information appears on client-facing documents.
x-filters:
  bank_account:
    bank_name:
      description: Filter by bank name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by bank account ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by account name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by active/archived status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter by the associated subsidiary.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/bank_accounts/{id}/archive:
    patch:
      tags:
        - BankAccounts
      summary: Archives a bank account
      operationId: bank_accounts-archive-archive
      description: Archive a bank account.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the bank account to archive.
      responses:
        '200':
          $ref: '#/components/responses/single_bank_account'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/bank_accounts:
    get:
      tags:
        - BankAccounts
      summary: Get bank accounts
      operationId: bank_accounts-index
      description: List bank accounts with optional filters and pagination.
      parameters:
        - $ref: '#/components/parameters/filter_bank_account'
        - $ref: '#/components/parameters/sort_bank_account'
      responses:
        '200':
          $ref: '#/components/responses/collection_bank_account'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - BankAccounts
      summary: Create a bank account
      operationId: bank_accounts-create
      description: Create a new bank account.
      requestBody:
        $ref: '#/components/requestBodies/bank_account'
      responses:
        '201':
          $ref: '#/components/responses/single_bank_account'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/bank_accounts/{id}/restore:
    patch:
      tags:
        - BankAccounts
      summary: Restores an archived bank account
      operationId: bank_accounts-restore-restore
      description: Restore a bank account.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the bank account to restore.
      responses:
        '200':
          $ref: '#/components/responses/single_bank_account'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/bank_accounts/{id}:
    get:
      tags:
        - BankAccounts
      summary: Gets a bank account
      operationId: bank_accounts-show
      description: Retrieve a single bank account by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the bank account to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/single_bank_account'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - BankAccounts
      summary: Update a bank account
      operationId: bank_accounts-update
      description: Update a bank account.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the bank account to update.
      requestBody:
        $ref: '#/components/requestBodies/bank_account'
      responses:
        '200':
          $ref: '#/components/responses/single_bank_account'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unprocessable_content'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    single_bank_account:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single bank account record in JSON:API format.
            properties:
              data:
                type: object
                description: The bank account resource object.
                properties:
                  attributes:
                    type: object
                    description: Bank account attributes.
                    properties:
                      archived_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_bank_account/properties/archived_at'
                          - type: 'null'
                        description: The date and time when the bank account was archived, or null if active.
                      bank_address:
                        anyOf:
                          - $ref: '#/components/schemas/resource_bank_account/properties/bank_address'
                          - type: 'null'
                        description: The address of the bank.
                      bank_name:
                        anyOf:
                          - $ref: '#/components/schemas/resource_bank_account/properties/bank_name'
                          - type: 'null'
                        description: The name of the bank.
                      currency:
                        $ref: '#/components/schemas/resource_bank_account/properties/currency'
                      name:
                        $ref: '#/components/schemas/resource_bank_account/properties/name'
                      number:
                        $ref: '#/components/schemas/resource_bank_account/properties/number'
                      swift_code:
                        anyOf:
                          - $ref: '#/components/schemas/resource_bank_account/properties/swift_code'
                          - type: 'null'
                        description: The SWIFT/BIC code for international transfers.
                      local_bank_code:
                        anyOf:
                          - $ref: '#/components/schemas/resource_bank_account/properties/local_bank_code'
                          - type: 'null'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Bank account relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      subsidiary:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '5'
                type: bank_accounts
                attributes:
                  name: Main Business Account
                  iban: DE89370400440532013000
                  bic: COBADEFFXXX
                  bank_name: Commerzbank
                  currency: EUR
                  created_at: '2026-01-01T00:00:00.000+00:00'
                relationships:
                  subsidiary:
                    data:
                      type: subsidiaries
                      id: '2'
              included: []
      description: Single bank account
    collection_bank_account:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of bank account records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A bank account resource object.
                  properties:
                    attributes:
                      type: object
                      description: Bank account attributes.
                      properties:
                        archived_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_bank_account/properties/archived_at'
                            - type: 'null'
                          description: Timestamp when the bank account was archived, or null if active.
                        bank_address:
                          anyOf:
                            - $ref: '#/components/schemas/resource_bank_account/properties/bank_address'
                            - type: 'null'
                          description: Physical address of the bank.
                        bank_name:
                          anyOf:
                            - $ref: '#/components/schemas/resource_bank_account/properties/bank_name'
                            - type: 'null'
                          description: Name of the bank.
                        currency:
                          $ref: '#/components/schemas/resource_bank_account/properties/currency'
                        name:
                          $ref: '#/components/schemas/resource_bank_account/properties/name'
                        number:
                          $ref: '#/components/schemas/resource_bank_account/properties/number'
                        swift_code:
                          anyOf:
                            - $ref: '#/components/schemas/resource_bank_account/properties/swift_code'
                            - type: 'null'
                          description: SWIFT/BIC code identifying the bank internationally.
                        local_bank_code:
                          anyOf:
                            - $ref: '#/components/schemas/resource_bank_account/properties/local_bank_code'
                            - type: 'null'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Bank account relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of bank account resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '5'
                  type: bank_accounts
                  attributes:
                    name: Main Business Account
                    iban: DE89370400440532013000
                    bic: COBADEFFXXX
                    bank_name: Commerzbank
                    currency: EUR
                    created_at: '2026-01-01T00:00:00.000+00:00'
                  relationships:
                    subsidiary:
                      data:
                        type: subsidiaries
                        id: '2'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection bank account
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_unprocessable_content:
      enum:
        - bad_decimal_format
        - invalid_attribute_value
        - non_finite_number
        - null_bytes_in_params
      type: string
      title: Error Code
      description: Every error `code` an endpoint without its own resource codes can return with a 422.
    error_code_unsupported_media_type:
      enum:
        - unsupported_content_type
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 415.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_not_acceptable:
      enum:
        - bulk_extensions_headers_invalid
        - not_acceptable
        - read_only_mode_violation
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 406.
    error_code_not_found:
      enum:
        - not_found
        - record_not_found
        - route_not_found
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 404.
    error_code_forbidden:
      enum:
        - access_denied
        - account_inactive
        - agent_role_impersonation_denied
        - automatic_invoicing_not_manageable
        - billing_catalog_list_unavailable
