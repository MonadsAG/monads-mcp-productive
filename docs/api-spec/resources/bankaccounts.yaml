openapi: 3.1.0
info:
  title: Productive.io API – BankAccounts
  version: 2.0.0
description: |-
  **Bank accounts** store payment destination details for subsidiaries, displayed on invoices and financial documents. They contain IBAN, SWIFT/BIC, bank name, and account number fields.

  Manage which bank accounts are associated with each subsidiary to control what payment information appears on client-facing documents.
x-filters:
  bank_account:
    name:
      description: Filter by account name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by active/archived status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by bank account ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter by the associated subsidiary.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bank_name:
      description: Filter by bank name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/bank_accounts/{id}/archive:
    patch:
      tags:
        - BankAccounts
      summary: Archives a bank account
      responses:
        '200':
          $ref: '#/components/responses/single_bank_account'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the bank account to archive.
      operationId: bank_accounts-archive-archive
      description: Archive a bank account.
  /api/v2/bank_accounts:
    get:
      tags:
        - BankAccounts
      summary: Get bank accounts
      responses:
        '200':
          $ref: '#/components/responses/collection_bank_account'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_bank_account'
        - $ref: '#/components/parameters/filter_bank_account'
      operationId: bank_accounts-index
      description: List bank accounts with optional filters and pagination.
    post:
      tags:
        - BankAccounts
      summary: Create a bank account
      responses:
        '201':
          $ref: '#/components/responses/single_bank_account'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: bank_accounts-create
      requestBody:
        $ref: '#/components/requestBodies/bank_account'
      description: Create a new bank account.
  /api/v2/bank_accounts/{id}/restore:
    patch:
      tags:
        - BankAccounts
      summary: Restores an archived bank account
      responses:
        '200':
          $ref: '#/components/responses/single_bank_account'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the bank account to restore.
        - $ref: '#/components/parameters/header_organization'
      operationId: bank_accounts-restore-restore
      description: Restore a bank account.
  /api/v2/bank_accounts/{id}:
    get:
      tags:
        - BankAccounts
      summary: Gets a bank account
      responses:
        '200':
          $ref: '#/components/responses/single_bank_account'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the bank account to retrieve.
        - $ref: '#/components/parameters/header_organization'
      operationId: bank_accounts-show
      description: Retrieve a single bank account by ID.
    patch:
      tags:
        - BankAccounts
      summary: Update a bank account
      responses:
        '200':
          $ref: '#/components/responses/single_bank_account'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the bank account to update.
      operationId: bank_accounts-update
      requestBody:
        $ref: '#/components/requestBodies/bank_account'
      description: Update a bank account.
components:
  requestBodies:
    bank_account:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_bank_account/properties/name'
                      number:
                        $ref: '#/components/schemas/resource_bank_account/properties/number'
                      currency:
                        $ref: '#/components/schemas/resource_bank_account/properties/currency'
                      bank_name:
                        $ref: '#/components/schemas/resource_bank_account/properties/bank_name'
                      swift_code:
                        $ref: '#/components/schemas/resource_bank_account/properties/swift_code'
                      bank_address:
                        $ref: '#/components/schemas/resource_bank_account/properties/bank_address'
                      subsidiary_id:
                        $ref: '#/components/schemas/resource_bank_account/properties/subsidiary_id'
      description: Request body for creating or updating a bank account.
  schemas:
    resource_bank_account:
      type: object
      title: Bank account Resource
      properties:
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when the bank account was archived, or null if active.
          example:
            gt: '2026-01-01'
        id:
          type: integer
          title: Id
          description: Unique identifier for the bank account.
          example:
            - 123
        bank_address:
          type: string
          title: Bank Address
          description: The physical address of the bank associated with this account.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this bank account belongs to.
          example:
            eq: value
        number:
          type: string
          title: Number
          description: The bank account number (IBAN or local account number).
          example:
            eq: value
        subsidiary:
          title: Subsidiary
          description: The subsidiary this bank account belongs to.
          example:
            eq: value
        swift_code:
          type: string
          title: Swift Code
          description: The SWIFT/BIC code identifying the bank in international transactions.
          example:
            eq: value
        bank_name:
          type: string
          title: Bank Name
          description: The name of the bank associated with this account.
          example:
            eq: value
        currency:
          type: string
          title: Currency
          description: The ISO 4217 currency code for this bank account (e.g. USD, EUR).
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The display name of the bank account.
          example:
            eq: value
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
          description: The current status of the bank account (e.g. active or archived).
          example:
            eq: active
        subsidiary_id:
          type: integer
          title: Subsidiary
          description: The ID of the subsidiary this bank account belongs to.
          example:
            - 123
      description: A bank account linked to a subsidiary, storing bank name, account number, currency, and SWIFT details.
      example:
        id: '5'
        type: bank_accounts
        attributes:
          name: Main Business Account
          iban: DE89370400440532013000
          bic: COBADEFFXXX
          bank_name: Commerzbank
          currency: EUR
          created_at: '2026-01-01T00:00:00.000+00:00'
        relationships:
          subsidiary:
            data:
              type: subsidiaries
              id: '2'
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_bank_account:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.bank_account at the top of this file.
      required: false
      description: Filter parameter for querying bank accounts.
    sort_bank_account:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - id
            - -id
            - name
            - -name
          type: string
        title: Sort bank account
      explode: false
      required: false
      description: Sort order for bank account list results. Accepts one or more field names, comma-separated; prefix with `-` for descending. --branch descriptions
  responses:
    single_bank_account:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_bank_account/properties/name'
                      number:
                        $ref: '#/components/schemas/resource_bank_account/properties/number'
                      currency:
                        $ref: '#/components/schemas/resource_bank_account/properties/currency'
                      bank_name:
                        $ref: '#/components/schemas/resource_bank_account/properties/bank_name'
                      swift_code:
                        $ref: '#/components/schemas/resource_bank_account/properties/swift_code'
                      archived_at:
                        $ref: '#/components/schemas/resource_bank_account/properties/archived_at'
                      bank_address:
                        $ref: '#/components/schemas/resource_bank_account/properties/bank_address'
                  relationships:
                    type: object
                    properties:
                      subsidiary:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single bank account
    collection_bank_account:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_bank_account/properties/name'
                        number:
                          $ref: '#/components/schemas/resource_bank_account/properties/number'
                        currency:
                          $ref: '#/components/schemas/resource_bank_account/properties/currency'
                        bank_name:
                          $ref: '#/components/schemas/resource_bank_account/properties/bank_name'
                        swift_code:
                          $ref: '#/components/schemas/resource_bank_account/properties/swift_code'
                        archived_at:
                          $ref: '#/components/schemas/resource_bank_account/properties/archived_at'
                        bank_address:
                          $ref: '#/components/schemas/resource_bank_account/properties/bank_address'
                    relationships:
                      type: object
                      properties:
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection bank account
