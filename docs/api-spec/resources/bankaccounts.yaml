    resource_bank_account:
      type: object
      title: Bank account Resource
      description: A bank account linked to a subsidiary, storing bank name, account number, currency, and SWIFT details.
      properties:
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when the bank account was archived, or null if active.
          example:
            gt: '2026-01-01'
        bank_address:
          type: string
          title: Bank Address
          description: The physical address of the bank associated with this account.
          example:
            eq: value
        bank_name:
          type: string
          title: Bank Name
          description: The name of the bank associated with this account.
          example:
            eq: value
        currency:
          type: string
          title: Currency
          description: The ISO 4217 currency code for this bank account (e.g. USD, EUR).
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: Unique identifier for the bank account.
          example:
            - 123
        name:
          type: string
          title: Name
          description: The display name of the bank account.
          example:
            eq: value
        number:
          type: string
          title: Number
          description: The bank account number (IBAN or local account number).
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this bank account belongs to.
          example:
            eq: value
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
          description: The current status of the bank account (e.g. active or archived).
          example:
            eq: active
        subsidiary:
          title: Subsidiary
          description: The subsidiary this bank account belongs to.
          example:
            eq: value
        subsidiary_id:
          type: integer
          title: Subsidiary
          description: The ID of the subsidiary this bank account belongs to.
          example:
            - 123
        swift_code:
          type: string
          title: Swift Code
          description: The SWIFT/BIC code identifying the bank in international transactions.
          example:
            eq: value
        local_bank_code:
          type: string
          title: Local Bank Code
          maxLength: 30
          description: Local bank code such as a sort code, routing number, BSB or IFSC. Optional, up to 30 characters, no format validation.
      example:
        id: '5'
        type: bank_accounts
        attributes:
          name: Main Business Account
          iban: DE89370400440532013000
          bic: COBADEFFXXX
          bank_name: Commerzbank
          currency: EUR
          created_at: '2026-01-01T00:00:00.000+00:00'
        relationships:
          subsidiary:
            data:
              type: subsidiaries
              id: '2'
