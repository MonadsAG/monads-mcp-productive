                      start_date: '2026-03-02'
                      end_date: '2026-05-29'
                example:
                  type: scenarios
                  attributes:
                    name: Q1 staffing plan v2
                    start_date: '2026-03-02'
                    end_date: '2026-05-29'
                  id: '42'
            example:
