          title: Budget Used
          nullable: true
          description: Amount of budget consumed so far (budget currency).
          example: 480000
        budget_used_default:
          type: number
          title: Budget Used Default
          nullable: true
          description: Amount of budget consumed so far (organization default currency).
          example: 480000
        budget_used_normalized:
          type: number
          title: Budget Used Normalized
          nullable: true
          description: Amount of budget consumed so far (normalized currency).
          example: 480000
        cost:
          type: number
          title: Cost
          nullable: true
          description: Total costs including labor and expenses (budget currency).
          example: 720000
        cost_default:
          type: number
          title: Cost Default
          nullable: true
          description: Total costs including labor and expenses (organization default currency).
          example: 720000
        cost_normalized:
          type: number
          title: Cost Normalized
          nullable: true
          description: Total costs including labor and expenses (normalized currency).
          example: 720000
        created_at:
          type: string
          title: Created At
          format: date-time
          description: When the scenario was created.
          example: '2026-01-15T09:30:00.000+01:00'
        currency:
          type: string
          title: Currency
          nullable: true
          description: Scenario currency code (budget currency).
          example: EUR
        currency_default:
          type: string
          title: Currency Default
          description: Organization default currency code.
          example: EUR
        currency_normalized:
          type: string
          title: Currency Normalized
          nullable: true
          description: Normalized currency code.
          example: EUR
        deleted_at:
          type: string
          title: Deleted At
          format: date-time
          nullable: true
          description: Soft-deletion timestamp.
          example: '2026-02-28T10:00:00.000+01:00'
        end_date:
          type: string
          title: End Date
          format: date
          nullable: true
          description: End date of the scenario.
          example: '2026-05-29'
        last_applied_at:
          type: string
          title: Last Applied At
          format: date-time
          nullable: true
          description: When the scenario was last applied to its deal.
          example: '2026-02-20T14:00:00.000+01:00'
        metadata:
          type: object
          title: Metadata
          nullable: true
          description: Preview of what applying the scenario to its deal would change.
          properties:
            bookings_to_create:
              type: integer
              description: Number of bookings that applying the scenario would create on the deal.
              example: 5
            bookings_to_create_time:
              type: integer
              description: Total time in minutes on the bookings that applying the scenario would create.
              example: 2400
            bookings_to_destroy:
              type: integer
              description: Number of bookings that applying the scenario would delete from the deal.
              example: 1
            bookings_to_update:
              type: integer
              description: Number of bookings that applying the scenario would update on the deal.
              example: 2
            expenses_to_destroy:
              type: integer
              description: Number of expenses that applying the scenario would delete from the deal.
              example: 0
            services_to_create:
              type: integer
              description: Number of services that applying the scenario would create on the deal.
              example: 2
            services_to_destroy:
              type: integer
              description: Number of services that applying the scenario would delete from the deal.
              example: 1
            services_to_update:
              type: integer
              description: Number of services that applying the scenario would update on the deal.
              example: 3
            time_entries_to_destroy:
              type: integer
              description: Number of time entries that applying the scenario would delete from the deal.
              example: 4
            time_entries_to_destroy_time:
              type: integer
              description: Total time in minutes on the time entries that applying the scenario would delete.
              example: 480
          example:
            services_to_create: 2
            services_to_update: 3
            services_to_destroy: 1
            expenses_to_destroy: 0
            time_entries_to_destroy: 4
            time_entries_to_destroy_time: 480
            bookings_to_create: 5
            bookings_to_create_time: 2400
            bookings_to_update: 2
            bookings_to_destroy: 1
        name:
