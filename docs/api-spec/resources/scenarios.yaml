  requestBodies:
    scenario_apply:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Single scenario record in JSON:API format.
            properties:
              data:
                type: object
                description: A scenario resource object.
                properties:
                  attributes:
                    type: object
                    description: Scenario apply options.
                    properties:
                      apply_bookings:
                        type: boolean
                        description: Whether the scenario bookings are also applied to the deal. Defaults to false.
                        example: true
                      confirm_bookings:
                        type: boolean
                        description: Whether the applied bookings are created as confirmed instead of tentative. Defaults to false.
                        example: false
                      update_deal_value:
                        type: boolean
                        description: Whether a manually set deal value is replaced with the scenario value. Defaults to false.
                        example: true
                    example:
                      apply_bookings: true
                      confirm_bookings: false
                      update_deal_value: true
                example:
                  type: scenarios
                  attributes:
                    apply_bookings: true
                    confirm_bookings: false
                    update_deal_value: true
                  id: '42'
            example:
              data:
                type: scenarios
                attributes:
                  apply_bookings: true
                  confirm_bookings: false
                  update_deal_value: true
                id: '42'
      description: Request body for applying a scenario to its deal.
