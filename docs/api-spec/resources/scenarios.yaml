          example: Q1 staffing plan
        profit:
          type: number
          title: Profit
          nullable: true
          description: Revenue minus costs (budget currency).
          example: 240000
        profit_default:
          type: number
          title: Profit Default
          nullable: true
          description: Revenue minus costs (organization default currency).
          example: 240000
        profit_margin:
          type: string
          title: Profit Margin
          nullable: true
          description: Profit as a percentage of revenue.
