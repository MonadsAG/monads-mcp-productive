      title: Scenario Resource
      description: A what-if copy of a deal's sections, services, items, and bookings that can be applied back to the deal by overwrite (replace everything) or sync (diff and merge).
      properties:
        budget_total:
          type: number
          title: Budget Total
          nullable: true
          description: Total budget amount across all services (budget currency).
          example: 960000
        budget_total_default:
          type: number
