          example: 240000
        revenue:
          type: number
          title: Revenue
          nullable: true
          description: Total revenue from services (budget currency).
          example: 960000
        revenue_default:
          type: number
          title: Revenue Default
          nullable: true
          description: Total revenue from services (organization default currency).
          example: 960000
        revenue_normalized:
