openapi: 3.1.0
info:
  title: Productive.io API – Scenarios
  version: 2.0.0
description: What-if copies of a deal's sections, services, items, and bookings, applied back to the deal by overwrite (replace everything) or sync (diff and merge). All scenario endpoints require the Scenario Builder feature on the organization's plan.
x-filters:
  scenario:
    deal_id:
      description: Filter by deal or budget.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by project.
      operators:
        - eq
        - not_eq
paths:
  /api/v2/scenarios/copy:
    post:
      tags:
        - Scenarios
      summary: Copies a scenario
      operationId: scenarios-copy-copy
      description: Create a copy of an existing scenario. Requires the Scenario Builder feature on the organization's plan.
      requestBody:
        $ref: '#/components/requestBodies/scenario_copy'
      responses:
        '201':
          $ref: '#/components/responses/single_scenario'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_scenario'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/scenarios:
    get:
      tags:
        - Scenarios
      summary: Get scenarios
      operationId: scenarios-index
      description: List scenarios with optional filters. Returns paginated scenario records the caller has access to.
      parameters:
        - $ref: '#/components/parameters/filter_scenario'
        - $ref: '#/components/parameters/sort_scenario'
      responses:
        '200':
          $ref: '#/components/responses/collection_scenario'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Scenarios
      summary: Create a scenario
      operationId: scenarios-create
      description: Create a new scenario. Requires the Scenario Builder feature on the organization's plan.
      requestBody:
        $ref: '#/components/requestBodies/scenario'
      responses:
        '201':
          $ref: '#/components/responses/single_scenario'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_scenario'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/scenarios/{id}:
    get:
      tags:
        - Scenarios
      summary: Gets a scenario
      operationId: scenarios-show
      description: Retrieve a single scenario by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_scenario'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Scenarios
      summary: Update a scenario
      operationId: scenarios-update
      description: Update a scenario's attributes.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/scenario_update'
      responses:
        '200':
          $ref: '#/components/responses/single_scenario'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_scenario'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Scenarios
      summary: Deletes a scenario
      operationId: scenarios-destroy
      description: Delete a scenario.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/scenarios/{id}/overwrite:
    patch:
      tags:
        - Scenarios
      summary: Applies a scenario by overwriting its deal
      operationId: scenarios-overwrite-overwrite
      description: Apply the scenario to its deal by replacing the deal's sections, services, and bookings. Requires the Scenario Builder feature on the organization's plan.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/scenario_apply'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_scenario'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/scenarios/{id}/sync:
    patch:
      tags:
        - Scenarios
      summary: Applies a scenario by syncing it into its deal
      operationId: scenarios-sync-sync
      description: 'Apply the scenario to its deal by merging changes: new records are created, matched ones updated, removed ones deleted. Requires the Scenario Builder feature on the organization''s plan.'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/scenario_apply'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_scenario'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content_scenario:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_scenario'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    single_scenario:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Single scenario record in JSON:API format.
            properties:
              data:
                type: object
                description: A scenario resource object.
                properties:
                  attributes:
                    type: object
                    description: Scenario attributes.
                    properties:
                      budget_total:
                        $ref: '#/components/schemas/resource_scenario/properties/budget_total'
                      budget_total_default:
                        $ref: '#/components/schemas/resource_scenario/properties/budget_total_default'
                      budget_total_normalized:
                        $ref: '#/components/schemas/resource_scenario/properties/budget_total_normalized'
                      budget_used:
                        $ref: '#/components/schemas/resource_scenario/properties/budget_used'
                      budget_used_default:
                        $ref: '#/components/schemas/resource_scenario/properties/budget_used_default'
                      budget_used_normalized:
                        $ref: '#/components/schemas/resource_scenario/properties/budget_used_normalized'
                      cost:
                        $ref: '#/components/schemas/resource_scenario/properties/cost'
                      cost_default:
                        $ref: '#/components/schemas/resource_scenario/properties/cost_default'
                      cost_normalized:
                        $ref: '#/components/schemas/resource_scenario/properties/cost_normalized'
                      created_at:
                        $ref: '#/components/schemas/resource_scenario/properties/created_at'
                      currency:
                        $ref: '#/components/schemas/resource_scenario/properties/currency'
                      currency_default:
                        $ref: '#/components/schemas/resource_scenario/properties/currency_default'
                      currency_normalized:
                        $ref: '#/components/schemas/resource_scenario/properties/currency_normalized'
                      deleted_at:
                        $ref: '#/components/schemas/resource_scenario/properties/deleted_at'
                      end_date:
                        $ref: '#/components/schemas/resource_scenario/properties/end_date'
                      last_applied_at:
                        $ref: '#/components/schemas/resource_scenario/properties/last_applied_at'
                      metadata:
                        $ref: '#/components/schemas/resource_scenario/properties/metadata'
                      name:
                        $ref: '#/components/schemas/resource_scenario/properties/name'
                      profit:
                        $ref: '#/components/schemas/resource_scenario/properties/profit'
                      profit_default:
                        $ref: '#/components/schemas/resource_scenario/properties/profit_default'
                      profit_margin:
                        $ref: '#/components/schemas/resource_scenario/properties/profit_margin'
                      profit_normalized:
                        $ref: '#/components/schemas/resource_scenario/properties/profit_normalized'
                      revenue:
                        $ref: '#/components/schemas/resource_scenario/properties/revenue'
                      revenue_default:
                        $ref: '#/components/schemas/resource_scenario/properties/revenue_default'
                      revenue_normalized:
                        $ref: '#/components/schemas/resource_scenario/properties/revenue_normalized'
                      start_date:
                        $ref: '#/components/schemas/resource_scenario/properties/start_date'
                    example:
                      name: Q1 staffing plan
                      created_at: '2026-01-15T09:30:00.000+01:00'
                      start_date: '2026-03-02'
                      end_date: '2026-05-29'
                      currency: EUR
                      budget_total: 960000
                      budget_used: 480000
                      revenue: 960000
                      cost: 720000
                      profit: 240000
                      profit_margin: '25.0'
                      last_applied_at: '2026-02-20T14:00:00.000+01:00'
                  relationships:
                    type: object
                    description: Scenario relationships.
                    properties:
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      organization:
                        data:
                          type: organizations
                          id: '1'
                      deal:
                        data:
                          type: deals
                          id: '5678'
                      creator:
                        data:
                          type: people
                          id: '7'
                example:
                  id: '42'
                  type: scenarios
                  attributes:
                    name: Q1 staffing plan
                    created_at: '2026-01-15T09:30:00.000+01:00'
                    start_date: '2026-03-02'
                    end_date: '2026-05-29'
                    currency: EUR
                    budget_total: 960000
                    budget_used: 480000
                    revenue: 960000
                    cost: 720000
                    profit: 240000
                    profit_margin: '25.0'
                    last_applied_at: '2026-02-20T14:00:00.000+01:00'
                  relationships:
                    organization:
                      data:
                        type: organizations
                        id: '1'
                    deal:
                      data:
                        type: deals
                        id: '5678'
                    creator:
                      data:
                        type: people
                        id: '7'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    id: '5678'
                    type: deals
                    attributes:
                      name: Website redesign
                description: Sideloaded related resources.
                example:
                  - id: '5678'
                    type: deals
                    attributes:
                      name: Website redesign
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '42'
                type: scenarios
                attributes:
                  name: Q1 staffing plan
                  created_at: '2026-01-15T09:30:00.000+01:00'
                  start_date: '2026-03-02'
                  end_date: '2026-05-29'
                  currency: EUR
                  budget_total: 960000
                  budget_used: 480000
                  revenue: 960000
                  cost: 720000
                  profit: 240000
                  profit_margin: '25.0'
                  last_applied_at: '2026-02-20T14:00:00.000+01:00'
                relationships:
                  organization:
                    data:
                      type: organizations
                      id: '1'
                  deal:
                    data:
                      type: deals
                      id: '5678'
                  creator:
                    data:
                      type: people
                      id: '7'
      description: Single scenario
    collection_scenario:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of scenario records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A scenario resource object.
                  properties:
                    attributes:
                      type: object
                      description: Scenario attributes.
                      properties:
                        budget_total:
                          $ref: '#/components/schemas/resource_scenario/properties/budget_total'
                        budget_total_default:
                          $ref: '#/components/schemas/resource_scenario/properties/budget_total_default'
                        budget_total_normalized:
                          $ref: '#/components/schemas/resource_scenario/properties/budget_total_normalized'
                        budget_used:
                          $ref: '#/components/schemas/resource_scenario/properties/budget_used'
                        budget_used_default:
                          $ref: '#/components/schemas/resource_scenario/properties/budget_used_default'
                        budget_used_normalized:
                          $ref: '#/components/schemas/resource_scenario/properties/budget_used_normalized'
                        cost:
                          $ref: '#/components/schemas/resource_scenario/properties/cost'
                        cost_default:
                          $ref: '#/components/schemas/resource_scenario/properties/cost_default'
                        cost_normalized:
                          $ref: '#/components/schemas/resource_scenario/properties/cost_normalized'
                        created_at:
                          $ref: '#/components/schemas/resource_scenario/properties/created_at'
                        currency:
                          $ref: '#/components/schemas/resource_scenario/properties/currency'
                        currency_default:
                          $ref: '#/components/schemas/resource_scenario/properties/currency_default'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_scenario/properties/currency_normalized'
                        deleted_at:
                          $ref: '#/components/schemas/resource_scenario/properties/deleted_at'
                        end_date:
                          $ref: '#/components/schemas/resource_scenario/properties/end_date'
                        last_applied_at:
                          $ref: '#/components/schemas/resource_scenario/properties/last_applied_at'
                        metadata:
