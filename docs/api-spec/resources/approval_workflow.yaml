    resource_approval_workflow:
      type: object
      title: Approval workflow Resource
      description: An approval workflow defines the approvers and subscribers for a specific approval target type within an approval policy.
      properties:
        approval_policy:
          title: Approval Policy
          description: The approval policy this workflow belongs to.
          example:
            eq: value
        approval_policy_id:
          type: integer
          title: Approval Policy
          description: The ID of the approval policy this workflow belongs to.
          example:
            - 123
        approval_requirement_id:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Approval Requirement
          description: Internal identifier for the approval requirement configuration.
          example:
            - 123
        approver_ids:
          title: Approver Ids
          description: Array of IDs of people explicitly assigned as approvers in this workflow.
          example:
            - 123
            - 456
        approvers:
          title: Approvers
          description: The people assigned as approvers in this workflow.
          example:
            eq: value
        dynamic_approver_ids:
          type: array
          items:
            enum:
              - '1'
              - '2'
              - '3'
              - '4'
            type: string
          title: Dynamic Approver Ids
          description: Array of IDs of roles or rule-based approvers dynamically resolved at approval time.
          example:
            - 123
            - 456
        dynamic_subscriber_ids:
          type: array
          items:
            enum:
              - '1'
              - '2'
              - '3'
              - '4'
            type: string
          title: Dynamic Subscriber Ids
          description: Array of IDs of roles or rule-based subscribers dynamically resolved at approval time.
          example:
            - 123
            - 456
        event:
          title: Event
          description: The absence category (event) this workflow applies to, if the target type is absence.
          example:
            eq: value
        event_id:
          type: integer
          title: Event
          description: The ID of the absence category (event) this workflow applies to, if applicable.
          example:
            - 123
        id:
          type: integer
          title: Id
          description: Unique identifier for the approval workflow.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this approval workflow belongs to.
          example:
            eq: value
        subscriber_ids:
          title: Subscriber Ids
          description: Array of IDs of people subscribed to receive notifications about approval decisions.
          example:
            - 123
            - 456
        subscribers:
          title: Subscribers
          description: The people subscribed to receive notifications about approval decisions.
          example:
            eq: value
        target_type_id:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Target Type
          description: Numeric identifier for the approval target type (e.g. time entries, expenses, absences).
          example:
            - 123
        approver_id:
          anyOf:
            - type: string
              pattern: ^[0-9]+$
            - type: integer
          title: Approver
        subscriber_id:
          anyOf:
            - type: string
              pattern: ^[0-9]+$
            - type: integer
          title: Subscriber
      example:
        id: '169549'
        type: approval_workflows
        attributes:
          approval_requirement_id: 3
          target_type_id: 1
          dynamic_approver_ids: []
          dynamic_subscriber_ids: []
        relationships:
          organization:
            data:
              type: organizations
              id: '109'
          event:
            meta:
              included: false
          approval_policy:
            meta:
              included: false
          approvers:
            meta:
              included: false
          subscribers:
            meta:
              included: false
    _id_list:
      type: string
      title: Comma-separated ids
      pattern: ^[0-9]+(,[0-9]+)+$
  requestBodies:
    approval_workflow:
