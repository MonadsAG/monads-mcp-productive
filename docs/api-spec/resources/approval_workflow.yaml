openapi: 3.1.0
info:
  title: Productive.io API – Approval Workflow
  version: 2.0.0
description: |-
  The ApprovalWorkflow entity serves as the core component of the [ApprovalPolicy](https://developer-staging.productive.io/approval_policies.html#approval-policies) object. It defines and manages information about approvers and subscribers, including the explicit and dynamic approvers and subscribers.
  Explicit approvers or subscribers can be assigned using the `approver_ids` or `subscriber_ids` arrays, which contain the IDs of the respective person objects designated as approvers or subscribers. Dynamic approvers and subscribers can be configured using the `dynamic_approvers_ids` or `dynamic_subscriber_ids` arrays, which include the ID of one of the following options:
  - Manager (id: 1) – The person's manager is automatically assigned as the approver or subscriber for the corresponding request.

  When creating an approval workflow, it is necessary to define the `approval_requirement_id`, which determines whether approval is required for the corresponding requests and, if so, it defines the level of the needed approval. The available values for `approval_requirement_id` are:
  - `approval_requirement_id: 1` - None -> No approval is required for the request to be considered approved.
  - `approval_requirement_id: 2` - Any of the listed approvers -> Approval from at least one approver is sufficient for the request to be considered approved.
  - `approval_requirement_id: 3` - All listed approvers -> Approval from all listed approvers is required for the request to be considered approved.

  Following diagram shows approval workflows in our data hierarchy:

  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  approval_policy: Approval Policy
  approval_workflows: Approval Workflows {
      class: primary
  }
  approval_policy_assignment: Approval Policy Assignment
  person: Person

  # define connections
  person -> approval_policy_assignment
  approval_policy -> approval_policy_assignment
  approval_policy -> approval_workflows
  ```
x-filters:
  approval_workflow:
    approval_policy_id:
      description: Filter by the approval policy the workflow belongs to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    event_id:
      description: Filter by the absence category (event) the workflow applies to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by approval workflow ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    approver_id: {}
    subscriber_id: {}
    target_type_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/approval_workflows:
    get:
      tags:
        - Approval Workflow
      summary: Get approval workflows
      operationId: approval_workflows-index
      description: List approval workflows, optionally filtered by approval policy, absence category or ID.
      parameters:
        - $ref: '#/components/parameters/filter_approval_workflow'
        - $ref: '#/components/parameters/sort_approval_workflow'
      responses:
        '200':
          $ref: '#/components/responses/collection_approval_workflow'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Approval Workflow
      summary: Creates the approval workflow
      operationId: approval_workflows-create
      description: Create a new approval workflow.
      requestBody:
        $ref: '#/components/requestBodies/approval_workflow'
      responses:
        '201':
          $ref: '#/components/responses/single_approval_workflow'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_approval_workflow'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Approval Workflow
      summary: Bulk updates approval workflows
      description: |
        Updates several approval workflows in one request. Requires the JSON:API bulk extension headers
        (`Content-Type` and `Accept`: `application/vnd.api+json; ext=bulk`). The same headers on
        `POST /api/v2/approval_workflows` create several workflows at once and respond with a collection.
        Validation errors carry the index of the failing item in `meta.bulk_index`.
      operationId: approval_workflows-update-bulk
      requestBody:
        $ref: '#/components/requestBodies/approval_workflow_bulk'
      responses:
        '200':
          $ref: '#/components/responses/collection_approval_workflow'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_approval_workflow'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/approval_workflows/{id}:
    get:
      tags:
        - Approval Workflow
      summary: Gets the approval workflow
      operationId: approval_workflows-show
      description: Retrieve a single approval workflow by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_approval_workflow'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Approval Workflow
      summary: Updates the approval workflow
      operationId: approval_workflows-update
      description: Update an approval workflow.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/approval_workflow'
      responses:
        '200':
          $ref: '#/components/responses/single_approval_workflow'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_approval_workflow'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Approval Workflow
      summary: Deletes the approval workflow
      operationId: approval_workflows-destroy
      description: Delete an approval workflow.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
