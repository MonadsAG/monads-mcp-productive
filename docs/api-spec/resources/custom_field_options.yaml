openapi: 3.1.0
info:
  title: Productive.io API – Custom Field Options
  version: 2.0.0
description: |-
  Custom field options define the choices available for custom fields with the select or multiple select data types.

  Following diagram shows custom field options in our data hierarchy:

  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  custom_field: Custom Field
  custom_field_options: Custom Field Options {
    class: primary
  }

  # define connections
  custom_field -> custom_field_options
  ```
x-filters:
  custom_field_option:
    archived:
      description: Filter by whether the custom field option is archived.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_field_id:
      description: Filter by the associated custom field.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/custom_field_options/{id}/archive:
    patch:
      tags:
        - Custom Field Options
      summary: Archives a custom field option
      responses:
        '200':
          $ref: '#/components/responses/single_custom_field_option'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: custom_field_options-archive-archive
      description: Archive a custom field option.
  /api/v2/custom_field_options:
    get:
      tags:
        - Custom Field Options
      summary: Get custom field options
      responses:
        '200':
          $ref: '#/components/responses/collection_custom_field_option'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_custom_field_option'
        - $ref: '#/components/parameters/sort_custom_field_option'
      operationId: custom_field_options-index
      description: List custom field options with optional filters and pagination.
    post:
      tags:
        - Custom Field Options
      summary: Creates a custom field option
      responses:
        '201':
          $ref: '#/components/responses/single_custom_field_option'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: custom_field_options-create
      requestBody:
        $ref: '#/components/requestBodies/custom_field_option'
      description: Create a new custom field option.
  /api/v2/custom_field_options/{id}:
    get:
      tags:
        - Custom Field Options
      summary: Gets a custom field option
      responses:
        '200':
          $ref: '#/components/responses/single_custom_field_option'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: custom_field_options-show
      description: Retrieve a single custom field option by ID.
    patch:
      tags:
        - Custom Field Options
      summary: Updates a custom field option
      responses:
        '200':
          $ref: '#/components/responses/single_custom_field_option'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: custom_field_options-update
      requestBody:
        $ref: '#/components/requestBodies/custom_field_option'
      description: Update a custom field option.
components:
  requestBodies:
    custom_field_option:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - name
                      - custom_field_id
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_custom_field_option/properties/name'
                      color_id:
                        $ref: '#/components/schemas/resource_custom_field_option/properties/color_id'
                      position:
                        $ref: '#/components/schemas/resource_custom_field_option/properties/position'
                      custom_field_id:
                        $ref: '#/components/schemas/resource_custom_field_option/properties/custom_field_id'
      description: Request body for creating or updating a custom field option. Specify the parent custom field, option name, position, and optional color.
  schemas:
    resource_custom_field_option:
      type: object
      title: Custom field option Resource
      properties:
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this option was archived, or null if not archived.
          example:
            gt: '2026-01-01'
        name:
          type: string
          title: Name
          description: The display label for this custom field option.
          example:
            eq: value
        custom_field_id:
          type: integer
          title: Custom Field
          description: ID of the custom field this option belongs to.
          example:
            - 123
        archived:
          type: boolean
          title: Archived
          description: Whether this custom field option has been archived and is no longer available for selection.
          example: true
        position:
          type: integer
          title: Position
          description: The sort order of this option within the custom field's option list.
          example:
            eq: value
        color_id:
          type: integer
          title: Color
          description: ID of the color associated with this option for visual identification.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this custom field option belongs to.
          example:
            eq: value
        custom_field:
          title: Custom Field
          description: The custom field this option belongs to.
          example:
            eq: value
      description: Selectable option for a dropdown or multi-select custom field. Supports a name, position ordering, color, and archiving. Archived options remain on existing records but are hidden from new selections.
      example:
        id: '170576'
        type: custom_field_options
        attributes:
          name: High
          color_id: '1'
          position: 1
          archived_at: null
        relationships:
          custom_field:
            data:
              type: custom_fields
              id: '53455'
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_custom_field_option:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort custom field option
      explode: false
      required: false
      description: Sort custom field option
    filter_custom_field_option:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.custom_field_option at the top of this file.
      required: false
      description: Filters
  responses:
    single_custom_field_option:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_custom_field_option/properties/name'
                      color_id:
                        $ref: '#/components/schemas/resource_custom_field_option/properties/color_id'
                      position:
                        $ref: '#/components/schemas/resource_custom_field_option/properties/position'
                      archived_at:
                        $ref: '#/components/schemas/resource_custom_field_option/properties/archived_at'
                  relationships:
                    type: object
                    properties:
                      custom_field:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single custom field option
    collection_custom_field_option:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_custom_field_option/properties/name'
                        color_id:
                          $ref: '#/components/schemas/resource_custom_field_option/properties/color_id'
                        position:
                          $ref: '#/components/schemas/resource_custom_field_option/properties/position'
                        archived_at:
                          $ref: '#/components/schemas/resource_custom_field_option/properties/archived_at'
                    relationships:
                      type: object
                      properties:
                        custom_field:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection custom field option
