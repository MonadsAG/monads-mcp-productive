openapi: 3.1.0
info:
  title: Productive.io API – Pipelines
  version: 2.0.0
description: |-
  For more details about pipelines and how to use them with deal statuses, please refer to the [help article](https://help.productive.io/en/articles/2179572-setting-up-your-sales-pipelines).

  Pipelines serve as a tool for grouping deal statuses (i.e. folders for better organisation of sales phases).

  Following depicts the Pipeline entity relationship diagram:

  ```d2
  ...@template
  *: {
    class: default
  }

  # Define actors
  deal_status_1: Deal Status 1
  deal_status_2: Deal Status 2
  deal_status_3: Deal Status 3
  deal_status_4: Deal Status 4
  pipeline_1: Sales Pipeline {
    class: primary
  }
  pipeline_2: Another Pipeline {
    class: primary
  }

  pipeline_1 -> deal_status_1
  pipeline_1 -> deal_status_2
  pipeline_2 -> deal_status_3
  pipeline_2 -> deal_status_4
  ```
x-filters:
  pipeline:
    pipeline_type_id:
      description: Filter by pipeline type ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/pipelines:
    get:
      tags:
        - Pipelines
      summary: Get pipelines
      operationId: pipelines-index
      description: List all pipelines.
      parameters:
        - $ref: '#/components/parameters/sort_pipeline'
        - $ref: '#/components/parameters/filter_pipeline'
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/collection_pipeline'
    post:
      tags:
        - Pipelines
      summary: Create a pipeline
      operationId: pipelines-create
      description: Create a new pipeline.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/pipeline'
      responses:
        '201':
          $ref: '#/components/responses/single_pipeline'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/pipelines/{id}:
    get:
      tags:
        - Pipelines
      summary: Gets a pipeline
      operationId: pipelines-show
      description: Retrieve a single pipeline by ID.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_pipeline'
    patch:
      tags:
        - Pipelines
      summary: Update a pipeline
      operationId: pipelines-update
      description: Update a pipeline.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/pipeline'
      responses:
        '200':
          $ref: '#/components/responses/single_pipeline'
    delete:
      tags:
        - Pipelines
      summary: Deletes a pipeline
      operationId: pipelines-destroy
      description: Delete a pipeline by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '204':
          description: No Content
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_pipeline:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.pipeline at the top of this file.
      required: false
      description: Filters
    sort_pipeline:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort pipeline
      explode: false
      required: false
      description: Sort pipeline
  responses:
    single_pipeline:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single pipeline record in JSON:API format.
            properties:
              meta:
                $ref: '#/components/schemas/_meta'
              data:
                type: object
                description: The JSON:API data object for the returned pipeline resource.
                properties:
                  attributes:
                    type: object
                    description: Pipeline attributes.
                    properties:
                      updated_at:
                        $ref: '#/components/schemas/resource_pipeline/properties/updated_at'
                      icon_id:
                        $ref: '#/components/schemas/resource_pipeline/properties/icon_id'
                      name:
                        $ref: '#/components/schemas/resource_pipeline/properties/name'
                      pipeline_type_id:
                        $ref: '#/components/schemas/resource_pipeline/properties/pipeline_type_id'
                      created_at:
                        $ref: '#/components/schemas/resource_pipeline/properties/created_at'
                      position:
                        $ref: '#/components/schemas/resource_pipeline/properties/position'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Pipeline relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      updater:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                id: '1'
                type: pipelines
                attributes:
                  name: Sales Pipeline
                  default: true
                  archived_at: null
                relationships:
                  deal_statuses:
                    data:
                      - type: deal_statuses
                        id: '1'
                      - type: deal_statuses
                        id: '2'
                      - type: deal_statuses
                        id: '3'
              included: []
      description: Single pipeline
    collection_pipeline:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of pipeline records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A pipeline resource object.
                  properties:
                    relationships:
                      type: object
                      description: Pipeline relationships.
                      properties:
                        updater:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                    attributes:
                      type: object
                      description: Pipeline attributes.
                      properties:
                        pipeline_type_id:
                          $ref: '#/components/schemas/resource_pipeline/properties/pipeline_type_id'
                        name:
                          $ref: '#/components/schemas/resource_pipeline/properties/name'
                        updated_at:
                          $ref: '#/components/schemas/resource_pipeline/properties/updated_at'
                        icon_id:
                          $ref: '#/components/schemas/resource_pipeline/properties/icon_id'
                        position:
                          $ref: '#/components/schemas/resource_pipeline/properties/position'
                        created_at:
                          $ref: '#/components/schemas/resource_pipeline/properties/created_at'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of pipeline resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '1'
                  type: pipelines
                  attributes:
                    name: Sales Pipeline
                    default: true
                    archived_at: null
                  relationships:
                    deal_statuses:
                      data:
                        - type: deal_statuses
                          id: '1'
                        - type: deal_statuses
                          id: '2'
                        - type: deal_statuses
                          id: '3'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection pipeline
  schemas:
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    resource_pipeline:
      type: object
      title: Pipeline Resource
      description: A sales or production pipeline defining the stages that deals progress through.
      properties:
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when the pipeline was created.
          example:
            gt: '2026-01-01'
        pipeline_type_id:
          enum:
            - 1
            - 2
          type: integer
          title: Pipeline Type
          description: 'Pipeline type: 1 = sales (opportunities), 2 = production (budgets).'
          example:
            - 123
        name:
          type: string
          title: Name
          description: Display name of the pipeline.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this pipeline belongs to.
          example:
            eq: value
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp of the last modification to this pipeline.
          example:
            gt: '2026-01-01'
        position:
          type: integer
          title: Position
          description: Display order of this pipeline relative to other pipelines.
          example:
            eq: value
        icon_id:
          type: string
          title: Icon
          description: Icon ID used to visually identify this pipeline.
          example:
            - 123
        creator:
          title: Creator
          description: Person who created this pipeline.
          example:
            eq: value
        updater:
          title: Updater
          description: Person who last updated this pipeline.
          example:
            eq: value
      example:
        id: '1'
        type: pipelines
        attributes:
          name: Sales Pipeline
          default: true
          archived_at: null
        relationships:
          deal_statuses:
            data:
              - type: deal_statuses
                id: '1'
              - type: deal_statuses
                id: '2'
              - type: deal_statuses
                id: '3'
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  requestBodies:
    pipeline:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a pipeline.
            properties:
              data:
                type: object
                description: The JSON:API data object containing the pipeline resource attributes and relationships.
                properties:
                  attributes:
                    type: object
                    description: Pipeline attributes.
                    properties:
                      icon_id:
                        $ref: '#/components/schemas/resource_pipeline/properties/icon_id'
                      position:
                        $ref: '#/components/schemas/resource_pipeline/properties/position'
                      pipeline_type_id:
                        $ref: '#/components/schemas/resource_pipeline/properties/pipeline_type_id'
                      name:
                        $ref: '#/components/schemas/resource_pipeline/properties/name'
                    required:
                      - name
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: pipelines
                attributes:
                  name: Sales Pipeline
                  default: true
      description: Request body for creating or updating a pipeline. Specify the name, pipeline_type_id (sales or production), position, and optional icon. Deal statuses are managed separately via the deal_statuses endpoint.
