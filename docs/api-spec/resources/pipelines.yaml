openapi: 3.1.0
info:
  title: Productive.io API – Pipelines
  version: 2.0.0
description: |-
  For more details about pipelines and how to use them with deal statuses, please refer to the [help article](https://help.productive.io/en/articles/2179572-setting-up-your-sales-pipelines).

  Pipelines serve as a tool for grouping deal statuses (i.e. folders for better organisation of sales phases).

  Following depicts the Pipeline entity relationship diagram:

  ```d2
  ...@template
  *: {
    class: default
  }

  # Define actors
  deal_status_1: Deal Status 1
  deal_status_2: Deal Status 2
  deal_status_3: Deal Status 3
  deal_status_4: Deal Status 4
  pipeline_1: Sales Pipeline {
    class: primary
  }
  pipeline_2: Another Pipeline {
    class: primary
  }

  pipeline_1 -> deal_status_1
  pipeline_1 -> deal_status_2
  pipeline_2 -> deal_status_3
  pipeline_2 -> deal_status_4
  ```
x-filters:
  pipeline:
    pipeline_type_id:
      description: Filter by pipeline type ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/pipelines:
    get:
      tags:
        - Pipelines
      summary: Get pipelines
      responses:
        '200':
          $ref: '#/components/responses/collection_pipeline'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_pipeline'
        - $ref: '#/components/parameters/sort_pipeline'
      operationId: pipelines-index
      description: List all pipelines.
    post:
      tags:
        - Pipelines
      summary: Create a pipeline
      responses:
        '201':
          $ref: '#/components/responses/single_pipeline'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: pipelines-create
      requestBody:
        $ref: '#/components/requestBodies/pipeline'
      description: Create a new pipeline.
  /api/v2/pipelines/{id}:
    get:
      tags:
        - Pipelines
      summary: Gets a pipeline
      responses:
        '200':
          $ref: '#/components/responses/single_pipeline'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: pipelines-show
      description: Retrieve a single pipeline by ID.
    patch:
      tags:
        - Pipelines
      summary: Update a pipeline
      responses:
        '200':
          $ref: '#/components/responses/single_pipeline'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: pipelines-update
      requestBody:
        $ref: '#/components/requestBodies/pipeline'
      description: Update a pipeline.
    delete:
      tags:
        - Pipelines
      summary: Deletes a pipeline
      responses:
        '204':
          description: No Content
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: pipelines-destroy
      description: Delete a pipeline by ID.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_pipeline:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort pipeline
      explode: false
      required: false
      description: Sort pipeline
    filter_pipeline:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.pipeline at the top of this file.
      required: false
      description: Filters
  requestBodies:
    pipeline:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_pipeline/properties/name'
                      icon_id:
                        $ref: '#/components/schemas/resource_pipeline/properties/icon_id'
                      position:
                        $ref: '#/components/schemas/resource_pipeline/properties/position'
                      pipeline_type_id:
                        $ref: '#/components/schemas/resource_pipeline/properties/pipeline_type_id'
      description: Request body for creating or updating a pipeline. Specify the name, pipeline_type_id (sales or production), position, and optional icon. Deal statuses are managed separately via the deal_statuses endpoint.
  schemas:
    resource_pipeline:
      type: object
      title: Pipeline Resource
      properties:
        updater:
          title: Updater
          description: Person who last updated this pipeline.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: Display name of the pipeline.
          example:
            eq: value
        icon_id:
          type: string
          title: Icon
          description: Icon ID used to visually identify this pipeline.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this pipeline belongs to.
          example:
            eq: value
        pipeline_type_id:
          enum:
            - 1
            - 2
          type: integer
          title: Pipeline Type
          description: 'Pipeline type: 1 = sales (opportunities), 2 = production (budgets).'
          example:
            - 123
        position:
          type: integer
          title: Position
          description: Display order of this pipeline relative to other pipelines.
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when the pipeline was created.
          example:
            gt: '2026-01-01'
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp of the last modification to this pipeline.
          example:
            gt: '2026-01-01'
        creator:
          title: Creator
          description: Person who created this pipeline.
          example:
            eq: value
      description: A sales or production pipeline defining the stages that deals progress through.
      example:
        id: '1'
        type: pipelines
        attributes:
          name: Sales Pipeline
          default: true
          archived_at: null
        relationships:
          deal_statuses:
            data:
              - type: deal_statuses
                id: '1'
              - type: deal_statuses
                id: '2'
              - type: deal_statuses
                id: '3'
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  responses:
    single_pipeline:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_pipeline/properties/name'
                      icon_id:
                        $ref: '#/components/schemas/resource_pipeline/properties/icon_id'
                      position:
                        $ref: '#/components/schemas/resource_pipeline/properties/position'
                      created_at:
                        $ref: '#/components/schemas/resource_pipeline/properties/created_at'
                      updated_at:
                        $ref: '#/components/schemas/resource_pipeline/properties/updated_at'
                      pipeline_type_id:
                        $ref: '#/components/schemas/resource_pipeline/properties/pipeline_type_id'
                  relationships:
                    type: object
                    properties:
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      updater:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single pipeline
    collection_pipeline:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_pipeline/properties/name'
                        icon_id:
                          $ref: '#/components/schemas/resource_pipeline/properties/icon_id'
                        position:
                          $ref: '#/components/schemas/resource_pipeline/properties/position'
                        created_at:
                          $ref: '#/components/schemas/resource_pipeline/properties/created_at'
                        updated_at:
                          $ref: '#/components/schemas/resource_pipeline/properties/updated_at'
                        pipeline_type_id:
                          $ref: '#/components/schemas/resource_pipeline/properties/pipeline_type_id'
                    relationships:
                      type: object
                      properties:
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        updater:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection pipeline
