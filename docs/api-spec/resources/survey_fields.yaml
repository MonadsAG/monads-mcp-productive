openapi: 3.1.0
info:
  title: Productive.io API – Survey Fields
  version: 2.0.0
description: Form fields on a survey. Each field has a data type (text, number, date, dropdown, checkbox, file) and optional configuration. Dropdown and multi-select fields have selectable options managed via survey_field_options.
x-filters:
  survey_field:
    survey_id:
      description: Filter by the associated survey.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    global:
      description: Filter by whether the survey field applies globally across all projects.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    origin_field_id:
      description: Filter by the original field this field was copied from.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    archived:
      description: Filter to include only archived (or non-archived) survey fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by field name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    show_in_add_edit_views:
      description: Filter by whether the field is shown in add/edit form views.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/survey_fields/{id}/archive:
    patch:
      tags:
        - Survey Fields
      summary: Archives a survey field
      responses:
        '200':
          $ref: '#/components/responses/single_survey_field'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the survey field to archive.
        - $ref: '#/components/parameters/header_organization'
      operationId: survey_fields-archive-archive
      description: Archive a survey field to deactivate it.
  /api/v2/survey_fields:
    get:
      tags:
        - Survey Fields
      summary: Get survey fields
      responses:
        '200':
          $ref: '#/components/responses/collection_survey_field'
      parameters:
        - $ref: '#/components/parameters/filter_survey_field'
        - $ref: '#/components/parameters/sort_survey_field'
        - $ref: '#/components/parameters/header_organization'
      operationId: survey_fields-index
      description: List all survey fields.
    post:
      tags:
        - Survey Fields
      summary: Creates a survey field
      responses:
        '201':
          $ref: '#/components/responses/single_survey_field'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: survey_fields-create
      requestBody:
        $ref: '#/components/requestBodies/survey_field'
      description: Create a new survey field.
  /api/v2/survey_fields/{id}:
    get:
      tags:
        - Survey Fields
      summary: Gets a survey field
      responses:
        '200':
          $ref: '#/components/responses/single_survey_field'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the survey field to retrieve.
      operationId: survey_fields-show
      description: Retrieve a single survey field by ID.
    patch:
      tags:
        - Survey Fields
      summary: Updates a survey field
      responses:
        '200':
          $ref: '#/components/responses/single_survey_field'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the survey field to update.
        - $ref: '#/components/parameters/header_organization'
      operationId: survey_fields-update
      requestBody:
        $ref: '#/components/requestBodies/survey_field'
      description: Update a survey field.
components:
  requestBodies:
    survey_field:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - data_type_id
                      - name
                      - survey_id
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_survey_field/properties/name'
                      position:
                        $ref: '#/components/schemas/resource_survey_field/properties/position'
                      required:
                        $ref: '#/components/schemas/resource_survey_field/properties/required'
                      survey_id:
                        $ref: '#/components/schemas/resource_survey_field/properties/survey_id'
                      data_type_id:
                        $ref: '#/components/schemas/resource_survey_field/properties/data_type_id'
                      origin_field_id:
                        $ref: '#/components/schemas/resource_survey_field/properties/origin_field_id'
                      quick_add_enabled:
                        $ref: '#/components/schemas/resource_survey_field/properties/quick_add_enabled'
                      formatting_type_id:
                        $ref: '#/components/schemas/resource_survey_field/properties/formatting_type_id'
                      aggregation_type_id:
                        $ref: '#/components/schemas/resource_survey_field/properties/aggregation_type_id'
                      show_in_add_edit_views:
                        $ref: '#/components/schemas/resource_survey_field/properties/show_in_add_edit_views'
      description: Request body for creating or updating a survey field. Specify the survey, field type (data_type_id), label, position, required flag, and optional description. For dropdown fields, add options via the survey_field_options endpoint.
  schemas:
    resource_survey_field:
      type: object
      title: Survey field Resource
      properties:
        sensitive:
          type: boolean
          title: Sensitive
          description: When true, the value of this field is treated as sensitive and hidden from unauthorized users.
          example:
            eq: value
        survey_id:
          type: integer
          title: Survey
          description: ID of the survey this field belongs to.
          example:
            - 123
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when this survey field was last updated.
          example:
            gt: '2026-01-01'
        survey:
          title: Survey
          description: The survey this field belongs to.
          example:
            eq: value
        origin_field:
          title: Origin Field
          description: The original custom field this survey field was created from, if applicable.
          example:
            eq: value
        position:
          type: integer
          title: Position
          description: The display order position of this field within the survey.
          example:
            eq: value
        project_id:
          type: integer
          title: Project
          description: ID of the project this survey field belongs to.
          example:
            - 123
        data_type_id:
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
          type: integer
          title: Data Type
          description: ID of the data type that determines what kind of value this field stores (text, number, date, etc.).
          example:
            - 123
        show_in_add_edit_views:
          type: boolean
          title: Show In Add Edit Views
          description: The show in add edit views.
          example:
            eq: value
        customizable_type:
          type: string
          title: Customizable Type
          description: The resource type this survey field can be attached to (e.g. tasks, deals, contacts).
          example:
            eq: active
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this survey field was created.
          example:
            gt: '2026-01-01'
        required:
          type: boolean
          title: Required
          description: Whether a response to this field is required when submitting the survey.
          example:
            eq: value
        formatting_type_id:
          type: integer
          title: Formatting Type
          description: ID of the formatting type that controls how this field's value is displayed.
          example:
            - 123
        custom_field_people:
          title: Custom Field People
          description: People associated with this survey field via custom field lookups.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The name (label) of this survey field.
          example:
            eq: value
        archived:
          title: Archived
          description: Whether this survey field has been archived.
          example: true
        origin_field_id:
          type: integer
          title: Origin Field
          description: ID of the original custom field this survey field was created from, if applicable.
          example:
            - 123
        aggregation_type_id:
          type: integer
          title: Aggregation Type
          description: ID of the aggregation type used when summarizing responses to this field.
          example:
            - 123
        quick_add_enabled:
          type: boolean
          title: Quick Add Enabled
          description: When true, this field can be quickly added to a resource without opening the full edit form.
          example:
            eq: value
        options:
          title: Options
          description: The answer options available for this survey field (for multiple-choice fields).
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this survey field belongs to.
          example:
            eq: value
        global:
          type: boolean
          title: Global
          description: When true, this field is shared across all projects in the organization.
          example:
            eq: value
        id:
          title: Id
          description: The unique identifier of this survey field.
          example:
            - 123
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this survey field was archived, or null if not archived.
          example:
            gt: '2026-01-01'
      description: Form field on a survey with a data type (text, number, date, dropdown, checkbox, file), label, required flag, position, and optional description. Dropdown fields have selectable options via survey_field_options.
      example:
        id: '123'
        type: survey_fields
        attributes:
          label: How satisfied are you?
          field_type: rating
          required: true
          position: 1
        relationships: {}
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _collection_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Collection data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          description: Included variant — related resource identifiers are present in `data`.
          example:
            data:
              - type: tasks
                id: '42'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_survey_field:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - created_at
            - -created_at
            - id
            - -id
            - name
            - -name
            - project_id
            - -project_id
            - survey_id
            - -survey_id
            - updated_at
            - -updated_at
          type: string
        title: Sort survey field
      explode: false
      required: false
      description: Sort order for survey field list results. Accepts one or more field names, comma-separated; prefix with `-` for descending. --branch descriptions
    filter_survey_field:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.survey_field at the top of this file.
      required: false
      description: Filter parameter for querying survey fields.
  responses:
    single_survey_field:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_survey_field/properties/name'
                      global:
                        $ref: '#/components/schemas/resource_survey_field/properties/global'
                      position:
                        $ref: '#/components/schemas/resource_survey_field/properties/position'
                      required:
                        $ref: '#/components/schemas/resource_survey_field/properties/required'
                      sensitive:
                        $ref: '#/components/schemas/resource_survey_field/properties/sensitive'
                      created_at:
                        $ref: '#/components/schemas/resource_survey_field/properties/created_at'
                      updated_at:
                        $ref: '#/components/schemas/resource_survey_field/properties/updated_at'
                      archived_at:
                        $ref: '#/components/schemas/resource_survey_field/properties/archived_at'
                      data_type_id:
                        $ref: '#/components/schemas/resource_survey_field/properties/data_type_id'
                      customizable_type:
                        $ref: '#/components/schemas/resource_survey_field/properties/customizable_type'
                      quick_add_enabled:
                        $ref: '#/components/schemas/resource_survey_field/properties/quick_add_enabled'
                      formatting_type_id:
                        $ref: '#/components/schemas/resource_survey_field/properties/formatting_type_id'
                      aggregation_type_id:
                        $ref: '#/components/schemas/resource_survey_field/properties/aggregation_type_id'
                      show_in_add_edit_views:
                        $ref: '#/components/schemas/resource_survey_field/properties/show_in_add_edit_views'
                  relationships:
                    type: object
                    properties:
                      survey:
                        $ref: '#/components/schemas/_single_relationship'
                      options:
                        $ref: '#/components/schemas/_collection_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      origin_field:
                        $ref: '#/components/schemas/_single_relationship'
                      custom_field_people:
                        $ref: '#/components/schemas/_collection_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single survey field
    collection_survey_field:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_survey_field/properties/name'
                        global:
                          $ref: '#/components/schemas/resource_survey_field/properties/global'
                        position:
                          $ref: '#/components/schemas/resource_survey_field/properties/position'
                        required:
                          $ref: '#/components/schemas/resource_survey_field/properties/required'
                        sensitive:
                          $ref: '#/components/schemas/resource_survey_field/properties/sensitive'
                        created_at:
                          $ref: '#/components/schemas/resource_survey_field/properties/created_at'
                        updated_at:
                          $ref: '#/components/schemas/resource_survey_field/properties/updated_at'
                        archived_at:
                          $ref: '#/components/schemas/resource_survey_field/properties/archived_at'
                        data_type_id:
                          $ref: '#/components/schemas/resource_survey_field/properties/data_type_id'
                        customizable_type:
                          $ref: '#/components/schemas/resource_survey_field/properties/customizable_type'
                        quick_add_enabled:
                          $ref: '#/components/schemas/resource_survey_field/properties/quick_add_enabled'
                        formatting_type_id:
                          $ref: '#/components/schemas/resource_survey_field/properties/formatting_type_id'
                        aggregation_type_id:
                          $ref: '#/components/schemas/resource_survey_field/properties/aggregation_type_id'
                        show_in_add_edit_views:
                          $ref: '#/components/schemas/resource_survey_field/properties/show_in_add_edit_views'
                    relationships:
                      type: object
                      properties:
                        survey:
                          $ref: '#/components/schemas/_single_relationship'
                        options:
                          $ref: '#/components/schemas/_collection_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        origin_field:
                          $ref: '#/components/schemas/_single_relationship'
                        custom_field_people:
                          $ref: '#/components/schemas/_collection_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection survey field
