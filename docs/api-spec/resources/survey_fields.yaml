openapi: 3.1.0
info:
  title: Productive.io API – Survey Fields
  version: 2.0.0
description: Form fields on a survey. Each field has a data type (text, number, date, dropdown, checkbox, file) and optional configuration. Dropdown and multi-select fields have selectable options managed via survey_field_options.
x-filters:
  survey_field:
    archived:
      description: Filter to include only archived (or non-archived) survey fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    global:
      description: Filter by whether the survey field applies globally across all projects.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by field name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    origin_field_id:
      description: Filter by the original field this field was copied from.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    show_in_add_edit_views:
      description: Filter by whether the field is shown in add/edit form views.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    survey_id:
      description: Filter by the associated survey.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/survey_fields/{id}/archive:
    patch:
      tags:
        - Survey Fields
      summary: Archives a survey field
      operationId: survey_fields-archive-archive
      description: Archive a survey field to deactivate it.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the survey field to archive.
      responses:
        '200':
          $ref: '#/components/responses/single_survey_field'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/survey_fields:
    get:
      tags:
        - Survey Fields
      summary: Get survey fields
      operationId: survey_fields-index
      description: List all survey fields.
      parameters:
        - $ref: '#/components/parameters/filter_survey_field'
        - $ref: '#/components/parameters/sort_survey_field'
      responses:
        '200':
          $ref: '#/components/responses/collection_survey_field'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Survey Fields
      summary: Creates a survey field
      operationId: survey_fields-create
      description: Create a new survey field.
      requestBody:
        $ref: '#/components/requestBodies/survey_field'
      responses:
        '201':
          $ref: '#/components/responses/single_survey_field'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_survey_field'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/survey_fields/{id}:
    get:
      tags:
        - Survey Fields
      summary: Gets a survey field
      operationId: survey_fields-show
      description: Retrieve a single survey field by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the survey field to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/single_survey_field'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Survey Fields
      summary: Updates a survey field
      operationId: survey_fields-update
      description: Update a survey field.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the survey field to update.
      requestBody:
        $ref: '#/components/requestBodies/survey_field'
      responses:
        '200':
          $ref: '#/components/responses/single_survey_field'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_survey_field'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content_survey_field:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_survey_field'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    single_survey_field:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single survey_field record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned survey_field resource.
                properties:
                  attributes:
                    type: object
                    description: Survey field attributes.
                    properties:
                      aggregation_type_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_survey_field/properties/aggregation_type_id'
                          - type: 'null'
                        description: The aggregation type for responses (e.g. sum, average, count).
                      archived_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_survey_field/properties/archived_at'
                          - type: 'null'
                        description: The timestamp when the survey field was archived, or null if active.
                      created_at:
                        $ref: '#/components/schemas/resource_survey_field/properties/created_at'
                      customizable_type:
                        $ref: '#/components/schemas/resource_survey_field/properties/customizable_type'
                      data_type_id:
                        $ref: '#/components/schemas/resource_survey_field/properties/data_type_id'
                      formatting_type_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_survey_field/properties/formatting_type_id'
                          - type: 'null'
                        description: The formatting type identifier for this field (e.g. currency, percentage).
                      global:
                        anyOf:
                          - $ref: '#/components/schemas/resource_survey_field/properties/global'
                          - type: 'null'
                        description: Whether this field is a global system field.
                      name:
                        $ref: '#/components/schemas/resource_survey_field/properties/name'
                      position:
                        $ref: '#/components/schemas/resource_survey_field/properties/position'
                      quick_add_enabled:
                        $ref: '#/components/schemas/resource_survey_field/properties/quick_add_enabled'
                      required:
                        $ref: '#/components/schemas/resource_survey_field/properties/required'
                      sensitive:
                        $ref: '#/components/schemas/resource_survey_field/properties/sensitive'
                      show_in_add_edit_views:
                        $ref: '#/components/schemas/resource_survey_field/properties/show_in_add_edit_views'
                      updated_at:
                        $ref: '#/components/schemas/resource_survey_field/properties/updated_at'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Survey field relationships.
                    properties:
                      custom_field_people:
                        $ref: '#/components/schemas/_collection_relationship'
                      options:
                        $ref: '#/components/schemas/_collection_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      origin_field:
                        $ref: '#/components/schemas/_single_relationship'
                      survey:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '45'
                type: survey_fields
                attributes:
                  label: How satisfied are you with the project outcome?
                  field_type: rating
                  required: true
                  position: 1
                relationships:
                  survey:
                    data:
                      type: surveys
                      id: '7'
              included: []
      description: Single survey field
    collection_survey_field:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of survey field records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A survey field resource object.
                  properties:
                    attributes:
                      type: object
                      description: Survey field attributes.
                      properties:
                        aggregation_type_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_survey_field/properties/aggregation_type_id'
                            - type: 'null'
                          description: How responses to this field are aggregated in reports.
                        archived_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_survey_field/properties/archived_at'
                            - type: 'null'
                          description: Timestamp when this survey field was archived.
                        created_at:
                          $ref: '#/components/schemas/resource_survey_field/properties/created_at'
                        customizable_type:
                          $ref: '#/components/schemas/resource_survey_field/properties/customizable_type'
                        data_type_id:
                          $ref: '#/components/schemas/resource_survey_field/properties/data_type_id'
                        formatting_type_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_survey_field/properties/formatting_type_id'
                            - type: 'null'
                          description: The formatting type applied to values in this field.
                        global:
                          anyOf:
                            - $ref: '#/components/schemas/resource_survey_field/properties/global'
                            - type: 'null'
                          description: Whether this field is available globally across all surveys.
                        name:
                          $ref: '#/components/schemas/resource_survey_field/properties/name'
                        position:
                          $ref: '#/components/schemas/resource_survey_field/properties/position'
                        quick_add_enabled:
                          $ref: '#/components/schemas/resource_survey_field/properties/quick_add_enabled'
                        required:
                          $ref: '#/components/schemas/resource_survey_field/properties/required'
                        sensitive:
                          $ref: '#/components/schemas/resource_survey_field/properties/sensitive'
                        show_in_add_edit_views:
                          $ref: '#/components/schemas/resource_survey_field/properties/show_in_add_edit_views'
                        updated_at:
                          $ref: '#/components/schemas/resource_survey_field/properties/updated_at'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Survey field relationships.
                      properties:
                        custom_field_people:
                          $ref: '#/components/schemas/_collection_relationship'
                        options:
                          $ref: '#/components/schemas/_collection_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        origin_field:
                          $ref: '#/components/schemas/_single_relationship'
                        survey:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of survey field resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '45'
                  type: survey_fields
                  attributes:
                    label: How satisfied are you with the project outcome?
                    field_type: rating
                    required: true
                    position: 1
                  relationships:
                    survey:
                      data:
                        type: surveys
                        id: '7'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection survey field
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_survey_field:
      enum:
        - bad_decimal_format
        - data_type_not_compatible_with_origin_field
        - invalid_attribute_value
        - non_finite_number
        - null_bytes_in_params
        - origin_field_not_in_project
        - origin_field_used_in_other_survey_fields
      type: string
      title: Error Code
      description: Every error `code` the survey fields endpoints can return.
    error_code_unsupported_media_type:
      enum:
        - unsupported_content_type
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 415.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_not_acceptable:
      enum:
        - bulk_extensions_headers_invalid
        - not_acceptable
        - read_only_mode_violation
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 406.
    error_code_not_found:
      enum:
        - not_found
        - record_not_found
        - route_not_found
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 404.
    error_code_forbidden:
      enum:
        - access_denied
        - account_inactive
        - agent_role_impersonation_denied
        - automatic_invoicing_not_manageable
        - billing_catalog_list_unavailable
        - booking_conflict_resolver_unavailable
        - budget_inaccessible
        - budgets_not_manageable
        - cascade_deletion_blocked
        - custom_roles_unavailable
        - deactivated_organization
        - deal_proposal_analytics_unavailable
        - deal_proposal_public_link_unavailable
        - document_styler_unavailable
        - document_templates_unavailable
        - email_inbox_unavailable
        - entry_not_editable
        - expense_not_editable
        - feature_unavailable
        - finalized_invoice_permission
        - financials_unavailable
        - impersonation_on_account_not_allowed
        - insufficient_automation_permission
        - insufficient_project_access
        - insufficient_seats
        - invalid_impersonate_role_id_header
        - invoices_unavailable
        - login_unavailable
        - mcp_access_disabled
        - mcp_connectors_disabled
        - mcp_provider_unavailable
        - missing_slack_integration
        - no_client_access
