openapi: 3.1.0
info:
  title: Productive.io API – Artifacts
  version: 2.0.0
x-filters:
  artifact:
    creator_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    public_access:
      operators:
        - eq
        - not_eq
paths:
  /api/v2/artifacts/{id}:
    get:
      tags:
        - Artifacts
      summary: Gets an artifact
      operationId: artifacts-show
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_artifact'
    delete:
      tags:
        - Artifacts
      summary: Deletes an artifact
      operationId: artifacts-destroy
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '204':
          description: No Content
  /api/v2/artifacts:
    get:
      tags:
        - Artifacts
      summary: Get artifacts
      operationId: artifacts-index
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_artifact'
        - $ref: '#/components/parameters/filter_artifact'
      responses:
        '200':
          $ref: '#/components/responses/collection_artifact'
  /api/v2/artifacts/{id}/publish:
    patch:
      tags:
        - Artifacts
      summary: Publishes an artifact
      operationId: artifacts-publish-publish
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_artifact'
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
  /api/v2/artifacts/{id}/unpublish:
    patch:
      tags:
        - Artifacts
      summary: Unpublishes an artifact
      operationId: artifacts-unpublish-unpublish
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_artifact'
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
  /api/v2/public/artifacts/{uuid}/attachments/{id}/auth:
    get:
      tags:
        - Artifacts
      summary: Authenticates access to a public artifact attachment
      security: []
      operationId: public-artifacts-attachments-auth
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - in: path
          name: uuid
          schema:
            type: string
          required: true
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
  /api/v2/public/artifacts/{uuid}:
    get:
      tags:
        - Artifacts
      summary: Gets a public artifact
      security: []
      operationId: public-artifacts-show
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_artifact'
        '404':
          description: Not Found
components:
  responses:
    single_artifact:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      public_uuid:
                        $ref: '#/components/schemas/resource_artifact/properties/public_uuid'
                      created_at:
                        $ref: '#/components/schemas/resource_artifact/properties/created_at'
                      description:
                        $ref: '#/components/schemas/resource_artifact/properties/description'
                      public_access:
                        $ref: '#/components/schemas/resource_artifact/properties/public_access'
                      name:
                        $ref: '#/components/schemas/resource_artifact/properties/name'
                      updated_at:
                        $ref: '#/components/schemas/resource_artifact/properties/updated_at'
                  relationships:
                    type: object
                    properties:
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      attachment:
                        $ref: '#/components/schemas/_single_relationship'
      description: Single artifact
    collection_artifact:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              meta:
                $ref: '#/components/schemas/_meta'
              data:
                type: array
                items:
                  type: object
                  properties:
                    relationships:
                      type: object
                      properties:
                        attachment:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                    attributes:
                      type: object
                      properties:
                        public_uuid:
                          $ref: '#/components/schemas/resource_artifact/properties/public_uuid'
                        created_at:
                          $ref: '#/components/schemas/resource_artifact/properties/created_at'
                        updated_at:
                          $ref: '#/components/schemas/resource_artifact/properties/updated_at'
                        description:
                          $ref: '#/components/schemas/resource_artifact/properties/description'
                        public_access:
                          $ref: '#/components/schemas/resource_artifact/properties/public_access'
                        name:
                          $ref: '#/components/schemas/resource_artifact/properties/name'
              included:
                type: array
                items: {}
      description: Collection artifact
  schemas:
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    resource_artifact:
      type: object
      title: Artifact Resource
      properties:
        public_access:
          type: boolean
          title: Public Access
        public_uuid:
          type: string
          title: Public Uuid
        creator_id:
          type: integer
        id:
          type: integer
        created_at:
          type: string
          title: Created At
          format: date-time
        description:
          type: string
          title: Description
        updated_at:
          type: string
          title: Updated At
          format: date-time
        name:
          type: string
          title: Name
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_artifact:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.artifact at the top of this file.
      required: false
    sort_artifact:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - created_at
            - -created_at
            - name
            - -name
            - updated_at
            - -updated_at
          type: string
        title: Sort artifact
      explode: false
      required: false
