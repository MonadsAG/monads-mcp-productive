paths:
  /api/v2/time_entries/approve:
    patch:
      tags:
        - Time Entries - Bulk
      summary: Approves time entries
      responses:
        '200':
          $ref: '#/components/responses/single_time_entry'
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: time_entries-approve-update-bulk
      requestBody:
        $ref: '#/components/requestBodies/time_entry'
      description: Approve a time entry (alternate endpoint).
  /api/v2/time_entries:
    post:
      tags:
        - Time Entries - Bulk
      summary: Create time entries
      responses:
        '201':
          $ref: '#/components/responses/single_time_entry'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: time_entries-create-bulk
      requestBody:
        $ref: '#/components/requestBodies/time_entry'
      description: Create a new time entry.
    patch:
      tags:
        - Time Entries - Bulk
      summary: Update time entries
      responses:
        '200':
          $ref: '#/components/responses/single_time_entry'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: time_entries-update-bulk
      requestBody:
        $ref: '#/components/requestBodies/time_entry'
      description: Update multiple time entries.
    delete:
      tags:
        - Time Entries - Bulk
      summary: Deletes time entries
      responses:
        '204':
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: time_entries-destroy-bulk
      description: Delete multiple time entries.
  /api/v2/time_entries/unapprove:
    patch:
      tags:
        - Time Entries - Bulk
      summary: Unapproves time entries
      responses:
        '200':
          $ref: '#/components/responses/single_time_entry'
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: time_entries-unapprove-update-bulk
      requestBody:
        $ref: '#/components/requestBodies/time_entry'
      description: Revoke approval of a time entry (alternate endpoint).
components:
  requestBodies:
    time_entry:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - service_id
                      - person_id
                      - date
                      - time
                    properties:
                      date:
                        $ref: '#/components/schemas/resource_time_entry/properties/date'
                      note:
                        $ref: '#/components/schemas/resource_time_entry/properties/note'
                      time:
                        $ref: '#/components/schemas/resource_time_entry/properties/time'
                      task_id:
                        $ref: '#/components/schemas/resource_time_entry/properties/task_id'
                      person_id:
                        $ref: '#/components/schemas/resource_time_entry/properties/person_id'
                      service_id:
                        $ref: '#/components/schemas/resource_time_entry/properties/service_id'
                      started_at:
                        $ref: '#/components/schemas/resource_time_entry/properties/started_at'
                      billable_time:
                        $ref: '#/components/schemas/resource_time_entry/properties/billable_time'
                      jira_issue_id:
                        $ref: '#/components/schemas/resource_time_entry/properties/jira_issue_id'
                      jira_worklog_id:
                        $ref: '#/components/schemas/resource_time_entry/properties/jira_worklog_id'
                      calendar_event_id:
                        $ref: '#/components/schemas/resource_time_entry/properties/calendar_event_id'
                      jira_issue_status:
                        $ref: '#/components/schemas/resource_time_entry/properties/jira_issue_status'
                      jira_organization:
                        $ref: '#/components/schemas/resource_time_entry/properties/jira_organization'
                      jira_issue_summary:
                        $ref: '#/components/schemas/resource_time_entry/properties/jira_issue_summary'
                      use_salary_currency:
                        $ref: '#/components/schemas/resource_time_entry/properties/use_salary_currency'
      description: Request body for creating or updating a time entry.
  schemas:
    resource_time_entry:
      type: object
      title: Time entry Resource
      properties:
        cost:
          title: Cost
          description: Total cost of tracked time, including labor and overhead costs.
          example:
            eq: value
        task_id:
          type: integer
          title: Task
          description: ID of the task the person was working on.
          example:
            - 123
        overhead_cost_normalized:
          title: Overhead Cost Normalized
          description: Total overhead cost in the normalized reporting currency.
          example:
            eq: value
        service:
          title: Service
          description: The budget service this time was tracked against.
          example:
            eq: value
        internal_overhead_cost_default:
          title: Internal Overhead Cost Default
          description: Internal overhead cost in the organization's default currency.
          example:
            eq: value
        work_cost_default:
          title: Work Cost Default
          description: Labor cost in the organization's default currency.
          example:
            eq: value
        currency_default:
          title: Currency Default
          description: Currency code in the organization's default currency.
          example:
            eq: value
        billable:
          type: boolean
          title: Billable
          description: Whether the associated service is billable.
          example: true
        date:
          type: string
          title: Date
          format: date
          description: Date for which the time was tracked.
          example:
            gt: '2026-01-01'
        started_at:
          type: string
          title: Started At
          format: date-time
          description: Start date and time of the time entry.
          example:
            gt: '2026-01-01'
        designated_approver_id:
          type: integer
          title: Designated Approver
          description: Filter time entries to those whose budget has the specified designated approver.
          example:
            - 123
        parent_company_id:
          type: integer
          title: Parent Company
          description: Filter time entries by the parent company of the client linked to their budget.
          example:
            - 123
        project_id:
          type: integer
          title: Project
          description: ID of the project associated with the service.
          example:
            - 123
        approved_at:
          type: string
          title: Approved At
          format: date-time
          description: Timestamp when the time entry was approved.
          example:
            gt: '2026-01-01'
        project_type_id:
          type: integer
          title: Project Type
          description: Project type ID.
          example:
            - 123
        timer_started_at:
          type: string
          title: Timer Started At
          format: date-time
          description: When the timer was started (if tracked via timer).
          example:
            gt: '2026-01-01'
        assigned_approver_id:
          type: integer
          title: Assigned Approver
          description: assigned approver id of the time entry.
          example:
            - 123
        jira_issue_status:
          type: string
          title: Jira Issue Status
          description: Current status of the linked Jira issue.
          example:
            eq: active
        autotracked:
          type: boolean
          title: Autotracked
          description: autotracked of the time entry.
          example:
            eq: value
        jira_issue_summary:
          type: string
          title: Jira Issue Summary
          description: Summary text of the linked Jira issue.
          example:
            eq: value
        started_after:
          type: string
          title: Started After
          format: date
          description: Filter alias — only entries started after this value.
          example:
            eq: value
        invoice_attribution:
          title: Invoice Attribution
          description: The invoice attribution linking this entry to an invoice.
          example:
            gt: '2026-01-01'
        overhead:
          type: boolean
          title: Overhead
          description: Whether this time entry is included in overhead calculations.
          example:
            eq: value
        intercompany_hours:
          type: boolean
          title: Intercompany Hours
          description: True when the person's subsidiary differs from the deal subsidiary.
          example:
            eq: value
        responsible_id:
          type: integer
          title: Responsible
          description: ID of the responsible person.
          example:
            - 123
        use_salary_currency:
          type: boolean
          title: Use Salary Currency
          description: Whether to compute costs using the person's salary currency instead of the deal currency.
          example:
            eq: value
        awaiting_approval_from_approver_id:
          type: integer
          title: Awaiting Approval From Approver
          description: awaiting approval from approver id of the time entry.
          example:
            - 123
        budget_type_id:
          type: integer
          title: Budget Type
          description: Budget type ID of the associated deal.
          example:
            - 123
        overhead_cost:
          title: Overhead Cost
          description: Total overhead cost (internal + facility) of tracked time.
          example:
            eq: value
        base_cost:
          title: Base Cost
          description: Base labor cost before overhead (serialized from work_cost).
          example:
            eq: value
        timer_stopped_at:
          type: string
          title: Timer Stopped At
          format: date-time
          description: When the timer was stopped.
          example:
            gt: '2026-01-01'
        role_id:
          type: integer
          title: Role
          description: Role ID of the person who tracked time.
          example:
            - 123
        person_id:
          type: integer
          title: Person
          description: ID of the person who tracked time.
          example:
            - 123
        approver_id:
          type: integer
          title: Approver
          description: approver id of the time entry.
          example:
            - 123
        task:
          title: Task
          description: The task the person was working on.
          example:
            eq: value
        overhead_cost_default:
          title: Overhead Cost Default
          description: Total overhead cost in the organization's default currency.
          example:
            eq: value
        creator:
          title: Creator
          description: The person who created this time entry.
          example:
            eq: value
        facility_overhead_cost_default:
          title: Facility Overhead Cost Default
          description: Facility overhead cost in the organization's default currency.
          example:
            eq: value
        currency:
          type: string
          title: Currency
          description: Currency code for financial values on this time entry.
          example:
            eq: value
        approved:
          title: Approved
          description: Whether this time entry has been approved.
          example:
            eq: value
        approval_policy_id:
          type: integer
          title: Approval Policy
          description: approval policy id of the time entry.
          example:
            - 123
        people_custom_fields:
          type: string
          title: People Custom Fields
          description: Custom field values for the person who tracked time.
          example:
            eq: value
        deal_subsidiary:
          title: Deal Subsidiary
          description: The subsidiary of the budget/deal this time was tracked on.
          example:
            eq: value
        started_before:
          type: string
          title: Started Before
          format: date
          description: Filter alias — only entries started before this value.
          example:
            eq: value
        work_cost_normalized:
          title: Work Cost Normalized
          description: Labor cost in the normalized reporting currency.
          example:
            eq: value
        after:
          type: string
          title: After
          format: date
          description: after of the time entry.
          example:
            eq: value
        last_actor:
          title: Last Actor
          description: The last person who made changes to this entry.
          example:
            eq: value
        facility_overhead_cost:
          title: Facility Overhead Cost
          description: Facility overhead portion of the cost.
          example:
            eq: value
        rejecter:
          title: Rejecter
          description: The person who rejected this time entry.
          example:
            eq: value
        submitted:
          title: Submitted
          description: Whether this time entry has been submitted for approval via a timesheet.
          example:
            eq: value
        note:
          type: string
          title: Note
          description: Description of what the person was working on.
          example:
            eq: value
        person_tags:
          type: string
          title: Person Tags
          description: Tags of the person who tracked time.
          example:
            eq: value
        approver:
          title: Approver
          description: The person who approved this time entry.
          example:
            eq: value
        person:
          title: Person
          description: The person who tracked this time.
          example:
            eq: value
        invoice_id:
          type: integer
          title: Invoice
          description: ID of the invoice associated via attribution.
          example:
            - 123
        person_name:
          title: Person Name
          description: Name of the person who tracked time.
          example:
            eq: value
        invoiced:
          type: boolean
          title: Invoiced
          description: Whether this time entry has been invoiced to the client.
          example:
            eq: value
        rejected:
          title: Rejected
          description: Whether this time entry was rejected during approval.
          example:
            eq: value
        facility_overhead_cost_normalized:
          title: Facility Overhead Cost Normalized
          description: Facility overhead cost in the normalized reporting currency.
          example:
            eq: value
        cost_default:
          title: Cost Default
          description: Total cost in the organization's default currency.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: Unique identifier of the time entry.
          example:
            - 123
        service_name:
          title: Service Name
          description: Name of the service the time was tracked against.
          example:
            eq: value
        person_subsidiary:
          title: Person Subsidiary
          description: The subsidiary of the person who tracked time.
          example:
            eq: value
        created_after:
          type: string
          title: Created After
          format: date
          description: Filter alias — only entries created after this value.
          example:
            eq: value
        work_cost:
