openapi: 3.1.0
info:
  title: Productive.io API – Salaries
  version: 2.0.0
description: |-
  For more details on salaries (also called cost rates) please refer to the [help article](https://help.productive.io/en/articles/2179644-understanding-and-setting-up-cost-rates-in-productive).

  The cost rate object represents invidual's cost rate defined for a certain period of time. A person can have multiple cost rates, however they cannot overlap in time. Cost rates can be defined for various period of times, such as hourly, monthly, etc. Note that different periods affect overheads differently (see the help article).

  For defining persons' cost rates specific to deals and budgets, please refer to [deal cost rates](https://developer.productive.io/deal_cost_rates.html#deal-cost-rates).

  Please note that we rate limit PATCH and POST api requests for editing salaries to 30 requests per two minutes.
x-filters:
  salary:
    after:
      description: Filter by after.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    before:
      description: Filter by before.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter by the associated person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/salaries:
    get:
      tags:
        - Salaries
      summary: Get salaries
      operationId: salaries-index
      description: List all salaries.
      parameters:
        - $ref: '#/components/parameters/filter_salary'
        - $ref: '#/components/parameters/sort_salary'
      responses:
        '200':
          $ref: '#/components/responses/collection_salary'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Salaries
      summary: Create a salary
      operationId: salaries-create
      description: Create a new salary.
      requestBody:
        $ref: '#/components/requestBodies/salary'
      responses:
        '201':
          $ref: '#/components/responses/single_salary'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_salary'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/salaries/{id}:
    get:
      tags:
        - Salaries
      summary: Gets a salary
      operationId: salaries-show
      description: Retrieve a single salary by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_salary'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Salaries
      summary: Update a salary
      operationId: salaries-update
      description: Update a salary.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/salary'
      responses:
        '200':
          $ref: '#/components/responses/single_salary'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_salary'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Salaries
      summary: Deletes a salary
      operationId: salaries-destroy
      description: Delete a salary by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/salaries/set_default:
    post:
      tags:
        - Salaries
      summary: Create the default salary of a person
      operationId: salaries-set_default
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        person_id:
                          type: integer
                      required:
                        - person_id
                    type:
                      type: string
                  required:
                    - type
                    - attributes
              required:
                - data
      responses:
        '201':
          $ref: '#/components/responses/single_salary'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_salary'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content_salary:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_salary'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    single_salary:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single salary record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned salary resource.
                properties:
                  attributes:
                    type: object
                    description: Salary attributes.
                    properties:
                      alternating_hours:
                        $ref: '#/components/schemas/resource_salary/properties/alternating_hours'
                      cost:
                        $ref: '#/components/schemas/resource_salary/properties/cost'
                      cost_default:
                        $ref: '#/components/schemas/resource_salary/properties/cost_default'
                      cost_normalized:
                        $ref: '#/components/schemas/resource_salary/properties/cost_normalized'
                      currency:
                        $ref: '#/components/schemas/resource_salary/properties/currency'
                      currency_default:
                        $ref: '#/components/schemas/resource_salary/properties/currency_default'
                      currency_normalized:
                        $ref: '#/components/schemas/resource_salary/properties/currency_normalized'
                      default_salary:
                        $ref: '#/components/schemas/resource_salary/properties/default_salary'
                      ended_on:
                        anyOf:
                          - $ref: '#/components/schemas/resource_salary/properties/ended_on'
                          - type: 'null'
                        description: The date when this salary period ends.
                      exchange_date:
                        anyOf:
                          - $ref: '#/components/schemas/resource_salary/properties/exchange_date'
                          - type: 'null'
                        description: The date used to determine the currency exchange rate.
                      exchange_rate:
                        anyOf:
                          - type: string
                          - type: 'null'
                        description: The exchange rate applied to convert salary amounts to the default currency.
                      hourly_rate:
                        $ref: '#/components/schemas/resource_salary/properties/hourly_rate'
                      hourly_rate_default:
                        $ref: '#/components/schemas/resource_salary/properties/hourly_rate_default'
                      hourly_rate_normalized:
                        $ref: '#/components/schemas/resource_salary/properties/hourly_rate_normalized'
                      note:
                        $ref: '#/components/schemas/resource_salary/properties/note'
                      overhead:
                        $ref: '#/components/schemas/resource_salary/properties/overhead'
                      salary_type_id:
                        $ref: '#/components/schemas/resource_salary/properties/salary_type_id'
                      started_on:
                        $ref: '#/components/schemas/resource_salary/properties/started_on'
                      working_hours:
                        type: array
                        items:
                          type: number
                        description: The number of working hours per day for this salary.
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Salary relationships.
                    properties:
                      holiday_calendar:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      person:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '34'
                type: salaries
                attributes:
                  default_salary: true
                  started_on: '2026-01-01'
                  ended_on: null
                  salary_type_id: 1
                  working_hours: 40
                  overhead: false
                  note: null
                  exchange_rate: null
                  exchange_date: null
                  currency: USD
                  cost: '85000.00'
                  hourly_rate: '51.44'
                relationships:
                  person:
                    data:
                      type: people
                      id: '12'
                  holiday_calendar:
                    data:
                      type: holiday_calendars
                      id: '3'
              included: []
      description: Single salary
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    collection_salary:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of salary records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A salary resource object.
                  properties:
                    attributes:
                      type: object
                      description: Salary attributes.
                      properties:
                        alternating_hours:
                          $ref: '#/components/schemas/resource_salary/properties/alternating_hours'
                        cost:
                          $ref: '#/components/schemas/resource_salary/properties/cost'
                        cost_default:
                          $ref: '#/components/schemas/resource_salary/properties/cost_default'
                        cost_normalized:
                          $ref: '#/components/schemas/resource_salary/properties/cost_normalized'
                        currency:
                          $ref: '#/components/schemas/resource_salary/properties/currency'
                        currency_default:
                          $ref: '#/components/schemas/resource_salary/properties/currency_default'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_salary/properties/currency_normalized'
                        default_salary:
                          $ref: '#/components/schemas/resource_salary/properties/default_salary'
                        ended_on:
                          anyOf:
                            - $ref: '#/components/schemas/resource_salary/properties/ended_on'
                            - type: 'null'
                          description: The date this salary record ends.
                        exchange_date:
                          anyOf:
                            - $ref: '#/components/schemas/resource_salary/properties/exchange_date'
                            - type: 'null'
                          description: The date used for exchange rate calculation.
                        exchange_rate:
                          anyOf:
                            - type: string
                            - type: 'null'
                          description: The exchange rate applied for currency conversion.
                        hourly_rate:
                          $ref: '#/components/schemas/resource_salary/properties/hourly_rate'
                        hourly_rate_default:
                          $ref: '#/components/schemas/resource_salary/properties/hourly_rate_default'
                        hourly_rate_normalized:
                          $ref: '#/components/schemas/resource_salary/properties/hourly_rate_normalized'
                        note:
                          $ref: '#/components/schemas/resource_salary/properties/note'
                        overhead:
                          $ref: '#/components/schemas/resource_salary/properties/overhead'
                        salary_type_id:
                          $ref: '#/components/schemas/resource_salary/properties/salary_type_id'
                        started_on:
                          $ref: '#/components/schemas/resource_salary/properties/started_on'
                        working_hours:
                          type: array
                          items:
                            type: number
                          description: Daily working hours for this person.
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Salary relationships.
                      properties:
                        holiday_calendar:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of salary resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '34'
                  type: salaries
                  attributes:
                    default_salary: true
                    started_on: '2026-01-01'
                    ended_on: null
                    salary_type_id: 1
                    working_hours: 40
                    overhead: false
                    note: null
                    exchange_rate: null
                    exchange_date: null
                    currency: USD
                    cost: '85000.00'
                    hourly_rate: '51.44'
                  relationships:
                    person:
                      data:
                        type: people
                        id: '12'
                    holiday_calendar:
                      data:
                        type: holiday_calendars
                        id: '3'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection salary
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_salary:
      enum:
        - already_has_salaries
        - bad_decimal_format
        - currency_invalid
        - invalid_attribute_value
        - non_finite_number
        - not_accessible_for_salary_assignment
        - null_bytes_in_params
        - period_overlap
        - working_hours_count_invalid
        - working_hours_weeks_mismatch
      type: string
      title: Error Code
      description: Every error `code` the salaries endpoints can return in a 422 response.
    error_code_unsupported_media_type:
      enum:
        - unsupported_content_type
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 415.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
