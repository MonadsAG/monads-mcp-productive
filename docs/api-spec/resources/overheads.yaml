          title: Updater
          description: The person who last updated this overhead record.
          example:
            eq: value
        internal_componentized_costs:
          title: Internal Componentized Costs
          description: The total internal costs including work, time-off, and expenses, adjusted for overhead inclusion controls.
          example:
            eq: value
        total_hours:
          type: number
          title: Total Hours
          description: Total hours tracked across all project types during this overhead period.
          example:
            eq: value
        facility_costs_breakdown:
          type: object
          title: Facility Costs Breakdown
          description: A breakdown of facility costs by category (e.g. rent, utilities) for this overhead period.
          example:
            eq: value
        overhead_controls:
          type: object
          title: Overhead Controls
          description: A set of flags controlling which overhead types (facility, work, time-off, expense, undertime, overtime) are included in cost calculations.
          example:
            eq: value
        facility_cost_per_hour_default:
          title: Facility Cost Per Hour Default
          description: The facility cost per hour default.
          example:
            eq: value
        overtracked_costs:
          title: Overtracked Costs
          description: The cost associated with overtracked hours — when employees tracked more time than their scheduled capacity.
          example:
            eq: value
        recalculated_at:
          type: string
          title: Recalculated At
          format: date-time
          description: Timestamp when the overhead costs were last recalculated from tracked time and bookings.
          example:
            gt: '2026-01-01'
        currency_normalized:
          title: Currency Normalized
          description: The monetary values in this overhead record in the normalized (display) currency.
          example:
            eq: value
        internal_hours:
          type: number
          title: Internal Hours
          description: Total hours tracked on internal (non-billable) projects during this overhead period.
