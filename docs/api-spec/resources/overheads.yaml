        subsidiary_id:
          type: integer
          title: Subsidiary
          description: ID of the subsidiary this overhead record is associated with (null for global overheads).
          example:
            - 123
        averaging_period:
          type: integer
          title: Averaging Period
          description: The number of past overhead periods used to calculate projected estimates when averaging is enabled.
          example:
            eq: value
        undertracked_costs:
          title: Undertracked Costs
          description: The cost associated with undertracked hours — when employees tracked less time than their scheduled capacity.
          example:
            eq: value
        internal_work_costs:
          title: Internal Work Costs
          description: The total cost of time tracked on internal projects during this overhead period.
          example:
            eq: value
      description: An overhead record representing the internal cost breakdown for a subsidiary over a billing period.
      example:
        id: '23'
        type: overheads
        attributes:
          name: Team Building & Offsites
          archived_at: null
        relationships: {}
    _meta:
      type: object
