          description: The organization this overhead record belongs to.
          example:
            eq: value
        new_internal_cost_per_hour_default:
          title: New Internal Cost Per Hour Default
          description: The new internal cost per hour default.
          example:
            eq: value
        capacity:
          type: number
          title: Capacity
          description: The total available work capacity in hours for the period, based on employee schedules.
          example:
            eq: value
        new_internal_cost_per_hour_normalized:
          title: New Internal Cost Per Hour Normalized
          description: The new internal cost per hour normalized.
          example:
            eq: value
        internal_expense_costs_default:
          title: Internal Expense Costs Default
          description: The internal expense costs default.
          example:
            eq: value
        internal_work_costs_default:
          title: Internal Work Costs Default
          description: The internal work costs default.
          example:
            eq: value
        overtracked_hours:
          type: number
          title: Overtracked Hours
          description: Hours tracked in excess of the employee's scheduled capacity during this period.
          example:
            eq: value
        started_on:
          type: string
          title: Started On
          format: date
          description: Date when this overhead period starts.
          example:
            eq: value
        recalculating_status:
          type: object
          title: Recalculating Status
          description: The current recalculation status of this overhead, tracking whether bookings and time entries have been processed.
          example:
            eq: active
        uses_averaging:
          type: boolean
          title: Uses Averaging
          description: When true, overhead costs are averaged over multiple past periods rather than using a single period's values.
          example:
            eq: value
        time_off_costs:
          title: Time Off Costs
          description: The total cost of paid time-off hours during this overhead period.
          example:
            gt: 0
        ended_on:
          type: string
          title: Ended On
          format: date
          description: Date when this overhead period ends, or null if this is the current projection period.
          example:
            eq: value
        use_overhead:
          type: boolean
          title: Use Overhead
          description: When true, overhead calculations are enabled and applied to cost rate computations for this subsidiary.
          example:
            eq: value
        facility_cost_per_hour:
          title: Facility Cost Per Hour
          description: The facility cost per hour.
          example:
            eq: value
        internal_work_costs_normalized:
          title: Internal Work Costs Normalized
          description: The internal work costs normalized.
          example:
            eq: value
        overhead_hours:
          type: number
          title: Overhead Hours
          description: Total hours marked as overhead across all project types during this period.
          example:
            eq: value
        facility_costs_default:
          title: Facility Costs Default
          description: The facility costs converted to the organization's default currency.
          example:
            eq: value
        internal_componentized_costs_default:
          title: Internal Componentized Costs Default
          description: The internal componentized costs default.
          example:
            eq: value
        currency:
          type: string
          title: Currency
          description: The currency of monetary values in this overhead record.
          example:
            eq: value
        client_overhead_hours:
          type: number
          title: Client Overhead Hours
          description: Hours tracked on billable client projects that are marked as overhead during this period.
          example:
            eq: value
        overhead_type_id:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Overhead Type
        time_off_costs_default:
          title: Time Off Costs Default
          description: The time off costs default.
          example:
            gt: 0
        currency_default:
          title: Currency Default
          description: The monetary values in this overhead record converted to the organization's default currency.
          example:
            eq: value
        internal_componentized_costs_normalized:
          title: Internal Componentized Costs Normalized
          description: The internal componentized costs normalized.
          example:
            eq: value
        client_hours:
          type: number
          title: Client Hours
          description: Total hours tracked on billable client projects during this overhead period.
          example:
            eq: value
        undertracked_costs_normalized:
          title: Undertracked Costs Normalized
          description: The undertracked costs in the normalized (display) currency.
          example:
            eq: value
        overtracked_costs_normalized:
          title: Overtracked Costs Normalized
          description: The overtracked costs in the normalized (display) currency.
          example:
            eq: value
        intercompany_hours:
          type: number
          title: Intercompany Hours
        exchange_rate:
          type: number
          title: Exchange Rate
          description: The exchange rate used to convert costs to the organization's default currency for this period.
          example:
            gt: 0
        internal_expense_costs:
          title: Internal Expense Costs
          description: The total cost of internal expense reports during this overhead period.
          example:
            eq: value
        time_off_costs_normalized:
          title: Time Off Costs Normalized
          description: The time off costs normalized.
          example:
            gt: 0
        internal_expense_costs_normalized:
          title: Internal Expense Costs Normalized
          description: The internal expense costs normalized.
          example:
            eq: value
        overtracked_costs_default:
          title: Overtracked Costs Default
          description: The overtracked costs converted to the organization's default currency.
          example:
            eq: value
