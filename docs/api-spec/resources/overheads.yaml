openapi: 3.1.0
info:
  title: Productive.io API – Overheads
  version: 2.0.0
description: |-
  For more details about what overheads are, please refer to the [help article](https://help.productive.io/en/articles/6839043-overhead-cost).

  The Overhead object represents overhead costs for a particular month of a fiscal year. Productive generates overhead objects automatically every month, starting the month when you opened your Productive account.

  Please note that some overhead settings are also defined at the organisation level. This settings can be changed by modifying the Organizations object.
x-filters:
  overhead:
    subsidiary_id:
      description: Filter by the associated subsidiary.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    overhead_type_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/overheads:
    get:
      tags:
        - Overheads
      summary: Get overheads
      responses:
        '200':
          $ref: '#/components/responses/collection_overhead'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_overhead'
        - $ref: '#/components/parameters/sort_overhead'
      operationId: overheads-index
      description: List overheads.
  /api/v2/overheads/{id}/recalculate:
    patch:
      tags:
        - Overheads
      summary: Recalculate an overhead
      responses:
        '200':
          $ref: '#/components/responses/single_overhead'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: overheads-recalculate-recalculate
      description: Recalculate overhead costs for a period.
  /api/v2/overheads/{id}:
    get:
      tags:
        - Overheads
      summary: Gets an overhead
      responses:
        '200':
          $ref: '#/components/responses/single_overhead'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: overheads-show
      description: Retrieve a single overhead record.
    patch:
      tags:
        - Overheads
      summary: Update an overhead
      responses:
        '200':
          $ref: '#/components/responses/single_overhead'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: overheads-update
      requestBody:
        $ref: '#/components/requestBodies/overhead'
      description: Update an overhead record.
components:
  requestBodies:
    overhead:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      use_overhead:
                        $ref: '#/components/schemas/resource_overhead/properties/use_overhead'
                      facility_costs:
                        $ref: '#/components/schemas/resource_overhead/properties/facility_costs'
                      averaging_period:
                        $ref: '#/components/schemas/resource_overhead/properties/averaging_period'
                      overhead_controls:
                        $ref: '#/components/schemas/resource_overhead/properties/overhead_controls'
                      facility_costs_breakdown:
                        $ref: '#/components/schemas/resource_overhead/properties/facility_costs_breakdown'
      description: Request body for creating or updating an overhead configuration.
  schemas:
    resource_overhead:
      type: object
      title: Overhead Resource
      properties:
        subsidiary:
          title: Subsidiary
          description: The subsidiary this overhead record is associated with (null for global overheads).
          example:
            eq: value
        internal_overhead_hours:
          type: number
          title: Internal Overhead Hours
          description: Hours tracked on internal projects that are marked as overhead during this period.
          example:
            eq: value
        undertracked_costs_default:
          title: Undertracked Costs Default
          description: The undertracked costs converted to the organization's default currency.
          example:
            eq: value
        facility_costs_normalized:
          title: Facility Costs Normalized
          description: The facility costs in the normalized (display) currency.
          example:
            eq: value
        facility_costs:
          type: integer
          title: Facility Costs
          description: The total facility (office and infrastructure) costs allocated to this overhead period.
          example:
            eq: value
        time_off_hours:
          type: number
          title: Time Off Hours
          description: Total paid time-off hours taken by employees during this overhead period.
          example:
