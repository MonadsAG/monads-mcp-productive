openapi: 3.1.0
info:
  title: Productive.io API – Invoice Templates
  version: 2.0.0
description: |-
  **Invoice templates** (document types) define the layout, content, and branding for PDF-generated invoices and financial documents — controlling headers, footers, logos, and displayed fields.

  Assign templates to subsidiaries to produce consistently branded, client-facing billing documents.
x-filters:
  invoice_template:
    issuer_id:
      description: Filter by the person set as the invoice issuer.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_id:
      description: Filter by the associated budget.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by invoice template ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter by the associated subsidiary.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    document_type_id:
      description: Filter by document type.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by client company.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_fields:
      description: Filter by custom field values.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who created the invoice template.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/invoice_templates:
    get:
      tags:
        - Invoice Templates
      summary: Get invoice templates
      responses:
        '200':
          $ref: '#/components/responses/collection_invoice_template'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_invoice_template'
        - $ref: '#/components/parameters/sort_invoice_template'
      operationId: invoice_templates-index
      description: List invoice templates.
    post:
      tags:
        - Invoice Templates
      summary: Create an invoice template
      responses:
        '201':
          $ref: '#/components/responses/single_invoice_template'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: invoice_templates-create
      requestBody:
        $ref: '#/components/requestBodies/invoice_template'
      description: Create a new invoice template.
  /api/v2/invoice_templates/{id}:
    get:
      tags:
        - Invoice Templates
      summary: Gets an invoice template
      responses:
        '200':
          $ref: '#/components/responses/single_invoice_template'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the invoice template to retrieve.
      operationId: invoice_templates-show
      description: Retrieve a single invoice template.
    patch:
      tags:
        - Invoice Templates
      summary: Update an invoice template
      responses:
        '200':
          $ref: '#/components/responses/single_invoice_template'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the invoice template to update.
        - $ref: '#/components/parameters/header_organization'
      operationId: invoice_templates-update
      requestBody:
        $ref: '#/components/requestBodies/invoice_template'
      description: Update an invoice template.
    delete:
      tags:
        - Invoice Templates
      summary: Deletes an invoice template
      responses:
        '204':
          description: No Content
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the invoice template to delete.
        - $ref: '#/components/parameters/header_organization'
      operationId: invoice_templates-destroy
      description: Delete an invoice template.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_invoice_template:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - created_at
            - -created_at
            - id
            - -id
          type: string
        title: Sort invoice template
      explode: false
      required: false
      description: Sort order for invoice template list results. Accepts one or more field names, comma-separated; prefix with `-` for descending. --branch descriptions
    filter_invoice_template:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.invoice_template at the top of this file.
      required: false
      description: Filter parameter for querying invoice templates.
  requestBodies:
    invoice_template:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      note:
                        $ref: '#/components/schemas/resource_invoice_template/properties/note'
                      budget_id:
                        $ref: '#/components/schemas/resource_invoice_template/properties/budget_id'
                      issuer_id:
                        $ref: '#/components/schemas/resource_invoice_template/properties/issuer_id'
                      custom_fields:
                        $ref: '#/components/schemas/resource_invoice_template/properties/custom_fields'
                      subsidiary_id:
                        $ref: '#/components/schemas/resource_invoice_template/properties/subsidiary_id'
                      bank_account_id:
                        $ref: '#/components/schemas/resource_invoice_template/properties/bank_account_id'
                      document_type_id:
                        $ref: '#/components/schemas/resource_invoice_template/properties/document_type_id'
                      bank_account_details:
                        $ref: '#/components/schemas/resource_invoice_template/properties/bank_account_details'
                      invoice_creation_options:
                        $ref: '#/components/schemas/resource_invoice_template/properties/invoice_creation_options'
      description: Request body for creating or updating an invoice template.
  schemas:
    resource_invoice_template:
      type: object
      title: Invoice template Resource
      properties:
        subject:
          title: Subject
          description: The default subject line used on invoices generated from this template, typically the budget name.
          example:
            eq: value
        issuer_id:
          type: integer
          title: Issuer
          description: ID of the person designated as the issuer on invoices generated from this template.
          example:
            - 123
        payment_terms_type:
          enum:
            - days_after_invoice_date
            - end_of_month
            - due_upon_receipt
          type: string
          title: Payment Terms Type
          nullable: true
        issuer:
          title: Issuer
          description: The person designated as the issuer on invoices generated from this template.
          example:
            eq: value
        document_type_id:
          type: integer
          title: Document Type
          description: ID of the document type used for invoices generated from this template.
          example:
            - 123
        company_id:
          type: integer
          title: Company
          description: ID of the company (client) associated with the budget for this invoice template.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this invoice template belongs to.
          example:
            eq: value
        invoice_creation_options:
          type: object
          title: Invoice Creation Options
          description: A JSON object containing rules used to determine which services or time entries to include when auto-generating invoice line items.
          example:
            eq: value
        created_at:
          title: Created At
          description: Timestamp when this invoice template was created.
          example:
            gt: '2026-01-01'
        document_type:
          title: Document Type
          description: The document type used for invoices generated from this template.
          example:
            eq: active
        bank_account_details:
          type: object
          title: Bank Account Details
          description: Custom bank account details (as a JSON object) to display on generated invoices, overriding the default bank account details.
          example:
            gt: 0
        budget_id:
          type: integer
          title: Budget
          description: ID of the budget this invoice template is linked to.
          example:
            - 123
        budget:
          title: Budget
          description: The budget this invoice template is linked to.
          example:
            gt: 0
        bank_account:
          title: Bank Account
          description: The bank account associated with this invoice template, used on generated invoices.
          example:
            gt: 0
        creator:
          title: Creator
          description: The person who created this invoice template.
          example:
            eq: value
        subsidiary:
          title: Subsidiary
          description: The subsidiary used as the issuing entity on invoices generated from this template.
          example:
            eq: value
        subsidiary_id:
          type: integer
          title: Subsidiary
          description: ID of the subsidiary used as the issuing entity on invoices generated from this template.
          example:
            - 123
        note:
          type: string
          title: Note
          description: The default note text to include on invoices generated from this template.
          example:
            eq: value
        bank_account_id:
          type: integer
          title: Bank Account
          description: ID of the bank account used for invoices generated from this template.
          example:
            - 123
        id:
          type: integer
          title: Id
          description: Unique identifier of this invoice template.
          example:
            - 123
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who created this invoice template.
          example:
            - 123
        payment_terms_days:
          type: integer
          title: Payment Terms Days
          nullable: true
        custom_fields:
          type: object
          title: Custom Fields
          description: Custom field values for this invoice template.
          example:
            eq: value
      description: An invoice template is linked to a specific budget and stores the default settings (document type, bank account, issuer, etc.) used when automatically generating invoice drafts for that budget.
      example:
        id: '5'
        type: invoice_templates
        attributes:
          name: Standard Invoice
          default: true
          created_at: '2026-01-01T00:00:00.000+00:00'
        relationships: {}
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  responses:
    single_invoice_template:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      note:
                        $ref: '#/components/schemas/resource_invoice_template/properties/note'
                      subject:
                        $ref: '#/components/schemas/resource_invoice_template/properties/subject'
                      custom_fields:
                        $ref: '#/components/schemas/resource_invoice_template/properties/custom_fields'
                      payment_terms_days:
                        $ref: '#/components/schemas/resource_invoice_template/properties/payment_terms_days'
                      payment_terms_type:
                        $ref: '#/components/schemas/resource_invoice_template/properties/payment_terms_type'
                      bank_account_details:
                        $ref: '#/components/schemas/resource_invoice_template/properties/bank_account_details'
                      invoice_creation_options:
                        $ref: '#/components/schemas/resource_invoice_template/properties/invoice_creation_options'
                  relationships:
                    type: object
                    properties:
                      budget:
                        $ref: '#/components/schemas/_single_relationship'
                      issuer:
                        $ref: '#/components/schemas/_single_relationship'
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      subsidiary:
                        $ref: '#/components/schemas/_single_relationship'
                      bank_account:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      document_type:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single invoice template
    collection_invoice_template:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        note:
                          $ref: '#/components/schemas/resource_invoice_template/properties/note'
                        subject:
                          $ref: '#/components/schemas/resource_invoice_template/properties/subject'
                        custom_fields:
                          $ref: '#/components/schemas/resource_invoice_template/properties/custom_fields'
                        payment_terms_days:
                          $ref: '#/components/schemas/resource_invoice_template/properties/payment_terms_days'
                        payment_terms_type:
                          $ref: '#/components/schemas/resource_invoice_template/properties/payment_terms_type'
                        bank_account_details:
                          $ref: '#/components/schemas/resource_invoice_template/properties/bank_account_details'
                        invoice_creation_options:
                          $ref: '#/components/schemas/resource_invoice_template/properties/invoice_creation_options'
                    relationships:
                      type: object
                      properties:
                        budget:
                          $ref: '#/components/schemas/_single_relationship'
                        issuer:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                        bank_account:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        document_type:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection invoice template
