    single_scenario_item:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Single scenario item record in JSON:API format.
            properties:
              data:
                type: object
                description: A scenario item resource object.
                properties:
                  attributes:
                    type: object
                    description: Scenario item attributes.
                    properties:
                      cost:
                        $ref: '#/components/schemas/resource_scenario_item/properties/cost'
                      cost_default:
                        $ref: '#/components/schemas/resource_scenario_item/properties/cost_default'
                      cost_normalized:
                        $ref: '#/components/schemas/resource_scenario_item/properties/cost_normalized'
                      currency:
                        $ref: '#/components/schemas/resource_scenario_item/properties/currency'
                      currency_default:
                        $ref: '#/components/schemas/resource_scenario_item/properties/currency_default'
                      currency_normalized:
                        $ref: '#/components/schemas/resource_scenario_item/properties/currency_normalized'
                      end_date:
                        $ref: '#/components/schemas/resource_scenario_item/properties/end_date'
                      markup:
                        $ref: '#/components/schemas/resource_scenario_item/properties/markup'
                      name:
                        $ref: '#/components/schemas/resource_scenario_item/properties/name'
                      price:
                        $ref: '#/components/schemas/resource_scenario_item/properties/price'
                      price_default:
                        $ref: '#/components/schemas/resource_scenario_item/properties/price_default'
                      price_normalized:
                        $ref: '#/components/schemas/resource_scenario_item/properties/price_normalized'
                      start_date:
                        $ref: '#/components/schemas/resource_scenario_item/properties/start_date'
                      used_quantity:
                        $ref: '#/components/schemas/resource_scenario_item/properties/used_quantity'
                    example:
                      start_date: '2026-03-02'
                      end_date: '2026-04-24'
                      used_quantity: '40.0'
                      markup: '20.0'
                      discount: '10.0'
                      cost: 9000
                      price: 12000
                  relationships:
                    type: object
                    description: Scenario item relationships.
                    properties:
                      booking:
                        $ref: '#/components/schemas/_single_relationship'
                      expense:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      person:
                        $ref: '#/components/schemas/_single_relationship'
                      scenario_bookings:
                        $ref: '#/components/schemas/_collection_relationship'
                      scenario_service:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      organization:
                        data:
                          type: organizations
                          id: '1'
                      person:
                        data:
                          type: people
                          id: '7'
                      scenario_service:
                        data:
                          type: scenario_services
                          id: '201'
                example:
                  id: '301'
                  type: scenario_items
                  attributes:
                    start_date: '2026-03-02'
                    end_date: '2026-04-24'
                    used_quantity: '40.0'
                    markup: '20.0'
                    discount: '10.0'
                    cost: 9000
                    price: 12000
                  relationships:
                    organization:
                      data:
                        type: organizations
                        id: '1'
                    person:
                      data:
                        type: people
                        id: '7'
                    scenario_service:
                      data:
                        type: scenario_services
                        id: '201'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    id: '7'
                    type: people
                    attributes:
                      first_name: Ana
                      last_name: Novak
                description: Sideloaded related resources.
                example:
                  - id: '7'
                    type: people
                    attributes:
                      first_name: Ana
                      last_name: Novak
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '301'
                type: scenario_items
                attributes:
                  start_date: '2026-03-02'
                  end_date: '2026-04-24'
                  used_quantity: '40.0'
                  markup: '20.0'
                  discount: '10.0'
                  cost: 9000
