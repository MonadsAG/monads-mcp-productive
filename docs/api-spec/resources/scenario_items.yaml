    resource_scenario_item:
      type: object
      title: Scenario Item Resource
      description: A person or placeholder assignment on a scenario service, carrying its rates and allocated quantity.
      properties:
        cost:
          type: number
          title: Cost
          nullable: true
          description: Unit cost for this item.
          example: 9000
        cost_default:
          type: number
          title: Cost Default
          nullable: true
          description: Unit cost for this item in the organization's default currency.
          example: 9000
        cost_normalized:
          type: number
          title: Cost Normalized
          nullable: true
          description: Unit cost for this item in the organization's normalized currency.
          example: 9000
        currency:
          type: string
          title: Currency
          nullable: true
          description: Currency code for this item's financial values.
          example: EUR
        currency_default:
          type: string
          title: Currency Default
          description: Currency code in the organization's default currency.
          example: EUR
        currency_normalized:
          type: string
          title: Currency Normalized
          nullable: true
          description: Currency code in the organization's normalized currency.
          example: EUR
        end_date:
          type: string
          title: End Date
          format: date
          nullable: true
          description: The end date of the assignment.
          example: '2026-04-24'
        markup:
          type: string
          title: Markup
          nullable: true
          description: Markup percentage for this item.
          example: '20.0'
        name:
          type: string
          title: Name
          nullable: true
          description: Name of a placeholder item, required unless `person_id` is set.
          example: Senior designer
        price:
          type: number
          title: Price
          nullable: true
          description: Unit price for this item.
          example: 12000
        price_default:
          type: number
          title: Price Default
          nullable: true
          description: Unit price for this item in the organization's default currency.
          example: 12000
        price_normalized:
          type: number
          title: Price Normalized
          nullable: true
          description: Unit price for this item in the organization's normalized currency.
          example: 12000
        start_date:
          type: string
          title: Start Date
          format: date
          nullable: true
          description: The start date of the assignment.
          example: '2026-03-02'
        used_quantity:
          type: string
          title: Used Quantity
          nullable: true
          description: Number of units allocated to this item.
          example: '40.0'
        booking:
          title: Booking
          description: The deal booking this item was created from, if any.
          example:
            data:
              type: bookings
              id: '9912'
        expense:
          title: Expense
          description: The deal expense this item was created from, if any.
          example:
            data:
              type: expenses
              id: '771'
        id:
          type: integer
          title: Id
          description: Unique identifier of the scenario item.
          example: 301
        organization:
          title: Organization
          description: The organization this scenario item belongs to.
          example:
            data:
              type: organizations
              id: '1'
        person:
          title: Person
          description: The person assigned to this item.
          example:
            data:
              type: people
              id: '7'
        person_id:
          type: integer
          title: Person
          nullable: true
          description: ID of the person assigned to this item.
          example: 7
        scenario_bookings:
          title: Scenario Bookings
          description: Bookings scheduled for this item.
          example:
            data:
              - type: scenario_bookings
                id: '401'
        scenario_service:
          title: Scenario Service
          description: The scenario service this item belongs to.
          example:
            data:
              type: scenario_services
              id: '201'
        scenario_service_id:
          type: integer
          title: Scenario Service
          description: ID of the scenario service this item belongs to.
          example: 201
        service_id:
          type: integer
          title: Scenario Service
          description: ID of the scenario service this item belongs to.
          example: 201
      example:
        scenario_service_id: 201
        person_id: 7
        used_quantity: '40.0'
        start_date: '2026-03-02'
        end_date: '2026-04-24'
        markup: '20.0'
        discount: '10.0'
        cost: 9000
        price: 12000
