openapi: 3.1.0
info:
  title: Productive.io API – Organizations
  version: 2.0.0
description: |-
  **Organizations** are the top-level accounts representing a company using Productive. Manage organization-wide settings, branding, localization, and configuration.

  Each organization contains subsidiaries, people, projects, and all associated financial and operational data.
paths:
  /api/v2/organizations/{id}:
    get:
      tags:
        - Organizations
      summary: Get an organization
      operationId: organizations-show
      description: Retrieve a single organization.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_organization'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Organizations
      summary: Update an organization
      operationId: organizations-update
      description: Update an organization.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/organization'
      responses:
        '200':
          $ref: '#/components/responses/single_organization'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_organization'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Organizations
      summary: Delete an organization
      operationId: organizations-destroy
      description: Delete an organization.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_organization'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/organizations/{id}/disable_scim:
    patch:
      tags:
        - Organizations
      summary: Disable SCIM for an organization
      operationId: organizations-disable_scim-disable_scim
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_organization'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/organizations/{id}/force_two_factor_login:
    patch:
      tags:
        - Organizations
      summary: Enforce two-factor login for an organization
      operationId: organizations-force_two_factor_login-force_two_factor_login
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        $ref: '#/components/requestBodies/organization'
      responses:
        '200':
          $ref: '#/components/responses/single_organization'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_organization'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/organizations/{id}/generate_scim_token:
    patch:
      tags:
        - Organizations
      summary: Generate a SCIM bearer token for an organization
      operationId: organizations-generate_scim_token-generate_scim_token
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_organization'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_organization'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/organizations:
    get:
      tags:
        - Organizations
      summary: Get organizations
      operationId: organizations-index
      description: List organizations.
      parameters:
        - $ref: '#/components/parameters/filter_organization'
        - $ref: '#/components/parameters/sort_organization'
      responses:
        '200':
          $ref: '#/components/responses/collection_organization'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/organizations/{id}/resend_code:
    patch:
      tags:
        - Organizations
      summary: Resend verification code
      operationId: organizations-resend_code-resend_code
      description: Resend the verification code for an organization.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_organization'
        '204':
          content:
            any: {}
          headers: {}
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/organizations/{id}/sample:
    patch:
      tags:
        - Organizations
      summary: Import sample data into an organization
      operationId: organizations-sample-sample
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_organization'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Organizations
      summary: Revert the sample data of an organization
      operationId: organizations-sample-revert_sample
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_organization'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    single_organization:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Response schema for a single organization.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned organization resource.
                properties:
                  attributes:
                    type: object
                    description: Organization attributes.
                    properties:
                      task_due_time_enabled:
                        $ref: '#/components/schemas/resource_organization/properties/task_due_time_enabled'
                      addons:
                        $ref: '#/components/schemas/resource_organization/properties/addons'
                      ai_enabled:
                        $ref: '#/components/schemas/resource_organization/properties/ai_enabled'
                      allow_time_off:
                        $ref: '#/components/schemas/resource_organization/properties/allow_time_off'
                      allow_user_email:
                        $ref: '#/components/schemas/resource_organization/properties/allow_user_email'
                      analytics_uid:
                        $ref: '#/components/schemas/resource_organization/properties/analytics_uid'
                      avatar_url:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization/properties/avatar_url'
                          - type: 'null'
                        description: URL of the organization's avatar image (thumbnail size).
                      billing_email:
                        type:
                          - string
                          - 'null'
                        description: Email address used for billing correspondence.
                      booked_demo:
                        $ref: '#/components/schemas/resource_organization/properties/booked_demo'
                      conflict_resolver_active:
                        $ref: '#/components/schemas/resource_organization/properties/conflict_resolver_active'
                      currency:
                        $ref: '#/components/schemas/resource_organization/properties/currency'
                      currency_default:
                        $ref: '#/components/schemas/resource_organization/properties/currency_default'
                      currency_format_id:
                        $ref: '#/components/schemas/resource_organization/properties/currency_format_id'
                      currency_normalized:
                        $ref: '#/components/schemas/resource_organization/properties/currency_normalized'
                      customer_success_specialist_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization/properties/customer_success_specialist_id'
                          - type: 'null'
                        description: ID of the Productive user assigned as the customer success specialist for this organization.
                      date_format_id:
                        $ref: '#/components/schemas/resource_organization/properties/date_format_id'
                      deal_settings:
                        $ref: '#/components/schemas/resource_organization/properties/deal_settings'
                      decimal_places_id:
                        $ref: '#/components/schemas/resource_organization/properties/decimal_places_id'
                      delivered_budget_recognition_date_id:
                        $ref: '#/components/schemas/resource_organization/properties/delivered_budget_recognition_date_id'
                      domain_verified:
                        $ref: '#/components/schemas/resource_organization/properties/domain_verified'
                      due_days:
                        $ref: '#/components/schemas/resource_organization/properties/due_days'
                      email_domain_name:
                        $ref: '#/components/schemas/resource_organization/properties/email_domain_name'
                      email_key:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization/properties/email_key'
                          - type: 'null'
                        description: Unique email key (inbox key) for receiving emails into the organization.
                      email_local_name:
                        $ref: '#/components/schemas/resource_organization/properties/email_local_name'
                      email_sender_name:
                        $ref: '#/components/schemas/resource_organization/properties/email_sender_name'
                      email_type_id:
                        $ref: '#/components/schemas/resource_organization/properties/email_type_id'
                      erector_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization/properties/erector_id'
                          - type: 'null'
                        description: The ID of the erector (implementation partner) for this organization.
                      exchange_rate_provider_id:
                        $ref: '#/components/schemas/resource_organization/properties/exchange_rate_provider_id'
                      expense_markup:
                        $ref: '#/components/schemas/resource_organization/properties/expense_markup'
                      expense_settings:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization/properties/expense_settings'
                          - type: 'null'
                        description: Expense configuration settings for the organization.
                      facility_costs:
                        $ref: '#/components/schemas/resource_organization/properties/facility_costs'
                      facility_costs_breakdown:
                        $ref: '#/components/schemas/resource_organization/properties/facility_costs_breakdown'
                      facility_costs_default:
                        $ref: '#/components/schemas/resource_organization/properties/facility_costs_default'
                      facility_costs_normalized:
                        $ref: '#/components/schemas/resource_organization/properties/facility_costs_normalized'
                      financial_month_locking_date:
                        $ref: '#/components/schemas/resource_organization/properties/financial_month_locking_date'
                      financial_month_locking_partial_edit:
                        $ref: '#/components/schemas/resource_organization/properties/financial_month_locking_partial_edit'
                      financial_months:
                        $ref: '#/components/schemas/resource_organization/properties/financial_months'
                      fiscal_year_start:
                        $ref: '#/components/schemas/resource_organization/properties/fiscal_year_start'
                      flags:
                        $ref: '#/components/schemas/resource_organization/properties/flags'
                      force_single_sign_on:
                        $ref: '#/components/schemas/resource_organization/properties/force_single_sign_on'
                      force_two_factor_auth:
                        $ref: '#/components/schemas/resource_organization/properties/force_two_factor_auth'
                      invitation_token:
                        $ref: '#/components/schemas/resource_organization/properties/invitation_token'
                      invoice_rounding_method_id:
                        $ref: '#/components/schemas/resource_organization/properties/invoice_rounding_method_id'
                      limited_service_types:
                        $ref: '#/components/schemas/resource_organization/properties/limited_service_types'
                      locale:
                        $ref: '#/components/schemas/resource_organization/properties/locale'
                      man_day_minutes:
                        $ref: '#/components/schemas/resource_organization/properties/man_day_minutes'
                      metrics:
                        $ref: '#/components/schemas/resource_organization/properties/metrics'
                      name:
                        $ref: '#/components/schemas/resource_organization/properties/name'
                      number_format_id:
                        $ref: '#/components/schemas/resource_organization/properties/number_format_id'
                      numbering_format_settings:
                        $ref: '#/components/schemas/resource_organization/properties/numbering_format_settings'
                      onboarding_progress:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization/properties/onboarding_progress'
                          - type: 'null'
                        description: Tracks the user's progress through the onboarding flow.
                      open_budget_recognition_date_id:
                        $ref: '#/components/schemas/resource_organization/properties/open_budget_recognition_date_id'
                      organization_type_id:
                        $ref: '#/components/schemas/resource_organization/properties/organization_type_id'
                      overhead:
                        $ref: '#/components/schemas/resource_organization/properties/overhead'
                      overhead_amortization_period:
                        $ref: '#/components/schemas/resource_organization/properties/overhead_amortization_period'
                      overhead_recalculation_day:
                        $ref: '#/components/schemas/resource_organization/properties/overhead_recalculation_day'
                      overhead_subsidiary_switched_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization/properties/overhead_subsidiary_switched_at'
                          - type: 'null'
                        description: The date and time when overhead calculation was switched to per-subsidiary mode.
                      overhead_type_id:
                        $ref: '#/components/schemas/resource_organization/properties/overhead_type_id'
                      quick_start_config:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization/properties/quick_start_config'
                          - type: 'null'
                        description: Quick start configuration progress for onboarding.
                      remove_branding:
                        $ref: '#/components/schemas/resource_organization/properties/remove_branding'
                      request_for_resource_enabled:
                        $ref: '#/components/schemas/resource_organization/properties/request_for_resource_enabled'
                      revenue_recognition_type_id:
                        $ref: '#/components/schemas/resource_organization/properties/revenue_recognition_type_id'
                      rounding_interval_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization/properties/rounding_interval_id'
                          - type: 'null'
                        description: The time rounding interval applied to time entries.
                      rounding_method_id:
                        $ref: '#/components/schemas/resource_organization/properties/rounding_method_id'
                      sample_data_imported_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization/properties/sample_data_imported_at'
                          - type: 'null'
                        description: The date and time when sample data was imported into this organization.
                      sample_data_reverted_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization/properties/sample_data_reverted_at'
                          - type: 'null'
                        description: The date and time when sample data was reverted in this organization.
                      scim_bearer_token:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization/properties/scim_bearer_token'
                          - type: 'null'
                        description: The SCIM bearer token for SCIM provisioning integration.
                      self_attribution:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization/properties/self_attribution'
                          - type: 'null'
                        description: The channel through which this organization discovered Productive.
                      self_attribution_comment:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization/properties/self_attribution_comment'
                          - type: 'null'
                        description: An additional comment about how this organization found Productive.
                      single_sign_on:
