openapi: 3.1.0
info:
  title: Productive.io API – Organizations
  version: 2.0.0
description: |-
  **Organizations** are the top-level accounts representing a company using Productive. Manage organization-wide settings, branding, localization, and configuration.

  Each organization contains subsidiaries, people, projects, and all associated financial and operational data.
paths:
  /api/v2/organizations/{id}:
    get:
      tags:
        - Organizations
      summary: Get an organization
      operationId: organizations-show
      description: Retrieve a single organization.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_organization'
    patch:
      tags:
        - Organizations
      summary: Update an organization
      operationId: organizations-update
      description: Update an organization.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/organization'
      responses:
        '200':
          $ref: '#/components/responses/single_organization'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
    delete:
      tags:
        - Organizations
      summary: Delete an organization
      operationId: organizations-destroy
      description: Delete an organization.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '204':
          description: No Content
  /api/v2/organizations:
    get:
      tags:
        - Organizations
      summary: Get organizations
      operationId: organizations-index
      description: List organizations.
      parameters:
        - $ref: '#/components/parameters/filter_organization'
        - $ref: '#/components/parameters/sort_organization'
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/collection_organization'
  /api/v2/organizations/{id}/resend_code:
    patch:
      tags:
        - Organizations
      summary: Resend verification code
      operationId: organizations-resend_code-resend_code
      description: Resend the verification code for an organization.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_organization'
        '204':
          content:
            any: {}
          headers: {}
          description: No Content
