    project_change_workflow:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      map:
                        type: object
                        title: Status Map
                        additionalProperties:
                          type: integer
                        description: Mapping from each status ID in the project's current workflow to a status ID in the target workflow. Every status in the current workflow must appear as a key, and each value must be a valid status in the target workflow.
                        example:
                          '100': 200
                          '101': 201
                          '102': 202
                      workflow_id:
                        type: integer
                        title: Workflow ID
                        description: ID of the workflow to assign to the project. Existing tasks are migrated to statuses in this workflow using the provided `map`.
                        example: 7
                    required:
                      - workflow_id
                      - map
                    example:
                      workflow_id: 7
                      map:
                        '100': 200
                        '101': 201
                        '102': 202
                  type:
                    enum:
                      - projects
                    type: string
                    example: projects
                example:
                  type: projects
                  attributes:
                    workflow_id: 7
                    map:
                      '100': 200
                      '101': 201
                      '102': 202
            example:
              data:
                type: projects
                attributes:
                  workflow_id: 7
                  map:
                    '100': 200
                    '101': 201
                    '102': 202
      description: Request body for switching a project to a different workflow. Requires a status mapping so every task in the project can be migrated to a status that exists in the target workflow.
