                    required:
                      - name
                      - project_manager_id
                      - project_type_id
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_project/properties/name'
                      company_id:
                        $ref: '#/components/schemas/resource_project/properties/company_id'
                      tag_colors:
                        $ref: '#/components/schemas/resource_project/properties/tag_colors'
                      preferences:
                        $ref: '#/components/schemas/resource_project/properties/preferences'
                      workflow_id:
                        $ref: '#/components/schemas/resource_project/properties/workflow_id'
                      custom_fields:
                        $ref: '#/components/schemas/resource_project/properties/custom_fields'
                      project_type_id:
                        $ref: '#/components/schemas/resource_project/properties/project_type_id'
                      project_color_id:
                        $ref: '#/components/schemas/resource_project/properties/project_color_id'
                      project_manager_id:
                        $ref: '#/components/schemas/resource_project/properties/project_manager_id'
                      page_custom_fields_ids:
                        $ref: '#/components/schemas/resource_project/properties/page_custom_fields_ids'
                      task_custom_fields_ids:
                        $ref: '#/components/schemas/resource_project/properties/task_custom_fields_ids'
                      page_custom_fields_positions:
                        $ref: '#/components/schemas/resource_project/properties/page_custom_fields_positions'
                      task_custom_fields_positions:
                        $ref: '#/components/schemas/resource_project/properties/task_custom_fields_positions'
      description: Request body for creating or updating a project.
    project_copy:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - name
                      - template_id
                      - project_type_id
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_project/properties/name'
                      company_id:
                        $ref: '#/components/schemas/resource_project/properties/company_id'
                      description:
                        type: string
                      template_id:
                        type: integer
                      project_type_id:
                        $ref: '#/components/schemas/resource_project/properties/project_type_id'
                      copy_as_template:
                        type: boolean
                      project_color_id:
                        $ref: '#/components/schemas/resource_project/properties/project_color_id'
                      project_manager_id:
                        $ref: '#/components/schemas/resource_project/properties/project_manager_id'
      description: 'Request body for copying an existing project. Required attributes: `name`, `template_id`, `project_type_id`. Optional attributes control destination metadata and granular copy behavior — see the operation description for the full copy-flag prerequisite tree.'
    project_change_workflow:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  type:
                    enum:
                      - projects
                    type: string
                  attributes:
                    type: object
                    required:
                      - workflow_id
                      - map
                    properties:
                      map:
                        type: object
                        title: Status Map
                        additionalProperties:
                          type: integer
                      workflow_id:
                        type: integer
                        title: Workflow ID
      description: Request body for switching a project to a different workflow. Requires a status mapping so every task in the project can be migrated to a status that exists in the target workflow.
    project_apply_navigation_tabs:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  type:
