                      - keep_existing_tabs
                    properties:
                      template_id:
                        type: integer
                        title: Template ID
                      keep_existing_tabs:
                        type: boolean
                        title: Keep Existing Tabs
      description: Request body for applying navigation tabs to a project using an existing project template as the source layout.
