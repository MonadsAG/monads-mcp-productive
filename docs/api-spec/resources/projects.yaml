openapi: 3.1.0
info:
  title: Productive.io API – Projects
  version: 2.0.0
description: |-
  For more details on how to work with custom fields please refer to [Working with custom fields](https://developer.productive.io/working_with_custom_fields.html#working_with_custom_fields) guide.

  > Note: For archived projects, only the `name` and `project_manager_id` attributes can be updated. All other attributes will be ignored during update operations.
x-filters:
  project:
    status:
      description: Filter by project status. 1 = active, 2 = archived.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    total_worked_time:
      description: Filter by total worked time across all budgets including closed ones (in minutes).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Alias for id — filter by project ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    jump_query:
      description: Quick-jump search query for fast project navigation by name.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    workflow_id:
      description: Filter by the project's task workflow.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by client company.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    profit:
      description: Filter by total profit across open budgets (in base currency).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Full-text search query — matches project name and other fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    fuzzy_dates:
      description: Fuzzy date range filter — matches projects by start/end date proximity.
      operators:
        - eq
        - not_eq
    profit_margin:
      description: Filter by the project's profit margin across open budgets.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    parent_company_id:
      description: Filter by the parent company of the project's company.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    revenue:
      description: Filter by total revenue across open budgets (in base currency).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    full_query:
      description: Full-text search across all project content fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    public_access:
      description: Deprecated. No-op filter — has no effect on results.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by project name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    worked_time:
      description: Filter by total worked time across open budgets only (in minutes).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    for_tracking:
      description: Filter to only include projects eligible for time tracking (active projects only).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    pending_invoicing:
      description: Filter by amount pending invoicing across open budgets (in base currency).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    with_templates:
      description: When true, includes template projects in results (removes the default filter that excludes templates).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    responsible_id:
      description: Filter by responsible person (project manager) ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_id:
      description: Filter by the associated budget (deal).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by project ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_color:
      description: Filter by the project's color label.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filter by creation date range (created_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter by person ID — returns projects where the person is a member or project manager.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    estimated_time:
      description: Filter by total estimated time across open budgets (in minutes).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    fuzzy_people:
      description: Fuzzy person filter — matches projects by associated people (members or project manager).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_fields:
      description: Filter by custom field values.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_number:
      description: Filter by formatted project number string (e.g. ACME-001).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    cost:
      description: Filter by total cost across open budgets (in base currency).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    template:
      description: Filter to only return template projects.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    number:
      description: Filter by auto-generated project number.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_type:
      description: Filter by project type — 1 for internal/overhead, 2 for billable client work.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/projects/{id}/apply_navigation_tabs:
    patch:
      tags:
        - Projects
      summary: Applies navigation tabs from a template to the project
      responses:
        '200':
          $ref: '#/components/responses/single_project'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Returned when validation fails — for example, when `template_id` references a project that is not a template, or when required attributes are missing.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the project to apply navigation tabs to.
        - $ref: '#/components/parameters/header_organization'
      operationId: projects-apply_navigation_tabs-apply_navigation_tabs
      requestBody:
        $ref: '#/components/requestBodies/project_apply_navigation_tabs'
      description: |-
        Copies the navigation tab configuration from an existing project template onto the specified project. Supports preserving the project's current tabs alongside the template's, or replacing them entirely.

        ```json
        {
          "data": {
            "type": "projects",
            "attributes": {
              "template_id": 123456,
              "keep_existing_tabs": false
            }
          }
        }
        ```
  /api/v2/projects/{id}/archive:
    patch:
      tags:
        - Projects
      summary: Archives a project
      responses:
        '200':
          $ref: '#/components/responses/single_project'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: projects-archive-archive
      description: Archives a project, hiding it from active project lists. Archiving also pauses the project's recurring budgets, marks its open budgets as delivered, and removes future bookings; tasks and logged time are not affected. Reverse it with [restore](#tag/Projects/operation/projects-restore-restore).
  /api/v2/projects/{id}/change_workflow:
    patch:
      tags:
        - Projects
      summary: Changes workflow on project
      responses:
        '200':
          $ref: '#/components/responses/single_project'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: projects-change_workflow-change_workflow
      requestBody:
        $ref: '#/components/requestBodies/project_change_workflow'
      description: |-
        Switches the project to a different task workflow, migrating its tasks to the new workflow's statuses according to the `map`.

        ```json
        {
          "data": {
            "type": "projects",
            "attributes": {
              "workflow_id": 75,
              "map": { "101": 201, "102": 202 }
            }
          }
        }
        ```
  /api/v2/projects/copy:
    post:
      tags:
        - Projects
      summary: Copies a project
      responses:
        '201':
          $ref: '#/components/responses/single_project'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: projects-copy-copy
      requestBody:
        $ref: '#/components/requestBodies/project_copy'
      description: |-
        Creates a new project by copying an existing **source project**. Use `copy_as_template: true` to mark the result as a project template.

        ### Copy flags

        All `copy_*` flags default to `false`. A flag with a prerequisite requires the listed parent flag(s) to also be enabled.

        | Flag(s) | Prerequisite | Notes |
        |---|---|---|
        | `copy_boards` | — | Required by `copy_task_lists` |
        | `copy_task_lists` | `copy_boards` | Required by `copy_open_tasks`, `copy_closed_tasks` |
        | `copy_open_tasks`, `copy_closed_tasks` | `copy_task_lists` | Required by per-task flags below |
        | `copy_memberships` | — | Required by `copy_assignees`, `copy_task_subscribers` |
        | `copy_assignees`, `copy_task_subscribers` | `copy_open_tasks` or `copy_closed_tasks` + `copy_memberships` | — |
        | `copy_task_comments`, `copy_task_attachments`, `copy_task_description`, `copy_tags`, `copy_due_date`, `copy_start_date`, `copy_repeat`, `copy_estimate` | `copy_open_tasks` or `copy_closed_tasks` | — |
        | `copy_task_open_todos`, `copy_task_closed_todos`, `copy_task_open_subtasks`, `copy_task_closed_subtasks`, `copy_task_dependencies`, `copy_task_templates` | `copy_open_tasks` or `copy_closed_tasks` | — |
        | `copy_views`, `copy_custom_fields`, `copy_notes`, `copy_dashboards`, `copy_surveys`, `copy_budgets` | — | Independent |
        | `copy_deals` | — | Forced to `false` for internal project types |
        | `copy_as_template` | — | Marks the result as a template (creates a linked `Template` record) |

        ### Save Project as Template (Productive web app defaults)

        The "Save as Template" UI sends `copy_as_template: true`.

        ```json
        {
          "data": {
            "type": "projects",
            "attributes": {
              "name": "Q4 marketing campaign template",
              "template_id": 123456,
              "project_type_id": 2,
              "project_manager_id": 42,
              "project_color_id": 5,
              "company_id": 999,
              "copy_as_template": true,
              "copy_memberships": true, // sharing
              "copy_boards": true, // folders
              "copy_views": true,
              "copy_custom_fields": true,
              "copy_dashboards": true,
              "copy_task_lists": true,
              "copy_open_tasks": true,
              "copy_closed_tasks": false,
              "copy_task_comments": true,
              "copy_task_subscribers": true,
              "copy_task_attachments": true,
              "copy_task_open_todos": true,
              "copy_task_closed_todos": false,
              "copy_task_open_subtasks": true,
              "copy_task_closed_subtasks": false,
              "copy_task_dependencies": true,
              "copy_task_description": true,
              "copy_assignees": true,
              "copy_tags": true,
              "copy_due_date": true,
              "copy_start_date": true,
              "copy_repeat": true,
              "copy_estimate": true,
              "copy_notes": true, // docs
              "copy_surveys": true, // forms
              "copy_task_templates": true
            }
          }
        }
        ```

        ### Plain project copy

        Duplicate an existing project as a new working project.

        ```json
        {
          "data": {
            "type": "projects",
            "attributes": {
              "name": "Q4 marketing campaign — Acme",
              "template_id": 123456,
              "project_type_id": 2,
              "company_id": 999,
              "copy_boards": true,
              "copy_task_lists": true,
              "copy_open_tasks": true,
              "copy_task_comments": true,
              "copy_task_attachments": true,
              "copy_task_description": true,
              "copy_due_date": true,
              "copy_start_date": true,
              "copy_estimate": true,
              "copy_memberships": true,
              "copy_assignees": true,
              "copy_custom_fields": true,
              "copy_views": true,
              "copy_dashboards": true
            }
          }
        }
        ```

        ### Minimal copy (structure only)

        Only the required attributes. All `copy_*` flags default to `false` — you get a new empty project with the source's metadata.

        ```json
        {
          "data": {
            "type": "projects",
            "attributes": {
              "name": "New empty internal project from source",
              "template_id": 123456,
              "project_type_id": 1
            }
          }
        }
        ```
  /api/v2/projects:
    get:
      tags:
        - Projects
      summary: Get projects
      responses:
        '200':
          $ref: '#/components/responses/collection_project'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_project'
        - $ref: '#/components/parameters/filter_project'
      operationId: projects-index
      description: List projects. Returns a paginated collection of projects accessible to the authenticated user. Supports filtering, sorting, and including related resources.
    post:
      tags:
        - Projects
      summary: Create a project
      responses:
        '201':
          $ref: '#/components/responses/single_project'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: projects-create
      requestBody:
        $ref: '#/components/requestBodies/project'
      description: |-
        Create a project. Creates a new project with the given attributes.

        Required: `name`, `project_manager_id`, `project_type_id`, and `workflow_id`. `company_id` is required for non-internal project types.

        ```json
        {
          "data": {
            "type": "projects",
            "attributes": {
              "name": "Acme website redesign",
              "project_type_id": 2,
              "project_manager_id": 42,
              "company_id": 999,
              "workflow_id": 7
            }
          }
        }
        ```

        To duplicate an existing project or create one from a template, use [`/projects/copy`](#tag/Projects/operation/projects-copy-copy) instead.
  /api/v2/projects/{id}:
    get:
      tags:
        - Projects
      summary: Gets a project
      responses:
        '200':
          $ref: '#/components/responses/single_project'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: projects-show
      description: Get a project. Returns a single project by ID.
    patch:
      tags:
        - Projects
      summary: Update a project
      responses:
        '200':
          $ref: '#/components/responses/single_project'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: projects-update
      requestBody:
        $ref: '#/components/requestBodies/project'
      description: Updates a project. Only the attributes you include are modified — everything else is left unchanged. To change the project's workflow, use [change_workflow](#tag/Projects/operation/projects-change_workflow-change_workflow) instead of this endpoint.
    delete:
      tags:
        - Projects
      summary: Deletes a project
      responses:
        '204':
          description: No Content
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: projects-destroy
      description: Delete a project. Permanently deletes a project and all its associated data.
  /api/v2/projects/{id}/restore:
    patch:
      tags:
        - Projects
      summary: Restores a project
      responses:
        '200':
          $ref: '#/components/responses/single_project'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: projects-restore-restore
      description: Restore a project. Restores an archived project back to active status.
  /api/v2/projects/{id}/subscribe:
    patch:
      tags:
        - Projects
      summary: Subscribes to project
      responses:
        '200':
          $ref: '#/components/responses/single_project'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the project.
      operationId: projects-subscribe-subscribe
      description: Subscribes the current user to the project's comment thread.
  /api/v2/projects/{id}/unsubscribe:
    patch:
      tags:
        - Projects
      summary: Unsubscribes from project
      responses:
        '200':
          $ref: '#/components/responses/single_project'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the project.
        - $ref: '#/components/parameters/header_organization'
      operationId: projects-unsubscribe-unsubscribe
      description: Unsubscribes the current user from the project's comment thread.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_project:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.project at the top of this file.
      required: false
      description: Filters
    sort_project:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - company_name
            - -company_name
            - created_at
            - -created_at
            - custom_fields
            - -custom_fields
            - last_activity_at
            - -last_activity_at
            - name
            - -name
            - number
            - -number
            - project_number
            - -project_number
          type: string
        title: Sort project
      explode: false
      required: false
      description: Sort project
  responses:
    single_project:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_project/properties/name'
                      number:
                        $ref: '#/components/schemas/resource_project/properties/number'
                      template:
                        $ref: '#/components/schemas/resource_project/properties/template'
                      created_at:
                        $ref: '#/components/schemas/resource_project/properties/created_at'
                      tag_colors:
                        $ref: '#/components/schemas/resource_project/properties/tag_colors'
                      archived_at:
                        $ref: '#/components/schemas/resource_project/properties/archived_at'
                      preferences:
                        $ref: '#/components/schemas/resource_project/properties/preferences'
                      sample_data:
                        $ref: '#/components/schemas/resource_project/properties/sample_data'
                      custom_fields:
                        $ref: '#/components/schemas/resource_project/properties/custom_fields'
                      project_number:
                        $ref: '#/components/schemas/resource_project/properties/project_number'
                      project_type_id:
                        $ref: '#/components/schemas/resource_project/properties/project_type_id'
                      last_activity_at:
                        $ref: '#/components/schemas/resource_project/properties/last_activity_at'
                      project_color_id:
                        $ref: '#/components/schemas/resource_project/properties/project_color_id'
                      duplication_status:
                        $ref: '#/components/schemas/resource_project/properties/duplication_status'
                      page_custom_fields_ids:
                        $ref: '#/components/schemas/resource_project/properties/page_custom_fields_ids'
                      task_custom_fields_ids:
                        $ref: '#/components/schemas/resource_project/properties/task_custom_fields_ids'
                      page_custom_fields_positions:
                        $ref: '#/components/schemas/resource_project/properties/page_custom_fields_positions'
                      task_custom_fields_positions:
                        $ref: '#/components/schemas/resource_project/properties/task_custom_fields_positions'
                  relationships:
                    type: object
                    properties:
                      import:
                        $ref: '#/components/schemas/_single_relationship'
                      company:
                        $ref: '#/components/schemas/_single_relationship'
                      workflow:
                        $ref: '#/components/schemas/_single_relationship'
                      last_actor:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      project_manager:
                        $ref: '#/components/schemas/_single_relationship'
                      template_object:
                        $ref: '#/components/schemas/_single_relationship'
                      custom_field_people:
                        $ref: '#/components/schemas/_collection_relationship'
                      custom_field_attachments:
                        $ref: '#/components/schemas/_collection_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single project
    collection_project:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_project/properties/name'
                        number:
                          $ref: '#/components/schemas/resource_project/properties/number'
                        template:
                          $ref: '#/components/schemas/resource_project/properties/template'
                        created_at:
                          $ref: '#/components/schemas/resource_project/properties/created_at'
                        tag_colors:
                          $ref: '#/components/schemas/resource_project/properties/tag_colors'
                        archived_at:
                          $ref: '#/components/schemas/resource_project/properties/archived_at'
                        preferences:
                          $ref: '#/components/schemas/resource_project/properties/preferences'
                        sample_data:
                          $ref: '#/components/schemas/resource_project/properties/sample_data'
                        custom_fields:
                          $ref: '#/components/schemas/resource_project/properties/custom_fields'
                        project_number:
                          $ref: '#/components/schemas/resource_project/properties/project_number'
                        project_type_id:
                          $ref: '#/components/schemas/resource_project/properties/project_type_id'
                        last_activity_at:
                          $ref: '#/components/schemas/resource_project/properties/last_activity_at'
                        project_color_id:
                          $ref: '#/components/schemas/resource_project/properties/project_color_id'
                        duplication_status:
                          $ref: '#/components/schemas/resource_project/properties/duplication_status'
                        page_custom_fields_ids:
                          $ref: '#/components/schemas/resource_project/properties/page_custom_fields_ids'
                        task_custom_fields_ids:
                          $ref: '#/components/schemas/resource_project/properties/task_custom_fields_ids'
                        page_custom_fields_positions:
                          $ref: '#/components/schemas/resource_project/properties/page_custom_fields_positions'
                        task_custom_fields_positions:
                          $ref: '#/components/schemas/resource_project/properties/task_custom_fields_positions'
                    relationships:
                      type: object
                      properties:
                        import:
                          $ref: '#/components/schemas/_single_relationship'
                        company:
                          $ref: '#/components/schemas/_single_relationship'
                        workflow:
                          $ref: '#/components/schemas/_single_relationship'
                        last_actor:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        project_manager:
                          $ref: '#/components/schemas/_single_relationship'
                        template_object:
                          $ref: '#/components/schemas/_single_relationship'
                        custom_field_people:
                          $ref: '#/components/schemas/_collection_relationship'
                        custom_field_attachments:
                          $ref: '#/components/schemas/_collection_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection project
  schemas:
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _collection_relationship:
      anyOf:
        - type: object
          title: Collection data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          description: Included variant — related resource identifiers are present in `data`.
          example:
            data:
              - type: tasks
                id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
