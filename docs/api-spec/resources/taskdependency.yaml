                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      reverse_dependency:
                        $ref: '#/components/schemas/_single_relationship'
                      task:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
