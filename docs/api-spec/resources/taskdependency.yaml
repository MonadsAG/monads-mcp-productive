openapi: 3.1.0
info:
  title: Productive.io API – TaskDependency
  version: 2.0.0
description: |-
  **Task dependencies** define ordering relationships between tasks: blocking, waiting on, or linked.

  Create and remove dependency links to enforce task sequencing. Dependencies are reflected in Gantt charts and can prevent downstream tasks from starting until blockers are resolved.
x-filters:
  task_dependency:
    creator_id:
      description: Filter by the person who created the dependency.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    type_id:
      description: Filter by dependency type (blocking, waiting_on, or linked).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by dependency ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by project ID (via the associated task).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updated_at:
      description: Filter by last update date range (updated_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      description: Filter by the source task ID in the dependency relationship.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filter by creation date range (created_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updater_id:
      description: Filter by the person who last updated the dependency.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    dependent_task_id:
      description: Filter by the dependent task ID (the task that depends on another).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deleted_at:
      description: Filter by deletion date range (deleted_at); use to find soft-deleted dependencies.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/task_dependencies:
    get:
      tags:
        - TaskDependency
      summary: Get task dependencies
      responses:
        '200':
          $ref: '#/components/responses/collection_task_dependency'
      parameters:
        - $ref: '#/components/parameters/sort_task_dependency'
        - $ref: '#/components/parameters/filter_task_dependency'
        - $ref: '#/components/parameters/header_organization'
      operationId: task_dependencies-index
      description: |-
        Returns a paginated list of task dependencies.

        Supports filtering by task, dependent task, type (blocking / waiting on / linked), project, creator, and updater.
    post:
      tags:
        - TaskDependency
      summary: Create a task dependency
      responses:
        '201':
          $ref: '#/components/responses/single_task_dependency'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: task_dependencies-create
      requestBody:
        $ref: '#/components/requestBodies/task_dependency'
      description: |-
        Creates a directional dependency between two tasks. Requires `task_id`, `dependent_task_id`, and `type_id` (1 = Blocking, 2 = Waiting on, 3 = Linked).

        A paired reverse record is created automatically (`Blocking` ↔ `Waiting on`; `Linked` is symmetric) — both share lifecycle, so type updates and deletes apply to both.

        ```json
        {
          "data": {
            "type": "task_dependencies",
            "attributes": {
              "task_id": 4421188,
              "dependent_task_id": 4421199,
              "type_id": 1
            }
          }
        }
        ```
  /api/v2/task_dependencies/{id}:
    get:
      tags:
        - TaskDependency
      summary: Gets a task dependency
      responses:
        '200':
          $ref: '#/components/responses/single_task_dependency'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: task_dependencies-show
      description: Returns a single task dependency by ID.
    patch:
      tags:
        - TaskDependency
      summary: Update a task dependency
      responses:
        '200':
          $ref: '#/components/responses/single_task_dependency'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: task_dependencies-update
      requestBody:
        $ref: '#/components/requestBodies/task_dependency'
      description: Updates a task dependency — only `type_id` is mutable. The paired reverse dependency is updated to the corresponding reverse type (Blocking ↔ Waiting on; Linked stays Linked).
    delete:
      tags:
        - TaskDependency
      summary: Deletes a task dependency
      responses:
        '204':
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: task_dependencies-destroy
      description: Deletes a task dependency. The paired reverse dependency is deleted as well.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_task_dependency:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.task_dependency at the top of this file.
      required: false
      description: Filters
    sort_task_dependency:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort task dependency
      explode: false
      required: false
      description: Sort task dependency
  requestBodies:
    task_dependency:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - dependent_task_id
                      - task_id
                      - type_id
                    properties:
                      task_id:
                        $ref: '#/components/schemas/resource_task_dependency/properties/task_id'
                      type_id:
                        $ref: '#/components/schemas/resource_task_dependency/properties/type_id'
                      dependent_task_id:
                        $ref: '#/components/schemas/resource_task_dependency/properties/dependent_task_id'
      description: Request body for creating a task dependency. Specify the source task, the dependent task, and the dependency type (blocking, waiting_on, or linked). A reverse dependency is automatically created on the dependent task.
  schemas:
    resource_task_dependency:
      type: object
      title: Task dependency Resource
      properties:
        created_at:
          type: string
          title: Created At
          format: date
          description: Timestamp when this task dependency was created.
          example:
            gt: '2026-01-01'
        dependent_task_id:
          type: integer
          title: Dependent Task
          description: ID of the dependent task (the task that depends on the primary task).
          example:
            - 123
        project_id:
          type: integer
          title: Project
          description: ID of the project this task dependency belongs to.
          example:
            - 123
        deleted_at:
          type: string
          title: Deleted At
          format: date
          description: Timestamp when this task dependency was deleted, or null if not deleted.
          example:
            gt: '2026-01-01'
        type_id:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Type
          description: 'The dependency type: 1 = blocking, 2 = waiting on, 3 = linked.'
          example:
            - 123
        organization:
          title: Organization
          description: The organization this task dependency belongs to.
          example:
            eq: value
        updated_at:
          type: string
          title: Updated At
          format: date
          description: Timestamp when this task dependency was last updated.
          example:
            gt: '2026-01-01'
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who created this task dependency.
          example:
            - 123
        task:
          title: Task
          description: The primary task object (the task that blocks or is linked to the dependent task).
          example:
            eq: value
        reverse_dependency:
          title: Reverse Dependency
          description: The reverse dependency object linking the same two tasks from the opposite direction.
          example:
            eq: value
        task_id:
          type: integer
          title: Task
          description: ID of the primary task (the task that blocks or is linked to the dependent task).
          example:
            - 123
        id:
          type: integer
          title: Id
          description: The unique identifier of this task dependency.
          example:
            - 123
        dependent_task:
          title: Dependent Task
          description: The dependent task object (the task that depends on the primary task).
          example:
            eq: value
        updater_id:
          type: integer
          title: Updater
          description: ID of the person who last updated this task dependency.
          example:
            - 123
      description: Task dependency relationship defining blocking, waiting_on, or linked connections between tasks. Each dependency has a type_id indicating the relationship direction. Creating a dependency may auto-create a reverse_dependency on the related task.
      example:
        id: '15'
        type: task_dependencies
        attributes:
          dependency_type: blocking
          created_at: '2026-03-01T10:00:00.000+00:00'
        relationships:
          task:
            data:
              type: tasks
              id: '120501'
          blocking_task:
            data:
              type: tasks
              id: '120500'
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  responses:
    single_task_dependency:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      type_id:
                        $ref: '#/components/schemas/resource_task_dependency/properties/type_id'
                  relationships:
                    type: object
                    properties:
                      task:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      dependent_task:
                        $ref: '#/components/schemas/_single_relationship'
                      reverse_dependency:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single task dependency
    collection_task_dependency:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        type_id:
                          $ref: '#/components/schemas/resource_task_dependency/properties/type_id'
                    relationships:
                      type: object
                      properties:
                        task:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        dependent_task:
                          $ref: '#/components/schemas/_single_relationship'
                        reverse_dependency:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection task dependency
