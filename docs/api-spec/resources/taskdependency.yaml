    resource_task_dependency:
      type: object
      title: Task dependency Resource
      description: Task dependency relationship defining blocking, waiting_on, or linked connections between tasks. Each dependency has a type_id indicating the relationship direction. Creating a dependency may auto-create a reverse_dependency on the related task.
      properties:
        created_at:
          type: string
          title: Created At
          format: date
          description: Timestamp when this task dependency was created.
          example:
            gt: '2026-01-01'
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who created this task dependency.
          example:
            - 123
        deleted_at:
          type: string
          title: Deleted At
          format: date
          description: Timestamp when this task dependency was deleted, or null if not deleted.
          example:
            gt: '2026-01-01'
        dependent_task:
          title: Dependent Task
          description: The dependent task object (the task that depends on the primary task).
          example:
            eq: value
        dependent_task_id:
          type: integer
          title: Dependent Task
          description: ID of the dependent task (the task that depends on the primary task).
          example:
            - 123
        id:
          type: integer
          title: Id
          description: The unique identifier of this task dependency.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this task dependency belongs to.
          example:
            eq: value
        project_id:
          type: integer
          title: Project
          description: ID of the project this task dependency belongs to.
          example:
            - 123
        reverse_dependency:
          title: Reverse Dependency
          description: The reverse dependency object linking the same two tasks from the opposite direction.
          example:
            eq: value
        task:
          title: Task
          description: The primary task object (the task that blocks or is linked to the dependent task).
          example:
            eq: value
        task_id:
          type: integer
          title: Task
          description: ID of the primary task (the task that blocks or is linked to the dependent task).
          example:
            - 123
        type_id:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Type
          description: 'The dependency type: 1 = blocking, 2 = waiting on, 3 = linked.'
          example:
            - 123
        updated_at:
          type: string
          title: Updated At
          format: date
          description: Timestamp when this task dependency was last updated.
          example:
            gt: '2026-01-01'
        updater_id:
          type: integer
          title: Updater
          description: ID of the person who last updated this task dependency.
          example:
            - 123
      example:
        id: '15'
        type: task_dependencies
        attributes:
          dependency_type: blocking
          created_at: '2026-03-01T10:00:00.000+00:00'
        relationships:
          task:
            data:
              type: tasks
              id: '120501'
          blocking_task:
            data:
              type: tasks
              id: '120500'
  requestBodies:
    task_dependency_update:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for updating a task dependency.
            properties:
              data:
                type: object
                description: The task dependency resource object.
                properties:
                  attributes:
                    type: object
                    description: Update attributes.
                    properties:
                      type_id:
                        $ref: '#/components/schemas/resource_task_dependency/properties/type_id'
                    required:
                      - type_id
                    example:
                      type_id: 2
                example:
                  type: task_dependencies
                  attributes:
                    type_id: 2
            example:
              data:
                type: task_dependencies
                attributes:
                  type_id: 2
      description: Request body for updating a task dependency.
    task_dependency:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a task dependency.
            properties:
              data:
                type: object
                description: The task dependency resource object.
                properties:
                  attributes:
                    type: object
                    description: Task dependency attributes.
                    properties:
                      dependent_task_id:
                        $ref: '#/components/schemas/resource_task_dependency/properties/dependent_task_id'
                      task_id:
                        $ref: '#/components/schemas/resource_task_dependency/properties/task_id'
                      type_id:
                        $ref: '#/components/schemas/resource_task_dependency/properties/type_id'
                    required:
                      - dependent_task_id
                      - task_id
                      - type_id
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: task_dependencies
                attributes:
                  dependency_type: blocking
                relationships:
                  task:
                    data:
                      type: tasks
                      id: '120501'
                  blocking_task:
                    data:
                      type: tasks
                      id: '120500'
      description: Request body for creating a task dependency. Specify the source task, the dependent task, and the dependency type (blocking, waiting_on, or linked). A reverse dependency is automatically created on the dependent task.
