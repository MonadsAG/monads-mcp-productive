openapi: 3.1.0
info:
  title: Productive.io API – TaskDependency
  version: 2.0.0
description: |-
  **Task dependencies** define ordering relationships between tasks: blocking, waiting on, or linked.

  Create and remove dependency links to enforce task sequencing. Dependencies are reflected in Gantt charts and can prevent downstream tasks from starting until blockers are resolved.
x-filters:
  task_dependency:
    created_at:
      description: Filter by creation date range (created_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who created the dependency.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deleted_at:
      description: Filter by deletion date range (deleted_at); use to find soft-deleted dependencies.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    dependent_task_id:
      description: Filter by the dependent task ID (the task that depends on another).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by dependency ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by project ID (via the associated task).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      description: Filter by the source task ID in the dependency relationship.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    type_id:
      description: Filter by dependency type (blocking, waiting_on, or linked).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updated_at:
      description: Filter by last update date range (updated_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updater_id:
      description: Filter by the person who last updated the dependency.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/task_dependencies:
    get:
      tags:
        - TaskDependency
      summary: Get task dependencies
      operationId: task_dependencies-index
      description: |-
        Returns a paginated list of task dependencies.

        Supports filtering by task, dependent task, type (blocking / waiting on / linked), project, creator, and updater.
      parameters:
        - $ref: '#/components/parameters/filter_task_dependency'
        - $ref: '#/components/parameters/sort_task_dependency'
      responses:
        '200':
          $ref: '#/components/responses/collection_task_dependency'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - TaskDependency
      summary: Create a task dependency
      operationId: task_dependencies-create
      description: |-
        Creates a directional dependency between two tasks. Requires `task_id`, `dependent_task_id`, and `type_id` (1 = Blocking, 2 = Waiting on, 3 = Linked).

        A paired reverse record is created automatically (`Blocking` ↔ `Waiting on`; `Linked` is symmetric) — both share lifecycle, so type updates and deletes apply to both.

        ```json
        {
          "data": {
            "type": "task_dependencies",
            "attributes": {
              "task_id": 4421188,
              "dependent_task_id": 4421199,
              "type_id": 1
            }
          }
        }
        ```
      requestBody:
        $ref: '#/components/requestBodies/task_dependency'
      responses:
        '201':
          $ref: '#/components/responses/single_task_dependency'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_task_dependency'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/task_dependencies/{id}:
    get:
      tags:
        - TaskDependency
      summary: Gets a task dependency
      operationId: task_dependencies-show
      description: Returns a single task dependency by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_task_dependency'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - TaskDependency
      summary: Update a task dependency
      operationId: task_dependencies-update
      description: Updates a task dependency — only `type_id` is mutable. The paired reverse dependency is updated to the corresponding reverse type (Blocking ↔ Waiting on; Linked stays Linked).
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/task_dependency_update'
      responses:
        '200':
          $ref: '#/components/responses/single_task_dependency'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_task_dependency'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - TaskDependency
      summary: Deletes a task dependency
      operationId: task_dependencies-destroy
      description: Deletes a task dependency. The paired reverse dependency is deleted as well.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
