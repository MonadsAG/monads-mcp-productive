openapi: 3.1.0
info:
  title: Productive.io API – Users
  version: 2.0.0
description: |-
  **User accounts** for people who log into Productive. Manage credentials, preferences, and authentication settings.

  Each user is linked to one or more **organization memberships** that control their access level and permissions across the platform.
paths:
  /api/v2/users/{id}:
    get:
      tags:
        - Users
      summary: Gets a user
      operationId: users-show
      description: Retrieve a single user by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_user'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Users
      summary: Update a user
      operationId: users-update
      description: Update a user.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/user'
      responses:
        '200':
          $ref: '#/components/responses/single_user'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_user'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Users
      summary: Delete a user
      operationId: users-destroy
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/users:
    get:
      tags:
        - Users
      summary: Gets users
      operationId: users-index
      description: List all users.
      parameters:
        - $ref: '#/components/parameters/filter_user'
        - $ref: '#/components/parameters/sort_user'
      responses:
        '200':
          $ref: '#/components/responses/collection_user'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/users/{id}/update_password:
    patch:
      tags:
        - Users
      summary: Update password for a user
      operationId: users-update_password-update_password
      description: Update the password for a user.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_user'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_user'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content_user:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_user'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    single_user:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single user record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned user resource.
                properties:
                  attributes:
                    type: object
                    description: User attributes.
                    properties:
                      account_access_expires_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_user/properties/account_access_expires_at'
                          - type: 'null'
                        description: The timestamp when temporary account access expires, for guest users.
                      avatar_url:
                        anyOf:
                          - $ref: '#/components/schemas/resource_user/properties/avatar_url'
                          - type: 'null'
                        description: The URL of the user's profile avatar image.
                      default_organization_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_user/properties/default_organization_id'
                          - type: 'null'
                        description: The ID of the organization the user is most recently active in.
                      default_organization_slug:
                        $ref: '#/components/schemas/resource_user/properties/default_organization_slug'
                      email:
                        $ref: '#/components/schemas/resource_user/properties/email'
                      first_name:
                        $ref: '#/components/schemas/resource_user/properties/first_name'
                      flags:
                        $ref: '#/components/schemas/resource_user/properties/flags'
                      ical_token:
                        anyOf:
                          - $ref: '#/components/schemas/resource_user/properties/ical_token'
                          - type: 'null'
                        description: The iCal token for subscribing to this user's calendar.
                      intercom_hash:
                        $ref: '#/components/schemas/resource_user/properties/intercom_hash'
                      last_name:
                        $ref: '#/components/schemas/resource_user/properties/last_name'
                      locale:
                        $ref: '#/components/schemas/resource_user/properties/locale'
                      newsletter_consent:
                        $ref: '#/components/schemas/resource_user/properties/newsletter_consent'
                      newsletter_consent_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_user/properties/newsletter_consent_at'
                          - type: 'null'
                        description: The timestamp when the user gave newsletter consent.
                      preferences:
                        anyOf:
                          - $ref: '#/components/schemas/resource_user/properties/preferences'
                          - type: 'null'
                        description: User interface preferences.
                      sso_provision:
                        $ref: '#/components/schemas/resource_user/properties/sso_provision'
                      sysadmin:
                        $ref: '#/components/schemas/resource_user/properties/sysadmin'
                      sysadmin_permissions:
                        type: array
                        items:
                          type: string
                        description: The specific sysadmin permission scopes granted to this user.
                      time_zone:
                        anyOf:
                          - $ref: '#/components/schemas/resource_user/properties/time_zone'
                          - type: 'null'
                        description: The user's preferred time zone.
                      two_factor_auth:
                        $ref: '#/components/schemas/resource_user/properties/two_factor_auth'
                      updated_at:
                        $ref: '#/components/schemas/resource_user/properties/updated_at'
                      slack_product_updates:
                        $ref: '#/components/schemas/resource_user/properties/slack_product_updates'
                    example:
                      eq: value
                  relationships:
                    type: object
                    properties: {}
                    description: User relationships.
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '456'
                type: users
                attributes:
                  email: alex.smith@example.com
                  first_name: Alex
                  last_name: Smith
                  time_zone: America/New_York
                  avatar_url: null
                  default_organization_id: 109
                  default_organization_slug: myagency
                  locale: en
                  two_factor_auth: false
                  newsletter_consent: true
                  preferences: {}
                  updated_at: '2026-03-15T10:00:00.000+00:00'
              included: []
      description: Single user
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    collection_user:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of user records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A user resource object.
                  properties:
                    attributes:
                      type: object
                      description: User attributes.
                      properties:
                        account_access_expires_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_user/properties/account_access_expires_at'
                            - type: 'null'
                          description: Timestamp when this user's account access expires.
                        avatar_url:
                          anyOf:
                            - $ref: '#/components/schemas/resource_user/properties/avatar_url'
                            - type: 'null'
                          description: URL of the user's avatar image.
                        default_organization_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_user/properties/default_organization_id'
                            - type: 'null'
                          description: The ID of the default organization for this user.
                        default_organization_slug:
                          $ref: '#/components/schemas/resource_user/properties/default_organization_slug'
                        email:
                          $ref: '#/components/schemas/resource_user/properties/email'
                        first_name:
                          $ref: '#/components/schemas/resource_user/properties/first_name'
                        flags:
                          $ref: '#/components/schemas/resource_user/properties/flags'
                        ical_token:
                          anyOf:
                            - $ref: '#/components/schemas/resource_user/properties/ical_token'
                            - type: 'null'
                          description: The iCalendar token for subscribing to this user's calendar.
                        intercom_hash:
                          $ref: '#/components/schemas/resource_user/properties/intercom_hash'
                        last_name:
                          $ref: '#/components/schemas/resource_user/properties/last_name'
                        locale:
                          $ref: '#/components/schemas/resource_user/properties/locale'
                        newsletter_consent:
                          $ref: '#/components/schemas/resource_user/properties/newsletter_consent'
                        newsletter_consent_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_user/properties/newsletter_consent_at'
                            - type: 'null'
                          description: Timestamp when newsletter consent was given.
                        preferences:
                          anyOf:
                            - $ref: '#/components/schemas/resource_user/properties/preferences'
                            - type: 'null'
                          description: User interface preferences for this account.
                        sso_provision:
                          $ref: '#/components/schemas/resource_user/properties/sso_provision'
                        sysadmin:
                          $ref: '#/components/schemas/resource_user/properties/sysadmin'
                        sysadmin_permissions:
                          type: array
                          items:
                            type: string
                          description: Specific sysadmin permissions granted to this user.
                        time_zone:
                          anyOf:
                            - $ref: '#/components/schemas/resource_user/properties/time_zone'
                            - type: 'null'
                          description: The user's preferred time zone.
                        two_factor_auth:
                          $ref: '#/components/schemas/resource_user/properties/two_factor_auth'
                        updated_at:
                          $ref: '#/components/schemas/resource_user/properties/updated_at'
                        slack_product_updates:
                          $ref: '#/components/schemas/resource_user/properties/slack_product_updates'
                      example:
                        eq: value
                    relationships:
                      type: object
                      properties: {}
                      description: User relationships.
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of user resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '456'
                  type: users
                  attributes:
                    email: alex.smith@example.com
                    first_name: Alex
                    last_name: Smith
                    time_zone: America/New_York
                    avatar_url: null
                    default_organization_id: 109
                    default_organization_slug: myagency
                    locale: en
                    two_factor_auth: false
                    newsletter_consent: true
                    preferences: {}
                    updated_at: '2026-03-15T10:00:00.000+00:00'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection user
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_user:
      enum:
        - bad_decimal_format
        - current_password_invalid
        - email_already_exists
        - invalid_attribute
        - invalid_attribute_value
        - non_finite_number
        - null_bytes_in_params
        - password_contains_null_bytes
        - user_time_zone_invalid
      type: string
      title: Error Code
      description: Every error `code` the users endpoints can return.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_not_acceptable:
      enum:
        - bulk_extensions_headers_invalid
        - not_acceptable
        - read_only_mode_violation
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 406.
    error_code_not_found:
      enum:
        - not_found
        - record_not_found
        - route_not_found
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 404.
    error_code_forbidden:
      enum:
        - access_denied
        - account_inactive
        - agent_role_impersonation_denied
        - automatic_invoicing_not_manageable
        - billing_catalog_list_unavailable
        - booking_conflict_resolver_unavailable
        - budget_inaccessible
        - budgets_not_manageable
        - cascade_deletion_blocked
        - custom_roles_unavailable
        - deactivated_organization
        - deal_proposal_analytics_unavailable
        - deal_proposal_public_link_unavailable
        - document_styler_unavailable
        - document_templates_unavailable
        - email_inbox_unavailable
        - entry_not_editable
        - expense_not_editable
        - feature_unavailable
        - finalized_invoice_permission
        - financials_unavailable
        - impersonation_on_account_not_allowed
        - insufficient_automation_permission
        - insufficient_project_access
        - insufficient_seats
        - invalid_impersonate_role_id_header
        - invoices_unavailable
        - login_unavailable
        - mcp_access_disabled
        - mcp_connectors_disabled
        - mcp_provider_unavailable
        - missing_slack_integration
        - no_client_access
        - no_organization_id
        - no_person
        - no_sandbox_access
        - organization_red_flagged
        - other_timer_running
        - outgoing_emails_limit_exceeded
        - payment_reminders_unavailable
        - personal_access_token_limit_exceeded
        - pipelines_limit_exceeded
        - placeholders_limit_exceeded
        - plan_limit_exceeded
