                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content_tax_rate:
      content:
        application/vnd.api+json:
          schema:
