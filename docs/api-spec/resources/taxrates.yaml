openapi: 3.1.0
info:
  title: Productive.io API – TaxRates
  version: 2.0.0
description: |-
  The Tax rate object represents tax data in the invoicing system.

  You can find out more about tax rates in our Help documentation: [Setting up and Managing Tax Rates in Invoicing](https://help.productive.io/en/articles/9374894-setting-up-and-managing-tax-rates-in-invoicing).

  Following diagram shows tax rates in our data hierarchy:

  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  subsidiary1: Subsidiary
  line_item1: Line Item
  line_item2: Line Item
  line_item3: Line Item
  tax_rate1: Tax Rate {
    class: primary
  }
  tax_rate2: Tax Rate {
    class: primary
  }

  # Define connections
  subsidiary1 -> tax_rate1 -> line_item1
  subsidiary1 -> tax_rate2 -> line_item2
  tax_rate2 -> line_item3
  ```
x-filters:
  tax_rate:
    primary_component_name:
      description: Filter by the name of the primary tax component.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by tax rate name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    primary_component_value:
      description: Filter by the value of the primary tax component.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    secondary_component_name:
      description: Filter by the name of the secondary tax component.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by status (active or archived).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    secondary_component_value:
      description: Filter by the value of the secondary tax component.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/tax_rates/{id}/archive:
    patch:
      tags:
        - TaxRates
      summary: Archives a tax rate
      responses:
        '200':
          $ref: '#/components/responses/single_tax_rate'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: tax_rates-archive-archive
      description: Archive a tax rate to deactivate it.
  /api/v2/tax_rates:
    get:
      tags:
        - TaxRates
      summary: Get tax rates
      responses:
        '200':
          $ref: '#/components/responses/collection_tax_rate'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_tax_rate'
        - $ref: '#/components/parameters/filter_tax_rate'
      operationId: tax_rates-index
      description: List all tax rates.
    post:
      tags:
        - TaxRates
      summary: Create a tax rate
      responses:
        '201':
          $ref: '#/components/responses/single_tax_rate'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: tax_rates-create
      requestBody:
        $ref: '#/components/requestBodies/tax_rate'
      description: Create a new tax rate.
  /api/v2/tax_rates/{id}/restore:
    patch:
      tags:
        - TaxRates
      summary: Restores an archived tax rate
      responses:
        '200':
          $ref: '#/components/responses/single_tax_rate'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: tax_rates-restore-restore
      description: Restore an archived tax rate.
  /api/v2/tax_rates/{id}:
    get:
      tags:
        - TaxRates
      summary: Gets a tax rate
      responses:
        '200':
          $ref: '#/components/responses/single_tax_rate'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: tax_rates-show
      description: Retrieve a single tax rate by ID.
    patch:
      tags:
        - TaxRates
      summary: Update a tax rate
      responses:
        '200':
          $ref: '#/components/responses/single_tax_rate'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: tax_rates-update
      requestBody:
        $ref: '#/components/requestBodies/tax_rate'
      description: Update a tax rate.
components:
  requestBodies:
    tax_rate:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - name
                      - subsidiary_id
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_tax_rate/properties/name'
                      subsidiary_id:
                        $ref: '#/components/schemas/resource_tax_rate/properties/subsidiary_id'
                      primary_component_name:
                        $ref: '#/components/schemas/resource_tax_rate/properties/primary_component_name'
                      primary_component_value:
                        $ref: '#/components/schemas/resource_tax_rate/properties/primary_component_value'
                      secondary_component_name:
                        $ref: '#/components/schemas/resource_tax_rate/properties/secondary_component_name'
                      secondary_component_value:
                        $ref: '#/components/schemas/resource_tax_rate/properties/secondary_component_value'
      description: Request body for creating or updating a tax rate.
  schemas:
    resource_tax_rate:
      type: object
      title: Tax rate Resource
      properties:
        secondary_component_value:
          type: number
          title: Secondary Component Value
          description: The percentage value of the optional secondary tax component.
          example: 8
        subsidiary_name:
          title: Subsidiary Name
          description: The name of the subsidiary this tax rate is associated with.
          example: Acme Corp Canada
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this tax rate was archived, or null if active.
          example: null
        id:
          type: integer
          title: Id
          description: The unique identifier of this tax rate.
          example: 456789
        primary_component_value:
          type: number
          title: Primary Component Value
          description: The percentage value of the primary tax component.
          example: 5
        organization:
          title: Organization
          description: The organization this tax rate belongs to.
          example:
            data:
              type: organizations
              id: '109'
        subsidiary:
          title: Subsidiary
          description: The subsidiary this tax rate is associated with.
          example:
            data:
              type: subsidiaries
              id: '234'
        primary_component_name:
          type: string
          title: Primary Component Name
          description: The label for the primary tax component (e.g. VAT or GST).
          example: GST
        subsidiary_id:
          type: integer
          title: Subsidiary
          description: ID of the subsidiary this tax rate is associated with.
          example: 234
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
          description: The status of this tax rate, used for filtering (active or archived).
          example: 1
        secondary_component_name:
          type: string
          title: Secondary Component Name
          description: The label for the optional secondary tax component (e.g. PST in Canada).
          example: PST
        name:
          type: string
          title: Name
          description: The display name of this tax rate.
          example: HST 13%
      description: A tax rate with optional primary and secondary components, associated with a subsidiary and applied to invoices and line items.
      example:
        type: tax_rates
        id: '456789'
        attributes:
          name: HST 13%
          primary_component_name: GST
          primary_component_value: 5
          secondary_component_name: PST
          secondary_component_value: 8
          archived_at: null
        relationships:
          organization:
            data:
              type: organizations
              id: '109'
          subsidiary:
            data:
              type: subsidiaries
              id: '234'
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_tax_rate:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.tax_rate at the top of this file.
      required: false
      description: Filters
    sort_tax_rate:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - name
            - -name
            - subsidiary_name
            - -subsidiary_name
          type: string
        title: Sort tax rate
      explode: false
      required: false
      description: Sort tax rate
  responses:
    single_tax_rate:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_tax_rate/properties/name'
                      archived_at:
                        $ref: '#/components/schemas/resource_tax_rate/properties/archived_at'
                      primary_component_name:
                        $ref: '#/components/schemas/resource_tax_rate/properties/primary_component_name'
                      primary_component_value:
                        $ref: '#/components/schemas/resource_tax_rate/properties/primary_component_value'
                      secondary_component_name:
                        $ref: '#/components/schemas/resource_tax_rate/properties/secondary_component_name'
                      secondary_component_value:
                        $ref: '#/components/schemas/resource_tax_rate/properties/secondary_component_value'
                  relationships:
                    type: object
                    properties:
                      subsidiary:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single tax rate
    collection_tax_rate:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_tax_rate/properties/name'
                        archived_at:
                          $ref: '#/components/schemas/resource_tax_rate/properties/archived_at'
                        primary_component_name:
                          $ref: '#/components/schemas/resource_tax_rate/properties/primary_component_name'
                        primary_component_value:
                          $ref: '#/components/schemas/resource_tax_rate/properties/primary_component_value'
                        secondary_component_name:
                          $ref: '#/components/schemas/resource_tax_rate/properties/secondary_component_name'
                        secondary_component_value:
                          $ref: '#/components/schemas/resource_tax_rate/properties/secondary_component_value'
                    relationships:
                      type: object
                      properties:
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection tax rate
