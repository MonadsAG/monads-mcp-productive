openapi: 3.1.0
info:
  title: Productive.io API – TaxRates
  version: 2.0.0
description: |-
  The Tax rate object represents tax data in the invoicing system.

  You can find out more about tax rates in our Help documentation: [Setting up and Managing Tax Rates in Invoicing](https://help.productive.io/en/articles/9374894-setting-up-and-managing-tax-rates-in-invoicing).

  Following diagram shows tax rates in our data hierarchy:

  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  subsidiary1: Subsidiary
  line_item1: Line Item
  line_item2: Line Item
  line_item3: Line Item
  tax_rate1: Tax Rate {
    class: primary
  }
  tax_rate2: Tax Rate {
    class: primary
  }

  # Define connections
  subsidiary1 -> tax_rate1 -> line_item1
  subsidiary1 -> tax_rate2 -> line_item2
  tax_rate2 -> line_item3
  ```
x-filters:
  tax_rate:
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by tax rate name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    primary_component_name:
      description: Filter by the name of the primary tax component.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    primary_component_value:
      description: Filter by the value of the primary tax component.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    secondary_component_name:
      description: Filter by the name of the secondary tax component.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    secondary_component_value:
      description: Filter by the value of the secondary tax component.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by status (active or archived).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/tax_rates/{id}/archive:
    patch:
      tags:
        - TaxRates
      summary: Archives a tax rate
      operationId: tax_rates-archive-archive
      description: Archive a tax rate to deactivate it.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_tax_rate'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/tax_rates:
    get:
      tags:
        - TaxRates
      summary: Get tax rates
      operationId: tax_rates-index
      description: List all tax rates.
      parameters:
        - $ref: '#/components/parameters/filter_tax_rate'
        - $ref: '#/components/parameters/sort_tax_rate'
      responses:
        '200':
          $ref: '#/components/responses/collection_tax_rate'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - TaxRates
      summary: Create a tax rate
      operationId: tax_rates-create
      description: Create a new tax rate.
      requestBody:
        $ref: '#/components/requestBodies/tax_rate'
      responses:
        '201':
          $ref: '#/components/responses/single_tax_rate'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_tax_rate'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/tax_rates/{id}/restore:
    patch:
      tags:
        - TaxRates
      summary: Restores an archived tax rate
      operationId: tax_rates-restore-restore
      description: Restore an archived tax rate.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_tax_rate'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/tax_rates/{id}:
    get:
      tags:
        - TaxRates
      summary: Gets a tax rate
      operationId: tax_rates-show
      description: Retrieve a single tax rate by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_tax_rate'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - TaxRates
      summary: Update a tax rate
      operationId: tax_rates-update
      description: Update a tax rate.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/tax_rate'
      responses:
        '200':
          $ref: '#/components/responses/single_tax_rate'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_tax_rate'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
