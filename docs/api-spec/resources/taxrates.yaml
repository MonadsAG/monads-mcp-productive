    single_tax_rate:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single tax_rate record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned tax_rate resource.
                properties:
                  attributes:
                    type: object
                    description: Tax rate attributes.
                    properties:
                      archived_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_tax_rate/properties/archived_at'
                          - type: 'null'
                        description: The timestamp when the tax rate was archived, or null if active.
                      name:
                        $ref: '#/components/schemas/resource_tax_rate/properties/name'
                      primary_component_name:
                        $ref: '#/components/schemas/resource_tax_rate/properties/primary_component_name'
                      primary_component_value:
                        type: string
                        description: The percentage value of the primary tax component.
                      secondary_component_name:
                        anyOf:
                          - $ref: '#/components/schemas/resource_tax_rate/properties/secondary_component_name'
                          - type: 'null'
                        description: The name of the secondary tax component, if applicable.
                      secondary_component_value:
                        anyOf:
                          - type: string
                          - type: 'null'
                        description: The percentage value of the secondary tax component.
                    example:
                      name: HST 13%
                      primary_component_name: GST
                      primary_component_value: 5
                      secondary_component_name: PST
                      secondary_component_value: 8
                      archived_at: null
                  relationships:
                    type: object
                    description: Tax rate relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      subsidiary:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      organization:
                        data:
                          type: organizations
                          id: '109'
                      subsidiary:
                        data:
                          type: subsidiaries
                          id: '234'
                example:
                  type: tax_rates
                  id: '456789'
                  attributes:
                    name: HST 13%
                    primary_component_name: GST
                    primary_component_value: 5
                    secondary_component_name: PST
                    secondary_component_value: 8
                    archived_at: null
                  relationships:
                    organization:
                      data:
                        type: organizations
                        id: '109'
                    subsidiary:
                      data:
                        type: subsidiaries
                        id: '234'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    type: subsidiaries
                    id: '234'
                    attributes:
                      name: Acme Corp Canada
                description: Sideloaded related resources.
                example:
                  - type: subsidiaries
                    id: '234'
                    attributes:
                      name: Acme Corp Canada
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '8'
                type: tax_rates
                attributes:
                  name: Standard VAT 20%
                  primary_component_name: VAT
                  primary_component_value: '0.2'
                  secondary_component_name: null
                  secondary_component_value: null
                  archived_at: null
                relationships:
                  subsidiary:
                    data:
                      type: subsidiaries
                      id: '2'
              included: []
      description: Single tax rate
    collection_tax_rate:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of tax rate records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A tax rate resource object.
                  properties:
                    attributes:
                      type: object
                      description: Tax rate attributes.
                      properties:
                        archived_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_tax_rate/properties/archived_at'
                            - type: 'null'
                          description: Timestamp when this tax rate was archived.
                        name:
                          $ref: '#/components/schemas/resource_tax_rate/properties/name'
                        primary_component_name:
                          $ref: '#/components/schemas/resource_tax_rate/properties/primary_component_name'
                        primary_component_value:
                          type: string
                          description: The percentage value of the primary tax component.
                        secondary_component_name:
                          anyOf:
                            - $ref: '#/components/schemas/resource_tax_rate/properties/secondary_component_name'
                            - type: 'null'
                          description: The name of the secondary tax component, if applicable.
                        secondary_component_value:
                          anyOf:
                            - type: string
                            - type: 'null'
                          description: The percentage value of the secondary tax component, if applicable.
                      example:
                        name: HST 13%
                        primary_component_name: GST
                        primary_component_value: 5
                        secondary_component_name: PST
                        secondary_component_value: 8
                        archived_at: null
                    relationships:
                      type: object
                      description: Tax rate relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        organization:
                          data:
                            type: organizations
                            id: '109'
                        subsidiary:
                          data:
                            type: subsidiaries
                            id: '234'
                  example:
                    type: tax_rates
                    id: '456789'
                    attributes:
                      name: HST 13%
                      primary_component_name: GST
                      primary_component_value: 5
                      secondary_component_name: PST
                      secondary_component_value: 8
                      archived_at: null
                    relationships:
                      organization:
                        data:
                          type: organizations
                          id: '109'
                      subsidiary:
                        data:
                          type: subsidiaries
                          id: '234'
                description: Array of tax rate resource objects.
                example:
                  - type: tax_rates
                    id: '456789'
                    attributes:
                      name: HST 13%
                      primary_component_name: GST
                      primary_component_value: 5
                      secondary_component_name: PST
                      secondary_component_value: 8
                      archived_at: null
                    relationships:
                      organization:
                        data:
                          type: organizations
                          id: '109'
                      subsidiary:
                        data:
                          type: subsidiaries
                          id: '234'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    type: subsidiaries
                    id: '234'
                    attributes:
                      name: Acme Corp Canada
                description: Sideloaded related resources.
                example:
                  - type: subsidiaries
                    id: '234'
                    attributes:
                      name: Acme Corp Canada
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '8'
                  type: tax_rates
                  attributes:
                    name: Standard VAT 20%
                    primary_component_name: VAT
                    primary_component_value: '0.2'
                    secondary_component_name: null
                    secondary_component_value: null
                    archived_at: null
                  relationships:
                    subsidiary:
                      data:
                        type: subsidiaries
                        id: '2'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection tax rate
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_tax_rate:
      enum:
        - bad_decimal_format
        - invalid_attribute_value
        - non_finite_number
        - null_bytes_in_params
        - tax_rate_default_locked
        - tax_rate_used_on_invoice
        - tax_rate_used_on_proposal
      type: string
      title: Error Code
      description: Every error `code` the tax rates endpoints can return in a 422 response.
    error_code_unsupported_media_type:
      enum:
        - unsupported_content_type
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 415.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_not_acceptable:
      enum:
        - bulk_extensions_headers_invalid
        - not_acceptable
        - read_only_mode_violation
