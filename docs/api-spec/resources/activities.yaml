openapi: 3.1.0
info:
  title: Productive.io API – Activities
  version: 2.0.0
description: |-
  Activities in Productive track changes made to various objects across the platform. Whenever an object is created, updated, or deleted, a new activity is logged. This activity records the type of change, the specific data that was modified, as well as the actor who made the change and the exact timestamp when it occurred.

  These activities are primarily used in Feeds for different objects, such as Tasks, Projects, People and other.

  _Note:_ Activities are created for most, but not all, objects in Productive.
x-filters:
  activity:
    participant_id:
      description: Filter activities where this person participated (as creator, email recipient, or subject).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter activities related to a specific company.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    booking_id:
      description: Filter activities related to a specific booking.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    invoice_id:
      description: Filter activities related to a specific invoice.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    proposal_id:
      description: Filter activities related to a specific proposal (includes both direct and parent-linked activities).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    pinned:
      description: Return only activities with pinned comments.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    purchase_order_id:
      description: Filter activities on a specific purchase order.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      description: Filter activities related to a specific deal or budget.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    event:
      description: Filter by event type (e.g. create, update, destroy).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    normalized_item_type:
      description: Filter by normalized resource type, distinguishing between deals and budgets.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    has_attachments:
      description: Return only activities that have file attachments.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who created the activity.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    item_type:
      description: Filter by the resource type of the changed entity (e.g. "task", "deal").
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    resource_request_id:
      description: Filter activities on a specific resource request.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by activity ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    parent_type:
      description: Filter by the resource type of the activity's immediate parent (e.g. task, project).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    before:
      description: Return activities created before this timestamp.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter activities related to a specific person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    type:
      description: 'Filter by activity type: 1=Comment, 2=Changeset (field change), 3=Email.'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    expense_id:
      description: Filter activities related to a specific expense.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    discussion_id:
      description: Filter activities related to a specific doc discussion.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    after:
      description: Return activities created after this timestamp.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filter by creation date range (`created_at`).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      description: Filter activities related to a specific task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    root_type:
      description: Filter by the top-level resource type the activity is nested under (e.g. project, deal).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter activities related to a specific project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/activities:
    get:
      tags:
        - Activities
      summary: Get activities
      responses:
        '200':
          $ref: '#/components/responses/collection_activity'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_activity'
        - $ref: '#/components/parameters/sort_activity'
      operationId: activities-index
      description: List activities with optional filters and pagination.
  /api/v2/activities/{id}:
    get:
      tags:
        - Activities
      summary: Get an activity
      responses:
        '200':
          $ref: '#/components/responses/single_activity'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: activities-show
      description: Retrieve a single activity by ID.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_activity:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort activity
      explode: false
      required: false
      description: Sort activity
    filter_activity:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.activity at the top of this file.
      required: false
      description: Filters
  responses:
    single_activity:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      event:
                        $ref: '#/components/schemas/resource_activity/properties/event'
                      deal_id:
                        $ref: '#/components/schemas/resource_activity/properties/deal_id'
                      item_id:
                        $ref: '#/components/schemas/resource_activity/properties/item_id'
                      page_id:
                        $ref: '#/components/schemas/resource_activity/properties/page_id'
                      root_id:
                        $ref: '#/components/schemas/resource_activity/properties/root_id'
                      task_id:
                        $ref: '#/components/schemas/resource_activity/properties/task_id'
                      changeset:
                        $ref: '#/components/schemas/resource_activity/properties/changeset'
                      item_name:
                        $ref: '#/components/schemas/resource_activity/properties/item_name'
                      item_type:
                        $ref: '#/components/schemas/resource_activity/properties/item_type'
                      parent_id:
                        $ref: '#/components/schemas/resource_activity/properties/parent_id'
                      person_id:
                        $ref: '#/components/schemas/resource_activity/properties/person_id'
                      root_name:
                        $ref: '#/components/schemas/resource_activity/properties/root_name'
                      root_type:
                        $ref: '#/components/schemas/resource_activity/properties/root_type'
                      booking_id:
                        $ref: '#/components/schemas/resource_activity/properties/booking_id'
                      company_id:
                        $ref: '#/components/schemas/resource_activity/properties/company_id'
                      created_at:
                        $ref: '#/components/schemas/resource_activity/properties/created_at'
                      invoice_id:
                        $ref: '#/components/schemas/resource_activity/properties/invoice_id'
                      parent_name:
                        $ref: '#/components/schemas/resource_activity/properties/parent_name'
                      parent_type:
                        $ref: '#/components/schemas/resource_activity/properties/parent_type'
                      discussion_id:
                        $ref: '#/components/schemas/resource_activity/properties/discussion_id'
                      engagement_id:
                        $ref: '#/components/schemas/resource_activity/properties/engagement_id'
                      deal_is_budget:
                        $ref: '#/components/schemas/resource_activity/properties/deal_is_budget'
                      item_deleted_at:
                        $ref: '#/components/schemas/resource_activity/properties/item_deleted_at'
                      root_deleted_at:
                        $ref: '#/components/schemas/resource_activity/properties/root_deleted_at'
                      parent_deleted_at:
                        $ref: '#/components/schemas/resource_activity/properties/parent_deleted_at'
                      purchase_order_id:
                        $ref: '#/components/schemas/resource_activity/properties/purchase_order_id'
                      made_by_automation:
                        $ref: '#/components/schemas/resource_activity/properties/made_by_automation'
                  relationships:
                    type: object
                    properties:
                      role:
                        $ref: '#/components/schemas/_single_relationship'
                      email:
                        $ref: '#/components/schemas/_single_relationship'
                      comment:
                        $ref: '#/components/schemas/_single_relationship'
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      attachment:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single activity
    collection_activity:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        event:
                          $ref: '#/components/schemas/resource_activity/properties/event'
                        deal_id:
                          $ref: '#/components/schemas/resource_activity/properties/deal_id'
                        item_id:
                          $ref: '#/components/schemas/resource_activity/properties/item_id'
                        page_id:
                          $ref: '#/components/schemas/resource_activity/properties/page_id'
                        root_id:
                          $ref: '#/components/schemas/resource_activity/properties/root_id'
                        task_id:
                          $ref: '#/components/schemas/resource_activity/properties/task_id'
                        changeset:
                          $ref: '#/components/schemas/resource_activity/properties/changeset'
                        item_name:
                          $ref: '#/components/schemas/resource_activity/properties/item_name'
                        item_type:
                          $ref: '#/components/schemas/resource_activity/properties/item_type'
                        parent_id:
                          $ref: '#/components/schemas/resource_activity/properties/parent_id'
                        person_id:
                          $ref: '#/components/schemas/resource_activity/properties/person_id'
                        root_name:
                          $ref: '#/components/schemas/resource_activity/properties/root_name'
                        root_type:
                          $ref: '#/components/schemas/resource_activity/properties/root_type'
                        booking_id:
                          $ref: '#/components/schemas/resource_activity/properties/booking_id'
                        company_id:
                          $ref: '#/components/schemas/resource_activity/properties/company_id'
                        created_at:
                          $ref: '#/components/schemas/resource_activity/properties/created_at'
                        invoice_id:
                          $ref: '#/components/schemas/resource_activity/properties/invoice_id'
                        parent_name:
                          $ref: '#/components/schemas/resource_activity/properties/parent_name'
                        parent_type:
                          $ref: '#/components/schemas/resource_activity/properties/parent_type'
                        discussion_id:
                          $ref: '#/components/schemas/resource_activity/properties/discussion_id'
                        engagement_id:
                          $ref: '#/components/schemas/resource_activity/properties/engagement_id'
                        deal_is_budget:
                          $ref: '#/components/schemas/resource_activity/properties/deal_is_budget'
                        item_deleted_at:
                          $ref: '#/components/schemas/resource_activity/properties/item_deleted_at'
                        root_deleted_at:
                          $ref: '#/components/schemas/resource_activity/properties/root_deleted_at'
                        parent_deleted_at:
                          $ref: '#/components/schemas/resource_activity/properties/parent_deleted_at'
                        purchase_order_id:
                          $ref: '#/components/schemas/resource_activity/properties/purchase_order_id'
                        made_by_automation:
                          $ref: '#/components/schemas/resource_activity/properties/made_by_automation'
                    relationships:
                      type: object
                      properties:
                        role:
                          $ref: '#/components/schemas/_single_relationship'
                        email:
                          $ref: '#/components/schemas/_single_relationship'
                        comment:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        attachment:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection activity
  schemas:
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    resource_activity:
      type: object
      title: Activity Resource
      properties:
        root_type:
          type: string
          title: Root Type
          description: Resource type of the root-level entity.
          example:
            eq: active
        created_at:
          type: string
          title: Created At
          format: date-time
          description: When this activity occurred.
          example:
            gt: '2026-01-01'
        root_id:
          type: integer
          title: Root
          description: ID of the root-level entity in the hierarchy.
          example:
            - 123
        participant_id:
          type: integer
          title: Participant
          description: ID of a person who participated in the activity (as creator, email recipient, or subject).
          example:
            - 123
        person_id:
          type: integer
          title: Person
          description: ID of the related person, if applicable.
          example:
            - 123
        purchase_order_id:
          type: integer
          title: Purchase Order
          description: ID of the related purchase order, if applicable.
          example: 1234567
        normalized_item_type:
          type: string
          title: Normalized Item Type
          description: Normalized resource type of the changed entity, distinguishing between deals and budgets.
          example:
            eq: active
        task_id:
          type: integer
          title: Task
          description: ID of the related task, if this activity is about a task or its children.
          example:
            - 123
        invoice_id:
          type: integer
          title: Invoice
          description: ID of the related invoice, if applicable.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this activity belongs to.
          example:
            eq: value
        item_deleted_at:
          type: string
          title: Item Deleted At
          format: date-time
          description: Timestamp if the changed entity has been soft-deleted, null otherwise.
          example:
            gt: '2026-01-01'
        parent_id:
          type: integer
          title: Parent
          description: ID of the parent entity (e.g. the project a task belongs to).
          example:
            - 123
        event:
          type: string
          title: Event
          description: The type of change event (e.g. create, update, destroy).
          example:
            eq: value
        role:
          title: Role
          description: The role associated with this activity, if it was a role change.
          example:
            eq: value
        expense_id:
          type: integer
          title: Expense
          description: ID of the related expense, if this activity is about an expense.
          example:
            - 123
        type:
          type: string
          title: Type
          description: 'Activity type: 1=Comment, 2=Changeset (field change), 3=Email.'
          example:
            eq: active
        item_type:
          type: string
          title: Item Type
          description: Resource type of the changed entity (e.g. "task", "deal", "invoice").
          example:
            eq: active
        root_deleted_at:
          type: string
          title: Root Deleted At
          format: date-time
          description: Timestamp if the root entity has been soft-deleted, null otherwise.
          example:
            gt: '2026-01-01'
        attachment:
          title: Attachment
          description: The attachment associated with this activity, if applicable.
          example:
            eq: value
        pinned:
          type: boolean
          title: Pinned
          description: Whether this activity has a pinned comment.
          example:
            eq: value
        booking_id:
          type: integer
          title: Booking
          description: ID of the related booking, if applicable.
          example:
            - 123
        id:
          type: integer
          title: Id
          description: Unique identifier for this activity.
          example:
            - 123
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who made this change.
          example:
            - 123
        made_by_automation:
          title: Made By Automation
          description: Whether this change was triggered by an automation rule rather than a person.
          example:
            eq: value
        deal_is_budget:
          title: Deal Is Budget
          description: Whether the related deal is a production budget (in a production pipeline) rather than a sales deal.
          example:
            gt: 0
        root_name:
          title: Root Name
          description: Human-readable name of the root-level entity.
          example:
            eq: value
        parent_type:
          type: string
          title: Parent Type
          description: Resource type of the parent entity.
          example:
            eq: active
        deal_id:
          type: integer
          title: Deal
          description: ID of the related deal/budget, if applicable.
          example:
            - 123
        page_id:
          type: integer
          title: Page
          description: ID of the related doc page, if applicable.
          example:
            - 123
        creator:
          title: Creator
          description: The person who made this change.
          example:
            eq: value
        has_attachments:
          type: boolean
          title: Has Attachments
          description: Whether this activity entry has file attachments.
          example:
            gt: '2026-01-01'
        engagement_id:
          type: integer
          title: Engagement
          description: ID of the related salary record, if applicable.
          example:
            - 123
        proposal_id:
          type: integer
          title: Proposal
          description: ID of the related proposal, if applicable.
          example:
            - 123
        project_id:
          type: integer
          title: Project
          description: ID of the related project, if applicable.
          example:
            - 123
        parent_deleted_at:
          type: string
          title: Parent Deleted At
          format: date-time
          description: Timestamp if the parent entity has been soft-deleted, null otherwise.
          example:
            gt: '2026-01-01'
        resource_request_id:
          type: integer
          title: Resource Request
          description: ID of the related resource request, if applicable.
          example:
            - 123
        email:
          title: Email
          description: The email associated with this activity, if it was an email event.
          example:
            eq: value
        company_id:
          type: integer
          title: Company
          description: ID of the related company, if applicable.
          example:
            - 123
        after:
          type: string
          title: After
          format: date-time
          description: Cursor for pagination — return activities after this timestamp.
          example:
            eq: value
        item_id:
          type: integer
          title: Item
          description: ID of the entity that was changed.
          example:
            - 123
        discussion_id:
          type: integer
          title: Discussion
          description: ID of the related doc discussion, if applicable.
          example:
            - 123
        item_name:
          title: Item Name
          description: Human-readable name of the changed entity.
          example:
            eq: value
        changeset:
          title: Changeset
          description: The set of field changes made in this activity, formatted as before/after pairs. Sensitive fields are filtered based on viewer permissions.
          example:
            eq: value
        before:
          type: string
          title: Before
          format: date-time
          description: Cursor for pagination — return activities before this timestamp.
          example:
            eq: value
        parent_name:
          title: Parent Name
          description: Human-readable name of the parent entity.
          example:
            eq: value
        comment:
          title: Comment
          description: The comment associated with this activity, if it was a comment event.
          example:
            eq: value
      description: An activity feed entry recording a change event on an entity. Activities track who changed what, when, and how — forming the audit log for tasks, deals, projects, invoices, and other resources.
      example:
        id: '259275372'
        type: activities
        attributes:
          event: create
          changeset:
            - title:
                - ''
                - Implement user authentication
          item_id: 120501
          item_type: task
          item_name: '#42: Implement user authentication'
          item_deleted_at: null
          parent_id: 6899
          parent_type: project
          parent_name: Website Redesign
          parent_deleted_at: null
          root_id: 6899
          root_type: project
          root_name: Website Redesign
          root_deleted_at: null
          deal_is_budget: false
          task_id: 120501
          deal_id: null
          booking_id: null
          invoice_id: null
          company_id: 65111
          created_at: '2026-03-01T10:00:00.000+00:00'
          person_id: 12
          made_by_automation: false
        relationships:
          creator:
            data:
              type: people
              id: '12'
