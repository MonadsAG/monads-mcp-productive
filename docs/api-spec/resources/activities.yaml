openapi: 3.1.0
info:
  title: Productive.io API – Activities
  version: 2.0.0
description: |-
  Activities in Productive track changes made to various objects across the platform. Whenever an object is created, updated, or deleted, a new activity is logged. This activity records the type of change, the specific data that was modified, as well as the actor who made the change and the exact timestamp when it occurred.

  These activities are primarily used in Feeds for different objects, such as Tasks, Projects, People and other.

  _Note:_ Activities are created for most, but not all, objects in Productive.
x-filters:
  activity:
    after:
      description: Return activities created after this timestamp.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    before:
      description: Return activities created before this timestamp.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    booking_id:
      description: Filter activities related to a specific booking.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter activities related to a specific company.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filter by creation date range (`created_at`).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who created the activity.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      description: Filter activities related to a specific deal or budget.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    discussion_id:
      description: Filter activities related to a specific doc discussion.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    event:
      description: Filter by event type (e.g. create, update, destroy).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    expense_id:
      description: Filter activities related to a specific expense.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    has_attachments:
      description: Return only activities that have file attachments.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by activity ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    invoice_id:
      description: Filter activities related to a specific invoice.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    item_type:
      description: Filter by the resource type of the changed entity (e.g. "task", "deal").
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    normalized_item_type:
      description: Filter by normalized resource type, distinguishing between deals and budgets.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    parent_type:
      description: Filter by the resource type of the activity's immediate parent (e.g. task, project).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    participant_id:
      description: Filter activities where this person participated (as creator, email recipient, or subject).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter activities related to a specific person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    pinned:
      description: Return only activities with pinned comments.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter activities related to a specific project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    proposal_id:
      description: Filter activities related to a specific proposal (includes both direct and parent-linked activities).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    purchase_order_id:
      description: Filter activities on a specific purchase order.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    resource_request_id:
      description: Filter activities on a specific resource request.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    root_type:
      description: Filter by the top-level resource type the activity is nested under (e.g. project, deal).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      description: Filter activities related to a specific task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    type:
      description: 'Filter by activity type: 1=Comment, 2=Changeset (field change), 3=Email.'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/activities:
    get:
      tags:
        - Activities
      summary: Get activities
      operationId: activities-index
      description: List activities with optional filters and pagination.
      parameters:
        - $ref: '#/components/parameters/filter_activity'
        - $ref: '#/components/parameters/sort_activity'
      responses:
        '200':
          $ref: '#/components/responses/collection_activity'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/activities/{id}:
    get:
      tags:
        - Activities
      summary: Get an activity
      operationId: activities-show
      description: Retrieve a single activity by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_activity'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
