openapi: 3.1.0
info:
  title: Productive.io API – Custom domains
  version: 2.0.0
description: |-
  **Custom domains** allow organizations to send transactional emails (invoices, proposals, notifications) from their own domain rather than a Productive-managed address.

  Configure and verify DNS records (`SPF`, `DKIM`, `MX`) for your domain through these endpoints. A verified custom domain improves email deliverability and reinforces brand identity.
x-filters:
  custom_domain:
    id:
      description: Filter by custom domain ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by domain name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/custom_domains:
    get:
      tags:
        - Custom domains
      summary: Get custom domains
      responses:
        '200':
          $ref: '#/components/responses/collection_custom_domain'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_custom_domain'
        - $ref: '#/components/parameters/filter_custom_domain'
      operationId: custom_domains-index
      description: List custom domains with optional filters and pagination.
    post:
      tags:
        - Custom domains
      summary: Create a custom domain
      responses:
        '201':
          $ref: '#/components/responses/single_custom_domain'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: custom_domains-create
      requestBody:
        $ref: '#/components/requestBodies/custom_domain'
      description: Create a new custom domain.
  /api/v2/custom_domains/{id}:
    get:
      tags:
        - Custom domains
      summary: Gets a custom domain
      responses:
        '200':
          $ref: '#/components/responses/single_custom_domain'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: custom_domains-show
      description: Retrieve a single custom domain by ID.
    delete:
      tags:
        - Custom domains
      summary: Deletes a custom domain
      responses:
        '204':
          description: No Content
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: custom_domains-destroy
      description: Delete a custom domain.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_custom_domain:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.custom_domain at the top of this file.
      required: false
      description: Filters
    sort_custom_domain:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort custom domain
      explode: false
      required: false
      description: Sort custom domain
  responses:
    single_custom_domain:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_custom_domain/properties/name'
                      mailgun_mx:
                        $ref: '#/components/schemas/resource_custom_domain/properties/mailgun_mx'
                      mailgun_spf:
                        $ref: '#/components/schemas/resource_custom_domain/properties/mailgun_spf'
                      verified_at:
                        $ref: '#/components/schemas/resource_custom_domain/properties/verified_at'
                      mailgun_dkim:
                        $ref: '#/components/schemas/resource_custom_domain/properties/mailgun_dkim'
                      allow_user_email:
                        $ref: '#/components/schemas/resource_custom_domain/properties/allow_user_email'
                      email_sender_name:
                        $ref: '#/components/schemas/resource_custom_domain/properties/email_sender_name'
                      email_sender_address:
                        $ref: '#/components/schemas/resource_custom_domain/properties/email_sender_address'
                  relationships:
                    type: object
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      subsidiaries:
                        $ref: '#/components/schemas/_collection_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single custom domain
    collection_custom_domain:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_custom_domain/properties/name'
                        mailgun_mx:
                          $ref: '#/components/schemas/resource_custom_domain/properties/mailgun_mx'
                        mailgun_spf:
                          $ref: '#/components/schemas/resource_custom_domain/properties/mailgun_spf'
                        verified_at:
                          $ref: '#/components/schemas/resource_custom_domain/properties/verified_at'
                        mailgun_dkim:
                          $ref: '#/components/schemas/resource_custom_domain/properties/mailgun_dkim'
                        allow_user_email:
                          $ref: '#/components/schemas/resource_custom_domain/properties/allow_user_email'
                        email_sender_name:
                          $ref: '#/components/schemas/resource_custom_domain/properties/email_sender_name'
                        email_sender_address:
                          $ref: '#/components/schemas/resource_custom_domain/properties/email_sender_address'
                    relationships:
                      type: object
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        subsidiaries:
                          $ref: '#/components/schemas/_collection_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection custom domain
  schemas:
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _collection_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Collection data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          description: Included variant — related resource identifiers are present in `data`.
          example:
            data:
              - type: tasks
                id: '42'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    resource_custom_domain:
      type: object
      title: Custom domain Resource
      properties:
        mailgun_mx:
          title: Mailgun Mx
          description: The MX DNS records required for Mailgun email routing for this custom domain.
          example:
            eq: value
        subsidiaries:
          title: Subsidiaries
          description: The subsidiaries that use this custom domain.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The custom domain name (hostname) used for client-facing portals.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: The unique identifier of this custom domain.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this custom domain belongs to.
          example:
            eq: value
        email_sender_address:
          type: string
          title: Email Sender Address
          description: The email address used as the sender when sending emails via this custom domain.
          example:
            eq: value
        allow_user_email:
          type: boolean
          title: Allow User Email
          description: Whether to allow user email.
          example:
            eq: value
        email_sender_name:
          type: string
          title: Email Sender Name
          description: The sender name for emails.
          example:
            eq: value
        mailgun_dkim:
          type: string
          title: Mailgun Dkim
          description: The DKIM DNS record required for email authentication via Mailgun for this custom domain.
          example:
            eq: value
        verified_at:
          type: string
          title: Verified At
          format: date-time
          description: Timestamp when this custom domain was verified, or null if verification is still pending.
          example:
            gt: '2026-01-01'
        mailgun_spf:
          type: string
          title: Mailgun Spf
          description: The SPF DNS record required for email sender authentication via Mailgun for this custom domain.
          example:
            eq: value
      description: A custom URL domain configured for an organization's client-facing portals, with optional email sending settings.
      example:
        id: '123'
        type: custom_domains
        attributes:
          domain: app.myagency.com
          status: active
          verified_at: '2026-01-01T00:00:00Z'
        relationships: {}
  requestBodies:
    custom_domain:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_custom_domain/properties/name'
                      allow_user_email:
                        $ref: '#/components/schemas/resource_custom_domain/properties/allow_user_email'
                      email_sender_name:
                        $ref: '#/components/schemas/resource_custom_domain/properties/email_sender_name'
                      email_sender_address:
                        $ref: '#/components/schemas/resource_custom_domain/properties/email_sender_address'
      description: Request body for creating or updating a custom domain.
