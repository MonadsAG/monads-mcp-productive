openapi: 3.1.0
info:
  title: Productive.io API – Skills
  version: 2.0.0
x-filters:
  skill:
    query:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    shared_with_agent_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    auto_load:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/skills:
    get:
      tags:
        - Skills
      summary: Get skills
      operationId: skills-index
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_skill'
        - $ref: '#/components/parameters/sort_skill'
      responses:
        '200':
          $ref: '#/components/responses/collection_skill'
    post:
      tags:
        - Skills
      summary: Create a skill
      operationId: skills-create
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/skill'
      responses:
        '201':
          $ref: '#/components/responses/single_skill'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/skills/{id}:
    get:
      tags:
        - Skills
      summary: Get a skill
      operationId: skills-show
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_skill'
    patch:
      tags:
        - Skills
      summary: Update a skill
      operationId: skills-update
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        $ref: '#/components/requestBodies/skill'
      responses:
        '200':
          $ref: '#/components/responses/single_skill'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
    delete:
      tags:
        - Skills
      summary: Deletes a skill
      operationId: skills-destroy
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - $ref: '#/components/parameters/header_organization'
      responses:
        '204':
          description: No Content
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_skill:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort skill
      explode: false
      required: false
    filter_skill:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.skill at the top of this file.
      required: false
  responses:
    single_skill:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              included:
                type: array
                items: {}
              meta:
                $ref: '#/components/schemas/_meta'
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      updated_at:
                        $ref: '#/components/schemas/resource_skill/properties/updated_at'
                      smart_action_locations:
                        $ref: '#/components/schemas/resource_skill/properties/smart_action_locations'
                      name:
                        $ref: '#/components/schemas/resource_skill/properties/name'
                      description:
                        $ref: '#/components/schemas/resource_skill/properties/description'
                      auto_load:
                        $ref: '#/components/schemas/resource_skill/properties/auto_load'
                      instructions:
                        $ref: '#/components/schemas/resource_skill/properties/instructions'
                      created_at:
                        $ref: '#/components/schemas/resource_skill/properties/created_at'
                  relationships:
                    type: object
                    properties:
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      memberships:
                        $ref: '#/components/schemas/_collection_relationship'
      description: Single skill
    collection_skill:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              meta:
                $ref: '#/components/schemas/_meta'
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        auto_load:
                          $ref: '#/components/schemas/resource_skill/properties/auto_load'
                        description:
                          $ref: '#/components/schemas/resource_skill/properties/description'
                        created_at:
                          $ref: '#/components/schemas/resource_skill/properties/created_at'
                        name:
                          $ref: '#/components/schemas/resource_skill/properties/name'
                        updated_at:
                          $ref: '#/components/schemas/resource_skill/properties/updated_at'
                        instructions:
                          $ref: '#/components/schemas/resource_skill/properties/instructions'
                        smart_action_locations:
                          $ref: '#/components/schemas/resource_skill/properties/smart_action_locations'
                    relationships:
                      type: object
                      properties:
                        memberships:
                          $ref: '#/components/schemas/_collection_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
              included:
                type: array
                items: {}
      description: Collection skill
  schemas:
    _collection_relationship:
      anyOf:
        - type: object
          title: Collection data
          description: Included variant — related resource identifiers are present in `data`.
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          example:
            data:
              - type: tasks
                id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      example:
        type: tasks
        id: '42'
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    resource_skill:
      type: object
      title: Skill Resource
      properties:
        id:
          type: integer
          title: Id
        updated_at:
          type: string
          title: Updated At
          format: date-time
        query:
          type: string
          title: Query
        instructions:
          type: string
          title: Instructions
        description:
          type: string
          title: Description
        name:
          type: string
          title: Name
        created_at:
          type: string
          title: Created At
          format: date-time
        memberships:
          title: Memberships
        creator:
          title: Creator
        auto_load:
          type: boolean
          title: Auto Load
        creator_id:
          type: integer
          title: Creator
        shared_with_agent_id:
          type: integer
          title: Shared With Agent
        smart_action_locations:
          type: array
          items:
            enum:
              - task
              - project
              - doc
              - meeting
              - meetings
              - company
              - companies
              - contact
              - contacts
              - email
              - emails
              - deal
              - deals
              - budget
              - budgets
              - expense
              - expenses
              - invoice
              - invoices
              - timetracking
              - company_time
              - approvals
              - resourcing
              - resource_requests
            type: string
          title: Smart Action Locations
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  requestBodies:
    skill:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      auto_load:
                        $ref: '#/components/schemas/resource_skill/properties/auto_load'
                      instructions:
                        $ref: '#/components/schemas/resource_skill/properties/instructions'
                      smart_action_locations:
                        $ref: '#/components/schemas/resource_skill/properties/smart_action_locations'
                      description:
                        $ref: '#/components/schemas/resource_skill/properties/description'
                      name:
                        $ref: '#/components/schemas/resource_skill/properties/name'
                    required:
                      - name
                      - description
