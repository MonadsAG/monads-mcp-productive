    resource_person:
      type: object
      title: Person Resource
      description: A person represents an employee, contractor, contact, or placeholder within the organization.
      properties:
        import:
          title: Import
          description: The data import that created this person, if they were added through an import rather than manually.
          example:
            data:
              type: imports
              id: '1842'
        tags:
          type: string
          title: Tags
          description: Tags applied to this person.
          example:
            eq: value
        accessible_deal_id:
          type: integer
          title: Accessible Deal
          description: Filter by accessible deal ID — returns people who have access to the specified deal.
          example:
            - 123
        accessible_doc_id:
          type: integer
          title: Accessible Doc
          description: Filter by accessible doc ID — returns people who have access to the specified document.
          example:
            - 123
        accessible_filter_id:
          type: string
          title: Accessible Filter
          description: Filter by accessible filter ID — returns people who are members of the specified saved view or filter.
          example:
            - 123
        accessible_project_id:
          type: integer
          title: Accessible Project
          description: Filter by accessible project ID — returns people who have access to the specified project.
          example:
            - 123
        account_id:
          title: Account
          description: The organization (account) ID.
          example:
            - 123
        approval_policy_assignment:
          title: Approval Policy Assignment
          description: The approval policy assignment for this person.
          example:
            eq: value
        approval_policy_id:
          type: integer
          title: Approval Policy
          description: ID of the approval policy assigned to this person for time-off and booking approvals.
          example:
            - 123
        approval_workflow_id:
          type: integer
          title: Approval Workflow
          description: Filter by approval workflow ID — returns people who have approvals in the specified workflow.
          example:
            - 123
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this person was archived, or null if not archived.
          example:
            gt: '2026-01-01'
        autotracking:
          type: boolean
          title: Autotracking
          description: Whether automatic time tracking is enabled for this person.
          example:
            eq: value
        availabilities:
          type: string
          title: Availabilities
          description: The person's work availability windows.
          example:
            eq: value
        avatar_url:
          type: string
          title: Avatar Url
          description: URL of the person's avatar thumbnail.
          example:
            eq: value
        bookings_after:
          type: string
          title: Bookings After
          format: date
          description: Filter by bookings_after date — used with resourcing filters to find people with bookings ending on or after this date.
          example:
            eq: value
        bookings_before:
          type: string
          title: Bookings Before
          format: date
          description: Filter by bookings_before date — used with resourcing filters to find people with bookings starting on or before this date.
          example:
            eq: value
