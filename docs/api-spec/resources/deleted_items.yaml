          type: string
          title: Color
          description: Color identifier used to visually distinguish this person in the UI.
          example:
            - 123
        company:
          title: Company
          description: The company (client) this person belongs to.
          example:
            eq: value
        company_id:
          type: integer
          title: Company
          description: Filter by company (client) ID.
          example:
            - 123
        company_name:
          title: Company Name
          description: The name of the company this person belongs to.
          example:
            eq: value
        contact:
          type: object
          title: Contact
          description: Additional contact data for the person, such as phone numbers and addresses.
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this person was created.
          example:
            gt: '2026-01-01'
        custom_field_attachments:
          title: Custom Field Attachments
          description: File attachments associated with this person via custom fields.
          example:
            gt: '2026-01-01'
