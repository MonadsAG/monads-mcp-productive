        tags:
          type: string
          title: Tags
          description: Tags applied to this task.
          example:
            eq: value
        after:
          type: string
          title: After
          format: date
          description: Return tasks created on or after this date.
          example:
            eq: value
        assignee:
          title: Assignee
          description: The person assigned to this task.
          example:
            eq: value
        assignee_id:
          anyOf:
            - type: string
              pattern: ^[0-9]+$
            - type: integer
