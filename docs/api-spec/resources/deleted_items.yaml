            - 123
        assignee_name:
          title: Assignee Name
          description: Filter by assigned person (also matches open to-do assignees).
          example:
            eq: value
        attachment_ids:
          type: array
          items:
            anyOf:
              - type: string
                pattern: ^[0-9]+$
              - type: integer
          title: Attachment Ids
          description: Files attached to this task.
          example:
            - 123
            - 456
        attachments:
          title: Attachments
          description: Files attached to this task.
          example:
            eq: value
        before:
          type: string
          title: Before
          format: date
          description: Return tasks created on or before this date.
          example:
            eq: value
