                        anyOf:
                          - $ref: '#/components/schemas/resource_invoice_attribution/properties/date_from'
                          - type: 'null'
                        description: The start date of the period this attribution covers.
                      date_to:
                        anyOf:
                          - $ref: '#/components/schemas/resource_invoice_attribution/properties/date_to'
                          - type: 'null'
                        description: The end date of the period this attribution covers.
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Invoice attribution relationships.
                    properties:
                      budget:
                        $ref: '#/components/schemas/_single_relationship'
                      invoice:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      service:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '678'
                type: invoice_attributions
                attributes:
                  amount: '500.00'
                  currency: USD
                  attributed_at: '2026-03-10T12:00:00.000+00:00'
                relationships:
                  invoice:
                    data:
                      type: invoices
                      id: '234'
                  service:
                    data:
                      type: services
