openapi: 3.1.0
info:
  title: Productive.io API – Invoice Attributions
  version: 2.0.0
description: |-
  An invoice attribution object represents a link between a budget and an invoice.

  Following diagram shows invoice attributions in our data hierarchy:

  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  budget: Budget
  invoice1: Invoice
  invoice2: Invoice
  invoice_attribution1: Invoice Attribution {
    class: primary
  }
  invoice_attribution2: Invoice Attribution {
    class: primary
  }

  # Define connections
  budget -> invoice_attribution1
  invoice1 -> invoice_attribution1
  budget -> invoice_attribution2
  invoice2 -> invoice_attribution2
  ```

  ### Related resources
  - [Deals (Budget)](https://developer.productive.io/deals.html#deals)
  - [Invoice](https://developer.productive.io/invoice_attributions.html#invoices)
x-filters:
  invoice_attribution:
    budget_id:
      description: Filter by the associated budget or deal.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    invoice_id:
      description: Filter by the associated invoice.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/invoice_attributions:
    get:
      tags:
        - Invoice Attributions
      summary: Get invoice attributions
      operationId: invoice_attributions-index
      description: List invoice attributions.
      parameters:
        - $ref: '#/components/parameters/filter_invoice_attribution'
        - $ref: '#/components/parameters/sort_invoice_attribution'
      responses:
        '200':
          $ref: '#/components/responses/collection_invoice_attribution'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Invoice Attributions
      summary: Create an invoice attribution
      description: Create a new invoice attribution.
      operationId: invoice_attributions-create
      requestBody:
        $ref: '#/components/requestBodies/invoice_attribution'
      responses:
        '201':
          $ref: '#/components/responses/single_invoice_attribution'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Invoice Attributions
      summary: Update invoice attributions
      description: |
        Bulk only: requires the JSON:API bulk extension headers
        (`Content-Type` and `Accept`: `application/vnd.api+json; ext=bulk`). Send `data` as an array of up to 100
        invoice attributions, each with its `id`. All of them must belong to the same invoice. If any item is invalid,
        nothing is updated and the errors carry the item's position in `meta.bulk_index`.
      operationId: invoice_attributions-update-bulk
      requestBody:
        $ref: '#/components/requestBodies/invoice_attribution_bulk_update'
      responses:
        '200':
          $ref: '#/components/responses/collection_invoice_attribution'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Invoice Attributions
      summary: Delete invoice attributions
      description: |
        Bulk only: requires the JSON:API bulk extension headers
        (`Content-Type` and `Accept`: `application/vnd.api+json; ext=bulk`). Send `data` as an array of up to 100
        `{ id, type: "invoice_attributions" }` items. If any of them can't be found, nothing is deleted and the
        response is 404. Time entries and expenses attributed to the deleted rows are released.
      operationId: invoice_attributions-destroy-bulk
      requestBody:
        $ref: '#/components/requestBodies/invoice_attribution_bulk_delete'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/invoice_attributions/{id}:
    get:
      tags:
        - Invoice Attributions
      summary: Gets an invoice attribution
      operationId: invoice_attributions-show
      description: Retrieve a single invoice attribution.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_invoice_attribution'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Invoice Attributions
      summary: Update an invoice attribution
      operationId: invoice_attributions-update
      description: Update an invoice attribution.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/invoice_attribution_update'
      responses:
        '200':
          $ref: '#/components/responses/single_invoice_attribution'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Invoice Attributions
      summary: Deletes an invoice attribution
      operationId: invoice_attributions-destroy
      description: Delete an invoice attribution.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
