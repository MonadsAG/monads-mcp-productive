openapi: 3.1.0
info:
  title: Productive.io API – E-invoice Identities
  version: 2.0.0
x-filters:
  einvoice_identity:
    company_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/einvoice_identities:
    get:
      tags:
        - E-invoice Identities
      summary: Gets a list of e-invoice identities
      operationId: einvoice_identities-index
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_einvoice_identity'
      responses:
        '200':
          $ref: '#/components/responses/collection_einvoice_identity'
    post:
      tags:
        - E-invoice Identities
      summary: Creates an e-invoice identity
      operationId: einvoice_identities-create
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/einvoice_identity'
      responses:
        '201':
          $ref: '#/components/responses/single_einvoice_identity'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/einvoice_identities/{id}:
    get:
      tags:
        - E-invoice Identities
      summary: Gets an e-invoice identity
      operationId: einvoice_identities-show
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_einvoice_identity'
    patch:
      tags:
        - E-invoice Identities
      summary: Updates an e-invoice identity
      operationId: einvoice_identities-update
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/einvoice_identity'
      responses:
        '200':
          $ref: '#/components/responses/single_einvoice_identity'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
