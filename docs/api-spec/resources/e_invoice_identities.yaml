                        $ref: '#/components/schemas/resource_einvoice_identity/properties/subsidiary_id'
                      dire_code:
                        $ref: '#/components/schemas/resource_einvoice_identity/properties/dire_code'
                      dir3_fiscal_code:
                        $ref: '#/components/schemas/resource_einvoice_identity/properties/dir3_fiscal_code'
                      peppol_id:
                        $ref: '#/components/schemas/resource_einvoice_identity/properties/peppol_id'
                      is_government_entity:
                        $ref: '#/components/schemas/resource_einvoice_identity/properties/is_government_entity'
                      dir3_pagador_code:
                        $ref: '#/components/schemas/resource_einvoice_identity/properties/dir3_pagador_code'
                      company_id:
                        $ref: '#/components/schemas/resource_einvoice_identity/properties/company_id'
                    example:
                      company_id: '89'
                      peppol_id: 0088:1234567890123
                example:
                  type: einvoice_identities
                  attributes:
                    company_id: '89'
                    peppol_id: 0088:1234567890123
            example:
              data:
                type: einvoice_identities
                attributes:
                  company_id: '89'
                  peppol_id: 0088:1234567890123
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_einvoice_identity:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.einvoice_identity at the top of this file.
      required: false
