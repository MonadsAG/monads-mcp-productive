                      company:
                        data:
                          type: companies
                          id: '89'
                  attributes:
                    type: object
                    properties:
                      peppol_id:
                        $ref: '#/components/schemas/resource_einvoice_identity/properties/peppol_id'
                      dir3_fiscal_code:
                        $ref: '#/components/schemas/resource_einvoice_identity/properties/dir3_fiscal_code'
                      dir3_receptor_code:
                        $ref: '#/components/schemas/resource_einvoice_identity/properties/dir3_receptor_code'
                      is_government_entity:
                        $ref: '#/components/schemas/resource_einvoice_identity/properties/is_government_entity'
                      updated_at:
                        $ref: '#/components/schemas/resource_einvoice_identity/properties/updated_at'
                      created_at:
                        $ref: '#/components/schemas/resource_einvoice_identity/properties/created_at'
                      buyer_reference:
                        $ref: '#/components/schemas/resource_einvoice_identity/properties/buyer_reference'
                      dire_code:
                        $ref: '#/components/schemas/resource_einvoice_identity/properties/dire_code'
                      dir3_pagador_code:
                        $ref: '#/components/schemas/resource_einvoice_identity/properties/dir3_pagador_code'
                    example:
                      peppol_id: 0088:1234567890123
                      buyer_reference: BUYER-REF-001
                      dir3_fiscal_code: null
                      dir3_pagador_code: null
                      dir3_receptor_code: null
                      dire_code: null
                      is_government_entity: false
                      created_at: '2025-04-10T08:15:00.000Z'
                      updated_at: '2025-04-10T08:15:00.000Z'
                example:
                  data:
                    id: '567'
                    type: einvoice_identities
                    attributes:
                      peppol_id: 0088:1234567890123
                      buyer_reference: BUYER-REF-001
                      dir3_fiscal_code: null
                      dir3_pagador_code: null
                      dir3_receptor_code: null
                      dire_code: null
                      is_government_entity: false
                      created_at: '2025-04-10T08:15:00.000Z'
                      updated_at: '2025-04-10T08:15:00.000Z'
                    relationships:
                      company:
                        data:
                          type: companies
                          id: '89'
              included:
                type: array
                items:
                  example: []
                example: []
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '567'
                type: einvoice_identities
                attributes:
                  peppol_id: 0088:1234567890123
                  buyer_reference: BUYER-REF-001
                  dir3_fiscal_code: null
                  dir3_pagador_code: null
                  dir3_receptor_code: null
                  dire_code: null
                  is_government_entity: false
                  created_at: '2025-04-10T08:15:00.000Z'
                  updated_at: '2025-04-10T08:15:00.000Z'
                relationships:
                  company:
                    data:
                      type: companies
                      id: '89'
      description: Single einvoice identity
    collection_einvoice_identity:
