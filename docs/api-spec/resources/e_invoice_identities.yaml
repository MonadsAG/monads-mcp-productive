      description: Collection of einvoice identities
  schemas:
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    resource_einvoice_identity:
      type: object
      title: E-invoice Identity Resource
      properties:
        subsidiary_id:
          type: integer
          title: Subsidiary
          example: '42'
        peppol_id:
          type: string
          title: Peppol Id
          example: 0088:1234567890123
        dir3_fiscal_code:
          type: string
          title: Dir3 Fiscal Code
          example: A01234567
        created_at:
          type: string
          title: Created At
          format: date-time
          example: '2025-03-15T10:30:00.000Z'
        dir3_receptor_code:
          type: string
          title: Dir3 Receptor Code
          example: L01234567
        subsidiary:
          title: Subsidiary
          example:
            data:
              type: subsidiaries
              id: '42'
        dir3_pagador_code:
          type: string
          title: Dir3 Pagador Code
          example: P00000010
        updated_at:
          type: string
          title: Updated At
          format: date-time
          example: '2025-06-01T14:22:00.000Z'
        is_government_entity:
          type: boolean
          title: Is Government Entity
          example: false
        dire_code:
          type: string
          title: Dire Code
          example: DIR3-EXAMPLE
        buyer_reference:
          type: string
          title: Buyer Reference
          example: BUYER-REF-001
        company:
          title: Company
          example:
            data:
              type: companies
              id: '89'
        company_id:
          type: integer
          title: Company
          example: '89'
      example:
        id: '567'
        type: einvoice_identities
        attributes:
          peppol_id: 0088:1234567890123
          buyer_reference: BUYER-REF-001
          dir3_fiscal_code: null
          dir3_pagador_code: null
          dir3_receptor_code: null
          dire_code: null
          is_government_entity: false
          created_at: '2025-04-10T08:15:00.000Z'
          updated_at: '2025-04-10T08:15:00.000Z'
        relationships:
          company:
            data:
              type: companies
              id: '89'
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
  requestBodies:
    einvoice_identity:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
