openapi: 3.1.0
info:
  title: Productive.io API – Boards
  version: 2.0.0
description: |-
  The Board object represents a board within the project management system. It sits between Projects and Task lists, meaning it belongs to a project and contains multiple task lists.

  In the application, `boards` are currently referred to as `folders`.

  You can find out more about boards in our Help documentation: [Boards](https://help.productive.io/en/articles/2179655-multiple-boards)

  Following diagram shows boards in our data hierarchy:

  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  project: Project
  board: Board {
    class: primary
  }
  task_list: Task list
  task: Task
  comments: Comments
  subtasks: Subtasks
  todos: Todos

  # define connections
  project -> board -> task_list -> task
  task -> comments
  task -> subtasks
  task -> todos
  ```
x-filters:
  board:
    status:
      description: Filter by active/archived status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Search boards by name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by board ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/boards/{id}/archive:
    patch:
      tags:
        - Boards
      summary: Archives a board
      operationId: boards-archive-archive
      description: Archive a board.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_board'
  /api/v2/boards/copy:
    post:
      tags:
        - Boards
      summary: Copy a board
      operationId: boards-copy-copy
      description: Copy a board.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_board'
        '201':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Created
  /api/v2/boards:
    get:
      tags:
        - Boards
      summary: Get boards
      operationId: boards-index
      description: List boards with optional filters and pagination.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_board'
        - $ref: '#/components/parameters/sort_board'
      responses:
        '200':
          $ref: '#/components/responses/collection_board'
    post:
      tags:
        - Boards
      summary: Create a board
      operationId: boards-create
      description: Create a new board.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/board'
      responses:
        '201':
          $ref: '#/components/responses/single_board'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/boards/{id}/move:
    patch:
      tags:
        - Boards
      summary: Move a board
      operationId: boards-move-move
      description: Move a board.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_board'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/boards/{id}/reposition:
    patch:
      tags:
        - Boards
      summary: Repoisition a board
      operationId: boards-reposition-reposition
      description: Reposition a board.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_board'
  /api/v2/boards/{id}/restore:
    patch:
      tags:
        - Boards
      summary: Restores a board
      operationId: boards-restore-restore
      description: Restore a board.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_board'
  /api/v2/boards/{id}:
    get:
      tags:
        - Boards
      summary: Gets a board
      operationId: boards-show
      description: Retrieve a single board by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_board'
    patch:
      tags:
        - Boards
      summary: Update a board
      operationId: boards-update
      description: Update a board.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/board'
      responses:
        '200':
          $ref: '#/components/responses/single_board'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
components:
  responses:
    single_board:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single board (task list) record in JSON:API format.
            properties:
              meta:
                $ref: '#/components/schemas/_meta'
              data:
                type: object
                description: The JSON:API data object for the returned board resource.
                properties:
                  attributes:
                    type: object
                    description: Board attributes.
                    properties:
                      hidden:
                        $ref: '#/components/schemas/resource_board/properties/hidden'
                      position:
                        $ref: '#/components/schemas/resource_board/properties/position'
                      archived_at:
                        $ref: '#/components/schemas/resource_board/properties/archived_at'
                      name:
                        $ref: '#/components/schemas/resource_board/properties/name'
                      placement:
                        $ref: '#/components/schemas/resource_board/properties/placement'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Board relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      project:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                id: '456'
                type: boards
                attributes:
                  name: Kanban Board
                  position: 1
                  placement: 1000000
                  archived_at: null
                  hidden: false
                relationships:
                  project:
                    data:
                      type: projects
                      id: '6899'
              included: []
      description: Single board
    collection_board:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of board records in JSON:API format.
            properties:
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              data:
                type: array
                items:
                  type: object
                  description: A board resource object.
                  properties:
                    attributes:
                      type: object
                      description: Board attributes.
                      properties:
                        archived_at:
                          $ref: '#/components/schemas/resource_board/properties/archived_at'
                        hidden:
                          $ref: '#/components/schemas/resource_board/properties/hidden'
                        placement:
                          $ref: '#/components/schemas/resource_board/properties/placement'
                        position:
                          $ref: '#/components/schemas/resource_board/properties/position'
                        name:
                          $ref: '#/components/schemas/resource_board/properties/name'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Board relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        project:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of board resource objects.
                example:
                  eq: value
            example:
              data:
                - id: '456'
                  type: boards
                  attributes:
                    name: Kanban Board
                    position: 1
                    placement: 1000000
                    archived_at: null
                    hidden: false
                  relationships:
                    project:
                      data:
                        type: projects
                        id: '6899'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection board
  schemas:
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    resource_board:
      type: object
      title: Board Resource
      description: Folder (called Board internally) grouping task lists within a project. Supports name, position ordering, placement (top or bottom), archiving, and hidden visibility. Used to organize task lists into phases or sprints.
      properties:
        project:
          title: Project
          description: The project this folder belongs to.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this folder belongs to.
          example:
            eq: value
        placement:
          type: integer
          title: Placement
          description: Indicates the folder's placement context (e.g. project or global).
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: Unique identifier for the folder.
          example:
            - 123
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
          description: The current status of the folder (e.g. active or archived).
          example:
            eq: active
        position:
          type: integer
          title: Position
          description: The display order position of this folder within its project.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The display name of the folder.
          example:
            eq: value
        hidden:
          type: boolean
          title: Hidden
          description: When true, this folder is hidden from members who do not have explicit access.
          example:
            eq: value
        project_id:
          type: integer
          title: Project
          description: The ID of the project this folder belongs to.
          example:
            - 123
        query:
          type: string
          title: Query
          description: A saved filter query string applied to this folder view.
          example:
            eq: value
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when the folder was archived, or null if active.
          example:
            gt: '2026-01-01'
      example:
        id: '5522'
        type: boards
        attributes:
          name: Features
          position: 3
          placement: 1030000
          archived_at: null
          hidden: false
        relationships:
          organization:
            data:
              type: organizations
              id: '109'
          project:
            meta:
              included: false
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  requestBodies:
    board:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a board.
            properties:
              data:
                type: object
                description: The JSON:API data object containing the board resource attributes and relationships.
                properties:
                  attributes:
                    type: object
                    description: Board attributes.
                    properties:
                      project_id:
                        $ref: '#/components/schemas/resource_board/properties/project_id'
                      hidden:
                        $ref: '#/components/schemas/resource_board/properties/hidden'
                      position:
                        $ref: '#/components/schemas/resource_board/properties/position'
                      name:
                        $ref: '#/components/schemas/resource_board/properties/name'
                    required:
                      - name
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: boards
                attributes:
                  name: Kanban Board
                relationships:
                  project:
                    data:
                      type: projects
                      id: '6899'
      description: Request body for creating or updating a board (folder). Specify the project, name, position, placement (top or bottom), and optional archived status or hidden flag.
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_board:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort board
      explode: false
      required: false
      description: Sort board
    filter_board:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.board at the top of this file.
      required: false
      description: Filters
