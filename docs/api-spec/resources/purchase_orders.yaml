  requestBodies:
    purchase_order_send:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: JSON:API envelope for the send-email payload.
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    description: Email attributes (recipients, subject, body, attachments).
                    properties:
                      attachment_ids:
                        type: array
                        items:
                          type: integer
                          example: 89012
                        title: Attachment IDs
                        description: Attachment IDs to include with the email.
                        example:
                          - 89012
                          - 89013
                      bcc:
                        type: array
                        items:
                          type: string
                          example: recipient@example.com
                        title: BCC
                        description: List of BCC recipient email addresses.
                        example: []
                      body:
                        type: string
                        title: Body
                        description: Email body.
                        example: |-
                          Hello,

                          Please find the attached purchase order.

                          Best regards.
                      cc:
                        type: array
                        items:
                          type: string
                          example: finance@example.com
                        title: CC
                        description: List of CC recipient email addresses.
                        example:
                          - finance@example.com
                      from:
                        type: string
                        title: From
                        description: Sender email address. Must belong to a connected email integration account.
                        example: buyer@example.com
                      subject:
                        type: string
                        title: Subject
                        description: Short title or reference shown at the top of the purchase order document.
                        example: Purchase Order PO-2024-017
                      to:
                        type: array
                        items:
                          type: string
                          example: vendor@example.com
                        title: To
                        description: List of recipient email addresses. At least one is required.
                        example:
                          - vendor@example.com
                    required:
                      - to
                      - subject
                      - body
                    example:
                      to:
                        - vendor@example.com
                      subject: Purchase Order PO-2024-017
                      body: |-
                        Hello,

                        Please find the attached purchase order.

                        Best regards.
                example:
                  type: purchase_orders
                  attributes:
                    to:
                      - vendor@example.com
                    subject: Purchase Order PO-2024-017
                    body: |-
                      Hello,

                      Please find the attached purchase order.

                      Best regards.
            example:
              data:
                type: purchase_orders
                attributes:
                  to:
                    - vendor@example.com
                  subject: Purchase Order PO-2024-017
                  body: |-
                    Hello,

                    Please find the attached purchase order.

                    Best regards.
      description: Payload for sending a purchase order to the vendor via email. On success the purchase order is marked as sent today.
    purchase_order_export:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: JSON:API envelope for the Xero export payload.
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    description: Xero-specific attributes used when exporting the purchase order.
                    properties:
                      company_reference_id:
                        type: string
                        title: Company Reference ID
                        description: Identifier of the Xero contact the purchase order is linked to.
                        example: xero-contact-xyz
                      xero_status_id:
                        type: integer
                        title: Xero Status
                        description: Xero-side status to apply to the exported purchase order.
                        example: 1
                    example:
                      company_reference_id: xero-contact-xyz
                      xero_status_id: 1
                example:
                  type: purchase_orders
                  attributes:
                    company_reference_id: xero-contact-xyz
                    xero_status_id: 1
            example:
              data:
                type: purchase_orders
                attributes:
                  company_reference_id: xero-contact-xyz
                  xero_status_id: 1
      description: Payload for exporting a purchase order to a connected Xero accounting integration.
    purchase_order:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a purchase order.
            properties:
              data:
                type: object
                description: The purchase order resource object.
                properties:
                  attributes:
                    type: object
                    description: Purchase order attributes.
                    properties:
                      attachment_id:
                        $ref: '#/components/schemas/resource_purchase_order/properties/attachment_id'
                      currency:
                        $ref: '#/components/schemas/resource_purchase_order/properties/currency'
                      deal_id:
                        $ref: '#/components/schemas/resource_purchase_order/properties/deal_id'
                      delivery_on:
                        $ref: '#/components/schemas/resource_purchase_order/properties/delivery_on'
                      document_type_id:
                        $ref: '#/components/schemas/resource_purchase_order/properties/document_type_id'
                      issued_on:
                        $ref: '#/components/schemas/resource_purchase_order/properties/issued_on'
                      note:
                        $ref: '#/components/schemas/resource_purchase_order/properties/note'
                      sent_on:
                        $ref: '#/components/schemas/resource_purchase_order/properties/sent_on'
                      status_id:
                        $ref: '#/components/schemas/resource_purchase_order/properties/status_id'
                      subject:
                        $ref: '#/components/schemas/resource_purchase_order/properties/subject'
                      subscriber_ids:
                        $ref: '#/components/schemas/resource_purchase_order/properties/subscriber_ids'
                      vendor_id:
                        $ref: '#/components/schemas/resource_purchase_order/properties/vendor_id'
                    required:
                      - currency
                      - issued_on
                    example:
                      subject: Purchase Order PO-2024-017
                      status_id: 1
                      currency: USD
                      deal_id: 456789
                      vendor_id: 234567
                      issued_on: '2026-04-10'
                      delivery_on: '2026-04-17'
                      sent_on: '2026-04-10'
                      note: Please confirm delivery date for the attached items.
                      subscriber_ids:
                        - 345678
                        - 456789
                      attachment_id: 89012
                      document_type_id: 12
                example:
                  type: purchase_orders
                  attributes:
                    subject: Purchase Order PO-2024-017
                    status_id: 1
                    currency: USD
                    deal_id: 456789
                    vendor_id: 234567
                    issued_on: '2026-04-10'
                    delivery_on: '2026-04-17'
                    sent_on: '2026-04-10'
                    note: Please confirm delivery date for the attached items.
                    subscriber_ids:
                      - 345678
                      - 456789
                    attachment_id: 89012
                    document_type_id: 12
            example:
              data:
                type: purchase_orders
                attributes:
                  subject: Purchase Order PO-2024-017
                  status_id: 1
                  currency: USD
                  deal_id: 456789
                  vendor_id: 234567
                  issued_on: '2026-04-10'
                  delivery_on: '2026-04-17'
                  sent_on: '2026-04-10'
                  note: Please confirm delivery date for the attached items.
                  subscriber_ids:
                    - 345678
                    - 456789
                  attachment_id: 89012
                  document_type_id: 12
      description: Request body for creating or updating a purchase order. Specify the vendor company, deal (budget), document type, subject, status, dates, currency, note, and footer. Line items (expenses) are managed via associated bill records.
    purchase_order_copy:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: JSON:API envelope for the copy payload.
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    description: Attributes controlling where and from which template to copy the purchase order.
                    properties:
                      deal_id:
                        $ref: '#/components/schemas/resource_purchase_order/properties/deal_id'
                      template_id:
                        type: integer
                        title: Template
                        description: ID of the source purchase order to copy from.
                        example: 7890
                    required:
                      - template_id
                      - deal_id
                    example:
                      template_id: 7890
                      deal_id: 456789
                example:
                  type: purchase_orders
                  attributes:
                    template_id: 7890
                    deal_id: 456789
            example:
              data:
                type: purchase_orders
                attributes:
                  template_id: 7890
                  deal_id: 456789
      description: Payload for copying an existing purchase order onto a target deal. Requires `template_id` and `deal_id`.
