openapi: 3.1.0
info:
  title: Productive.io API – Purchase Orders
  version: 2.0.0
description: |-
  In Productive purchase orders are documents that serve as a buyer's request to a seller to order goods or services.
  You can find out more about purchase orders in our Help documentation: [Purchase Orders](https://help.productive.io/en/articles/8266926-purchase-orders)

  Purchase Orders always belong to a budget and a vendor (seller). They can have multiple expenses, bills and bill items.

  Following diagram shows services in our data hierarchy:

  ```d2
  ...@template
  *: {
    class: default
  }

  # Define actors
  budget: Budget
  purchase_order: Purchase Order {
    class: primary
  }
  expense: Expense
  bill: Bill
  bill_item: Bill Item

  # define connections
  budget -> purchase_order -> expense -> bill_item
  purchase_order -> bill -> bill_item
  ```

  The enumeration `status_id` can be:
  - 1 (Draft)
  - 2 (Finalized)

  The enumeration `payment_status_id` can be:
  - 1 (Not received)
  - 2 (Partially received)
  - 3 (Fully received)
x-filters:
  purchase_order:
    created_at:
      description: Filter by creation timestamp.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who created the purchase order.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      description: Filter by the parent deal (budget) the purchase order belongs to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    delivery_on:
      description: Filter by expected delivery date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by purchase order ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    issued_on:
      description: Filter by issue date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    number:
      description: Filter by the human-readable purchase order number.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    payment_status_id:
      description: Filter by payment status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the project the parent deal belongs to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Free-text search across the purchase order number and quick-search terms.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    received_on:
      description: Filter by the date goods or services were received.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    sent_on:
      description: Filter by the date the purchase order was sent.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    sent_status:
      description: Filter by whether the purchase order has been sent. One of `sent` or `not_sent`.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status_id:
      description: Filter by purchase order status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    total_cost:
      description: Filter by pre-tax total amount.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    total_cost_with_tax:
      description: Filter by total amount including tax.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    total_received:
      description: Filter by amount already received.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    vendor_id:
      description: Filter by the vendor company fulfilling the purchase order.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/purchase_orders/copy:
    post:
      tags:
        - Purchase Orders
      summary: Copies a purchase order
      operationId: purchase_orders-copy-copy
      description: Copy an existing purchase order.
      requestBody:
        $ref: '#/components/requestBodies/purchase_order_copy'
      responses:
        '201':
          $ref: '#/components/responses/single_purchase_order'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_purchase_order'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/purchase_orders:
    get:
      tags:
        - Purchase Orders
      summary: Get purchase orders
      operationId: purchase_orders-index
      description: Lists purchase orders in the current account with pagination, filtering, sorting, and sparse fieldsets. Returns a JSON:API collection of `purchase_orders` resources.
      parameters:
        - $ref: '#/components/parameters/filter_purchase_order'
        - $ref: '#/components/parameters/sort_purchase_order'
      responses:
        '200':
          $ref: '#/components/responses/collection_purchase_order'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Purchase Orders
      summary: Create a purchase order
      operationId: purchase_orders-create
      description: Create a new purchase order.
      requestBody:
        $ref: '#/components/requestBodies/purchase_order'
      responses:
