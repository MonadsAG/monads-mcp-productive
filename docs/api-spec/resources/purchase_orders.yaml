openapi: 3.1.0
info:
  title: Productive.io API – Purchase Orders
  version: 2.0.0
description: |-
  In Productive purchase orders are documents that serve as a buyer's request to a seller to order goods or services.
  You can find out more about purchase orders in our Help documentation: [Purchase Orders](https://help.productive.io/en/articles/8266926-purchase-orders)

  Purchase Orders always belong to a budget and a vendor (seller). They can have multiple expenses, bills and bill items.

  Following diagram shows services in our data hierarchy:

  ```d2
  ...@template
  *: {
    class: default
  }

  # Define actors
  budget: Budget
  purchase_order: Purchase Order {
    class: primary
  }
  expense: Expense
  bill: Bill
  bill_item: Bill Item

  # define connections
  budget -> purchase_order -> expense -> bill_item
  purchase_order -> bill -> bill_item
  ```

  The enumeration `status_id` can be:
  - 1 (Draft)
  - 2 (Finalized)

  The enumeration `payment_status_id` can be:
  - 1 (Not received)
  - 2 (Partially received)
  - 3 (Fully received)
x-filters:
  purchase_order:
    status_id:
      description: Filter by purchase order status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      description: Filter by the parent deal (budget) the purchase order belongs to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    sent_on:
      description: Filter by the date the purchase order was sent.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who created the purchase order.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filter by creation timestamp.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    received_on:
      description: Filter by the date goods or services were received.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    total_cost_with_tax:
      description: Filter by total amount including tax.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    sent_status:
      description: Filter by whether the purchase order has been sent. One of `sent` or `not_sent`.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    delivery_on:
      description: Filter by expected delivery date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    number:
      description: Filter by the human-readable purchase order number.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Free-text search across the purchase order number and quick-search terms.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    payment_status_id:
      description: Filter by payment status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    total_cost:
      description: Filter by pre-tax total amount.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    total_received:
      description: Filter by amount already received.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    issued_on:
      description: Filter by issue date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    vendor_id:
      description: Filter by the vendor company fulfilling the purchase order.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by purchase order ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the project the parent deal belongs to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/purchase_orders/copy:
    post:
      tags:
        - Purchase Orders
      summary: Copies a purchase order
      responses:
        '200':
          $ref: '#/components/responses/single_purchase_order'
        '201':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Created
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: purchase_orders-copy-copy
      requestBody:
        $ref: '#/components/requestBodies/purchase_order_copy'
      description: Copy an existing purchase order.
  /api/v2/purchase_orders:
    get:
      tags:
        - Purchase Orders
      summary: Get purchase orders
      responses:
        '200':
          $ref: '#/components/responses/collection_purchase_order'
      parameters:
        - $ref: '#/components/parameters/filter_purchase_order'
        - $ref: '#/components/parameters/sort_purchase_order'
        - $ref: '#/components/parameters/header_organization'
      operationId: purchase_orders-index
      description: Lists purchase orders in the current account with pagination, filtering, sorting, and sparse fieldsets. Returns a JSON:API collection of `purchase_orders` resources.
    post:
      tags:
        - Purchase Orders
      summary: Create a purchase order
      responses:
        '201':
          $ref: '#/components/responses/single_purchase_order'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: purchase_orders-create
      requestBody:
        $ref: '#/components/requestBodies/purchase_order'
      description: Create a new purchase order.
  /api/v2/purchase_orders/{id}:
    get:
      tags:
        - Purchase Orders
      summary: Gets a purchase order
      responses:
        '200':
          $ref: '#/components/responses/single_purchase_order'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: purchase_orders-show
      description: Retrieve a single purchase order by ID.
    patch:
      tags:
        - Purchase Orders
      summary: Update a purchase order
      responses:
        '200':
          $ref: '#/components/responses/single_purchase_order'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: purchase_orders-update
      requestBody:
        $ref: '#/components/requestBodies/purchase_order'
      description: Update a purchase order.
    delete:
      tags:
        - Purchase Orders
      summary: Deletes a purchase order
      responses:
        '204':
          description: No Content
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: purchase_orders-destroy
      description: Delete a purchase order by ID.
  /api/v2/purchase_orders/{id}/export:
    patch:
      tags:
        - Purchase Orders
      summary: Exports a purchase order
      responses:
        '200':
          $ref: '#/components/responses/single_purchase_order'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: purchase_orders-export-export
      requestBody:
        $ref: '#/components/requestBodies/purchase_order_export'
      description: Export a purchase order to an external format.
  /api/v2/purchase_orders/{id}/export_update:
    patch:
      tags:
        - Purchase Orders
      summary: Updates exported purchase order
      responses:
        '200':
          $ref: '#/components/responses/single_purchase_order'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: purchase_orders-export_update-export_update
      requestBody:
        $ref: '#/components/requestBodies/purchase_order_export'
      description: Update the export status of a purchase order.
  /api/v2/purchase_orders/{id}/send:
    patch:
      tags:
        - Purchase Orders
      summary: Sends a purchase order
      responses:
        '200':
          $ref: '#/components/responses/single_purchase_order'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: purchase_orders-send-send_mail
      requestBody:
        $ref: '#/components/requestBodies/purchase_order_send'
      description: Send a purchase order to a vendor.
components:
  requestBodies:
    purchase_order_send:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - to
                      - subject
                      - body
                    properties:
                      cc:
                        type: array
                        items:
                          type: string
                        title: CC
                      to:
                        type: array
                        items:
                          type: string
                        title: To
                      bcc:
                        type: array
                        items:
                          type: string
                        title: BCC
                      body:
                        type: string
                        title: Body
                      from:
                        type: string
                        title: From
                      subject:
                        type: string
                        title: Subject
                      attachment_ids:
                        type: array
                        items:
                          type: integer
                        title: Attachment IDs
      description: Payload for sending a purchase order to the vendor via email. On success the purchase order is marked as sent today.
    purchase_order_export:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      xero_status_id:
                        type: integer
                        title: Xero Status
                      company_reference_id:
                        type: string
                        title: Company Reference ID
      description: Payload for exporting a purchase order to a connected Xero accounting integration.
    purchase_order:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - currency
                      - issued_on
                    properties:
                      note:
                        $ref: '#/components/schemas/resource_purchase_order/properties/note'
                      deal_id:
                        $ref: '#/components/schemas/resource_purchase_order/properties/deal_id'
                      sent_on:
                        $ref: '#/components/schemas/resource_purchase_order/properties/sent_on'
                      subject:
                        $ref: '#/components/schemas/resource_purchase_order/properties/subject'
                      currency:
                        $ref: '#/components/schemas/resource_purchase_order/properties/currency'
                      issued_on:
                        $ref: '#/components/schemas/resource_purchase_order/properties/issued_on'
                      status_id:
                        $ref: '#/components/schemas/resource_purchase_order/properties/status_id'
                      vendor_id:
                        $ref: '#/components/schemas/resource_purchase_order/properties/vendor_id'
                      delivery_on:
                        $ref: '#/components/schemas/resource_purchase_order/properties/delivery_on'
                      attachment_id:
                        $ref: '#/components/schemas/resource_purchase_order/properties/attachment_id'
                      subscriber_ids:
                        $ref: '#/components/schemas/resource_purchase_order/properties/subscriber_ids'
                      document_type_id:
                        $ref: '#/components/schemas/resource_purchase_order/properties/document_type_id'
      description: Request body for creating or updating a purchase order. Specify the vendor company, deal (budget), document type, subject, status, dates, currency, note, and footer. Line items (expenses) are managed via associated bill records.
    purchase_order_copy:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - template_id
                      - deal_id
                    properties:
                      deal_id:
                        $ref: '#/components/schemas/resource_purchase_order/properties/deal_id'
                      template_id:
                        type: integer
                        title: Template
      description: Payload for copying an existing purchase order onto a target deal. Requires `template_id` and `deal_id`.
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_purchase_order:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - created_at
            - -created_at
            - deal_id
            - -deal_id
            - deal_name
            - -deal_name
            - delivery_on
            - -delivery_on
            - id
            - -id
            - issued_on
            - -issued_on
            - number
            - -number
            - payment_status_id
            - -payment_status_id
            - received_on
            - -received_on
            - sent_on
            - -sent_on
            - status_id
            - -status_id
            - total_cost
            - -total_cost
            - total_cost_with_tax
            - -total_cost_with_tax
            - total_received
            - -total_received
            - vendor_id
            - -vendor_id
          type: string
        title: Sort purchase order
      explode: false
      required: false
      description: JSON:API `sort` query parameter for the purchase orders collection. Comma-separated list of sort keys — prefix with `-` for descending.
    filter_purchase_order:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.purchase_order at the top of this file.
      required: false
      description: JSON:API `filter` query parameter for the purchase orders collection. Accepts a nested object keyed by field name and operator (`eq`, `not_eq`, `contains`, `not_contain`, `gt`, `lt`, …).
  responses:
    single_purchase_order:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
