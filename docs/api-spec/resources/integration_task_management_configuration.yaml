openapi: 3.1.0
info:
  title: Productive.io API – Integration Task Management Configuration
  version: 2.0.0
x-filters:
  integration_task_management_configuration:
    project_id:
      operators:
        - eq
        - not_eq
    deal_id:
      operators:
        - eq
        - not_eq
    integration_id:
      operators:
        - eq
        - not_eq
paths:
  /api/v2/integration_task_management_configurations:
    get:
      tags:
        - Integration Task Management Configuration
      summary: Get integration task management configurations
      responses:
        '200':
          $ref: '#/components/responses/collection_integration_task_management_configuration'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_integration_task_management_configuration'
        - $ref: '#/components/parameters/sort_integration_task_management_configuration'
      operationId: integration_task_management_configurations-index
    post:
      tags:
        - Integration Task Management Configuration
      summary: Create integration task management configuration
      responses:
        '201':
          $ref: '#/components/responses/single_integration_task_management_configuration'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: integration_task_management_configurations-create
      requestBody:
        $ref: '#/components/requestBodies/integration_task_management_configuration'
  /api/v2/integration_task_management_configurations/{id}:
    get:
      tags:
        - Integration Task Management Configuration
      summary: Get integration task management configuration
      responses:
        '200':
          $ref: '#/components/responses/single_integration_task_management_configuration'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - $ref: '#/components/parameters/header_organization'
      operationId: integration_task_management_configurations-show
    patch:
      tags:
        - Integration Task Management Configuration
      summary: Update integration task management configuration
      responses:
        '200':
          $ref: '#/components/responses/single_integration_task_management_configuration'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
      operationId: integration_task_management_configurations-update
      requestBody:
        $ref: '#/components/requestBodies/integration_task_management_configuration_update'
    delete:
      tags:
        - Integration Task Management Configuration
      summary: Delete integration task management configuration
      responses:
        '204':
          description: No Content
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - $ref: '#/components/parameters/header_organization'
      operationId: integration_task_management_configurations-destroy
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_integration_task_management_configuration:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - id
            - -id
            - project_id
            - -project_id
            - deal_id
            - -deal_id
            - created_at
            - -created_at
          type: string
        title: Sort integration task management configuration
      explode: false
      required: false
    filter_integration_task_management_configuration:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.integration_task_management_configuration at the top of this file.
      required: false
  requestBodies:
    integration_task_management_configuration_update:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      jira_board:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_board'
                      jira_project:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_project'
                      jira_screens:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_screens'
                      default_person_id:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/default_person_id'
                      default_service_id:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/default_service_id'
                      jira_hierarchy_resolution_enabled:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_hierarchy_resolution_enabled'
                    description: The integration, project and deal references are immutable — re-anchoring a configuration is a destroy + create.
    integration_task_management_configuration:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - integration_id
                      - jira_project
                    properties:
                      deal_id:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/deal_id'
                      jira_board:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_board'
                      project_id:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/project_id'
                      jira_project:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_project'
                      jira_screens:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_screens'
                      integration_id:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/integration_id'
                      default_person_id:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/default_person_id'
                      default_service_id:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/default_service_id'
                      jira_hierarchy_resolution_enabled:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_hierarchy_resolution_enabled'
                    description: Exactly one of project_id or deal_id must be provided as the configuration anchor.
  schemas:
    resource_integration_task_management_configuration:
      type: object
      title: Integration task management configuration Resource
      properties:
        jira_hierarchy_resolution_enabled:
          type: boolean
          title: Jira Hierarchy Resolution Enabled
        jira_screens:
          type: array
          items:
            type: string
          title: Jira Screens
        project:
          title: Project
        integration:
          title: Integration
        default_person_id:
          type: integer
          title: Default Person
        integration_id:
          type: integer
          title: Integration
        created_at:
          title: Created At
        jira_board:
          type: string
          title: Jira Board
        jira_project:
          type: string
          title: Jira Project
        default_service_id:
          type: integer
          title: Default Service
        default_service:
          title: Default Service
        id:
          type: integer
          title: Id
        deal_id:
          type: integer
          title: Deal
        jira_project_name:
          type: string
          title: Jira Project Name
        project_id:
          type: integer
          title: Project
        organization:
          title: Organization
        deal:
          title: Deal
        default_person:
          title: Default Person
        jira_board_name:
          type: string
          title: Jira Board Name
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  responses:
    single_integration_task_management_configuration:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      jira_board:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_board'
                      jira_project:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_project'
                      jira_screens:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_screens'
                      jira_board_name:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_board_name'
                      jira_project_name:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_project_name'
                      jira_hierarchy_resolution_enabled:
                        $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_hierarchy_resolution_enabled'
                  relationships:
                    type: object
                    properties:
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      project:
                        $ref: '#/components/schemas/_single_relationship'
                      integration:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      default_person:
                        $ref: '#/components/schemas/_single_relationship'
                      default_service:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single integration task management configuration
    collection_integration_task_management_configuration:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        jira_board:
                          $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_board'
                        jira_project:
                          $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_project'
                        jira_screens:
                          $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_screens'
                        jira_board_name:
                          $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_board_name'
                        jira_project_name:
                          $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_project_name'
                        jira_hierarchy_resolution_enabled:
                          $ref: '#/components/schemas/resource_integration_task_management_configuration/properties/jira_hierarchy_resolution_enabled'
                    relationships:
                      type: object
                      properties:
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        project:
                          $ref: '#/components/schemas/_single_relationship'
                        integration:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        default_person:
                          $ref: '#/components/schemas/_single_relationship'
                        default_service:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection of integration task management configurations
