openapi: 3.1.0
info:
  title: Productive.io API – Comments
  version: 2.0.0
description: Comments on tasks, deals, companies, persons, pages, projects, purchase orders, and invoices. Supports rich text with @mentions, emoji reactions, pinning, and edit history. Comments appear in the activity feed of the parent resource.
x-filters:
  comment:
    budget_status:
      description: Filter comments by budget status (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by client company (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    discussion_id:
      description: Filter by the associated discussion.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    draft:
      description: Filter to include only draft comments.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    full_query:
      description: Full-text search across comment content.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    fuzzy_dates:
      description: Filter by fuzzy date range (relative date expression).
      operators:
        - eq
        - not_eq
    fuzzy_people:
      description: Filter by person using fuzzy matching.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    jump_query:
      description: Jump (prefix) full-text search across comment content.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    page_id:
      description: Filter by the associated document page.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_type:
      description: Filter by person type (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project (via task).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    public_access:
      description: Filter by public access setting (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    responsible_id:
      description: Filter by the person responsible (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    role_id:
      description: Filter by role (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    sales_status_id:
      description: Filter by sales pipeline status (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by company status (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status_id:
      description: Filter by workflow status (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      description: Filter by the associated task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    workflow_status_category_id:
      description: Filter by workflow status category.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    commentable_project_id:
      description: Filter by the project containing the commented-on resource.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/comments/{id}/add_reaction:
    patch:
      tags:
        - Comments
      summary: Adds reaction to a comment
      operationId: comments-add_reaction-add_reaction
      description: Add a reaction to a comment.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_comment'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_comment'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/comments:
    get:
      tags:
        - Comments
      summary: Get comments
      operationId: comments-index
      description: List comments with optional filters and pagination.
      parameters:
        - $ref: '#/components/parameters/filter_comment'
        - $ref: '#/components/parameters/sort_comment'
      responses:
        '200':
          $ref: '#/components/responses/collection_comment'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Comments
      summary: Create a comment
      operationId: comments-create
      description: Creates a comment. The `creator` is set to the authenticated user making the request, so historical comments imported through a single integration token cannot preserve their original authors.
      requestBody:
        $ref: '#/components/requestBodies/comment'
      responses:
        '201':
          $ref: '#/components/responses/single_comment'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_comment'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/comments/{id}:
    get:
      tags:
        - Comments
      summary: Gets a comment
      operationId: comments-show
      description: Retrieve a single comment by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_comment'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Comments
      summary: Update a comment
      operationId: comments-update
      description: Updates a comment's editable fields. The `creator` is fixed at creation time and cannot be changed.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/comment'
      responses:
        '200':
          $ref: '#/components/responses/single_comment'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_comment'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Comments
      summary: Deletes a comment
      operationId: comments-destroy
      description: Delete a comment.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/comments/{id}/pin:
    patch:
      tags:
        - Comments
      summary: Pins a comment
      operationId: comments-pin-pin
      description: Pin a comment.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_comment'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/comments/{id}/remove_reaction:
    patch:
      tags:
        - Comments
      summary: Removes reaction from comment
      operationId: comments-remove_reaction-remove_reaction
      description: Remove a reaction from a comment.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_comment'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_comment'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/comments/{id}/unpin:
    patch:
      tags:
        - Comments
      summary: Unpins a comment
      operationId: comments-unpin-unpin
      description: Unpin a comment.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_comment'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    conflict:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_conflict'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Conflict
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    single_comment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single comment record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned comment resource.
                properties:
                  attributes:
                    type: object
                    description: Comment attributes.
                    properties:
                      body:
                        $ref: '#/components/schemas/resource_comment/properties/body'
                      commentable_type:
                        anyOf:
                          - $ref: '#/components/schemas/resource_comment/properties/commentable_type'
                          - type: 'null'
                        description: The type of resource this comment was posted on (e.g. task, deal, person).
                      created_at:
                        $ref: '#/components/schemas/resource_comment/properties/created_at'
                      deleted_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_comment/properties/deleted_at'
                          - type: 'null'
                        description: The date and time when the comment was deleted, or null if active.
                      draft:
                        $ref: '#/components/schemas/resource_comment/properties/draft'
                      edited_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_comment/properties/edited_at'
                          - type: 'null'
                        description: The date and time when the comment was last edited, or null if never edited.
                      hidden:
                        $ref: '#/components/schemas/resource_comment/properties/hidden'
                      pinned_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_comment/properties/pinned_at'
                          - type: 'null'
                        description: The date and time when the comment was pinned, or null if not pinned.
                      reactions:
                        $ref: '#/components/schemas/resource_comment/properties/reactions'
                      updated_at:
                        $ref: '#/components/schemas/resource_comment/properties/updated_at'
                      version_number:
                        anyOf:
                          - $ref: '#/components/schemas/resource_comment/properties/version_number'
                          - type: 'null'
                        description: The version number of the comment for tracking edits.
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Comment relationships.
                    properties:
                      attachments:
                        $ref: '#/components/schemas/_collection_relationship'
                      company:
                        $ref: '#/components/schemas/_single_relationship'
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      discussion:
                        $ref: '#/components/schemas/_single_relationship'
                      invoice:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      person:
                        $ref: '#/components/schemas/_single_relationship'
                      pinned_by:
                        $ref: '#/components/schemas/_single_relationship'
                      purchase_order:
                        $ref: '#/components/schemas/_single_relationship'
                      task:
                        $ref: '#/components/schemas/_single_relationship'
                      project:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '456'
                type: comments
                attributes:
                  note: Looks good! I added a few edge cases to handle. Let me know if you need help with the OAuth token refresh flow.
                  created_at: '2026-03-10T11:30:00.000+00:00'
                  updated_at: '2026-03-10T11:30:00.000+00:00'
                  commentable_type: task
                  commentable_id: 120501
                relationships:
                  author:
                    data:
                      type: people
                      id: '12'
                  task:
                    data:
                      type: tasks
                      id: '120501'
              included: []
      description: Single comment
    unprocessable_content_comment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_comment'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    collection_comment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of comment records in JSON:API format.
            properties:
