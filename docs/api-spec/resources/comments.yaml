openapi: 3.1.0
info:
  title: Productive.io API – Comments
  version: 2.0.0
description: Comments on tasks, deals, companies, persons, pages, projects, purchase orders, and invoices. Supports rich text with @mentions, emoji reactions, pinning, and edit history. Comments appear in the activity feed of the parent resource.
x-filters:
  comment:
    sales_status_id:
      description: Filter by sales pipeline status (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    commentable_project_id:
      description: Filter by the project containing the commented-on resource.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    fuzzy_dates:
      description: Filter by fuzzy date range (relative date expression).
      operators:
        - eq
        - not_eq
    role_id:
      description: Filter by role (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_type:
      description: Filter by person type (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project (via task).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by company status (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    jump_query:
      description: Jump (prefix) full-text search across comment content.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      description: Filter by the associated task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    draft:
      description: Filter to include only draft comments.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by client company (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    page_id:
      description: Filter by the associated document page.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    responsible_id:
      description: Filter by the person responsible (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_status:
      description: Filter comments by budget status (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    public_access:
      description: Filter by public access setting (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status_id:
      description: Filter by workflow status (used in full-text search context).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    workflow_status_category_id:
      description: Filter by workflow status category.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    discussion_id:
      description: Filter by the associated discussion.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    full_query:
      description: Full-text search across comment content.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    fuzzy_people:
      description: Filter by person using fuzzy matching.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/comments/{id}/add_reaction:
    patch:
      tags:
        - Comments
      summary: Adds reaction to a comment
      responses:
        '200':
          $ref: '#/components/responses/single_comment'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: comments-add_reaction-add_reaction
      description: Add a reaction to a comment.
  /api/v2/comments:
    get:
      tags:
        - Comments
      summary: Get comments
      responses:
        '200':
          $ref: '#/components/responses/collection_comment'
      parameters:
        - $ref: '#/components/parameters/sort_comment'
        - $ref: '#/components/parameters/filter_comment'
        - $ref: '#/components/parameters/header_organization'
      operationId: comments-index
      description: List comments with optional filters and pagination.
    post:
      tags:
        - Comments
      summary: Create a comment
      responses:
        '201':
          $ref: '#/components/responses/single_comment'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: comments-create
      requestBody:
        $ref: '#/components/requestBodies/comment'
      description: Creates a comment. The `creator` is set to the authenticated user making the request, so historical comments imported through a single integration token cannot preserve their original authors.
  /api/v2/comments/{id}:
    get:
      tags:
        - Comments
      summary: Gets a comment
      responses:
        '200':
          $ref: '#/components/responses/single_comment'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: comments-show
      description: Retrieve a single comment by ID.
    patch:
      tags:
        - Comments
      summary: Update a comment
      responses:
        '200':
          $ref: '#/components/responses/single_comment'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: comments-update
      requestBody:
        $ref: '#/components/requestBodies/comment'
      description: Updates a comment's editable fields. The `creator` is fixed at creation time and cannot be changed.
    delete:
      tags:
        - Comments
      summary: Deletes a comment
      responses:
        '204':
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: comments-destroy
      description: Delete a comment.
  /api/v2/comments/{id}/pin:
    patch:
      tags:
        - Comments
      summary: Pins a comment
      responses:
        '200':
          $ref: '#/components/responses/single_comment'
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: comments-pin-pin
      description: Pin a comment.
  /api/v2/comments/{id}/remove_reaction:
    patch:
      tags:
        - Comments
      summary: Removes reaction from comment
      responses:
        '200':
          $ref: '#/components/responses/single_comment'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: comments-remove_reaction-remove_reaction
      description: Remove a reaction from a comment.
  /api/v2/comments/{id}/unpin:
    patch:
      tags:
        - Comments
      summary: Unpins a comment
      responses:
        '200':
          $ref: '#/components/responses/single_comment'
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: comments-unpin-unpin
      description: Unpin a comment.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_comment:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.comment at the top of this file.
      required: false
      description: Filters
    sort_comment:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - created_at
            - -created_at
          type: string
        title: Sort comment
      explode: false
      required: false
      description: Sort comment
  responses:
    single_comment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      body:
                        $ref: '#/components/schemas/resource_comment/properties/body'
                      draft:
                        $ref: '#/components/schemas/resource_comment/properties/draft'
                      hidden:
                        $ref: '#/components/schemas/resource_comment/properties/hidden'
                      edited_at:
                        $ref: '#/components/schemas/resource_comment/properties/edited_at'
                      pinned_at:
                        $ref: '#/components/schemas/resource_comment/properties/pinned_at'
                      reactions:
                        $ref: '#/components/schemas/resource_comment/properties/reactions'
                      created_at:
                        $ref: '#/components/schemas/resource_comment/properties/created_at'
                      deleted_at:
                        $ref: '#/components/schemas/resource_comment/properties/deleted_at'
                      updated_at:
                        $ref: '#/components/schemas/resource_comment/properties/updated_at'
                      version_number:
                        $ref: '#/components/schemas/resource_comment/properties/version_number'
                      commentable_type:
                        $ref: '#/components/schemas/resource_comment/properties/commentable_type'
                  relationships:
                    type: object
                    properties:
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      task:
                        $ref: '#/components/schemas/_single_relationship'
                      person:
                        $ref: '#/components/schemas/_single_relationship'
                      company:
                        $ref: '#/components/schemas/_single_relationship'
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      invoice:
                        $ref: '#/components/schemas/_single_relationship'
                      project:
                        $ref: '#/components/schemas/_single_relationship'
                      pinned_by:
                        $ref: '#/components/schemas/_single_relationship'
                      discussion:
                        $ref: '#/components/schemas/_single_relationship'
                      attachments:
                        $ref: '#/components/schemas/_collection_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      purchase_order:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single comment
    collection_comment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        body:
                          $ref: '#/components/schemas/resource_comment/properties/body'
                        draft:
                          $ref: '#/components/schemas/resource_comment/properties/draft'
                        hidden:
                          $ref: '#/components/schemas/resource_comment/properties/hidden'
                        edited_at:
                          $ref: '#/components/schemas/resource_comment/properties/edited_at'
                        pinned_at:
                          $ref: '#/components/schemas/resource_comment/properties/pinned_at'
                        reactions:
                          $ref: '#/components/schemas/resource_comment/properties/reactions'
                        created_at:
                          $ref: '#/components/schemas/resource_comment/properties/created_at'
                        deleted_at:
                          $ref: '#/components/schemas/resource_comment/properties/deleted_at'
                        updated_at:
                          $ref: '#/components/schemas/resource_comment/properties/updated_at'
                        version_number:
                          $ref: '#/components/schemas/resource_comment/properties/version_number'
                        commentable_type:
                          $ref: '#/components/schemas/resource_comment/properties/commentable_type'
                    relationships:
                      type: object
                      properties:
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        task:
                          $ref: '#/components/schemas/_single_relationship'
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                        company:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        invoice:
                          $ref: '#/components/schemas/_single_relationship'
                        project:
                          $ref: '#/components/schemas/_single_relationship'
                        pinned_by:
                          $ref: '#/components/schemas/_single_relationship'
                        discussion:
                          $ref: '#/components/schemas/_single_relationship'
                        attachments:
                          $ref: '#/components/schemas/_collection_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        purchase_order:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection comment
  schemas:
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    _collection_relationship:
      anyOf:
        - type: object
          title: Collection data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          description: Included variant — related resource identifiers are present in `data`.
          example:
            data:
              - type: tasks
                id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    resource_comment:
      type: object
      title: Comment Resource
      properties:
        resource_request_id:
          type: integer
          title: Resource Request
          description: The ID of the resource request this comment belongs to, if applicable.
          example:
            - 123
        page_id:
          type: integer
          title: Page
          description: The ID of the page this comment belongs to, if applicable.
          example:
            - 123
        discussion_id:
          type: integer
          title: Discussion
          description: The ID of the discussion thread this comment belongs to.
          example:
            - 123
        draft:
          type: boolean
          title: Draft
          description: Whether this comment is a draft (not yet published and not visible to others).
          example:
            eq: value
        commentable_project_id:
          type: integer
          title: Commentable Project
          description: ID of the project this comment belongs to, derived from the commentable resource.
          example:
            - 123
        attachments:
          title: Attachments
          description: File attachments included in this comment.
          example:
            eq: value
        task_id:
          type: integer
          title: Task
          description: The ID of the task this comment belongs to, if applicable.
          example:
            - 123
        attachment_ids:
          title: Attachment Ids
          description: IDs of attachments to add to this comment when creating or updating.
          example:
            - 123
            - 456
        person_id:
          type: integer
          title: Person
          description: The ID of the person who authored this comment.
          example:
            - 123
        body:
          type: string
          title: Body
          description: The HTML body of the comment including rich text formatting and @mention markup.
          example:
            eq: value
        hidden:
          type: boolean
          title: Hidden
          description: Whether this comment is hidden from the activity feed (moderated or removed).
          example:
            eq: value
        sales_status_id:
          type: integer
          title: Sales Status
          description: The ID of the sales status referenced in this comment's activity context.
          example:
            - 123
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when this comment was last updated.
          example:
            gt: '2026-01-01'
        status:
          type: integer
          title: Status
          description: The status label referenced in this comment's activity context.
          example:
            eq: active
        public_access:
          type: boolean
          title: Public Access
          description: Indicates whether this comment is publicly accessible without authentication.
          example:
            eq: value
        pinned_at:
          type: string
          title: Pinned At
          format: date-time
          description: Timestamp when this comment was pinned, or null if not pinned.
          example:
            gt: '2026-01-01'
        project:
          title: Project
          description: The project this comment belongs to, derived from the commentable resource.
          example:
            eq: value
        creator:
          title: Creator
          description: The person who created this comment.
          example:
            eq: value
        responsible_id:
          type: integer
          title: Responsible
          description: The ID of the project manager (responsible person) in an activity comment context.
          example:
            - 123
        proposal_id:
          type: integer
          title: Proposal
          description: The ID of the proposal this comment belongs to, if applicable.
          example:
            - 123
        invoice_id:
          type: integer
          title: Invoice
          description: The ID of the invoice this comment belongs to, if applicable.
          example:
            - 123
        reactions:
          type: object
          title: Reactions
          description: Emoji reactions on this comment, keyed by emoji with people and timestamps.
          example:
            eq: value
        company:
          title: Company
          description: The company this comment is associated with, if posted on a company's activity feed.
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this comment was created.
          example:
            gt: '2026-01-01'
        status_id:
          type: integer
          title: Status
          description: The ID of the workflow status referenced in this comment's activity context.
          example:
            - 123
        purchase_order:
          title: Purchase Order
          description: The purchase order this comment belongs to, if applicable.
          example:
            data:
              type: purchase_orders
              id: '1234567'
        company_id:
          type: integer
          title: Company
          description: The ID of the company this comment is associated with.
          example:
            - 123
        budget_status:
          type: integer
          title: Budget Status
          description: The budget status context when this comment was posted (for deal-related comments).
          example:
            gt: 0
        invoice:
          title: Invoice
          description: The invoice associated with this comment, if the comment is on an invoice.
          example:
            eq: value
        commentable_type:
          type: string
          title: Commentable Type
          description: The type of the parent entity this comment is posted on (e.g. task, deal, company).
          example:
            eq: active
        discussion:
          title: Discussion
          description: The discussion thread this comment belongs to, if posted in a doc discussion.
          example:
            eq: value
        person:
          title: Person
          description: The person who authored this comment.
          example:
            eq: value
        deal_id:
          type: integer
          title: Deal
          description: The ID of the deal this comment is associated with.
          example:
            - 123
        purchase_order_id:
          type: integer
          title: Purchase Order
          description: The ID of the purchase order this comment belongs to, if applicable.
          example: 1234567
        project_id:
          type: integer
          title: Project
          description: The ID of the project this comment belongs to, if applicable.
          example:
            - 123
        task:
          title: Task
          description: The task this comment belongs to, if applicable.
          example:
            eq: value
        jump_query:
          type: string
          title: Jump Query
          description: A query string used to deep-link to the specific comment location in the UI.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this comment belongs to.
          example:
            eq: value
        edited_at:
          type: string
          title: Edited At
          format: date-time
          description: Timestamp when this comment was last edited.
          example:
            gt: '2026-01-01'
        role_id:
          type: integer
          title: Role
          description: The ID of the role referenced in this comment's activity context.
          example:
            - 123
        deleted_at:
          type: string
          title: Deleted At
          format: date-time
          description: Timestamp when this comment was soft-deleted. Null if not deleted.
          example:
            gt: '2026-01-01'
        fuzzy_dates:
          type: string
          title: Fuzzy Dates
          format: date
          description: Fuzzy date tokens extracted from this comment for search purposes.
          example:
            gt: '2026-01-01'
        full_query:
          type: string
          title: Full Query
          description: Full-text search query context for this comment.
          example:
            eq: value
        deal:
          title: Deal
          description: The deal this comment is associated with, if posted on a deal's activity feed.
          example:
            eq: value
        person_type:
          type: integer
          title: Person Type
          description: The type of person who authored this comment (e.g. member, client).
          example:
            eq: active
        pinned_by:
          title: Pinned By
          description: The person who pinned this comment.
          example:
            eq: value
        version_number:
          type: integer
          title: Version Number
          description: The version number of this comment, incremented on each edit.
          example:
            eq: value
        fuzzy_people:
          type: integer
          title: Fuzzy People
          description: Fuzzy person references extracted from this comment for search purposes.
          example:
            eq: value
        workflow_status_category_id:
          type: string
          title: Workflow Status Category
          description: The ID of the workflow status category referenced in this comment's activity context.
          example:
            - 123
      description: A message in the activity feed of a task, deal, company, or other entity. Comments support rich text, @mentions, and file attachments.
      example:
        id: '456'
        type: comments
        attributes:
          note: Looks good! I added a few edge cases to handle. Let me know if you need help with the OAuth token refresh flow.
          created_at: '2026-03-10T11:30:00.000+00:00'
          updated_at: '2026-03-10T11:30:00.000+00:00'
          commentable_type: task
          commentable_id: 120501
        relationships:
          author:
            data:
              type: people
              id: '12'
          task:
            data:
              type: tasks
              id: '120501'
  requestBodies:
    comment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      body:
                        $ref: '#/components/schemas/resource_comment/properties/body'
                      draft:
                        $ref: '#/components/schemas/resource_comment/properties/draft'
                      hidden:
                        $ref: '#/components/schemas/resource_comment/properties/hidden'
                      deal_id:
