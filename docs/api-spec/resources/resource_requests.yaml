openapi: 3.1.0
info:
  title: Productive.io API – Resource Requests
  version: 2.0.0
description: Operations for managing resource requests — requests to allocate or hire resources for a project service.
x-filters:
  resource_request:
    query:
      description: Full-text search filter across resource request titles.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    resolver_id:
      description: Filter by the ID of the person who resolved the resource request.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    title:
      description: Filter by the title of the resource request.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    time_to_close:
      description: Filter by the time to close in minutes from creation to resolution.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    job_title:
      description: Filter by the requested job title stored in the resource request fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_type_id:
      description: Filter by service type IDs stored in the resource request fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    team_id:
      description: Filter by team IDs stored in the resource request fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    started_on:
      description: Filter by start date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    time:
      description: Filter by the requested time in minutes per day of the resource request.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the ID of the person who created the resource request.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter by subsidiary ID stored in the resource request fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by the status of the resource request.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_id:
      description: Filter by the ID of the service (billing point) the resource request belongs to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    workplace_id:
      description: Filter by workplace ID stored in the resource request fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    tags:
      description: Filter by tag values stored in the resource request fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deleted_at:
      description: Filter by deleted_at date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filter by created_at date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    ended_on:
      description: Filter by end date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_fields:
      description: Filter by custom field values on the resource request.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by resource request ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    resolved_at:
      description: Filter by resolved_at date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/resource_requests/{id}/cancel:
    patch:
      tags:
        - Resource Requests
      summary: Cancel a resource request
      responses:
        '200':
          $ref: '#/components/responses/single_resource_request'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the resource request to cancel.
        - $ref: '#/components/parameters/header_organization'
      operationId: resource_requests-cancel-cancel
      description: Cancels a resource request by ID, setting its status to canceled.
  /api/v2/resource_requests:
    get:
      tags:
        - Resource Requests
      summary: Get resource requests
      responses:
        '200':
          $ref: '#/components/responses/collection_resource_request'
      parameters:
        - $ref: '#/components/parameters/sort_resource_request'
        - $ref: '#/components/parameters/filter_resource_request'
        - $ref: '#/components/parameters/header_organization'
      operationId: resource_requests-index
      description: Returns a paginated list of resource requests, optionally filtered and sorted.
    post:
      tags:
        - Resource Requests
      summary: Create a resource request
      responses:
        '201':
          $ref: '#/components/responses/single_resource_request'
        '400':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: The request body is missing required fields or contains invalid data.
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: The resource request could not be created due to validation errors.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: resource_requests-create
      description: Creates a new resource request for a service.
  /api/v2/resource_requests/{id}:
    get:
      tags:
        - Resource Requests
      summary: Gets a resource request
      responses:
        '200':
          $ref: '#/components/responses/single_resource_request'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the resource request to retrieve.
        - $ref: '#/components/parameters/header_organization'
      operationId: resource_requests-show
      description: Returns a single resource request by ID.
    patch:
      tags:
        - Resource Requests
      summary: Update a resource request
      responses:
        '200':
          $ref: '#/components/responses/single_resource_request'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: The resource request could not be updated due to validation errors.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the resource request to update.
        - $ref: '#/components/parameters/header_organization'
      operationId: resource_requests-update
      description: Updates an existing resource request by ID.
    delete:
      tags:
        - Resource Requests
      summary: Deletes a resource request
      responses:
        '204':
          description: The resource request was successfully deleted.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the resource request to delete.
        - $ref: '#/components/parameters/header_organization'
      operationId: resource_requests-destroy
      description: Deletes a resource request by ID.
  /api/v2/resource_requests/{id}/reject:
    patch:
      tags:
        - Resource Requests
      summary: Reject a resource request
      responses:
        '200':
          $ref: '#/components/responses/single_resource_request'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the resource request to reject.
      operationId: resource_requests-reject-reject
      description: Rejects a resource request by ID, setting its status to rejected.
  /api/v2/resource_requests/{id}/resolve:
    post:
      tags:
        - Resource Requests
      summary: Resolve a resource request by creating bookings
      responses:
        '200':
          $ref: '#/components/responses/single_resource_request'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: The resource request could not be resolved due to validation errors.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the resource request to resolve.
      operationId: resource_requests-resolve-resolve
      description: Resolves a resource request by ID, setting its status to resolved.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_resource_request:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.resource_request at the top of this file.
      required: false
      description: Filter parameters for listing resource requests.
    sort_resource_request:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - booking_method_id
            - -booking_method_id
            - created_at
            - -created_at
            - creator
            - -creator
            - ended_on
            - -ended_on
            - id
            - -id
            - percentage
            - -percentage
            - resolved_at
            - -resolved_at
            - resolver
            - -resolver
            - service
            - -service
            - started_on
            - -started_on
            - status
            - -status
            - time
            - -time
            - total_time
            - -total_time
          type: string
        title: Sort resource request
      explode: false
      required: false
      description: Sort order for resource request list results. Accepts field names, comma-separated; prefix with - for descending.
  responses:
    single_resource_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      note:
                        $ref: '#/components/schemas/resource_resource_request/properties/note'
                      time:
                        $ref: '#/components/schemas/resource_resource_request/properties/time'
                      title:
                        $ref: '#/components/schemas/resource_resource_request/properties/title'
                      fields:
                        $ref: '#/components/schemas/resource_resource_request/properties/fields'
                      status:
                        $ref: '#/components/schemas/resource_resource_request/properties/status'
                      currency:
                        $ref: '#/components/schemas/resource_resource_request/properties/currency'
                      ended_on:
                        $ref: '#/components/schemas/resource_resource_request/properties/ended_on'
                      created_at:
                        $ref: '#/components/schemas/resource_resource_request/properties/created_at'
                      percentage:
                        $ref: '#/components/schemas/resource_resource_request/properties/percentage'
                      started_on:
                        $ref: '#/components/schemas/resource_resource_request/properties/started_on'
                      total_time:
                        $ref: '#/components/schemas/resource_resource_request/properties/total_time'
                      canceled_at:
                        $ref: '#/components/schemas/resource_resource_request/properties/canceled_at'
                      resolved_at:
                        $ref: '#/components/schemas/resource_resource_request/properties/resolved_at'
                      custom_fields:
                        $ref: '#/components/schemas/resource_resource_request/properties/custom_fields'
                      exchange_date:
                        $ref: '#/components/schemas/resource_resource_request/properties/exchange_date'
                      exchange_rate:
                        $ref: '#/components/schemas/resource_resource_request/properties/exchange_rate'
                      time_to_close:
                        $ref: '#/components/schemas/resource_resource_request/properties/time_to_close'
                      rejected_reason:
                        $ref: '#/components/schemas/resource_resource_request/properties/rejected_reason'
                      currency_default:
                        $ref: '#/components/schemas/resource_resource_request/properties/currency_default'
                      booking_method_id:
                        $ref: '#/components/schemas/resource_resource_request/properties/booking_method_id'
                      max_cost_per_hour:
                        $ref: '#/components/schemas/resource_resource_request/properties/max_cost_per_hour'
                      currency_normalized:
                        $ref: '#/components/schemas/resource_resource_request/properties/currency_normalized'
                      exchange_rate_normalized:
                        $ref: '#/components/schemas/resource_resource_request/properties/exchange_rate_normalized'
                      max_cost_per_hour_default:
                        $ref: '#/components/schemas/resource_resource_request/properties/max_cost_per_hour_default'
                      max_cost_per_hour_normalized:
                        $ref: '#/components/schemas/resource_resource_request/properties/max_cost_per_hour_normalized'
                  relationships:
                    type: object
                    properties:
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      service:
                        $ref: '#/components/schemas/_single_relationship'
                      resolver:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      custom_field_people:
                        $ref: '#/components/schemas/_collection_relationship'
                      custom_field_attachments:
                        $ref: '#/components/schemas/_collection_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: A single resource request response.
    collection_resource_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        note:
                          $ref: '#/components/schemas/resource_resource_request/properties/note'
                        time:
                          $ref: '#/components/schemas/resource_resource_request/properties/time'
                        title:
                          $ref: '#/components/schemas/resource_resource_request/properties/title'
                        fields:
                          $ref: '#/components/schemas/resource_resource_request/properties/fields'
                        status:
                          $ref: '#/components/schemas/resource_resource_request/properties/status'
                        currency:
                          $ref: '#/components/schemas/resource_resource_request/properties/currency'
                        ended_on:
                          $ref: '#/components/schemas/resource_resource_request/properties/ended_on'
                        created_at:
                          $ref: '#/components/schemas/resource_resource_request/properties/created_at'
                        percentage:
                          $ref: '#/components/schemas/resource_resource_request/properties/percentage'
                        started_on:
                          $ref: '#/components/schemas/resource_resource_request/properties/started_on'
                        total_time:
                          $ref: '#/components/schemas/resource_resource_request/properties/total_time'
                        canceled_at:
                          $ref: '#/components/schemas/resource_resource_request/properties/canceled_at'
                        resolved_at:
                          $ref: '#/components/schemas/resource_resource_request/properties/resolved_at'
                        custom_fields:
                          $ref: '#/components/schemas/resource_resource_request/properties/custom_fields'
                        exchange_date:
                          $ref: '#/components/schemas/resource_resource_request/properties/exchange_date'
                        exchange_rate:
                          $ref: '#/components/schemas/resource_resource_request/properties/exchange_rate'
                        time_to_close:
                          $ref: '#/components/schemas/resource_resource_request/properties/time_to_close'
                        rejected_reason:
                          $ref: '#/components/schemas/resource_resource_request/properties/rejected_reason'
                        currency_default:
                          $ref: '#/components/schemas/resource_resource_request/properties/currency_default'
                        booking_method_id:
                          $ref: '#/components/schemas/resource_resource_request/properties/booking_method_id'
                        max_cost_per_hour:
                          $ref: '#/components/schemas/resource_resource_request/properties/max_cost_per_hour'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_resource_request/properties/currency_normalized'
                        exchange_rate_normalized:
                          $ref: '#/components/schemas/resource_resource_request/properties/exchange_rate_normalized'
                        max_cost_per_hour_default:
                          $ref: '#/components/schemas/resource_resource_request/properties/max_cost_per_hour_default'
                        max_cost_per_hour_normalized:
                          $ref: '#/components/schemas/resource_resource_request/properties/max_cost_per_hour_normalized'
                    relationships:
                      type: object
                      properties:
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        service:
                          $ref: '#/components/schemas/_single_relationship'
                        resolver:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        custom_field_people:
                          $ref: '#/components/schemas/_collection_relationship'
                        custom_field_attachments:
                          $ref: '#/components/schemas/_collection_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: A paginated collection of resource requests.
  schemas:
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _collection_relationship:
      anyOf:
        - type: object
          title: Collection data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          description: Included variant — related resource identifiers are present in `data`.
          example:
            data:
              - type: tasks
                id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    resource_resource_request:
      type: object
      title: Resource request Resource
      properties:
        creator_id:
          type: integer
          title: Creator
          description: The ID of the person who created this resource request.
          example:
            - 123
        job_title:
          type: string
          title: Job Title
          description: The requested job title for the resource, as stored in the resource request fields.
          example:
            eq: value
        time:
          type: integer
          title: Time
          description: The requested time in minutes per day when using per-day booking.
          example:
            gt: 0
        title:
          type: string
          title: Title
          description: The title describing the resource being requested.
          example:
            eq: value
        canceled_at:
          type: string
          title: Canceled At
          format: date-time
          description: Timestamp when this resource request was canceled, or null if not canceled.
          example:
            gt: '2026-01-01'
        note:
          type: string
          title: Note
          description: An optional HTML note providing additional context for this resource request.
          example:
            eq: value
        resolver_id:
          type: integer
          title: Resolver
          description: The ID of the person who resolved this resource request.
          example:
            - 123
        exchange_date:
          type: string
          title: Exchange Date
          format: date
          description: The date used for the exchange rate lookup on this resource request.
          example:
            gt: '2026-01-01'
        id:
          type: integer
          title: Id
          description: The unique identifier of this resource request.
          example:
            - 123
        max_cost_per_hour:
          title: Max Cost Per Hour
          description: The maximum cost per hour for the requested resource in the request currency.
          example:
            eq: value
        creator:
          title: Creator
          description: The JSON:API relationship object for the person who created this resource request.
          example:
            eq: value
        exchange_rate_normalized:
          type: number
          title: Exchange Rate Normalized
          description: The exchange rate from the resource request currency to the normalized quote currency.
          example:
            gt: 0
        team_id:
          type: integer
          title: Team
          description: The team IDs associated with the requested resource, as stored in the fields.
          example:
            - 123
        rejected_reason:
          type: string
          title: Rejected Reason
          description: The reason provided when the resource request was rejected.
          example:
            eq: value
        query:
          type: string
          title: Query
          description: A full-text search string used for matching resource requests by title.
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this resource request was created.
          example:
            gt: '2026-01-01'
        total_time:
          type: integer
          title: Total Time
          description: The total requested time in minutes when using total-hours booking.
          example:
            gt: 0
        started_on:
          type: string
          title: Started On
          format: date
          description: The start date of the requested resource allocation period.
          example:
            eq: value
        resolved_at:
          type: string
          title: Resolved At
          format: date-time
          description: Timestamp when this resource request was resolved, or null if still open.
          example:
            gt: '2026-01-01'
        percentage:
          type: integer
          title: Percentage
          description: The requested allocation percentage from 0 to 100 when using percentage-based booking.
          example:
            eq: value
        custom_field_attachments:
          title: Custom Field Attachments
          description: The JSON:API relationship objects for file attachments linked via custom fields.
          example:
            gt: '2026-01-01'
        max_cost_per_hour_default:
          title: Max Cost Per Hour Default
          description: The maximum cost per hour converted to the default account currency.
          example:
            eq: value
        subsidiary_id:
          type: integer
          title: Subsidiary
          description: The subsidiary ID associated with the requested resource, as stored in the fields.
          example:
            - 123
        exchange_rate:
          type: number
          title: Exchange Rate
          description: The exchange rate from the resource request currency to the default account currency.
          example:
            gt: 0
        service_id:
          type: integer
          title: Service
          description: The ID of the service this resource request is associated with.
          example:
            - 123
        time_to_close:
          type: integer
          title: Time To Close
          description: The number of minutes elapsed between creation and resolution of this resource request.
          example:
            gt: 0
        tags:
          type: string
          title: Tags
          description: The list of tag labels associated with this resource request.
          example:
            eq: value
        custom_fields:
          type: object
          title: Custom Fields
          description: A JSON object containing custom field values for this resource request.
          example:
            eq: value
        service:
          title: Service
          description: The JSON:API relationship object for the service this resource request belongs to.
          example:
            eq: value
        fields:
          type: object
          title: Fields
          description: A JSON object containing additional structured fields such as job_title, subsidiary_id, team_ids, service_type_ids, and tags.
          example:
            eq: value
        currency:
          type: string
          title: Currency
          description: The currency code used for cost calculations on this resource request.
          example:
            eq: value
        organization:
          title: Organization
          description: The JSON:API relationship object for the organization this resource request belongs to.
          example:
            eq: value
        service_type_id:
          type: integer
          title: Service Type
          description: The service type IDs associated with the requested resource, as stored in the fields.
          example:
            - 123
        deleted_at:
          type: string
          title: Deleted At
          format: date
          description: Timestamp when this resource request was soft-deleted, or null if active.
          example:
            gt: '2026-01-01'
        booking_method_id:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Booking Method
          description: The booking method ID specifying how the requested time is tracked.
          example:
            - 123
        resolver:
          title: Resolver
