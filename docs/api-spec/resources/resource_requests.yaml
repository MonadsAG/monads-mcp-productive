openapi: 3.1.0
info:
  title: Productive.io API – Resource Requests
  version: 2.0.0
description: Operations for managing resource requests — requests to allocate or hire resources for a project service.
x-filters:
  resource_request:
    tags:
      description: Filter by tag values stored in the resource request fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filter by created_at date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the ID of the person who created the resource request.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_fields:
      description: Filter by custom field values on the resource request.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deleted_at:
      description: Filter by deleted_at date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    ended_on:
      description: Filter by end date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by resource request ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    job_title:
      description: Filter by the requested job title stored in the resource request fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Full-text search filter across resource request titles.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    resolved_at:
      description: Filter by resolved_at date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    resolver_id:
      description: Filter by the ID of the person who resolved the resource request.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_id:
      description: Filter by the ID of the service (billing point) the resource request belongs to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_type_id:
      description: Filter by service type IDs stored in the resource request fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    started_on:
      description: Filter by start date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by the status of the resource request.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter by subsidiary ID stored in the resource request fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    team_id:
      description: Filter by team IDs stored in the resource request fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    time:
      description: Filter by the requested time in minutes per day of the resource request.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    time_to_close:
      description: Filter by the time to close in minutes from creation to resolution.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    title:
      description: Filter by the title of the resource request.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    workplace_id:
      description: Filter by workplace ID stored in the resource request fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    job_role_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/resource_requests/{id}/cancel:
    patch:
      tags:
        - Resource Requests
      summary: Cancel a resource request
      operationId: resource_requests-cancel-cancel
      description: Cancels a resource request by ID, setting its status to canceled.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the resource request to cancel.
      responses:
        '200':
          $ref: '#/components/responses/single_resource_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_resource_request'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/resource_requests:
    get:
      tags:
        - Resource Requests
      summary: Get resource requests
      operationId: resource_requests-index
      description: Returns a paginated list of resource requests, optionally filtered and sorted.
      parameters:
        - $ref: '#/components/parameters/filter_resource_request'
        - $ref: '#/components/parameters/sort_resource_request'
      responses:
        '200':
          $ref: '#/components/responses/collection_resource_request'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Resource Requests
      summary: Create a resource request
      operationId: resource_requests-create
      description: Creates a new resource request for a service.
      responses:
        '201':
          $ref: '#/components/responses/single_resource_request'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_resource_request'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/resource_requests/{id}:
    get:
      tags:
        - Resource Requests
      summary: Gets a resource request
      operationId: resource_requests-show
      description: Returns a single resource request by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the resource request to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/single_resource_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Resource Requests
      summary: Update a resource request
      operationId: resource_requests-update
      description: Updates an existing resource request by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the resource request to update.
      responses:
        '200':
          $ref: '#/components/responses/single_resource_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_resource_request'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Resource Requests
      summary: Deletes a resource request
      operationId: resource_requests-destroy
      description: Deletes a resource request by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the resource request to delete.
      responses:
        '204':
          description: The resource request was successfully deleted.
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/resource_requests/{id}/reject:
    patch:
      tags:
        - Resource Requests
      summary: Reject a resource request
      operationId: resource_requests-reject-reject
      description: Rejects a resource request by ID, setting its status to rejected.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the resource request to reject.
      responses:
        '200':
          $ref: '#/components/responses/single_resource_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_resource_request'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/resource_requests/{id}/resolve:
    post:
      tags:
        - Resource Requests
      summary: Resolve a resource request by creating bookings
      operationId: resource_requests-resolve-resolve
      description: Resolves a resource request by ID, setting its status to resolved.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the resource request to resolve.
      responses:
        '200':
          $ref: '#/components/responses/single_resource_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_resource_request'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content_resource_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_resource_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    single_resource_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: The JSON:API response body schema for a single resource request.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned resource request.
                properties:
                  attributes:
                    type: object
                    description: The attributes of the returned resource request.
                    properties:
                      booking_method_id:
                        $ref: '#/components/schemas/resource_resource_request/properties/booking_method_id'
                      canceled_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_resource_request/properties/canceled_at'
                          - type: 'null'
                        description: Timestamp when this resource request was canceled, or null if not canceled.
                      created_at:
                        $ref: '#/components/schemas/resource_resource_request/properties/created_at'
                      currency:
                        $ref: '#/components/schemas/resource_resource_request/properties/currency'
                      currency_default:
                        $ref: '#/components/schemas/resource_resource_request/properties/currency_default'
                      currency_normalized:
                        $ref: '#/components/schemas/resource_resource_request/properties/currency_normalized'
                      custom_fields:
                        anyOf:
                          - $ref: '#/components/schemas/resource_resource_request/properties/custom_fields'
                          - type: 'null'
                        description: A JSON object containing custom field values for this resource request.
                      ended_on:
                        $ref: '#/components/schemas/resource_resource_request/properties/ended_on'
                      exchange_date:
                        anyOf:
                          - $ref: '#/components/schemas/resource_resource_request/properties/exchange_date'
                          - type: 'null'
                        description: The date used for the exchange rate lookup on this resource request.
                      exchange_rate:
                        anyOf:
                          - type: string
                          - type: 'null'
                        description: The exchange rate from the resource request currency to the default account currency.
                      exchange_rate_normalized:
                        anyOf:
                          - type: string
                          - type: 'null'
                        description: The exchange rate from the resource request currency to the normalized quote currency.
                      fields:
                        $ref: '#/components/schemas/resource_resource_request/properties/fields'
                      max_cost_per_hour:
                        $ref: '#/components/schemas/resource_resource_request/properties/max_cost_per_hour'
                      max_cost_per_hour_default:
                        $ref: '#/components/schemas/resource_resource_request/properties/max_cost_per_hour_default'
                      max_cost_per_hour_normalized:
                        $ref: '#/components/schemas/resource_resource_request/properties/max_cost_per_hour_normalized'
                      note:
                        anyOf:
                          - $ref: '#/components/schemas/resource_resource_request/properties/note'
                          - type: 'null'
                        description: An optional HTML note providing additional context for this resource request.
                      percentage:
                        anyOf:
                          - $ref: '#/components/schemas/resource_resource_request/properties/percentage'
                          - type: 'null'
                        description: The requested allocation percentage from 0 to 100 when using percentage-based booking.
                      rejected_reason:
                        anyOf:
                          - $ref: '#/components/schemas/resource_resource_request/properties/rejected_reason'
                          - type: 'null'
                        description: The reason provided when the resource request was rejected.
                      resolved_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_resource_request/properties/resolved_at'
                          - type: 'null'
                        description: Timestamp when this resource request was resolved, or null if still open.
                      started_on:
                        $ref: '#/components/schemas/resource_resource_request/properties/started_on'
                      status:
                        $ref: '#/components/schemas/resource_resource_request/properties/status'
                      time:
                        anyOf:
                          - $ref: '#/components/schemas/resource_resource_request/properties/time'
                          - type: 'null'
                        description: The requested time in minutes per day when using per-day booking.
                      time_to_close:
                        anyOf:
                          - $ref: '#/components/schemas/resource_resource_request/properties/time_to_close'
                          - type: 'null'
                        description: The number of minutes elapsed between creation and resolution of this resource request.
                      title:
                        $ref: '#/components/schemas/resource_resource_request/properties/title'
                      total_time:
                        anyOf:
                          - $ref: '#/components/schemas/resource_resource_request/properties/total_time'
                          - type: 'null'
                        description: The total requested time in minutes when using total-hours booking.
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: The JSON:API relationships of the returned resource request.
                    properties:
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      custom_field_attachments:
                        $ref: '#/components/schemas/_collection_relationship'
                      custom_field_people:
                        $ref: '#/components/schemas/_collection_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      resolver:
                        $ref: '#/components/schemas/_single_relationship'
                      service:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource included in the response.
                  example:
                    eq: value
                description: An array of sideloaded related resources included with the single resource request response.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '34'
                type: resource_requests
                attributes:
                  status: pending
                  requested_hours: 160
                  start_date: '2026-04-01'
                  end_date: '2026-04-30'
                  note: Need a senior React developer for the dashboard feature
                  created_at: '2026-03-15T10:00:00.000+00:00'
                relationships:
                  service:
                    data:
                      type: services
                      id: '1856422'
                  requester:
                    data:
                      type: people
                      id: '12'
              included: []
      description: A single resource request response.
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    collection_resource_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: The JSON:API response body schema for a collection of resource requests.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A single resource request item in the collection.
                  properties:
                    attributes:
                      type: object
                      description: The attributes of a resource request item in the collection.
                      properties:
                        booking_method_id:
                          $ref: '#/components/schemas/resource_resource_request/properties/booking_method_id'
                        canceled_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_resource_request/properties/canceled_at'
