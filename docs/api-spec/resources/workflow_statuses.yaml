    single_workflow_status:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single workflow_status record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned workflow_status resource.
                properties:
                  attributes:
                    type: object
                    description: Workflow status attributes.
                    properties:
                      category_id:
                        $ref: '#/components/schemas/resource_workflow_status/properties/category_id'
                      color_id:
                        anyOf:
                          - type: string
                          - type: 'null'
                        description: The color identifier for this status.
                      name:
                        $ref: '#/components/schemas/resource_workflow_status/properties/name'
                      position:
                        $ref: '#/components/schemas/resource_workflow_status/properties/position'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Workflow status relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      workflow:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '224'
                type: workflow_statuses
                attributes:
                  name: In Progress
                  color_id: '5'
                  position: 2
                  category_id: 2
                relationships:
                  workflow:
                    data:
                      type: workflows
                      id: '75'
              included: []
      description: Single workflow status
    collection_workflow_status:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of workflow status records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A workflow status resource object.
                  properties:
                    attributes:
                      type: object
                      description: Workflow status attributes.
                      properties:
                        category_id:
