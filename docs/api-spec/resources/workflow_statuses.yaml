openapi: 3.1.0
info:
  title: Productive.io API – Workflow Statuses
  version: 2.0.0
description: |-
  The Workflow Status object represents the current state of a task, enabling users to define and monitor task stages.

  Every Workflow can have multiple Workflow statuses.
  There are three Workflow status categories:
   - not_started
   - started
   - closed
x-filters:
  workflow_status:
    category_id:
      description: Filter by workflow status category (Not Started, Started, or Closed).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Filter by workflow status name using a partial text search.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      operators:
        - eq
        - not_eq
    name:
      description: Filter by exact workflow status name.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    workflow_id:
      description: Filter by the associated workflow.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by workflow status ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/workflow_statuses:
    get:
      tags:
        - Workflow Statuses
      summary: Get workflow statuses
      responses:
        '200':
          $ref: '#/components/responses/collection_workflow_status'
      parameters:
        - $ref: '#/components/parameters/filter_workflow_status'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_workflow_status'
      operationId: workflow_statuses-index
      description: List all workflow statuses.
    post:
      tags:
        - Workflow Statuses
      summary: Create an workflow status
      responses:
        '201':
          $ref: '#/components/responses/single_workflow_status'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: workflow_statuses-create
      requestBody:
        $ref: '#/components/requestBodies/workflow_status'
      description: Create a new workflow status.
  /api/v2/workflow_statuses/{id}:
    get:
      tags:
        - Workflow Statuses
      summary: Gets a workflow status
      responses:
        '200':
          $ref: '#/components/responses/single_workflow_status'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: workflow_statuses-show
      description: Retrieve a single workflow status by ID.
    patch:
      tags:
        - Workflow Statuses
      summary: Update an workflow status
      responses:
        '200':
          $ref: '#/components/responses/single_workflow_status'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: workflow_statuses-update
      requestBody:
        $ref: '#/components/requestBodies/workflow_status'
      description: Update a workflow status.
    delete:
      tags:
        - Workflow Statuses
      summary: Deletes a workflow status and moves tasks to other workflow status
      responses:
        '204':
          description: No Content
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: workflow_statuses-destroy
      description: Delete a workflow status by ID.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_workflow_status:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - name
            - -name
            - position
            - -position
          type: string
        title: Sort workflow status
      explode: false
      required: false
      description: Sort workflow status
    filter_workflow_status:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.workflow_status at the top of this file.
      required: false
      description: Filters
  requestBodies:
    workflow_status:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - name
                      - workflow_id
                      - category_id
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_workflow_status/properties/name'
                      color_id:
                        $ref: '#/components/schemas/resource_workflow_status/properties/color_id'
                      position:
                        $ref: '#/components/schemas/resource_workflow_status/properties/position'
                      category_id:
                        $ref: '#/components/schemas/resource_workflow_status/properties/category_id'
                      workflow_id:
                        $ref: '#/components/schemas/resource_workflow_status/properties/workflow_id'
      description: Request body for creating or updating a workflow status. Specify the parent workflow, name, category (not_started, started, or closed), position, and optional color.
  schemas:
    resource_workflow_status:
      type: object
      title: Workflow status Resource
      properties:
        workflow_id:
          type: integer
          title: Workflow
          description: ID of the workflow this status belongs to.
          example:
            - 123
        position:
          type: integer
          title: Position
          description: The display order of this status within its workflow.
          example:
            eq: value
        workflow:
          title: Workflow
          description: The workflow this status belongs to.
          example:
            eq: value
        project_id:
          type: integer
          title: Project
        name:
          type: string
          title: Name
          description: The display name of this workflow status.
          example:
            eq: value
        category_id:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Category
          description: 'The lifecycle category of this status: 1=Not started, 2=Started, 3=Closed.'
          example:
            - 123
        color_id:
          type: integer
          title: Color
          description: The color identifier used to visually distinguish this status.
          example:
            - 123
        id:
          type: integer
          title: Id
          description: The unique identifier of this workflow status.
          example:
            - 123
        query:
          type: string
          title: Query
          description: Text search query to filter workflow statuses by name.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this workflow status belongs to.
          example:
            eq: value
      description: Task lifecycle status within a workflow. Belongs to a workflow and has a category_id (not_started, started, or closed) that determines how tasks in this status are counted and reported. Supports color coding and ordered positioning.
      example:
        id: '224'
        type: workflow_statuses
        attributes:
          name: In Progress
          color_id: '5'
          position: 2
          category_id: 2
        relationships:
          workflow:
            data:
              type: workflows
              id: '75'
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  responses:
    single_workflow_status:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_workflow_status/properties/name'
                      color_id:
                        $ref: '#/components/schemas/resource_workflow_status/properties/color_id'
                      position:
                        $ref: '#/components/schemas/resource_workflow_status/properties/position'
                      category_id:
                        $ref: '#/components/schemas/resource_workflow_status/properties/category_id'
                  relationships:
                    type: object
                    properties:
                      workflow:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single workflow status
    collection_workflow_status:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_workflow_status/properties/name'
                        color_id:
                          $ref: '#/components/schemas/resource_workflow_status/properties/color_id'
                        position:
                          $ref: '#/components/schemas/resource_workflow_status/properties/position'
                        category_id:
                          $ref: '#/components/schemas/resource_workflow_status/properties/category_id'
                    relationships:
                      type: object
                      properties:
                        workflow:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection workflow status
