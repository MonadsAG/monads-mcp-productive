openapi: 3.1.0
info:
  title: Productive.io API – Imports
  version: 2.0.0
paths:
  /api/v2/imports:
    get:
      tags:
        - Imports
      summary: Get imports
      operationId: imports-index
      responses:
        '200':
          $ref: '#/components/responses/collection_import'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Imports
      summary: Create an import
      operationId: imports-create
      responses:
        '201':
          $ref: '#/components/responses/single_import'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_import'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/imports/flatfile:
    post:
      tags:
        - Imports
      summary: Create a flatfile import
      operationId: imports-flatfile-flatfile
      responses:
        '200':
          $ref: '#/components/responses/single_import'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_import'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/imports/harvest_import:
    post:
      tags:
        - Imports
      summary: Create a Harvest import
      operationId: imports-harvest-import
      responses:
        '200':
          $ref: '#/components/responses/single_import'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_import'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/imports/{id}/import:
    post:
      tags:
        - Imports
      summary: Process an import
      operationId: imports-import-import
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_import'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_import'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/imports/{id}/revert:
    patch:
      tags:
        - Imports
      summary: Revert an import
      operationId: imports-revert-revert
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_import'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/imports/{id}:
    get:
      tags:
        - Imports
      summary: Gets an import
      operationId: imports-show
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_import'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Imports
      summary: Update an import
      operationId: imports-update
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_import'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_import'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content_import:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_import'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    single_import:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      creator_id:
                        $ref: '#/components/schemas/resource_import/properties/creator_id'
                      failed_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_import/properties/failed_at'
                          - type: 'null'
                      file_names:
                        anyOf:
                          - $ref: '#/components/schemas/resource_import/properties/file_names'
                          - type: 'null'
                      import_model_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_import/properties/import_model_id'
                          - type: 'null'
                      import_models:
                        anyOf:
                          - $ref: '#/components/schemas/resource_import/properties/import_models'
                          - type: 'null'
                      import_type_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_import/properties/import_type_id'
                          - type: 'null'
                      processed_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_import/properties/processed_at'
                          - type: 'null'
                      reverted_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_import/properties/reverted_at'
                          - type: 'null'
                      sample:
                        anyOf:
                          - $ref: '#/components/schemas/resource_import/properties/sample'
                          - type: 'null'
                      started_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_import/properties/started_at'
                          - type: 'null'
                  relationships:
                    type: object
                    properties:
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              included:
                type: array
                items: {}
              meta:
                $ref: '#/components/schemas/_meta'
      description: Single import
    collection_import:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        creator_id:
                          $ref: '#/components/schemas/resource_import/properties/creator_id'
                        failed_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_import/properties/failed_at'
                            - type: 'null'
                        file_names:
                          anyOf:
                            - $ref: '#/components/schemas/resource_import/properties/file_names'
                            - type: 'null'
                        import_model_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_import/properties/import_model_id'
                            - type: 'null'
                        import_models:
                          anyOf:
                            - $ref: '#/components/schemas/resource_import/properties/import_models'
                            - type: 'null'
                        import_type_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_import/properties/import_type_id'
                            - type: 'null'
                        processed_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_import/properties/processed_at'
                            - type: 'null'
                        reverted_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_import/properties/reverted_at'
                            - type: 'null'
                        sample:
                          anyOf:
                            - $ref: '#/components/schemas/resource_import/properties/sample'
                            - type: 'null'
                        started_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_import/properties/started_at'
                            - type: 'null'
                    relationships:
                      type: object
                      properties:
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              included:
                type: array
                items: {}
              meta:
                $ref: '#/components/schemas/_meta'
      description: Collection import
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_import:
      enum:
        - account_not_verified
        - bad_decimal_format
        - feature_unavailable
        - harvest_import_feature_unavailable
        - import_data_empty
        - import_data_invalid
        - import_models_unsupported
        - invalid_attribute_value
        - non_finite_number
        - null_bytes_in_params
        - project_not_accessible
        - task_list_not_accessible
      type: string
      title: Error Code
      description: Every error `code` the imports endpoints can return in a 422 response.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_not_acceptable:
      enum:
        - bulk_extensions_headers_invalid
        - not_acceptable
        - read_only_mode_violation
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 406.
    error_code_not_found:
      enum:
        - not_found
        - record_not_found
        - route_not_found
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 404.
    error_code_forbidden:
      enum:
        - access_denied
        - account_inactive
        - agent_role_impersonation_denied
        - automatic_invoicing_not_manageable
        - billing_catalog_list_unavailable
        - booking_conflict_resolver_unavailable
        - budget_inaccessible
        - budgets_not_manageable
        - cascade_deletion_blocked
        - custom_roles_unavailable
        - deactivated_organization
        - deal_proposal_analytics_unavailable
        - deal_proposal_public_link_unavailable
        - document_styler_unavailable
        - document_templates_unavailable
        - email_inbox_unavailable
        - entry_not_editable
        - expense_not_editable
        - feature_unavailable
        - finalized_invoice_permission
        - financials_unavailable
        - impersonation_on_account_not_allowed
        - insufficient_automation_permission
        - insufficient_project_access
        - insufficient_seats
        - invalid_impersonate_role_id_header
        - invoices_unavailable
        - login_unavailable
        - mcp_access_disabled
        - mcp_connectors_disabled
        - mcp_provider_unavailable
        - missing_slack_integration
        - no_client_access
        - no_organization_id
        - no_person
        - no_sandbox_access
        - organization_red_flagged
        - other_timer_running
        - outgoing_emails_limit_exceeded
        - payment_reminders_unavailable
        - personal_access_token_limit_exceeded
        - pipelines_limit_exceeded
        - placeholders_limit_exceeded
        - plan_limit_exceeded
        - plan_unavailable
        - private_channel_forbidden
        - recipients_limit_exceeded
        - record_not_owned
        - report_templates_unavailable
        - restricted_email_in_trialing
        - role_bill_rate_unavailable
        - role_impersonate_denied
        - select_organization
        - service_inaccessible
        - service_type_inaccessible
        - single_sign_on_invalid
        - single_sign_on_login_only
        - single_sign_on_provision_failed
        - single_sign_on_unavailable
        - subscription_expired
        - subsidiaries_unavailable
        - subsidiary_out_of_scope
        - teams_limit_exceeded
        - two_factor_login
        - unallocated_expense_inaccessible
        - webooks_limit_exceeded
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 403.
    error_code_unauthorized:
      enum:
        - invalid_auth_token
        - invalid_password
        - invalid_proposal_token
        - invalid_token_signature
        - token_expired
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 401.
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_single_linkage_nullable'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          required:
            - included
          example:
            included: false
      required:
        - meta
      example:
        meta:
          included: false
    _single_linkage_nullable:
      type: object
      title: Single nullable linkage
      properties:
        data:
          anyOf:
            - $ref: '#/components/schemas/_resource'
            - type: 'null'
      required:
        - data
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: string
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      required:
        - id
        - type
      example:
        type: tasks
        id: '42'
    resource_import:
      type: object
      title: Import Resource
      properties:
        creator:
          title: Creator
        creator_id:
          type: integer
          title: Creator Id
        failed_at:
          type: string
