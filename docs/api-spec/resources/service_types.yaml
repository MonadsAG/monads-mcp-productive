    service_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a service type.
            properties:
              data:
                type: object
                description: The service type resource object.
                properties:
                  attributes:
                    type: object
                    description: Service type attributes.
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_service_type/properties/name'
                    required:
