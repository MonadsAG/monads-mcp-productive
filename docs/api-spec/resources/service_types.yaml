openapi: 3.1.0
info:
  title: Productive.io API – Service Types
  version: 2.0.0
description: |-
  For more details about what service types are, please refer to the [help article](https://help.productive.io/en/articles/2179629-service-types-building-blocks-of-your-budget).

  The service type object represents one category or type for a service your company offers. This categorization helps in organizing your workflows, time tracking and analyzing profitability.

  Following diagram shows service types in our data hierarchy:

  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  person: Person
  service_type: ServiceType {
    class: primary
  }
  service_type_assignment: ServiceTypeAssignment

  # define connections
  person -> service_type_assignment
  service_type -> service_type_assignment
  ```
x-filters:
  service_type:
    name:
      description: Filter by service type name (exact match).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Search service types by name (supports contains, exact, and exclusion operators).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter to service types assigned to the specified person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by status (active or archived).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by service type ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/service_types/{id}/archive:
    patch:
      tags:
        - Service Types
      summary: Archives a service type
      responses:
        '200':
          $ref: '#/components/responses/single_service_type'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: service_types-archive-archive
      description: Archive a service type to deactivate it.
  /api/v2/service_types:
    get:
      tags:
        - Service Types
      summary: Get service types
      responses:
        '200':
          $ref: '#/components/responses/collection_service_type'
      parameters:
        - $ref: '#/components/parameters/sort_service_type'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_service_type'
      operationId: service_types-index
      description: List all service types.
    post:
      tags:
        - Service Types
      summary: Create a service type
      responses:
        '201':
          $ref: '#/components/responses/single_service_type'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: service_types-create
      requestBody:
        $ref: '#/components/requestBodies/service_type'
      description: Create a new service type.
  /api/v2/service_types/merge:
    patch:
      tags:
        - Service Types
      summary: Merge a service type
      responses:
        '200':
          $ref: '#/components/responses/single_service_type'
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: service_types-merge-merge
      description: Merge two or more service types into one.
  /api/v2/service_types/{id}:
    get:
      tags:
        - Service Types
      summary: Gets a service type
      responses:
        '200':
          $ref: '#/components/responses/single_service_type'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: service_types-show
      description: Retrieve a single service type by ID.
    patch:
      tags:
        - Service Types
      summary: Update a service type
      responses:
        '200':
          $ref: '#/components/responses/single_service_type'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: service_types-update
      requestBody:
        $ref: '#/components/requestBodies/service_type'
      description: Update a service type.
components:
  requestBodies:
    service_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_service_type/properties/name'
      description: Request body for creating or updating a service type.
  schemas:
    resource_service_type:
      type: object
      title: Service type Resource
      properties:
        organization:
          title: Organization
          description: The organization this service type belongs to.
          example:
            eq: value
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
          description: 'The archival status of this service type: active or archived.'
          example:
            eq: active
        id:
          type: integer
          title: Id
          description: The unique identifier of this service type.
          example:
            - 123
        person_id:
          type: integer
          title: Person
          description: ID of the person used to filter service types by assignee.
          example:
            - 123
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this service type was archived, or null if active.
          example:
            gt: '2026-01-01'
        assignees:
          title: Assignees
          description: Array of people assigned to this service type.
          example:
            eq: value
        query:
          type: string
          title: Query
          description: A search query string used to filter service types by name.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The name of this service type.
          example:
            eq: value
      description: Represents a category of work an organization delivers, used to classify services on deals and budgets.
      example:
        id: '123'
        type: service_types
        attributes:
          name: Design
          billing_type: hourly
        relationships: {}
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    _collection_relationship:
      anyOf:
        - type: object
          title: Collection data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          description: Included variant — related resource identifiers are present in `data`.
          example:
            data:
              - type: tasks
                id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_service_type:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.service_type at the top of this file.
      required: false
      description: Filters
    sort_service_type:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort service type
      explode: false
      required: false
      description: Sort service type
  responses:
    single_service_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_service_type/properties/name'
                      archived_at:
                        $ref: '#/components/schemas/resource_service_type/properties/archived_at'
                  relationships:
                    type: object
                    properties:
                      assignees:
                        $ref: '#/components/schemas/_collection_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single service type
    collection_service_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_service_type/properties/name'
                        archived_at:
                          $ref: '#/components/schemas/resource_service_type/properties/archived_at'
                    relationships:
                      type: object
                      properties:
                        assignees:
                          $ref: '#/components/schemas/_collection_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection service type
