                      time_unlocked_interval:
                        $ref: '#/components/schemas/resource_person/properties/time_unlocked_interval'
                      time_tracking_policy_id:
                        $ref: '#/components/schemas/resource_person/properties/time_tracking_policy_id'
                      time_unlocked_period_id:
                        $ref: '#/components/schemas/resource_person/properties/time_unlocked_period_id'
                      time_unlocked_start_date:
                        $ref: '#/components/schemas/resource_person/properties/time_unlocked_start_date'
                      timesheet_submission_disabled:
                        $ref: '#/components/schemas/resource_person/properties/timesheet_submission_disabled'
                  relationships:
                    type: object
                    properties:
                      teams:
                        $ref: '#/components/schemas/_collection_relationship'
                      import:
                        $ref: '#/components/schemas/_single_relationship'
                      company:
                        $ref: '#/components/schemas/_single_relationship'
                      manager:
                        $ref: '#/components/schemas/_single_relationship'
                      job_role:
                        $ref: '#/components/schemas/_single_relationship'
                      subsidiary:
                        $ref: '#/components/schemas/_single_relationship'
                      custom_role:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      service_types:
                        $ref: '#/components/schemas/_collection_relationship'
                      custom_field_people:
                        $ref: '#/components/schemas/_collection_relationship'
                      time_tracking_policy:
                        $ref: '#/components/schemas/_single_relationship'
                      custom_field_attachments:
                        $ref: '#/components/schemas/_collection_relationship'
                      approval_policy_assignment:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single person
    collection_person:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        agent:
                          $ref: '#/components/schemas/resource_person/properties/agent'
                        email:
                          $ref: '#/components/schemas/resource_person/properties/email'
                        title:
                          $ref: '#/components/schemas/resource_person/properties/title'
                        contact:
                          $ref: '#/components/schemas/resource_person/properties/contact'
                        is_user:
                          $ref: '#/components/schemas/resource_person/properties/is_user'
                        role_id:
                          $ref: '#/components/schemas/resource_person/properties/role_id'
                        user_id:
                          $ref: '#/components/schemas/resource_person/properties/user_id'
                        virtual:
                          $ref: '#/components/schemas/resource_person/properties/virtual'
                        champion:
                          $ref: '#/components/schemas/resource_person/properties/champion'
                        color_id:
                          $ref: '#/components/schemas/resource_person/properties/color_id'
                        nickname:
                          $ref: '#/components/schemas/resource_person/properties/nickname'
                        tag_list:
