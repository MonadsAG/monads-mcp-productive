paths:
  /api/v2/people/{id}/activate:
    patch:
      tags:
        - People
      summary: Activate a person
      operationId: people-activate-activate
      description: Reactivate a previously deactivated person, restoring their access to the organization.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_person'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/people/{id}/archive:
    patch:
      tags:
        - People
      summary: Archive a person
      operationId: people-archive-archive
      description: Archive a person record. Archived people are hidden from most views and cannot log in.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_person'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/people:
    get:
      tags:
        - People
      summary: Get people
      operationId: people-index
      description: List people in the organization. Supports filtering by name, email, type, status, team, company, manager, tags, and custom fields.
      parameters:
        - $ref: '#/components/parameters/filter_person'
        - $ref: '#/components/parameters/sort_person'
      responses:
        '200':
          $ref: '#/components/responses/collection_person'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - People
      summary: Create a person
      operationId: people-create
      description: Create a new person. Depending on the role and company assignment, the person will be classified as an employee, contractor, client contact, or placeholder.
      requestBody:
        $ref: '#/components/requestBodies/person'
      responses:
        '201':
          $ref: '#/components/responses/single_person'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_person'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/people/{id}/deactivate:
    patch:
      tags:
        - People
      summary: Deactivate a person
      operationId: people-deactivate-deactivate
      description: Deactivate a person, removing their platform access. Their data is retained.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_person'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/people/{id}/invite:
    patch:
      tags:
        - People
      summary: Invite a person
      operationId: people-invite-invite
      description: |
        Action used to invite contacts into your Productive organization. By doing so, the contact can accept that invitation and then become a user.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_person'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/people/merge:
    patch:
      tags:
        - People
      summary: Merge a person
      operationId: people-merge-merge
      description: Merge two person records into one, transferring all associated data to the target person.
      responses:
        '200':
          $ref: '#/components/responses/single_person'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
