  /api/v2/people/{id}/regenerate_recovery_codes:
    patch:
      tags:
        - People
      summary: Regenerate 2FA recovery codes
      operationId: people-regenerate_recovery_codes-regenerate_recovery_codes
      description: Regenerate two-factor authentication recovery codes for the person.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_person'
        '204':
          content:
            any: {}
          headers: {}
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/people/{id}/resend:
    patch:
      tags:
        - People
      summary: Resend email to a person
      operationId: people-resend-resend
      description: Resend the invitation email to a person who has not yet accepted their invite.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
