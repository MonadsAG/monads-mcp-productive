openapi: 3.1.0
info:
  title: Productive.io API – People
  version: 2.0.0
description: |-
  Every person in an organization is a `people` record. The `person_type` filter distinguishes four kinds:

  - **User**: has a Productive login and can sign in. Employees, contractors and client users are all users.
  - **Contact**: a person record without a login, typically someone at a client company kept for CRM and communication. Cannot sign in or track time.
  - **Placeholder**: a named slot used in resource planning to book time before a real person is hired or assigned. Has no login.
  - **Agent**: an AI agent acting inside the organization on behalf of its manager.

  For more details on how to work with custom fields please refer to [Working with custom fields](https://developer.productive.io/working_with_custom_fields.html#working_with_custom_fields) guide.

  ### Creating and inviting a person

  Adding a person takes two requests.

  1. **`POST /api/v2/people`** creates the person record. It has no login yet and appears as a **Contact** in the `person_type` filter. `company_id` and `role_id` are required, and the person needs an `email` before it can be invited.
  2. **`PATCH /api/v2/people/{id}/invite`** turns the record into a **User**. It creates or links the user account for the email, applies `company_id`, `custom_role_id` and, for time tracker roles, `subsidiary_id`, and sends the invitation email.

  #### `skip_invite`

  Add `?skip_invite=true` to the invite request to create and link the user account without sending the email. The person is marked `virtual: true` and `invited_at` stays empty.

  Use it when you are importing people who should exist in planning, reports and time tracking but should not get access yet, or ever. Do not use it for people who need to sign in, since no email is sent and `PATCH /api/v2/people/{id}/resend` does nothing for virtual people.
