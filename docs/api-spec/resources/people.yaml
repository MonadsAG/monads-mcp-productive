openapi: 3.1.0
info:
  title: Productive.io API – People
  version: 2.0.0
description: For more details on how to work with custom fields please refer to [Working with custom fields](https://developer.productive.io/working_with_custom_fields.html#working_with_custom_fields) guide.
x-filters:
  person:
    team:
      description: Filter by team ID — returns people who belong to the specified team(s).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by person ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_id:
      description: Filter by service ID — returns people who can track time on the specified service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    accessible_doc_id:
      description: Filter by accessible doc ID — returns people who have access to the specified document.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subscribable_id:
      description: Filter by subscribable ID — used with subscribable_type to return subscribers of a resource.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_type:
      description: 'Filter by person type: user (can log in), contact (external), placeholder (resource planning).'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    manager_id:
      description: Filter by the person's manager.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_type_id:
      description: Filter by service type ID — returns people assigned to the specified service types.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    offboarding_status:
      description: Filter by offboarding status (e.g. active, in-progress).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subscribable_type:
      description: Filter by subscribable type — the resource type to match subscribers against.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    job_role_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    accessible_project_id:
      description: Filter by accessible project ID — returns people who have access to the specified project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by project ID — returns people who are members of the specified project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    two_factor_auth:
      description: Filter by two-factor authentication status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    jump_query:
      description: Quick jump search filter — matches against name for navigation shortcuts.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    role_id:
      description: Filter by built-in role type ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_name:
      description: Filter by last name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookings_before:
      description: Filter by bookings_before date — returns people with bookings starting on or before this date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: 'Filter by person status: 1 (active) or 2 (deactivated).'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    eligible_replacement_managers:
      description: Filter for eligible replacement managers — returns people who could replace the specified person as a manager.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_activity_at:
      description: Filter by the date of the person's last activity (last_activity_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filter by creation date range (created_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    approval_policy_id:
      description: Filter by the person's assigned approval policy.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_role_id:
      description: Filter by custom role (permission set) ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    accessible_deal_id:
      description: Filter by accessible deal ID — returns people who have access to the specified deal.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    time_tracking_policy_id:
      description: Filter by the person's assigned time tracking policy.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    shared_seat:
      operators:
        - eq
        - not_eq
    autotracking:
      description: Filter by autotracking (automatic time tracking) status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookings_after:
      description: Filter by bookings_after date — returns people with bookings ending on or after this date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    tags:
      description: Filter by tag.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    joined_at:
      description: Filter by the date the person joined the organization (joined_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    first_name:
      description: Filter by first name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    timesheet_submission_disabled:
      description: Filter by whether timesheet submission is disabled for the person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Text search filter — matches by full name (exact) or contains partial name.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    full_query:
      description: Full text search filter — matches against name and other indexed fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_watching:
      description: Filter by project_watching — returns people who are auto-subscribed to the specified project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    holiday_calendar_id:
      description: Filter by the person's assigned holiday calendar.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    virtual:
      description: Filter by virtual status — whether this is a virtual person record.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    schedulable:
      description: Filter for schedulable people — returns employees, contractors, and placeholders who can be booked.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter by the person's subsidiary.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_fields:
      description: Filter by custom field values.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    hrm_type_id:
      description: 'Filter by HRM type: 1 for employee (time tracker), 2 for contact.'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    fuzzy_people:
      description: Fuzzy people filter for approximate person name matching.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    permissions:
      description: Filter by permission set — returns people with the specified permission slugs.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deactivated_at:
      description: Filter by deactivation date range (deactivated_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    email:
      description: Filter by email address (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by company (client) ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_seen_at:
      description: Filter by the date the person was last seen (last_seen_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    accessible_filter_id:
      description: Filter by accessible filter ID — returns people who are members of the specified saved filter.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    approval_workflow_id:
      description: Filter by approval workflow ID — returns people who have approvals in the specified workflow.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    agent:
      description: Filter by whether the person is an AI agent.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    archived_at:
      description: Filter by archival date range (archived_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    title:
      description: Filter by job title (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    fuzzy_dates:
      description: Fuzzy date filter for approximate date matching.
      operators:
        - eq
        - not_eq
paths:
  /api/v2/people/{id}/activate:
    patch:
      tags:
        - People
      summary: Activate a person
      responses:
        '200':
          $ref: '#/components/responses/single_person'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: people-activate-activate
      description: Reactivate a previously deactivated person, restoring their access to the organization.
  /api/v2/people/{id}/archive:
    patch:
      tags:
        - People
      summary: Archive a person
      responses:
        '200':
          $ref: '#/components/responses/single_person'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: people-archive-archive
      description: Archive a person record. Archived people are hidden from most views and cannot log in.
  /api/v2/people:
    get:
      tags:
        - People
      summary: Get people
      responses:
        '200':
          $ref: '#/components/responses/collection_person'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_person'
        - $ref: '#/components/parameters/filter_person'
      operationId: people-index
      description: List people in the organization. Supports filtering by name, email, type, status, team, company, manager, tags, and custom fields.
    post:
      tags:
        - People
      summary: Create a person
      responses:
        '201':
          $ref: '#/components/responses/single_person'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: people-create
      requestBody:
        $ref: '#/components/requestBodies/person'
      description: Create a new person. Depending on the role and company assignment, the person will be classified as an employee, contractor, client contact, or placeholder.
  /api/v2/people/{id}/deactivate:
    patch:
      tags:
        - People
      summary: Deactivate a person
      responses:
        '200':
          $ref: '#/components/responses/single_person'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: people-deactivate-deactivate
      description: Deactivate a person, removing their platform access. Their data is retained.
  /api/v2/people/{id}/invite:
    patch:
      tags:
        - People
      summary: Invite a person
      responses:
        '200':
          $ref: '#/components/responses/single_person'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: people-invite-invite
      description: |
        Action used to invite contacts into your Productive organization. By doing so, the contact can accept that invitation and then become a user.
  /api/v2/people/merge:
    patch:
      tags:
        - People
      summary: Merge a person
      responses:
        '200':
          $ref: '#/components/responses/single_person'
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: people-merge-merge
      description: Merge two person records into one, transferring all associated data to the target person.
  /api/v2/people/{id}/regenerate_recovery_codes:
    patch:
      tags:
        - People
      summary: Regenerate 2FA recovery codes
      responses:
        '200':
          $ref: '#/components/responses/single_person'
        '204':
          content:
            any: {}
          headers: {}
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: people-regenerate_recovery_codes-regenerate_recovery_codes
      description: Regenerate two-factor authentication recovery codes for the person.
  /api/v2/people/{id}/resend:
    patch:
      tags:
        - People
      summary: Resend email to a person
      responses:
        '200':
          $ref: '#/components/responses/single_person'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: people-resend-resend
      description: Resend the invitation email to a person who has not yet accepted their invite.
  /api/v2/people/{id}/restore:
    patch:
      tags:
        - People
      summary: Restore a person
      responses:
        '200':
          $ref: '#/components/responses/single_person'
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: The person could not be restored due to validation errors.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: people-restore-restore
      description: Restore an archived person, making them active again.
  /api/v2/people/{id}:
    get:
      tags:
        - People
      summary: Get a person
      responses:
        '200':
          $ref: '#/components/responses/single_person'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: people-show
      description: Retrieve a single person by ID.
    patch:
      tags:
        - People
      summary: Update a person
      responses:
        '200':
          $ref: '#/components/responses/single_person'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: people-update
      requestBody:
        $ref: '#/components/requestBodies/person'
      description: Update an existing person's attributes, relationships, or settings.
  /api/v2/people/{id}/virtualize:
    patch:
      tags:
        - People
      summary: Virtualize a person
      responses:
        '200':
          $ref: '#/components/responses/single_person'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: people-virtualize-virtualize
      description: Convert a person to a virtual (non-seat) record, used for system or integration purposes.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_person:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.person at the top of this file.
      required: false
      description: Filters
    sort_person:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - autotracking
            - -autotracking
            - company_name
            - -company_name
            - custom_fields
            - -custom_fields
            - custom_role
            - -custom_role
            - email
            - -email
            - job_role
            - -job_role
            - joined_at
            - -joined_at
            - last_seen_at
            - -last_seen_at
            - manager
            - -manager
            - name
            - -name
            - resource_request_match
            - -resource_request_match
            - role_id
            - -role_id
            - schedulable
            - -schedulable
            - subsidiary
            - -subsidiary
            - title
            - -title
            - two_factor_auth
            - -two_factor_auth
          type: string
        title: Sort person
      explode: false
      required: false
      description: Sort person
  responses:
    single_person:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      agent:
                        $ref: '#/components/schemas/resource_person/properties/agent'
                      email:
                        $ref: '#/components/schemas/resource_person/properties/email'
                      title:
                        $ref: '#/components/schemas/resource_person/properties/title'
                      contact:
                        $ref: '#/components/schemas/resource_person/properties/contact'
                      is_user:
                        $ref: '#/components/schemas/resource_person/properties/is_user'
                      role_id:
                        $ref: '#/components/schemas/resource_person/properties/role_id'
                      user_id:
                        $ref: '#/components/schemas/resource_person/properties/user_id'
                      virtual:
                        $ref: '#/components/schemas/resource_person/properties/virtual'
                      champion:
                        $ref: '#/components/schemas/resource_person/properties/champion'
                      color_id:
                        $ref: '#/components/schemas/resource_person/properties/color_id'
                      nickname:
                        $ref: '#/components/schemas/resource_person/properties/nickname'
                      tag_list:
                        $ref: '#/components/schemas/resource_person/properties/tag_list'
                      joined_at:
                        $ref: '#/components/schemas/resource_person/properties/joined_at'
                      last_name:
                        $ref: '#/components/schemas/resource_person/properties/last_name'
                      avatar_url:
                        $ref: '#/components/schemas/resource_person/properties/avatar_url'
                      created_at:
                        $ref: '#/components/schemas/resource_person/properties/created_at'
                      first_name:
                        $ref: '#/components/schemas/resource_person/properties/first_name'
                      invited_at:
                        $ref: '#/components/schemas/resource_person/properties/invited_at'
                      archived_at:
                        $ref: '#/components/schemas/resource_person/properties/archived_at'
                      external_id:
                        $ref: '#/components/schemas/resource_person/properties/external_id'
                      hrm_type_id:
                        $ref: '#/components/schemas/resource_person/properties/hrm_type_id'
                      placeholder:
                        $ref: '#/components/schemas/resource_person/properties/placeholder'
                      sample_data:
                        $ref: '#/components/schemas/resource_person/properties/sample_data'
                      status_text:
                        $ref: '#/components/schemas/resource_person/properties/status_text'
                      autotracking:
                        $ref: '#/components/schemas/resource_person/properties/autotracking'
                      last_seen_at:
                        $ref: '#/components/schemas/resource_person/properties/last_seen_at'
                      status_emoji:
                        $ref: '#/components/schemas/resource_person/properties/status_emoji'
                      custom_fields:
                        $ref: '#/components/schemas/resource_person/properties/custom_fields'
                      external_sync:
                        $ref: '#/components/schemas/resource_person/properties/external_sync'
                      time_unlocked:
                        $ref: '#/components/schemas/resource_person/properties/time_unlocked'
                      availabilities:
                        $ref: '#/components/schemas/resource_person/properties/availabilities'
                      deactivated_at:
                        $ref: '#/components/schemas/resource_person/properties/deactivated_at'
                      offboarding_id:
                        $ref: '#/components/schemas/resource_person/properties/offboarding_id'
                      two_factor_auth:
                        $ref: '#/components/schemas/resource_person/properties/two_factor_auth'
                      last_activity_at:
                        $ref: '#/components/schemas/resource_person/properties/last_activity_at'
                      time_unlocked_on:
                        $ref: '#/components/schemas/resource_person/properties/time_unlocked_on'
                      status_expires_at:
