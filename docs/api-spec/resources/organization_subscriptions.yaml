openapi: 3.1.0
info:
  title: Productive.io API – Organization Subscriptions
  version: 2.0.0
description: |-
  **Organization subscriptions** represent the current pricing plan and active feature entitlements for an organization.

  Query subscription details to determine which modules and limits apply — such as maximum seats, advanced reporting, or resource planning. Subscriptions reflect the organization's billing tier and control access to premium features.
paths:
  /api/v2/organization_subscriptions/{id}/allocate_seats:
    patch:
      tags:
        - Organization Subscriptions
      summary: Allocates the seats of a billing group to its organization subscriptions
      operationId: organization_subscriptions-allocate_seats-allocate_seats
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_organization_subscription'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/organization_subscriptions/{id}/cancel:
    patch:
      tags:
        - Organization Subscriptions
      summary: Cancels a organization subscription
      operationId: organization_subscriptions-cancel-cancel
      description: Cancel an organization subscription.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_organization_subscription'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_organization_subscription'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
        '503':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Service Unavailable
  /api/v2/organization_subscriptions/{id}/cancel_trial:
    patch:
      tags:
        - Organization Subscriptions
      summary: Cancels the trial plan of a organization subscription
      operationId: organization_subscriptions-cancel_trial-cancel_trial
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_organization_subscription'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/organization_subscriptions/{id}/create_setup_intent:
    post:
      tags:
        - Organization Subscriptions
      summary: Creates a Stripe card setup intent for a organization subscription
      operationId: organization_subscriptions-create_setup_intent-create_setup_intent
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_secret:
                    type: string
                required:
                  - client_secret
          description: The client secret of the created setup intent
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/organization_subscriptions/{id}/reactivate:
    patch:
      tags:
        - Organization Subscriptions
      summary: Reactivates a organization subscription
      operationId: organization_subscriptions-reactivate-reactivate
      description: Reactivate a cancelled organization subscription.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_organization_subscription'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '405':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Method Not Allowed
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_organization_subscription'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
        '503':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Service Unavailable
  /api/v2/organization_subscriptions/{id}/retry_last_payment:
    patch:
      tags:
        - Organization Subscriptions
      summary: Retry last payment for a organization subscription
      operationId: organization_subscriptions-retry_last_payment-retry_last_payment
      description: Retry the last failed payment for an organization subscription.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_organization_subscription'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/organization_subscriptions/{id}:
    get:
      tags:
        - Organization Subscriptions
      summary: Gets a organization subscription
      operationId: organization_subscriptions-show
      description: Retrieve a single organization subscription.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_organization_subscription'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Organization Subscriptions
      summary: Update a organization subscription
      operationId: organization_subscriptions-update
      description: Update an organization subscription.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/organization_subscription'
      responses:
        '200':
          $ref: '#/components/responses/single_organization_subscription'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '402':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Payment Required
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_organization_subscription'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content_organization_subscription:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_organization_subscription'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    single_organization_subscription:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single organization_subscription record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned organization_subscription resource.
                properties:
                  attributes:
                    type: object
                    description: Organization subscription attributes.
                    properties:
                      balance:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/balance'
                      billing_address:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/billing_address'
                          - type: 'null'
                        description: The billing address for the subscription.
                      billing_email:
                        anyOf:
                          - type: string
                          - type: 'null'
                        description: The email address used for billing notifications.
                      billing_group_admin:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/billing_group_admin'
                      billing_group_member:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/billing_group_member'
                      billing_group_seats:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/billing_group_seats'
                          - type: 'null'
                        description: The total number of seats allocated across billing group members.
                      card_brand:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/card_brand'
                          - type: 'null'
                        description: The brand of the credit card on file (e.g. Visa, Mastercard).
                      card_last4:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/card_last4'
                          - type: 'null'
                        description: The last 4 digits of the credit card on file.
                      card_month:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/card_month'
                          - type: 'null'
                        description: The expiry month of the credit card on file.
                      card_year:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/card_year'
                          - type: 'null'
                        description: The expiry year of the credit card on file.
                      contract_date:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/contract_date'
                          - type: 'null'
                        description: The date from which the contract terms take effect.
                      contract_min_seats:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/contract_min_seats'
                          - type: 'null'
                        description: The minimum number of seats committed in the contract.
                      contract_seats:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/contract_seats'
                          - type: 'null'
                        description: The total number of seats committed in the contract.
                      current_plan:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/current_plan'
                      current_products:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/current_products'
                      discount:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/discount'
                          - type: 'null'
                        description: The discount percentage applied to the subscription.
                      discount_expires_on:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/discount_expires_on'
                          - type: 'null'
                        description: The date when the current discount expires.
                      grace_period_ends_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/grace_period_ends_at'
                          - type: 'null'
                        description: The timestamp when the grace period ends for a past-due subscription.
                      next_billing_cycle_at:
                        anyOf:
                          - type: string
                          - type: 'null'
                        description: The timestamp when the next billing cycle starts.
                      payment_method_id:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/payment_method_id'
                      plan_cycle:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/plan_cycle'
                      plan_price:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/plan_price'
                      plan_type:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/plan_type'
                      product_types:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/product_types'
                      seats:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/seats'
                      seats_pending:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/seats_pending'
                      seats_used:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/seats_used'
                      stripe_customer_id:
                        anyOf:
                          - type: string
                          - type: 'null'
                        description: The Stripe customer ID associated with the organization.
                      subscription_ended_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/subscription_ended_at'
                          - type: 'null'
                        description: The timestamp when the subscription ended.
                      subscription_started_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/subscription_started_at'
                          - type: 'null'
                        description: The timestamp when the subscription started.
                      subscription_state_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/subscription_state_id'
                          - type: 'null'
                        description: The current subscription state identifier (e.g. trialing, active, past_due, unpaid).
                      trial_ends_at:
                        anyOf:
                          - type: string
                          - type: 'null'
                        description: The date when the free trial period ends.
                      trial_plan_active:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/trial_plan_active'
                      trial_plan_ends_at:
                        anyOf:
                          - type: string
                          - type: 'null'
                        description: The date when the trial plan ends.
                      trial_plan_type:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/trial_plan_type'
                      collection_method_id:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/collection_method_id'
                      trial_product_ids:
                        type: array
                        items:
                          type: string
                        description: An array of product IDs included in the trial subscription.
                      trial_ends_on:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/trial_ends_on'
                          - type: 'null'
                      trial_plan_ends_on:
                        anyOf:
                          - $ref: '#/components/schemas/resource_organization_subscription/properties/trial_plan_ends_on'
                          - type: 'null'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Organization subscription relationships.
                    properties:
                      billing_group_members:
                        $ref: '#/components/schemas/_collection_relationship'
                      billing_group_owner:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '1'
                type: organization_subscriptions
                attributes:
                  seats: 25
                  seats_used: 18
                  seats_max: 30
                  trial_ends_on: null
                  contract_date: '2026-01-01'
                  contract_end_date: '2026-12-31'
                  contract_seats: 25
                  current_plan: business
                  currency: USD
              included: []
      description: Single organization subscription
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
