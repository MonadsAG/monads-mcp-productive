openapi: 3.1.0
info:
  title: Productive.io API – Organization Subscriptions
  version: 2.0.0
description: |-
  **Organization subscriptions** represent the current pricing plan and active feature entitlements for an organization.

  Query subscription details to determine which modules and limits apply — such as maximum seats, advanced reporting, or resource planning. Subscriptions reflect the organization's billing tier and control access to premium features.
paths:
  /api/v2/organization_subscriptions/{id}/cancel:
    patch:
      tags:
        - Organization Subscriptions
      summary: Cancels a organization subscription
      operationId: organization_subscriptions-cancel-cancel
      description: Cancel an organization subscription.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_organization_subscription'
        '503':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Service Unavailable
  /api/v2/organization_subscriptions/{id}/reactivate:
    patch:
      tags:
        - Organization Subscriptions
      summary: Reactivates a organization subscription
      operationId: organization_subscriptions-reactivate-reactivate
      description: Reactivate a cancelled organization subscription.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_organization_subscription'
        '405':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Method Not Allowed
        '503':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Service Unavailable
  /api/v2/organization_subscriptions/{id}/retry_last_payment:
    patch:
      tags:
        - Organization Subscriptions
      summary: Retry last payment for a organization subscription
      operationId: organization_subscriptions-retry_last_payment-retry_last_payment
      description: Retry the last failed payment for an organization subscription.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_organization_subscription'
  /api/v2/organization_subscriptions/{id}:
    get:
      tags:
        - Organization Subscriptions
      summary: Gets a organization subscription
      operationId: organization_subscriptions-show
      description: Retrieve a single organization subscription.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_organization_subscription'
    patch:
      tags:
        - Organization Subscriptions
      summary: Update a organization subscription
      operationId: organization_subscriptions-update
      description: Update an organization subscription.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/organization_subscription'
      responses:
        '200':
          $ref: '#/components/responses/single_organization_subscription'
        '402':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Payment Required
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
components:
  responses:
    single_organization_subscription:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single organization_subscription record in JSON:API format.
            properties:
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              data:
                type: object
                description: The JSON:API data object for the returned organization_subscription resource.
                properties:
                  relationships:
                    type: object
                    description: Organization subscription relationships.
                    properties:
                      billing_group_members:
                        $ref: '#/components/schemas/_collection_relationship'
                      billing_group_owner:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                  attributes:
                    type: object
                    description: Organization subscription attributes.
                    properties:
                      trial_plan_type:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/trial_plan_type'
                      product_types:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/product_types'
                      trial_plan_active:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/trial_plan_active'
                      collection_method_id:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/collection_method_id'
                      contract_seats:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/contract_seats'
                      grace_period_ends_at:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/grace_period_ends_at'
                      subscription_ended_at:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/subscription_ended_at'
                      card_last4:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/card_last4'
                      subscription_state_id:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/subscription_state_id'
                      seats_used:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/seats_used'
                      current_products:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/current_products'
                      trial_ends_at:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/trial_ends_at'
                      billing_group_member:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/billing_group_member'
                      card_brand:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/card_brand'
                      balance:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/balance'
                      card_month:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/card_month'
                      plan_type:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/plan_type'
                      seats:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/seats'
                      contract_date:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/contract_date'
                      trial_plan_ends_at:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/trial_plan_ends_at'
                      card_year:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/card_year'
                      billing_group_seats:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/billing_group_seats'
                      payment_method_id:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/payment_method_id'
                      plan_cycle:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/plan_cycle'
                      stripe_customer_id:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/stripe_customer_id'
                      billing_email:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/billing_email'
                      seats_pending:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/seats_pending'
                      current_plan:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/current_plan'
                      trial_product_ids:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/trial_product_ids'
                      contract_min_seats:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/contract_min_seats'
                      discount:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/discount'
                      subscription_started_at:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/subscription_started_at'
                      plan_price:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/plan_price'
                      billing_group_admin:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/billing_group_admin'
                      billing_address:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/billing_address'
                      next_billing_cycle_at:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/next_billing_cycle_at'
                      discount_expires_on:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/discount_expires_on'
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                id: '1'
                type: organization_subscriptions
                attributes:
                  seats: 25
                  seats_used: 18
                  seats_max: 30
                  trial_ends_on: null
                  contract_date: '2026-01-01'
                  contract_end_date: '2026-12-31'
                  contract_seats: 25
                  current_plan: business
                  currency: USD
              included: []
      description: Single organization subscription
  schemas:
    resource_organization_subscription:
      type: object
      title: Organization subscription Resource
      description: The subscription details for an organization's Productive plan, including billing, seats, and plan information.
      properties:
        subscription_started_at:
          type: string
          title: Subscription Started At
          format: date-time
          description: Timestamp when the subscription started.
          example:
            gt: '2026-01-01'
        balance:
          title: Balance
          description: The account's current Stripe balance in cents (negative means credit).
          example:
            eq: value
        collection_method_id:
          enum:
            - 1
            - 2
          type: integer
          title: Collection Method
          description: ID of the collection method used to charge this subscription (e.g., charge automatically or send invoice).
          example:
            - 123
        billing_group_member:
          title: Billing Group Member
          description: Whether this organization is a member of a billing group managed by another organization.
          example:
            eq: value
        card_brand:
          type: string
          title: Card Brand
          description: The brand of the credit or debit card on file (e.g. Visa, Mastercard).
          example:
            eq: value
        stripe_customer_id:
          type: integer
          title: Stripe Customer
          description: The Stripe customer ID associated with this organization's billing account.
          example:
            - 123
        trial_ends_at:
          type: string
          title: Trial Ends At
          format: date-time
          description: Timestamp when the free trial ends, or null if not on a trial.
          example:
            gt: '2026-01-01'
        billing_group_seats:
          type: integer
          title: Billing Group Seats
          description: Total number of seats across all organizations in this billing group.
          example:
            eq: value
        current_plan:
          title: Current Plan
          description: The organization's current billing plan details.
          example:
            eq: value
        subscription_state_id:
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 8
            - 9
          type: integer
          title: Subscription State
          description: ID of the current subscription state (e.g. active, trialing, past_due, canceled).
          example:
            - 123
        card_year:
          type: string
          title: Card Year
          description: The expiry year of the card on file.
          example:
            eq: value
        contract_min_seats:
          type: integer
          title: Contract Min Seats
          description: The minimum number of seats specified in the organization's contract.
          example:
            eq: value
        stripe_token:
          title: Stripe Token
          description: The Stripe payment token used to update the payment method on file.
          example:
            eq: value
        contract_date:
          type: string
          title: Contract Date
          format: date
          description: The date the contract with this organization started.
          example:
            gt: '2026-01-01'
        billing_email:
          type: object
          title: Billing Email
          description: The email address used for billing communications and invoices.
          example:
            eq: value
        grace_period_ends_at:
          type: string
          title: Grace Period Ends At
          format: date-time
          description: The grace period ends at.
          example:
            gt: '2026-01-01'
        trial_plan_ends_at:
          type: string
          title: Trial Plan Ends At
          format: date-time
          description: The trial plan ends at.
          example:
            gt: '2026-01-01'
        next_billing_cycle_at:
          type: string
          title: Next Billing Cycle At
          format: date-time
          description: The next billing cycle at.
          example:
            gt: '2026-01-01'
        trial_plan_type:
          title: Trial Plan Type
          description: The type of plan being trialed, if a trial plan upgrade is active.
          example:
            eq: active
        discount:
          type: integer
          title: Discount
          description: The discount percentage applied to the subscription price.
          example:
            gt: 0
        seats_pending:
          title: Seats Pending
          description: The number of seats with a pending change (e.g. scheduled to be added or removed).
          example:
            eq: value
        plan_price:
          title: Plan Price
          description: The price per seat per billing cycle for the current plan, after discount.
          example:
            gt: 0
        trial_product_ids:
          type: object
          title: Trial Product Ids
          description: List of product IDs included in the trial subscription for this organization.
          example:
            - 123
            - 456
        billing_group_admin:
          type: boolean
          title: Billing Group Admin
          description: Whether this organization is the admin of a billing group (manages billing for member organizations).
          example:
            eq: value
        card_month:
          type: string
          title: Card Month
          description: The expiry month of the card on file.
          example:
            eq: value
        payment_method_id:
          enum:
            - 1
            - 2
          type: integer
          title: Payment Method
          description: ID of the payment method on file for this subscription.
          example:
            - 123
        current_products:
          title: Current Products
          description: The list of product modules currently active on the subscription.
          example:
            eq: value
        discount_expires_on:
          type: string
          title: Discount Expires On
          format: date
          description: Date when the current discount expires, or null if it does not expire.
          example:
            gt: 0
        billing_address:
          type: object
          title: Billing Address
          description: The billing address on file for this organization's subscription.
          example:
            eq: value
        plan_type:
          title: Plan Type
          description: The type identifier of the current plan (e.g. essential, professional, ultimate).
          example:
            eq: active
        card_last4:
          type: string
          title: Card Last4
          description: The last four digits of the credit or debit card on file.
          example:
            eq: value
        seats_used:
          type: integer
          title: Seats Used
          description: The number of seats currently occupied by active members.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this subscription belongs to.
          example:
            eq: value
        plan_cycle:
          title: Plan Cycle
          description: The billing cycle of the plan (monthly or annual).
          example:
            eq: value
        product_types:
          type: array
          items:
            description: A product type entry within the subscription's product_types list.
            example:
              eq: active
          title: Product Types
          description: The list of product module types included in the subscription.
          example:
            eq: active
        subscription_ended_at:
          type: string
          title: Subscription Ended At
          format: date-time
          description: Timestamp when the subscription ended, or null if still active.
          example:
            gt: '2026-01-01'
        seats:
          type: integer
          title: Seats
          description: The total number of seats purchased for this subscription.
          example:
            eq: value
        billing_group_members:
          title: Billing Group Members
          description: Organizations in the billing group managed by this organization, if it is a billing group admin.
          example:
            eq: value
        trial_plan_active:
          title: Trial Plan Active
          description: Whether a trial plan upgrade is currently active for this organization.
          example:
            eq: value
        contract_seats:
          type: integer
          title: Contract Seats
          description: The number of seats specified in the organization's current contract.
          example:
            eq: value
        billing_group_owner:
          title: Billing Group Owner
          description: The billing group owner organization, if this organization is a billing group member.
          example:
            eq: value
      example:
        id: '123'
        type: organization_subscriptions
        attributes:
          plan: business
          status: active
          seats: 25
          billing_cycle: annual
        relationships: {}
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    _collection_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Collection data
          description: Included variant — related resource identifiers are present in `data`.
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          example:
            data:
              - type: tasks
                id: '42'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  requestBodies:
    organization_subscription:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating an organization subscription.
            properties:
              data:
                type: object
                description: The organization subscription resource object.
                properties:
                  attributes:
                    type: object
                    description: Organization subscription attributes.
                    properties:
                      trial_plan_type:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/trial_plan_type'
                      plan_type:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/plan_type'
                      billing_email:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/billing_email'
                      product_types:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/product_types'
                      stripe_token:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/stripe_token'
                      billing_group_seats:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/billing_group_seats'
                      trial_product_ids:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/trial_product_ids'
                      billing_address:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/billing_address'
                      seats:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/seats'
                      plan_cycle:
                        $ref: '#/components/schemas/resource_organization_subscription/properties/plan_cycle'
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: organization_subscriptions
                attributes:
                  seats: 30
      description: Request body for creating or updating an organization subscription.
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
