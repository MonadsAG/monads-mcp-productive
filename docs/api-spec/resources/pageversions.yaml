openapi: 3.1.0
info:
  title: Productive.io API – PageVersions
  version: 2.0.0
description: |-
  **Page versions** capture the revision history of a doc page — each significant edit creates a new version.

  List the version history of a page and retrieve previous content. Versions allow teams to review changes over time and restore earlier drafts.
x-filters:
  page_version:
    person_id:
      description: Filter by the person who created this version.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    page_id:
      description: Filter by the associated page.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    restored_from_version_id:
      description: Filter by the version this version was restored from.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/page_versions:
    get:
      tags:
        - PageVersions
      summary: Get page_versions
      operationId: page_versions-index
      description: Returns the version history of pages. Filter by `page_id` to list one page's versions; sort with `-created_at` for newest first.
      parameters:
        - $ref: '#/components/parameters/sort_page_version'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_page_version'
      responses:
        '200':
          $ref: '#/components/responses/collection_page_version'
    post:
      tags:
        - PageVersions
      summary: Create a page_version
      operationId: page_versions-create
      description: |-
        Creates a page version. Pass exactly one of:

        - `page_id` — snapshots the page's current title and body as a new version, optionally labelled via `name`.
        - `restored_from_version_id` — creates a new version whose snapshot is copied from an earlier version, marking a restore point. The page's live body is **not** changed by this call.

        Editing a page records versions automatically (edits within two minutes merge into one); use this endpoint for named snapshots and restore points.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/page_version'
      responses:
        '201':
          $ref: '#/components/responses/single_page_version'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/page_versions/{id}:
    get:
      tags:
        - PageVersions
      summary: Gets a page_version
      operationId: page_versions-show
      description: Retrieve a single page version.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_page_version'
    patch:
      tags:
        - PageVersions
      summary: Update a page_version
      operationId: page_versions-update
      description: Renames a page version — `name` is the only writable attribute.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/page_version'
      responses:
        '200':
          $ref: '#/components/responses/single_page_version'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
components:
  responses:
    single_page_version:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single page_version record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned page_version resource.
                properties:
                  relationships:
                    type: object
                    description: Page version relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      person:
                        $ref: '#/components/schemas/_single_relationship'
                      page:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                  attributes:
                    type: object
                    description: Page version attributes.
                    properties:
                      created_at:
                        $ref: '#/components/schemas/resource_page_version/properties/created_at'
                      name:
                        $ref: '#/components/schemas/resource_page_version/properties/name'
                      updated_at:
                        $ref: '#/components/schemas/resource_page_version/properties/updated_at'
                      body_snapshot:
                        $ref: '#/components/schemas/resource_page_version/properties/body_snapshot'
                      title_snapshot:
                        $ref: '#/components/schemas/resource_page_version/properties/title_snapshot'
                      restored_from_version_id:
                        $ref: '#/components/schemas/resource_page_version/properties/restored_from_version_id'
                      prosemirror_steps:
                        $ref: '#/components/schemas/resource_page_version/properties/prosemirror_steps'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '45'
                type: page_versions
                attributes:
                  version_number: 3
                  created_at: '2026-03-10T15:00:00.000+00:00'
                relationships:
                  page:
                    data:
                      type: pages
                      id: '78'
                  author:
                    data:
                      type: people
                      id: '12'
              included: []
      description: Single page version
    collection_page_version:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of page version records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A page version resource object.
                  properties:
                    attributes:
                      type: object
                      description: Page version attributes.
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_page_version/properties/name'
                        restored_from_version_id:
                          $ref: '#/components/schemas/resource_page_version/properties/restored_from_version_id'
                        updated_at:
                          $ref: '#/components/schemas/resource_page_version/properties/updated_at'
                        prosemirror_steps:
                          $ref: '#/components/schemas/resource_page_version/properties/prosemirror_steps'
                        created_at:
                          $ref: '#/components/schemas/resource_page_version/properties/created_at'
                        title_snapshot:
                          $ref: '#/components/schemas/resource_page_version/properties/title_snapshot'
                        body_snapshot:
                          $ref: '#/components/schemas/resource_page_version/properties/body_snapshot'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Page version relationships.
                      properties:
                        page:
                          $ref: '#/components/schemas/_single_relationship'
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of page version resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '45'
                  type: page_versions
                  attributes:
                    version_number: 3
                    created_at: '2026-03-10T15:00:00.000+00:00'
                  relationships:
                    page:
                      data:
                        type: pages
                        id: '78'
                    author:
                      data:
                        type: people
                        id: '12'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection page version
  schemas:
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    resource_page_version:
      type: object
      title: Page version Resource
      description: A historical snapshot of a page's content created whenever the page is saved.
      properties:
        body_snapshot:
          title: Body Snapshot
          description: A snapshot of the page body in ProseMirror JSON format at the time this version was saved.
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this page version was created.
          example:
            gt: '2026-01-01'
        id:
          type: integer
          title: Id
          description: The unique identifier of this page version.
          example:
            - 123
        page:
          title: Page
          description: The page this version belongs to.
          example:
            eq: value
        prosemirror_steps:
          type: object
          title: Prosemirror Steps
          description: The ordered list of ProseMirror operations that transform the previous version into this one.
          example:
            eq: value
        person:
          title: Person
          description: The person who saved this version.
          example:
            eq: value
        person_id:
          type: integer
          title: Person
          description: ID of the person who saved this version.
          example:
            - 123
        name:
          type: string
          title: Name
          description: An optional user-defined name for this version (e.g. a milestone label).
          example:
            eq: value
        title_snapshot:
          type: string
          title: Title Snapshot
          description: A snapshot of the page title at the time this version was saved.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this page version belongs to.
          example:
            eq: value
        restored_from_version_id:
          type: integer
          title: Restored From Version
          description: ID of the version this one was restored from, when the version marks a restore point.
          example:
            - 123
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when this page version was last updated.
          example:
            gt: '2026-01-01'
        page_id:
          type: integer
          title: Page
          description: ID of the page this version belongs to.
          example:
            - 123
      example:
        id: '45'
        type: page_versions
        attributes:
          version_number: 3
          created_at: '2026-03-10T15:00:00.000+00:00'
        relationships:
          page:
            data:
              type: pages
              id: '78'
          author:
            data:
              type: people
              id: '12'
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      example:
        type: tasks
        id: '42'
  requestBodies:
    page_version:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body schema for a page version.
            properties:
              data:
                type: object
                description: The page version resource object.
                properties:
                  attributes:
                    type: object
                    description: Page version attributes.
                    properties:
                      restored_from_version_id:
                        $ref: '#/components/schemas/resource_page_version/properties/restored_from_version_id'
                      name:
                        $ref: '#/components/schemas/resource_page_version/properties/name'
                      page_id:
                        $ref: '#/components/schemas/resource_page_version/properties/page_id'
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: pages
                attributes:
                  title: Architecture Overview
                  note: System architecture documentation
                relationships:
                  project:
                    data:
                      type: projects
                      id: '6899'
      description: Request body for creating a page version. Pass exactly one of `page_id` (snapshot the page's current state) or `restored_from_version_id` (restore point copied from an earlier version), plus an optional `name`.
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_page_version:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.page_version at the top of this file.
      required: false
      description: Filters
    sort_page_version:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - created_at
            - -created_at
            - name
            - -name
            - updated_at
            - -updated_at
          type: string
        title: Sort page version
      explode: false
      required: false
      description: Sort page version
