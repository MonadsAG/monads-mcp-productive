openapi: 3.1.0
info:
  title: Productive.io API – PageVersions
  version: 2.0.0
description: |-
  **Page versions** capture the revision history of a doc page — each significant edit creates a new version.

  List the version history of a page and retrieve previous content. Versions allow teams to review changes over time and restore earlier drafts.
x-filters:
  page_version:
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    page_id:
      description: Filter by the associated page.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter by the person who created this version.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    restored_from_version_id:
      description: Filter by the version this version was restored from.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/page_versions:
    get:
      tags:
        - PageVersions
      summary: Get page_versions
      operationId: page_versions-index
      description: Returns the version history of pages. Filter by `page_id` to list one page's versions; sort with `-created_at` for newest first.
      parameters:
        - $ref: '#/components/parameters/filter_page_version'
        - $ref: '#/components/parameters/sort_page_version'
      responses:
        '200':
          $ref: '#/components/responses/collection_page_version'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - PageVersions
      summary: Create a page_version
      operationId: page_versions-create
      description: |-
        Creates a page version. Pass exactly one of:

        - `page_id` — snapshots the page's current title and body as a new version, optionally labelled via `name`.
        - `restored_from_version_id` — creates a new version whose snapshot is copied from an earlier version, marking a restore point. The page's live body is **not** changed by this call.

        Editing a page records versions automatically (edits within two minutes merge into one); use this endpoint for named snapshots and restore points.
      requestBody:
        $ref: '#/components/requestBodies/page_version'
      responses:
        '201':
          $ref: '#/components/responses/single_page_version'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_page_version'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/page_versions/{id}:
    get:
      tags:
        - PageVersions
      summary: Gets a page_version
      operationId: page_versions-show
      description: Retrieve a single page version.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_page_version'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - PageVersions
      summary: Update a page_version
      operationId: page_versions-update
      description: Renames a page version — `name` is the only writable attribute.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/page_version_update'
      responses:
        '200':
          $ref: '#/components/responses/single_page_version'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_page_version'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
