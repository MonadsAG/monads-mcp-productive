                          - type: 'null'
                        description: The name of this version.
                      prosemirror_steps:
                        anyOf:
                          - type: array
                            items: {}
                          - type: 'null'
                        title: Prosemirror Steps
                        description: The ProseMirror steps representing the incremental edits in this version.
                      restored_from_version_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_page_version/properties/restored_from_version_id'
                          - type: 'null'
                        description: The ID of the version this was restored from, if applicable.
                      title_snapshot:
                        anyOf:
                          - $ref: '#/components/schemas/resource_page_version/properties/title_snapshot'
                          - type: 'null'
                        description: A snapshot of the page title at the time this version was saved.
                      updated_at:
                        $ref: '#/components/schemas/resource_page_version/properties/updated_at'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Page version relationships.
                    properties:
