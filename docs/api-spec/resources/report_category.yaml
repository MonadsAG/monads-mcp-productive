openapi: 3.1.0
info:
  title: Productive.io API – Report Category
  version: 2.0.0
description: |
  Report categories help you organize and categorize your reports. You can assign each category a unique name and color code, making it easier to navigate through and manage your saved reports. This visual organization allows you to quickly find the reports you need and keep your workspace more streamlined.
paths:
  /api/v2/report_categories:
    get:
      tags:
        - Report Category
      summary: Get report categories
      operationId: report_categories-index
      description: List all report categories.
      parameters:
        - $ref: '#/components/parameters/sort_report_category'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_report_category'
      responses:
        '200':
          $ref: '#/components/responses/collection_report_category'
    post:
      tags:
        - Report Category
      summary: Create a report category
      operationId: report_categories-create
      description: Create a new report category.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/report_category'
      responses:
        '201':
          $ref: '#/components/responses/single_report_category'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/report_categories/{id}:
    get:
      tags:
        - Report Category
      summary: Gets a report category
      operationId: report_categories-show
      description: Retrieve a specific report category by ID.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_report_category'
    patch:
      tags:
        - Report Category
      summary: Update a report category
      operationId: report_categories-update
      description: Update an existing report category.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/report_category'
      responses:
        '200':
          $ref: '#/components/responses/single_report_category'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
    delete:
      tags:
        - Report Category
      summary: Deletes a report category
      operationId: report_categories-destroy
      description: Delete a report category.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_report_category:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.report_category at the top of this file.
      required: false
      description: Filters
    sort_report_category:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort report category
      explode: false
      required: false
      description: Sort report category
  responses:
    single_report_category:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single report category resource in JSON:API format.
            properties:
              data:
                type: object
                description: The report category data object.
                properties:
                  attributes:
                    type: object
                    description: Report category attributes.
                    properties:
                      deleted_at:
                        $ref: '#/components/schemas/resource_report_category/properties/deleted_at'
                      position:
                        $ref: '#/components/schemas/resource_report_category/properties/position'
                      name:
                        $ref: '#/components/schemas/resource_report_category/properties/name'
                      color_id:
                        $ref: '#/components/schemas/resource_report_category/properties/color_id'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Report category relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: An included related resource object.
                  example:
                    eq: value
                description: Array of included related resources.
                example:
                  eq: value
            example:
              data:
                id: '5'
                type: report_categories
                attributes:
                  name: Financial
                  description: Revenue, cost, and profitability reports
              included: []
      description: Single report category
    collection_report_category:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of report category records in JSON:API format.
            properties:
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: An included related resource object.
                  example:
                    eq: value
                description: Array of included related resources.
                example:
                  eq: value
              data:
                type: array
                items:
                  type: object
                  description: A report category resource object.
                  properties:
                    relationships:
                      type: object
                      description: Report category relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                    attributes:
                      type: object
                      description: Report category attributes.
                      properties:
                        position:
                          $ref: '#/components/schemas/resource_report_category/properties/position'
                        color_id:
                          $ref: '#/components/schemas/resource_report_category/properties/color_id'
                        name:
                          $ref: '#/components/schemas/resource_report_category/properties/name'
                        deleted_at:
                          $ref: '#/components/schemas/resource_report_category/properties/deleted_at'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of report category resource objects.
                example:
                  eq: value
            example:
              data:
                - id: '5'
                  type: report_categories
                  attributes:
                    name: Financial
                    description: Revenue, cost, and profitability reports
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection report category
  schemas:
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    resource_report_category:
      type: object
      title: Report category Resource
      description: An aggregated report category resource grouping saved report filters.
      properties:
        deleted_at:
          type: string
          title: Deleted At
          format: date-time
          description: Timestamp when this report category was deleted.
          example:
            gt: '2026-01-01'
        organization:
          title: Organization
          description: The organization this report category belongs to.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: Display name of this report category.
          example:
            eq: value
        color_id:
          type: integer
          title: Color
          description: Color identifier for this report category.
          example:
            - 123
        position:
          type: integer
          title: Position
          description: Display order position of this report category.
          example:
            eq: value
      example:
        id: '123'
        type: report_categories
        attributes:
          name: Financial Reports
          description: Revenue and cost reports
        relationships: {}
  requestBodies:
    report_category:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: JSON:API request body schema for a report category.
            properties:
              data:
                type: object
                description: The report category data object.
                properties:
                  attributes:
                    type: object
                    description: Report category attributes to create or update.
                    properties:
                      position:
                        $ref: '#/components/schemas/resource_report_category/properties/position'
                      color_id:
                        $ref: '#/components/schemas/resource_report_category/properties/color_id'
                      name:
                        $ref: '#/components/schemas/resource_report_category/properties/name'
                    required:
                      - name
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: report_categories
                attributes:
                  name: Financial
                  description: Revenue, cost, and profitability reports
      description: Request body for creating or updating a report category.
