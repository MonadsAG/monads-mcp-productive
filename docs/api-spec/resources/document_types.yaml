      required:
        - data
    resource_document_type:
      type: object
      title: Document type Resource
      description: A template for PDF generation of invoices and financial documents, defining content layout, branding, and field configuration.
      properties:
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this document type was archived, or null if still active.
          example:
            gt: '2026-01-01'
        attachment_ids:
          title: Attachment Ids
          description: IDs of attachments (e.g. header images) associated with this document type.
          example:
            - 123
            - 456
        attachments:
          title: Attachments
          description: Attachments associated with this document type, such as images used in templates.
          example:
            eq: value
        body_template:
          type: string
          title: Body Template
          description: The Liquid template used to render the body content of documents of this type.
          example:
            eq: value
        document_style:
          title: Document Style
          description: The document style applied to documents of this type for visual formatting.
          example:
            eq: value
        document_style_id:
          type: integer
          title: Document Style
          description: ID of the document style applied to documents of this type.
          example:
            - 123
        document_template_id:
          enum:
            - 1
          type: integer
          title: Document Template
          description: ID of the built-in document template this type is based on.
          example:
            - 123
        dual_currency:
          type: boolean
          title: Dual Currency
          description: Whether documents of this type display amounts in dual currencies.
          example:
            eq: value
        email_data:
          type: object
          title: Email Data
          description: A JSON object containing additional data passed to the email template when sending documents of this type.
          example:
            eq: value
        email_subject:
          type: string
          title: Email Subject
          description: The default subject line used when emailing documents of this type.
          example:
            eq: value
        email_template:
          type: string
          title: Email Template
          description: The Liquid template used to render the email body when sending documents of this type.
          example:
            eq: value
        exportable_type_id:
          enum:
            - 1
            - 2
            - 3
            - 4
          type: integer
          title: Exportable Type
          description: ID of the exportable type indicating what kind of document this type generates (e.g. invoice, proposal).
          example:
            - 123
        exporter_options:
          type: string
          title: Exporter Options
          description: A hash of additional options passed to the document exporter to control rendering behavior.
          example:
            eq: value
        filename_schema:
          type: string
          title: Filename Schema
          description: A template string defining the naming pattern for exported document files.
          example:
            eq: value
        footer:
          type: string
          title: Footer
          description: Legacy footer text included at the bottom of documents of this type.
          example:
            eq: value
        footer_template:
          type: string
          title: Footer Template
          description: The Liquid template used to render the footer section of documents of this type.
          example:
            eq: value
        header_template:
          type: string
          title: Header Template
          description: The Liquid template used to render the header section of documents of this type.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: The unique identifier of this document type.
          example:
            - 123
        locale:
          type: string
          title: Locale
          description: The locale (language/region) used for formatting numbers, dates, and translations in documents of this type.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The display name of this document type.
          example:
            eq: value
        note:
          type: string
          title: Note
          description: An internal note or description for this document type, visible only to administrators.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this document type belongs to.
          example:
            eq: value
        scss_template:
          type: string
          title: Scss Template
          description: The SCSS stylesheet template used to style documents of this type when rendered to PDF.
          example:
            eq: value
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
          description: The current status of this document type (e.g. active or archived).
          example:
            eq: active
        subsidiary:
          title: Subsidiary
          description: The subsidiary this document type is associated with for billing and legal entity purposes.
          example:
            eq: value
        subsidiary_id:
          type: integer
          title: Subsidiary
          description: ID of the subsidiary this document type is associated with.
          example:
            - 123
        tax1_name:
          type: string
          title: Tax1 Name
          description: The label displayed for the first tax line on documents of this type.
          example:
            eq: value
        tax1_value:
          type: number
          title: Tax1 Value
          description: The default rate (as a percentage) for the first tax applied to documents of this type.
          example:
            eq: value
        tax2_name:
          type: string
          title: Tax2 Name
          description: The label displayed for the second tax line on documents of this type.
          example:
            eq: value
        tax2_value:
          type: number
          title: Tax2 Value
          description: The default rate (as a percentage) for the second tax applied to documents of this type.
          example:
            eq: value
        template_options:
          type: string
          title: Template Options
          description: A hash of configuration options specific to the document template used by this type.
          example:
            eq: value
      example:
        id: '3'
        type: document_types
        attributes:
          name: Standard Invoice
          default: true
        relationships: {}
