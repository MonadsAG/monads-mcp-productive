          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    single_document_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single document type record in JSON:API format.
            properties:
              data:
                type: object
                description: The document type resource object.
                properties:
                  attributes:
                    type: object
                    description: Document type attributes.
                    properties:
                      archived_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_document_type/properties/archived_at'
                          - type: 'null'
                        description: The date and time when the document type was archived, or null if active.
                      body_template:
                        anyOf:
                          - $ref: '#/components/schemas/resource_document_type/properties/body_template'
                          - type: 'null'
                        description: The Liquid template used to render the body section of the document.
                      document_template_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_document_type/properties/document_template_id'
                          - type: 'null'
                        description: The ID of the base document template layout.
                      dual_currency:
                        $ref: '#/components/schemas/resource_document_type/properties/dual_currency'
                      email_data:
                        $ref: '#/components/schemas/resource_document_type/properties/email_data'
                      email_subject:
                        anyOf:
                          - $ref: '#/components/schemas/resource_document_type/properties/email_subject'
                          - type: 'null'
                        description: The default subject line for emails sent with documents of this type.
                      email_template:
                        anyOf:
                          - $ref: '#/components/schemas/resource_document_type/properties/email_template'
                          - type: 'null'
                        description: The Liquid template for the email body when sending documents of this type.
                      exportable_type_id:
                        $ref: '#/components/schemas/resource_document_type/properties/exportable_type_id'
                      exporter_options:
                        type: object
                        description: Additional configuration options for the document exporter.
                      filename_schema:
                        anyOf:
                          - $ref: '#/components/schemas/resource_document_type/properties/filename_schema'
                          - type: 'null'
                        description: The naming pattern used to generate filenames for exported documents.
                      footer:
                        anyOf:
                          - $ref: '#/components/schemas/resource_document_type/properties/footer'
                          - type: 'null'
                        description: Static footer content displayed at the bottom of the document.
                      footer_template:
                        anyOf:
                          - $ref: '#/components/schemas/resource_document_type/properties/footer_template'
                          - type: 'null'
                        description: The Liquid template used to render the footer section of the document.
                      header_template:
                        anyOf:
                          - $ref: '#/components/schemas/resource_document_type/properties/header_template'
                          - type: 'null'
                        description: The Liquid template used to render the header section of the document.
                      locale:
                        $ref: '#/components/schemas/resource_document_type/properties/locale'
                      name:
                        $ref: '#/components/schemas/resource_document_type/properties/name'
                      note:
                        anyOf:
                          - $ref: '#/components/schemas/resource_document_type/properties/note'
                          - type: 'null'
                        description: An optional note or description displayed on the document.
                      scss_template:
                        anyOf:
                          - $ref: '#/components/schemas/resource_document_type/properties/scss_template'
                          - type: 'null'
                        description: The SCSS stylesheet template for custom document styling.
                      tax1_name:
                        anyOf:
                          - $ref: '#/components/schemas/resource_document_type/properties/tax1_name'
                          - type: 'null'
                        description: The label for the first tax field on the document.
                      tax1_value:
                        anyOf:
                          - $ref: '#/components/schemas/resource_document_type/properties/tax1_value'
                          - type: 'null'
                        description: The default value for the first tax field.
                      tax2_name:
                        anyOf:
                          - $ref: '#/components/schemas/resource_document_type/properties/tax2_name'
                          - type: 'null'
                        description: The label for the second tax field on the document.
                      tax2_value:
                        anyOf:
                          - $ref: '#/components/schemas/resource_document_type/properties/tax2_value'
                          - type: 'null'
                        description: The default value for the second tax field.
                      template_options:
                        type: object
                        description: Additional rendering options for the document template.
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Document type relationships.
                    properties:
                      attachments:
                        $ref: '#/components/schemas/_collection_relationship'
                      document_style:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      subsidiary:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '3'
                type: document_types
                attributes:
                  name: Standard Invoice
                  default: true
                relationships: {}
              included: []
      description: Single document type
    collection_document_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of document type records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A document type resource object.
                  properties:
                    attributes:
                      type: object
                      description: Document type attributes.
                      properties:
                        archived_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_document_type/properties/archived_at'
                            - type: 'null'
                          description: Timestamp when this document type was archived, or null if active.
                        body_template:
                          anyOf:
                            - $ref: '#/components/schemas/resource_document_type/properties/body_template'
                            - type: 'null'
                          description: Liquid/HTML template for the main body content of the document.
                        document_template_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_document_type/properties/document_template_id'
                            - type: 'null'
                          description: ID of the base document layout template.
                        dual_currency:
                          $ref: '#/components/schemas/resource_document_type/properties/dual_currency'
                        email_data:
                          $ref: '#/components/schemas/resource_document_type/properties/email_data'
                        email_subject:
                          anyOf:
                            - $ref: '#/components/schemas/resource_document_type/properties/email_subject'
                            - type: 'null'
                          description: Default email subject line when sending this document type.
                        email_template:
                          anyOf:
                            - $ref: '#/components/schemas/resource_document_type/properties/email_template'
                            - type: 'null'
                          description: Liquid/HTML template for the email body when sending this document.
                        exportable_type_id:
                          $ref: '#/components/schemas/resource_document_type/properties/exportable_type_id'
                        exporter_options:
                          type: object
                          description: Additional exporter-specific options for PDF generation.
                        filename_schema:
                          anyOf:
                            - $ref: '#/components/schemas/resource_document_type/properties/filename_schema'
                            - type: 'null'
                          description: Liquid template string defining the generated filename of the document.
                        footer:
                          anyOf:
                            - $ref: '#/components/schemas/resource_document_type/properties/footer'
                            - type: 'null'
                          description: Footer text or HTML shown at the bottom of the document.
                        footer_template:
                          anyOf:
                            - $ref: '#/components/schemas/resource_document_type/properties/footer_template'
                            - type: 'null'
                          description: Liquid/HTML template for the footer section of the document.
                        header_template:
                          anyOf:
                            - $ref: '#/components/schemas/resource_document_type/properties/header_template'
                            - type: 'null'
                          description: Liquid/HTML template for the header section of the document.
                        locale:
                          $ref: '#/components/schemas/resource_document_type/properties/locale'
                        name:
                          $ref: '#/components/schemas/resource_document_type/properties/name'
                        note:
                          anyOf:
                            - $ref: '#/components/schemas/resource_document_type/properties/note'
                            - type: 'null'
                          description: Custom note or footer text appended to the document.
                        scss_template:
                          anyOf:
                            - $ref: '#/components/schemas/resource_document_type/properties/scss_template'
                            - type: 'null'
                          description: Custom SCSS stylesheet for additional styling of the document.
                        tax1_name:
                          anyOf:
                            - $ref: '#/components/schemas/resource_document_type/properties/tax1_name'
                            - type: 'null'
                          description: Label for the first tax column on the document.
                        tax1_value:
                          anyOf:
                            - $ref: '#/components/schemas/resource_document_type/properties/tax1_value'
                            - type: 'null'
                          description: Value or rate for the first tax column on the document.
                        tax2_name:
                          anyOf:
                            - $ref: '#/components/schemas/resource_document_type/properties/tax2_name'
                            - type: 'null'
                          description: Label for the second tax column on the document.
                        tax2_value:
                          anyOf:
                            - $ref: '#/components/schemas/resource_document_type/properties/tax2_value'
                            - type: 'null'
                          description: Value or rate for the second tax column on the document.
                        template_options:
                          type: object
                          description: Options controlling which sections and fields are shown on the document.
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Document type relationships.
                      properties:
                        attachments:
                          $ref: '#/components/schemas/_collection_relationship'
                        document_style:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of document type resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '3'
                  type: document_types
                  attributes:
                    name: Standard Invoice
                    default: true
                  relationships: {}
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection document type
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
