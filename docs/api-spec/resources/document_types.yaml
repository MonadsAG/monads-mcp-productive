openapi: 3.1.0
info:
  title: Productive.io API – Document Types
  version: 2.0.0
description: |-
  **Document types** are PDF templates used to generate financial documents — invoices, proposals, and purchase orders. They define content blocks, layout, and branding applied when rendering documents.

  Assign document types to subsidiaries to set the default template for generated PDFs.
x-filters:
  document_type:
    document_template_id:
      description: Filter by the associated document template.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    exportable_type_id:
      description: Filter by the exportable type ID the document type applies to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by document type ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by active/archived status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter by the associated subsidiary.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/document_types/{id}/archive:
    patch:
      tags:
        - Document Types
      summary: Archives a document type
      operationId: document_types-archive-archive
      description: Archive a document type.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_document_type'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/document_types/copy:
    post:
      tags:
        - Document Types
      summary: Duplicates a document type
      operationId: document_types-copy-copy
      description: Copy an existing document type.
      responses:
        '201':
          $ref: '#/components/responses/single_document_type'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_document_type'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/document_types:
    get:
      tags:
        - Document Types
      summary: Get document_types
      operationId: document_types-index
      description: List document types.
      parameters:
        - $ref: '#/components/parameters/filter_document_type'
        - $ref: '#/components/parameters/sort_document_type'
      responses:
        '200':
          $ref: '#/components/responses/collection_document_type'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Document Types
      summary: Create a document_type
      operationId: document_types-create
      description: Create a new document type.
      requestBody:
        $ref: '#/components/requestBodies/document_type'
      responses:
        '201':
          $ref: '#/components/responses/single_document_type'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_document_type'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/document_types/{id}:
    get:
      tags:
        - Document Types
      summary: Gets a document_type
      operationId: document_types-show
      description: Retrieve a single document type.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_document_type'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Document Types
      summary: Update a document_type
      operationId: document_types-update
      description: Update a document type.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/document_type'
      responses:
        '200':
          $ref: '#/components/responses/single_document_type'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_document_type'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content_document_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
