openapi: 3.1.0
info:
  title: Productive.io API – Document Types
  version: 2.0.0
description: |-
  **Document types** are PDF templates used to generate financial documents — invoices, proposals, and purchase orders. They define content blocks, layout, and branding applied when rendering documents.

  Assign document types to subsidiaries to set the default template for generated PDFs.
x-filters:
  document_type:
    subsidiary_id:
      description: Filter by the associated subsidiary.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by document type ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    document_template_id:
      description: Filter by the associated document template.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    exportable_type_id:
      description: Filter by the exportable type ID the document type applies to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by active/archived status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/document_types/{id}/archive:
    patch:
      tags:
        - Document Types
      summary: Archives a document type
      operationId: document_types-archive-archive
      description: Archive a document type.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_document_type'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
  /api/v2/document_types/copy:
    post:
      tags:
        - Document Types
      summary: Duplicates a document type
      operationId: document_types-copy-copy
      description: Copy an existing document type.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_document_type'
        '201':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Created
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/document_types:
    get:
      tags:
        - Document Types
      summary: Get document_types
      operationId: document_types-index
      description: List document types.
      parameters:
        - $ref: '#/components/parameters/filter_document_type'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_document_type'
      responses:
        '200':
          $ref: '#/components/responses/collection_document_type'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
    post:
      tags:
        - Document Types
      summary: Create a document_type
      operationId: document_types-create
      description: Create a new document type.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/document_type'
      responses:
        '201':
          $ref: '#/components/responses/single_document_type'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/document_types/{id}:
    get:
      tags:
        - Document Types
      summary: Gets a document_type
      operationId: document_types-show
      description: Retrieve a single document type.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_document_type'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
    patch:
      tags:
        - Document Types
      summary: Update a document_type
      operationId: document_types-update
      description: Update a document type.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/document_type'
      responses:
        '200':
          $ref: '#/components/responses/single_document_type'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
components:
  responses:
    single_document_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single document type record in JSON:API format.
            properties:
              data:
                type: object
                description: The document type resource object.
                properties:
                  attributes:
                    type: object
                    description: Document type attributes.
                    properties:
                      body_template:
                        $ref: '#/components/schemas/resource_document_type/properties/body_template'
                      email_template:
                        $ref: '#/components/schemas/resource_document_type/properties/email_template'
                      dual_currency:
                        $ref: '#/components/schemas/resource_document_type/properties/dual_currency'
                      exportable_type_id:
                        $ref: '#/components/schemas/resource_document_type/properties/exportable_type_id'
                      locale:
                        $ref: '#/components/schemas/resource_document_type/properties/locale'
                      document_template_id:
                        $ref: '#/components/schemas/resource_document_type/properties/document_template_id'
                      footer_template:
                        $ref: '#/components/schemas/resource_document_type/properties/footer_template'
                      tax2_value:
                        $ref: '#/components/schemas/resource_document_type/properties/tax2_value'
                      exporter_options:
                        $ref: '#/components/schemas/resource_document_type/properties/exporter_options'
                      email_data:
                        $ref: '#/components/schemas/resource_document_type/properties/email_data'
                      filename_schema:
                        $ref: '#/components/schemas/resource_document_type/properties/filename_schema'
                      scss_template:
                        $ref: '#/components/schemas/resource_document_type/properties/scss_template'
                      email_subject:
                        $ref: '#/components/schemas/resource_document_type/properties/email_subject'
                      note:
                        $ref: '#/components/schemas/resource_document_type/properties/note'
                      header_template:
                        $ref: '#/components/schemas/resource_document_type/properties/header_template'
                      tax1_name:
                        $ref: '#/components/schemas/resource_document_type/properties/tax1_name'
                      template_options:
                        $ref: '#/components/schemas/resource_document_type/properties/template_options'
                      tax2_name:
                        $ref: '#/components/schemas/resource_document_type/properties/tax2_name'
                      archived_at:
                        $ref: '#/components/schemas/resource_document_type/properties/archived_at'
                      footer:
                        $ref: '#/components/schemas/resource_document_type/properties/footer'
                      name:
                        $ref: '#/components/schemas/resource_document_type/properties/name'
                      tax1_value:
                        $ref: '#/components/schemas/resource_document_type/properties/tax1_value'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Document type relationships.
                    properties:
                      subsidiary:
                        $ref: '#/components/schemas/_single_relationship'
                      attachments:
                        $ref: '#/components/schemas/_collection_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      document_style:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                id: '3'
                type: document_types
                attributes:
                  name: Standard Invoice
                  default: true
                relationships: {}
              included: []
      description: Single document type
    collection_document_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of document type records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A document type resource object.
                  properties:
                    attributes:
                      type: object
                      description: Document type attributes.
                      properties:
                        email_subject:
                          $ref: '#/components/schemas/resource_document_type/properties/email_subject'
                        exportable_type_id:
                          $ref: '#/components/schemas/resource_document_type/properties/exportable_type_id'
                        email_template:
                          $ref: '#/components/schemas/resource_document_type/properties/email_template'
                        body_template:
                          $ref: '#/components/schemas/resource_document_type/properties/body_template'
                        document_template_id:
                          $ref: '#/components/schemas/resource_document_type/properties/document_template_id'
                        footer:
                          $ref: '#/components/schemas/resource_document_type/properties/footer'
                        email_data:
                          $ref: '#/components/schemas/resource_document_type/properties/email_data'
                        note:
                          $ref: '#/components/schemas/resource_document_type/properties/note'
                        template_options:
                          $ref: '#/components/schemas/resource_document_type/properties/template_options'
                        dual_currency:
                          $ref: '#/components/schemas/resource_document_type/properties/dual_currency'
                        tax2_name:
                          $ref: '#/components/schemas/resource_document_type/properties/tax2_name'
                        tax1_value:
                          $ref: '#/components/schemas/resource_document_type/properties/tax1_value'
                        scss_template:
                          $ref: '#/components/schemas/resource_document_type/properties/scss_template'
                        filename_schema:
                          $ref: '#/components/schemas/resource_document_type/properties/filename_schema'
                        tax2_value:
                          $ref: '#/components/schemas/resource_document_type/properties/tax2_value'
                        exporter_options:
                          $ref: '#/components/schemas/resource_document_type/properties/exporter_options'
                        name:
                          $ref: '#/components/schemas/resource_document_type/properties/name'
                        archived_at:
                          $ref: '#/components/schemas/resource_document_type/properties/archived_at'
                        header_template:
                          $ref: '#/components/schemas/resource_document_type/properties/header_template'
                        footer_template:
                          $ref: '#/components/schemas/resource_document_type/properties/footer_template'
                        locale:
                          $ref: '#/components/schemas/resource_document_type/properties/locale'
                        tax1_name:
                          $ref: '#/components/schemas/resource_document_type/properties/tax1_name'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Document type relationships.
                      properties:
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        attachments:
                          $ref: '#/components/schemas/_collection_relationship'
                        document_style:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of document type resource objects.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                - id: '3'
                  type: document_types
                  attributes:
                    name: Standard Invoice
                    default: true
                  relationships: {}
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection document type
  schemas:
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      example:
        type: tasks
        id: '42'
    _collection_relationship:
      anyOf:
        - type: object
          title: Collection data
          description: Included variant — related resource identifiers are present in `data`.
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          example:
            data:
              - type: tasks
                id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    resource_document_type:
      type: object
      title: Document type Resource
      description: A template for PDF generation of invoices and financial documents, defining content layout, branding, and field configuration.
      properties:
        tax1_name:
          type: string
          title: Tax1 Name
          description: The label displayed for the first tax line on documents of this type.
          example:
            eq: value
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
          description: The current status of this document type (e.g. active or archived).
          example:
            eq: active
        email_template:
          type: string
          title: Email Template
          description: The Liquid template used to render the email body when sending documents of this type.
          example:
            eq: value
        tax2_name:
          type: string
          title: Tax2 Name
          description: The label displayed for the second tax line on documents of this type.
          example:
            eq: value
        document_style_id:
          type: integer
          title: Document Style
          description: ID of the document style applied to documents of this type.
          example:
            - 123
        locale:
          type: string
          title: Locale
          description: The locale (language/region) used for formatting numbers, dates, and translations in documents of this type.
          example:
            eq: value
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this document type was archived, or null if still active.
          example:
            gt: '2026-01-01'
        subsidiary:
          title: Subsidiary
          description: The subsidiary this document type is associated with for billing and legal entity purposes.
          example:
            eq: value
        footer_template:
          type: string
          title: Footer Template
          description: The Liquid template used to render the footer section of documents of this type.
          example:
            eq: value
        template_options:
          type: string
          title: Template Options
          description: A hash of configuration options specific to the document template used by this type.
          example:
            eq: value
        exporter_options:
          type: string
          title: Exporter Options
          description: A hash of additional options passed to the document exporter to control rendering behavior.
          example:
            eq: value
        subsidiary_id:
          type: integer
          title: Subsidiary
          description: ID of the subsidiary this document type is associated with.
          example:
            - 123
        document_template_id:
          enum:
            - 1
          type: integer
          title: Document Template
          description: ID of the built-in document template this type is based on.
          example:
            - 123
        email_subject:
          type: string
          title: Email Subject
          description: The default subject line used when emailing documents of this type.
          example:
            eq: value
        body_template:
          type: string
          title: Body Template
          description: The Liquid template used to render the body content of documents of this type.
          example:
            eq: value
        email_data:
          type: object
          title: Email Data
          description: A JSON object containing additional data passed to the email template when sending documents of this type.
          example:
            eq: value
        footer:
          type: string
          title: Footer
          description: Legacy footer text included at the bottom of documents of this type.
          example:
            eq: value
        exportable_type_id:
          enum:
            - 1
            - 2
            - 3
            - 4
          type: integer
          title: Exportable Type
          description: ID of the exportable type indicating what kind of document this type generates (e.g. invoice, proposal).
          example:
            - 123
        scss_template:
          type: string
          title: Scss Template
          description: The SCSS stylesheet template used to style documents of this type when rendered to PDF.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: The unique identifier of this document type.
          example:
            - 123
        attachments:
          title: Attachments
          description: Attachments associated with this document type, such as images used in templates.
          example:
            eq: value
        tax1_value:
          type: number
          title: Tax1 Value
          description: The default rate (as a percentage) for the first tax applied to documents of this type.
          example:
            eq: value
        dual_currency:
          type: boolean
          title: Dual Currency
          description: Whether documents of this type display amounts in dual currencies.
          example:
            eq: value
        tax2_value:
          type: number
          title: Tax2 Value
          description: The default rate (as a percentage) for the second tax applied to documents of this type.
          example:
            eq: value
        filename_schema:
          type: string
          title: Filename Schema
          description: A template string defining the naming pattern for exported document files.
          example:
            eq: value
        header_template:
          type: string
          title: Header Template
          description: The Liquid template used to render the header section of documents of this type.
          example:
            eq: value
        attachment_ids:
          title: Attachment Ids
          description: IDs of attachments (e.g. header images) associated with this document type.
          example:
            - 123
            - 456
        organization:
          title: Organization
          description: The organization this document type belongs to.
          example:
            eq: value
        note:
          type: string
          title: Note
          description: An internal note or description for this document type, visible only to administrators.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The display name of this document type.
          example:
            eq: value
        document_style:
          title: Document Style
          description: The document style applied to documents of this type for visual formatting.
          example:
            eq: value
      example:
        id: '3'
        type: document_types
        attributes:
          name: Standard Invoice
          default: true
        relationships: {}
  requestBodies:
    document_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a document type.
            properties:
              data:
                type: object
                description: The document type resource object.
                properties:
                  attributes:
                    type: object
                    description: Document type attributes.
                    properties:
                      filename_schema:
                        $ref: '#/components/schemas/resource_document_type/properties/filename_schema'
                      name:
                        $ref: '#/components/schemas/resource_document_type/properties/name'
                      email_data:
                        $ref: '#/components/schemas/resource_document_type/properties/email_data'
                      tax1_value:
                        $ref: '#/components/schemas/resource_document_type/properties/tax1_value'
                      tax2_name:
                        $ref: '#/components/schemas/resource_document_type/properties/tax2_name'
                      note:
                        $ref: '#/components/schemas/resource_document_type/properties/note'
                      email_subject:
                        $ref: '#/components/schemas/resource_document_type/properties/email_subject'
                      footer:
                        $ref: '#/components/schemas/resource_document_type/properties/footer'
                      locale:
                        $ref: '#/components/schemas/resource_document_type/properties/locale'
                      subsidiary_id:
                        $ref: '#/components/schemas/resource_document_type/properties/subsidiary_id'
                      email_template:
                        $ref: '#/components/schemas/resource_document_type/properties/email_template'
                      exporter_options:
                        $ref: '#/components/schemas/resource_document_type/properties/exporter_options'
                      attachment_ids:
                        $ref: '#/components/schemas/resource_document_type/properties/attachment_ids'
                      dual_currency:
                        $ref: '#/components/schemas/resource_document_type/properties/dual_currency'
                      tax1_name:
                        $ref: '#/components/schemas/resource_document_type/properties/tax1_name'
                      exportable_type_id:
                        $ref: '#/components/schemas/resource_document_type/properties/exportable_type_id'
                      document_style_id:
                        $ref: '#/components/schemas/resource_document_type/properties/document_style_id'
                      template_options:
                        $ref: '#/components/schemas/resource_document_type/properties/template_options'
                      tax2_value:
                        $ref: '#/components/schemas/resource_document_type/properties/tax2_value'
                      document_template_id:
                        $ref: '#/components/schemas/resource_document_type/properties/document_template_id'
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: document_types
                attributes:
                  name: Standard Invoice
                  default: true
      description: Request body for creating or updating a document type.
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_document_type:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort document type
      explode: false
      required: false
      description: Sort document type
    filter_document_type:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.document_type at the top of this file.
      required: false
      description: Filters
