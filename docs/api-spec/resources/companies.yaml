    single_company:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single company record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned company resource.
                properties:
                  attributes:
                    type: object
                    description: Company attributes.
                    properties:
                      archived_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_company/properties/archived_at'
                          - type: 'null'
                        description: The date and time when the company was archived, or null if active.
                      avatar_url:
                        anyOf:
                          - $ref: '#/components/schemas/resource_company/properties/avatar_url'
                          - type: 'null'
                        description: The URL of the company's avatar image.
                      billing_name:
                        anyOf:
                          - $ref: '#/components/schemas/resource_company/properties/billing_name'
                          - type: 'null'
                        description: The billing name used on invoices for this company.
                      company_code:
                        $ref: '#/components/schemas/resource_company/properties/company_code'
                      contact:
                        $ref: '#/components/schemas/resource_company/properties/contact'
                      created_at:
                        $ref: '#/components/schemas/resource_company/properties/created_at'
                      custom_fields:
                        anyOf:
                          - $ref: '#/components/schemas/resource_company/properties/custom_fields'
                          - type: 'null'
                        description: Custom field values associated with this company.
                      default_currency:
                        anyOf:
                          - $ref: '#/components/schemas/resource_company/properties/default_currency'
                          - type: 'null'
                        description: The default currency for this company's invoices (ISO 4217 code).
                      default_document_type_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_company/properties/default_document_type_id'
                          - type: 'null'
                        description: The ID of the default document type template for this company's invoices.
                      default_subsidiary_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_company/properties/default_subsidiary_id'
                          - type: 'null'
                        description: The ID of the default subsidiary used when creating invoices for this company.
                      default_tax_rate_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_company/properties/default_tax_rate_id'
                          - type: 'null'
                        description: The ID of the default tax rate applied to invoices for this company.
                      due_days:
                        anyOf:
                          - $ref: '#/components/schemas/resource_company/properties/due_days'
                          - type: 'null'
                        description: The default number of days until payment is due on invoices for this company.
                      external_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_company/properties/external_id'
                          - type: 'null'
                        description: An external ID for syncing this company with third-party systems.
                      external_sync:
                        $ref: '#/components/schemas/resource_company/properties/external_sync'
                      invoice_email_recipients:
                        type: object
                        description: Email addresses that receive invoice copies for this company.
                      last_activity_at:
                        $ref: '#/components/schemas/resource_company/properties/last_activity_at'
                      name:
                        $ref: '#/components/schemas/resource_company/properties/name'
                      projectless_budgets:
                        $ref: '#/components/schemas/resource_company/properties/projectless_budgets'
                      sample_data:
                        $ref: '#/components/schemas/resource_company/properties/sample_data'
                      settings:
                        $ref: '#/components/schemas/resource_company/properties/settings'
                      tag_list:
                        type: array
                        items:
                          type: string
                        description: Comma-separated tags applied to this company.
                      vat:
                        anyOf:
                          - $ref: '#/components/schemas/resource_company/properties/vat'
                          - type: 'null'
                        description: The VAT number for this company.
                      original_avatar_url:
                        $ref: '#/components/schemas/resource_company/properties/original_avatar_url'
                      parent_company_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_company/properties/parent_company_id'
                          - type: 'null'
                        description: The ID of the parent company in a company hierarchy.
                      payment_terms_type:
                        anyOf:
                          - $ref: '#/components/schemas/resource_company/properties/payment_terms_type'
                          - type: 'null'
                      domains:
                        $ref: '#/components/schemas/resource_company/properties/domains'
                      default_payment_reminder_sequence_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_company/properties/default_payment_reminder_sequence_id'
                          - type: 'null'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Company relationships.
                    properties:
                      import:
                        $ref: '#/components/schemas/_single_relationship'
                      custom_field_attachments:
                        $ref: '#/components/schemas/_collection_relationship'
                      custom_field_people:
                        $ref: '#/components/schemas/_collection_relationship'
                      default_subsidiary:
                        $ref: '#/components/schemas/_single_relationship'
                      default_tax_rate:
                        $ref: '#/components/schemas/_single_relationship'
                      einvoice_identity:
                        $ref: '#/components/schemas/_single_relationship'
                      integration_exporter_configuration:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      default_document_type:
                        $ref: '#/components/schemas/_single_relationship'
                      parent_company:
                        $ref: '#/components/schemas/_single_relationship'
                      default_payment_reminder_sequence:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '65111'
                type: companies
                attributes:
                  name: Acme Corp
                  billing_name: Acme Corporation Ltd
