      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_fields:
      description: Filter by custom field values.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    default_currency:
      description: Filter by the company's default invoice currency.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    default_subsidiary_id:
      description: Filter by the company's default subsidiary.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    default_tax_rate_id:
      description: Filter by the company's default tax rate.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    due_days:
      description: Filter by default payment terms (days).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    full_query:
      description: Full-text search across company name, billing name, and other text fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    fuzzy_dates:
      description: Filter by fuzzy date range (e.g. this_week, last_month).
      operators:
        - eq
        - not_eq
    fuzzy_people:
      description: Filter by person using fuzzy matching.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by company ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    jump_query:
      description: Quick search query for jumping to a specific company by name.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_activity_at:
      description: Filter by last activity date range (`last_activity_at`).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by company name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    payment_terms:
      description: Filter by payment terms (days until invoice due).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by companies associated with a project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Search companies by name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by company status (active or archived).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subscriber_id:
      description: Filter by subscriber (person subscribed to company notifications).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter by the company's subsidiary (alias for `default_subsidiary_id`).
      operators:
        - contains
        - eq
