        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    resource_proposal:
      type: object
      title: Proposal Resource
      description: A document sent to a client summarizing proposed work, budget, and terms for a deal.
      properties:
        disclaimer_enabled:
          type: boolean
          title: Disclaimer Enabled
          description: When true, the disclaimer text is shown on the proposal.
          example:
            eq: value
        deal_id:
          type: integer
          title: Deal
          description: The ID of the deal this proposal belongs to.
          example:
            - 123
        responsible:
          title: Responsible
          description: The project manager responsible for this proposal.
          example:
            eq: value
        client:
          title: Client
          description: The client company this proposal is addressed to.
          example:
            eq: value
        proposal_to:
          title: Proposal To
          description: The recipient details (client contact) shown on the proposal.
          example:
            eq: value
        signed:
          title: Signed
          description: When true, the proposal has been signed by the client.
          example:
            eq: value
        currency_default:
          title: Currency Default
          description: The organization's default currency code.
          example:
            eq: value
        date:
          type: string
          title: Date
          format: date
          description: Date when this proposal was issued.
          example:
            gt: '2026-01-01'
        project:
          title: Project
          description: The project associated with this proposal.
          example:
            eq: value
        creator:
          title: Creator
          description: The person who created this proposal.
          example:
            eq: value
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who created this proposal.
          example:
            - 123
        proposal_version_two:
          type: boolean
          title: Proposal Version Two
        name:
          type: string
          title: Name
          description: The display name of the proposal.
          example:
            eq: value
        responder_email:
          type: string
          title: Responder Email
          nullable: true
          description: The email address of the person who responded to (signed) the proposal.
          example:
            eq: value
        identity_confirmation_enabled:
          type: boolean
          title: Identity Confirmation Enabled
        tax_rate:
          title: Tax Rate
          description: The tax rate applied to proposal line items.
          example:
            gt: 0
        responded_via_public_link:
          type: boolean
          title: Responded Via Public Link
          nullable: true
        signed_pdf_url:
          type: string
          title: Signed Pdf Url
          description: URL of the audit trail PDF for this proposal, capturing signature and viewing history.
        responder_name:
          type: string
          title: Responder Name
          nullable: true
          description: The name of the person who responded to (signed) the proposal.
          example:
            eq: value
        currency_normalized:
          title: Currency Normalized
