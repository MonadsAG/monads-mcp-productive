openapi: 3.1.0
info:
  title: Productive.io API – Proposals
  version: 2.0.0
description: |-
  **Proposals** are sales quotes attached to deals, presenting scope and pricing for client review and e-signature. A proposal mirrors the deal's sections and services in a client-facing layout with a pricing breakdown and acceptance workflow.

  Track proposal status, send for signing, and record approvals through these endpoints.
x-filters:
  proposal:
    deal_id:
      description: Filter by the associated deal.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by proposal status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_total:
      description: Filters proposals by their total budget amount.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filters proposals by the ID of their associated company (client).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filters proposals by their creation date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filters proposals by the ID of the person who created them.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    link_status:
      description: Filters proposals by their public link sharing status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    responsible_id:
      description: Filters proposals by the ID of their responsible person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    sent_at:
      description: Filters proposals by the date they were sent to the client.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status_changed_at:
      description: Filters proposals by the date their status last changed.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updated_at:
      description: Filters proposals by their last update date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
  proposal_service:
    id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    proposal_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
  proposal_session:
    id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    proposal_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/proposals:
    get:
      tags:
        - Proposals
      summary: Get proposals
      operationId: proposals-index
      description: List all proposals.
      parameters:
        - $ref: '#/components/parameters/filter_proposal'
        - $ref: '#/components/parameters/sort_proposal'
      responses:
        '200':
          $ref: '#/components/responses/collection_proposal'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Proposals
      summary: Create a proposal
      operationId: proposals-create
      description: Create a new proposal.
      responses:
        '201':
          $ref: '#/components/responses/single_proposal'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_proposal'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/proposals/{id}:
    get:
      tags:
        - Proposals
      summary: Gets a proposal
      operationId: proposals-show
      description: Retrieve a single proposal by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the proposal to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/single_proposal'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Proposals
      summary: Update a proposal
      operationId: proposals-update
      description: Update a proposal.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the proposal to update.
      responses:
        '200':
          $ref: '#/components/responses/single_proposal'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_proposal'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Proposals
      summary: Deletes a proposal
      operationId: proposals-destroy
      description: Delete a proposal by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the proposal to delete.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/proposal_services:
    get:
      tags:
        - Proposals
      summary: Get proposal services
      operationId: proposal_services-index
      parameters:
        - $ref: '#/components/parameters/filter_proposal_service'
        - $ref: '#/components/parameters/sort_proposal_service'
      responses:
        '200':
          $ref: '#/components/responses/collection_proposal_service'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/proposal_sessions:
    get:
      tags:
        - Proposals
      summary: Get proposal sessions
      operationId: proposal_sessions-index
      parameters:
        - $ref: '#/components/parameters/filter_proposal_session'
      responses:
        '200':
          $ref: '#/components/responses/collection_proposal_session'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/proposals/{id}/publish:
    patch:
      tags:
        - Proposals
      summary: Publish a proposal through its public link
      operationId: proposals-publish-publish
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_proposal'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_proposal'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/proposals/{id}/send:
    patch:
      tags:
        - Proposals
      summary: Send a proposal by email
      operationId: proposals-send-send
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_proposal'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_proposal'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/proposals/{id}/signed_pdf:
    get:
      tags:
        - Proposals
      summary: Get a download URL for the signed proposal PDF
      operationId: proposals-signed_pdf-signed_pdf
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/proposal_signed_pdf'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/proposals/{id}/sync_status:
    get:
      tags:
        - Proposals
      summary: Get proposal's sync status
      operationId: proposals-sync_status-sync_status
      description: Retrieve the sync status of a proposal.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the proposal to check sync status for.
      responses:
        '200':
          $ref: '#/components/responses/proposal_sync_status'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_proposal'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/proposals/{id}/sync:
    patch:
      tags:
        - Proposals
      summary: Sync a proposal
      operationId: proposals-sync-sync
      description: Sync a proposal with the associated deal.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the proposal to sync.
      responses:
        '200':
          $ref: '#/components/responses/single_proposal'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/unprocessable_content_proposal'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/public/proposals/{uuid}/accept:
    patch:
      tags:
        - Proposals
      summary: Accept a public proposal
      security:
        - header_token: []
      operationId: public-proposals-accept
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
          required: true
      requestBody:
        $ref: '#/components/requestBodies/public_proposal_accept'
      responses:
        '200':
          $ref: '#/components/responses/single_public_proposal'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_proposal'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/public/proposals/{uuid}/confirm_identity:
    patch:
      tags:
        - Proposals
      summary: Confirm identity for a public proposal
      security:
        - header_token: []
      operationId: public-proposals-confirm_identity
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
          required: true
      requestBody:
        $ref: '#/components/requestBodies/proposal_identity_confirmation'
      responses:
        '200':
          $ref: '#/components/responses/single_public_proposal'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '410':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Gone
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/public/proposals/{uuid}/decline:
    patch:
      tags:
        - Proposals
      summary: Decline a public proposal
      security: []
      operationId: public-proposals-decline
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
          required: true
        - in: header
          name: X-Proposal-Token
          schema:
            type: string
          required: false
          description: Access token from unlock, required when the proposal link is password-protected
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        decline_reason:
                          $ref: '#/components/schemas/resource_proposal/properties/decline_reason'
                        responder_email:
                          $ref: '#/components/schemas/resource_proposal/properties/responder_email'
                        responder_name:
                          $ref: '#/components/schemas/resource_proposal/properties/responder_name'
                    type:
                      enum:
                        - proposals
                      type: string
      responses:
        '200':
          $ref: '#/components/responses/single_public_proposal'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_proposal'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/public/proposals/{uuid}/file_authorize:
    get:
      tags:
        - Proposals
      summary: Authorize access to a public proposal file
      security: []
      operationId: public-proposals-file_authorize
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
          required: true
      responses:
        '200':
          description: The proposal's files may be read
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/public/proposals/{uuid}/file_presign:
    post:
      tags:
        - Proposals
      summary: Pre-sign a signature image upload for a public proposal
      security: []
      operationId: public-proposals-file_presign
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
          required: true
        - in: header
          name: X-Proposal-Token
          schema:
            type: string
          required: false
          description: Access token from unlock, required when the proposal link is password-protected
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        file_name:
                          type: string
                          description: Signature image file name; .jpg, .jpeg or .png
                    type:
                      enum:
                        - proposals
                      type: string
      responses:
        '201':
          $ref: '#/components/responses/public_proposal_file_presign'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_proposal'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/public/proposals/{uuid}:
    get:
      tags:
        - Proposals
      summary: Show a public proposal
      security: []
      operationId: public-proposals-show
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
          required: true
        - in: header
          name: X-Proposal-Token
          schema:
            type: string
          required: false
          description: Access token from unlock, required when the proposal link is password-protected
      responses:
        '200':
          $ref: '#/components/responses/single_public_proposal'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/public/proposals/{uuid}/unlock:
    post:
      tags:
        - Proposals
      summary: Unlock a password-protected public proposal
      security: []
      operationId: public-proposals-unlock
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        password:
                          type: string
                    type:
                      enum:
                        - proposals
                      type: string
      responses:
        '201':
          $ref: '#/components/responses/public_proposal_unlock'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
