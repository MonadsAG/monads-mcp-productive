openapi: 3.1.0
info:
  title: Productive.io API – Proposals
  version: 2.0.0
description: |-
  **Proposals** are sales quotes attached to deals, presenting scope and pricing for client review and e-signature. A proposal mirrors the deal's sections and services in a client-facing layout with a pricing breakdown and acceptance workflow.

  Track proposal status, send for signing, and record approvals through these endpoints.
x-filters:
  proposal:
    status:
      description: Filter by proposal status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filters proposals by the ID of the person who created them.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    responsible_id:
      description: Filters proposals by the ID of their responsible person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      description: Filter by the associated deal.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filters proposals by the ID of their associated company (client).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status_changed_at:
      description: Filters proposals by the date their status last changed.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updated_at:
      description: Filters proposals by their last update date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    link_status:
      description: Filters proposals by their public link sharing status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    sent_at:
      description: Filters proposals by the date they were sent to the client.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filters proposals by their creation date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_total:
      description: Filters proposals by their total budget amount.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/proposals:
    get:
      tags:
        - Proposals
      summary: Get proposals
      responses:
        '200':
          $ref: '#/components/responses/collection_proposal'
      parameters:
        - $ref: '#/components/parameters/filter_proposal'
        - $ref: '#/components/parameters/sort_proposal'
        - $ref: '#/components/parameters/header_organization'
      operationId: proposals-index
      description: List all proposals.
    post:
      tags:
        - Proposals
      summary: Create a proposal
      responses:
        '201':
          $ref: '#/components/responses/single_proposal'
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: proposals-create
      description: Create a new proposal.
  /api/v2/proposals/{id}:
    get:
      tags:
        - Proposals
      summary: Gets a proposal
      responses:
        '200':
          $ref: '#/components/responses/single_proposal'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the proposal to retrieve.
        - $ref: '#/components/parameters/header_organization'
      operationId: proposals-show
      description: Retrieve a single proposal by ID.
    patch:
      tags:
        - Proposals
      summary: Update a proposal
      responses:
        '200':
          $ref: '#/components/responses/single_proposal'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the proposal to update.
      operationId: proposals-update
      description: Update a proposal.
    delete:
      tags:
        - Proposals
      summary: Deletes a proposal
      responses:
        '204':
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the proposal to delete.
      operationId: proposals-destroy
      description: Delete a proposal by ID.
  /api/v2/proposals/{id}/sync_status:
    get:
      tags:
        - Proposals
      summary: Get proposal's sync status
      responses:
        '200':
          $ref: '#/components/responses/single_proposal'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the proposal to check sync status for.
      operationId: proposals-sync_status-sync_status
      description: Retrieve the sync status of a proposal.
  /api/v2/proposals/{id}/sync:
    patch:
      tags:
        - Proposals
      summary: Sync a proposal
      responses:
        '200':
          $ref: '#/components/responses/single_proposal'
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the proposal to sync.
        - $ref: '#/components/parameters/header_organization'
      operationId: proposals-sync-sync
      description: Sync a proposal with the associated deal.
  /api/v2/public/proposals/{uuid}/accept:
    patch:
      tags:
        - Proposals
      summary: Accept a public proposal
      responses:
        '200':
          $ref: '#/components/responses/single_public_proposal'
        '404':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Not Found
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
        '429':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Too Many Requests
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
          required: true
      operationId: public-proposals-accept
      requestBody:
        $ref: '#/components/requestBodies/public_proposal_accept'
components:
  requestBodies:
    public_proposal_accept:
      content:
        application/vnd.api+json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - type
                  - attributes
                properties:
                  type:
                    enum:
                      - proposals
                    type: string
                  attributes:
                    type: object
                    required:
                      - responder_name
                      - responder_email
                    properties:
                      responder_name:
                        $ref: '#/components/schemas/resource_proposal/properties/responder_name'
                      signature_type:
                        $ref: '#/components/schemas/resource_proposal/properties/signature_type'
                      responder_email:
                        $ref: '#/components/schemas/resource_proposal/properties/responder_email'
                      disclaimer_accepted:
                        $ref: '#/components/schemas/resource_proposal/properties/disclaimer_accepted'
                      signature_image_url:
                        $ref: '#/components/schemas/resource_proposal/properties/signature_image_url'
  schemas:
    resource_proposal:
      type: object
      title: Proposal Resource
      properties:
        proposal_version_two:
          type: boolean
          title: Proposal Version Two
        contact:
          title: Contact
          description: The contact person this proposal is addressed to.
          example:
            eq: value
        deal:
          title: Deal
          description: The deal (sales opportunity) this proposal belongs to.
          example:
            eq: value
        signed_pdf_url:
          type: string
          title: Signed Pdf Url
          description: URL of the audit trail PDF for this proposal, capturing signature and viewing history.
        exchange_date:
          type: string
          title: Exchange Date
          format: date
          description: The date used to determine the exchange rate applied to this proposal.
          example:
            gt: '2026-01-01'
        disclaimer_accepted:
          type: boolean
          title: Disclaimer Accepted
        note_interpolated:
          title: Note Interpolated
          description: The proposal note with all interpolation variables resolved.
          example:
            eq: value
        original_pdf_url:
          type: string
          title: Original Pdf Url
          deprecated: true
          description: Deprecated URL, use `pdf_url` instead.
          example:
            eq: value
        creator:
          title: Creator
          description: The person who created this proposal.
          example:
            eq: value
        currency:
          type: string
          title: Currency
          description: The currency code used for amounts in this proposal.
          example:
            eq: value
        note:
          type: string
          title: Note
          description: The body text of the proposal note, may contain interpolation variables.
          example:
            eq: value
        signature_type:
          enum:
            - typed
            - drawn
            - uploaded
          type: string
          title: Signature Type
        budget_total_default:
          title: Budget Total Default
          description: The total budget amount of this proposal in the organization's default currency.
          example:
            gt: 0
        footer:
          title: Footer
          description: The footer text template for the proposal, may contain interpolation variables.
          example:
            eq: value
        custom_fields:
          type: object
          title: Custom Fields
          description: Custom field values for this proposal.
          example:
            eq: value
        responsible:
          title: Responsible
          description: The project manager responsible for this proposal.
          example:
            eq: value
        signature_image_url:
          type: string
          title: Signature Image Url
        sent_at:
          type: string
          title: Sent At
          format: date-time
          description: Timestamp when the proposal was sent to the client.
          example:
            gt: '2026-01-01'
        responsible_id:
          type: integer
          title: Responsible
          description: ID of the person responsible for this proposal.
          example:
            - 123
        proposal_pdf_preview_on_mobile:
          type: boolean
          title: Proposal Pdf Preview On Mobile
        public_uuid:
          type: string
          title: Public Uuid
          description: The unique public UUID used to generate the proposal's public sharing link.
          example:
            eq: value
        pdf_url:
          type: string
          title: Pdf Url
          description: The URL of the generated PDF for this proposal.
        currency_normalized:
          title: Currency Normalized
          description: The normalized (reporting) currency code used across the organization.
          example:
            eq: value
        link_status:
          enum:
            - active
            - inactive
          type: string
          title: Link Status
          description: The public sharing link status of the proposal (e.g. active, disabled).
          example:
            eq: active
        disclaimer_enabled:
          type: boolean
          title: Disclaimer Enabled
          description: When true, the disclaimer text is shown on the proposal.
          example:
            eq: value
        currency_default:
          title: Currency Default
          description: The organization's default currency code.
          example:
            eq: value
        tax_rate:
          title: Tax Rate
          description: The tax rate applied to proposal line items.
          example:
            gt: 0
        budget_total_normalized:
          title: Budget Total Normalized
          description: The total budget amount of this proposal in the normalized (reporting) currency.
          example:
            gt: 0
        responder_name:
          type: string
          title: Responder Name
          nullable: true
          description: The name of the person who responded to (signed) the proposal.
          example:
            eq: value
        proposal_to:
          title: Proposal To
          description: The recipient details (client contact) shown on the proposal.
          example:
            eq: value
        status:
          enum:
            - draft
            - sent
            - accepted
            - declined
          type: string
          title: Status
          description: The current status of the proposal (e.g. draft, sent, approved, rejected).
          example:
            eq: active
        date:
          type: string
          title: Date
          format: date
          description: Date when this proposal was issued.
          example:
            gt: '2026-01-01'
        updated_at:
          type: string
          title: Updated At
          format: date
          description: Timestamp of the last update to this proposal.
          example:
            gt: '2026-01-01'
        client:
          title: Client
          description: The client company this proposal is addressed to.
          example:
            eq: value
        deal_creator:
          title: Deal Creator
          description: The person who created the deal associated with this proposal.
          example:
            eq: value
        responder_email:
          type: string
          title: Responder Email
          nullable: true
          description: The email address of the person who responded to (signed) the proposal.
          example:
            eq: value
        signed:
          title: Signed
          description: When true, the proposal has been signed by the client.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The display name of the proposal.
          example:
            eq: value
        status_changed_at:
          type: string
          title: Status Changed At
          format: date-time
          description: Timestamp when the proposal status last changed.
          example:
            gt: '2026-01-01'
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who created this proposal.
          example:
            - 123
        budget_total:
          title: Budget Total
          description: The total budget amount of this proposal in the proposal's currency.
          example:
            gt: 0
        footer_interpolated:
          title: Footer Interpolated
          description: The footer text with all interpolation variables resolved.
          example:
            eq: value
        deal_id:
          type: integer
          title: Deal
          description: The ID of the deal this proposal belongs to.
          example:
            - 123
        audit_pdf_url:
          type: string
          title: Audit Pdf Url
          deprecated: true
          description: Deprecated URL, use `signed_pdf_url` instead.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this proposal belongs to.
          example:
            eq: value
        company_id:
          type: integer
          title: Company
          description: ID of the client company associated with this proposal.
          example:
            - 123
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this proposal was created.
          example:
            gt: '2026-01-01'
        disclaimer:
          type: string
          title: Disclaimer
          description: The optional disclaimer text appended to the proposal.
          example:
            eq: value
        decline_reason:
          type: string
          title: Decline Reason
          nullable: true
        proposal_from:
          title: Proposal From
          description: The sender details (subsidiary contact) shown on the proposal.
          example:
            eq: value
        document_type:
          title: Document Type
          description: The document type template applied to this proposal for PDF generation.
          example:
            eq: active
        responded_via_public_link:
          type: boolean
          title: Responded Via Public Link
          nullable: true
        purchase_order_number:
          type: string
          title: Purchase Order Number
          description: The client's purchase order number associated with this proposal.
          example: PO-2024-017
        id:
          type: integer
          title: Id
          description: Unique identifier for the proposal.
          example:
            - 123
        project:
          title: Project
          description: The project associated with this proposal.
          example:
            eq: value
        subsidiary:
          title: Subsidiary
          description: The subsidiary (legal entity) issuing this proposal.
          example:
            eq: value
        exchange_rate:
          type: number
          title: Exchange Rate
          description: The exchange rate used to convert proposal amounts to the billing currency.
          example:
            gt: 0
        end_date:
          type: string
          title: End Date
          format: date
          description: The end date of the proposal's validity or service period.
          example:
            gt: '2026-01-01'
      description: A document sent to a client summarizing proposed work, budget, and terms for a deal.
      example:
        id: '23'
        type: proposals
        attributes:
          name: Website Redesign Proposal
          status: sent
          created_at: '2026-02-15T10:00:00.000+00:00'
          sent_at: '2026-02-16T09:00:00.000+00:00'
          accepted_at: null
          declined_at: null
          currency: USD
          total: '45000.00'
        relationships:
          deal:
            data:
              type: deals
              id: '89'
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  responses:
    single_public_proposal:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_proposal/properties/name'
                      signed:
                        $ref: '#/components/schemas/resource_proposal/properties/signed'
                      status:
                        $ref: '#/components/schemas/resource_proposal/properties/status'
                      pdf_url:
                        $ref: '#/components/schemas/resource_proposal/properties/pdf_url'
                      disclaimer:
                        $ref: '#/components/schemas/resource_proposal/properties/disclaimer'
                      decline_reason:
                        $ref: '#/components/schemas/resource_proposal/properties/decline_reason'
                      responder_name:
                        $ref: '#/components/schemas/resource_proposal/properties/responder_name'
                      responder_email:
                        $ref: '#/components/schemas/resource_proposal/properties/responder_email'
                      original_pdf_url:
                        $ref: '#/components/schemas/resource_proposal/properties/original_pdf_url'
                      status_changed_at:
                        $ref: '#/components/schemas/resource_proposal/properties/status_changed_at'
                      disclaimer_enabled:
                        $ref: '#/components/schemas/resource_proposal/properties/disclaimer_enabled'
                      proposal_version_two:
                        $ref: '#/components/schemas/resource_proposal/properties/proposal_version_two'
                      identity_confirmed_at:
                        $ref: '#/components/schemas/resource_proposal/properties/identity_confirmed_at'
                      responded_via_public_link:
                        $ref: '#/components/schemas/resource_proposal/properties/responded_via_public_link'
                      identity_confirmation_enabled:
                        $ref: '#/components/schemas/resource_proposal/properties/identity_confirmation_enabled'
                      proposal_pdf_preview_on_mobile:
                        $ref: '#/components/schemas/resource_proposal/properties/proposal_pdf_preview_on_mobile'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single public proposal
    single_proposal:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      date:
                        $ref: '#/components/schemas/resource_proposal/properties/date'
                      name:
                        $ref: '#/components/schemas/resource_proposal/properties/name'
                      note:
                        $ref: '#/components/schemas/resource_proposal/properties/note'
                      footer:
                        $ref: '#/components/schemas/resource_proposal/properties/footer'
                      signed:
                        $ref: '#/components/schemas/resource_proposal/properties/signed'
                      status:
                        $ref: '#/components/schemas/resource_proposal/properties/status'
                      pdf_url:
                        $ref: '#/components/schemas/resource_proposal/properties/pdf_url'
                      sent_at:
                        $ref: '#/components/schemas/resource_proposal/properties/sent_at'
                      currency:
                        $ref: '#/components/schemas/resource_proposal/properties/currency'
                      end_date:
                        $ref: '#/components/schemas/resource_proposal/properties/end_date'
                      created_at:
                        $ref: '#/components/schemas/resource_proposal/properties/created_at'
                      disclaimer:
                        $ref: '#/components/schemas/resource_proposal/properties/disclaimer'
                      link_status:
                        $ref: '#/components/schemas/resource_proposal/properties/link_status'
                      public_uuid:
                        $ref: '#/components/schemas/resource_proposal/properties/public_uuid'
                      budget_total:
                        $ref: '#/components/schemas/resource_proposal/properties/budget_total'
                      audit_pdf_url:
                        $ref: '#/components/schemas/resource_proposal/properties/audit_pdf_url'
                      custom_fields:
                        $ref: '#/components/schemas/resource_proposal/properties/custom_fields'
                      exchange_date:
                        $ref: '#/components/schemas/resource_proposal/properties/exchange_date'
                      exchange_rate:
                        $ref: '#/components/schemas/resource_proposal/properties/exchange_rate'
                      responder_name:
                        $ref: '#/components/schemas/resource_proposal/properties/responder_name'
                      signed_pdf_url:
                        $ref: '#/components/schemas/resource_proposal/properties/signed_pdf_url'
                      responder_email:
                        $ref: '#/components/schemas/resource_proposal/properties/responder_email'
                      currency_default:
                        $ref: '#/components/schemas/resource_proposal/properties/currency_default'
                      original_pdf_url:
                        $ref: '#/components/schemas/resource_proposal/properties/original_pdf_url'
                      note_interpolated:
                        $ref: '#/components/schemas/resource_proposal/properties/note_interpolated'
                      status_changed_at:
                        $ref: '#/components/schemas/resource_proposal/properties/status_changed_at'
                      disclaimer_enabled:
                        $ref: '#/components/schemas/resource_proposal/properties/disclaimer_enabled'
                      currency_normalized:
                        $ref: '#/components/schemas/resource_proposal/properties/currency_normalized'
                      footer_interpolated:
                        $ref: '#/components/schemas/resource_proposal/properties/footer_interpolated'
                      budget_total_default:
                        $ref: '#/components/schemas/resource_proposal/properties/budget_total_default'
                      identity_confirmed_at:
                        $ref: '#/components/schemas/resource_proposal/properties/identity_confirmed_at'
                      purchase_order_number:
                        $ref: '#/components/schemas/resource_proposal/properties/purchase_order_number'
                      budget_total_normalized:
                        $ref: '#/components/schemas/resource_proposal/properties/budget_total_normalized'
                      identity_confirmation_enabled:
                        $ref: '#/components/schemas/resource_proposal/properties/identity_confirmation_enabled'
                  relationships:
                    type: object
                    properties:
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      client:
                        $ref: '#/components/schemas/_single_relationship'
                      contact:
                        $ref: '#/components/schemas/_single_relationship'
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      project:
                        $ref: '#/components/schemas/_single_relationship'
                      tax_rate:
                        $ref: '#/components/schemas/_single_relationship'
                      subsidiary:
                        $ref: '#/components/schemas/_single_relationship'
                      proposal_to:
                        $ref: '#/components/schemas/_single_relationship'
                      responsible:
                        $ref: '#/components/schemas/_single_relationship'
                      deal_creator:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
