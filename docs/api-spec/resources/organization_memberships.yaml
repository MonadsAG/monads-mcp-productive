openapi: 3.1.0
info:
  title: Productive.io API – Organization Memberships
  version: 2.0.0
description: Organization memberships link users to organizations, granting login access. Stores per-user preferences including notification settings, default filters for each list view (tasks, deals, invoices, etc.), and UI layout preferences.
x-filters:
  organization_membership:
    organization_id:
      description: Filter by the associated organization.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/organization_memberships/{id}/clear_notifications:
    patch:
      tags:
        - Organization Memberships
      summary: Clear notifications for organization membership
      responses:
        '200':
          $ref: '#/components/responses/single_organization_membership'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: organization_memberships-clear_notifications-clear_notifications
      description: Clear all notifications for an organization membership.
  /api/v2/organization_memberships/{id}:
    get:
      tags:
        - Organization Memberships
      summary: Get an organization membership
      responses:
        '200':
          $ref: '#/components/responses/single_organization_membership'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: organization_memberships-show
      description: Retrieve a single organization membership.
    patch:
      tags:
        - Organization Memberships
      summary: Update an organization membership
      responses:
        '200':
          $ref: '#/components/responses/single_organization_membership'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: organization_memberships-update
      requestBody:
        $ref: '#/components/requestBodies/organization_membership'
      description: Update an organization membership.
    delete:
      tags:
        - Organization Memberships
      summary: Destroy organization membership
      responses:
        '204':
          description: No Content
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: organization_memberships-destroy
      description: Delete an organization membership.
  /api/v2/organization_memberships/{id}/dismiss_notifications:
    patch:
      tags:
        - Organization Memberships
      summary: Dismiss notifications for organization membership
      responses:
        '200':
          $ref: '#/components/responses/single_organization_membership'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: organization_memberships-dismiss_notifications-dismiss_notifications
      description: Dismiss all notifications for an organization membership.
  /api/v2/organization_memberships:
    get:
      tags:
        - Organization Memberships
      summary: Get organization memberships
      responses:
        '200':
          $ref: '#/components/responses/collection_organization_membership'
      parameters:
        - $ref: '#/components/parameters/sort_organization_membership'
        - $ref: '#/components/parameters/filter_organization_membership'
        - $ref: '#/components/parameters/header_organization'
      operationId: organization_memberships-index
      description: List organization memberships.
  /api/v2/organization_memberships/{id}/read_notifications:
    patch:
      tags:
        - Organization Memberships
      summary: Mark all notifications as read for organization membership
      responses:
        '200':
          $ref: '#/components/responses/single_organization_membership'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
      operationId: organization_memberships-read_notifications-read_notifications
components:
  parameters:
    header_organization:
