paths:
  /api/v2/deals/{id}/close:
    patch:
      tags:
        - Deals
      summary: Closes a deal
      responses:
        '200':
          $ref: '#/components/responses/single_deal'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: deals-close-close
      description: Close a deal.
  /api/v2/deals/copy:
    post:
      tags:
        - Deals
      summary: Copies a deal
      responses:
        '200':
          $ref: '#/components/responses/single_deal'
        '201':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Created
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      description: Create a copy of an existing deal.
      operationId: deals-copy-copy
      requestBody:
        $ref: '#/components/requestBodies/deal_bulk_copy'
  /api/v2/deals:
    get:
      tags:
        - Deals
      summary: Get deals
      responses:
        '200':
          $ref: '#/components/responses/collection_deal'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_deal'
        - $ref: '#/components/parameters/filter_deal'
      operationId: deals-index
      description: List deals with optional filters. Returns paginated deal records the caller has access to.
    post:
      tags:
        - Deals
      summary: Create a deal
      responses:
        '201':
          $ref: '#/components/responses/single_deal'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: deals-create
      requestBody:
        $ref: '#/components/requestBodies/deal'
      description: Create a new deal.
  /api/v2/deals/create_from_origin:
    post:
      tags:
        - Deals
      summary: Creates a budget from origin deal
      responses:
        '200':
          $ref: '#/components/responses/single_deal'
        '201':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Created
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: deals-create_from_origin-create_from_origin
      description: Create a new deal from an origin deal.
  /api/v2/deals/{id}:
    get:
      tags:
        - Deals
      summary: Gets a deal
      responses:
        '200':
          $ref: '#/components/responses/single_deal'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: deals-show
      description: Retrieve a single deal by ID.
    patch:
      tags:
        - Deals
      summary: Update a deal
      responses:
        '200':
          $ref: '#/components/responses/single_deal'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: deals-update
      requestBody:
        $ref: '#/components/requestBodies/deal'
      description: Update a deal's attributes or relationships.
    delete:
      tags:
        - Deals
      summary: Deletes a deal
      responses:
        '204':
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: deals-destroy
      description: Delete a deal.
  /api/v2/deals/{id}/open:
    patch:
      tags:
        - Deals
      summary: Opens a deal
      responses:
        '200':
          $ref: '#/components/responses/single_deal'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: deals-open-open
      description: Reopen a closed deal.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_deal:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.deal at the top of this file.
      required: false
      description: Filters
    sort_deal:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - billable_time
            - -billable_time
            - budget_status
            - -budget_status
            - budget_total
            - -budget_total
            - budget_used
            - -budget_used
            - budget_warning
