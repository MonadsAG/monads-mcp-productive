paths:
  /api/v2/deals/close:
    patch:
      tags:
        - Deals
      summary: Closes several budgets
      description: |
        Closes several budgets in one request. Requires the JSON:API bulk extension header
        (`Content-Type: application/vnd.api+json; ext=bulk`); the single-budget endpoint lives at
        `/api/v2/deals/{id}/close`. Close is a budget-only action, so a sales deal in the payload is
        rejected. Each item may carry its own `delivered_on` (defaults to today) and
        `destroy_future_bookings`. Authorization is all or nothing — when any budget is denied (403)
        or cannot be closed (409, e.g. it is already closed, has unapproved time entries or expenses,
        or a running timer), none of them close and every blocked row is reported with its
        `meta.bulk_index`. A `delivered_on` in a locked financial month also rejects the whole batch
        with a 409, without `meta.bulk_index`. A batch is limited to 100 budgets; a larger one is
        rejected with a 422 before any check runs.
      operationId: deals-bulk-close
      requestBody:
        $ref: '#/components/requestBodies/deal_bulk_close'
      responses:
        '200':
          $ref: '#/components/responses/collection_deal'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/deals/open:
    patch:
      tags:
        - Deals
      summary: Opens several budgets
      description: |
        Reopens several closed budgets in one request. Requires the JSON:API bulk extension header
        (`Content-Type: application/vnd.api+json; ext=bulk`); the single-budget endpoint lives at
        `/api/v2/deals/{id}/open`. Open is a budget-only action, so a sales deal in the payload is
        rejected. Authorization is all or nothing — when any budget is denied (403) or cannot be
        opened (409, e.g. it is already open or its delivered on falls in a locked financial month),
        none of them open and every blocked row is reported with its `meta.bulk_index`. A batch is
        limited to 100 budgets; a larger one is rejected with a 422 before any check runs.
      operationId: deals-bulk-open
      requestBody:
        $ref: '#/components/requestBodies/deal_bulk_open'
      responses:
        '200':
          $ref: '#/components/responses/collection_deal'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/deals/{id}/close:
    patch:
      tags:
        - Deals
      summary: Closes a deal
      operationId: deals-close-close
      description: Close a deal.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_deal'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_deal'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/deals/copy:
    post:
      tags:
        - Deals
      summary: Copies a deal
      description: Create a copy of an existing deal.
      operationId: deals-copy-copy
      requestBody:
