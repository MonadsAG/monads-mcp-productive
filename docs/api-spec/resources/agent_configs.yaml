openapi: 3.1.0
info:
  title: Productive.io API – Agent Configs
  version: 2.0.0
description: Endpoints for managing agent configurations — AI behavior instructions and Slack trigger settings for an agent.
x-filters:
  agent_config:
    id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    agent_id:
      description: Filter agent configurations by their associated agent's ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/agent_configs:
    get:
      tags:
        - Agent Configs
      summary: Get agent configs
      responses:
        '200':
          $ref: '#/components/responses/collection_agent_config'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_agent_config'
        - $ref: '#/components/parameters/filter_agent_config'
      operationId: agent-configs-index
      description: Returns a paginated list of agent configurations in the organization. Supports filtering by agent ID.
    post:
      tags:
        - Agent Configs
      summary: Create an agent config
      responses:
        '201':
          $ref: '#/components/responses/single_agent_config'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Returned when creating an agent configuration fails validation.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: agent-configs-create
      requestBody:
        $ref: '#/components/requestBodies/agent_config'
      description: Creates a new configuration for an agent, defining AI behavior instructions and Slack integration trigger settings.
  /api/v2/agent_configs/{id}:
    get:
      tags:
        - Agent Configs
      summary: Get an agent config
      responses:
        '200':
          $ref: '#/components/responses/single_agent_config'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The unique identifier of the agent configuration to retrieve.
      operationId: agent-configs-show
      description: Returns the configuration for the specified agent, including AI instructions and Slack trigger settings.
    patch:
      tags:
        - Agent Configs
      summary: Update an agent config
      responses:
        '200':
          $ref: '#/components/responses/single_agent_config'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Returned when updating the agent configuration fails validation.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The unique identifier of the agent configuration to update.
        - $ref: '#/components/parameters/header_organization'
      operationId: agent-configs-update
      requestBody:
        $ref: '#/components/requestBodies/agent_config_update'
      description: Updates the configuration for the specified agent, including AI behavior instructions and Slack trigger settings.
    delete:
      tags:
        - Agent Configs
      summary: Delete an agent config
      responses:
        '204':
          description: Returned when the agent configuration is successfully deleted.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
      operationId: agent-configs-destroy
      description: Deletes the specified agent configuration. This action cannot be undone.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_agent_config:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.agent_config at the top of this file.
      required: false
      description: Query parameter for filtering the agent configurations list. Accepts filter fields defined in the `filter_agent_config` schema.
    sort_agent_config:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort agent config
      explode: false
      required: false
  requestBodies:
    agent_config_update:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      instructions:
                        $ref: '#/components/schemas/resource_agent_config/properties/instructions'
    agent_config:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - agent_id
                    properties:
                      agent_id:
                        $ref: '#/components/schemas/resource_agent_config/properties/agent_id'
                      instructions:
                        $ref: '#/components/schemas/resource_agent_config/properties/instructions'
      description: Request body for creating or updating an agent configuration, including AI behavior instructions and Slack trigger settings.
  schemas:
    resource_agent_config:
      type: object
      title: Agent Config Resource
      properties:
        instructions:
          type: string
          title: Instructions
          description: The AI behavior instructions for this agent — describes how it should respond, what tasks it handles, and any operational constraints.
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: The timestamp when this agent configuration was last updated.
        created_at:
          type: string
          title: Created At
          format: date-time
          description: The timestamp when this agent configuration was created.
        agent:
          title: Agent
          description: The agent this configuration belongs to.
        attachments:
          title: Attachments
          description: Files attached to this agent configuration, such as knowledge base documents the agent can reference.
        id:
          type: integer
          title: Id
          description: The unique identifier of the agent configuration.
        agent_id:
          type: integer
          title: Agent
          description: The ID of the agent this configuration belongs to.
      description: Represents the configuration for an AI agent, including its AI behavior instructions and Slack integration trigger settings.
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _collection_relationship:
      anyOf:
        - type: object
          title: Collection data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          description: Included variant — related resource identifiers are present in `data`.
          example:
            data:
              - type: tasks
                id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
  responses:
    single_agent_config:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      created_at:
                        $ref: '#/components/schemas/resource_agent_config/properties/created_at'
                      updated_at:
                        $ref: '#/components/schemas/resource_agent_config/properties/updated_at'
                      instructions:
                        $ref: '#/components/schemas/resource_agent_config/properties/instructions'
                  relationships:
                    type: object
                    properties:
                      agent:
                        $ref: '#/components/schemas/_single_relationship'
                      attachments:
                        $ref: '#/components/schemas/_collection_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: A single agent configuration record returned in JSON:API format.
    collection_agent_config:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        created_at:
                          $ref: '#/components/schemas/resource_agent_config/properties/created_at'
                        updated_at:
                          $ref: '#/components/schemas/resource_agent_config/properties/updated_at'
                        instructions:
                          $ref: '#/components/schemas/resource_agent_config/properties/instructions'
                    relationships:
                      type: object
                      properties:
                        agent:
                          $ref: '#/components/schemas/_single_relationship'
                        attachments:
                          $ref: '#/components/schemas/_collection_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: A paginated collection of agent configurations returned in JSON:API format.
