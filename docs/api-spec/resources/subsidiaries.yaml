openapi: 3.1.0
info:
  title: Productive.io API – Subsidiaries
  version: 2.0.0
description: |-
  ### Subsidiary Tax ID

  The Tax ID displayed in **Settings → Company info → Edit Subsidiary** can be retrieved through the API via the related bill_from contact entry by calling:

  `GET /api/v2/subsidiaries/{id}?include=bill_from`

  The Tax ID is returned in the included section, inside the contact_entries object, where type is bill_from, under the `vat` attribute.
x-filters:
  subsidiary:
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by status (active or archived).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/subsidiaries/{id}/archive:
    patch:
      tags:
        - Subsidiaries
      summary: Archives a subsidiary
      operationId: subsidiaries-archive-archive
      description: Archive a subsidiary to deactivate it.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_subsidiary'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/subsidiaries:
    get:
      tags:
        - Subsidiaries
      summary: Gets all subsidiaries
      operationId: subsidiaries-index
      description: List all subsidiaries.
      parameters:
        - $ref: '#/components/parameters/filter_subsidiary'
        - $ref: '#/components/parameters/sort_subsidiary'
      responses:
        '200':
          $ref: '#/components/responses/collection_subsidiary'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Subsidiaries
      summary: Create a subsidiary
      operationId: subsidiaries-create
      description: Create a new subsidiary.
      requestBody:
        $ref: '#/components/requestBodies/subsidiary'
      responses:
        '201':
          $ref: '#/components/responses/single_subsidiary'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_subsidiary'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/subsidiaries/{id}:
    get:
      tags:
        - Subsidiaries
      summary: Gets a subsidiary
      operationId: subsidiaries-show
      description: Retrieve a single subsidiary by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_subsidiary'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Subsidiaries
      summary: Update a subsidiary
      operationId: subsidiaries-update
      description: Update a subsidiary.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/subsidiary'
      responses:
        '200':
          $ref: '#/components/responses/single_subsidiary'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_subsidiary'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
