  requestBodies:
    subsidiary:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a subsidiary.
            properties:
              data:
                type: object
                description: The JSON:API data object containing the subsidiary resource attributes and relationships.
                properties:
                  attributes:
                    type: object
                    description: Subsidiary attributes.
                    properties:
                      custom_domain_id:
                        $ref: '#/components/schemas/resource_subsidiary/properties/custom_domain_id'
                      default_bank_account_id:
                        $ref: '#/components/schemas/resource_subsidiary/properties/default_bank_account_id'
                      default_document_type_id:
                        $ref: '#/components/schemas/resource_subsidiary/properties/default_document_type_id'
                      default_tax_rate_id:
                        $ref: '#/components/schemas/resource_subsidiary/properties/default_tax_rate_id'
                      facility_costs:
                        $ref: '#/components/schemas/resource_subsidiary/properties/facility_costs'
                      facility_costs_breakdown:
                        $ref: '#/components/schemas/resource_subsidiary/properties/facility_costs_breakdown'
                      invoice_logo_url:
                        $ref: '#/components/schemas/resource_subsidiary/properties/invoice_logo_url'
                      invoice_number_format:
                        $ref: '#/components/schemas/resource_subsidiary/properties/invoice_number_format'
                      invoice_number_scope:
                        $ref: '#/components/schemas/resource_subsidiary/properties/invoice_number_scope'
                      name:
                        $ref: '#/components/schemas/resource_subsidiary/properties/name'
                      show_delivery_date:
                        $ref: '#/components/schemas/resource_subsidiary/properties/show_delivery_date'
                    required:
                      - name
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: subsidiaries
                attributes:
                  name: Acme Agency EU
      description: Request body for creating or updating a subsidiary (legal entity). Specify the name, invoice number format, invoice number scope, and optional branding (logo, document style) and default tax rate and bank account.
  parameters:
    sort_subsidiary:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - name
            - -name
          type: string
        title: Sort subsidiary
      explode: false
      required: false
      description: Sort subsidiary
    filter_subsidiary:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.subsidiary at the top of this file.
      required: false
      description: Filters
