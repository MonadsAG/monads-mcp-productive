                        facility_costs_breakdown:
                          anyOf:
                            - $ref: '#/components/schemas/resource_subsidiary/properties/facility_costs_breakdown'
                            - type: 'null'
                          description: Breakdown of facility costs by component.
                        facility_costs_default:
                          $ref: '#/components/schemas/resource_subsidiary/properties/facility_costs_default'
                        facility_costs_normalized:
                          $ref: '#/components/schemas/resource_subsidiary/properties/facility_costs_normalized'
                        invoice_logo_url:
                          anyOf:
                            - $ref: '#/components/schemas/resource_subsidiary/properties/invoice_logo_url'
                            - type: 'null'
                          description: URL of the logo used on invoices issued by this subsidiary.
                        invoice_number_format:
                          anyOf:
                            - $ref: '#/components/schemas/resource_subsidiary/properties/invoice_number_format'
                            - type: 'null'
                          description: The format template for invoice numbers (e.g. INV-{year}-{number}).
                        invoice_number_scope:
                          anyOf:
                            - $ref: '#/components/schemas/resource_subsidiary/properties/invoice_number_scope'
                            - type: 'null'
                          description: The scope for invoice number sequencing (per subsidiary or organization-wide).
                        name:
                          $ref: '#/components/schemas/resource_subsidiary/properties/name'
                        show_delivery_date:
                          $ref: '#/components/schemas/resource_subsidiary/properties/show_delivery_date'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Subsidiary relationships.
                      properties:
                        bill_from:
                          $ref: '#/components/schemas/_single_relationship'
                        custom_domain:
                          $ref: '#/components/schemas/_single_relationship'
                        default_bank_account:
                          $ref: '#/components/schemas/_single_relationship'
                        default_document_type:
                          $ref: '#/components/schemas/_single_relationship'
                        default_tax_rate:
                          $ref: '#/components/schemas/_single_relationship'
                        einvoice_configuration:
                          $ref: '#/components/schemas/_single_relationship'
                        einvoice_identity:
                          $ref: '#/components/schemas/_single_relationship'
                        integration:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of subsidiary resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '2'
                  type: subsidiaries
                  attributes:
                    name: Acme Agency EU
                    archived_at: null
                    show_delivery_date: false
                    invoice_number_format: INV-{YYYY}-{NNN}
                    invoice_number_scope: subsidiary
                  relationships:
                    bill_from:
                      data:
                        type: contact_entries
                        id: '891'
                    default_tax_rate:
                      data:
                        type: tax_rates
                        id: '8'
                    default_bank_account:
                      data:
                        type: bank_accounts
                        id: '5'
                    default_document_type:
                      data:
                        type: document_types
                        id: '3'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection subsidiary
    conflict:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_conflict'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Conflict
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_subsidiary:
      enum:
        - bad_decimal_format
        - invalid_attribute
        - invalid_attribute_value
        - non_finite_number
        - null_bytes_in_params
      type: string
      title: Error Code
      description: Every error `code` the subsidiaries endpoints can return.
    error_code_unsupported_media_type:
      enum:
        - unsupported_content_type
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 415.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_not_acceptable:
      enum:
        - bulk_extensions_headers_invalid
        - not_acceptable
        - read_only_mode_violation
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 406.
    error_code_not_found:
      enum:
        - not_found
