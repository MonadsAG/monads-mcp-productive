    single_subsidiary:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single subsidiary record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned subsidiary resource.
                properties:
                  attributes:
                    type: object
                    description: Subsidiary attributes.
                    properties:
                      archived_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_subsidiary/properties/archived_at'
                          - type: 'null'
                        description: The timestamp when the subsidiary was archived, or null if active.
                      export_integration_type_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_subsidiary/properties/export_integration_type_id'
                          - type: 'null'
                        description: The accounting integration type identifier used for invoice exports.
                      facility_costs:
                        $ref: '#/components/schemas/resource_subsidiary/properties/facility_costs'
                      facility_costs_breakdown:
                        anyOf:
                          - $ref: '#/components/schemas/resource_subsidiary/properties/facility_costs_breakdown'
                          - type: 'null'
                        description: A breakdown of facility overhead cost components.
                      facility_costs_default:
                        $ref: '#/components/schemas/resource_subsidiary/properties/facility_costs_default'
                      facility_costs_normalized:
                        $ref: '#/components/schemas/resource_subsidiary/properties/facility_costs_normalized'
                      invoice_logo_url:
                        anyOf:
                          - $ref: '#/components/schemas/resource_subsidiary/properties/invoice_logo_url'
                          - type: 'null'
                        description: The URL of the logo image used on invoices for this subsidiary.
                      invoice_number_format:
                        anyOf:
                          - $ref: '#/components/schemas/resource_subsidiary/properties/invoice_number_format'
                          - type: 'null'
                        description: The format template for auto-generated invoice numbers.
                      invoice_number_scope:
                        anyOf:
                          - $ref: '#/components/schemas/resource_subsidiary/properties/invoice_number_scope'
                          - type: 'null'
                        description: The scope for invoice number sequences (e.g. per-subsidiary or organization-wide).
                      name:
                        $ref: '#/components/schemas/resource_subsidiary/properties/name'
                      show_delivery_date:
                        $ref: '#/components/schemas/resource_subsidiary/properties/show_delivery_date'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Subsidiary relationships.
                    properties:
                      bill_from:
                        $ref: '#/components/schemas/_single_relationship'
                      custom_domain:
                        $ref: '#/components/schemas/_single_relationship'
                      default_bank_account:
                        $ref: '#/components/schemas/_single_relationship'
                      default_document_type:
                        $ref: '#/components/schemas/_single_relationship'
                      default_tax_rate:
                        $ref: '#/components/schemas/_single_relationship'
                      einvoice_configuration:
                        $ref: '#/components/schemas/_single_relationship'
                      einvoice_identity:
                        $ref: '#/components/schemas/_single_relationship'
                      integration:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '2'
                type: subsidiaries
                attributes:
                  name: Acme Agency EU
                  archived_at: null
                  show_delivery_date: false
                  invoice_number_format: INV-{YYYY}-{NNN}
                  invoice_number_scope: subsidiary
                relationships:
                  bill_from:
                    data:
                      type: contact_entries
                      id: '891'
                  default_tax_rate:
                    data:
                      type: tax_rates
                      id: '8'
                  default_bank_account:
                    data:
                      type: bank_accounts
                      id: '5'
                  default_document_type:
                    data:
                      type: document_types
                      id: '3'
              included: []
      description: Single subsidiary
    collection_subsidiary:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of subsidiary records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A subsidiary resource object.
                  properties:
                    attributes:
                      type: object
                      description: Subsidiary attributes.
                      properties:
                        archived_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_subsidiary/properties/archived_at'
                            - type: 'null'
                          description: Timestamp when this subsidiary was archived.
                        export_integration_type_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_subsidiary/properties/export_integration_type_id'
