  requestBodies:
    deal_status:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body schema for a pipeline stage.
            properties:
              data:
                type: object
                description: The pipeline stage resource object.
                properties:
                  attributes:
                    type: object
                    description: Pipeline stage attributes.
                    properties:
                      booking_tracking_enabled:
                        $ref: '#/components/schemas/resource_deal_status/properties/booking_tracking_enabled'
                      color_id:
                        $ref: '#/components/schemas/resource_deal_status/properties/color_id'
                      expense_tracking_enabled:
                        $ref: '#/components/schemas/resource_deal_status/properties/expense_tracking_enabled'
                      lost_reason_enabled:
                        $ref: '#/components/schemas/resource_deal_status/properties/lost_reason_enabled'
                      name:
                        $ref: '#/components/schemas/resource_deal_status/properties/name'
                      pipeline_id:
                        $ref: '#/components/schemas/resource_deal_status/properties/pipeline_id'
                      position:
                        $ref: '#/components/schemas/resource_deal_status/properties/position'
                      probability:
                        $ref: '#/components/schemas/resource_deal_status/properties/probability'
                      probability_enabled:
                        $ref: '#/components/schemas/resource_deal_status/properties/probability_enabled'
                      status_id:
                        $ref: '#/components/schemas/resource_deal_status/properties/status_id'
                      time_tracking_enabled:
                        $ref: '#/components/schemas/resource_deal_status/properties/time_tracking_enabled'
                    required:
                      - name
                      - pipeline_id
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: deal_statuses
                attributes:
                  name: Proposal Sent
                  position: 3
                  outcome: open
                  color_id: '7'
                relationships:
                  pipeline:
                    data:
                      type: pipelines
                      id: '1'
      description: Request body for creating or updating a deal status. Specify the pipeline, name, position, outcome category (status_id), color, and optional tracking flags for time, expenses, bookings, and probability.
  parameters:
    sort_deal_status:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - created_at
            - -created_at
            - id
            - -id
            - name
            - -name
            - pipeline_id
            - -pipeline_id
            - position
            - -position
            - status_id
            - -status_id
          type: string
        title: Sort deal status
      explode: false
      required: false
      description: Sort deal status
    filter_deal_status:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.deal_status at the top of this file.
      required: false
      description: Filters
