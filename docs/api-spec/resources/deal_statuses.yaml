openapi: 3.1.0
info:
  title: Productive.io API – Deal Statuses
  version: 2.0.0
description: Pipeline stages defining deal outcomes. Each status belongs to a pipeline and has an outcome category (open, won, lost, or delivered). Statuses can enable time tracking, expense tracking, booking tracking, and probability estimation.
x-filters:
  deal_status:
    booking_tracking_enabled:
      description: Filter to stages with booking tracking enabled or disabled.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    expense_tracking_enabled:
      description: Filter to stages with expense tracking enabled or disabled.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by deal status ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    lost_reason_enabled:
      description: Filter to stages where lost reason entry is enabled or disabled.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    pipeline_id:
      description: Filter by associated pipeline.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    pipeline_type_id:
      description: Filter by pipeline type (sales or production).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    probability_enabled:
      description: Filter to stages with probability tracking enabled or disabled.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Filter by deal status name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status_id:
      description: Filter by pipeline stage outcome (open, won, lost, delivered).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    time_tracking_enabled:
      description: Filter to stages with time tracking enabled or disabled.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/deal_statuses/{id}/archive:
    patch:
      tags:
        - Deal Statuses
      summary: Archives a deal status
      operationId: deal_statuses-archive-archive
      description: Archive a deal status.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_deal_status'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/deal_statuses:
    get:
      tags:
        - Deal Statuses
      summary: Get deal statuses
      operationId: deal_statuses-index
      description: List deal statuses with optional filters and pagination.
      parameters:
        - $ref: '#/components/parameters/filter_deal_status'
        - $ref: '#/components/parameters/sort_deal_status'
      responses:
        '200':
          $ref: '#/components/responses/collection_deal_status'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Deal Statuses
      summary: Create a deal status
      operationId: deal_statuses-create
      description: Create a new deal status.
      requestBody:
        $ref: '#/components/requestBodies/deal_status'
      responses:
        '201':
          $ref: '#/components/responses/single_deal_status'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_deal_status'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/deal_statuses/{id}:
    get:
      tags:
        - Deal Statuses
      summary: Gets a deal status
      operationId: deal_statuses-show
      description: Retrieve a single deal status by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_deal_status'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Deal Statuses
      summary: Update a deal status
      operationId: deal_statuses-update
      description: Update a deal status.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/deal_status'
      responses:
        '200':
          $ref: '#/components/responses/single_deal_status'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_deal_status'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Deal Statuses
      summary: Destroy a deal status
      operationId: deal_statuses-destroy
      description: Delete a deal status.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/unprocessable_content_deal_status'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/deal_statuses/merge:
    patch:
      tags:
        - Deal Statuses
      summary: Merges a deal status
      operationId: deal_statuses-merge-merge
      description: Merge deal statuses.
      responses:
        '200':
          $ref: '#/components/responses/single_deal_status'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_deal_status'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content_deal_status:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_deal_status'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    single_deal_status:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single deal status record in JSON:API format.
            properties:
              data:
                type: object
                description: The deal status resource object.
                properties:
                  attributes:
                    type: object
                    description: Deal status attributes.
                    properties:
                      archived_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_deal_status/properties/archived_at'
                          - type: 'null'
                        description: The date and time when the deal status was archived, or null if active.
                      booking_tracking_enabled:
                        $ref: '#/components/schemas/resource_deal_status/properties/booking_tracking_enabled'
                      color_id:
                        anyOf:
                          - type: string
                          - type: 'null'
                        description: The color ID used to visually represent this status in the pipeline.
                      expense_tracking_enabled:
                        $ref: '#/components/schemas/resource_deal_status/properties/expense_tracking_enabled'
                      lost_reason_enabled:
                        $ref: '#/components/schemas/resource_deal_status/properties/lost_reason_enabled'
                      name:
                        $ref: '#/components/schemas/resource_deal_status/properties/name'
                      position:
                        anyOf:
                          - $ref: '#/components/schemas/resource_deal_status/properties/position'
                          - type: 'null'
                        description: The display order position of this status in the pipeline.
                      probability:
                        anyOf:
                          - $ref: '#/components/schemas/resource_deal_status/properties/probability'
                          - type: 'null'
                        description: The default win probability percentage for deals in this status.
                      probability_enabled:
                        $ref: '#/components/schemas/resource_deal_status/properties/probability_enabled'
                      status_id:
                        $ref: '#/components/schemas/resource_deal_status/properties/status_id'
                      time_tracking_enabled:
                        $ref: '#/components/schemas/resource_deal_status/properties/time_tracking_enabled'
                      used:
                        $ref: '#/components/schemas/resource_deal_status/properties/used'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Deal status relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      pipeline:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '5'
                type: deal_statuses
                attributes:
                  name: Proposal Sent
                  position: 3
                  outcome: open
                  color_id: '7'
                relationships:
                  pipeline:
                    data:
                      type: pipelines
                      id: '1'
              included: []
      description: Single deal status
    conflict:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_conflict'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Conflict
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    collection_deal_status:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of deal status records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A deal status resource object.
                  properties:
                    attributes:
                      type: object
                      description: Deal status attributes.
                      properties:
                        archived_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_deal_status/properties/archived_at'
                            - type: 'null'
                          description: Timestamp when this deal status was archived, or null if active.
                        booking_tracking_enabled:
                          $ref: '#/components/schemas/resource_deal_status/properties/booking_tracking_enabled'
                        color_id:
                          anyOf:
                            - type: string
                            - type: 'null'
                          description: Color identifier for this status label in the pipeline board.
                        expense_tracking_enabled:
                          $ref: '#/components/schemas/resource_deal_status/properties/expense_tracking_enabled'
                        lost_reason_enabled:
                          $ref: '#/components/schemas/resource_deal_status/properties/lost_reason_enabled'
                        name:
                          $ref: '#/components/schemas/resource_deal_status/properties/name'
                        position:
                          anyOf:
                            - $ref: '#/components/schemas/resource_deal_status/properties/position'
                            - type: 'null'
                          description: Sort order position of this status within the pipeline.
                        probability:
                          anyOf:
                            - $ref: '#/components/schemas/resource_deal_status/properties/probability'
                            - type: 'null'
                          description: Win probability percentage for deals in this status (0-100).
                        probability_enabled:
                          $ref: '#/components/schemas/resource_deal_status/properties/probability_enabled'
                        status_id:
                          $ref: '#/components/schemas/resource_deal_status/properties/status_id'
                        time_tracking_enabled:
                          $ref: '#/components/schemas/resource_deal_status/properties/time_tracking_enabled'
                        used:
                          $ref: '#/components/schemas/resource_deal_status/properties/used'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Deal status relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        pipeline:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of deal status resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '5'
                  type: deal_statuses
                  attributes:
                    name: Proposal Sent
                    position: 3
                    outcome: open
                    color_id: '7'
                  relationships:
                    pipeline:
                      data:
                        type: pipelines
                        id: '1'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection deal status
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_deal_status:
      enum:
        - bad_decimal_format
        - deal_status_last_stage_not_allowed
        - deal_status_mismatch
        - deal_status_status_change_not_allowed
        - invalid_attribute_value
        - non_finite_number
        - null_bytes_in_params
        - probability_feature_unavailable
      type: string
      title: Error Code
