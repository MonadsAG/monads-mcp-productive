openapi: 3.1.0
info:
  title: Productive.io API – Job Role
  version: 2.0.0
x-filters:
  job_role:
    query:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/job_roles/{id}/archive:
    patch:
      tags:
        - Job Role
      summary: Archives the job role
      responses:
        '200':
          $ref: '#/components/responses/single_job_role'
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
      operationId: job_roles-archive-archive
  /api/v2/job_roles:
    get:
      tags:
        - Job Role
      summary: Get job roles
      responses:
        '200':
          $ref: '#/components/responses/collection_job_role'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_job_role'
        - $ref: '#/components/parameters/filter_job_role'
      operationId: job_roles-index
    post:
      tags:
        - Job Role
      summary: Creates the job role
      responses:
        '201':
          $ref: '#/components/responses/single_job_role'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: job_roles-create
      requestBody:
        $ref: '#/components/requestBodies/job_role'
  /api/v2/job_roles/{id}/restore:
    patch:
      tags:
        - Job Role
      summary: Restores the job role
      responses:
        '200':
          $ref: '#/components/responses/single_job_role'
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - $ref: '#/components/parameters/header_organization'
      operationId: job_roles-restore-restore
  /api/v2/job_roles/{id}:
    get:
      tags:
        - Job Role
      summary: Gets the job role
      responses:
        '200':
          $ref: '#/components/responses/single_job_role'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
      operationId: job_roles-show
    patch:
      tags:
        - Job Role
      summary: Updates the job role
      responses:
        '200':
          $ref: '#/components/responses/single_job_role'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
      operationId: job_roles-update
      requestBody:
        $ref: '#/components/requestBodies/job_role'
components:
  requestBodies:
    job_role:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_job_role/properties/name'
  schemas:
    resource_job_role:
      type: object
      title: Job role Resource
      properties:
        organization:
          title: Organization
        updated_at:
          type: string
          title: Updated At
          format: date-time
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        query:
          type: string
          title: Query
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
        archived_at:
          type: string
          title: Archived At
          format: date-time
        created_at:
          type: string
          title: Created At
          format: date-time
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_job_role:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.job_role at the top of this file.
      required: false
    sort_job_role:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort job role
      explode: false
      required: false
  responses:
    single_job_role:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_job_role/properties/name'
                      created_at:
                        $ref: '#/components/schemas/resource_job_role/properties/created_at'
                      updated_at:
                        $ref: '#/components/schemas/resource_job_role/properties/updated_at'
                      archived_at:
                        $ref: '#/components/schemas/resource_job_role/properties/archived_at'
                  relationships:
                    type: object
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single job role
    collection_job_role:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_job_role/properties/name'
                        created_at:
                          $ref: '#/components/schemas/resource_job_role/properties/created_at'
                        updated_at:
                          $ref: '#/components/schemas/resource_job_role/properties/updated_at'
                        archived_at:
                          $ref: '#/components/schemas/resource_job_role/properties/archived_at'
                    relationships:
                      type: object
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection job role
