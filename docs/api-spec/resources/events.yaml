    resource_event:
      type: object
      title: Event Resource
      description: An absence event type (e.g. vacation, sick leave) used to categorize time-off bookings in the resource planner.
      properties:
        absence_type:
          enum:
            - time_off
            - remote_work
          type: string
          title: Absence Type
          description: The absence category of this event, either time_off (standard time-off) or remote_work.
          example:
            eq: active
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this event was archived, or null if it is still active.
          example:
            gt: '2026-01-01'
        color_id:
          type: string
          title: Color
          description: ID of the color associated with this event for display purposes.
          example:
            - 123
        event_type_id:
          enum:
            - 1
            - 2
          type: integer
          title: Event Type
          description: ID of the event type indicating whether this absence is paid (1) or unpaid (2).
          example:
            - 123
        half_day_bookings:
          type: boolean
          title: Half Day Bookings
          description: When true, bookings for this event can be created in half-day increments.
          example:
            eq: value
        icon_id:
          type: string
          title: Icon
          description: The icon identifier used to visually represent this event in the UI.
          example:
            - 123
        id:
          type: integer
          title: Id
          description: The unique identifier of this event.
          example:
            - 123
        limitation_type:
          enum:
            - 2
            - 3
            - 4
          type: integer
          title: Limitation Type
          description: The limitation type of this event used for filtering (limited by days, limited by hours, or unlimited by hours).
          example:
            eq: active
        limitation_type_id:
          enum:
            - 2
            - 3
            - 4
          type: integer
          title: Limitation Type
          description: 'ID of the limitation type controlling how time-off for this event is tracked: limited by days (2), limited by hours (3), or unlimited by hours (4).'
          example:
            - 123
        limited:
          type: boolean
          title: Limited
          description: When true, this event has a limit on the amount of time-off that can be booked.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The display name of this event.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this event belongs to.
          example:
            eq: value
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
          description: The archival status of this event, either active (1) or archived (2).
          example:
            eq: active
        sync_personal_integrations:
          type: boolean
          title: Sync Personal Integrations
          description: When true, bookings for this event are automatically synced to personal calendar integrations.
          example:
            eq: value
        description:
          type: string
          title: Description
          description: Free-text note about this absence category, shown in a tooltip to people requesting an absence under it or viewing a booked one.
          example:
            eq: value
        external_id:
          type: string
          title: External
          nullable: true
          description: The id of the time-off type in the HR integration (Personio, BambooHR, Rippling, …) this absence category was synced from; null for one created in Productive.
      example:
        id: '123'
        type: events
        attributes:
          name: Vacation
          event_type_id: 1
          icon_id: icon-airplane
          color_id: '4'
          archived_at: null
          description: Paid annual leave. Submit requests at least two weeks in advance.
          limitation_type_id: 2
          sync_personal_integrations: true
          half_day_bookings: true
          absence_type: time_off
        relationships:
          organization:
            data:
              type: organizations
              id: '1'
