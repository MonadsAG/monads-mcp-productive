openapi: 3.1.0
info:
  title: Productive.io API – Events
  version: 2.0.0
description: |-
  Event resources represent Absence categories. More information about the Absence categories can be found in our Help documentation: [Configuring Your Time Off Settings](https://help.productive.io/en/articles/3154360-configuring-your-time-off-settings).

  The `/events` endpoint allows you to create, update, delete, archive or unarchive (restore) Events.

  The following diagram shows Events in our data hierarchy:
  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  event: Event {
    class: primary
  }
  bookings: Bookings
  entitlements: Entitlements
  approval_workflows: Approval Workflows

  # define connections
  event -> bookings
  event -> entitlements
  event -> approval_workflows
  ```

  For limited Events, absence bookings can only be created if the assignee has sufficient available hours or days defined via [Entitlements](https://developer.productive.io/entitlements.html#entitlements).
  Approvers and subscribers for a Person’s absence booking on a specific Event can be managed through [ApprovalWorkflows](https://developer.productive.io/approval_workflows.html#approval-workflows).

  Also, we differentiate between time off (e.g. vacation, sick leave) and remote work (e.g. work from home) events. This is defined via the `absence_type` attribute.
  It is possible to change an event from the `remote_work` to the `time_off` absence type and vice versa, but please note that remote work events will always have the Unpaid event type.

  For more details on how to work with remote work events, please refer to the [Remote Work](https://help.productive.io/en/articles/11026966-remote-work-beta) help article.
x-filters:
  event:
    absence_type:
      description: Filter by absence type (e.g. vacation, sick leave).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    half_day_bookings:
      description: Filter by whether the event type allows half-day bookings.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by event type ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    limitation_type:
      description: Filter by the limitation type applied to entitlement accrual.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    limited:
      description: Filter by whether the event type has an entitlement limit (true) or is unlimited (false).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by active/archived status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    sync_personal_integrations:
      description: Filter by whether the event type syncs with personal calendar integrations.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by the name of the absence category (event).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/events/{id}/archive:
    patch:
      tags:
        - Events
      summary: Archives an event
      operationId: events-archive-archive
      description: Archive an event.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_event'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/events:
    get:
      tags:
        - Events
      summary: Get events
      operationId: events-index
      description: List events.
      parameters:
        - $ref: '#/components/parameters/filter_event'
        - $ref: '#/components/parameters/sort_event'
      responses:
        '200':
          $ref: '#/components/responses/collection_event'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Events
      summary: Create an event
      operationId: events-create
      description: Create a new event.
      requestBody:
        $ref: '#/components/requestBodies/event'
      responses:
        '201':
          $ref: '#/components/responses/single_event'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_event'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/events/{id}:
    get:
      tags:
        - Events
      summary: Get an event
      operationId: events-show
      description: Retrieve a single event.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_event'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Events
      summary: Update an event
      operationId: events-update
      description: Update an event.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/event'
      responses:
        '200':
          $ref: '#/components/responses/single_event'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_event'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Events
      summary: Deletes an event
      operationId: events-destroy
      description: Delete an event.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/events/{id}/restore:
    patch:
      tags:
        - Events
      summary: Restores an event
      operationId: events-restore-restore
      description: Restore an archived event.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_event'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    single_event:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single event (absence category) record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned event resource.
                properties:
                  attributes:
                    type: object
                    description: Event attributes.
                    properties:
                      absence_type:
                        $ref: '#/components/schemas/resource_event/properties/absence_type'
                      archived_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_event/properties/archived_at'
                          - type: 'null'
                        description: The date and time when the event was archived, or null if active.
                      color_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_event/properties/color_id'
                          - type: 'null'
                        description: The color ID used to visually represent this event type.
                      event_type_id:
                        $ref: '#/components/schemas/resource_event/properties/event_type_id'
                      half_day_bookings:
                        $ref: '#/components/schemas/resource_event/properties/half_day_bookings'
                      icon_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_event/properties/icon_id'
                          - type: 'null'
                        description: The icon ID used for visual display of this event type.
                      limitation_type_id:
                        $ref: '#/components/schemas/resource_event/properties/limitation_type_id'
                      name:
                        $ref: '#/components/schemas/resource_event/properties/name'
                      sync_personal_integrations:
                        $ref: '#/components/schemas/resource_event/properties/sync_personal_integrations'
                      description:
                        anyOf:
                          - $ref: '#/components/schemas/resource_event/properties/description'
                          - type: 'null'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Event relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '10'
                type: events
                attributes:
                  name: Vacation
                  event_type_id: 1
                  icon_id: '3'
                  color_id: '7'
                  archived_at: null
                  limitation_type_id: 1
                  sync_personal_integrations: false
                  half_day_bookings: true
                  description: Annual paid leave
                  absence_type: vacation
              included: []
      description: Single event
    conflict:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_conflict'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Conflict
    unprocessable_content_event:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_event'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    collection_event:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of event records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: An event resource object.
                  properties:
                    attributes:
                      type: object
                      description: Event attributes.
                      properties:
                        absence_type:
                          $ref: '#/components/schemas/resource_event/properties/absence_type'
                        archived_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_event/properties/archived_at'
                            - type: 'null'
                          description: Timestamp when this event was archived, or null if active.
                        color_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_event/properties/color_id'
                            - type: 'null'
                          description: Color identifier for this event in the UI.
                        event_type_id:
                          $ref: '#/components/schemas/resource_event/properties/event_type_id'
                        half_day_bookings:
                          $ref: '#/components/schemas/resource_event/properties/half_day_bookings'
                        icon_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_event/properties/icon_id'
                            - type: 'null'
                          description: Icon identifier for this event in the UI.
                        limitation_type_id:
                          $ref: '#/components/schemas/resource_event/properties/limitation_type_id'
                        name:
                          $ref: '#/components/schemas/resource_event/properties/name'
                        sync_personal_integrations:
                          $ref: '#/components/schemas/resource_event/properties/sync_personal_integrations'
                        description:
                          anyOf:
                            - $ref: '#/components/schemas/resource_event/properties/description'
                            - type: 'null'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Event relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of event resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '10'
                  type: events
                  attributes:
                    name: Vacation
                    event_type_id: 1
                    icon_id: '3'
                    color_id: '7'
                    archived_at: null
                    limitation_type_id: 1
                    sync_personal_integrations: false
                    half_day_bookings: true
                    description: Annual paid leave
                    absence_type: vacation
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection event
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
