openapi: 3.1.0
info:
  title: Productive.io API – Rate cards
  version: 2.0.0
description: Price lists for services. Rate cards define company-wide or client-specific pricing templates. Each rate card contains prices for service types with billing configuration. Client-specific rate cards override defaults for that company.
x-filters:
  rate_card:
    company_id:
      description: Filter by client company.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filter by creation date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by status (active or archived).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/rate_cards/{id}/archive:
    patch:
      tags:
        - Rate cards
      summary: Archives a rate card
      responses:
        '200':
          $ref: '#/components/responses/single_rate_card'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: rate_cards-archive-archive
      description: Archive a rate card to deactivate it.
  /api/v2/rate_cards/copy:
    post:
      tags:
        - Rate cards
      summary: Copy a rate card
      responses:
        '200':
          $ref: '#/components/responses/single_rate_card'
        '201':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Created
        '404':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Not Found
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: rate_cards-copy-copy
      description: Copy an existing rate card.
  /api/v2/rate_cards:
    get:
      tags:
        - Rate cards
      summary: Get rate cards
      responses:
        '200':
          $ref: '#/components/responses/collection_rate_card'
      parameters:
        - $ref: '#/components/parameters/filter_rate_card'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_rate_card'
      operationId: rate_cards-index
      description: List all rate cards.
    post:
      tags:
        - Rate cards
      summary: Create a price
      responses:
        '201':
          $ref: '#/components/responses/single_rate_card'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: rate_cards-create
      requestBody:
        $ref: '#/components/requestBodies/rate_card'
      description: Create a new rate card.
  /api/v2/rate_cards/{id}:
    get:
      tags:
        - Rate cards
      summary: Gets a rate card
      responses:
        '200':
          $ref: '#/components/responses/single_rate_card'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: rate_cards-show
      description: Retrieve a single rate card by ID.
    patch:
      tags:
        - Rate cards
      summary: Update a price
      responses:
        '200':
          $ref: '#/components/responses/single_rate_card'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: rate_cards-update
      requestBody:
        $ref: '#/components/requestBodies/rate_card'
      description: Update a rate card.
    delete:
      tags:
        - Rate cards
      summary: Deletes a price
      responses:
        '204':
          description: No Content
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: rate_cards-destroy
      description: Delete a rate card by ID.
  /api/v2/rate_cards/{id}/restore:
    patch:
      tags:
        - Rate cards
      summary: Restores a rate card
      responses:
        '200':
          $ref: '#/components/responses/single_rate_card'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: rate_cards-restore-restore
      description: Restore an archived rate card.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_rate_card:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - created_at
            - -created_at
            - name
            - -name
          type: string
        title: Sort rate card
      explode: false
      required: false
      description: Sort rate card
    filter_rate_card:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.rate_card at the top of this file.
      required: false
      description: Filters
  responses:
    single_rate_card:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_rate_card/properties/name'
                      created_at:
                        $ref: '#/components/schemas/resource_rate_card/properties/created_at'
                      updated_at:
                        $ref: '#/components/schemas/resource_rate_card/properties/updated_at'
                      archived_at:
                        $ref: '#/components/schemas/resource_rate_card/properties/archived_at'
                      prices_count:
                        $ref: '#/components/schemas/resource_rate_card/properties/prices_count'
                  relationships:
                    type: object
                    properties:
                      company:
                        $ref: '#/components/schemas/_single_relationship'
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single rate card
    collection_rate_card:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_rate_card/properties/name'
                        created_at:
                          $ref: '#/components/schemas/resource_rate_card/properties/created_at'
                        updated_at:
                          $ref: '#/components/schemas/resource_rate_card/properties/updated_at'
                        archived_at:
                          $ref: '#/components/schemas/resource_rate_card/properties/archived_at'
                        prices_count:
                          $ref: '#/components/schemas/resource_rate_card/properties/prices_count'
                    relationships:
                      type: object
                      properties:
                        company:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection rate card
  schemas:
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    resource_rate_card:
      type: object
      title: Rate card Resource
      properties:
        organization:
          title: Organization
          description: The organization this rate card belongs to.
          example:
            eq: value
        creator:
          title: Creator
          description: The person who created this rate card.
          example:
            eq: value
        company_id:
          type: integer
          title: Company
          description: ID of the company this rate card is associated with.
          example:
            - 123
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when this rate card was last updated.
          example:
            gt: '2026-01-01'
        company:
          title: Company
          description: The company this rate card is associated with.
          example:
            eq: value
        prices_count:
          title: Prices Count
          description: The number of prices defined on this rate card.
          example:
            gt: 0
        name:
          type: string
          title: Name
          description: The name of this rate card.
          example:
            eq: value
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
          description: The current status of this rate card (active or archived).
          example:
            eq: active
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this rate card was archived, or null if it is still active.
          example:
            gt: '2026-01-01'
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this rate card was created.
          example:
            gt: '2026-01-01'
      description: Price list for services. Contains a name, optional client company link (for client-specific rates), creation metadata, and a count of contained prices. Prices are managed separately via the prices endpoint.
      example:
        id: '7'
        type: rate_cards
        attributes:
          name: Standard 2026
          currency: USD
          created_at: '2026-01-01T00:00:00.000+00:00'
          updated_at: '2026-01-01T00:00:00.000+00:00'
        relationships: {}
  requestBodies:
    rate_card:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - name
                      - company_id
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_rate_card/properties/name'
                      company_id:
                        $ref: '#/components/schemas/resource_rate_card/properties/company_id'
      description: Request body for creating or updating a rate card. Specify the name and optional company (for client-specific pricing). Prices within the rate card are managed via the prices endpoint.
