        - unsupported_date_period
        - unsupported_filter
        - unsupported_filter_level
        - unsupported_filter_operation
        - unsupported_filter_value
        - unsupported_filter_value_type
        - unsupported_formula
        - unsupported_formula_component
        - unsupported_formula_operator
        - unsupported_group
        - unsupported_group_param
        - unsupported_include
        - unsupported_number_of_group_params
        - unsupported_sort
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 400.
  parameters:
    sort_tag:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort tag
      explode: false
      required: false
      description: Sort tag
    filter_tag:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.tag at the top of this file.
      required: false
      description: Filters
