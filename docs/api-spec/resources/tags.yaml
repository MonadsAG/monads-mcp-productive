        - deal_proposal_public_link_unavailable
        - document_styler_unavailable
        - document_templates_unavailable
        - email_inbox_unavailable
        - entry_not_editable
        - expense_not_editable
        - feature_unavailable
        - finalized_invoice_permission
        - financials_unavailable
        - impersonation_on_account_not_allowed
        - insufficient_automation_permission
        - insufficient_project_access
        - insufficient_seats
        - invalid_impersonate_role_id_header
        - invoices_unavailable
        - login_unavailable
        - mcp_access_disabled
        - mcp_connectors_disabled
        - mcp_provider_unavailable
        - missing_slack_integration
        - no_client_access
        - no_organization_id
        - no_person
        - no_sandbox_access
        - organization_red_flagged
        - other_timer_running
        - outgoing_emails_limit_exceeded
        - payment_reminders_unavailable
        - personal_access_token_limit_exceeded
        - pipelines_limit_exceeded
        - placeholders_limit_exceeded
        - plan_limit_exceeded
        - plan_unavailable
        - private_channel_forbidden
        - recipients_limit_exceeded
        - record_not_owned
        - report_templates_unavailable
        - restricted_email_in_trialing
        - role_bill_rate_unavailable
        - role_impersonate_denied
        - select_organization
        - service_inaccessible
        - service_type_inaccessible
        - single_sign_on_invalid
        - single_sign_on_login_only
        - single_sign_on_provision_failed
        - single_sign_on_unavailable
        - subscription_expired
        - subsidiaries_unavailable
        - subsidiary_out_of_scope
        - teams_limit_exceeded
        - two_factor_login
        - unallocated_expense_inaccessible
        - webooks_limit_exceeded
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 403.
    error_code_unauthorized:
      enum:
        - invalid_auth_token
        - invalid_password
        - invalid_proposal_token
        - invalid_token_signature
        - token_expired
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 401.
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    resource_tag:
      type: object
      title: Tag Resource
      description: A label that can be applied to companies, deals, invoices, people, projects, or tasks for categorization and filtering.
      properties:
        color_id:
          type: integer
          title: Color
          description: ID of the color used to visually distinguish this tag.
          example:
            - 123
        company_id:
          type: integer
          title: Company
          description: ID of the company this tag is applied to, if tagged to a company.
          example:
            - 123
        deal_id:
          type: integer
          title: Deal
          description: ID of the deal this tag is applied to, if tagged to a deal.
          example:
            - 123
        invoice_id:
          type: integer
          title: Invoice
          description: ID of the invoice this tag is applied to, if tagged to an invoice.
          example:
            - 123
        name:
          type: string
          title: Name
          description: The name of this tag.
          example:
            eq: value
        person_id:
          type: integer
          title: Person
          description: ID of the person this tag is applied to, if tagged to a person.
          example:
            - 123
        project_id:
          type: integer
          title: Project
          description: ID of the project this tag is applied to, if tagged to a project.
          example:
            - 123
        taggable_type:
          type: string
          title: Taggable Type
          description: The type of resource this tag is applied to (e.g. Company, Deal, Invoice, Person, Project, Task).
          example:
            eq: active
        task_id:
          type: integer
          title: Task
          description: ID of the task this tag is applied to, if tagged to a task.
          example:
            - 123
      example:
        id: '121711'
        type: tags
        attributes:
          name: backend
          color_id: '3'
    error_code_bad_request:
      enum:
