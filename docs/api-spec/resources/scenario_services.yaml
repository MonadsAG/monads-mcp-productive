openapi: 3.1.0
info:
  title: Productive.io API – Scenario Services
  version: 2.0.0
description: Line items of a scenario, mirroring the deal's services and carrying their pricing, budgets, and financial totals. All scenario endpoints require the Scenario Builder feature on the organization's plan.
x-filters:
  scenario_service:
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    scenario_id:
      description: Filter by scenario.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    unit:
      description: Filter by tracking unit.
      operators:
        - eq
        - not_eq
paths:
  /api/v2/scenario_services:
    get:
      tags:
        - Scenario Services
      summary: Get scenario services
      operationId: scenario_services-index
      description: List scenario services with optional filters. Returns paginated scenario service records the caller has access to.
      parameters:
        - $ref: '#/components/parameters/filter_scenario_service'
        - $ref: '#/components/parameters/sort_scenario_service'
      responses:
        '200':
          $ref: '#/components/responses/collection_scenario_service'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Scenario Services
      summary: Create a scenario service
      operationId: scenario_services-create
      description: Create a new scenario service. Requires the Scenario Builder feature on the organization's plan.
      requestBody:
        $ref: '#/components/requestBodies/scenario_service'
      responses:
        '201':
          $ref: '#/components/responses/single_scenario_service'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_scenario_service'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/scenario_services/{id}:
    get:
      tags:
        - Scenario Services
      summary: Gets a scenario service
      operationId: scenario_services-show
      description: Retrieve a single scenario service by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_scenario_service'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Scenario Services
      summary: Update a scenario service
      operationId: scenario_services-update
      description: Update a scenario service's attributes.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/scenario_service_update'
      responses:
        '200':
          $ref: '#/components/responses/single_scenario_service'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_scenario_service'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Scenario Services
      summary: Deletes a scenario service
      operationId: scenario_services-destroy
      description: Delete a scenario service.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
