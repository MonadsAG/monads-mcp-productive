          type: boolean
          title: Budget Cap Enabled
          description: Whether a hard budget cap prevents tracking beyond the budget total.
          example: false
        budget_total:
          type: number
          title: Budget Total
          nullable: true
          description: Total budget for this service.
          example: 960000
        budget_total_default:
          type: number
          title: Budget Total Default
          nullable: true
          description: Total budget for this service in the organization's default currency.
          example: 960000
        budget_total_normalized:
          type: number
          title: Budget Total Normalized
          nullable: true
          description: Total budget for this service in the organization's normalized currency.
          example: 960000
        budget_used:
          type: number
          title: Budget Used
          nullable: true
          description: Budget consumed so far.
          example: 240000
        budget_used_default:
          type: number
          title: Budget Used Default
          nullable: true
          description: Budget consumed so far in the organization's default currency.
          example: 240000
        budget_used_normalized:
          type: number
          title: Budget Used Normalized
          nullable: true
          description: Budget consumed so far in the organization's normalized currency.
          example: 240000
        cost:
          type: number
          title: Cost
          nullable: true
          description: Total cost including labor and expenses.
          example: 720000
        cost_default:
          type: number
          title: Cost Default
          nullable: true
          description: Total cost including labor and expenses in the organization's default currency.
          example: 720000
        cost_normalized:
          type: number
          title: Cost Normalized
          nullable: true
          description: Total cost including labor and expenses in the organization's normalized currency.
          example: 720000
        created_at:
          type: string
          title: Created At
          format: date-time
          description: When the service was created.
          example: '2026-01-15T09:30:00.000+01:00'
        currency:
          type: string
          title: Currency
          nullable: true
          description: Currency code for this service's financial values.
