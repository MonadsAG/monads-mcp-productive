openapi: 3.1.0
info:
  title: Productive.io API – Invoices
  version: 2.0.0
description: |-
  For more details on how to work with custom fields please refer to [Working with custom fields](https://developer.productive.io/working_with_custom_fields.html#working_with_custom_fields) guide.

  The invoice object represents the main building block of the invoicing module.

  You can find out more about invoicing in our Help documentation: [Creating and Managing Invoices](https://help.productive.io/en/collections/8956111-creating-and-managing-invoices)

  Following diagram shows invoices in our data hierarchy:

  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  budget1: Budget
  budget2: Budget
  invoice_attribution1: "Invoice Attribution"
  invoice_attribution2: "Invoice Attribution"
  invoice_attribution3: "Invoice Attribution"
  invoice2: Invoice {
    class: primary
  }
  invoice3: Invoice {
    class: primary
  }
  line_item1: "Line Item"
  line_item2: "Line Item"
  line_item3: "Line Item"
  tax_rate1: "Tax Rate"
  tax_rate2: "Tax Rate"
  tax_rate3: "Tax Rate"

  # Define connections
  budget1 -> invoice_attribution1 <-> invoice2 -> line_item1 -> tax_rate1
  budget2 -> invoice_attribution2 <-> invoice2 -> line_item2 -> tax_rate2
  budget2 -> invoice_attribution3 <-> invoice3 -> line_item3 -> tax_rate3
  ```


  ### Tax changes
  On September 3, 2024, we've released new Tax rates system.  That means that `tax1_name`, `tax1_value`, `tax2_name` and `tax2_value` attributes on Invoice object are no longer in use. You should, however, use `tax_rate_id` attribute on Line item objects to achieve the same goal. You can read more about this in [LineItems endpoint](https://developer.productive.io/line_items.html#header-setting-tax-data) documentation.

  ### Related resources
  - [Deals (Budget)](https://developer.productive.io/deals.html#deals)
  - [Invoice Attributions](https://developer.productive.io/invoice_attributions.html#invoice-attributions)
  - [Line Items](https://developer.productive.io/line_items.html#line-items)
