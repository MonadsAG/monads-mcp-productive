paths:
  /api/v2/invoices/{id}/check_export_status:
    patch:
      tags:
        - Invoices
      summary: Checks the status of a pending invoice export
      operationId: invoices-check_export_status-check_export_status
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_invoice'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
        '502':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Bad Gateway
  /api/v2/invoices:
    get:
      tags:
        - Invoices
      summary: Get invoices
      operationId: invoices-index
      description: List invoices.
      parameters:
        - $ref: '#/components/parameters/filter_invoice'
        - $ref: '#/components/parameters/sort_invoice'
      responses:
        '200':
          $ref: '#/components/responses/collection_invoice'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Invoices
      summary: Create an invoice
      description: Create a new invoice.
      operationId: invoices-create
      requestBody:
        $ref: '#/components/requestBodies/invoice'
      responses:
        '201':
          $ref: '#/components/responses/single_invoice'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/invoices/credit_note:
    post:
      tags:
        - Invoices
      summary: Creates a credit note for an invoice
      description: |
        Creates a draft credit note for whatever is still uncredited on a finalized invoice. The first
        credit note reverses every line item of the invoice. Later ones carry one correction line per tax
        rate for the amount the finalized credit notes have not covered yet. Contact data, bank account,
        invoiced budgets and invoice attributions are carried over from the invoice in the same request.
      operationId: invoices-credit_note
      requestBody:
        $ref: '#/components/requestBodies/invoice_credit_note'
      responses:
        '201':
          $ref: '#/components/responses/single_invoice'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/invoices/{id}:
    get:
      tags:
        - Invoices
      summary: Gets an invoice
      operationId: invoices-show
      description: Retrieve a single invoice.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
