paths:
  /api/v2/invoices:
    get:
      tags:
        - Invoices
      summary: Get invoices
      responses:
        '200':
          $ref: '#/components/responses/collection_invoice'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_invoice'
        - $ref: '#/components/parameters/filter_invoice'
      operationId: invoices-index
      description: List invoices.
    post:
      tags:
        - Invoices
      summary: Create an invoice
      responses:
        '201':
          $ref: '#/components/responses/single_invoice'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      description: Create a new invoice.
      operationId: invoices-create
      requestBody:
        $ref: '#/components/requestBodies/invoice'
  /api/v2/invoices/{id}:
    get:
      tags:
        - Invoices
      summary: Gets an invoice
      responses:
        '200':
          $ref: '#/components/responses/single_invoice'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: invoices-show
      description: Retrieve a single invoice.
    patch:
      tags:
        - Invoices
      summary: Update an invoice
      responses:
        '200':
          $ref: '#/components/responses/single_invoice'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: invoices-update
      requestBody:
        $ref: '#/components/requestBodies/invoice'
      description: Update an invoice.
    delete:
      tags:
        - Invoices
      summary: Deletes an invoice
      responses:
        '204':
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: invoices-destroy
      description: Delete an invoice.
  /api/v2/invoices/{id}/export:
    patch:
      tags:
        - Invoices
      summary: Exports an invoice
      responses:
        '200':
          $ref: '#/components/responses/single_invoice'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: invoices-export-export
      description: Export an invoice to an external accounting system.
  /api/v2/invoices/{id}/export_update:
    patch:
      tags:
        - Invoices
      summary: Updates an exported invoice
      responses:
        '200':
          $ref: '#/components/responses/single_invoice'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: invoices-export_update-export_update
      description: Update the export data on an already-exported invoice.
  /api/v2/invoices/{id}/finalize:
    patch:
      tags:
        - Invoices
      summary: Finalizes an invoice
      responses:
        '200':
          $ref: '#/components/responses/single_invoice'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: invoices-finalize-finalize
      description: Finalize a draft invoice.
  /api/v2/invoices/{id}/preview:
    get:
      tags:
        - Invoices
      summary: Preview invoice
      responses:
        '200':
          $ref: '#/components/responses/single_invoice'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: invoices-preview-preview
      description: |
        The preview endpoint lets you simulate invoice line item generation without persisting any changes. It returns the exact line items and invoice attributions that would be created for a given invoice based on the selected invoicing method and options.

        - Builds line items using the same logic as the line items "[generate](openapi:group:line-items)" method
        - Returns data only, does not modify the invoice
  /api/v2/invoices/{id}/send_einvoice:
    patch:
      tags:
        - Invoices
      summary: Sends an e-invoice
      responses:
        '200':
          $ref: '#/components/responses/single_invoice'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
      operationId: invoices-send_einvoice
      requestBody:
        $ref: '#/components/requestBodies/send_einvoice'
  /api/v2/invoices/{id}/send:
    patch:
      tags:
        - Invoices
      summary: Sends an invoice
      responses:
        '200':
          $ref: '#/components/responses/single_invoice'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: invoices-send-send_mail
      description: Send an invoice to the client.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_invoice:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.invoice at the top of this file.
      required: false
      description: Filters
    sort_invoice:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - amount
            - -amount
            - amount_credited
            - -amount_credited
            - amount_credited_with_tax
            - -amount_credited_with_tax
            - amount_paid
            - -amount_paid
            - amount_tax
            - -amount_tax
            - amount_with_tax
            - -amount_with_tax
            - amount_written_off
            - -amount_written_off
            - company_name
            - -company_name
            - created_at
            - -created_at
            - credited
            - -credited
            - custom_fields
            - -custom_fields
            - deleted_at
            - -deleted_at
            - delivery_on
            - -delivery_on
            - discount
            - -discount
            - invoiced_on
            - -invoiced_on
            - last_activity_at
            - -last_activity_at
            - number
            - -number
            - pay_on
            - -pay_on
            - purchase_order_number
            - -purchase_order_number
            - sent_on
            - -sent_on
            - subject
            - -subject
          type: string
        title: Sort invoice
      explode: false
      required: false
      description: Sort invoice
  responses:
    single_invoice:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      note:
                        $ref: '#/components/schemas/resource_invoice/properties/note'
                      amount:
                        $ref: '#/components/schemas/resource_invoice/properties/amount'
                      footer:
                        $ref: '#/components/schemas/resource_invoice/properties/footer'
                      number:
                        $ref: '#/components/schemas/resource_invoice/properties/number'
                      pay_on:
                        $ref: '#/components/schemas/resource_invoice/properties/pay_on'
                      paid_on:
                        $ref: '#/components/schemas/resource_invoice/properties/paid_on'
                      sent_on:
                        $ref: '#/components/schemas/resource_invoice/properties/sent_on'
                      subject:
                        $ref: '#/components/schemas/resource_invoice/properties/subject'
                      credited:
                        $ref: '#/components/schemas/resource_invoice/properties/credited'
                      currency:
                        $ref: '#/components/schemas/resource_invoice/properties/currency'
                      discount:
                        $ref: '#/components/schemas/resource_invoice/properties/discount'
                      exported:
                        $ref: '#/components/schemas/resource_invoice/properties/exported'
                      tag_list:
                        $ref: '#/components/schemas/resource_invoice/properties/tag_list'
                      email_key:
                        $ref: '#/components/schemas/resource_invoice/properties/email_key'
                      export_id:
                        $ref: '#/components/schemas/resource_invoice/properties/export_id'
                      tax1_name:
                        $ref: '#/components/schemas/resource_invoice/properties/tax1_name'
                      tax2_name:
