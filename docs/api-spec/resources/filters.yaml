openapi: 3.1.0
info:
  title: Productive.io API – Filters
  version: 2.0.0
description: Filters records are used to save the setup of your views, reports and widgets across Productive.
x-filters:
  filter:
    query:
      description: Filter by name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    report:
      description: Filter saved filters (reports) by the report flag.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_accessed_at:
      description: Filter by the most recent access date, calculated as the greatest of updated_at, last_viewed_at, and last_pulse_sent_at.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by the name of the saved filter.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    report_layout_id:
      description: Filter saved filters by report layout ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    type_id:
      description: Filter by filter type ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project (returns saved filters scoped to the given workspace).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    filterable_id:
      description: Filter by the ID of the resource (project, deal, etc.) the saved filter is scoped to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updated_at:
      description: Filter by the date the saved filter was last updated.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    filterable_collection:
      description: Filter by the filterable collection (resource type group) the saved filter applies to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    chart_type_id:
      description: Filter by chart type ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    shared:
      description: Filter to include only saved filters that are shared with others.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    report_category_id:
      description: Filter saved filters by report category ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    pulse:
      description: Filter by whether the saved filter has an active pulse (digest notification) configured for it.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the ID of the person who created the saved filter.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filter by the date the saved filter was created.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_pulse_sent_at:
      description: Filter by the date the last pulse notification was sent for this saved filter.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_viewed_at:
      description: Filter by the date the saved filter was last viewed.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    filterable_type:
      description: Filter by the resource type (e.g. tasks, deals) the saved filter applies to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/filters:
    get:
      tags:
        - Filters
      summary: Get filters
      responses:
        '200':
          $ref: '#/components/responses/collection_filter'
      parameters:
        - $ref: '#/components/parameters/filter_filter'
        - $ref: '#/components/parameters/sort_filter'
        - $ref: '#/components/parameters/header_organization'
      operationId: filters-index
      description: List filters.
    post:
      tags:
        - Filters
      summary: Create a filter
      responses:
        '201':
          $ref: '#/components/responses/single_filter'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: filters-create
      requestBody:
        $ref: '#/components/requestBodies/filter'
      description: Create a new filter.
  /api/v2/filters/{id}:
    get:
      tags:
        - Filters
      summary: Gets a filter
      responses:
        '200':
          $ref: '#/components/responses/single_filter'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: filters-show
      description: Retrieve a single filter.
    patch:
      tags:
        - Filters
      summary: Update a filter
      responses:
        '200':
          $ref: '#/components/responses/single_filter'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: filters-update
      requestBody:
        $ref: '#/components/requestBodies/filter'
      description: Update a filter.
    delete:
      tags:
        - Filters
      summary: Deletes a filter
      responses:
        '204':
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: filters-destroy
      description: Delete a filter.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_filter:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - created_at
            - -created_at
            - creator
            - -creator
            - description
            - -description
            - filterable_collection
            - -filterable_collection
            - last_accessed_at
            - -last_accessed_at
            - last_pulse_sent_at
            - -last_pulse_sent_at
            - last_viewed_at
            - -last_viewed_at
            - name
            - -name
            - report_category_id
            - -report_category_id
            - updated_at
            - -updated_at
          type: string
        title: Sort filter
      explode: false
      required: false
      description: Sort filter
    filter_filter:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.filter at the top of this file.
      required: false
      description: Filters
  requestBodies:
    filter:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_filter/properties/name'
                      hidden:
                        $ref: '#/components/schemas/resource_filter/properties/hidden'
                      params:
                        $ref: '#/components/schemas/resource_filter/properties/params'
                      public:
                        $ref: '#/components/schemas/resource_filter/properties/public'
                      report:
                        $ref: '#/components/schemas/resource_filter/properties/report'
                      columns:
                        $ref: '#/components/schemas/resource_filter/properties/columns'
                      sort_by:
                        $ref: '#/components/schemas/resource_filter/properties/sort_by'
                      type_id:
                        $ref: '#/components/schemas/resource_filter/properties/type_id'
                      formulas:
                        $ref: '#/components/schemas/resource_filter/properties/formulas'
                      group_by:
                        $ref: '#/components/schemas/resource_filter/properties/group_by'
                      settings:
                        $ref: '#/components/schemas/resource_filter/properties/settings'
                      layout_id:
                        $ref: '#/components/schemas/resource_filter/properties/layout_id'
                      transpose_by:
                        $ref: '#/components/schemas/resource_filter/properties/transpose_by'
                      chart_type_id:
                        $ref: '#/components/schemas/resource_filter/properties/chart_type_id'
                      exchange_date:
                        $ref: '#/components/schemas/resource_filter/properties/exchange_date'
                      filterable_id:
                        $ref: '#/components/schemas/resource_filter/properties/filterable_id'
                      predefined_id:
                        $ref: '#/components/schemas/resource_filter/properties/predefined_id'
                      column_settings:
                        $ref: '#/components/schemas/resource_filter/properties/column_settings'
                      filterable_type:
                        $ref: '#/components/schemas/resource_filter/properties/filterable_type'
                      report_layout_id:
                        $ref: '#/components/schemas/resource_filter/properties/report_layout_id'
                      exchange_currency:
                        $ref: '#/components/schemas/resource_filter/properties/exchange_currency'
                      report_category_id:
                        $ref: '#/components/schemas/resource_filter/properties/report_category_id'
                      filterable_collection:
                        $ref: '#/components/schemas/resource_filter/properties/filterable_collection'
      description: Request body for creating or updating a saved view or report.
  schemas:
    resource_filter:
      type: object
      title: Filter Resource
      properties:
        settings:
          type: string
          title: Settings
          description: A JSON object containing miscellaneous UI settings for this filter, such as collapsed state or display preferences.
          example:
            eq: value
        layout_id:
          type: integer
          title: Layout
          description: ID of the layout mode used to display this filter (e.g. list, board, timeline).
          example:
            - 123
        filterable_collection:
          type: string
          title: Filterable Collection
          description: The collection of resources (e.g. tasks, bookings) that this filter applies to.
          example:
            eq: value
        default:
          title: Default
          description: Whether this filter is the default view loaded when navigating to the associated resource list.
          example:
            eq: value
        last_pulse_sent_at:
          type: string
          title: Last Pulse Sent At
          format: date-time
          description: Timestamp when the last pulse notification was sent for this filter.
          example:
            gt: '2026-01-01'
        type_id:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Type
          description: ID of the filter type, indicating whether this is a saved view, a report, or a widget.
          example:
            - 123
        transpose_by:
          type: string
          title: Transpose By
          description: The field identifier used to pivot or transpose data in report-type filters.
          example:
            eq: value
        last_viewed_at:
          type: string
          title: Last Viewed At
          format: date-time
          description: Timestamp when this filter was last viewed by the current user.
          example:
            gt: '2026-01-01'
        predefined_id:
          type: string
          title: Predefined
          description: The identifier of the predefined system filter this was created from, if applicable.
          example:
            - 123
        report_category_id:
          type: integer
          title: Report Category
          description: ID of the report category this filter belongs to.
          example:
            - 123
        columns:
          type: string
          title: Columns
          description: An ordered list of column identifiers defining which columns are visible in this filter's list view.
          example:
            eq: value
        shared:
          type: boolean
          title: Shared
          description: Whether this filter has been shared with specific people or teams via memberships.
          example:
            eq: value
        column_settings:
          type: string
          title: Column Settings
          description: A JSON object containing per-column display settings such as width and visibility.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The display name of this filter.
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this filter was created.
          example:
            gt: '2026-01-01'
        report:
          type: boolean
          title: Report
          description: Indicates whether this saved filter is of report type.
          example:
            eq: value
        memberships:
          title: Memberships
          description: People or teams who have been granted access to this shared filter.
          example:
            eq: value
        pulse:
          type: boolean
          title: Pulse
          description: The pulse notification associated with this filter, if any.
          example:
            eq: value
        creator:
          title: Creator
          description: The person who created this filter.
          example:
            eq: value
        exchange_date:
          type: object
          title: Exchange Date
          description: A JSON object defining the date or date range used for currency exchange rate lookups in this filter.
          example:
            gt: '2026-01-01'
        public:
          type: boolean
          title: Public
          description: Whether this filter is visible to all members of the organization.
          example:
            eq: value
        sort_by:
          type: string
          title: Sort By
          description: The field identifier used to sort results in this filter's view.
          example:
            eq: value
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when this filter was last updated.
          example:
            gt: '2026-01-01'
        id:
          type: string
          title: Id
          description: The unique identifier of this filter, expressed as a slug combining the numeric ID, filterable type, and collection.
          example:
            - 123
        report_category:
          title: Report Category
          description: The report category this filter belongs to.
          example:
            eq: active
        filterable_type:
          type: string
          title: Filterable Type
          description: The type of resource this filter is scoped to (e.g. projects), or null for organization-wide filters.
          example:
            eq: active
        filterable_id:
          type: integer
          title: Filterable
          description: ID of the specific resource (e.g. a project) this filter is scoped to, or null for organization-wide filters.
          example:
            - 123
        hidden:
          type: boolean
          title: Hidden
          description: Whether this filter is hidden from the navigation sidebar.
          example:
            eq: value
        params:
          type: string
          title: Params
          description: A hash of filter criteria (field/value pairs) that define what records this filter matches.
          example:
            eq: value
        formulas:
          type: string
          title: Formulas
          description: Custom formula definitions used to compute derived values in report-type filters.
          example:
            eq: value
        pulse_count:
          title: Pulse Count
          description: The number of unread pulse notifications for the current user on this report filter.
          example:
            gt: 0
        query:
          type: string
          title: Query
          description: A text search query applied as an additional keyword filter when loading results.
          example:
            eq: value
        project_id:
          type: integer
          title: Project
          description: ID of the project this filter is scoped to, when filterable_type is projects.
          example:
            - 123
        original_id:
          type: integer
          title: Original
          description: The internal numeric ID of this filter, as opposed to the slug-based id field.
          example:
            - 123
        group_by:
          type: string
          title: Group By
          description: The field identifier used to group results in this filter's view.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this filter belongs to.
          example:
            eq: value
        exchange_currency:
          type: string
          title: Exchange Currency
          description: The currency used for exchange rate conversions when this filter displays monetary values.
          example:
            eq: value
        last_accessed_at:
          type: string
          title: Last Accessed At
          format: date
          description: Timestamp when this filter was last accessed by any user.
          example:
            gt: '2026-01-01'
        report_layout_id:
          type: integer
          title: Report Layout
          description: ID of the report layout used by this filter.
          example:
            - 123
        chart_type_id:
          type: integer
          title: Chart Type
          description: ID of the chart visualization type used when displaying this filter as a report chart.
          example:
            - 123
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who created this filter.
          example:
            - 123
      description: A saved view configuration containing filters, sorters, column layout, and optional report aggregation settings.
      example:
        id: '89'
        type: filters
        attributes:
          name: My Open Tasks
          item_type: task
          filter_data:
            assignee_id:
              - 12
            closed:
              eq: false
          created_at: '2026-01-15T10:00:00.000+00:00'
        relationships:
          person:
            data:
              type: people
              id: '12'
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    _collection_relationship:
      anyOf:
        - type: object
          title: Collection data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          description: Included variant — related resource identifiers are present in `data`.
          example:
            data:
              - type: tasks
                id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
  responses:
    single_filter:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_filter/properties/name'
                      hidden:
                        $ref: '#/components/schemas/resource_filter/properties/hidden'
                      params:
                        $ref: '#/components/schemas/resource_filter/properties/params'
                      public:
                        $ref: '#/components/schemas/resource_filter/properties/public'
                      report:
                        $ref: '#/components/schemas/resource_filter/properties/report'
                      shared:
                        $ref: '#/components/schemas/resource_filter/properties/shared'
                      columns:
                        $ref: '#/components/schemas/resource_filter/properties/columns'
                      default:
                        $ref: '#/components/schemas/resource_filter/properties/default'
                      sort_by:
                        $ref: '#/components/schemas/resource_filter/properties/sort_by'
                      type_id:
                        $ref: '#/components/schemas/resource_filter/properties/type_id'
                      formulas:
                        $ref: '#/components/schemas/resource_filter/properties/formulas'
                      group_by:
                        $ref: '#/components/schemas/resource_filter/properties/group_by'
                      settings:
                        $ref: '#/components/schemas/resource_filter/properties/settings'
                      layout_id:
                        $ref: '#/components/schemas/resource_filter/properties/layout_id'
                      created_at:
                        $ref: '#/components/schemas/resource_filter/properties/created_at'
                      updated_at:
                        $ref: '#/components/schemas/resource_filter/properties/updated_at'
                      original_id:
                        $ref: '#/components/schemas/resource_filter/properties/original_id'
                      pulse_count:
                        $ref: '#/components/schemas/resource_filter/properties/pulse_count'
                      transpose_by:
                        $ref: '#/components/schemas/resource_filter/properties/transpose_by'
                      chart_type_id:
                        $ref: '#/components/schemas/resource_filter/properties/chart_type_id'
                      exchange_date:
                        $ref: '#/components/schemas/resource_filter/properties/exchange_date'
                      filterable_id:
                        $ref: '#/components/schemas/resource_filter/properties/filterable_id'
                      predefined_id:
                        $ref: '#/components/schemas/resource_filter/properties/predefined_id'
                      last_viewed_at:
                        $ref: '#/components/schemas/resource_filter/properties/last_viewed_at'
                      column_settings:
                        $ref: '#/components/schemas/resource_filter/properties/column_settings'
                      filterable_type:
                        $ref: '#/components/schemas/resource_filter/properties/filterable_type'
                      report_layout_id:
                        $ref: '#/components/schemas/resource_filter/properties/report_layout_id'
                      exchange_currency:
                        $ref: '#/components/schemas/resource_filter/properties/exchange_currency'
                      last_pulse_sent_at:
                        $ref: '#/components/schemas/resource_filter/properties/last_pulse_sent_at'
                      filterable_collection:
                        $ref: '#/components/schemas/resource_filter/properties/filterable_collection'
                  relationships:
                    type: object
                    properties:
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      memberships:
                        $ref: '#/components/schemas/_collection_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      report_category:
                        $ref: '#/components/schemas/_single_relationship'
                      template_object:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single filter
    collection_filter:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_filter/properties/name'
                        hidden:
                          $ref: '#/components/schemas/resource_filter/properties/hidden'
                        params:
                          $ref: '#/components/schemas/resource_filter/properties/params'
                        public:
                          $ref: '#/components/schemas/resource_filter/properties/public'
                        report:
                          $ref: '#/components/schemas/resource_filter/properties/report'
                        shared:
                          $ref: '#/components/schemas/resource_filter/properties/shared'
                        columns:
                          $ref: '#/components/schemas/resource_filter/properties/columns'
                        default:
                          $ref: '#/components/schemas/resource_filter/properties/default'
                        sort_by:
                          $ref: '#/components/schemas/resource_filter/properties/sort_by'
                        type_id:
                          $ref: '#/components/schemas/resource_filter/properties/type_id'
                        formulas:
                          $ref: '#/components/schemas/resource_filter/properties/formulas'
                        group_by:
                          $ref: '#/components/schemas/resource_filter/properties/group_by'
                        settings:
                          $ref: '#/components/schemas/resource_filter/properties/settings'
                        layout_id:
                          $ref: '#/components/schemas/resource_filter/properties/layout_id'
                        created_at:
                          $ref: '#/components/schemas/resource_filter/properties/created_at'
                        updated_at:
                          $ref: '#/components/schemas/resource_filter/properties/updated_at'
                        original_id:
                          $ref: '#/components/schemas/resource_filter/properties/original_id'
                        pulse_count:
                          $ref: '#/components/schemas/resource_filter/properties/pulse_count'
                        transpose_by:
                          $ref: '#/components/schemas/resource_filter/properties/transpose_by'
                        chart_type_id:
