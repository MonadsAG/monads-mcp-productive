openapi: 3.1.0
info:
  title: Productive.io API – Filters
  version: 2.0.0
description: Filters records are used to save the setup of your views, reports and widgets across Productive.
x-filters:
  filter:
    chart_type_id:
      description: Filter by chart type ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    filterable_collection:
      description: Filter by the filterable collection (resource type group) the saved filter applies to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    filterable_type:
      description: Filter by the resource type (e.g. tasks, deals) the saved filter applies to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project (returns saved filters scoped to the given workspace).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Filter by name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    report:
      description: Filter saved filters (reports) by the report flag.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    report_category_id:
      description: Filter saved filters by report category ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    report_layout_id:
      description: Filter saved filters by report layout ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    shared:
      description: Filter to include only saved filters that are shared with others.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    type_id:
      description: Filter by filter type ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filter by the date the saved filter was created.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the ID of the person who created the saved filter.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    filterable_id:
      description: Filter by the ID of the resource (project, deal, etc.) the saved filter is scoped to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_accessed_at:
      description: Filter by the most recent access date, calculated as the greatest of updated_at, last_viewed_at, and last_pulse_sent_at.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_pulse_sent_at:
      description: Filter by the date the last pulse notification was sent for this saved filter.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_viewed_at:
      description: Filter by the date the saved filter was last viewed.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by the name of the saved filter.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    pulse:
      description: Filter by whether the saved filter has an active pulse (digest notification) configured for it.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updated_at:
      description: Filter by the date the saved filter was last updated.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/filters/copy:
    post:
      tags:
        - Filters
      summary: Instantiates a report from a report template
      operationId: filters-copy-copy
      requestBody:
        $ref: '#/components/requestBodies/filter_copy'
      responses:
        '201':
          $ref: '#/components/responses/single_filter'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_filter'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/filters:
    get:
      tags:
        - Filters
      summary: Get filters
      operationId: filters-index
      description: List filters.
      parameters:
        - $ref: '#/components/parameters/filter_filter'
        - $ref: '#/components/parameters/sort_filter'
      responses:
        '200':
          $ref: '#/components/responses/collection_filter'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Filters
      summary: Create a filter
      operationId: filters-create
      description: Create a new filter.
      requestBody:
        $ref: '#/components/requestBodies/filter'
      responses:
        '201':
          $ref: '#/components/responses/single_filter'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_filter'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/filters/{id}:
    get:
      tags:
        - Filters
      summary: Gets a filter
      operationId: filters-show
      description: Retrieve a single filter.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_filter'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Filters
      summary: Update a filter
      operationId: filters-update
      description: Update a filter.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/filter'
      responses:
        '200':
          $ref: '#/components/responses/single_filter'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_filter'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Filters
      summary: Deletes a filter
      operationId: filters-destroy
      description: Delete a filter.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    unprocessable_content_filter:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_filter'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                      description: In a bulk request, `bulk_index` is the position of the rejected item in the request's `data` array.
                      properties:
                        bulk_index:
                          type: integer
                          title: Bulk Index
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    single_filter:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single filter record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned filter resource.
                properties:
                  attributes:
                    type: object
                    description: Filter attributes.
                    properties:
                      chart_type_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/chart_type_id'
                          - type: 'null'
                        description: The chart type used for report filters displayed as charts.
                      column_settings:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/column_settings'
                          - type: 'null'
                        description: Column display settings (width, visibility, order).
                      columns:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/columns'
                          - type: 'null'
                        description: The list of columns shown in this filter view.
                      created_at:
                        $ref: '#/components/schemas/resource_filter/properties/created_at'
                      default:
                        $ref: '#/components/schemas/resource_filter/properties/default'
                      exchange_currency:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/exchange_currency'
                          - type: 'null'
                        description: The currency used for exchange rate calculations in this filter.
                      exchange_date:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/exchange_date'
                          - type: 'null'
                        description: The date used for exchange rate calculations in this filter.
                      filterable_collection:
                        $ref: '#/components/schemas/resource_filter/properties/filterable_collection'
                      filterable_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/filterable_id'
                          - type: 'null'
                        description: The ID of the resource (e.g. project) this filter is scoped to.
                      filterable_type:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/filterable_type'
                          - type: 'null'
                        description: The type of resource this filter is scoped to (e.g. project, organization).
                      formulas:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/formulas'
                          - type: 'null'
                        description: Custom formula definitions used in report columns.
                      group_by:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/group_by'
                          - type: 'null'
                        description: The field used to group results in report views.
                      hidden:
                        $ref: '#/components/schemas/resource_filter/properties/hidden'
                      layout_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/layout_id'
                          - type: 'null'
                        description: The layout type for this filter view (e.g. list, board, gantt).
                      name:
                        $ref: '#/components/schemas/resource_filter/properties/name'
                      original_id:
                        $ref: '#/components/schemas/resource_filter/properties/original_id'
                      params:
                        type: object
                        description: The filter criteria and query parameters.
                      predefined_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/predefined_id'
                          - type: 'null'
                        description: The ID of the predefined system filter this is based on.
                      public:
                        $ref: '#/components/schemas/resource_filter/properties/public'
                      pulse_count:
                        $ref: '#/components/schemas/resource_filter/properties/pulse_count'
                      report:
                        $ref: '#/components/schemas/resource_filter/properties/report'
                      report_layout_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/report_layout_id'
                          - type: 'null'
                        description: ID of the report layout used by this filter.
                      settings:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/settings'
                          - type: 'null'
                        description: Additional display settings for this filter.
                      shared:
                        $ref: '#/components/schemas/resource_filter/properties/shared'
                      sort_by:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/sort_by'
                          - type: 'null'
                        description: The field used to sort results in this filter view.
                      transpose_by:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/transpose_by'
                          - type: 'null'
                        description: The field used to transpose results in report views.
                      type_id:
                        $ref: '#/components/schemas/resource_filter/properties/type_id'
                      updated_at:
                        $ref: '#/components/schemas/resource_filter/properties/updated_at'
                      last_pulse_sent_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/last_pulse_sent_at'
                          - type: 'null'
                        description: The timestamp when the last pulse notification was sent using this filter.
                      last_viewed_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_filter/properties/last_viewed_at'
                          - type: 'null'
                        description: The timestamp when this filter was last viewed by the current user.
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Filter relationships.
                    properties:
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      memberships:
                        $ref: '#/components/schemas/_collection_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      report_category:
                        $ref: '#/components/schemas/_single_relationship'
                      template_object:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '89'
                type: filters
                attributes:
                  name: My Open Tasks
                  item_type: task
                  filter_data:
                    assignee_id:
                      - 12
                    closed:
                      eq: false
                  created_at: '2026-01-15T10:00:00.000+00:00'
                relationships:
                  person:
                    data:
                      type: people
                      id: '12'
              included: []
      description: Single filter
    collection_filter:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of filter records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A filter resource object.
                  properties:
                    attributes:
                      type: object
                      description: Filter attributes.
                      properties:
                        chart_type_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_filter/properties/chart_type_id'
                            - type: 'null'
                          description: Chart type for report filters (e.g. bar, line, pie).
                        column_settings:
                          anyOf:
                            - $ref: '#/components/schemas/resource_filter/properties/column_settings'
                            - type: 'null'
                          description: Per-column display settings for this filter (width, visibility, order).
                        columns:
                          anyOf:
                            - $ref: '#/components/schemas/resource_filter/properties/columns'
                            - type: 'null'
                          description: List of columns configured for display in this filter view.
                        created_at:
                          $ref: '#/components/schemas/resource_filter/properties/created_at'
                        default:
                          $ref: '#/components/schemas/resource_filter/properties/default'
                        exchange_currency:
                          anyOf:
                            - $ref: '#/components/schemas/resource_filter/properties/exchange_currency'
                            - type: 'null'
                          description: Currency used for financial value conversion in report filters.
                        exchange_date:
                          anyOf:
                            - $ref: '#/components/schemas/resource_filter/properties/exchange_date'
                            - type: 'null'
                          description: Date used for currency exchange rate lookup in report filters.
                        filterable_collection:
                          $ref: '#/components/schemas/resource_filter/properties/filterable_collection'
                        filterable_id:
                          anyOf:
