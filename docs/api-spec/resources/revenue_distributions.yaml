        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    single_revenue_distribution:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single revenue_distribution record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned revenue_distribution resource.
                properties:
                  attributes:
                    type: object
                    description: Revenue distribution attributes.
                    properties:
                      amount:
                        $ref: '#/components/schemas/resource_revenue_distribution/properties/amount'
                      amount_default:
                        $ref: '#/components/schemas/resource_revenue_distribution/properties/amount_default'
                      amount_normalized:
                        $ref: '#/components/schemas/resource_revenue_distribution/properties/amount_normalized'
                      amount_percent:
                        anyOf:
                          - $ref: '#/components/schemas/resource_revenue_distribution/properties/amount_percent'
                          - type: string
                          - type: 'null'
                        description: The percentage of total budget revenue this distribution represents.
                      currency:
                        $ref: '#/components/schemas/resource_revenue_distribution/properties/currency'
                      currency_default:
                        $ref: '#/components/schemas/resource_revenue_distribution/properties/currency_default'
                      currency_normalized:
                        $ref: '#/components/schemas/resource_revenue_distribution/properties/currency_normalized'
                      end_on:
                        $ref: '#/components/schemas/resource_revenue_distribution/properties/end_on'
                      start_on:
                        $ref: '#/components/schemas/resource_revenue_distribution/properties/start_on'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Revenue distribution relationships.
                    properties:
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '345'
                type: revenue_distributions
                attributes:
                  amount: '10000.00'
                  recognized_at: '2026-03-31'
                  project_id: 6899
                  deal_id: 89
                  currency: USD
              included: []
      description: Single revenue distribution
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    collection_revenue_distribution:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of revenue distribution records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A revenue distribution resource object.
                  properties:
                    attributes:
                      type: object
                      description: Revenue distribution attributes.
                      properties:
                        amount:
                          $ref: '#/components/schemas/resource_revenue_distribution/properties/amount'
                        amount_default:
                          $ref: '#/components/schemas/resource_revenue_distribution/properties/amount_default'
                        amount_normalized:
                          $ref: '#/components/schemas/resource_revenue_distribution/properties/amount_normalized'
                        amount_percent:
                          anyOf:
                            - $ref: '#/components/schemas/resource_revenue_distribution/properties/amount_percent'
                            - type: string
                            - type: 'null'
                          description: The percentage of total revenue attributed to this period.
                        currency:
                          $ref: '#/components/schemas/resource_revenue_distribution/properties/currency'
                        currency_default:
                          $ref: '#/components/schemas/resource_revenue_distribution/properties/currency_default'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_revenue_distribution/properties/currency_normalized'
                        end_on:
                          $ref: '#/components/schemas/resource_revenue_distribution/properties/end_on'
                        start_on:
                          $ref: '#/components/schemas/resource_revenue_distribution/properties/start_on'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Revenue distribution relationships.
                      properties:
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of revenue distribution resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '345'
                  type: revenue_distributions
                  attributes:
                    amount: '10000.00'
                    recognized_at: '2026-03-31'
                    project_id: 6899
                    deal_id: 89
                    currency: USD
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection revenue distribution
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_not_acceptable:
      enum:
        - bulk_extensions_headers_invalid
        - not_acceptable
        - read_only_mode_violation
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 406.
    error_code_not_found:
      enum:
        - not_found
        - record_not_found
        - route_not_found
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 404.
    error_code_forbidden:
      enum:
        - access_denied
        - account_inactive
        - agent_role_impersonation_denied
        - automatic_invoicing_not_manageable
        - billing_catalog_list_unavailable
        - booking_conflict_resolver_unavailable
        - budget_inaccessible
        - budgets_not_manageable
