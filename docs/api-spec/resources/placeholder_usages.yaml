    resource_placeholder_usage:
      type: object
      title: Placeholder usage Resource
      description: A record linking a placeholder to a specific task or todo field, optionally with a date offset interval.
      properties:
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this placeholder usage was created.
          example:
            gt: '2026-01-01'
        field:
          enum:
            - assignee
            - subscriber
            - due_date
            - start_date
          type: string
          title: Field
          description: The task or todo field this placeholder is mapped to (e.g. assignee, due_date, start_date).
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: The unique identifier of this placeholder usage.
          example:
            - 123
        interval_direction:
          enum:
            - before
            - after
          type: string
          title: Interval Direction
          description: The direction of the date offset relative to the reference date, either before or after.
          example:
            eq: value
        interval_unit:
          enum:
            - day
            - week
            - month
            - year
          type: string
          title: Interval Unit
          description: The unit of the date offset interval (day, week, month, or year).
          example:
            eq: value
        interval_value:
          type: integer
          title: Interval Value
          description: The numeric value of the date offset applied to the target field.
          example:
            eq: value
        placeholder:
          title: Placeholder
          description: The placeholder associated with this usage.
          example:
            eq: value
        placeholder_id:
          type: integer
          title: Placeholder
          description: ID of the placeholder associated with this usage.
          example:
            - 123
        project_id:
          type: integer
          title: Project
          description: ID of the project this placeholder usage is associated with.
          example:
            - 123
        skip_weekends:
          type: boolean
          title: Skip Weekends
          description: When true, weekends are excluded when calculating date offsets for this placeholder.
          example:
            eq: value
        target_id:
          type: integer
          title: Target
          description: The ID of the target record (task or todo) this placeholder usage applies to.
          example:
            - 123
        target_type:
          enum:
            - Ticket
            - Todo
          type: string
          title: Target Type
          description: The type of the target record — `Ticket` for tasks, `Todo` for todos.
          example:
            eq: active
        task:
          title: Task
          description: The task this placeholder usage is linked to, if the target is a task.
          example:
            eq: value
        task_id:
          type: integer
          title: Task
          description: ID of the task this placeholder usage is linked to, if the target is a task.
          example:
            - 123
        todo:
          title: Todo
          description: The todo this placeholder usage is linked to, if the target is a todo.
          example:
            eq: value
        todo_id:
          type: integer
          title: Todo
          description: ID of the todo this placeholder usage is linked to, if the target is a todo.
          example:
            - 123
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when this placeholder usage was last updated.
          example:
            gt: '2026-01-01'
      example:
        id: '199'
        type: placeholder_usages
        attributes:
          id: 199
          target_id: 7388879
          target_type: Ticket
          field: assignee
          placeholder_id: 88
          interval_value: null
          interval_unit: null
          interval_direction: null
          skip_weekends: false
          created_at: '2026-09-02T11:48:44.135+02:00'
          updated_at: '2026-09-02T11:48:44.135+02:00'
        relationships:
          placeholder:
            data:
              type: placeholders
              id: '88'
          task:
            data:
              type: tasks
              id: '7388879'
