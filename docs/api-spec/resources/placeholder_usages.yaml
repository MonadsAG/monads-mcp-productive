openapi: 3.1.0
info:
  title: Productive.io API – Placeholder Usages
  version: 2.0.0
description: |-
  **Placeholder usages** track how a placeholder's allocated capacity is distributed across projects and time periods.

  Query usages to understand utilization of unfilled resource slots and identify over- or under-allocated placeholders in your resource plan.
x-filters:
  placeholder_usage:
    project_id:
      description: Filter by the associated project (matches usages on tasks or todos within that project).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    interval_enabled:
      description: Filter to include only usages where interval offset is enabled.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    target_id:
      description: Filter by the target resource ID (the task or todo the placeholder is applied to).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    todo_id:
      description: Filter by the associated todo.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      description: Filter by the associated task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    skip_weekends:
      description: Filter to include only usages where weekends are skipped in interval calculations.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    field:
      description: Filter by the date-offset field used for interval calculation.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    target_type:
      description: Filter by the target resource type (task or todo).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    placeholder_id:
      description: Filter by the associated placeholder.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/placeholder_usages:
    get:
      tags:
        - Placeholder Usages
      summary: Get placeholder usages
      responses:
        '200':
          $ref: '#/components/responses/collection_placeholder_usage'
      parameters:
        - $ref: '#/components/parameters/filter_placeholder_usage'
        - $ref: '#/components/parameters/sort_placeholder_usage'
        - $ref: '#/components/parameters/header_organization'
      operationId: placeholder_usages-index
      description: List all placeholder usages.
    post:
      tags:
        - Placeholder Usages
      summary: Create a placeholder usage
      responses:
        '201':
          $ref: '#/components/responses/single_placeholder_usage'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: placeholder_usages-create
      description: Create a new placeholder usage.
  /api/v2/placeholder_usages/{id}:
    get:
      tags:
        - Placeholder Usages
      summary: Gets a placeholder usage
      responses:
        '200':
          $ref: '#/components/responses/single_placeholder_usage'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the placeholder usage to retrieve.
      operationId: placeholder_usages-show
      description: Retrieve a single placeholder usage by ID.
    patch:
      tags:
        - Placeholder Usages
      summary: Update a placeholder usage
      responses:
        '200':
          $ref: '#/components/responses/single_placeholder_usage'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the placeholder usage to update.
      operationId: placeholder_usages-update
      description: Update a placeholder usage.
    delete:
      tags:
        - Placeholder Usages
      summary: Deletes a placeholder usage
      responses:
        '204':
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the placeholder usage to delete.
      operationId: placeholder_usages-destroy
      description: Delete a placeholder usage by ID.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_placeholder_usage:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - created_at
            - -created_at
            - field
            - -field
            - id
            - -id
            - interval_direction
            - -interval_direction
            - interval_enabled
            - -interval_enabled
            - interval_unit
            - -interval_unit
            - interval_value
            - -interval_value
            - placeholder_id
            - -placeholder_id
            - skip_weekends
            - -skip_weekends
            - target_id
            - -target_id
            - target_type
            - -target_type
            - updated_at
            - -updated_at
          type: string
        title: Sort placeholder usage
      explode: false
      required: false
      description: Sort order for placeholder usage list results. Accepts one or more field names, comma-separated; prefix with `-` for descending. --branch descriptions
    filter_placeholder_usage:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.placeholder_usage at the top of this file.
      required: false
      description: Filter parameter for querying placeholder usages.
  responses:
    single_placeholder_usage:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      id:
                        $ref: '#/components/schemas/resource_placeholder_usage/properties/id'
                      field:
                        $ref: '#/components/schemas/resource_placeholder_usage/properties/field'
                      target_id:
                        $ref: '#/components/schemas/resource_placeholder_usage/properties/target_id'
                      created_at:
                        $ref: '#/components/schemas/resource_placeholder_usage/properties/created_at'
                      updated_at:
                        $ref: '#/components/schemas/resource_placeholder_usage/properties/updated_at'
                      target_type:
                        $ref: '#/components/schemas/resource_placeholder_usage/properties/target_type'
                      interval_unit:
                        $ref: '#/components/schemas/resource_placeholder_usage/properties/interval_unit'
                      skip_weekends:
                        $ref: '#/components/schemas/resource_placeholder_usage/properties/skip_weekends'
                      interval_value:
                        $ref: '#/components/schemas/resource_placeholder_usage/properties/interval_value'
                      placeholder_id:
                        $ref: '#/components/schemas/resource_placeholder_usage/properties/placeholder_id'
                      interval_enabled:
                        $ref: '#/components/schemas/resource_placeholder_usage/properties/interval_enabled'
                      interval_direction:
                        $ref: '#/components/schemas/resource_placeholder_usage/properties/interval_direction'
                  relationships:
                    type: object
                    properties:
                      task:
                        $ref: '#/components/schemas/_single_relationship'
                      todo:
                        $ref: '#/components/schemas/_single_relationship'
                      placeholder:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single placeholder usage
    collection_placeholder_usage:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        id:
                          $ref: '#/components/schemas/resource_placeholder_usage/properties/id'
                        field:
                          $ref: '#/components/schemas/resource_placeholder_usage/properties/field'
                        target_id:
                          $ref: '#/components/schemas/resource_placeholder_usage/properties/target_id'
                        created_at:
                          $ref: '#/components/schemas/resource_placeholder_usage/properties/created_at'
                        updated_at:
                          $ref: '#/components/schemas/resource_placeholder_usage/properties/updated_at'
                        target_type:
                          $ref: '#/components/schemas/resource_placeholder_usage/properties/target_type'
                        interval_unit:
                          $ref: '#/components/schemas/resource_placeholder_usage/properties/interval_unit'
                        skip_weekends:
                          $ref: '#/components/schemas/resource_placeholder_usage/properties/skip_weekends'
                        interval_value:
                          $ref: '#/components/schemas/resource_placeholder_usage/properties/interval_value'
                        placeholder_id:
                          $ref: '#/components/schemas/resource_placeholder_usage/properties/placeholder_id'
                        interval_enabled:
                          $ref: '#/components/schemas/resource_placeholder_usage/properties/interval_enabled'
                        interval_direction:
                          $ref: '#/components/schemas/resource_placeholder_usage/properties/interval_direction'
                    relationships:
                      type: object
                      properties:
                        task:
                          $ref: '#/components/schemas/_single_relationship'
                        todo:
                          $ref: '#/components/schemas/_single_relationship'
                        placeholder:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection placeholder usage
  schemas:
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    resource_placeholder_usage:
      type: object
      title: Placeholder usage Resource
      properties:
        field:
          enum:
            - assignee
            - subscriber
            - due_date
            - start_date
          type: string
          title: Field
          description: The task or todo field this placeholder is mapped to (e.g. assignee, due_date, start_date).
          example:
            eq: value
        project_id:
          type: integer
          title: Project
          description: ID of the project this placeholder usage is associated with.
          example:
            - 123
        placeholder_id:
          type: integer
          title: Placeholder
          description: ID of the placeholder associated with this usage.
          example:
            - 123
        interval_enabled:
          type: boolean
          title: Interval Enabled
          description: Whether the date offset interval is enabled for this placeholder usage.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: The unique identifier of this placeholder usage.
          example:
            - 123
        target_type:
          type: string
          title: Target Type
          description: The type of the target record this placeholder usage applies to (task or todo).
          example:
            eq: active
        interval_value:
          type: integer
          title: Interval Value
          description: The numeric value of the date offset applied to the target field when using interval mode.
          example:
            eq: value
        todo:
          title: Todo
          description: The todo this placeholder usage is linked to, if the target is a todo.
          example:
            eq: value
        todo_id:
          type: integer
          title: Todo
          description: ID of the todo this placeholder usage is linked to, if the target is a todo.
          example:
            - 123
        interval_direction:
          enum:
            - before
            - after
          type: string
          title: Interval Direction
          description: The direction of the date offset relative to the reference date, either before or after.
          example:
            eq: value
        skip_weekends:
          type: boolean
          title: Skip Weekends
          description: When true, weekends are excluded when calculating date offsets for this placeholder.
          example:
            eq: value
        target_id:
          type: integer
          title: Target
          description: The ID of the target record (task or todo) this placeholder usage applies to.
          example:
            - 123
        placeholder:
          title: Placeholder
          description: The placeholder associated with this usage.
          example:
            eq: value
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when this placeholder usage was last updated.
          example:
            gt: '2026-01-01'
        task_id:
          type: integer
          title: Task
          description: ID of the task this placeholder usage is linked to, if the target is a task.
          example:
            - 123
        task:
          title: Task
          description: The task this placeholder usage is linked to, if the target is a task.
          example:
            eq: value
        interval_unit:
          enum:
            - day
            - week
            - month
            - year
          type: string
          title: Interval Unit
          description: The unit of the date offset interval (day, week, month, or year).
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this placeholder usage was created.
          example:
            gt: '2026-01-01'
      description: A record linking a placeholder to a specific task or todo field, optionally with a date offset interval.
      example:
        id: '123'
        type: placeholder_usages
        attributes:
          booked_hours: 40
          date: '2026-01-15'
          placeholder_id: 56
        relationships: {}
