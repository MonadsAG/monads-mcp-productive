openapi: 3.1.0
info:
  title: Productive.io API – Placeholder Usages
  version: 2.0.0
description: |-
  **Placeholder usages** bind a placeholder to a specific field (assignee, subscriber, start date, or due date) on a template task or todo. When the template is instantiated, the resolved placeholder value is written to that field.

  Date fields can additionally apply a relative interval offset from the resolved date.
x-filters:
  placeholder_usage:
    field:
      description: Filter by the target field the placeholder is bound to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    placeholder_id:
      description: Filter by the associated placeholder.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project (matches usages on tasks or todos within that project).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    skip_weekends:
      description: Filter to include only usages where weekends are skipped in interval calculations.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    target_id:
      description: Filter by the target resource ID (the task or todo the placeholder is applied to).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    target_type:
      description: Filter by the target record type — `Ticket` or `Todo`.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      description: Filter by the associated task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    todo_id:
      description: Filter by the associated todo.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/placeholder_usages:
    get:
      tags:
        - Placeholder Usages
      summary: Get placeholder usages
      operationId: placeholder_usages-index
      description: Returns a paginated list of placeholder usages — bindings of placeholders to fields on template tasks and todos.
      parameters:
        - $ref: '#/components/parameters/filter_placeholder_usage'
        - $ref: '#/components/parameters/sort_placeholder_usage'
      responses:
        '200':
          $ref: '#/components/responses/collection_placeholder_usage'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Placeholder Usages
      summary: Create a placeholder usage
      operationId: placeholder_usages-create
      description: |-
        Creates a placeholder usage — binds a placeholder to a field on a template task or todo. Requires `field`, `placeholder_id`, and exactly one of `task_id` or `todo_id`. The placeholder's type must match the field: `start_date` and `due_date` take a date placeholder, `assignee` and `subscriber` take a person placeholder. Todos support only `assignee`.

        For `assignee`, `start_date`, and `due_date` only one usage can exist per target — creating one also clears the value currently set on that field, so the placeholder takes over. `subscriber` usages can be added multiple times.

        ### Bind a person placeholder to a task's assignee

        ```json
        {
          "data": {
            "type": "placeholder_usages",
            "attributes": {
              "field": "assignee",
              "placeholder_id": 88,
              "task_id": 7388879
            }
          }
        }
        ```

        ### Bind a date placeholder to a due date, offset by one week

        When the template is instantiated, the resolved date is offset by the interval — here one week after, skipping weekends.

        ```json
        {
          "data": {
            "type": "placeholder_usages",
            "attributes": {
              "field": "due_date",
              "placeholder_id": 92,
              "task_id": 7388879,
              "interval_value": 1,
              "interval_unit": "week",
              "interval_direction": "after",
              "skip_weekends": true
            }
          }
        }
        ```
      requestBody:
        $ref: '#/components/requestBodies/placeholder_usage'
      responses:
        '201':
          $ref: '#/components/responses/single_placeholder_usage'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_placeholder_usage'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/placeholder_usages/{id}:
    get:
      tags:
        - Placeholder Usages
      summary: Gets a placeholder usage
      operationId: placeholder_usages-show
      description: Returns a single placeholder usage by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the placeholder usage to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/single_placeholder_usage'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Placeholder Usages
      summary: Update a placeholder usage
      operationId: placeholder_usages-update
      description: Updates a placeholder usage. Only the provided attributes are modified — the target and `field` are set on create and cannot be changed. A different `placeholder_id` must still match the usage's field type.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the placeholder usage to update.
      requestBody:
        $ref: '#/components/requestBodies/placeholder_usage_update'
      responses:
        '200':
          $ref: '#/components/responses/single_placeholder_usage'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_placeholder_usage'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Placeholder Usages
      summary: Deletes a placeholder usage
      operationId: placeholder_usages-destroy
      description: Deletes a placeholder usage.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the placeholder usage to delete.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
