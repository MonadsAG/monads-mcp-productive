openapi: 3.1.0
info:
  title: Productive.io API – Passwords
  version: 2.0.0
description: |-
  Manage **user password changes and resets**.

  These endpoints handle credential update flows for authenticated users and support administrative password reset operations. Password changes require the current password or a valid reset token.
paths:
  /api/v2/passwords:
    post:
      tags:
        - Passwords
      summary: Create a password
      responses:
        '201':
          $ref: '#/components/responses/single_password'
        '204':
          content:
            any: {}
          headers: {}
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: passwords-create
      requestBody:
        $ref: '#/components/requestBodies/password'
      description: Create a new password reset request.
  /api/v2/passwords/{id}:
    get:
      tags:
        - Passwords
      summary: Gets a password
      responses:
        '200':
          $ref: '#/components/responses/single_password'
        '404':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Not Found
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: passwords-show
      description: Retrieve a single password reset by ID.
    patch:
      tags:
        - Passwords
      summary: Update a password
      responses:
        '200':
          $ref: '#/components/responses/single_password'
        '204':
          content:
            any: {}
          headers: {}
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: passwords-update
      requestBody:
        $ref: '#/components/requestBodies/password'
      description: Update a password reset.
components:
  requestBodies:
    password:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      password:
                        $ref: '#/components/schemas/resource_password/properties/password'
                      password_confirmation:
                        $ref: '#/components/schemas/resource_password/properties/password_confirmation'
      description: Request body for updating a user's password.
  schemas:
    resource_password:
      type: object
      title: Password Resource
      properties:
        email:
          type: string
          title: Email
          description: The email address associated with the user whose password is being reset or changed.
          example:
            eq: value
        first_password:
          type: boolean
          title: First Password
          description: When true, the user has not yet set their first password after account creation.
          example:
            eq: value
        password:
          title: Password
          description: The new password to set for the user.
          example:
            eq: value
        password_confirmation:
          title: Password Confirmation
          description: Confirmation of the new password, must match the password field.
          example:
            eq: value
      description: A password reset or change request, identified by a reset token.
      example:
        id: '123'
        type: passwords
        attributes:
          changed_at: '2026-01-01T00:00:00Z'
        relationships: {}
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
  responses:
    single_password:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      email:
                        $ref: '#/components/schemas/resource_password/properties/email'
                      first_password:
                        $ref: '#/components/schemas/resource_password/properties/first_password'
                  relationships:
                    type: object
                    properties: {}
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single password
