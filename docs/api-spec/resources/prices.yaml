            - -booking_tracking_enabled
            - custom_fields
            - -custom_fields
            - description
            - -description
            - discount
            - -discount
            - estimated_cost
            - -estimated_cost
            - expense_tracking_enabled
            - -expense_tracking_enabled
            - markup
            - -markup
            - name
            - -name
            - quantity
            - -quantity
            - rate
            - -rate
            - service_type
            - -service_type
            - time_tracking_enabled
            - -time_tracking_enabled
            - unit_id
            - -unit_id
