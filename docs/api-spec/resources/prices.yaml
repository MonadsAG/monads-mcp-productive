openapi: 3.1.0
info:
  title: Productive.io API – Prices
  version: 2.0.0
description: Rate card line items with billing configuration. Each price belongs to a rate card and defines a service type, billing type (hourly, fixed, etc.), unit, rate, and optional tracking defaults. Supports discounts, markups, budget caps, and custom fields.
x-filters:
  price:
    billing_type_id:
      description: Filter by billing type ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    booking_tracking_enabled:
      description: Filter to include only price entries where booking tracking is enabled.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by client company.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_fields:
      description: Filter by custom field values.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    expense_tracking_enabled:
      description: Filter to include only price entries where expense tracking is enabled.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    rate_card_id:
      description: Filter by the associated rate card.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    rate_card_status:
      description: Filter by the status of the associated rate card (active or archived).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_type_id:
      description: Filter by the associated service type.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    time_tracking_enabled:
      description: Filter to include only price entries where time tracking is enabled.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    unit_id:
      description: Filter by unit ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/prices:
    get:
      tags:
        - Prices
      summary: Get prices
      operationId: prices-index
      description: List all prices.
      parameters:
        - $ref: '#/components/parameters/filter_price'
        - $ref: '#/components/parameters/sort_price'
      responses:
        '200':
          $ref: '#/components/responses/collection_price'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Prices
      summary: Create a price
      operationId: prices-create
      description: Create a new price.
      requestBody:
        $ref: '#/components/requestBodies/price'
      responses:
        '201':
          $ref: '#/components/responses/single_price'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/prices/{id}:
    get:
      tags:
        - Prices
      summary: Gets a price
      operationId: prices-show
      description: Retrieve a single price by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_price'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Prices
      summary: Update a price
      operationId: prices-update
      description: Update a price.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/price'
      responses:
        '200':
          $ref: '#/components/responses/single_price'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Prices
      summary: Deletes a price
      operationId: prices-destroy
      description: Delete a price by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
