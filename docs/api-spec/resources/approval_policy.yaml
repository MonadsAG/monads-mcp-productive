openapi: 3.1.0
info:
  title: Productive.io API – Approval Policy
  version: 2.0.0
description: Approval policies define who approves time entries, absences, or expenses. Configures the set of approvers and whether all approvers must approve (unanimous) or any single approver is sufficient.
x-filters:
  approval_policy:
    custom:
      description: Filter by whether the approval policy is custom (true) or system-defined (false).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by active/archived status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    type_id:
      description: Filter by approval policy type ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/approval_policies/{id}/archive:
    patch:
      tags:
        - Approval Policy
      summary: Archives the approval policy
      operationId: approval_policies-archive-archive
      description: Archive an approval policy.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy to archive.
      responses:
        '200':
          $ref: '#/components/responses/single_approval_policy'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/approval_policies:
    get:
      tags:
        - Approval Policy
      summary: Get approval policies
      operationId: approval_policies-index
      description: List approval policies with optional filters and pagination.
      parameters:
        - $ref: '#/components/parameters/filter_approval_policy'
        - $ref: '#/components/parameters/sort_approval_policy'
      responses:
        '200':
          $ref: '#/components/responses/collection_approval_policy'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Approval Policy
      summary: Creates the approval policy
      operationId: approval_policies-create
      description: Create a new approval policy.
      requestBody:
        $ref: '#/components/requestBodies/approval_policy'
      responses:
        '201':
          $ref: '#/components/responses/single_approval_policy'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_approval_policy'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/approval_policies/{id}/restore:
    patch:
      tags:
        - Approval Policy
      summary: Restores the approval policy
      operationId: approval_policies-restore-restore
      description: Restore an approval policy.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy to restore.
      responses:
        '200':
          $ref: '#/components/responses/single_approval_policy'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/approval_policies/{id}:
    get:
      tags:
        - Approval Policy
      summary: Gets the approval policy
      operationId: approval_policies-show
      description: Retrieve a single approval policy by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/single_approval_policy'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Approval Policy
      summary: Updates the approval policy
      operationId: approval_policies-update
      description: Update an approval policy.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy to update.
      requestBody:
        $ref: '#/components/requestBodies/approval_policy'
      responses:
        '200':
          $ref: '#/components/responses/single_approval_policy'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_approval_policy'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
