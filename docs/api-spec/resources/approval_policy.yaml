    single_approval_policy:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single approval policy record in JSON:API format.
            properties:
              data:
                type: object
                description: The approval policy resource object.
                properties:
                  attributes:
                    type: object
                    description: Approval policy attributes.
                    properties:
                      archived_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_approval_policy/properties/archived_at'
                          - type: 'null'
                        description: The date and time when the approval policy was archived, or null if not archived.
                      custom:
                        $ref: '#/components/schemas/resource_approval_policy/properties/custom'
                      default:
                        $ref: '#/components/schemas/resource_approval_policy/properties/default'
                      name:
                        $ref: '#/components/schemas/resource_approval_policy/properties/name'
                      type_id:
                        $ref: '#/components/schemas/resource_approval_policy/properties/type_id'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Approval policy relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '7'
                type: approval_policies
                attributes:
                  name: Time Entry Approval
                  policy_type: time_entry
                  created_at: '2026-01-01T00:00:00.000+00:00'
                relationships: {}
              included: []
      description: Single approval policy
    conflict:
