                    policy_type: time_entry
                    created_at: '2026-01-01T00:00:00.000+00:00'
                  relationships: {}
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
