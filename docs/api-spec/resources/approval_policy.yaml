openapi: 3.1.0
info:
  title: Productive.io API – Approval Policy
  version: 2.0.0
description: Approval policies define who approves time entries, absences, or expenses. Configures the set of approvers and whether all approvers must approve (unanimous) or any single approver is sufficient.
x-filters:
  approval_policy:
    status:
      description: Filter by active/archived status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom:
      description: Filter by whether the approval policy is custom (true) or system-defined (false).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    type_id:
      description: Filter by approval policy type ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/approval_policies/{id}/archive:
    patch:
      tags:
        - Approval Policy
      summary: Archives the approval policy
      responses:
        '200':
          $ref: '#/components/responses/single_approval_policy'
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy to archive.
      operationId: approval_policies-archive-archive
      description: Archive an approval policy.
  /api/v2/approval_policies:
    get:
      tags:
        - Approval Policy
      summary: Get approval policies
      responses:
        '200':
          $ref: '#/components/responses/collection_approval_policy'
      parameters:
        - $ref: '#/components/parameters/sort_approval_policy'
        - $ref: '#/components/parameters/filter_approval_policy'
        - $ref: '#/components/parameters/header_organization'
      operationId: approval_policies-index
      description: List approval policies with optional filters and pagination.
    post:
      tags:
        - Approval Policy
      summary: Creates the approval policy
      responses:
        '201':
          $ref: '#/components/responses/single_approval_policy'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: approval_policies-create
      requestBody:
        $ref: '#/components/requestBodies/approval_policy'
      description: Create a new approval policy.
  /api/v2/approval_policies/{id}/restore:
    patch:
      tags:
        - Approval Policy
      summary: Restores the approval policy
      responses:
        '200':
          $ref: '#/components/responses/single_approval_policy'
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy to restore.
        - $ref: '#/components/parameters/header_organization'
      operationId: approval_policies-restore-restore
      description: Restore an approval policy.
  /api/v2/approval_policies/{id}:
    get:
      tags:
        - Approval Policy
      summary: Gets the approval policy
      responses:
        '200':
          $ref: '#/components/responses/single_approval_policy'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy to retrieve.
      operationId: approval_policies-show
      description: Retrieve a single approval policy by ID.
    patch:
      tags:
        - Approval Policy
      summary: Updates the approval policy
      responses:
        '200':
          $ref: '#/components/responses/single_approval_policy'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the approval policy to update.
        - $ref: '#/components/parameters/header_organization'
      operationId: approval_policies-update
      requestBody:
        $ref: '#/components/requestBodies/approval_policy'
      description: Update an approval policy.
components:
  requestBodies:
    approval_policy:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - type_id
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_approval_policy/properties/name'
                      custom:
                        $ref: '#/components/schemas/resource_approval_policy/properties/custom'
                      default:
                        $ref: '#/components/schemas/resource_approval_policy/properties/default'
                      type_id:
                        $ref: '#/components/schemas/resource_approval_policy/properties/type_id'
      description: Request body for creating or updating an approval policy. Specify the policy type (time, absence, or expense), the set of approvers, and whether unanimous approval is required. Link to a service or person to scope the policy.
  schemas:
    resource_approval_policy:
      type: object
      title: Approval policy Resource
      properties:
        type_id:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Type
          description: 'Numeric identifier for the approval policy type: 1 = absence, 2 = budget, 3 = deal.'
          example:
            - 123
        default:
          type: boolean
          title: Default
          description: Indicates whether this is the default approval policy for its type.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this approval policy belongs to.
          example:
            eq: value
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when the approval policy was archived, or null if active.
          example:
            gt: '2026-01-01'
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
          description: The current status of the approval policy (e.g. active or archived).
          example:
            eq: active
        name:
          type: string
          title: Name
          description: The display name of the approval policy.
          example:
            eq: value
        custom:
          type: boolean
          title: Custom
          description: Indicates whether this is a custom approval policy created for a specific assignment.
          example:
            eq: value
      description: Approval policy defining who approves time entries, absences, or expenses. Configures the set of approvers and whether unanimous approval is required. Auto-creates approval_status records for each approver when a submission is made.
      example:
        id: '7'
        type: approval_policies
        attributes:
          name: Time Entry Approval
          policy_type: time_entry
          created_at: '2026-01-01T00:00:00.000+00:00'
        relationships: {}
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_approval_policy:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.approval_policy at the top of this file.
      required: false
      description: Filter parameter for querying approval policies.
    sort_approval_policy:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort approval policy
      explode: false
      required: false
      description: Sort parameter for ordering approval policies.
  responses:
    single_approval_policy:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_approval_policy/properties/name'
                      custom:
                        $ref: '#/components/schemas/resource_approval_policy/properties/custom'
                      default:
                        $ref: '#/components/schemas/resource_approval_policy/properties/default'
                      type_id:
                        $ref: '#/components/schemas/resource_approval_policy/properties/type_id'
                      archived_at:
                        $ref: '#/components/schemas/resource_approval_policy/properties/archived_at'
                  relationships:
                    type: object
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single approval policy
    collection_approval_policy:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_approval_policy/properties/name'
                        custom:
                          $ref: '#/components/schemas/resource_approval_policy/properties/custom'
                        default:
                          $ref: '#/components/schemas/resource_approval_policy/properties/default'
                        type_id:
                          $ref: '#/components/schemas/resource_approval_policy/properties/type_id'
                        archived_at:
                          $ref: '#/components/schemas/resource_approval_policy/properties/archived_at'
                    relationships:
                      type: object
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection approval policy
