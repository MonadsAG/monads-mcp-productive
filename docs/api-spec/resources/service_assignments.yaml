openapi: 3.1.0
info:
  title: Productive.io API – Service Assignments
  version: 2.0.0
description: |-
  To restrict time tracking & expense logging, there is an option to assign specific people to specific services.
  After enabling "Restricted by person" option on a budget, services with no one assigned will ignore this restriction, until you assign someone.
  For more details about how to achieve that, please refer to the [help article](https://help.productive.io/en/articles/6202423-restricting-time-tracking-and-expense-logging-in-productive#h_a5e53cc9b0).

  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  person: Person
  service: Service
  service_assignment: ServiceAssignment {
    class: primary
  }

  # define connections
  service_assignment <- person
  service_assignment <- service
  ```
x-filters:
  service_assignment:
    service_id:
      description: Filter by the associated service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by service assignment ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter by the assigned person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/service_assignments:
    get:
      tags:
        - Service Assignments
      summary: Get service assignments
      responses:
        '200':
          $ref: '#/components/responses/collection_service_assignment'
      parameters:
        - $ref: '#/components/parameters/sort_service_assignment'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_service_assignment'
      operationId: service_assignments-index
      description: List all service assignments.
    post:
      tags:
        - Service Assignments
      summary: Create a service assignment
      responses:
        '201':
          $ref: '#/components/responses/single_service_assignment'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: service_assignments-create
      requestBody:
        $ref: '#/components/requestBodies/service_assignment'
      description: Create a new service assignment.
  /api/v2/service_assignments/{id}:
    get:
      tags:
        - Service Assignments
      summary: Gets a service assignment
      responses:
        '200':
          $ref: '#/components/responses/single_service_assignment'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: service_assignments-show
      description: Retrieve a single service assignment by ID.
    patch:
      tags:
        - Service Assignments
      summary: Update a service assignment
      responses:
        '200':
          $ref: '#/components/responses/single_service_assignment'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: service_assignments-update
      requestBody:
        $ref: '#/components/requestBodies/service_assignment'
      description: Update a service assignment.
    delete:
      tags:
        - Service Assignments
      summary: Deletes a service assignment
      responses:
        '204':
          description: No Content
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: service_assignments-destroy
      description: Delete a service assignment by ID.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_service_assignment:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.service_assignment at the top of this file.
      required: false
      description: Filters
    sort_service_assignment:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort service assignment
      explode: false
      required: false
      description: Sort service assignment
  requestBodies:
    service_assignment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - service_id
                      - person_id
                    properties:
                      person_id:
                        $ref: '#/components/schemas/resource_service_assignment/properties/person_id'
                      service_id:
                        $ref: '#/components/schemas/resource_service_assignment/properties/service_id'
      description: Request body for creating or updating a service assignment.
  schemas:
    resource_service_assignment:
      type: object
      title: Service assignment Resource
      properties:
        person_id:
          type: integer
          title: Person
          description: ID of the person assigned to this service.
          example:
            - 123
        service:
          title: Service
          description: The service this assignment belongs to.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this service assignment belongs to.
          example:
            eq: value
        person:
          title: Person
          description: The person assigned to this service.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: The unique identifier of this service assignment.
          example:
            - 123
        service_id:
          type: integer
          title: Service
          description: ID of the service this assignment belongs to.
          example:
            - 123
      description: Represents an assignment of a person to a service (line item) on a deal or budget.
      example:
        id: '123'
        type: service_assignments
        attributes:
          billable: true
          rate: 150
        relationships:
          person:
            data:
              type: people
              id: '12'
          service:
            data:
              type: services
              id: '34'
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  responses:
    single_service_assignment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties: {}
                  relationships:
                    type: object
                    properties:
                      person:
                        $ref: '#/components/schemas/_single_relationship'
                      service:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single service assignment
    collection_service_assignment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties: {}
                    relationships:
                      type: object
                      properties:
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                        service:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection service assignment
