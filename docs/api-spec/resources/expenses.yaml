paths:
  /api/v2/expenses/{id}/approve:
    patch:
      tags:
        - Expenses
      summary: Approves an expense
      responses:
        '200':
          $ref: '#/components/responses/single_expense'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: expenses-approve-approve
      requestBody:
        $ref: '#/components/requestBodies/expense_approve'
      description: Approve an expense by ID.
  /api/v2/expenses/copy:
    post:
      tags:
        - Expenses
      summary: Copy an expense
      responses:
        '200':
          $ref: '#/components/responses/single_expense'
        '201':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Created
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: expenses-copy-copy
      requestBody:
        $ref: '#/components/requestBodies/expense_copy'
      description: Copy an expense to create a duplicate.
  /api/v2/expenses:
    get:
      tags:
        - Expenses
      summary: Get expenses
      responses:
        '200':
          $ref: '#/components/responses/collection_expense'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_expense'
        - $ref: '#/components/parameters/sort_expense'
      operationId: expenses-index
      description: List expenses. Returns a paginated collection of expenses matching the specified filters.
    post:
      tags:
        - Expenses
      summary: Create a expense
      responses:
        '201':
          $ref: '#/components/responses/single_expense'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: expenses-create
      requestBody:
        $ref: '#/components/requestBodies/expense'
      description: Create a new expense and associate it with a budget service.
  /api/v2/expenses/{id}:
    get:
      tags:
        - Expenses
      summary: Gets a expense
      responses:
        '200':
          $ref: '#/components/responses/single_expense'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: expenses-show
      description: Retrieve a single expense by ID.
    patch:
      tags:
        - Expenses
      summary: Update a expense
      responses:
        '200':
          $ref: '#/components/responses/single_expense'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: expenses-update
      requestBody:
        $ref: '#/components/requestBodies/expense'
      description: Update an existing expense.
    delete:
      tags:
        - Expenses
      summary: Deletes a expense
      responses:
        '204':
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: expenses-destroy
      description: Delete an expense by ID.
  /api/v2/expenses/{id}/export:
    patch:
      tags:
        - Expenses
      summary: Exports an expense
      responses:
        '200':
          $ref: '#/components/responses/single_expense'
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: expenses-export-export
      requestBody:
        $ref: '#/components/requestBodies/expense_export'
      description: Export an expense to an external accounting system.
  /api/v2/expenses/{id}/export_update:
    patch:
      tags:
        - Expenses
      summary: Updates exported expense
      responses:
        '200':
          $ref: '#/components/responses/single_expense'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: expenses-export_update-export_update
      description: Update the export status of an expense in the external accounting system.
  /api/v2/expenses/{id}/reject:
    patch:
      tags:
        - Expenses
      summary: Rejects an expense
      responses:
        '200':
          $ref: '#/components/responses/single_expense'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
      operationId: expenses-reject-reject
      requestBody:
        $ref: '#/components/requestBodies/expense_reject'
  /api/v2/expenses/{id}/unapprove:
    patch:
      tags:
        - Expenses
      summary: Unapproves an expense
      responses:
        '200':
          $ref: '#/components/responses/single_expense'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: expenses-unapprove-unapprove
      description: Unapprove an expense by ID.
  /api/v2/expenses/{id}/unreject:
    patch:
      tags:
        - Expenses
      summary: Unrejects an expense
      responses:
        '200':
          $ref: '#/components/responses/single_expense'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - $ref: '#/components/parameters/header_organization'
      operationId: expenses-unreject-unreject
      requestBody:
        $ref: '#/components/requestBodies/expense_unreject'
components:
  requestBodies:
    expense_unreject:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      note:
                        type: string
                        title: Note
                      approver_id:
                        $ref: '#/components/schemas/resource_expense/properties/approver_id'
    expense_reject:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      note:
                        type: string
                        title: Note
                      approver_id:
                        $ref: '#/components/schemas/resource_expense/properties/approver_id'
                      rejected_reason:
                        $ref: '#/components/schemas/resource_expense/properties/rejected_reason'
    expense_export:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      payment_type:
                        type: string
                        title: Payment Type
                      account_reference_id:
                        type: string
                        title: Account Reference
                      company_reference_id:
                        $ref: '#/components/schemas/resource_expense/properties/company_reference_id'
    expense:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - name
                      - currency
                      - date
                    properties:
                      date:
                        $ref: '#/components/schemas/resource_expense/properties/date'
                      name:
                        $ref: '#/components/schemas/resource_expense/properties/name'
                      amount:
                        $ref: '#/components/schemas/resource_expense/properties/amount'
                      markup:
                        $ref: '#/components/schemas/resource_expense/properties/markup'
                      pay_on:
                        $ref: '#/components/schemas/resource_expense/properties/pay_on'
                      paid_on:
                        $ref: '#/components/schemas/resource_expense/properties/paid_on'
                      currency:
                        $ref: '#/components/schemas/resource_expense/properties/currency'
                      position:
                        $ref: '#/components/schemas/resource_expense/properties/position'
                      quantity:
                        $ref: '#/components/schemas/resource_expense/properties/quantity'
                      person_id:
                        $ref: '#/components/schemas/resource_expense/properties/person_id'
                      vendor_id:
                        $ref: '#/components/schemas/resource_expense/properties/vendor_id'
                      service_id:
                        $ref: '#/components/schemas/resource_expense/properties/service_id'
                      tax_rate_id:
                        $ref: '#/components/schemas/resource_expense/properties/tax_rate_id'
                      reimbursable:
                        $ref: '#/components/schemas/resource_expense/properties/reimbursable'
                      attachment_id:
                        $ref: '#/components/schemas/resource_expense/properties/attachment_id'
                      custom_fields:
                        $ref: '#/components/schemas/resource_expense/properties/custom_fields'
                      reimbursed_on:
                        $ref: '#/components/schemas/resource_expense/properties/reimbursed_on'
                      tax_inclusion:
                        $ref: '#/components/schemas/resource_expense/properties/tax_inclusion'
                      billable_amount:
                        $ref: '#/components/schemas/resource_expense/properties/billable_amount'
                      rejected_reason:
                        $ref: '#/components/schemas/resource_expense/properties/rejected_reason'
                      purchase_order_id:
                        $ref: '#/components/schemas/resource_expense/properties/purchase_order_id'
      description: Request body for creating or updating an expense.
    expense_copy:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - service_id
                      - template_id
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_expense/properties/name'
                      service_id:
                        $ref: '#/components/schemas/resource_expense/properties/service_id'
                      template_id:
                        type: integer
                        title: Template Expense
    expense_approve:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      note:
                        type: string
                        title: Note
                      approver_id:
                        $ref: '#/components/schemas/resource_expense/properties/approver_id'
  schemas:
    resource_expense:
      type: object
      title: Expense Resource
      properties:
        amount_with_tax_normalized:
          title: Amount With Tax Normalized
          description: Unit amount including tax in the budget currency.
          example:
            gt: 0
        deal_company_name:
          title: Deal Company Name
          description: Name of the client company associated with the expense's budget.
          example:
            eq: value
        total_amount_default:
          title: Total Amount Default
          description: Total cost (quantity × unit amount) before tax in the organization default currency.
          example:
            gt: 0
        paid_on_after:
          type: string
          title: Paid On After
          format: date
          description: Earliest date (exclusive) for querying expenses by paid_on.
          example:
            eq: value
        billable_amount:
          type: integer
          title: Billable Amount
          description: Amount to be billed to the client in the expense currency. Ignored if markup is sent in the same request — `markup` takes precedence and `billable_amount` is recalculated from it.
          example:
            gt: 0
        export_url:
          type: string
          title: Export Url
          description: URL to view this expense in the external accounting system.
          example:
            eq: value
        service_name:
          title: Service Name
          description: Name of the budget service this expense is allocated to.
          example:
            eq: value
        stage_type:
          enum:
            - 1
            - 2
          type: integer
          title: Stage Type
          description: Stage type of the budget this expense belongs to.
          example:
            eq: active
        id:
          type: integer
          title: Id
          description: Unique identifier of the expense.
          example:
            - 123
        deal_name:
          title: Deal Name
          description: Name of the budget this expense is charged to.
          example:
            eq: value
        deal_id:
          type: integer
          title: Deal
          description: ID of the budget or deal this expense is charged to.
          example:
            - 123
        assigned_approver_id:
          type: integer
          title: Assigned Approver
          description: ID of the person assigned as approver for this expense.
          example:
            - 123
        person_id:
          type: integer
          title: Person
          description: ID of the person the expense was incurred for.
          example:
            - 123
        service:
          title: Service
          description: The budget service this expense is allocated to.
          example:
            eq: value
        rejected_at:
          type: string
          title: Rejected At
          format: date-time
          description: Timestamp when the expense was rejected.
          example:
            gt: '2026-01-01'
        invoice_id:
          type: integer
          title: Invoice
          description: ID of the invoice this expense is attributed to.
          example:
            - 123
        amount_with_tax:
          title: Amount With Tax
          description: Unit amount including tax in the expense currency.
          example:
            gt: 0
        reimbursement:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Reimbursement
          description: Reimbursement details for this expense.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this expense belongs to.
          example:
            eq: value
        rejected_reason:
          type: string
          title: Rejected Reason
          description: Reason why the expense was rejected.
          example:
            eq: value
        approved_at:
          type: string
          title: Approved At
          format: date-time
          description: Date when the expense was approved.
          example:
            gt: '2026-01-01'
        amount_default:
          title: Amount Default
          description: Unit cost of the expense in the organization default currency.
          example:
            gt: 0
        deal_project_name:
          title: Deal Project Name
          description: Name of the project associated with the expense's budget.
          example:
            eq: value
        custom_field_people:
          title: Custom Field People
          description: People in person-type custom fields.
          example:
            eq: value
        pay_on_after:
          type: string
          title: Pay On After
          format: date
          description: Earliest date (exclusive) for querying expenses by pay_on.
          example:
            eq: value
        exported:
          title: Exported
          description: Whether the expense has been exported to external accounting software.
          example:
            eq: value
        attachment:
          title: Attachment
          description: Receipt or document attached to this expense.
          example:
            eq: value
        total_amount_with_tax:
          title: Total Amount With Tax
          description: Total amount including tax in the expense currency.
          example:
            gt: 0
        service_id:
          type: integer
          title: Service
