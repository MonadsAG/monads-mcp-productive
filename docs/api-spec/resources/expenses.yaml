openapi: 3.1.0
info:
  title: Productive.io API – Expenses
  version: 2.0.0
description: |-
  For an overview of expenses please refer to the [help article](https://help.productive.io/en/articles/9154726-expenses-admin-overview)
  Expenses in productive are additional costs related to your budgets and deals.
  An expense always belongs to a service which in turn always belongs to a budget or deal.
  An expense can also belong to a Purchase Order (when it's on a budget service), but that is not mandatory.

  Following diagram shows expenses in our data hierarchy:

  ```d2
  ...@template
  *: {
    class: default
  }

  # Define actors
  budget: Budget / Deal
  service: Service
  purchase_order: Purchase Order
  expense: Expense {
    class: primary
  }

  budget -> service -> expense
  budget -> purchase_order -> expense: {
    style: {
      stroke: black
      stroke-dash: 5
    }
  }
  ```

  Expenses support attachments and custom fields.
