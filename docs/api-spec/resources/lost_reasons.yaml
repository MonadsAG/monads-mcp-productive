openapi: 3.1.0
info:
  title: Productive.io API – Lost Reasons
  version: 2.0.0
description: |-
  **Lost reasons** are labels that explain why a deal was marked as lost in the CRM pipeline.

  Create and manage the set of available options for your organization. Attaching a lost reason to a closed deal helps track pipeline health and surface patterns in lost opportunities.
x-filters:
  lost_reason:
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/lost_reasons/{id}/archive:
    patch:
      tags:
        - Lost Reasons
      summary: Archives a lost reason
      responses:
        '200':
          $ref: '#/components/responses/single_lost_reason'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: lost_reasons-archive-archive
      description: Archive a lost reason.
  /api/v2/lost_reasons:
    get:
      tags:
        - Lost Reasons
      summary: Get lost reasons
      responses:
        '200':
          $ref: '#/components/responses/collection_lost_reason'
      parameters:
        - $ref: '#/components/parameters/filter_lost_reason'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_lost_reason'
      operationId: lost_reasons-index
      description: List lost reasons.
    post:
      tags:
        - Lost Reasons
      summary: Create a lost reason
      responses:
        '201':
          $ref: '#/components/responses/single_lost_reason'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: lost_reasons-create
      requestBody:
        $ref: '#/components/requestBodies/lost_reason'
      description: Create a new lost reason.
  /api/v2/lost_reasons/{id}:
    get:
      tags:
        - Lost Reasons
      summary: Gets a lost reason
      responses:
        '200':
          $ref: '#/components/responses/single_lost_reason'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: lost_reasons-show
      description: Retrieve a single lost reason.
    patch:
      tags:
        - Lost Reasons
      summary: Update a lost reason
      responses:
        '200':
          $ref: '#/components/responses/single_lost_reason'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: lost_reasons-update
      requestBody:
        $ref: '#/components/requestBodies/lost_reason'
      description: Update a lost reason.
components:
  requestBodies:
    lost_reason:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_lost_reason/properties/name'
      description: Request body for creating or updating a lost reason.
  schemas:
    resource_lost_reason:
      type: object
      title: Lost reason Resource
      properties:
        id:
          type: integer
          title: Id
          description: The unique identifier of this lost reason.
          example:
            - 123
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this lost reason was archived, or null if active.
          example:
            gt: '2026-01-01'
        organization:
          title: Organization
          description: The organization this lost reason belongs to.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: Label text displayed on the deal when marked as lost.
          example:
            eq: value
      description: A label explaining why a deal was lost, used for sales pipeline analytics.
      example:
        id: '3'
        type: lost_reasons
        attributes:
          name: Budget constraints
          position: 1
          archived_at: null
        relationships: {}
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_lost_reason:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort lost reason
      explode: false
      required: false
      description: Sort lost reason
    filter_lost_reason:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.lost_reason at the top of this file.
      required: false
      description: Filters
  responses:
    single_lost_reason:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_lost_reason/properties/name'
                      archived_at:
                        $ref: '#/components/schemas/resource_lost_reason/properties/archived_at'
                  relationships:
                    type: object
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single lost reason
    collection_lost_reason:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_lost_reason/properties/name'
                        archived_at:
                          $ref: '#/components/schemas/resource_lost_reason/properties/archived_at'
                    relationships:
                      type: object
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection lost reason
