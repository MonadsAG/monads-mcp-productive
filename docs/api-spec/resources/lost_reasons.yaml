openapi: 3.1.0
info:
  title: Productive.io API – Lost Reasons
  version: 2.0.0
description: |-
  **Lost reasons** are labels that explain why a deal was marked as lost in the CRM pipeline.

  Create and manage the set of available options for your organization. Attaching a lost reason to a closed deal helps track pipeline health and surface patterns in lost opportunities.
x-filters:
  lost_reason:
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/lost_reasons/{id}/archive:
    patch:
      tags:
        - Lost Reasons
      summary: Archives a lost reason
      operationId: lost_reasons-archive-archive
      description: Archive a lost reason.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_lost_reason'
  /api/v2/lost_reasons:
    get:
      tags:
        - Lost Reasons
      summary: Get lost reasons
      operationId: lost_reasons-index
      description: List lost reasons.
      parameters:
        - $ref: '#/components/parameters/sort_lost_reason'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_lost_reason'
      responses:
        '200':
          $ref: '#/components/responses/collection_lost_reason'
    post:
      tags:
        - Lost Reasons
      summary: Create a lost reason
      operationId: lost_reasons-create
      description: Create a new lost reason.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/lost_reason'
      responses:
        '201':
          $ref: '#/components/responses/single_lost_reason'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/lost_reasons/{id}:
    get:
      tags:
        - Lost Reasons
      summary: Gets a lost reason
      operationId: lost_reasons-show
      description: Retrieve a single lost reason.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_lost_reason'
    patch:
      tags:
        - Lost Reasons
      summary: Update a lost reason
      operationId: lost_reasons-update
      description: Update a lost reason.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/lost_reason'
      responses:
        '200':
          $ref: '#/components/responses/single_lost_reason'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
components:
  responses:
    single_lost_reason:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single lost reason record in JSON:API format.
            properties:
              data:
                type: object
                description: The lost reason resource object.
                properties:
                  attributes:
                    type: object
                    description: Lost reason attributes.
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_lost_reason/properties/name'
                      archived_at:
                        $ref: '#/components/schemas/resource_lost_reason/properties/archived_at'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Lost reason relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                id: '3'
                type: lost_reasons
                attributes:
                  name: Budget constraints
                  position: 1
                  archived_at: null
                relationships: {}
              included: []
      description: Single lost reason
    collection_lost_reason:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of lost reason records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A lost reason resource object.
                  properties:
                    relationships:
                      type: object
                      description: Lost reason relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                    attributes:
                      type: object
                      description: Lost reason attributes.
                      properties:
                        archived_at:
                          $ref: '#/components/schemas/resource_lost_reason/properties/archived_at'
                        name:
                          $ref: '#/components/schemas/resource_lost_reason/properties/name'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of lost reason resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '3'
                  type: lost_reasons
                  attributes:
                    name: Budget constraints
                    position: 1
                    archived_at: null
                  relationships: {}
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection lost reason
  schemas:
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    resource_lost_reason:
      type: object
      title: Lost reason Resource
      description: A label explaining why a deal was lost, used for sales pipeline analytics.
      properties:
        name:
          type: string
          title: Name
          description: Label text displayed on the deal when marked as lost.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: The unique identifier of this lost reason.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this lost reason belongs to.
          example:
            eq: value
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this lost reason was archived, or null if active.
          example:
            gt: '2026-01-01'
      example:
        id: '3'
        type: lost_reasons
        attributes:
          name: Budget constraints
          position: 1
          archived_at: null
        relationships: {}
  requestBodies:
    lost_reason:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body schema for a lost reason.
            properties:
              data:
                type: object
                description: The lost reason resource object.
                properties:
                  attributes:
                    type: object
                    description: Lost reason attributes.
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_lost_reason/properties/name'
                    required:
                      - name
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: lost_reasons
                attributes:
                  name: Budget constraints
                  position: 1
      description: Request body for creating or updating a lost reason.
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_lost_reason:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.lost_reason at the top of this file.
      required: false
      description: Filters
    sort_lost_reason:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort lost reason
      explode: false
      required: false
      description: Sort lost reason
