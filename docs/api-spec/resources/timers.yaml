            description: Paginated list of timer records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A timer resource object.
                  properties:
                    attributes:
                      type: object
                      description: Timer attributes.
                      properties:
                        person_id:
                          $ref: '#/components/schemas/resource_timer/properties/person_id'
