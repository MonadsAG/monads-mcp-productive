openapi: 3.1.0
info:
  title: Productive.io API – Timers
  version: 2.0.0
description: |-
  Timer is an object belonging to a Time Entry.

  Timer represents one time tracking sessions (on a time entry) and keeps track when a session was started and when it was stopped.

  Timer object gets created when a person starts a timer.

  Creating a Timer is possible (on API) providing either time_entry_id or service_id in parameters. 
  - When providing time_entry_id, a Timer object will be related to provided Time Entry. 
  - When providing service_id, new Time Entry belonging to provided Service will be created and a Timer will belong to it.

  ```d2
  ...@template
  # template cant import globs just yet
  *: {
    class: default
  }

  # Define actors
  service: Service
  task: Task
  time_entry: Time Entry
  timer: Timer {
    class: primary
  }

  # define connections
  service -> time_entry
  task -> time_entry: {
    style: {
      stroke-dash: 3
      multiple: true
    }
  }
  time_entry -> timer
  ```

  You can find out more about Timers in our [Help documentation] (https://help.productive.io/en/articles/3903111-timer)
x-filters:
  timer:
    person_id:
      description: Filter by the associated person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    started_at:
      description: Filter by the date the timer was started.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    stopped_at:
      description: Filter by the date the timer was stopped.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    time_entry_id:
      description: Filter by the associated time entry.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/timers:
    get:
      tags:
        - Timers
      summary: Get timers
      operationId: timers-index
      description: List all timers.
      parameters:
        - $ref: '#/components/parameters/filter_timer'
        - $ref: '#/components/parameters/sort_timer'
      responses:
        '200':
          $ref: '#/components/responses/collection_timer'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Timers
      summary: Create an timer
      operationId: timers-create
      description: Create a new timer.
      requestBody:
        $ref: '#/components/requestBodies/timer'
      responses:
        '201':
          $ref: '#/components/responses/single_timer'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_timer'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/timers/{id}:
    get:
      tags:
        - Timers
      summary: Gets a timer
      operationId: timers-show
      description: Retrieve a single timer by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_timer'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/timers/{id}/stop:
    patch:
      tags:
        - Timers
      summary: Stops a timer
      operationId: timers-stop-stop
      description: Stop a running timer.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_timer'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_timer'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
