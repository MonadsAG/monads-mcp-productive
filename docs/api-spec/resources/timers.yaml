openapi: 3.1.0
info:
  title: Productive.io API – Timers
  version: 2.0.0
description: |-
  Timer is an object belonging to a Time Entry.

  Timer represents one time tracking sessions (on a time entry) and keeps track when a session was started and when it was stopped.

  Timer object gets created when a person starts a timer.

  Creating a Timer is possible (on API) providing either time_entry_id or service_id in parameters. 
  - When providing time_entry_id, a Timer object will be related to provided Time Entry. 
  - When providing service_id, new Time Entry belonging to provided Service will be created and a Timer will belong to it.

  ```d2
  ...@template
  # template cant import globs just yet
  *: {
    class: default
  }

  # Define actors
  service: Service
  task: Task
  time_entry: Time Entry
  timer: Timer {
    class: primary
  }

  # define connections
  service -> time_entry
  task -> time_entry: {
    style: {
      stroke-dash: 3
      multiple: true
    }
  }
  time_entry -> timer
  ```

  You can find out more about Timers in our [Help documentation] (https://help.productive.io/en/articles/3903111-timer)
x-filters:
  timer:
    started_at:
      description: Filter by the date the timer was started.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    stopped_at:
      description: Filter by the date the timer was stopped.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter by the associated person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    time_entry_id:
      description: Filter by the associated time entry.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/timers:
    get:
      tags:
        - Timers
      summary: Get timers
      responses:
        '200':
          $ref: '#/components/responses/collection_timer'
      parameters:
        - $ref: '#/components/parameters/sort_timer'
        - $ref: '#/components/parameters/filter_timer'
        - $ref: '#/components/parameters/header_organization'
      operationId: timers-index
      description: List all timers.
    post:
      tags:
        - Timers
      summary: Create an timer
      responses:
        '201':
          $ref: '#/components/responses/single_timer'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: timers-create
      requestBody:
        $ref: '#/components/requestBodies/timer'
      description: Create a new timer.
  /api/v2/timers/{id}:
    get:
      tags:
        - Timers
      summary: Gets a timer
      responses:
        '200':
          $ref: '#/components/responses/single_timer'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: timers-show
      description: Retrieve a single timer by ID.
  /api/v2/timers/{id}/stop:
    patch:
      tags:
        - Timers
      summary: Stops a timer
      responses:
        '200':
          $ref: '#/components/responses/single_timer'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: timers-stop-stop
      description: Stop a running timer.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_timer:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.timer at the top of this file.
      required: false
      description: Filters
    sort_timer:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - started_at
            - -started_at
            - stopped_at
            - -stopped_at
          type: string
        title: Sort timer
      explode: false
      required: false
      description: Sort timer
  responses:
    single_timer:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      person_id:
                        $ref: '#/components/schemas/resource_timer/properties/person_id'
                      started_at:
                        $ref: '#/components/schemas/resource_timer/properties/started_at'
                      stopped_at:
                        $ref: '#/components/schemas/resource_timer/properties/stopped_at'
                      total_time:
                        $ref: '#/components/schemas/resource_timer/properties/total_time'
                  relationships:
                    type: object
                    properties:
                      time_entry:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single timer
    collection_timer:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        person_id:
                          $ref: '#/components/schemas/resource_timer/properties/person_id'
                        started_at:
                          $ref: '#/components/schemas/resource_timer/properties/started_at'
                        stopped_at:
                          $ref: '#/components/schemas/resource_timer/properties/stopped_at'
                        total_time:
                          $ref: '#/components/schemas/resource_timer/properties/total_time'
                    relationships:
                      type: object
                      properties:
                        time_entry:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection timer
  schemas:
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    resource_timer:
      type: object
      title: Timer Resource
      properties:
        service_id:
          type: integer
          title: Service
          description: The ID of the service this timer is tracking time for.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this timer belongs to.
          example:
            eq: value
        time_entry:
          title: Time Entry
          description: The time entry created when this timer was stopped.
          example:
            gt: 0
        stopped_at:
          type: string
          title: Stopped At
          format: date-time
          description: Timestamp when the timer was stopped, or null if still running.
          example:
            gt: '2026-01-01'
        total_time:
          type: integer
          title: Total Time
          description: The total elapsed time of the timer in minutes.
          example:
            gt: 0
        time_entry_id:
          type: integer
          title: Time Entry
          description: The ID of the time entry created when this timer was stopped.
          example:
            - 123
        person_id:
          type: integer
          title: Person
          description: The ID of the person who owns this timer.
          example:
            - 123
        started_at:
          type: string
          title: Started At
          format: date-time
          description: Timestamp when the timer was started.
          example:
            gt: '2026-01-01'
      description: An active stopwatch session linked to a time entry. The timer duration is saved to the time entry when stopped.
      example:
        id: '123'
        type: timers
        attributes:
          started_at: '2026-01-15T09:00:00Z'
          running: true
          elapsed_seconds: 3600
        relationships:
          time_entry:
            data:
              type: time_entries
              id: '789'
  requestBodies:
    timer:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      person_id:
                        $ref: '#/components/schemas/resource_timer/properties/person_id'
                      service_id:
                        $ref: '#/components/schemas/resource_timer/properties/service_id'
                      started_at:
                        $ref: '#/components/schemas/resource_timer/properties/started_at'
                      time_entry_id:
                        $ref: '#/components/schemas/resource_timer/properties/time_entry_id'
      description: Request body for creating or updating a timer.
