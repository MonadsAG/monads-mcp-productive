    single_payment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single payment record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned payment resource.
                properties:
                  attributes:
                    type: object
                    description: Payment attributes.
                    properties:
                      amount:
                        $ref: '#/components/schemas/resource_payment/properties/amount'
                      amount_default:
                        $ref: '#/components/schemas/resource_payment/properties/amount_default'
                      amount_normalized:
                        $ref: '#/components/schemas/resource_payment/properties/amount_normalized'
                      currency:
                        $ref: '#/components/schemas/resource_payment/properties/currency'
                      currency_default:
                        $ref: '#/components/schemas/resource_payment/properties/currency_default'
                      currency_normalized:
                        $ref: '#/components/schemas/resource_payment/properties/currency_normalized'
                      external_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_payment/properties/external_id'
                          - type: 'null'
                        description: An external reference ID for the payment (e.g. from a payment processor).
                      note:
                        anyOf:
                          - $ref: '#/components/schemas/resource_payment/properties/note'
                          - type: 'null'
                        description: An optional note or memo for this payment.
                      paid_on:
                        anyOf:
                          - $ref: '#/components/schemas/resource_payment/properties/paid_on'
                          - type: 'null'
                        description: The date when the payment was received.
                      written_off_on:
                        anyOf:
                          - $ref: '#/components/schemas/resource_payment/properties/written_off_on'
                          - type: 'null'
                        description: The date when the invoice amount was written off as uncollectable.
                    example:
                      paid_on: '2026-03-15'
                      written_off_on: null
                      note: 'Wire transfer ref: WT-9281'
                      external_id: xero-pay-456
                      currency: GBP
                      currency_default: EUR
                      currency_normalized: GBP
                      amount: 200000
                      amount_default: 232000
                      amount_normalized: 200000
                  relationships:
                    type: object
                    description: Payment relationships.
                    properties:
                      invoice:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      organization:
                        data:
                          type: organizations
                          id: '109'
                      invoice:
                        data:
                          type: invoices
                          id: '789012'
                example:
                  type: payments
                  id: '345678'
                  attributes:
                    paid_on: '2026-03-15'
                    written_off_on: null
                    note: 'Wire transfer ref: WT-9281'
                    external_id: xero-pay-456
                    currency: GBP
                    currency_default: EUR
                    currency_normalized: GBP
                    amount: 200000
                    amount_default: 232000
                    amount_normalized: 200000
                  relationships:
                    organization:
                      data:
                        type: organizations
                        id: '109'
                    invoice:
                      data:
                        type: invoices
                        id: '789012'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    type: invoices
                    id: '789012'
                    attributes:
                      number: INV-2026-042
                      issued_on: '2026-02-28'
                description: Sideloaded related resources.
                example:
                  - type: invoices
                    id: '789012'
                    attributes:
                      number: INV-2026-042
                      issued_on: '2026-02-28'
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '67'
                type: payments
                attributes:
                  amount: '5000.00'
                  currency: USD
                  paid_on: '2026-03-10'
                  note: null
                  created_at: '2026-03-10T12:00:00.000+00:00'
                relationships:
                  invoice:
                    data:
                      type: invoices
                      id: '234'
              included: []
      description: Single payment
    collection_payment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of payment records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A payment resource object.
                  properties:
                    attributes:
                      type: object
                      description: Payment attributes.
                      properties:
                        amount:
                          $ref: '#/components/schemas/resource_payment/properties/amount'
                        amount_default:
                          $ref: '#/components/schemas/resource_payment/properties/amount_default'
                        amount_normalized:
                          $ref: '#/components/schemas/resource_payment/properties/amount_normalized'
                        currency:
                          $ref: '#/components/schemas/resource_payment/properties/currency'
                        currency_default:
                          $ref: '#/components/schemas/resource_payment/properties/currency_default'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_payment/properties/currency_normalized'
                        external_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_payment/properties/external_id'
                            - type: 'null'
                          description: External system identifier for this payment.
                        note:
                          anyOf:
                            - $ref: '#/components/schemas/resource_payment/properties/note'
                            - type: 'null'
                          description: Internal note about this payment.
                        paid_on:
                          anyOf:
                            - $ref: '#/components/schemas/resource_payment/properties/paid_on'
                            - type: 'null'
                          description: The date the payment was received.
                        written_off_on:
                          anyOf:
                            - $ref: '#/components/schemas/resource_payment/properties/written_off_on'
                            - type: 'null'
                          description: The date the invoice amount was written off as uncollectable.
                      example:
                        paid_on: '2026-03-15'
                        written_off_on: null
                        note: 'Wire transfer ref: WT-9281'
                        external_id: xero-pay-456
                        currency: GBP
                        currency_default: EUR
                        currency_normalized: GBP
                        amount: 200000
                        amount_default: 232000
                        amount_normalized: 200000
                    relationships:
                      type: object
                      description: Payment relationships.
                      properties:
                        invoice:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        organization:
                          data:
                            type: organizations
                            id: '109'
                        invoice:
                          data:
                            type: invoices
                            id: '789012'
                  example:
                    type: payments
                    id: '345678'
                    attributes:
                      paid_on: '2026-03-15'
                      written_off_on: null
                      note: 'Wire transfer ref: WT-9281'
                      external_id: xero-pay-456
                      currency: GBP
                      currency_default: EUR
                      currency_normalized: GBP
                      amount: 200000
                      amount_default: 232000
                      amount_normalized: 200000
                    relationships:
                      organization:
                        data:
                          type: organizations
                          id: '109'
                      invoice:
                        data:
                          type: invoices
                          id: '789012'
                description: Array of payment resource objects.
                example:
                  - type: payments
                    id: '345678'
                    attributes:
                      paid_on: '2026-03-15'
                      written_off_on: null
                      note: 'Wire transfer ref: WT-9281'
                      external_id: xero-pay-456
                      currency: GBP
                      currency_default: EUR
                      currency_normalized: GBP
                      amount: 200000
                      amount_default: 232000
                      amount_normalized: 200000
                    relationships:
                      organization:
                        data:
                          type: organizations
                          id: '109'
                      invoice:
                        data:
                          type: invoices
                          id: '789012'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    type: invoices
                    id: '789012'
                    attributes:
                      number: INV-2026-042
                      issued_on: '2026-02-28'
                description: Sideloaded related resources.
                example:
                  - type: invoices
                    id: '789012'
                    attributes:
                      number: INV-2026-042
                      issued_on: '2026-02-28'
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '67'
                  type: payments
                  attributes:
                    amount: '5000.00'
                    currency: USD
                    paid_on: '2026-03-10'
                    note: null
                    created_at: '2026-03-10T12:00:00.000+00:00'
                  relationships:
                    invoice:
                      data:
                        type: invoices
                        id: '234'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection payment
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
