openapi: 3.1.0
info:
  title: Productive.io API – Payments
  version: 2.0.0
description: |-
  The Payment object represents an invoice payment in invoicing system.

  You can find out more about payments in our Help documentation: [Recording Payments](https://help.productive.io/en/articles/2179635-recording-payments).

  Following diagram shows payments in our data hierarchy:

  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  invoice: Invoice
  payment1: Payment {
    class: primary
  }
  payment2: Payment {
    class: primary
  }

  invoice -> payment1
  invoice -> payment2
  ```
x-filters:
  payment:
    invoice_id:
      description: Filter by the associated invoice.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Search payments by invoice number or related text.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by client company (via the associated invoice).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    paid_after:
      description: Filter payments made on or after this date (`paid_on`).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_id:
      description: Filter by the associated budget or deal.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    written_off_on:
      description: Filter by write-off date range (`written_off_on`).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    paid_before:
      description: Filter payments made on or before this date (`paid_on`).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    paid_on:
      description: Filter by payment date range (`paid_on`).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    external_id:
      description: Filter by external payment ID from an integrated system.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    number:
      description: Filter by the invoice number associated with the payment.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter by the associated subsidiary (via the invoice).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by payment ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    amount:
      description: Filter by payment amount range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/payments:
    get:
      tags:
        - Payments
      summary: Get payments
      operationId: payments-index
      description: List all payments.
      parameters:
        - $ref: '#/components/parameters/filter_payment'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_payment'
      responses:
        '200':
          $ref: '#/components/responses/collection_payment'
    post:
      tags:
        - Payments
      summary: Create a payment
      operationId: payments-create
      description: Create a new payment.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/payment'
      responses:
        '201':
          $ref: '#/components/responses/single_payment'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/payments/{id}:
    get:
      tags:
        - Payments
      summary: Gets a payment
      operationId: payments-show
      description: Retrieve a single payment by ID.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_payment'
    patch:
      tags:
        - Payments
      summary: Update a payment
      operationId: payments-update
      description: Update a payment.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/payment'
      responses:
        '200':
          $ref: '#/components/responses/single_payment'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
    delete:
      tags:
        - Payments
      summary: Deletes a payment
      operationId: payments-destroy
      description: Delete a payment by ID.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_payment:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - amount
            - -amount
            - date
            - -date
            - invoice_number
            - -invoice_number
            - note
            - -note
            - paid_on
            - -paid_on
            - written_off_on
            - -written_off_on
          type: string
        title: Sort payment
      explode: false
      required: false
      description: Sort payment
    filter_payment:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.payment at the top of this file.
      required: false
      description: Filters
  responses:
    single_payment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single payment record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned payment resource.
                properties:
                  attributes:
                    type: object
                    description: Payment attributes.
                    properties:
                      paid_on:
                        $ref: '#/components/schemas/resource_payment/properties/paid_on'
                      amount_normalized:
                        $ref: '#/components/schemas/resource_payment/properties/amount_normalized'
                      currency_default:
                        $ref: '#/components/schemas/resource_payment/properties/currency_default'
                      note:
                        $ref: '#/components/schemas/resource_payment/properties/note'
                      amount:
                        $ref: '#/components/schemas/resource_payment/properties/amount'
                      amount_default:
                        $ref: '#/components/schemas/resource_payment/properties/amount_default'
                      currency:
                        $ref: '#/components/schemas/resource_payment/properties/currency'
                      external_id:
                        $ref: '#/components/schemas/resource_payment/properties/external_id'
                      written_off_on:
                        $ref: '#/components/schemas/resource_payment/properties/written_off_on'
                      currency_normalized:
                        $ref: '#/components/schemas/resource_payment/properties/currency_normalized'
                    example:
                      paid_on: '2026-03-15'
                      written_off_on: null
                      note: 'Wire transfer ref: WT-9281'
                      external_id: xero-pay-456
                      currency: GBP
                      currency_default: EUR
                      currency_normalized: GBP
                      amount: 200000
                      amount_default: 232000
                      amount_normalized: 200000
                  relationships:
                    type: object
                    description: Payment relationships.
                    properties:
                      invoice:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      organization:
                        data:
                          type: organizations
                          id: '109'
                      invoice:
                        data:
                          type: invoices
                          id: '789012'
                example:
                  type: payments
                  id: '345678'
                  attributes:
                    paid_on: '2026-03-15'
                    written_off_on: null
                    note: 'Wire transfer ref: WT-9281'
                    external_id: xero-pay-456
                    currency: GBP
                    currency_default: EUR
                    currency_normalized: GBP
                    amount: 200000
                    amount_default: 232000
                    amount_normalized: 200000
                  relationships:
                    organization:
                      data:
                        type: organizations
                        id: '109'
                    invoice:
                      data:
                        type: invoices
                        id: '789012'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    type: invoices
                    id: '789012'
                    attributes:
                      number: INV-2026-042
                      issued_on: '2026-02-28'
                description: Sideloaded related resources.
                example:
                  - type: invoices
                    id: '789012'
                    attributes:
                      number: INV-2026-042
                      issued_on: '2026-02-28'
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '67'
                type: payments
                attributes:
                  amount: '5000.00'
                  currency: USD
                  paid_on: '2026-03-10'
                  note: null
                  created_at: '2026-03-10T12:00:00.000+00:00'
                relationships:
                  invoice:
                    data:
                      type: invoices
                      id: '234'
              included: []
      description: Single payment
    collection_payment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of payment records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A payment resource object.
                  properties:
                    relationships:
                      type: object
                      description: Payment relationships.
                      properties:
                        invoice:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        organization:
                          data:
                            type: organizations
                            id: '109'
                        invoice:
                          data:
                            type: invoices
                            id: '789012'
                    attributes:
                      type: object
                      description: Payment attributes.
                      properties:
                        amount_normalized:
                          $ref: '#/components/schemas/resource_payment/properties/amount_normalized'
                        paid_on:
                          $ref: '#/components/schemas/resource_payment/properties/paid_on'
                        written_off_on:
                          $ref: '#/components/schemas/resource_payment/properties/written_off_on'
                        currency_default:
                          $ref: '#/components/schemas/resource_payment/properties/currency_default'
                        amount_default:
                          $ref: '#/components/schemas/resource_payment/properties/amount_default'
                        external_id:
                          $ref: '#/components/schemas/resource_payment/properties/external_id'
                        currency:
                          $ref: '#/components/schemas/resource_payment/properties/currency'
                        note:
                          $ref: '#/components/schemas/resource_payment/properties/note'
                        amount:
                          $ref: '#/components/schemas/resource_payment/properties/amount'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_payment/properties/currency_normalized'
                      example:
                        paid_on: '2026-03-15'
                        written_off_on: null
                        note: 'Wire transfer ref: WT-9281'
                        external_id: xero-pay-456
                        currency: GBP
                        currency_default: EUR
                        currency_normalized: GBP
                        amount: 200000
                        amount_default: 232000
                        amount_normalized: 200000
                  example:
                    type: payments
                    id: '345678'
                    attributes:
                      paid_on: '2026-03-15'
                      written_off_on: null
                      note: 'Wire transfer ref: WT-9281'
                      external_id: xero-pay-456
                      currency: GBP
                      currency_default: EUR
                      currency_normalized: GBP
                      amount: 200000
                      amount_default: 232000
                      amount_normalized: 200000
                    relationships:
                      organization:
                        data:
                          type: organizations
                          id: '109'
                      invoice:
                        data:
                          type: invoices
                          id: '789012'
                description: Array of payment resource objects.
                example:
                  - type: payments
                    id: '345678'
                    attributes:
                      paid_on: '2026-03-15'
                      written_off_on: null
                      note: 'Wire transfer ref: WT-9281'
                      external_id: xero-pay-456
                      currency: GBP
                      currency_default: EUR
                      currency_normalized: GBP
                      amount: 200000
                      amount_default: 232000
                      amount_normalized: 200000
                    relationships:
                      organization:
                        data:
                          type: organizations
                          id: '109'
                      invoice:
                        data:
                          type: invoices
                          id: '789012'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    type: invoices
                    id: '789012'
                    attributes:
                      number: INV-2026-042
                      issued_on: '2026-02-28'
                description: Sideloaded related resources.
                example:
                  - type: invoices
                    id: '789012'
                    attributes:
                      number: INV-2026-042
                      issued_on: '2026-02-28'
            example:
              data:
                - id: '67'
                  type: payments
                  attributes:
                    amount: '5000.00'
                    currency: USD
                    paid_on: '2026-03-10'
                    note: null
                    created_at: '2026-03-10T12:00:00.000+00:00'
                  relationships:
                    invoice:
                      data:
                        type: invoices
                        id: '234'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection payment
  schemas:
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    resource_payment:
      type: object
      title: Payment Resource
      description: A payment record representing an amount received against an invoice, internally referred to as an InvoicePayment.
      properties:
        invoice_number:
          title: Invoice Number
          description: The invoice number of the associated invoice at the time this payment was recorded.
          example: INV-2026-042
        number:
          type: string
          title: Number
          description: The auto-generated sequence number for this payment.
          example: PAY-2026-015
        subsidiary_id:
          type: integer
          title: Subsidiary
          description: ID of the subsidiary associated with the invoice this payment was applied to.
          example: 234
        invoice:
          title: Invoice
          description: The invoice this payment was applied to.
          example:
            data:
              type: invoices
              id: '789012'
        written_off_on:
          type: string
          title: Written Off On
          format: date
          description: Date when this payment was written off as uncollectable, or null if the payment is not written off.
          example: null
        amount:
          type: integer
          title: Amount
          description: The payment amount in the invoice's currency.
          example: 200000
        invoice_id:
          type: integer
          title: Invoice
          description: ID of the invoice this payment was applied to.
          example: 789012
        query:
          type: string
          title: Query
          description: A full-text search query to filter payments by invoice number or note.
          example: INV-2026
        project_id:
          type: integer
          title: Project
          description: ID of the project associated with the invoice this payment was applied to.
          example: 567890
        organization:
          title: Organization
          description: The organization this payment belongs to.
          example:
            data:
              type: organizations
              id: '109'
        paid_before:
          type: string
          title: Paid Before
          format: date
          description: Filter for payments made before this date (used as a filter parameter).
          example: '2026-03-31'
        id:
          type: integer
          title: Id
          description: Unique identifier of this payment.
          example: 345678
        budget_id:
          type: integer
          title: Budget
          description: ID of the budget (deal) associated with the invoice this payment was applied to.
          example: 456789
        amount_default:
          title: Amount Default
          description: The payment amount converted to the organization's default currency.
          example: 232000
        note:
          type: string
          title: Note
          description: An optional note or memo about this payment.
          example: 'Wire transfer ref: WT-9281'
        external_id:
          type: string
          title: External
          description: An external identifier for this payment, used when syncing with third-party accounting systems.
          example: xero-pay-456
        date:
          title: Date
          description: Date when the payment was recorded.
          example: '2026-03-15'
        amount_normalized:
          title: Amount Normalized
          description: The payment amount converted to the normalized (reporting) currency.
          example: 200000
        paid_after:
          type: string
          title: Paid After
          format: date
          description: Filter for payments made after this date (used as a filter parameter).
          example: '2026-03-01'
        paid_on:
          type: string
          title: Paid On
          format: date
          description: Date when the payment was received (paid).
          example: '2026-03-15'
        company_id:
          type: integer
          title: Company
          description: ID of the company (client) on the invoice this payment was applied to.
          example: 234567
        currency:
          title: Currency
          description: The currency of this payment, inherited from the associated invoice.
          example: GBP
        currency_default:
          title: Currency Default
          description: The organization's default currency for this payment.
          example: EUR
        currency_normalized:
          title: Currency Normalized
          description: The normalized (reporting) currency for this payment.
          example: GBP
      example:
        id: '67'
        type: payments
        attributes:
          amount: '5000.00'
          currency: USD
          paid_on: '2026-03-10'
          note: null
          created_at: '2026-03-10T12:00:00.000+00:00'
        relationships:
          invoice:
            data:
              type: invoices
              id: '234'
  requestBodies:
    payment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body schema for a payment.
            properties:
              data:
                type: object
                description: The JSON:API data object containing the payment resource attributes and relationships.
                properties:
                  attributes:
                    type: object
                    description: Payment attributes.
                    properties:
                      written_off_on:
                        $ref: '#/components/schemas/resource_payment/properties/written_off_on'
                      invoice_id:
                        $ref: '#/components/schemas/resource_payment/properties/invoice_id'
                      note:
                        $ref: '#/components/schemas/resource_payment/properties/note'
                      amount:
                        $ref: '#/components/schemas/resource_payment/properties/amount'
                      paid_on:
                        $ref: '#/components/schemas/resource_payment/properties/paid_on'
                    required:
                      - invoice_id
                      - amount
                    example:
                      invoice_id: 789012
                      amount: 250000
                      paid_on: '2026-03-15'
                      written_off_on: '2026-03-20'
                      note: 'Wire transfer ref: WT-9281'
                example:
                  type: payments
                  attributes:
                    invoice_id: 789012
                    amount: 250000
                    paid_on: '2026-03-15'
                    written_off_on: '2026-03-20'
                    note: 'Wire transfer ref: WT-9281'
            example:
              data:
                type: payments
                attributes:
                  invoice_id: 789012
                  amount: 250000
                  paid_on: '2026-03-15'
                  written_off_on: '2026-03-20'
                  note: 'Wire transfer ref: WT-9281'
        application/vnd.api+json; ext=bulk:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      enum:
                        - payments
                      type: string
                    attributes:
                      type: object
                  required:
                    - type
                    - attributes
                maxItems: 100
      description: Request body for creating or updating a payment.
