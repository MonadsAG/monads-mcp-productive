openapi: 3.1.0
info:
  title: Productive.io API – Signups
  version: 2.0.0
paths:
  /api/v2/signups/{id}/authenticated_finalize:
    post:
      tags:
        - Signups
      summary: Finalize a signup for the signed-in user
      operationId: signups-authenticated_finalize
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        $ref: '#/components/requestBodies/signup_finalize'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_signup'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/signups:
    post:
      tags:
        - Signups
      summary: Create a signup
      security: []
      operationId: signups-create
      parameters:
        - in: query
          name: public_email
          schema:
            type: string
          required: false
      requestBody:
        $ref: '#/components/requestBodies/signup'
      responses:
        '200':
          $ref: '#/components/responses/single_signup'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_signup'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/signups/{id}/finalize:
    post:
      tags:
        - Signups
      summary: Finalize a signup
      security: []
      operationId: signups-finalize
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - in: query
          name: test_account
          schema:
            type: string
          required: false
        - in: query
          name: captcha_token
          schema:
            type: string
          required: false
      requestBody:
        $ref: '#/components/requestBodies/signup_finalize'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_signup'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/signups/unsubscribe:
    post:
      tags:
        - Signups
      summary: Unsubscribe a signup from reminder emails
      security: []
      operationId: signups-unsubscribe
      parameters:
        - in: query
          name: unsubscribe_token
          schema:
            type: string
          required: true
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_signup'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/signups/{id}/verify:
    post:
      tags:
        - Signups
      summary: Verify a signup's email
      security: []
      operationId: signups-verify
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        $ref: '#/components/requestBodies/signup_verify'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_signup'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/signups/xero_connect:
    get:
      tags:
        - Signups
      summary: Redirect to the Xero sign-in for a signup
      security: []
      operationId: signups-xero_connect
      responses:
        '302':
          description: Redirect
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/signups/xero_finalize:
    get:
      tags:
        - Signups
      summary: Finalize a signup from the Xero callback
      security: []
      operationId: signups-xero_finalize
      parameters:
        - in: query
          name: code
          schema:
            type: string
          required: true
      responses:
        '302':
          description: Redirect
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_signup'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content_signup:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_signup'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    single_signup:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      blocked:
                        $ref: '#/components/schemas/resource_signup/properties/blocked'
                      country:
                        anyOf:
                          - $ref: '#/components/schemas/resource_signup/properties/country'
                          - type: 'null'
                      email:
                        $ref: '#/components/schemas/resource_signup/properties/email'
                      ip:
                        anyOf:
                          - $ref: '#/components/schemas/resource_signup/properties/ip'
                          - type: 'null'
                      time_zone:
                        anyOf:
                          - $ref: '#/components/schemas/resource_signup/properties/time_zone'
                          - type: 'null'
                      user:
                        $ref: '#/components/schemas/resource_signup/properties/user'
                      verified_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_signup/properties/verified_at'
                          - type: 'null'
              included:
                type: array
                items: {}
              meta:
                $ref: '#/components/schemas/_meta'
      description: Single signup
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_signup:
      enum:
        - bad_decimal_format
        - email_already_verified
        - email_domain_invalid
        - email_invalid
        - invalid_attribute
        - invalid_attribute_value
        - non_finite_number
        - null_bytes_in_params
        - verification_code_invalid
      type: string
      title: Error Code
      description: Every error `code` the signups endpoints can return.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_forbidden:
      enum:
        - access_denied
        - account_inactive
        - agent_role_impersonation_denied
        - automatic_invoicing_not_manageable
        - billing_catalog_list_unavailable
        - booking_conflict_resolver_unavailable
        - budget_inaccessible
        - budgets_not_manageable
        - cascade_deletion_blocked
        - custom_roles_unavailable
        - deactivated_organization
        - deal_proposal_analytics_unavailable
        - deal_proposal_public_link_unavailable
        - document_styler_unavailable
        - document_templates_unavailable
        - email_inbox_unavailable
        - entry_not_editable
        - expense_not_editable
        - feature_unavailable
        - finalized_invoice_permission
        - financials_unavailable
        - impersonation_on_account_not_allowed
        - insufficient_automation_permission
        - insufficient_project_access
        - insufficient_seats
        - invalid_impersonate_role_id_header
        - invoices_unavailable
        - login_unavailable
        - mcp_access_disabled
        - mcp_connectors_disabled
        - mcp_provider_unavailable
        - missing_slack_integration
        - no_client_access
        - no_organization_id
        - no_person
        - no_sandbox_access
        - organization_red_flagged
        - other_timer_running
        - outgoing_emails_limit_exceeded
        - payment_reminders_unavailable
        - personal_access_token_limit_exceeded
        - pipelines_limit_exceeded
        - placeholders_limit_exceeded
        - plan_limit_exceeded
        - plan_unavailable
        - private_channel_forbidden
        - recipients_limit_exceeded
        - record_not_owned
        - report_templates_unavailable
        - restricted_email_in_trialing
        - role_bill_rate_unavailable
        - role_impersonate_denied
        - select_organization
        - service_inaccessible
        - service_type_inaccessible
        - single_sign_on_invalid
        - single_sign_on_login_only
        - single_sign_on_provision_failed
        - single_sign_on_unavailable
        - subscription_expired
        - subsidiaries_unavailable
        - subsidiary_out_of_scope
        - teams_limit_exceeded
        - two_factor_login
        - unallocated_expense_inaccessible
        - webooks_limit_exceeded
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 403.
    error_code_unauthorized:
      enum:
        - invalid_auth_token
        - invalid_password
        - invalid_proposal_token
        - invalid_token_signature
        - token_expired
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 401.
    error_code_bad_request:
      enum:
        - account_owner_missing
        - authorization_failure
        - bad_filter_request
        - bad_request
        - bad_sort_request
        - budget_report_failed
        - bulk_export_failed
        - calendar_reauthorization_required
        - changed_since_conflict
        - changed_since_invalid
        - changed_since_unsupported
        - company_export_match_changed
        - company_not_exported
        - cross_invoice_bulk
        - data_not_array
        - datev_request_failed
        - datev_token_refresh_failed
        - datev_token_refresh_locked
        - einvoice_export_failed
        - empty_body
        - exchange_currency_invalid
        - exchange_date_invalid
        - export_error
        - export_failed
        - export_status_unavailable
        - fields_request_invalid
        - formulas_request_invalid
        - group_custom_field_unsupported
        - group_param_relationship_unsupported
        - group_request_invalid
        - include_request_invalid
        - integration_error
        - invalid_request_parameters
        - invalid_seats_allocations
        - json_format_invalid
        - keyset_conflict
        - keyset_invalid_cursor
        - keyset_unsupported_sort
        - missing_date_period
        - missing_relationship_field
        - multipart_body_invalid
        - netsuite_credit_note_form_missing
        - netsuite_discount_amount_missing
        - netsuite_discount_item_missing
        - parameter_missing
        - peppol_transaction_failed
        - query_parameters_invalid
        - relationship_depth_unsupported
        - report_keyset_requires_single_type
        - report_keyset_restricted_access
        - report_keyset_unsupported_filter
        - report_keyset_unsupported_group
        - sort_custom_field_unsupported
        - sort_param_relationship_unsupported
        - sort_param_unsupported
        - tax_id_unsupported
        - unsupported_currency
        - unsupported_date_period
        - unsupported_filter
        - unsupported_filter_level
        - unsupported_filter_operation
        - unsupported_filter_value
        - unsupported_filter_value_type
        - unsupported_formula
        - unsupported_formula_component
        - unsupported_formula_operator
        - unsupported_group
        - unsupported_group_param
        - unsupported_include
        - unsupported_number_of_group_params
        - unsupported_sort
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 400.
    error_code_unsupported_media_type:
      enum:
        - unsupported_content_type
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 415.
    error_code_not_found:
      enum:
        - not_found
        - record_not_found
        - route_not_found
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 404.
    resource_signup:
      type: object
      title: Signup Resource
      properties:
        blocked:
          type: boolean
          title: Blocked
        code:
          type: string
          title: Code
        company_name:
          type: string
          title: Company Name
        country:
          type: string
          title: Country
        currency:
          type: string
          title: Currency
        email:
          type: string
          title: Email
        first_name:
          type: string
          title: First Name
        ip:
          type: string
          title: Ip
        last_name:
          type: string
          title: Last Name
        locale:
          type: string
          title: Locale
        password:
          type: string
          title: Password
        phone:
          type: string
          title: Phone
        plan_cycle:
          type: string
          title: Plan Cycle
        plan_type:
          type: string
          title: Plan Type
        time_zone:
          type: string
          title: Time Zone
        user:
          type: boolean
          title: User
          description: Whether a user with the signup's email already exists
        verified_at:
          type: string
          title: Verified At
          format: date-time
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
