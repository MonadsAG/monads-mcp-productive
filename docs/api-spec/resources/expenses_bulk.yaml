                            - type: 'null'
                          description: Company reference ID in the external accounting system.
                        created_at:
                          $ref: '#/components/schemas/resource_expense/properties/created_at'
                        currency:
                          $ref: '#/components/schemas/resource_expense/properties/currency'
                        currency_default:
                          $ref: '#/components/schemas/resource_expense/properties/currency_default'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_expense/properties/currency_normalized'
                        custom_fields:
                          anyOf:
                            - $ref: '#/components/schemas/resource_expense/properties/custom_fields'
                            - type: 'null'
                          description: Custom field values.
                        date:
                          $ref: '#/components/schemas/resource_expense/properties/date'
                        deleted_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_expense/properties/deleted_at'
                            - type: 'null'
                          description: Soft-deletion timestamp.
                        draft:
                          $ref: '#/components/schemas/resource_expense/properties/draft'
                        exchange_date:
                          $ref: '#/components/schemas/resource_expense/properties/exchange_date'
                        exchange_rate:
                          anyOf:
                            - $ref: '#/components/schemas/resource_expense/properties/exchange_rate'
                            - type: string
                          description: Exchange rate from expense currency to organization default currency.
                        exchange_rate_normalized:
                          anyOf:
                            - $ref: '#/components/schemas/resource_expense/properties/exchange_rate_normalized'
                            - type: string
                          description: Exchange rate from expense currency to budget currency.
                        export_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_expense/properties/export_id'
                            - type: 'null'
                          description: ID in the external accounting system.
                        export_integration_type_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_expense/properties/export_integration_type_id'
                            - type: 'null'
                          description: Type of accounting integration used for export.
                        export_url:
                          anyOf:
                            - $ref: '#/components/schemas/resource_expense/properties/export_url'
                            - type: 'null'
                          description: URL to view this expense in the external accounting system.
                        exported:
                          $ref: '#/components/schemas/resource_expense/properties/exported'
                        exported_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_expense/properties/exported_at'
