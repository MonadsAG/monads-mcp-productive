                          description: Timestamp when the expense was exported.
                        external_payment_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_expense/properties/external_payment_id'
                            - type: 'null'
                          description: Payment ID in external payment system.
                        invoiced:
                          $ref: '#/components/schemas/resource_expense/properties/invoiced'
                        line_items_count:
                          $ref: '#/components/schemas/resource_expense/properties/line_items_count'
                        name:
                          $ref: '#/components/schemas/resource_expense/properties/name'
                        paid_on:
                          anyOf:
                            - $ref: '#/components/schemas/resource_expense/properties/paid_on'
                            - type: 'null'
                          description: Date when the expense was actually paid.
