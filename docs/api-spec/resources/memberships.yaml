    dynamic_group_id:
      description: Filter by the associated dynamic group.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/memberships:
    get:
      tags:
        - Memberships
      summary: Get memberships
      responses:
        '200':
          $ref: '#/components/responses/collection_membership'
      parameters:
        - $ref: '#/components/parameters/sort_membership'
        - $ref: '#/components/parameters/filter_membership'
        - $ref: '#/components/parameters/header_organization'
      operationId: memberships-index
      description: List memberships.
    post:
      tags:
        - Memberships
      summary: Create a membership
      responses:
        '201':
          $ref: '#/components/responses/single_membership'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: memberships-create
      requestBody:
        $ref: '#/components/requestBodies/membership'
      description: Create a new membership.
  /api/v2/memberships/{id}:
    get:
      tags:
        - Memberships
      summary: Gets a membership
      responses:
        '200':
          $ref: '#/components/responses/single_membership'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: memberships-show
      description: Retrieve a single membership.
    patch:
      tags:
        - Memberships
      summary: Update a membership
      responses:
        '200':
          $ref: '#/components/responses/single_membership'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: memberships-update
      requestBody:
        $ref: '#/components/requestBodies/membership'
      description: Update a membership.
    delete:
      tags:
        - Memberships
      summary: Deletes a membership
      responses:
        '204':
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: memberships-destroy
      description: Delete a membership.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_membership:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.membership at the top of this file.
      required: false
      description: Filters
    sort_membership:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort membership
      explode: false
      required: false
      description: Sort membership
  requestBodies:
    membership:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      deal_id:
                        $ref: '#/components/schemas/resource_membership/properties/deal_id'
                      page_id:
                        $ref: '#/components/schemas/resource_membership/properties/page_id'
                      agent_id:
                        $ref: '#/components/schemas/resource_membership/properties/agent_id'
                      pulse_id:
                        $ref: '#/components/schemas/resource_membership/properties/pulse_id'
                      filter_id:
                        $ref: '#/components/schemas/resource_membership/properties/filter_id'
                      survey_id:
                        $ref: '#/components/schemas/resource_membership/properties/survey_id'
                      meeting_id:
                        $ref: '#/components/schemas/resource_membership/properties/meeting_id'
                      project_id:
                        $ref: '#/components/schemas/resource_membership/properties/project_id'
                      dashboard_id:
                        $ref: '#/components/schemas/resource_membership/properties/dashboard_id'
      description: Request body for creating or updating a membership. Specify the person or team, the target resource (project, deal, page, dashboard, filter, or survey), and the access type. Use type_id to set the permission level.
  schemas:
    resource_membership:
      type: object
      title: Membership Resource
      properties:
        type_id:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Type
          description: Numeric identifier for the membership type (e.g. viewer, editor, manager).
          example:
            - 123
        target_type:
          type: string
          title: Target Type
          description: The type of resource this membership applies to (e.g. project, page, survey).
          example:
            eq: active
        page:
          title: Page
          description: The page this membership grants access to, if the target is a page.
          example:
            eq: value
        target_id:
          type: integer
          title: Target
          description: The ID of the target resource this membership applies to.
          example:
            - 123
        filter:
          title: Filter
          description: The filter this membership grants access to, if the target is a filter.
          example:
            eq: value
        deal_id:
          type: integer
          title: Deal
          description: ID of the deal this membership grants access to, if the target is a deal.
          example:
            - 123
        meeting_id:
          type: integer
          title: Meeting
          description: ID of the meeting this membership grants access to.
          example: 4821
        id:
          type: integer
          title: Id
          description: The unique identifier of this membership.
          example:
            - 123
        dashboard:
          title: Dashboard
          description: The dashboard this membership grants access to, if the target is a dashboard.
          example:
            eq: value
        options:
          type: object
          title: Options
          description: Additional options and settings for this membership.
          example:
            eq: value
        deal:
          title: Deal
          description: The deal this membership grants access to, if the target is a deal.
          example:
            eq: value
        filter_id:
          type: integer
          title: Filter
          description: ID of the filter this membership grants access to, if the target is a filter.
          example:
            - 123
        agent:
          title: Agent
          description: The AI agent associated with this membership, if the member is an agent rather than a person.
          example:
            eq: value
        access_type_id:
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
          type: integer
          title: Access Type
          description: ID of the access type determining the permission level of this membership (e.g. viewer, editor).
          example:
            - 123
        dynamic_group_id:
          enum:
            - 2
            - 6
            - 8
            - 9
            - 10
            - 11
            - 12
          type: integer
          title: Dynamic Group
          description: ID of the dynamic group this membership is assigned to, if assigned via a group rather than an individual.
          example:
            - 123
        survey:
          title: Survey
          description: The survey this membership grants access to, if applicable.
          example:
            eq: value
        person_id:
          type: integer
          title: Person
          description: The ID of the person this membership belongs to.
          example:
            - 123
        dashboard_id:
          type: integer
          title: Dashboard
          description: ID of the dashboard this membership grants access to, if the target is a dashboard.
          example:
            - 123
        project_id:
          type: integer
          title: Project
          description: The ID of the project this membership grants access to, if applicable.
          example:
            - 123
        agent_id:
          type: integer
          title: Agent
          description: ID of the AI agent associated with this membership, if the member is an agent.
          example:
            - 123
        project:
          title: Project
          description: The project this membership grants access to, if applicable.
          example:
            eq: value
        pulse_id:
          type: integer
          title: Pulse
          description: The ID of the pulse (view) this membership applies to, if applicable.
          example:
            - 123
        page_id:
          type: integer
          title: Page
          description: The ID of the page this membership grants access to, if applicable.
          example:
            - 123
        person:
          title: Person
          description: The person this membership belongs to.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this membership belongs to.
          example:
            eq: value
        survey_id:
          type: integer
          title: Survey
          description: The ID of the survey this membership grants access to, if applicable.
          example:
            - 123
        team:
          title: Team
          description: The team this membership applies to, if it grants team-level access.
          example:
            eq: value
      description: Access control record granting a person or team access to a project, deal, page, dashboard, filter, survey, or agent. Defines the access level (type_id) and optional restrictions (options). Memberships drive visibility and edit permissions for shared resources.
      example:
        id: '7654'
        type: memberships
        attributes:
          access_type_id: 1
          dynamic_group_id: null
          options: {}
          target_type: project
          type_id: 1
        relationships:
          person:
            data:
              type: people
              id: '12'
          project:
            data:
              type: projects
              id: '6899'
          team:
            data: null
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  responses:
    single_membership:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      options:
                        $ref: '#/components/schemas/resource_membership/properties/options'
                      type_id:
                        $ref: '#/components/schemas/resource_membership/properties/type_id'
                      target_type:
                        $ref: '#/components/schemas/resource_membership/properties/target_type'
                      access_type_id:
                        $ref: '#/components/schemas/resource_membership/properties/access_type_id'
                      dynamic_group_id:
                        $ref: '#/components/schemas/resource_membership/properties/dynamic_group_id'
                  relationships:
                    type: object
                    properties:
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      page:
                        $ref: '#/components/schemas/_single_relationship'
                      team:
                        $ref: '#/components/schemas/_single_relationship'
                      agent:
                        $ref: '#/components/schemas/_single_relationship'
                      filter:
                        $ref: '#/components/schemas/_single_relationship'
                      person:
                        $ref: '#/components/schemas/_single_relationship'
                      survey:
                        $ref: '#/components/schemas/_single_relationship'
                      project:
                        $ref: '#/components/schemas/_single_relationship'
                      dashboard:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single membership
    collection_membership:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        options:
                          $ref: '#/components/schemas/resource_membership/properties/options'
                        type_id:
                          $ref: '#/components/schemas/resource_membership/properties/type_id'
                        target_type:
                          $ref: '#/components/schemas/resource_membership/properties/target_type'
                        access_type_id:
                          $ref: '#/components/schemas/resource_membership/properties/access_type_id'
                        dynamic_group_id:
                          $ref: '#/components/schemas/resource_membership/properties/dynamic_group_id'
                    relationships:
                      type: object
                      properties:
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        page:
                          $ref: '#/components/schemas/_single_relationship'
                        team:
                          $ref: '#/components/schemas/_single_relationship'
                        agent:
                          $ref: '#/components/schemas/_single_relationship'
                        filter:
                          $ref: '#/components/schemas/_single_relationship'
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                        survey:
                          $ref: '#/components/schemas/_single_relationship'
                        project:
                          $ref: '#/components/schemas/_single_relationship'
                        dashboard:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection membership
