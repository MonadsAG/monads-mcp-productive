    single_membership:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single membership record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned membership resource.
                properties:
                  attributes:
                    type: object
                    description: Membership attributes.
                    properties:
                      access_type_id:
                        $ref: '#/components/schemas/resource_membership/properties/access_type_id'
                      dynamic_group_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_membership/properties/dynamic_group_id'
                          - type: 'null'
                        description: The dynamic group ID for role-based group membership.
                      options:
                        anyOf:
                          - $ref: '#/components/schemas/resource_membership/properties/options'
                          - type: 'null'
                        description: Additional options or settings for this membership.
                      target_type:
                        $ref: '#/components/schemas/resource_membership/properties/target_type'
                      type_id:
                        $ref: '#/components/schemas/resource_membership/properties/type_id'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Membership relationships.
                    properties:
                      dashboard:
                        $ref: '#/components/schemas/_single_relationship'
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      filter:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      page:
                        $ref: '#/components/schemas/_single_relationship'
                      person:
                        $ref: '#/components/schemas/_single_relationship'
                      project:
                        $ref: '#/components/schemas/_single_relationship'
                      survey:
                        $ref: '#/components/schemas/_single_relationship'
                      team:
                        $ref: '#/components/schemas/_single_relationship'
                      agent:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '7654'
                type: memberships
                attributes:
                  access_type_id: 1
                  dynamic_group_id: null
                  options: {}
                  target_type: project
                  type_id: 1
                relationships:
                  person:
                    data:
                      type: people
                      id: '12'
                  project:
                    data:
                      type: projects
                      id: '6899'
                  team:
                    data: null
              included: []
      description: Single membership
    collection_membership:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of membership records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A membership resource object.
                  properties:
                    attributes:
                      type: object
                      description: Membership attributes.
                      properties:
                        access_type_id:
                          $ref: '#/components/schemas/resource_membership/properties/access_type_id'
                        dynamic_group_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_membership/properties/dynamic_group_id'
                            - type: 'null'
                          description: Identifier for the dynamic group associated with this membership.
                        options:
                          anyOf:
                            - $ref: '#/components/schemas/resource_membership/properties/options'
                            - type: 'null'
                          description: Additional options or settings for this membership.
                        target_type:
                          $ref: '#/components/schemas/resource_membership/properties/target_type'
                        type_id:
                          $ref: '#/components/schemas/resource_membership/properties/type_id'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Membership relationships.
                      properties:
                        dashboard:
                          $ref: '#/components/schemas/_single_relationship'
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        filter:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        page:
                          $ref: '#/components/schemas/_single_relationship'
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                        project:
                          $ref: '#/components/schemas/_single_relationship'
                        survey:
                          $ref: '#/components/schemas/_single_relationship'
                        team:
                          $ref: '#/components/schemas/_single_relationship'
                        agent:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of membership resource objects.
                example:
                  eq: value
              included:
