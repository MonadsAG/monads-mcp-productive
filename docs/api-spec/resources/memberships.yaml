        - not_contain
        - not_eq
    id:
      description: Filter by membership ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    target_type:
      description: Filter by the type of the target resource (used together with target_id).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter by specific person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    dashboard_id:
      description: Filter by the associated dashboard.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    type_id:
      description: Filter by the membership type (e.g. person, team, dynamic group).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
