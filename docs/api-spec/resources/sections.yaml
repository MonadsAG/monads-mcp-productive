openapi: 3.1.0
info:
  title: Productive.io API – Sections
  version: 2.0.0
description: |-
  **Sections** group services within a deal or budget — typically organized by phase, deliverable type, or billing period. They provide structure for complex budgets and are reflected in proposals, invoices, and financial reporting.

  A deal or budget can have multiple sections, each containing one or more services.
x-filters:
  section:
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by section name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      description: Filter by the associated deal.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_id:
      description: Filter by the associated budget.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/sections:
    get:
      tags:
        - Sections
      summary: Get sections
      operationId: sections-index
      description: List all sections.
      parameters:
        - $ref: '#/components/parameters/sort_section'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_section'
      responses:
        '200':
          $ref: '#/components/responses/collection_section'
    post:
      tags:
        - Sections
      summary: Create a section
      operationId: sections-create
      description: Create a new section.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/section'
      responses:
        '201':
          $ref: '#/components/responses/single_section'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/sections/{id}:
    get:
      tags:
        - Sections
      summary: Gets a section
      operationId: sections-show
      description: Retrieve a single section by ID.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_section'
    patch:
      tags:
        - Sections
      summary: Update a section
      operationId: sections-update
      description: Update a section.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/section'
      responses:
        '200':
          $ref: '#/components/responses/single_section'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
    delete:
      tags:
        - Sections
      summary: Deletes a section
      operationId: sections-destroy
      description: Delete a section by ID.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_section:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.section at the top of this file.
      required: false
      description: Filters
    sort_section:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort section
      explode: false
      required: false
      description: Sort section
  responses:
    single_section:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single section record in JSON:API format.
            properties:
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              data:
                type: object
                description: The JSON:API data object for the returned section resource.
                properties:
                  attributes:
                    type: object
                    description: Section attributes.
                    properties:
                      editor_config:
                        $ref: '#/components/schemas/resource_section/properties/editor_config'
                      position:
                        $ref: '#/components/schemas/resource_section/properties/position'
                      name:
                        $ref: '#/components/schemas/resource_section/properties/name'
                      preferences:
                        $ref: '#/components/schemas/resource_section/properties/preferences'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Section relationships.
                    properties:
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                id: '45'
                type: sections
                attributes:
                  name: Design Phase
                  position: 1
                  preferences: {}
                  editor_config: {}
                relationships:
                  deal:
                    data:
                      type: deals
                      id: '89'
              included: []
      description: Single section
    collection_section:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of section records in JSON:API format.
            properties:
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              data:
                type: array
                items:
                  type: object
                  description: A section resource object.
                  properties:
                    attributes:
                      type: object
                      description: Section attributes.
                      properties:
                        preferences:
                          $ref: '#/components/schemas/resource_section/properties/preferences'
                        name:
                          $ref: '#/components/schemas/resource_section/properties/name'
                        editor_config:
                          $ref: '#/components/schemas/resource_section/properties/editor_config'
                        position:
                          $ref: '#/components/schemas/resource_section/properties/position'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Section relationships.
                      properties:
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of section resource objects.
                example:
                  eq: value
            example:
              data:
                - id: '45'
                  type: sections
                  attributes:
                    name: Design Phase
                    position: 1
                    preferences: {}
                    editor_config: {}
                  relationships:
                    deal:
                      data:
                        type: deals
                        id: '89'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection section
  schemas:
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    resource_section:
      type: object
      title: Section Resource
      description: Represents a named grouping of services within a deal or budget, used to organize line items into logical sections.
      properties:
        preferences:
          type: object
          title: Preferences
          description: User-specific display preferences for this section, stored as key-value settings.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The name of this section.
          example:
            eq: value
        budget_id:
          type: integer
          title: Budget
          description: ID of the budget this section belongs to.
          example:
            - 123
        id:
          type: integer
          title: Id
          description: The unique identifier of this section.
          example:
            - 123
        deal:
          title: Deal
          description: The deal this section belongs to.
          example:
            eq: value
        editor_config:
          type: object
          title: Editor Config
          description: Rich text editor configuration and content for this section's description.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this section belongs to.
          example:
            eq: value
        deal_id:
          type: integer
          title: Deal
          description: ID of the deal this section belongs to.
          example:
            - 123
        position:
          type: integer
          title: Position
          description: The sort position of this section within the deal.
          example:
            eq: value
        description:
          type: string
          title: Description
      example:
        id: '123'
        type: sections
        attributes:
          name: Development
          position: 1
        relationships: {}
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  requestBodies:
    section:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a section.
            properties:
              data:
                type: object
                description: The JSON:API data object containing the section resource attributes and relationships.
                properties:
                  attributes:
                    type: object
                    description: Section attributes.
                    properties:
                      position:
                        $ref: '#/components/schemas/resource_section/properties/position'
                      deal_id:
                        $ref: '#/components/schemas/resource_section/properties/deal_id'
                      name:
                        $ref: '#/components/schemas/resource_section/properties/name'
                      preferences:
                        $ref: '#/components/schemas/resource_section/properties/preferences'
                      editor_config:
                        $ref: '#/components/schemas/resource_section/properties/editor_config'
                    required:
                      - deal_id
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: sections
                attributes:
                  name: Design Phase
                  position: 1
                relationships:
                  deal:
                    data:
                      type: deals
                      id: '89'
      description: Request body for creating or updating a section.
