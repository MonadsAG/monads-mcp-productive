openapi: 3.1.0
info:
  title: Productive.io API – Contact Entries
  version: 2.0.0
description: Contact information records (email, phone, website, postal address) for companies and people. Multiple contact entries can be attached to a single company or person, each with a type (e.g. work, personal) and optional billing-specific fields.
x-filters:
  contact_entry:
    company_id:
      description: Filter by client company.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    contactable_id:
      description: Filter by the ID of the contactable resource (person or company).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    contactable_type:
      description: Filter by the type of the contactable resource (person or company).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    invoice_id:
      description: Filter by the associated invoice.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter by the associated person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter by the associated subsidiary.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/contact_entries:
    get:
      tags:
        - Contact Entries
      summary: Get contact entries
      operationId: contact_entries-index
      description: List contact entries with optional filters and pagination.
      parameters:
        - $ref: '#/components/parameters/filter_contact_entry'
        - $ref: '#/components/parameters/sort_contact_entry'
      responses:
        '200':
          $ref: '#/components/responses/collection_contact_entry'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Contact Entries
      summary: Create a contact entry
      operationId: contact_entries-create
      description: Create a new contact entry.
      requestBody:
        $ref: '#/components/requestBodies/contact_entry'
      responses:
        '201':
          $ref: '#/components/responses/single_contact_entry'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_contact_entry'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/contact_entries/{id}:
    get:
      tags:
        - Contact Entries
      summary: Gets a contact entry
      operationId: contact_entries-show
      description: Retrieve a single contact entry by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_contact_entry'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Contact Entries
      summary: Update a contact entry
      operationId: contact_entries-update
      description: Update a contact entry.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/contact_entry'
      responses:
        '200':
          $ref: '#/components/responses/single_contact_entry'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_contact_entry'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Contact Entries
      summary: Deletes a contact entry
      operationId: contact_entries-destroy
      description: Delete a contact entry.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    unprocessable_content_contact_entry:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_contact_entry'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    single_contact_entry:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single contact entry record in JSON:API format.
            properties:
              data:
                type: object
                description: The contact entry resource object.
                properties:
                  attributes:
                    type: object
                    description: Contact entry attributes.
                    properties:
                      address:
                        anyOf:
                          - $ref: '#/components/schemas/resource_contact_entry/properties/address'
                          - type: 'null'
                        description: The full street address of the contact.
                      billing_address:
                        anyOf:
                          - $ref: '#/components/schemas/resource_contact_entry/properties/billing_address'
                          - type: 'null'
                        description: The billing address for invoice recipients.
                      billing_email:
                        anyOf:
                          - $ref: '#/components/schemas/resource_contact_entry/properties/billing_email'
                          - type: 'null'
                        description: The email address used for billing correspondence.
                      city:
                        anyOf:
                          - $ref: '#/components/schemas/resource_contact_entry/properties/city'
                          - type: 'null'
                        description: The city of the contact.
                      contactable_type:
                        $ref: '#/components/schemas/resource_contact_entry/properties/contactable_type'
                      country:
                        anyOf:
                          - $ref: '#/components/schemas/resource_contact_entry/properties/country'
                          - type: 'null'
                        description: The country of the contact.
                      email:
                        anyOf:
                          - $ref: '#/components/schemas/resource_contact_entry/properties/email'
                          - type: 'null'
                        description: The email address of the contact.
                      name:
                        $ref: '#/components/schemas/resource_contact_entry/properties/name'
                      phone:
                        anyOf:
                          - $ref: '#/components/schemas/resource_contact_entry/properties/phone'
                          - type: 'null'
                        description: The phone number of the contact.
                      state:
                        anyOf:
                          - $ref: '#/components/schemas/resource_contact_entry/properties/state'
                          - type: 'null'
                        description: The state or region of the contact.
                      type:
                        $ref: '#/components/schemas/resource_contact_entry/properties/type'
                      vat:
                        anyOf:
                          - $ref: '#/components/schemas/resource_contact_entry/properties/vat'
                          - type: 'null'
                        description: The VAT number for this contact, if applicable.
                      website:
                        anyOf:
                          - $ref: '#/components/schemas/resource_contact_entry/properties/website'
                          - type: 'null'
                        description: The website URL of the contact.
                      zipcode:
                        anyOf:
                          - $ref: '#/components/schemas/resource_contact_entry/properties/zipcode'
                          - type: 'null'
                        description: The zip or postal code of the contact.
                      external_id:
                        $ref: '#/components/schemas/resource_contact_entry/properties/external_id'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Contact entry relationships.
                    properties:
                      company:
                        $ref: '#/components/schemas/_single_relationship'
                      invoice:
                        $ref: '#/components/schemas/_single_relationship'
                      invoice_template:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      person:
                        $ref: '#/components/schemas/_single_relationship'
                      purchase_order:
                        $ref: '#/components/schemas/_single_relationship'
                      subsidiary:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '891'
                type: contact_entries
                attributes:
                  contactable_type: company
                  type: main
                  name: Headquarters
                  email: hello@acmecorp.com
                  phone: +1-555-0123
                  website: https://acmecorp.com
                  address: 123 Innovation Drive
                  city: San Francisco
                  state: CA
                  zipcode: '94105'
                  country: US
                  billing_address: 123 Innovation Drive, San Francisco, CA 94105
                  billing_email: billing@acmecorp.com
                relationships:
                  company:
                    data:
                      type: companies
                      id: '65111'
                  person:
                    data: null
              included: []
      description: Single contact entry
    collection_contact_entry:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of contact entry records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A contact entry resource object.
                  properties:
                    attributes:
                      type: object
                      description: Contact entry attributes.
                      properties:
                        address:
                          anyOf:
                            - $ref: '#/components/schemas/resource_contact_entry/properties/address'
                            - type: 'null'
                          description: Street address for this contact entry.
                        billing_address:
                          anyOf:
                            - $ref: '#/components/schemas/resource_contact_entry/properties/billing_address'
                            - type: 'null'
                          description: Billing address for this contact entry (used on invoices).
                        billing_email:
                          anyOf:
                            - $ref: '#/components/schemas/resource_contact_entry/properties/billing_email'
                            - type: 'null'
                          description: Billing email address for this contact entry (used on invoices).
                        city:
                          anyOf:
                            - $ref: '#/components/schemas/resource_contact_entry/properties/city'
                            - type: 'null'
                          description: City for this contact entry.
                        contactable_type:
                          $ref: '#/components/schemas/resource_contact_entry/properties/contactable_type'
                        country:
                          anyOf:
                            - $ref: '#/components/schemas/resource_contact_entry/properties/country'
                            - type: 'null'
                          description: Country for this contact entry.
                        email:
                          anyOf:
                            - $ref: '#/components/schemas/resource_contact_entry/properties/email'
                            - type: 'null'
                          description: Email address for this contact entry.
                        name:
                          $ref: '#/components/schemas/resource_contact_entry/properties/name'
                        phone:
                          anyOf:
                            - $ref: '#/components/schemas/resource_contact_entry/properties/phone'
                            - type: 'null'
                          description: Phone number for this contact entry.
                        state:
                          anyOf:
                            - $ref: '#/components/schemas/resource_contact_entry/properties/state'
                            - type: 'null'
                          description: State/province for this contact entry.
                        type:
                          $ref: '#/components/schemas/resource_contact_entry/properties/type'
                        vat:
                          anyOf:
                            - $ref: '#/components/schemas/resource_contact_entry/properties/vat'
                            - type: 'null'
                          description: VAT number associated with this contact entry.
                        website:
                          anyOf:
                            - $ref: '#/components/schemas/resource_contact_entry/properties/website'
                            - type: 'null'
                          description: Website URL for this contact entry.
                        zipcode:
                          anyOf:
                            - $ref: '#/components/schemas/resource_contact_entry/properties/zipcode'
                            - type: 'null'
                          description: Zip/postal code for this contact entry.
                        external_id:
                          $ref: '#/components/schemas/resource_contact_entry/properties/external_id'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Contact entry relationships.
                      properties:
                        company:
                          $ref: '#/components/schemas/_single_relationship'
                        invoice:
                          $ref: '#/components/schemas/_single_relationship'
                        invoice_template:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                        purchase_order:
                          $ref: '#/components/schemas/_single_relationship'
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of contact entry resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '891'
                  type: contact_entries
                  attributes:
                    contactable_type: company
                    type: main
                    name: Headquarters
                    email: hello@acmecorp.com
                    phone: +1-555-0123
                    website: https://acmecorp.com
                    address: 123 Innovation Drive
                    city: San Francisco
                    state: CA
                    zipcode: '94105'
                    country: US
                    billing_address: 123 Innovation Drive, San Francisco, CA 94105
                    billing_email: billing@acmecorp.com
                  relationships:
                    company:
                      data:
                        type: companies
                        id: '65111'
                    person:
                      data: null
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection contact entry
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_not_acceptable:
      enum:
        - bulk_extensions_headers_invalid
        - not_acceptable
        - read_only_mode_violation
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 406.
    error_code_not_found:
      enum:
        - not_found
        - record_not_found
        - route_not_found
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 404.
    error_code_forbidden:
      enum:
        - access_denied
        - account_inactive
        - agent_role_impersonation_denied
