openapi: 3.1.0
info:
  title: Productive.io API – Contact Entries
  version: 2.0.0
description: Contact information records (email, phone, website, postal address) for companies and people. Multiple contact entries can be attached to a single company or person, each with a type (e.g. work, personal) and optional billing-specific fields.
x-filters:
  contact_entry:
    contactable_type:
      description: Filter by the type of the contactable resource (person or company).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by client company.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    contactable_id:
      description: Filter by the ID of the contactable resource (person or company).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    invoice_id:
      description: Filter by the associated invoice.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter by the associated person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter by the associated subsidiary.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/contact_entries:
    get:
      tags:
        - Contact Entries
      summary: Get contact entries
      responses:
        '200':
          $ref: '#/components/responses/collection_contact_entry'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_contact_entry'
        - $ref: '#/components/parameters/filter_contact_entry'
      operationId: contact_entries-index
      description: List contact entries with optional filters and pagination.
    post:
      tags:
        - Contact Entries
      summary: Create a contact entry
      responses:
        '201':
          $ref: '#/components/responses/single_contact_entry'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: contact_entries-create
      requestBody:
        $ref: '#/components/requestBodies/contact_entry'
      description: Create a new contact entry.
  /api/v2/contact_entries/{id}:
    get:
      tags:
        - Contact Entries
      summary: Gets a contact entry
      responses:
        '200':
          $ref: '#/components/responses/single_contact_entry'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: contact_entries-show
      description: Retrieve a single contact entry by ID.
    patch:
      tags:
        - Contact Entries
      summary: Update a contact entry
      responses:
        '200':
          $ref: '#/components/responses/single_contact_entry'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: contact_entries-update
      requestBody:
        $ref: '#/components/requestBodies/contact_entry'
      description: Update a contact entry.
    delete:
      tags:
        - Contact Entries
      summary: Deletes a contact entry
      responses:
        '204':
          description: No Content
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: contact_entries-destroy
      description: Delete a contact entry.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_contact_entry:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.contact_entry at the top of this file.
      required: false
      description: Filters
    sort_contact_entry:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort contact entry
      explode: false
      required: false
      description: Sort contact entry
  requestBodies:
    contact_entry:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - type
                      - name
                    properties:
                      vat:
                        $ref: '#/components/schemas/resource_contact_entry/properties/vat'
                      city:
                        $ref: '#/components/schemas/resource_contact_entry/properties/city'
                      name:
                        $ref: '#/components/schemas/resource_contact_entry/properties/name'
                      type:
                        $ref: '#/components/schemas/resource_contact_entry/properties/type'
                      email:
                        $ref: '#/components/schemas/resource_contact_entry/properties/email'
                      phone:
                        $ref: '#/components/schemas/resource_contact_entry/properties/phone'
                      state:
                        $ref: '#/components/schemas/resource_contact_entry/properties/state'
                      address:
                        $ref: '#/components/schemas/resource_contact_entry/properties/address'
                      country:
                        $ref: '#/components/schemas/resource_contact_entry/properties/country'
                      website:
                        $ref: '#/components/schemas/resource_contact_entry/properties/website'
                      zipcode:
                        $ref: '#/components/schemas/resource_contact_entry/properties/zipcode'
                      person_id:
                        $ref: '#/components/schemas/resource_contact_entry/properties/person_id'
                      company_id:
                        $ref: '#/components/schemas/resource_contact_entry/properties/company_id'
                      invoice_id:
                        $ref: '#/components/schemas/resource_contact_entry/properties/invoice_id'
                      billing_email:
                        $ref: '#/components/schemas/resource_contact_entry/properties/billing_email'
                      subsidiary_id:
                        $ref: '#/components/schemas/resource_contact_entry/properties/subsidiary_id'
                      billing_address:
                        $ref: '#/components/schemas/resource_contact_entry/properties/billing_address'
                      organization_id:
                        $ref: '#/components/schemas/resource_contact_entry/properties/organization_id'
                      contactable_type:
                        $ref: '#/components/schemas/resource_contact_entry/properties/contactable_type'
                      purchase_order_id:
                        $ref: '#/components/schemas/resource_contact_entry/properties/purchase_order_id'
                      invoice_template_id:
                        $ref: '#/components/schemas/resource_contact_entry/properties/invoice_template_id'
      description: Request body for creating or updating a contact entry. Specify the type (email, phone, address, website), the contact fields, and the parent relationship (company or person). Billing fields (billing_address, billing_email, VAT) are available when financials are enabled.
  schemas:
    resource_contact_entry:
      type: object
      title: Contact entry Resource
      properties:
        contactable_type:
          type: string
          title: Contactable Type
          description: The type of the associated contactable resource.
          example:
            eq: active
        country:
          type: string
          title: Country
          description: The country of this contact entry.
          example:
            gt: 0
        state:
          type: string
          title: State
          description: The state or province of this contact entry.
          example:
            eq: active
        company:
          title: Company
          description: The company this contact entry belongs to, if the contactable is a company.
          example:
            eq: value
        purchase_order_id:
          title: Purchase Order
          description: ID of the purchase order this contact entry is associated with, if applicable.
          example: 1234567
        organization:
          title: Organization
          description: The organization this contact entry belongs to.
          example:
            eq: value
        type:
          type: string
          title: Type
          description: The type of this contact entry, indicating the context (e.g. company or person contact).
          example:
            eq: active
        contactable_id:
          type: integer
          title: Contactable
          description: The ID of the associated contactable resource.
          example:
            - 123
        vat:
          type: string
          title: Vat
          description: The VAT number associated with this contact entry.
          example:
            eq: value
        subsidiary:
          title: Subsidiary
          description: The subsidiary this contact entry is linked to, if applicable.
          example:
            eq: value
        invoice:
          title: Invoice
          description: The invoice this contact entry is associated with, if applicable.
          example:
            eq: value
        invoice_template_id:
          title: Invoice Template
          description: ID of the invoice template this contact entry is linked to.
          example:
            - 123
        city:
          type: string
          title: City
          description: The city of this contact entry.
          example:
            eq: value
        billing_address:
          type: boolean
          title: Billing Address
          description: The billing address associated with this contact entry.
          example:
            eq: value
        billing_email:
          type: boolean
          title: Billing Email
          description: The email address used for billing on this contact entry.
          example:
            eq: value
        company_id:
          type: integer
          title: Company
          description: ID of the company this contact entry belongs to, if the contactable is a company.
          example:
            - 123
        person:
          title: Person
          description: The person this contact entry belongs to, if the contactable is a person.
          example:
            eq: value
        phone:
          type: string
          title: Phone
          description: The phone number of this contact entry.
          example:
            eq: value
        organization_id:
          title: Organization
          description: ID of the organization this contact entry belongs to.
          example:
            - 123
        purchase_order:
          title: Purchase Order
          description: The purchase order this contact entry is associated with, if applicable.
          example:
            data:
              type: purchase_orders
              id: '1234567'
        zipcode:
          type: string
          title: Zipcode
          description: The ZIP or postal code.
          example:
            eq: value
        address:
          type: string
          title: Address
          description: The street address of this contact entry.
          example:
            eq: value
        subsidiary_id:
          type: integer
          title: Subsidiary
          description: ID of the subsidiary this contact entry is linked to, if applicable.
          example:
            - 123
        invoice_id:
          type: integer
          title: Invoice
          description: ID of the invoice this contact entry is associated with, if applicable.
          example:
            - 123
        person_id:
          type: integer
          title: Person
          description: ID of the person this contact entry belongs to, if the contactable is a person.
          example:
            - 123
        invoice_template:
          title: Invoice Template
          description: The invoice template this contact entry is linked to, for pre-filling invoice contact details.
          example:
            eq: value
        website:
          type: string
          title: Website
          description: The website URL of this contact entry.
          example:
            eq: value
        email:
          type: string
          title: Email
          description: The email address of this contact entry.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The display name on this contact entry.
          example:
            eq: value
      description: Contact information record (email, phone, website, or postal address) for a company or person. Supports multiple entries per contact with type classification. Billing-specific fields (billing_address, billing_email, VAT) are available for company contacts with financials enabled.
      example:
        id: '16235'
        type: contact_entries
        attributes:
          contactable_type: person
          type: email
          name: Work
          email: tomislav@productive.io
          phone: null
          website: null
          address: null
          city: null
          state: null
          zipcode: null
          country: null
          vat: null
          billing_address: null
          billing_email: null
        relationships:
          organization:
            data:
              type: organizations
              id: '109'
          company:
            meta:
              included: false
          person:
            meta:
              included: false
          invoice:
            meta:
              included: false
          subsidiary:
            meta:
              included: false
          purchase_order:
            meta:
              included: false
          invoice_template:
            meta:
              included: false
          proposal:
            meta:
              included: false
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  responses:
    single_contact_entry:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      vat:
                        $ref: '#/components/schemas/resource_contact_entry/properties/vat'
                      city:
                        $ref: '#/components/schemas/resource_contact_entry/properties/city'
                      name:
                        $ref: '#/components/schemas/resource_contact_entry/properties/name'
                      type:
                        $ref: '#/components/schemas/resource_contact_entry/properties/type'
                      email:
                        $ref: '#/components/schemas/resource_contact_entry/properties/email'
                      phone:
                        $ref: '#/components/schemas/resource_contact_entry/properties/phone'
                      state:
                        $ref: '#/components/schemas/resource_contact_entry/properties/state'
                      address:
                        $ref: '#/components/schemas/resource_contact_entry/properties/address'
                      country:
                        $ref: '#/components/schemas/resource_contact_entry/properties/country'
                      website:
                        $ref: '#/components/schemas/resource_contact_entry/properties/website'
                      zipcode:
                        $ref: '#/components/schemas/resource_contact_entry/properties/zipcode'
                      billing_email:
                        $ref: '#/components/schemas/resource_contact_entry/properties/billing_email'
                      billing_address:
                        $ref: '#/components/schemas/resource_contact_entry/properties/billing_address'
                      contactable_type:
                        $ref: '#/components/schemas/resource_contact_entry/properties/contactable_type'
                  relationships:
                    type: object
                    properties:
                      person:
                        $ref: '#/components/schemas/_single_relationship'
                      company:
                        $ref: '#/components/schemas/_single_relationship'
                      invoice:
                        $ref: '#/components/schemas/_single_relationship'
                      subsidiary:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      purchase_order:
                        $ref: '#/components/schemas/_single_relationship'
                      invoice_template:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single contact entry
    collection_contact_entry:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        vat:
                          $ref: '#/components/schemas/resource_contact_entry/properties/vat'
                        city:
                          $ref: '#/components/schemas/resource_contact_entry/properties/city'
                        name:
                          $ref: '#/components/schemas/resource_contact_entry/properties/name'
                        type:
                          $ref: '#/components/schemas/resource_contact_entry/properties/type'
                        email:
                          $ref: '#/components/schemas/resource_contact_entry/properties/email'
                        phone:
                          $ref: '#/components/schemas/resource_contact_entry/properties/phone'
                        state:
                          $ref: '#/components/schemas/resource_contact_entry/properties/state'
                        address:
                          $ref: '#/components/schemas/resource_contact_entry/properties/address'
                        country:
                          $ref: '#/components/schemas/resource_contact_entry/properties/country'
                        website:
                          $ref: '#/components/schemas/resource_contact_entry/properties/website'
                        zipcode:
                          $ref: '#/components/schemas/resource_contact_entry/properties/zipcode'
                        billing_email:
                          $ref: '#/components/schemas/resource_contact_entry/properties/billing_email'
                        billing_address:
                          $ref: '#/components/schemas/resource_contact_entry/properties/billing_address'
                        contactable_type:
                          $ref: '#/components/schemas/resource_contact_entry/properties/contactable_type'
                    relationships:
                      type: object
                      properties:
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                        company:
                          $ref: '#/components/schemas/_single_relationship'
                        invoice:
                          $ref: '#/components/schemas/_single_relationship'
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        purchase_order:
                          $ref: '#/components/schemas/_single_relationship'
                        invoice_template:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection contact entry
