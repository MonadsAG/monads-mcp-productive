        title: Sort pulse
      explode: false
      required: false
      description: Sort pulse
    filter_pulse:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.pulse at the top of this file.
      required: false
      description: Filters
