              data:
                id: '234'
                type: pulses
                attributes:
                  score: 8
                  comment: Great sprint — shipped the auth feature on time
                  created_at: '2026-03-15T10:00:00.000+00:00'
                relationships:
                  person:
                    data:
                      type: people
                      id: '12'
                  project:
                    data:
                      type: projects
                      id: '6899'
              included: []
      description: Single pulse
    collection_pulse:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of pulse (scheduled report) records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A pulse resource object.
                  properties:
                    attributes:
