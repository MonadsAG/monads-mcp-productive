                            - type: 'null'
                          description: The document format identifier for the scheduled report export.
                        export_params:
                          anyOf:
                            - $ref: '#/components/schemas/resource_pulse/properties/export_params'
                            - type: 'null'
                          description: Export parameters for the scheduled report.
                        recipients:
                          type: array
                          items:
                            type: string
                          title: Recipients
                          description: List of email recipients for this scheduled report.
                        repeat_schedule_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_pulse/properties/repeat_schedule_id'
                            - type: 'null'
                          description: The repeat frequency for this scheduled report (e.g. daily, weekly).
                        schedule_day_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_pulse/properties/schedule_day_id'
                            - type: 'null'
                          description: The day of the week or month this report is scheduled.
                        schedule_frame_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_pulse/properties/schedule_frame_id'
                            - type: 'null'
                          description: The time frame for the scheduled report (e.g. this week, last month).
                        schedule_hour:
                          anyOf:
                            - $ref: '#/components/schemas/resource_pulse/properties/schedule_hour'
                            - type: 'null'
                          description: The hour of the day when this report is sent.
                        skip_if_empty:
                          anyOf:
                            - $ref: '#/components/schemas/resource_pulse/properties/skip_if_empty'
                            - type: 'null'
                          description: Whether to skip sending if the report has no data.
                        slack_channel:
                          anyOf:
                            - $ref: '#/components/schemas/resource_pulse/properties/slack_channel'
                            - type: 'null'
                          description: The Slack channel where this report is posted.
                        test_pulse:
                          $ref: '#/components/schemas/resource_pulse/properties/test_pulse'
                        type_id:
                          $ref: '#/components/schemas/resource_pulse/properties/type_id'
                        teams_channel:
                          anyOf:
                            - $ref: '#/components/schemas/resource_pulse/properties/teams_channel'
                            - type: 'null'
                          description: The Microsoft Teams channel name or ID where pulse notifications are sent.
                        teams_team:
                          anyOf:
                            - $ref: '#/components/schemas/resource_pulse/properties/teams_team'
                            - type: 'null'
                          description: The Microsoft Teams team name or ID associated with this pulse notification.
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Pulse relationships.
                      properties:
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        filter:
                          $ref: '#/components/schemas/_single_relationship'
                        memberships:
                          $ref: '#/components/schemas/_collection_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of pulse resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '234'
                  type: pulses
                  attributes:
                    score: 8
                    comment: Great sprint — shipped the auth feature on time
                    created_at: '2026-03-15T10:00:00.000+00:00'
                  relationships:
                    person:
                      data:
                        type: people
                        id: '12'
                    project:
                      data:
                        type: projects
                        id: '6899'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection pulse
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_not_acceptable:
      enum:
        - bulk_extensions_headers_invalid
        - not_acceptable
