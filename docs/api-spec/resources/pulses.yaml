                      document_format_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_pulse/properties/document_format_id'
                          - type: 'null'
                        description: The format identifier for the exported document (e.g. PDF, XLSX).
                      export_params:
                        anyOf:
                          - $ref: '#/components/schemas/resource_pulse/properties/export_params'
                          - type: 'null'
                        description: The export parameters defining which report and filters to use.
                      recipients:
                        type: array
                        items:
                          type: string
                        title: Recipients
                        description: The list of email recipients for this pulse.
                      repeat_schedule_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_pulse/properties/repeat_schedule_id'
                          - type: 'null'
                        description: The repeat schedule identifier (e.g. daily, weekly, monthly).
                      schedule_day_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_pulse/properties/schedule_day_id'
                          - type: 'null'
                        description: The specific day of the week or month to send the pulse.
                      schedule_frame_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_pulse/properties/schedule_frame_id'
                          - type: 'null'
                        description: The time frame identifier for the report included in the pulse.
                      schedule_hour:
                        anyOf:
                          - $ref: '#/components/schemas/resource_pulse/properties/schedule_hour'
                          - type: 'null'
                        description: The hour of the day (in UTC) to send the pulse.
                      skip_if_empty:
                        anyOf:
                          - $ref: '#/components/schemas/resource_pulse/properties/skip_if_empty'
                          - type: 'null'
                        description: Whether to skip sending the pulse if the report has no data.
                      slack_channel:
                        anyOf:
