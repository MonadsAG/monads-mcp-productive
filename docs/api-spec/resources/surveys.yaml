    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _collection_relationship:
      anyOf:
        - $ref: '#/components/schemas/_collection_linkage'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          required:
            - included
          example:
            included: false
      required:
        - meta
      example:
        meta:
          included: false
    _collection_linkage:
      type: object
      title: Collection linkage
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/_resource'
      required:
        - data
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: string
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      required:
        - id
        - type
      example:
        type: tasks
        id: '42'
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_single_linkage_nullable'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _single_linkage_nullable:
      type: object
      title: Single nullable linkage
      properties:
        data:
          anyOf:
            - $ref: '#/components/schemas/_resource'
            - type: 'null'
      required:
        - data
    resource_survey:
      type: object
      title: Survey Resource
      description: Project form for structured data collection. Supports automation triggers on submission. Responses are stored as survey_response records with field values.
      properties:
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this survey was created.
          example:
            gt: '2026-01-01'
        creator:
          title: Creator
          description: The person who created this survey.
          example:
            eq: value
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who created this survey.
          example:
            - 123
        editable:
          type: boolean
          title: Editable
          description: Whether the current user can edit this survey.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: The unique identifier of this survey.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this survey belongs to.
          example:
            eq: value
        project:
          title: Project
          description: The project this survey is associated with.
          example:
            eq: value
        project_id:
          type: integer
          title: Project
          description: ID of the project this survey is associated with.
          example:
            - 123
        public_uuid:
          type: string
          title: Public Uuid
          description: Public UUID used to identify this survey in shareable links.
          example:
            eq: value
        query:
          type: string
          title: Query
          description: Text search query applied when filtering surveys.
          example:
            eq: value
        submission_access:
          enum:
            - nobody
            - project_members
            - organization
            - public
          type: string
          title: Submission Access
          description: 'Controls who can submit responses to this survey: nobody, project_members, organization, or public.'
          example:
            eq: value
        title:
          type: string
          title: Title
          description: The title of this survey.
          example:
            eq: value
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when this survey was last updated.
          example:
            gt: '2026-01-01'
        updater:
          title: Updater
          description: The person who last updated this survey.
          example:
            eq: value
        memberships:
          title: Memberships
      example:
        id: '7'
        type: surveys
        attributes:
          title: Client Satisfaction Q1 2026
          status: published
          created_at: '2026-01-15T10:00:00.000+00:00'
        relationships:
          project:
            data:
              type: projects
              id: '6899'
  requestBodies:
    survey:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a survey.
            properties:
              data:
                type: object
                description: The JSON:API data object containing the survey resource attributes and relationships.
                properties:
                  attributes:
                    type: object
                    description: Survey attributes.
                    properties:
                      project_id:
                        $ref: '#/components/schemas/resource_survey/properties/project_id'
                      submission_access:
                        $ref: '#/components/schemas/resource_survey/properties/submission_access'
                      title:
                        $ref: '#/components/schemas/resource_survey/properties/title'
                    required:
                      - title
                      - project_id
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: surveys
                attributes:
                  title: Client Satisfaction Q1 2026
                relationships:
                  project:
                    data:
                      type: projects
                      id: '6899'
      description: Request body for creating or updating a survey. Specify the project, name, and configuration. Survey fields are managed separately via the survey_fields endpoint.
  parameters:
    sort_survey:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - id
            - -id
            - title
            - -title
          type: string
        title: Sort survey
      explode: false
      required: false
      description: Sort order for survey list results. Accepts one or more field names, comma-separated; prefix with `-` for descending. --branch descriptions
    filter_survey:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.survey at the top of this file.
      required: false
      description: Filter parameter for querying surveys.
