openapi: 3.1.0
info:
  title: Productive.io API – Sessions
  version: 2.0.0
description: '**Sessions** represent authenticated login sessions for users accessing Productive.'
x-filters:
  session:
    creator_id:
      description: Filter by the person who created the session.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    machine:
      description: Filter to include only machine (non-human) sessions.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    read_only:
      description: Filter to include only read-only sessions.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/sessions:
    get:
      tags:
        - Sessions
      summary: Get all sessions
      operationId: sessions-index
      description: List all active sessions.
      parameters:
        - $ref: '#/components/parameters/filter_session'
        - $ref: '#/components/parameters/sort_session'
      responses:
        '200':
          $ref: '#/components/responses/collection_session'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Sessions
      summary: Create a session
      operationId: sessions-create
      description: Create a new session (sign in).
      requestBody:
        $ref: '#/components/requestBodies/session'
      responses:
        '201':
          $ref: '#/components/responses/single_session'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/sessions/{id}:
    delete:
      tags:
        - Sessions
      summary: Deletes a session
      operationId: sessions-destroy
      description: Delete a session (sign out) by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/sessions/machine:
    post:
      tags:
        - Sessions
      summary: Create a machine session
      operationId: sessions-machine-machine
      description: Create a machine session for API access.
      responses:
        '200':
          $ref: '#/components/responses/single_session'
        '201':
          $ref: '#/components/responses/single_session'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_session'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/sessions/{id}/validate_otp:
    put:
      tags:
        - Sessions
      summary: Validate session OTP
      operationId: sessions-validate_otp-validate_otp
      description: Validate a one-time password for a session.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_session'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_session'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content_session:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_session'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    single_session:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single session record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned session resource.
                properties:
                  attributes:
                    type: object
                    description: Session attributes.
                    properties:
                      agent_avatar:
                        $ref: '#/components/schemas/resource_session/properties/agent_avatar'
                      agent_first_name:
                        $ref: '#/components/schemas/resource_session/properties/agent_first_name'
                      agent_last_name:
                        $ref: '#/components/schemas/resource_session/properties/agent_last_name'
                      browser:
                        anyOf:
                          - $ref: '#/components/schemas/resource_session/properties/browser'
                          - type: 'null'
                        description: The browser used to create this session.
                      device:
                        anyOf:
                          - $ref: '#/components/schemas/resource_session/properties/device'
                          - type: 'null'
                        description: The device type used to create this session.
                      last_activity_at:
                        $ref: '#/components/schemas/resource_session/properties/last_activity_at'
                      last_ip:
                        anyOf:
                          - $ref: '#/components/schemas/resource_session/properties/last_ip'
                          - type: 'null'
                        description: The last IP address used for this session.
                      location:
                        anyOf:
                          - $ref: '#/components/schemas/resource_session/properties/location'
                          - type: 'null'
                        description: The geographic location of the last IP address.
                      machine:
                        $ref: '#/components/schemas/resource_session/properties/machine'
                      name:
                        anyOf:
                          - $ref: '#/components/schemas/resource_session/properties/name'
                          - type: 'null'
                        description: The name of the session (e.g. application name or device label).
                      note:
                        anyOf:
                          - $ref: '#/components/schemas/resource_session/properties/note'
                          - type: 'null'
                        description: An optional description or note for this session.
                      platform:
                        anyOf:
                          - $ref: '#/components/schemas/resource_session/properties/platform'
                          - type: 'null'
                        description: The operating system platform used to create this session.
                      read_only:
                        $ref: '#/components/schemas/resource_session/properties/read_only'
                      single_sign_on:
                        $ref: '#/components/schemas/resource_session/properties/single_sign_on'
                      token:
                        $ref: '#/components/schemas/resource_session/properties/token'
                      token_expires_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_session/properties/token_expires_at'
                          - type: 'null'
                        description: The timestamp when this session token expires.
                      two_factor_auth:
                        $ref: '#/components/schemas/resource_session/properties/two_factor_auth'
                      user_id:
                        $ref: '#/components/schemas/resource_session/properties/user_id'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Session relationships.
                    properties:
                      user:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '789'
                type: sessions
                attributes:
                  token: null
                  created_at: '2026-03-15T09:00:00.000+00:00'
                relationships:
                  user:
                    data:
                      type: users
                      id: '456'
              included: []
      description: Single session
    unprocessable_content:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unprocessable_content'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    collection_session:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of session records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A session resource object.
                  properties:
                    attributes:
                      type: object
                      description: Session attributes.
                      properties:
                        agent_avatar:
                          $ref: '#/components/schemas/resource_session/properties/agent_avatar'
                        agent_first_name:
                          $ref: '#/components/schemas/resource_session/properties/agent_first_name'
                        agent_last_name:
                          $ref: '#/components/schemas/resource_session/properties/agent_last_name'
                        browser:
                          anyOf:
                            - $ref: '#/components/schemas/resource_session/properties/browser'
                            - type: 'null'
                          description: Browser name and version for this session.
                        device:
                          anyOf:
                            - $ref: '#/components/schemas/resource_session/properties/device'
                            - type: 'null'
                          description: Device type used for this session (e.g. desktop, mobile).
                        last_activity_at:
                          $ref: '#/components/schemas/resource_session/properties/last_activity_at'
                        last_ip:
                          anyOf:
                            - $ref: '#/components/schemas/resource_session/properties/last_ip'
                            - type: 'null'
                          description: The IP address of the last request in this session.
                        location:
                          anyOf:
                            - $ref: '#/components/schemas/resource_session/properties/location'
                            - type: 'null'
                          description: Geographic location derived from the session IP address.
                        machine:
                          $ref: '#/components/schemas/resource_session/properties/machine'
                        name:
                          anyOf:
                            - $ref: '#/components/schemas/resource_session/properties/name'
                            - type: 'null'
                          description: A human-readable name for this session (e.g. API token name).
                        note:
                          anyOf:
                            - $ref: '#/components/schemas/resource_session/properties/note'
                            - type: 'null'
                          description: Additional notes about this session.
                        platform:
                          anyOf:
                            - $ref: '#/components/schemas/resource_session/properties/platform'
                            - type: 'null'
                          description: Operating system platform for this session.
                        read_only:
                          $ref: '#/components/schemas/resource_session/properties/read_only'
                        single_sign_on:
                          $ref: '#/components/schemas/resource_session/properties/single_sign_on'
                        token:
                          $ref: '#/components/schemas/resource_session/properties/token'
                        token_expires_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_session/properties/token_expires_at'
                            - type: 'null'
                          description: Timestamp when this session token expires.
                        two_factor_auth:
                          $ref: '#/components/schemas/resource_session/properties/two_factor_auth'
                        user_id:
                          $ref: '#/components/schemas/resource_session/properties/user_id'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Session relationships.
                      properties:
                        user:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of session resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '789'
                  type: sessions
                  attributes:
                    token: null
                    created_at: '2026-03-15T09:00:00.000+00:00'
                  relationships:
                    user:
                      data:
                        type: users
                        id: '456'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection session
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_session:
      enum:
        - bad_decimal_format
        - expired_jwt_token
        - invalid_attribute
        - invalid_attribute_value
        - invalid_jwt_token
        - non_finite_number
        - null_bytes_in_params
        - organization_id_invalid
        - organization_membership_id_invalid
        - person_id_invalid
        - session_otp_invalid
        - session_otp_too_many_attempts
        - user_email_invalid
        - user_not_found
      type: string
      title: Error Code
      description: Every error `code` the sessions endpoints can return.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_not_found:
      enum:
        - not_found
        - record_not_found
        - route_not_found
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 404.
    error_code_forbidden:
      enum:
        - access_denied
        - account_inactive
        - agent_role_impersonation_denied
        - automatic_invoicing_not_manageable
        - billing_catalog_list_unavailable
        - booking_conflict_resolver_unavailable
        - budget_inaccessible
        - budgets_not_manageable
        - cascade_deletion_blocked
        - custom_roles_unavailable
        - deactivated_organization
        - deal_proposal_analytics_unavailable
        - deal_proposal_public_link_unavailable
        - document_styler_unavailable
        - document_templates_unavailable
        - email_inbox_unavailable
        - entry_not_editable
        - expense_not_editable
        - feature_unavailable
        - finalized_invoice_permission
        - financials_unavailable
        - impersonation_on_account_not_allowed
        - insufficient_automation_permission
        - insufficient_project_access
        - insufficient_seats
        - invalid_impersonate_role_id_header
        - invoices_unavailable
        - login_unavailable
        - mcp_access_disabled
        - mcp_connectors_disabled
        - mcp_provider_unavailable
        - missing_slack_integration
        - no_client_access
        - no_organization_id
        - no_person
        - no_sandbox_access
        - organization_red_flagged
        - other_timer_running
        - outgoing_emails_limit_exceeded
        - payment_reminders_unavailable
        - personal_access_token_limit_exceeded
        - pipelines_limit_exceeded
        - placeholders_limit_exceeded
        - plan_limit_exceeded
        - plan_unavailable
        - private_channel_forbidden
        - recipients_limit_exceeded
        - record_not_owned
        - report_templates_unavailable
        - restricted_email_in_trialing
        - role_bill_rate_unavailable
        - role_impersonate_denied
        - select_organization
        - service_inaccessible
        - service_type_inaccessible
        - single_sign_on_invalid
        - single_sign_on_login_only
        - single_sign_on_provision_failed
        - single_sign_on_unavailable
        - subscription_expired
        - subsidiaries_unavailable
        - subsidiary_out_of_scope
        - teams_limit_exceeded
        - two_factor_login
        - unallocated_expense_inaccessible
        - webooks_limit_exceeded
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 403.
    error_code_unauthorized:
      enum:
        - invalid_auth_token
