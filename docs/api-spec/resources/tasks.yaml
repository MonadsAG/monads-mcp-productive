openapi: 3.1.0
info:
  title: Productive.io API – Tasks
  version: 2.0.0
description: |-
  For more details on how to work with custom fields please refer to [Working with custom fields](https://developer.productive.io/working_with_custom_fields.html#working_with_custom_fields) guide.

  The Task object represents a task within the project management system.

  You can find out more about tasks in our Help documentation: [Tasks and task lists](https://help.productive.io/en/collections/38789-tasks-and-task-lists)

  Task can be one of two types:
   - milestone
   - task

  Following diagram shows tasks in our data hierarchy:

  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  project: Project
  folder: Folder
  task_list: Task list
  task: Task {
    class: primary
  }
  comments: Comments
  subtasks: Subtasks
  todos: Todos

  # define connections
  project -> folder -> task_list -> task
  task -> comments
  task -> subtasks
  task -> todos
  ```

  For Task dependencies please refer to [TaskDependency endpoint](https://developer.productive.io/taskdependency.html#taskdependency) documentation
x-filters:
  task:
    tags:
      description: Filter by tag name(s); use null to match tasks with no tags.
    after: {}
    assignee_id:
      description: Filter by assigned person (also matches open to-do assignees).
    before: {}
    billable_time:
      description: Filter by billable time (in seconds).
    board_status:
      description: Filter by folder (board) open/archived status.
    closed_after: {}
    closed_at:
      description: Filter by close date range (closed_at).
    closed_before: {}
    company_id:
      description: Filter by client company (via the task's project).
    created_at:
      description: Filter by creation date range (created_at).
    creator_id:
      description: Filter by the person who created the task.
    custom_fields:
      description: Filter by custom field values.
    date_range:
      description: Filter tasks overlapping a date range (for timeline/Gantt views).
    dependency_type:
      description: 'Filter by dependency type: blocking, waiting on, or linked.'
    due_date:
      description: Filter by due date range (due_date).
    due_date_after: {}
    due_date_before: {}
    due_date_new:
      description: Return tasks due on this exact date.
    due_date_on: {}
    folder_id:
      description: Filter by folder ID (alias for board_id).
    folder_name:
      description: Filter by folder name (alias for board_name).
    folder_status:
      description: Filter by whether the folder is active or archived (alias for board_status).
    full_query:
      description: Full-text search across task fields.
    fuzzy_dates:
      description: Fuzzy date matching across task date fields.
    fuzzy_people:
      description: Fuzzy match by people related to the task.
    id:
      description: Filter by task ID.
    initial_estimate:
      description: Filter by initial time estimate (in seconds).
    jump_query:
      description: Quick jump search by task name or number.
    last_activity:
      description: Filter by last activity date range (last_activity_at).
    last_activity_after: {}
    last_activity_before: {}
    last_actor_id:
      description: Filter by the person who last acted on the task.
    overdue_status:
      description: Filter by whether the task is overdue (past due date).
    parent_task_id:
      description: Filter by parent task (to find subtasks of a specific task).
    person_type: {}
    project_id:
      description: Filter by project ID.
    project_manager_id:
      description: Filter by the project's responsible person.
    project_type:
      description: 'Filter by project type: internal (overhead) or client (billable).'
    public_access:
      description: Filter by task privacy (deprecated — use `private` filter instead).
    query:
      description: Quick search matching task title and number.
    query_extended:
      description: Extended search matching title, number, and description.
    remaining_time:
      description: Filter by remaining time (in seconds).
    repeating:
      description: Filter to include only repeating tasks (those with a repeat schedule).
    service_id:
      description: Filter by associated service ID.
    start_date:
      description: Filter by start date range (start_date).
    start_date_after: {}
    start_date_before: {}
    status:
      description: Filter by open (1) or closed (2) status.
    subscriber_id:
      description: Filter by subscriber (person subscribed to the task).
    subtask:
      description: Filter to include only subtasks (tasks with a parent task).
    task_list_id:
      description: Filter by task list (milestone) ID.
    task_list_name:
      description: Filter by task list name (text search).
    task_list_status:
      description: Filter by task list open/archived status.
    task_number:
      description: Filter by task number (text search).
    task_type:
      description: Filter by task type (task, subtask, or milestone).
    template:
      description: Return only template tasks.
    title:
      description: Filter by task title (text search).
    type_id:
      description: Filter by task type (task, subtask, or milestone).
    updated_at:
      description: Filter by last update date range (updated_at).
    worked_time:
      description: Filter by worked time (in seconds).
    workflow_id:
      description: Filter by workflow ID (via the task's workflow status).
    workflow_status_category_id:
      description: 'Filter by status category: not started (1), started (2), or closed (3).'
