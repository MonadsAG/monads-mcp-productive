          example:
            eq: value
        last_activity:
          type: string
          title: Last Activity
          format: date
          description: Timestamp of the most recent activity on this task.
          example:
            eq: value
        folder_position:
          title: Folder Position
          description: Sort position of this task within its folder.
          example:
            eq: value
