  requestBodies:
    task_reposition:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Single task record in JSON:API format.
            properties:
              data:
                type: object
                description: A task resource object.
                properties:
                  attributes:
                    type: object
                    description: Attributes describing the reorder — relative position and scope.
                    properties:
                      move_after_id:
                        anyOf:
                          - type: integer
                          - type: 'null'
                        description: Place the task directly after the task with this ID. When both `move_before_id` and `move_after_id` are passed, the task is placed between them.
                        example: 555
                      move_before_id:
                        anyOf:
                          - type: integer
                          - type: 'null'
                        description: Place the task directly before the task with this ID.
                        example: 555
                      subtask:
                        type: boolean
                        description: When `true`, reorder within the parent task's subtask order instead of within the task list. Defaults to `false`.
                        example: true
                    example:
                      move_after_id: 555
                  type:
                    enum:
                      - tasks
                    type: string
                required:
                  - type
                example:
                  type: tasks
                  attributes:
                    move_after_id: 555
            required:
              - data
            example:
              data:
                type: tasks
                attributes:
                  move_after_id: 555
      required: true
      description: 'Request body for reordering a task — pass `move_before_id` and/or `move_after_id` to position relative to siblings. Set `subtask: true` to reorder within a parent task''s subtasks instead of within the task list.'
    task_move_dependent:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Single task record in JSON:API format.
            properties:
              data:
                type: object
                description: A task resource object.
                properties:
                  attributes:
                    type: object
                    description: Attributes describing the shift — working-day offset and root-task scope.
                    properties:
                      days_count:
                        type: integer
                        description: Signed integer — number of **working days** to shift the task and its blocking-dependent tasks. Positive values shift forward; negative values shift backward. `0` is a no-op.
                        example: 5
                      skip_root_task:
                        type: boolean
                        default: false
                        description: When `true`, only the dependent tasks are shifted and the root task remains in place. Defaults to `false`.
                        example: false
                    required:
                      - days_count
                    example:
                      days_count: 5
                      skip_root_task: false
                  type:
                    enum:
                      - tasks
                    type: string
                required:
                  - type
                  - attributes
                example:
                  type: tasks
                  attributes:
                    days_count: 5
                    skip_root_task: false
            required:
              - data
            example:
              data:
                type: tasks
                attributes:
                  days_count: 5
                  skip_root_task: false
      required: true
      description: Request body for shifting a task and its blocking-dependent tasks by a number of working days. See [`PATCH /tasks/{id}/move_dependent`](#tag/Tasks/operation/tasks-move-dependent-move-dependent) for the full semantics.
    task_update:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Single task record in JSON:API format.
            properties:
              data:
                type: object
                description: A task resource object.
                properties:
                  relationships:
                    $ref: '#/components/schemas/_task_update_relationships'
                  type:
                    enum:
                      - tasks
                    type: string
                  attributes:
                    $ref: '#/components/schemas/_task_update_attributes'
                required:
                  - type
                example:
                  type: tasks
                  attributes:
                    title: New title
            required:
              - data
            example:
              data:
                type: tasks
                attributes:
                  title: New title
      description: Request body for creating or updating a task.
    task:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Single task record in JSON:API format.
            properties:
              data:
                type: object
                description: A task resource object.
                properties:
                  attributes:
                    $ref: '#/components/schemas/_task_create_attributes'
                  relationships:
                    $ref: '#/components/schemas/_task_create_relationships'
                  type:
                    enum:
                      - tasks
                    type: string
                required:
                  - type
                  - attributes
                example:
                  eq: value
            required:
              - data
            example:
              data:
                type: tasks
                attributes:
                  title: Implement user authentication
                  description: Set up OAuth2 authentication with Google and GitHub providers
                  due_date: '2026-03-31'
                  start_date: '2026-03-15'
                  private: false
                relationships:
                  task_list:
                    data:
                      type: task_lists
                      id: '14308'
                  assignee:
                    data:
                      type: people
                      id: '12'
                  workflow_status:
                    data:
                      type: workflow_statuses
                      id: '224'
        application/vnd.api+json; ext=bulk:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      $ref: '#/components/schemas/_task_create_attributes'
                    relationships:
                      $ref: '#/components/schemas/_task_create_relationships'
                    type:
                      enum:
                        - tasks
                      type: string
                  required:
                    - type
                    - attributes
                maxItems: 50
                minItems: 1
            required:
              - data
      required: true
      description: Request body for creating or updating a task.
    task_copy:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Single task record in JSON:API format.
            properties:
              data:
                type: object
                description: A task resource object.
                properties:
                  attributes:
                    $ref: '#/components/schemas/_task_copy_attributes'
                  type:
                    enum:
                      - tasks
                    type: string
                required:
                  - type
                  - attributes
                example:
                  type: tasks
                  attributes:
                    title: 'Copy of: Triage incoming support ticket'
                    template_id: 123456
                    project_id: 999
                    task_list_id: 4242
                    workflow_status_id: 1
                    private: false
                    copy_assignee: true
                    copy_description: true
                    copy_open_todos: true
                    copy_date: true
            required:
              - data
            example:
              data:
                type: tasks
                attributes:
                  title: 'Copy of: Triage incoming support ticket'
                  template_id: 123456
                  project_id: 999
                  task_list_id: 4242
                  workflow_status_id: 1
                  private: false
                  copy_assignee: true
                  copy_description: true
                  copy_open_todos: true
                  copy_date: true
        application/vnd.api+json; ext=bulk:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      $ref: '#/components/schemas/_task_copy_attributes'
                    type:
                      enum:
                        - tasks
                      type: string
                  required:
                    - type
                    - attributes
                maxItems: 100
                minItems: 1
            required:
              - data
      required: true
      description: 'Request body for copying a task — pass the source `template_id` and target placement (`project_id`, `task_list_id`, `workflow_status_id`). Optionally set `parent_task_id` to copy as a subtask, or `copy_as_task_template: true` + `template_description` to register the result as a reusable task template.'
