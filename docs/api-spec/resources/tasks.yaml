paths:
  /api/v2/tasks/copy:
    post:
      tags:
        - Tasks
      summary: Copies a task
      operationId: tasks-copy-copy
      description: |-
        Creates a new task by copying a **source task** (`template_id`) into a target project, task list, and workflow status. By default only the task shell is copied; enable the `copy_*` flags to duplicate its details.

        Required: `title`, `template_id` (the source task), `project_id`, `task_list_id`, `workflow_status_id`, and `private`.

        Set `parent_task_id` to copy the source as a **subtask** under another task. Set `copy_as_task_template: true` together with `template_description` to save the result as a reusable task template.

        ### Copy flags

        All `copy_*` flags default to `false`. Each flag is evaluated independently — the source task is always copied; the flags control which related data follows.

        | Flag(s) | Prerequisite | Notes |
        |---|---|---|
        | `copy_open_subtasks`, `copy_closed_subtasks` | — | Recursive — subtask copying respects the same `copy_*` flags |
        | `copy_open_todos`, `copy_closed_todos` | — | — |
        | `copy_comments`, `copy_description`, `copy_attachments`, `copy_subscribers` | — | — |
        | `copy_assignee`, `copy_tags`, `copy_date`, `copy_repeat`, `copy_estimate` | — | — |
        | `copy_task_dependencies` | — | Blocking, waiting-on, and linked |
        | `copy_custom_fields` | — | Task custom field values |
        | `copy_as_task_template` | — | Registers the result as a reusable task template |

        `private: true` rejects `copy_open_subtasks`, `copy_closed_subtasks`, and `copy_as_task_template` (`422 task_private_not_allowed`). `copy_as_task_template: true` rejects `copy_task_dependencies` (`422 task_dependencies_not_allowed_on_template`).

        ### Minimal copy (shell only)
        ```json
        {
          "data": {
            "type": "tasks",
            "attributes": {
              "title": "New empty task from source",
              "template_id": 5560123,
              "project_id": 31002,
              "task_list_id": 7781,
              "workflow_status_id": 101,
              "private": false
            }
          }
        }
        ```

        ### Full copy with task details
        ```json
        {
          "data": {
            "type": "tasks",
            "attributes": {
              "title": "Onboarding checklist — Acme",
              "template_id": 5560123,
              "project_id": 31002,
              "task_list_id": 7781,
              "workflow_status_id": 101,
              "private": false,
              "copy_assignee": true,
              "copy_date": true,
              "copy_repeat": true,
              "copy_estimate": true,
              "copy_description": true,
              "copy_tags": true,
              "copy_subscribers": true,
              "copy_attachments": true,
              "copy_comments": true,
              "copy_custom_fields": true,
              "copy_open_todos": true,
              "copy_open_subtasks": true,
              "copy_task_dependencies": true
            }
          }
        }
        ```
      parameters:
        - $ref: '#/components/parameters/include_task'
        - $ref: '#/components/parameters/fields'
      requestBody:
        $ref: '#/components/requestBodies/task_copy'
      responses:
        '201':
          $ref: '#/components/responses/single_or_collection_task'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_task'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/tasks:
    get:
      tags:
        - Tasks
      summary: Get tasks
      operationId: tasks-index
      description: |-
        Returns a paginated list of tasks — the assignable work items inside a project's task lists. 
        Supports filtering by project, task list, folder, parent task, assignee, creator, workflow status, dates (created, due, start, closed, last activity), tags, custom fields, subscribers, dependencies, and free-text query. 
        Sortable by task number, due date, start date, last activity, placement, and workflow status.
      parameters:
        - $ref: '#/components/parameters/filter_task'
        - $ref: '#/components/parameters/sort_task'
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_number'
        - $ref: '#/components/parameters/page_after'
        - $ref: '#/components/parameters/include_task'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/header_count'
        - $ref: '#/components/parameters/header_no_count'
      responses:
        '200':
          $ref: '#/components/responses/collection_task'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Tasks
      summary: Create a task
      operationId: tasks-create
      description: |-
        Creates a task inside a task list. Requires `title`, `project_id`, `task_list_id`, and `workflow_status_id`. To create the task as a subtask of another task, also set `parent_task_id`.

        ```json
        {
          "data": {
            "type": "tasks",
            "attributes": {
              "title": "Draft Q3 launch plan",
              "project_id": 31002,
              "task_list_id": 7781,
              "workflow_status_id": 101,
              "assignee_id": 5634,
              "due_date": "2026-06-15"
            }
          }
        }
        ```
      parameters:
        - $ref: '#/components/parameters/include_task'
        - $ref: '#/components/parameters/fields'
      requestBody:
        $ref: '#/components/requestBodies/task'
      responses:
        '201':
          $ref: '#/components/responses/single_or_collection_task'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_task'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/tasks/{id}:
    get:
      tags:
        - Tasks
      summary: Gets a task
      operationId: tasks-show
      description: Returns a single task by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/include_task'
        - $ref: '#/components/parameters/fields'
      responses:
        '200':
          $ref: '#/components/responses/single_task'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Tasks
      summary: Update a task
      operationId: tasks-update
      description: |-
        Updates a task. Only the provided attributes are modified — rename it via `title`, change its workflow status via `workflow_status_id`, reassign via `assignee_id`, toggle `private`, or move it to a different task list via `task_list_id`. 
        To reorder the task within its task list, use [`PATCH /tasks/{id}/reposition`](#tag/Tasks/operation/tasks-reposition-reposition). 
        To shift the task and its blocking dependent tasks by working days, use [`PATCH /tasks/{id}/move_dependent`](#tag/Tasks/operation/tasks-move-dependent-move-dependent).
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/include_task'
        - $ref: '#/components/parameters/fields'
      requestBody:
        $ref: '#/components/requestBodies/task_update'
      responses:
        '200':
          $ref: '#/components/responses/single_task'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_task'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Tasks
      summary: Deletes a task
      operationId: tasks-destroy
      description: Permanently deletes a task by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '409':
          $ref: '#/components/responses/conflict'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/tasks/{id}/move_dependent:
    patch:
      tags:
        - Tasks
      summary: Moves a task and its dependent tasks by a given number of working days
      operationId: tasks-move-dependent-move-dependent
      description: |-
        Shifts a task and all of its **blocking-dependent** tasks forward or backward by a number of **working days**. Useful for re-baselining a Gantt schedule when an upstream task slips.

        Pass `days_count` as a signed integer — positive shifts forward, negative shifts backward. The shift counts only **working days** (weekends and configured non-working days from the organization's working hours are skipped). Closed tasks, tasks without a `due_date`, and tasks the caller cannot access are silently excluded from the move.

        The dependent graph is walked recursively via blocking dependencies (`task_dependency` rows of type *blocking*).

        Set `skip_root_task: true` to shift only the dependents and leave the root task in place — useful when only downstream work needs to slide. Defaults to `false`.

        Each moved task gets a `Gantt - Move dependent tasks` activity entry for auditability.

        Returns `422` if shifting the dates would conflict with existing time bookings on any of the moved tasks (booking constraints are validated up-front, no partial moves are persisted).

        ```json
        {
          "data": {
            "type": "tasks",
            "attributes": {
              "days_count": 5,
              "skip_root_task": false
            }
          }
        }
        ```
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/task_move_dependent'
      responses:
        '200':
          $ref: '#/components/responses/single_task'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_task'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/tasks/{id}/reposition:
    patch:
      tags:
        - Tasks
      summary: Repositions a task
      operationId: tasks-reposition-reposition
      description: |-
        Reorders a task within its task list. Pass `move_before_id` and/or `move_after_id` — the IDs of sibling tasks to position it relative to. When both are provided, the task is placed between them.

        Set `subtask: true` to reorder within the parent task's subtask order instead of within the task list.

        ```json
        {
          "data": {
            "type": "tasks",
            "attributes": { "move_after_id": 5560100 }
          }
        }
        ```
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/task_reposition'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unprocessable_content'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
