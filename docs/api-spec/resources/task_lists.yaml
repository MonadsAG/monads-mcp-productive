      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    single_task_list:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single task_list record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned task_list resource.
                properties:
                  attributes:
                    type: object
                    description: Task list attributes.
                    properties:
                      archived_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_task_list/properties/archived_at'
                          - type: 'null'
                        description: The timestamp when this task list was archived, or null if active.
                      email_key:
                        $ref: '#/components/schemas/resource_task_list/properties/email_key'
                      name:
                        $ref: '#/components/schemas/resource_task_list/properties/name'
                      placement:
                        anyOf:
                          - $ref: '#/components/schemas/resource_task_list/properties/placement'
                          - type: 'null'
                        description: Integer sort key used to order task lists.
                      position:
                        anyOf:
                          - $ref: '#/components/schemas/resource_task_list/properties/position'
                          - type: 'null'
                        description: The display position of this task list within its folder.
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Task list relationships.
                    properties:
                      folder:
