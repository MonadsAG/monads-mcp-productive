openapi: 3.1.0
info:
  title: Productive.io API – Task Lists
  version: 2.0.0
description: |-
  The Task list object represents a task list within the project management system. It sits between Folders and Tasks, meaning it belongs to a folder and contains multiple tasks.

  You can find out more about task lists in our Help documentation: [Task lists](https://help.productive.io/en/articles/2179617-task-lists)

  Following diagram shows task lists in our data hierarchy:

  ```d2
  ...@template
  # template cant import globs just yet
  * {
    class: default
  }

  # Define actors
  project: Project
  folder: Folder
  task_list: Task list {
    class: primary
  }
  task: Task
  comments: Comments
  subtasks: Subtasks
  todos: Todos

  # define connections
  project -> folder -> task_list -> task
  task -> comments
  task -> subtasks
  task -> todos
  ```
x-filters:
  task_list:
    folder_id:
      description: Filter by folder ID (alias for board_id).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by task list ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by project ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Filter by task list name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    restorable:
      description: Filter to task lists that are archived but whose parent folder is still active (can be restored).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by task list status (active or archived).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/task_lists/{id}/archive:
    patch:
      tags:
        - Task Lists
      summary: Archives a task list
      operationId: task_lists-archive-archive
      description: Archives a task list, hiding it from active task list views. Reversible via [`/task_lists/{id}/restore`](#tag/Task-Lists/operation/task_lists-restore-restore).
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_task_list'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/task_lists/copy:
    post:
      tags:
        - Task Lists
      summary: Copies a task list
      operationId: task_lists-copy-copy
      description: |-
        Creates a new task list by copying a **source task list** (`template_id`) into a target project and folder. By default only the task list shell is copied; enable the `copy_*` flags to duplicate its tasks and their details.

        Required: `name`, `template_id` (the source task list), `project_id`, and the target `folder_id`.

        ### Copy flags

        All `copy_*` flags default to `false`. Every flag below requires the "tasks" gate — at least one of `copy_open_tasks` / `copy_closed_tasks`.

        | Flag(s) | Prerequisite | Notes |
        |---|---|---|
        | `copy_open_tasks`, `copy_closed_tasks` | — | The "tasks" gate |
        | `copy_task_comments`, `copy_task_description`, `copy_task_subscribers`, `copy_task_attachments` | `copy_open_tasks` or `copy_closed_tasks` | — |
        | `copy_task_open_todos`, `copy_task_closed_todos` | `copy_open_tasks` or `copy_closed_tasks` | — |
        | `copy_task_open_subtasks`, `copy_task_closed_subtasks` | `copy_open_tasks` or `copy_closed_tasks` | — |
        | `copy_task_dependencies` | `copy_open_tasks` or `copy_closed_tasks` | — |
        | `copy_assignees`, `copy_tags`, `copy_date`, `copy_repeat`, `copy_estimate` | `copy_open_tasks` or `copy_closed_tasks` | — |
        | `copy_custom_fields` | `copy_open_tasks` or `copy_closed_tasks` | Task custom field values |

        Enabling any dependent flag without a tasks gate returns `422` (`tasks_required`).

        ### Minimal copy (shell only)
        ```json
        {
          "data": {
            "type": "task_lists",
            "attributes": {
              "name": "Sprint 5",
              "template_id": 884412,
              "project_id": 31002,
              "folder_id": 7781
            }
          }
        }
        ```

        ### Full copy with tasks
        ```json
        {
          "data": {
            "type": "task_lists",
            "attributes": {
              "name": "Sprint 5 (copy)",
              "template_id": 884412,
              "project_id": 31002,
              "folder_id": 7781,
              "copy_open_tasks": true,
              "copy_task_comments": true,
              "copy_task_description": true,
              "copy_task_subscribers": true,
              "copy_task_attachments": true,
              "copy_task_open_todos": true,
              "copy_task_open_subtasks": true,
              "copy_task_dependencies": true,
              "copy_assignees": true,
              "copy_tags": true,
              "copy_date": true,
              "copy_repeat": true,
              "copy_estimate": true,
              "copy_custom_fields": true
            }
          }
        }
        ```
      requestBody:
        $ref: '#/components/requestBodies/task_list_copy'
      responses:
        '201':
          $ref: '#/components/responses/single_task_list'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_task_list'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/task_lists:
    get:
      tags:
        - Task Lists
      summary: Get task lists
      operationId: task_lists-index
      description: Returns a paginated list of task lists — the task groupings inside a project's folders. By default, task lists that belong to project templates are excluded; filtering by a specific project returns its task lists even when that project is a template. Supports filtering by project, folder, status, and free-text query, and sorting by board, folder, project, or company name.
      parameters:
        - $ref: '#/components/parameters/filter_task_list'
        - $ref: '#/components/parameters/sort_task_list'
      responses:
        '200':
          $ref: '#/components/responses/collection_task_list'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Task Lists
      summary: Create a task list
      operationId: task_lists-create
      description: |-
        Creates a task list inside a folder. Requires a `name`, the `project_id`, and the target `folder_id`.

        ```json
        {
          "data": {
            "type": "task_lists",
            "attributes": {
              "name": "Sprint 5",
              "project_id": 31002,
              "folder_id": 7781
            }
          }
        }
        ```
      requestBody:
        $ref: '#/components/requestBodies/task_list'
      responses:
        '201':
          $ref: '#/components/responses/single_task_list'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_task_list'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/task_lists/{id}/move:
    patch:
      tags:
        - Task Lists
      summary: Moves a task list
      operationId: task_lists-move-move
      description: |-
        Moves a task list — and all of its tasks — to a different folder, optionally in a different project. Provide the target `folder_id`.

        When the target project uses a **different workflow** than the source, a `map` of workflow status IDs is required: keys are the source workflow's status IDs, values are the target workflow's status IDs. The map must cover **every** status in the source workflow.

        Tasks are reassigned to the target project and their statuses remapped accordingly. Assignees and subscribers who are not members of the target project are removed from the moved tasks.

        ```json
        {
          "data": {
            "type": "task_lists",
            "attributes": {
              "folder_id": 9912,
              "map": { "101": 205, "102": 206, "103": 207 }
            }
          }
        }
        ```
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/task_list_move'
      responses:
        '200':
          $ref: '#/components/responses/single_task_list'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_task_list'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/task_lists/{id}/reposition:
    patch:
      tags:
        - Task Lists
      summary: Repositions a task list
      operationId: task_lists-reposition-reposition
      description: |-
        Reorders a task list among the other task lists in its project. Pass `move_before_id` and/or `move_after_id` — the IDs of the task lists to position it relative to. When both are provided, the task list is placed between them.

        ```json
        {
          "data": {
            "type": "task_lists",
            "attributes": { "move_after_id": 7740 }
          }
        }
        ```
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/task_list_reposition'
      responses:
        '200':
          $ref: '#/components/responses/single_task_list'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/task_lists/{id}/restore:
    patch:
      tags:
        - Task Lists
      summary: Restores a task list
      operationId: task_lists-restore-restore
      description: Restores an archived task list back to active status.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_task_list'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/task_lists/{id}:
    get:
      tags:
        - Task Lists
      summary: Gets a task list
      operationId: task_lists-show
      description: Returns a single task list by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_task_list'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Task Lists
      summary: Update a task list
      operationId: task_lists-update
      description: Updates a task list. Only the provided attributes are modified — rename it or reassign it to a different folder via `folder_id`. To relocate a task list to a **different project** (which remaps task workflow statuses), use [`PATCH /task_lists/{id}/move`](#tag/Task-Lists/operation/task_lists-move) instead.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/task_list_update'
      responses:
        '200':
          $ref: '#/components/responses/single_task_list'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_task_list'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content_task_list:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
