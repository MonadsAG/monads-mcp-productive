    resource_exchange_rate:
      type: object
      title: Exchange rate Resource
      description: A set of currency exchange rates for a specific date, used to convert amounts between currencies.
      properties:
        date:
          type: string
          title: Date
          format: date
          description: The date for which these exchange rates are valid.
          example:
            gt: '2026-01-01'
        out_of_date:
          type: boolean
          title: Out Of Date
          description: Whether these exchange rates are flagged as out of date and may not reflect current market rates.
          example:
            gt: '2026-01-01'
        rates:
          type: string
          title: Rates
          description: An array of currency conversion rates, each with a base currency, target currency, and the corresponding rate value.
