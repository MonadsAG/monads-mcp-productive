    collection_exchange_rate:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of exchange rate records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: An exchange rate resource object.
                  properties:
                    attributes:
                      type: object
                      description: Exchange rate attributes.
                      properties:
                        date:
                          $ref: '#/components/schemas/resource_exchange_rate/properties/date'
                        out_of_date:
                          $ref: '#/components/schemas/resource_exchange_rate/properties/out_of_date'
                        rates:
                          type: array
                          items:
                            type: object
                            properties:
                              base:
                                type: string
                              rate:
                                type: number
                              target:
                                type: string
                          title: Rates
                          description: Array of exchange rate entries, each with base currency, target currency, and rate.
                      example:
                        eq: value
                    relationships:
                      type: object
                      properties: {}
                      description: Exchange rate relationships.
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of exchange rate resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '567'
                  type: exchange_rates
                  attributes:
                    from_currency: EUR
                    to_currency: USD
                    rate: '1.0834'
                    date: '2026-03-15'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection exchange rate
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
