openapi: 3.1.0
info:
  title: Productive.io API – Exchange Rates
  version: 2.0.0
description: |-
  **Exchange rates** define currency conversion ratios applied across financial calculations in Productive — used when converting budget amounts, costs, and revenues between currencies in multi-currency organizations.

  Query exchange rates to understand the conversions applied to financial data for a given date.
x-filters:
  exchange_rate:
    out_of_date:
      description: Filter to include only exchange rates that are out of date (i.e. not reflecting the latest rates).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    date:
      description: Filter by exchange rate date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/exchange_rates:
    get:
      tags:
        - Exchange Rates
      summary: Get exchange rates
      responses:
        '200':
          $ref: '#/components/responses/collection_exchange_rate'
      parameters:
        - $ref: '#/components/parameters/filter_exchange_rate'
        - $ref: '#/components/parameters/sort_exchange_rate'
        - $ref: '#/components/parameters/header_organization'
      operationId: exchange_rates-index
      description: List exchange rates.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_exchange_rate:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - date
            - -date
          type: string
        title: Sort exchange rate
      explode: false
      required: false
      description: Sort exchange rate
    filter_exchange_rate:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.exchange_rate at the top of this file.
      required: false
      description: Filters
  schemas:
    resource_exchange_rate:
      type: object
      title: Exchange rate Resource
      properties:
        out_of_date:
          type: boolean
          title: Out Of Date
          description: Whether these exchange rates are flagged as out of date and may not reflect current market rates.
          example:
            gt: '2026-01-01'
        rates:
          type: string
          title: Rates
          description: An array of currency conversion rates, each with a base currency, target currency, and the corresponding rate value.
          example:
            gt: 0
        date:
          type: string
          title: Date
          format: date
          description: The date for which these exchange rates are valid.
          example:
            gt: '2026-01-01'
      description: A set of currency exchange rates for a specific date, used to convert amounts between currencies.
      example:
        id: '123'
        type: exchange_rates
        attributes:
          from_currency: EUR
          to_currency: USD
          rate: 1.08
          date: '2026-01-15'
        relationships: {}
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  responses:
    collection_exchange_rate:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        date:
                          $ref: '#/components/schemas/resource_exchange_rate/properties/date'
                        rates:
                          $ref: '#/components/schemas/resource_exchange_rate/properties/rates'
                        out_of_date:
                          $ref: '#/components/schemas/resource_exchange_rate/properties/out_of_date'
                    relationships:
                      type: object
                      properties: {}
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection exchange rate
