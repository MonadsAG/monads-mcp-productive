openapi: 3.1.0
info:
  title: Productive.io API – Exchange Rates
  version: 2.0.0
description: |-
  **Exchange rates** define currency conversion ratios applied across financial calculations in Productive — used when converting budget amounts, costs, and revenues between currencies in multi-currency organizations.

  Query exchange rates to understand the conversions applied to financial data for a given date.
x-filters:
  exchange_rate:
    date:
      description: Filter by exchange rate date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    out_of_date:
      description: Filter to include only exchange rates that are out of date (i.e. not reflecting the latest rates).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/exchange_rates:
    get:
      tags:
        - Exchange Rates
      summary: Get exchange rates
      operationId: exchange_rates-index
      description: List exchange rates.
      parameters:
        - $ref: '#/components/parameters/filter_exchange_rate'
        - $ref: '#/components/parameters/sort_exchange_rate'
      responses:
        '200':
          $ref: '#/components/responses/collection_exchange_rate'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
