    single_attachment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single attachment record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned attachment resource.
                properties:
                  attributes:
                    type: object
                    description: Attachment attributes.
                    properties:
                      attachable_type:
                        anyOf:
                          - $ref: '#/components/schemas/resource_attachment/properties/attachable_type'
                          - type: 'null'
                        description: The type of resource this attachment is attached to (e.g. task, deal, expense).
                      attachment_type:
                        anyOf:
                          - $ref: '#/components/schemas/resource_attachment/properties/attachment_type'
                          - type: 'null'
                        description: The attachment category or subtype.
                      aws_policy:
                        $ref: '#/components/schemas/resource_attachment/properties/aws_policy'
                      content_type:
                        $ref: '#/components/schemas/resource_attachment/properties/content_type'
                      created_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_attachment/properties/created_at'
                          - type: 'null'
                        description: The date and time when the attachment was created.
                      deleted_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_attachment/properties/deleted_at'
                          - type: 'null'
                        description: The date and time when the attachment was deleted, or null if not deleted.
                      external_id:
                        anyOf:
                          - type: string
                          - type: 'null'
                        description: The external ID of this attachment from an external source such as email.
                      message_id:
                        anyOf:
                          - type: string
                          - type: 'null'
                        description: The ID of the email message this attachment belongs to, if applicable.
                      name:
                        $ref: '#/components/schemas/resource_attachment/properties/name'
                      resized:
                        $ref: '#/components/schemas/resource_attachment/properties/resized'
                      size:
                        $ref: '#/components/schemas/resource_attachment/properties/size'
                      temp_url:
                        $ref: '#/components/schemas/resource_attachment/properties/temp_url'
                      thumb:
                        $ref: '#/components/schemas/resource_attachment/properties/thumb'
                      url:
                        $ref: '#/components/schemas/resource_attachment/properties/url'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Attachment relationships.
                    properties:
                      bill:
                        $ref: '#/components/schemas/_single_relationship'
                      comment:
                        $ref: '#/components/schemas/_single_relationship'
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      document_style:
                        $ref: '#/components/schemas/_single_relationship'
                      document_type:
                        $ref: '#/components/schemas/_single_relationship'
                      email:
                        $ref: '#/components/schemas/_single_relationship'
                      expense:
                        $ref: '#/components/schemas/_single_relationship'
                      invoice:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      page:
                        $ref: '#/components/schemas/_single_relationship'
                      purchase_order:
                        $ref: '#/components/schemas/_single_relationship'
                      task:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '890'
                type: attachments
                attributes:
                  name: design-mockup-v2.png
                  file_size: 2048000
                  content_type: image/png
                  created_at: '2026-03-10T10:00:00.000+00:00'
                  url: null
                relationships:
                  creator:
                    data:
                      type: people
                      id: '12'
              included: []
      description: Single attachment
    collection_attachment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of attachment records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: An attachment resource object.
                  properties:
                    attributes:
                      type: object
                      description: Attachment attributes.
                      properties:
                        attachable_type:
                          $ref: '#/components/schemas/resource_attachment/properties/attachable_type'
                        attachment_type:
                          anyOf:
                            - $ref: '#/components/schemas/resource_attachment/properties/attachment_type'
                            - type: 'null'
                          description: Category of attachment (e.g. file, image, document).
                        content_type:
                          $ref: '#/components/schemas/resource_attachment/properties/content_type'
                        created_at:
                          $ref: '#/components/schemas/resource_attachment/properties/created_at'
                        deleted_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_attachment/properties/deleted_at'
                            - type: 'null'
                          description: Timestamp when the attachment was soft-deleted, or null if active.
                        external_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_attachment/properties/external_id'
                            - type: 'null'
                          description: External ID for attachments imported from external email providers.
                        message_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_attachment/properties/message_id'
                            - type: 'null'
                          description: ID of the email message this attachment belongs to, if imported from email.
                        name:
                          $ref: '#/components/schemas/resource_attachment/properties/name'
                        resized:
                          $ref: '#/components/schemas/resource_attachment/properties/resized'
                        size:
                          $ref: '#/components/schemas/resource_attachment/properties/size'
                        temp_url:
                          $ref: '#/components/schemas/resource_attachment/properties/temp_url'
                        thumb:
                          $ref: '#/components/schemas/resource_attachment/properties/thumb'
                        url:
                          $ref: '#/components/schemas/resource_attachment/properties/url'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Attachment relationships.
                      properties:
                        bill:
                          $ref: '#/components/schemas/_single_relationship'
                        comment:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        document_style:
                          $ref: '#/components/schemas/_single_relationship'
                        document_type:
                          $ref: '#/components/schemas/_single_relationship'
                        email:
                          $ref: '#/components/schemas/_single_relationship'
                        expense:
                          $ref: '#/components/schemas/_single_relationship'
                        invoice:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        page:
                          $ref: '#/components/schemas/_single_relationship'
                        purchase_order:
                          $ref: '#/components/schemas/_single_relationship'
                        task:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of attachment resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '890'
                  type: attachments
                  attributes:
                    name: design-mockup-v2.png
                    file_size: 2048000
                    content_type: image/png
                    created_at: '2026-03-10T10:00:00.000+00:00'
                    url: null
                  relationships:
                    creator:
                      data:
                        type: people
                        id: '12'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection attachment
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_not_acceptable:
      enum:
        - bulk_extensions_headers_invalid
        - not_acceptable
        - read_only_mode_violation
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 406.
    error_code_not_found:
      enum:
        - not_found
        - record_not_found
        - route_not_found
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 404.
    error_code_forbidden:
      enum:
