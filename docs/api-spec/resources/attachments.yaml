openapi: 3.1.0
info:
  title: Productive.io API – Attachments
  version: 2.0.0
description: |-
  The attachment object represents files such as images, PDFs and documents that can be assigned to other objects. These include, but are not limited, to tasks, comments, expenses and purchase orders. With attachments, users can provide relevant information, resources and additional context for related objects.

  You can find more about attachments in our Help documentation: [Working with attachments](https://help.productive.io/en/articles/2179672-working-with-attachments)

  For more details on how to work with attachment files through our API please refer to [Working with attachments](https://developer.productive.io/working_with_attachments.html#working_with_attachments) guide.
x-filters:
  attachment:
    page_id:
      description: Filter by the associated document page.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who uploaded the attachment.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    fuzzy_dates:
      description: Filter by fuzzy date range (relative date expression).
      operators:
        - eq
        - not_eq
    type:
      description: Filter by file type (image, video, PDF, text, or other).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    notes_attachment:
      description: Filter to include only attachments embedded in notes.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      description: Filter by the associated task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    fuzzy_people:
      description: Filter by person using fuzzy matching.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by client company.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    comment_id:
      description: Filter by the associated comment.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    full_query:
      description: Filter by full-text search query.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by attachment ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    jump_query:
      description: Full-text jump search query for quickly finding resources.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/attachments:
    get:
      tags:
        - Attachments
      summary: Get attachments
      operationId: attachments-index
      description: List attachments with optional filters and pagination.
      parameters:
        - $ref: '#/components/parameters/filter_attachment'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_attachment'
      responses:
        '200':
          $ref: '#/components/responses/collection_attachment'
    post:
      tags:
        - Attachments
      summary: Create an attachment
      operationId: attachments-create
      description: Create a new attachment.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/attachment'
      responses:
        '201':
          $ref: '#/components/responses/single_attachment'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/attachments/{id}:
    get:
      tags:
        - Attachments
      summary: Get an attachment
      operationId: attachments-show
      description: Retrieve a single attachment by ID.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_attachment'
    patch:
      tags:
        - Attachments
      summary: Update an attachment
      operationId: attachments-update
      description: Update an attachment.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/attachment'
      responses:
        '200':
          $ref: '#/components/responses/single_attachment'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
    delete:
      tags:
        - Attachments
      summary: Delete an attachment
      operationId: attachments-destroy
      description: Delete an attachment.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '204':
          description: No Content
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_attachment:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - id
            - -id
          type: string
        title: Sort attachment
      explode: false
      required: false
      description: Sort attachment
    filter_attachment:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.attachment at the top of this file.
      required: false
      description: Filters
  responses:
    single_attachment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single attachment record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned attachment resource.
                properties:
                  relationships:
                    type: object
                    description: Attachment relationships.
                    properties:
                      email:
                        $ref: '#/components/schemas/_single_relationship'
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      invoice:
                        $ref: '#/components/schemas/_single_relationship'
                      bill:
                        $ref: '#/components/schemas/_single_relationship'
                      comment:
                        $ref: '#/components/schemas/_single_relationship'
                      document_type:
                        $ref: '#/components/schemas/_single_relationship'
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      purchase_order:
                        $ref: '#/components/schemas/_single_relationship'
                      task:
                        $ref: '#/components/schemas/_single_relationship'
                      page:
                        $ref: '#/components/schemas/_single_relationship'
                      document_style:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      expense:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                  attributes:
                    type: object
                    description: Attachment attributes.
                    properties:
                      aws_policy:
                        $ref: '#/components/schemas/resource_attachment/properties/aws_policy'
                      created_at:
                        $ref: '#/components/schemas/resource_attachment/properties/created_at'
                      size:
                        $ref: '#/components/schemas/resource_attachment/properties/size'
                      deleted_at:
                        $ref: '#/components/schemas/resource_attachment/properties/deleted_at'
                      temp_url:
                        $ref: '#/components/schemas/resource_attachment/properties/temp_url'
                      attachable_type:
                        $ref: '#/components/schemas/resource_attachment/properties/attachable_type'
                      name:
                        $ref: '#/components/schemas/resource_attachment/properties/name'
                      resized:
                        $ref: '#/components/schemas/resource_attachment/properties/resized'
                      attachment_type:
                        $ref: '#/components/schemas/resource_attachment/properties/attachment_type'
                      external_id:
                        $ref: '#/components/schemas/resource_attachment/properties/external_id'
                      message_id:
                        $ref: '#/components/schemas/resource_attachment/properties/message_id'
                      thumb:
                        $ref: '#/components/schemas/resource_attachment/properties/thumb'
                      url:
                        $ref: '#/components/schemas/resource_attachment/properties/url'
                      content_type:
                        $ref: '#/components/schemas/resource_attachment/properties/content_type'
                    example:
                      eq: value
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                id: '890'
                type: attachments
                attributes:
                  name: design-mockup-v2.png
                  file_size: 2048000
                  content_type: image/png
                  created_at: '2026-03-10T10:00:00.000+00:00'
                  url: null
                relationships:
                  creator:
                    data:
                      type: people
                      id: '12'
              included: []
      description: Single attachment
    collection_attachment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of attachment records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: An attachment resource object.
                  properties:
                    relationships:
                      type: object
                      description: Attachment relationships.
                      properties:
                        email:
                          $ref: '#/components/schemas/_single_relationship'
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        document_type:
                          $ref: '#/components/schemas/_single_relationship'
                        bill:
                          $ref: '#/components/schemas/_single_relationship'
                        page:
                          $ref: '#/components/schemas/_single_relationship'
                        purchase_order:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        expense:
                          $ref: '#/components/schemas/_single_relationship'
                        document_style:
                          $ref: '#/components/schemas/_single_relationship'
                        comment:
                          $ref: '#/components/schemas/_single_relationship'
                        task:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        invoice:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                    attributes:
                      type: object
                      description: Attachment attributes.
                      properties:
                        external_id:
                          $ref: '#/components/schemas/resource_attachment/properties/external_id'
                        content_type:
                          $ref: '#/components/schemas/resource_attachment/properties/content_type'
                        url:
                          $ref: '#/components/schemas/resource_attachment/properties/url'
                        deleted_at:
                          $ref: '#/components/schemas/resource_attachment/properties/deleted_at'
                        resized:
                          $ref: '#/components/schemas/resource_attachment/properties/resized'
                        attachment_type:
                          $ref: '#/components/schemas/resource_attachment/properties/attachment_type'
                        temp_url:
                          $ref: '#/components/schemas/resource_attachment/properties/temp_url'
                        attachable_type:
                          $ref: '#/components/schemas/resource_attachment/properties/attachable_type'
                        created_at:
                          $ref: '#/components/schemas/resource_attachment/properties/created_at'
                        thumb:
                          $ref: '#/components/schemas/resource_attachment/properties/thumb'
                        message_id:
                          $ref: '#/components/schemas/resource_attachment/properties/message_id'
                        size:
                          $ref: '#/components/schemas/resource_attachment/properties/size'
                        name:
                          $ref: '#/components/schemas/resource_attachment/properties/name'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of attachment resource objects.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                - id: '890'
                  type: attachments
                  attributes:
                    name: design-mockup-v2.png
                    file_size: 2048000
                    content_type: image/png
                    created_at: '2026-03-10T10:00:00.000+00:00'
                    url: null
                  relationships:
                    creator:
                      data:
                        type: people
                        id: '12'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection attachment
  schemas:
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    resource_attachment:
      type: object
      title: Attachment Resource
      description: An uploaded file attached to a task, comment, expense, or other entity.
      properties:
        organization:
          title: Organization
          description: The organization this attachment belongs to.
          example:
            eq: value
        deleted_at:
          type: string
          title: Deleted At
          format: date-time
          description: Timestamp when this attachment was soft-deleted. Null if not deleted.
          example:
            gt: '2026-01-01'
        notes_attachment:
          type: boolean
          title: Notes Attachment
          description: Whether this attachment is embedded in a notes or rich text field.
          example:
            gt: '2026-01-01'
        thumb:
          title: Thumb
          description: URL of a thumbnail image for previewing this attachment (for image files).
          example:
            eq: value
        resized:
          type: boolean
          title: Resized
          description: Whether resized image variants are available for this attachment.
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this attachment was uploaded.
          example:
            gt: '2026-01-01'
        document_style:
          title: Document Style
          description: The document layout style applied when rendering this attachment as a PDF.
          example:
            eq: value
        page_id:
          type: integer
          title: Page
          description: The ID of the doc page this attachment is associated with.
          example:
            - 123
        document_style_id:
          type: integer
          title: Document Style
          description: ID of the document style this attachment is associated with.
          example:
            - 123
        size:
          title: Size
          description: The file size in bytes.
          example:
            eq: value
        full_query:
          type: string
          title: Full Query
          description: Full-text search query context for this attachment.
          example:
            eq: value
        temp_url:
          title: Temp Url
          description: A temporary pre-signed URL for accessing the file, valid for a limited time.
          example:
            eq: value
        jump_query:
          type: string
          title: Jump Query
          description: Jump-to search query context for navigating to this attachment.
          example:
            eq: value
        type:
          type: integer
          title: Type
          description: The attachment type identifier (e.g. file vs embedded image).
          example:
            eq: active
        purchase_order_id:
          type: integer
          title: Purchase Order
          description: ID of the purchase order this attachment is associated with.
          example: 1234567
        task_id:
          type: integer
          title: Task
          description: The ID of the task this attachment is associated with.
          example:
            - 123
        page:
          title: Page
          description: The doc page this attachment is associated with.
          example:
            eq: value
        bill:
          title: Bill
          description: The bill this attachment is associated with.
          example:
            eq: value
        file_updated_at:
          title: File Updated At
          description: Timestamp when the file content was last updated in storage.
          example:
            gt: '2026-01-01'
        purchase_order:
          title: Purchase Order
          description: The purchase order this attachment is associated with.
          example:
            data:
              type: purchase_orders
              id: '1234567'
        deal:
          title: Deal
          description: The deal this attachment is associated with.
          example:
            eq: value
        comment:
          title: Comment
          description: The comment this attachment belongs to.
          example:
            eq: value
        creator_id:
          type: integer
          title: Creator
          description: The ID of the person who uploaded this attachment.
          example:
            - 123
        aws_policy:
          title: Aws Policy
          description: The AWS S3 presigned upload policy used for direct file uploads to object storage.
          example:
            eq: value
        company_id:
          type: integer
          title: Company
          description: The ID of the company this attachment is associated with.
          example:
            - 123
        booking_id:
          type: integer
          title: Booking
          description: ID of the booking this attachment is associated with.
          example:
            - 123
        project_id:
          type: integer
          title: Project
          description: The ID of the project this attachment is scoped to.
          example:
            - 123
        url:
          title: Url
          description: The download URL for this attachment.
          example:
            eq: value
        invoice_id:
          type: integer
          title: Invoice
          description: ID of the invoice this attachment is associated with.
          example:
            - 123
        expense_id:
          type: integer
          title: Expense
          description: ID of the expense this attachment is associated with.
          example:
            - 123
        invoice:
          title: Invoice
          description: The invoice this attachment is associated with.
          example:
            eq: value
        widget_id:
          type: integer
          title: Widget
          description: ID of the widget this attachment is associated with.
          example:
            - 123
        attachable_type:
          type: string
          title: Attachable Type
          description: The type of the parent entity this file is attached to (e.g. comment, expense, task).
          example:
            eq: active
        id:
          type: integer
          title: Id
          description: The unique identifier of this attachment.
          example:
            - 123
        content_type:
          title: Content Type
          description: The MIME content type of this file (e.g. image/png, application/pdf).
          example:
            eq: active
        fuzzy_people:
          type: integer
          title: Fuzzy People
          description: Fuzzy person references extracted from this attachment for search purposes.
          example:
            eq: value
        task:
          title: Task
          description: The task this attachment is associated with.
          example:
            eq: value
        bill_id:
          type: integer
          title: Bill
          description: ID of the bill (vendor invoice) this attachment is associated with.
          example:
            - 123
        comment_id:
          type: integer
          title: Comment
          description: The ID of the comment this attachment belongs to.
          example:
            - 123
        email:
          title: Email
          description: The email this attachment was received from or sent with.
          example:
            eq: value
        name:
          title: Name
          description: The filename of the uploaded file.
          example:
            eq: value
        external_id:
          type: integer
          title: External
          description: The external system ID for this attachment, used when synced from an integration.
          example:
            - 123
        message_id:
          type: integer
          title: Message
          description: The email thread message ID this attachment belongs to.
          example:
            - 123
        creator:
          title: Creator
          description: The person who uploaded this attachment.
          example:
            eq: value
        attachment_type:
          enum:
            - attachment
            - inline
          type: string
          title: Attachment Type
          description: The attachment category type (e.g. file, image, document).
          example:
            eq: active
        document_type_id:
          type: integer
          title: Document Type
          description: ID of the document type this attachment is associated with.
          example:
            - 123
        fuzzy_dates:
          type: string
          title: Fuzzy Dates
          format: date
          description: Fuzzy date tokens extracted from this attachment for search purposes.
          example:
            gt: '2026-01-01'
        document_type:
          title: Document Type
          description: The document type template used for generating structured PDF documents from this attachment.
          example:
            eq: active
        expense:
          title: Expense
          description: The expense this attachment is associated with (e.g. receipt or supporting document).
          example:
            eq: value
      example:
        id: '890'
        type: attachments
        attributes:
          name: design-mockup-v2.png
          file_size: 2048000
          content_type: image/png
          created_at: '2026-03-10T10:00:00.000+00:00'
          url: null
        relationships:
          creator:
            data:
              type: people
              id: '12'
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      example:
        type: tasks
        id: '42'
  requestBodies:
    attachment:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating an attachment.
            properties:
              data:
                type: object
                description: The JSON:API data object containing the attachment resource attributes and relationships.
                properties:
                  attributes:
                    type: object
                    description: Attachment attributes.
                    properties:
                      invoice_id:
                        $ref: '#/components/schemas/resource_attachment/properties/invoice_id'
                      page_id:
                        $ref: '#/components/schemas/resource_attachment/properties/page_id'
                      file_updated_at:
                        $ref: '#/components/schemas/resource_attachment/properties/file_updated_at'
                      attachable_type:
                        $ref: '#/components/schemas/resource_attachment/properties/attachable_type'
                      booking_id:
                        $ref: '#/components/schemas/resource_attachment/properties/booking_id'
                      name:
                        $ref: '#/components/schemas/resource_attachment/properties/name'
                      attachment_type:
                        $ref: '#/components/schemas/resource_attachment/properties/attachment_type'
                      purchase_order_id:
                        $ref: '#/components/schemas/resource_attachment/properties/purchase_order_id'
                      document_type_id:
                        $ref: '#/components/schemas/resource_attachment/properties/document_type_id'
                      expense_id:
                        $ref: '#/components/schemas/resource_attachment/properties/expense_id'
                      widget_id:
                        $ref: '#/components/schemas/resource_attachment/properties/widget_id'
                      temp_url:
                        $ref: '#/components/schemas/resource_attachment/properties/temp_url'
                      bill_id:
                        $ref: '#/components/schemas/resource_attachment/properties/bill_id'
                      document_style_id:
                        $ref: '#/components/schemas/resource_attachment/properties/document_style_id'
                      content_type:
                        $ref: '#/components/schemas/resource_attachment/properties/content_type'
                      task_id:
                        $ref: '#/components/schemas/resource_attachment/properties/task_id'
                      size:
                        $ref: '#/components/schemas/resource_attachment/properties/size'
                      comment_id:
                        $ref: '#/components/schemas/resource_attachment/properties/comment_id'
                    required:
                      - name
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: attachments
                attributes:
                  name: design-mockup-v2.png
                  content_type: image/png
      description: Request body for uploading an attachment. Provide the file data and the parent resource relationship (comment, task, deal, page, invoice, expense, purchase order, or bill). Supports direct upload via temp_url workflow.
