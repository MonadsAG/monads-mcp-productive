          type: string
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      required:
        - id
        - type
      example:
        type: tasks
        id: '42'
    resource_entitlement:
      type: object
      title: Entitlement Resource
      description: A time-off entitlement for a person showing allocated, used, and pending hours for an absence category.
      properties:
        allocated:
          type: number
          title: Allocated
          description: Total hours allocated to this person for the absence category in the entitlement period.
          example:
            eq: value
        approval_workflow:
          title: Approval Workflow
          description: Whether an approval workflow is required for absence requests under this entitlement.
          example:
            eq: value
        date:
          type: string
          title: Date
          format: date
          description: The reference date for this entitlement record (typically the start of the accrual period).
          example:
            gt: '2026-01-01'
        end_date:
          type: string
          title: End Date
          format: date
          description: The date when this entitlement period ends. After this date, unused hours may expire.
          example:
            gt: '2026-01-01'
        event:
          title: Event
          description: The absence category (event) this entitlement is for, such as vacation or sick leave.
          example:
            eq: value
        event_id:
          type: integer
          title: Event
          description: The ID of the absence category (event) this entitlement covers.
          example:
            - 123
        id:
          type: integer
          title: Id
          description: The unique identifier of this entitlement record.
          example:
            - 123
        note:
          type: string
          title: Note
          description: Optional note providing additional context for this entitlement allocation.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this entitlement belongs to.
          example:
            eq: value
        pending:
          type: number
          title: Pending
          description: Hours pending approval — absence bookings submitted but not yet approved.
          example:
            eq: value
        person:
          title: Person
          description: The person this entitlement applies to.
          example:
            eq: value
        person_id:
          type: integer
          title: Person
          description: The ID of the person this entitlement applies to.
          example:
            - 123
        start_date:
          type: string
          title: Start Date
          format: date
          description: The date when this entitlement period starts.
          example:
            gt: '2026-01-01'
        used:
          type: number
          title: Used
          description: Hours already used — approved absence bookings that have been taken within the entitlement period.
          example:
            eq: value
      example:
        id: '40728'
        type: entitlements
        attributes:
          start_date: '2023-02-17'
          end_date: '2023-12-31'
          allocated: '7.0'
          used: '0.0'
          pending: '0.0'
          note: null
        relationships:
          organization:
            data:
              type: organizations
              id: '109'
          event:
            meta:
              included: false
          person:
            meta:
              included: false
          approval_workflow:
            meta:
              included: false
  requestBodies:
    entitlement:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body schema for an entitlement.
            properties:
              data:
                type: object
                description: The JSON:API data object containing the entitlement resource attributes and relationships.
                properties:
                  attributes:
                    type: object
                    description: Entitlement attributes.
                    properties:
                      allocated:
                        $ref: '#/components/schemas/resource_entitlement/properties/allocated'
                      end_date:
                        $ref: '#/components/schemas/resource_entitlement/properties/end_date'
                      event_id:
                        $ref: '#/components/schemas/resource_entitlement/properties/event_id'
                      note:
                        $ref: '#/components/schemas/resource_entitlement/properties/note'
                      person_id:
                        $ref: '#/components/schemas/resource_entitlement/properties/person_id'
                      start_date:
                        $ref: '#/components/schemas/resource_entitlement/properties/start_date'
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: entitlements
                attributes:
                  start_date: '2026-01-01'
                  end_date: '2026-12-31'
                  allocated: 1200
                  note: Annual vacation entitlement 2026
                relationships:
                  event:
                    data:
                      type: events
                      id: '10'
                  person:
                    data:
                      type: people
                      id: '12'
      description: Request body for creating or updating an entitlement (time-off balance). Specify the person, event (absence category), date range, and allocated days. The used and pending amounts are system-managed based on booking activity.
