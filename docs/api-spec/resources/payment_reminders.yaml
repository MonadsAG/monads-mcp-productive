openapi: 3.1.0
info:
  title: Productive.io API – Payment reminders
  version: 2.0.0
x-filters:
  payment_reminder:
    invoice_id:
      operators:
        - eq
        - not_eq
    payment_reminder_sequence_id:
      operators:
        - eq
        - not_eq
paths:
  /api/v2/payment_reminders/{id}/copy:
    post:
      tags:
        - Payment reminders
      summary: Copy a payment reminder
      operationId: payment_reminders-copy
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '201':
          $ref: '#/components/responses/single_payment_reminder'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/payment_reminders:
    get:
      tags:
        - Payment reminders
      summary: Get payment reminders
      operationId: payment_reminders-index
      parameters:
        - $ref: '#/components/parameters/filter_payment_reminder'
        - $ref: '#/components/parameters/sort_payment_reminder'
      responses:
        '200':
          $ref: '#/components/responses/collection_payment_reminder'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Payment reminders
      summary: Create a payment reminder
      operationId: payment_reminders-create
      requestBody:
        $ref: '#/components/requestBodies/payment_reminder'
      responses:
        '201':
          $ref: '#/components/responses/single_payment_reminder'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_payment_reminder'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/payment_reminders/{id}:
    get:
      tags:
        - Payment reminders
      summary: Gets a payment reminder
      operationId: payment_reminders-show
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/single_payment_reminder'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Payment reminders
      summary: Update a payment reminder
      operationId: payment_reminders-update
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        $ref: '#/components/requestBodies/payment_reminder'
      responses:
        '200':
          $ref: '#/components/responses/single_payment_reminder'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_payment_reminder'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Payment reminders
      summary: Deletes a payment reminder
      operationId: payment_reminders-destroy
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    unprocessable_content_payment_reminder:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_payment_reminder'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    single_payment_reminder:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      bcc:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/bcc'
                      before_due_date:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/before_due_date'
                      body:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/body'
                      body_parsed:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/body_parsed'
                      cc:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/cc'
                      created_at:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/created_at'
                      deleted_at:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/deleted_at'
                      delivered_at:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/delivered_at'
                      failed_at:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/failed_at'
                      from:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/from'
                      reminder_period:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/reminder_period'
                      reminder_stopped_reason_id:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/reminder_stopped_reason_id'
                      scheduled_on:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/scheduled_on'
                      sent_at:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/sent_at'
                      stopped_at:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/stopped_at'
                      subject:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/subject'
                      subject_parsed:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/subject_parsed'
                      to:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/to'
                      updated_at:
                        $ref: '#/components/schemas/resource_payment_reminder/properties/updated_at'
                  relationships:
                    type: object
                    properties:
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      invoice:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      payment_reminder_sequence:
                        $ref: '#/components/schemas/_single_relationship'
                      updater:
                        $ref: '#/components/schemas/_single_relationship'
              included:
                type: array
                items: {}
              meta:
                $ref: '#/components/schemas/_meta'
      description: Single payment reminder
    collection_payment_reminder:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        bcc:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/bcc'
                        before_due_date:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/before_due_date'
                        body:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/body'
                        body_parsed:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/body_parsed'
                        cc:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/cc'
                        created_at:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/created_at'
                        deleted_at:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/deleted_at'
                        delivered_at:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/delivered_at'
                        failed_at:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/failed_at'
                        from:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/from'
                        reminder_period:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/reminder_period'
                        reminder_stopped_reason_id:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/reminder_stopped_reason_id'
                        scheduled_on:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/scheduled_on'
                        sent_at:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/sent_at'
                        stopped_at:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/stopped_at'
                        subject:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/subject'
                        subject_parsed:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/subject_parsed'
                        to:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/to'
                        updated_at:
                          $ref: '#/components/schemas/resource_payment_reminder/properties/updated_at'
                    relationships:
                      type: object
                      properties:
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        invoice:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        payment_reminder_sequence:
                          $ref: '#/components/schemas/_single_relationship'
                        updater:
                          $ref: '#/components/schemas/_single_relationship'
              included:
                type: array
                items: {}
              meta:
                $ref: '#/components/schemas/_meta'
      description: Collection payment reminder
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_not_acceptable:
      enum:
        - bulk_extensions_headers_invalid
        - not_acceptable
        - read_only_mode_violation
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 406.
    error_code_not_found:
      enum:
        - not_found
        - record_not_found
        - route_not_found
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 404.
    error_code_forbidden:
      enum:
        - access_denied
        - account_inactive
        - agent_role_impersonation_denied
        - automatic_invoicing_not_manageable
        - billing_catalog_list_unavailable
        - booking_conflict_resolver_unavailable
        - budget_inaccessible
        - budgets_not_manageable
        - cascade_deletion_blocked
        - custom_roles_unavailable
        - deactivated_organization
        - deal_proposal_analytics_unavailable
        - deal_proposal_public_link_unavailable
        - document_styler_unavailable
        - document_templates_unavailable
        - email_inbox_unavailable
        - entry_not_editable
        - expense_not_editable
        - feature_unavailable
        - finalized_invoice_permission
        - financials_unavailable
        - impersonation_on_account_not_allowed
        - insufficient_automation_permission
        - insufficient_project_access
        - insufficient_seats
        - invalid_impersonate_role_id_header
        - invoices_unavailable
        - login_unavailable
        - mcp_access_disabled
        - mcp_connectors_disabled
        - mcp_provider_unavailable
        - missing_slack_integration
        - no_client_access
        - no_organization_id
        - no_person
        - no_sandbox_access
        - organization_red_flagged
        - other_timer_running
        - outgoing_emails_limit_exceeded
        - payment_reminders_unavailable
        - personal_access_token_limit_exceeded
        - pipelines_limit_exceeded
        - placeholders_limit_exceeded
        - plan_limit_exceeded
        - plan_unavailable
        - private_channel_forbidden
        - recipients_limit_exceeded
        - record_not_owned
        - report_templates_unavailable
        - restricted_email_in_trialing
        - role_bill_rate_unavailable
        - role_impersonate_denied
        - select_organization
        - service_inaccessible
        - service_type_inaccessible
        - single_sign_on_invalid
        - single_sign_on_login_only
        - single_sign_on_provision_failed
        - single_sign_on_unavailable
        - subscription_expired
        - subsidiaries_unavailable
        - subsidiary_out_of_scope
        - teams_limit_exceeded
        - two_factor_login
        - unallocated_expense_inaccessible
        - webooks_limit_exceeded
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 403.
    error_code_unauthorized:
      enum:
        - invalid_auth_token
        - invalid_password
        - invalid_proposal_token
        - invalid_token_signature
        - token_expired
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 401.
    error_code_payment_reminder:
      enum:
        - bad_decimal_format
        - invalid_attribute_value
        - non_finite_number
        - null_bytes_in_params
        - reminder_from_email_unsupported
        - reminder_invoice_and_sequence_conflict
        - reminder_invoice_due_date_required
        - reminder_invoice_not_sent
        - reminder_recipients_limit_exceeded
        - reminder_trial_recipients_restricted
      type: string
      title: Error Code
      description: Every error `code` the payment reminders endpoints can return in a 422 response.
    error_code_unsupported_media_type:
      enum:
        - unsupported_content_type
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 415.
    error_code_bad_request:
      enum:
        - account_owner_missing
        - authorization_failure
        - bad_filter_request
        - bad_request
        - bad_sort_request
        - budget_report_failed
        - bulk_export_failed
        - calendar_reauthorization_required
        - changed_since_conflict
        - changed_since_invalid
        - changed_since_unsupported
