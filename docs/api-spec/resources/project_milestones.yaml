openapi: 3.1.0
info:
  title: Productive.io API – Project Milestones
  version: 2.0.0
description: |-
  **Project milestones** are dated markers on a project — a launch, a review, a deadline — with a title, icon, color, an optional note and an optional assignee. They are shown on the project and on resource planning timelines.

  Milestones are available only when the project milestones feature is enabled for the organization; otherwise the list is empty and other requests are rejected. Client users never see milestones.
x-filters:
  project_milestone:
    after:
      description: Return milestones on or after this date. The operator is ignored — the value is always an inclusive lower bound.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    assignee_id:
      description: Filter by the person assigned to the milestone.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    before:
      description: Return milestones on or before this date. The operator is ignored — the value is always an inclusive upper bound.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    date:
      description: Filter by milestone date. Besides the listed operators, `gt`, `gt_eq`, `lt` and `lt_eq` are supported.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by project milestone ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the project the milestone belongs to. Supports `eq` and `not_eq`; other operators have no effect.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Search milestones by title. `contains` matches titles containing all search terms (`not_contain` the opposite); `eq`/`not_eq` compare the exact title.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/project_milestones:
    get:
      tags:
        - Project Milestones
      summary: Get project milestones
      operationId: project_milestones-index
      description: Returns a paginated list of project milestones on projects you can view. Supports filtering by project, assignee, date or a date window (`after`/`before`), title search (`query`), and by related people, projects, tasks, deals or budgets.
      parameters:
        - $ref: '#/components/parameters/filter_project_milestone'
        - $ref: '#/components/parameters/sort_project_milestone'
      responses:
        '200':
          $ref: '#/components/responses/collection_project_milestone'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Project Milestones
      summary: Create a project milestone
      operationId: project_milestones-create
      description: |-
        Creates a milestone on a project. Requires `title`, `date`, `icon_id` and `project_id` — the project must be visible to you and cannot be a template. When `color_id` is omitted, the milestone takes the color of its project. `assignee_id` must be an active member of the project. Requires the permission to manage project milestones.

        ### Create a milestone

        ```json
        {
          "data": {
            "type": "project_milestones",
            "attributes": {
              "title": "Beta launch",
              "date": "2026-10-15",
              "icon_id": "icon-rocket-launch",
              "note": "Release to beta customers.",
              "assignee_id": 1002,
              "project_id": 7388870
            }
          }
        }
        ```
      requestBody:
        $ref: '#/components/requestBodies/project_milestone'
      responses:
        '201':
          $ref: '#/components/responses/single_project_milestone'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_project_milestone'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/project_milestones/{id}:
    get:
      tags:
        - Project Milestones
      summary: Gets a project milestone
      operationId: project_milestones-show
      description: Returns a single project milestone by ID. Use `include=project,assignee,creator` to sideload related records.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the project milestone to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/single_project_milestone'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Project Milestones
      summary: Update a project milestone
      operationId: project_milestones-update
      description: Updates a project milestone. Only the provided attributes are changed. Users who can manage milestones can change every attribute, including `project_id` to move the milestone to another project; the milestone's assignee can change only `title`, `date`, `color_id`, `icon_id` and `note`.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the project milestone to update.
      requestBody:
        $ref: '#/components/requestBodies/project_milestone_update'
      responses:
        '200':
          $ref: '#/components/responses/single_project_milestone'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_project_milestone'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Project Milestones
      summary: Deletes a project milestone
      operationId: project_milestones-destroy
      description: Deletes a project milestone. The milestone is moved to the recycle bin and can be restored through the deleted items endpoint.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the project milestone to delete.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
