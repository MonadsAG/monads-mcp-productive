    resource_project_milestone:
      type: object
      title: Project milestone Resource
      description: A dated milestone on a project, such as a launch, review or deadline. Carries a title, date, icon, color and an optional note, and can be assigned to a project member.
      properties:
        after:
          type: string
          title: After
          format: date
          description: 'Filter-only date: return milestones on or after this date.'
          example: '2026-10-01'
        assignee:
          title: Assignee
          description: The person responsible for this milestone, if any.
          example:
            data:
              type: people
              id: '1002'
        assignee_id:
          type: integer
          title: Assignee
          nullable: true
          description: ID of the person responsible for this milestone; must be an active member of the project.
          example: 1002
        before:
          type: string
          title: Before
          format: date
          description: 'Filter-only date: return milestones on or before this date.'
          example: '2026-12-31'
        color_id:
          type: string
          title: Color
          description: Color palette index this milestone is displayed with, the same palette as project colors. Returned as a string; defaults to the project's color on create.
          example: '6'
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this milestone was created.
          example: '2026-09-01T10:15:00.000+02:00'
        creator:
          title: Creator
          description: The person who created this milestone.
          example:
            data:
              type: people
              id: '1001'
        date:
          type: string
          title: Date
          format: date
          description: The day this milestone falls on (`YYYY-MM-DD`, without time or time zone).
          example: '2026-10-15'
        icon_id:
          type: string
          title: Icon
          description: The icon identifier displayed for this milestone. The API accepts any string — the Productive UI uses identifiers from its icon set (e.g. `icon-rocket-launch`).
          example: icon-rocket-launch
        id:
          type: integer
          title: Id
          description: The unique identifier of this milestone.
          example: 42
        note:
          type: string
          title: Note
          nullable: true
          description: Optional free-text note with more detail about this milestone.
          example: Release to beta customers.
        organization:
          title: Organization
          description: The organization this milestone belongs to.
          example:
            data:
              type: organizations
              id: '109'
        project:
          title: Project
          description: The project this milestone belongs to.
          example:
            data:
              type: projects
              id: '7388870'
        project_id:
          type: integer
          title: Project
          description: ID of the project this milestone belongs to.
          example: 7388870
        query:
          type: string
          title: Query
          description: A text search query to filter milestones by title.
          example: launch
        title:
          type: string
          title: Title
          description: The name of this milestone (e.g. Beta launch).
          example: Beta launch
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when this milestone was last updated.
          example: '2026-09-01T10:15:00.000+02:00'
      example:
        id: '42'
        type: project_milestones
        attributes:
          title: Beta launch
          date: '2026-10-15'
          color_id: '6'
          icon_id: icon-rocket-launch
