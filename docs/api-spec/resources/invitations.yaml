      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 400.
    resource_invitation:
      type: object
      title: Invitation Resource
      description: A pending user invitation to join a Productive organization, identified by an invitation token.
      properties:
        email:
          type: string
          title: Email
          description: The email address of the invited user.
          example:
            eq: value
        first_name:
          type: string
          title: First Name
          description: The first name of the invited user.
          example:
            eq: value
        last_name:
          type: string
          title: Last Name
          description: The last name of the invited user.
          example:
            eq: value
        newsletter_consent:
          type: boolean
          title: Newsletter Consent
          description: Whether the invited user consented to receive marketing emails.
          example:
            eq: value
        password:
          title: Password
          description: The initial password the invited user sets when accepting the invitation.
          example:
            eq: value
        time_zone:
          type: string
          title: Time Zone
          description: The time zone preference for the invited user, applied after they accept the invitation.
          example:
            gt: 0
      example:
        id: '123'
        type: invitations
        attributes:
          email: newuser@example.com
          role: member
          status: pending
          sent_at: '2026-01-15T10:00:00Z'
        relationships: {}
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  requestBodies:
    invitation:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating an invitation.
            properties:
              data:
                type: object
                description: The JSON:API data object containing the invitation resource attributes and relationships.
                properties:
                  attributes:
                    type: object
                    description: Invitation attributes.
                    properties:
                      first_name:
                        $ref: '#/components/schemas/resource_invitation/properties/first_name'
                      last_name:
                        $ref: '#/components/schemas/resource_invitation/properties/last_name'
                      newsletter_consent:
                        $ref: '#/components/schemas/resource_invitation/properties/newsletter_consent'
                      password:
                        $ref: '#/components/schemas/resource_invitation/properties/password'
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: invitations
                attributes:
                  email: newdev@example.com
                  first_name: Jordan
                  last_name: Lee
                  time_zone: Europe/London
      description: Request body for creating or updating an invitation.
