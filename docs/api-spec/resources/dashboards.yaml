openapi: 3.1.0
info:
  title: Productive.io API – Dashboards
  version: 2.0.0
description: |
  The Dashboard object represents the main component of the dashboard system.

  It functions as a container for Widgets, enabling users to edit and arrange them as needed, allowing you to have all essential information in one place.

  You can find out more about dashboards in our Help documentation for [Dashboards](https://help.productive.io/en/articles/6423123-dashboards)
x-filters:
  dashboard:
    query:
      description: Search dashboards by name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    editable:
      description: Filter to include only dashboards the current user can edit.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/dashboards/copy:
    post:
      tags:
        - Dashboards
      summary: Copy a dashboard
      operationId: dashboards-copy-copy
      description: Copy a dashboard.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_dashboard'
        '201':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Created
  /api/v2/dashboards:
    get:
      tags:
        - Dashboards
      summary: Get all dashboards
      operationId: dashboards-index
      description: List dashboards with optional filters and pagination.
      parameters:
        - $ref: '#/components/parameters/sort_dashboard'
        - $ref: '#/components/parameters/filter_dashboard'
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/collection_dashboard'
    post:
      tags:
        - Dashboards
      summary: Create a dashboard
      operationId: dashboards-create
      description: Create a new dashboard.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/dashboard'
      responses:
        '201':
          $ref: '#/components/responses/single_dashboard'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/dashboards/{id}:
    get:
      tags:
        - Dashboards
      summary: Get a dashboard
      operationId: dashboards-show
      description: Retrieve a single dashboard by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_dashboard'
    patch:
      tags:
        - Dashboards
      summary: Update a dashboard
      operationId: dashboards-update
      description: Update a dashboard.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/dashboard'
      responses:
        '200':
          $ref: '#/components/responses/single_dashboard'
    delete:
      tags:
        - Dashboards
      summary: Delete a dashboard
      operationId: dashboards-destroy
      description: Delete a dashboard.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '204':
          description: No Content
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_dashboard:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.dashboard at the top of this file.
      required: false
      description: Filters
    sort_dashboard:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort dashboard
      explode: false
      required: false
      description: Sort dashboard
  responses:
    single_dashboard:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single dashboard record in JSON:API format.
            properties:
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              data:
                type: object
                description: The JSON:API data object for the returned dashboard resource.
                properties:
                  attributes:
                    type: object
                    description: Dashboard attributes.
                    properties:
                      updated_at:
                        $ref: '#/components/schemas/resource_dashboard/properties/updated_at'
                      name:
                        $ref: '#/components/schemas/resource_dashboard/properties/name'
                      is_private:
                        $ref: '#/components/schemas/resource_dashboard/properties/is_private'
                      created_at:
                        $ref: '#/components/schemas/resource_dashboard/properties/created_at'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Dashboard relationships.
                    properties:
                      project:
                        $ref: '#/components/schemas/_single_relationship'
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                id: '34'
                type: dashboards
                attributes:
                  name: Project Overview
                  shared: false
                  created_at: '2026-01-20T09:00:00.000+00:00'
                  updated_at: '2026-03-01T10:00:00.000+00:00'
                relationships:
                  owner:
                    data:
                      type: people
                      id: '12'
              included: []
      description: Single dashboard
    collection_dashboard:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of dashboard records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A dashboard resource object.
                  properties:
                    relationships:
                      type: object
                      description: Dashboard relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        project:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                    attributes:
                      type: object
                      description: Dashboard attributes.
                      properties:
                        is_private:
                          $ref: '#/components/schemas/resource_dashboard/properties/is_private'
                        name:
                          $ref: '#/components/schemas/resource_dashboard/properties/name'
                        created_at:
                          $ref: '#/components/schemas/resource_dashboard/properties/created_at'
                        updated_at:
                          $ref: '#/components/schemas/resource_dashboard/properties/updated_at'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of dashboard resource objects.
                example:
                  - id: '123'
                    type: dashboards
                    attributes: {}
                    relationships: {}
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                - id: '34'
                  type: dashboards
                  attributes:
                    name: Project Overview
                    shared: false
                    created_at: '2026-01-20T09:00:00.000+00:00'
                    updated_at: '2026-03-01T10:00:00.000+00:00'
                  relationships:
                    owner:
                      data:
                        type: people
                        id: '12'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection dashboard
  schemas:
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    resource_dashboard:
      type: object
      title: Dashboard Resource
      description: A configurable dashboard with widgets displaying KPIs, charts, and project summaries.
      properties:
        project_id:
          type: integer
          title: Project
          description: The ID of the project this dashboard is scoped to, if project-level.
          example:
            - 123
        creator:
          title: Creator
          description: The person who created this dashboard.
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when the dashboard was created.
          example:
            gt: '2026-01-01'
        editable:
          type: boolean
          title: Editable
          description: Indicates whether the current user can edit this dashboard.
          example:
            eq: value
        project:
          title: Project
          description: The project this dashboard is scoped to, if project-level.
          example:
            eq: value
        is_private:
          type: boolean
          title: Is Private
          description: When true, this dashboard is private and only visible to the creator.
          example:
            eq: value
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when this dashboard was last updated.
          example:
            gt: '2026-01-01'
        name:
          type: string
          title: Name
          description: The display name of the dashboard.
          example:
            eq: value
        query:
          type: string
          title: Query
          description: A saved filter query applied to this dashboard's data.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this dashboard belongs to.
          example:
            eq: value
      example:
        id: '34'
        type: dashboards
        attributes:
          name: Project Overview
          shared: false
          created_at: '2026-01-20T09:00:00.000+00:00'
          updated_at: '2026-03-01T10:00:00.000+00:00'
        relationships:
          owner:
            data:
              type: people
              id: '12'
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  requestBodies:
    dashboard:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body schema for a dashboard.
            properties:
              data:
                type: object
                description: The JSON:API data object containing the dashboard resource attributes and relationships.
                properties:
                  attributes:
                    type: object
                    description: Dashboard attributes.
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_dashboard/properties/name'
                      project_id:
                        $ref: '#/components/schemas/resource_dashboard/properties/project_id'
                      is_private:
                        $ref: '#/components/schemas/resource_dashboard/properties/is_private'
                    required:
                      - name
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: dashboards
                attributes:
                  name: Project Overview
                  shared: false
      description: Request body for creating or updating a dashboard.
