    resource_dashboard:
      type: object
      title: Dashboard Resource
      description: A configurable dashboard with widgets displaying KPIs, charts, and project summaries.
      properties:
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when the dashboard was created.
          example:
            gt: '2026-01-01'
        creator:
          title: Creator
          description: The person who created this dashboard.
          example:
            eq: value
        editable:
          type: boolean
          title: Editable
          description: Indicates whether the current user can edit this dashboard.
          example:
            eq: value
        is_private:
          type: boolean
          title: Is Private
          description: When true, this dashboard is private and only visible to the creator.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The display name of the dashboard.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this dashboard belongs to.
          example:
            eq: value
        project:
          title: Project
          description: The project this dashboard is scoped to, if project-level.
          example:
            eq: value
        project_id:
          type: integer
          title: Project
          description: The ID of the project this dashboard is scoped to, if project-level.
          example:
            - 123
        query:
          type: string
          title: Query
          description: A saved filter query applied to this dashboard's data.
          example:
            eq: value
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when this dashboard was last updated.
          example:
            gt: '2026-01-01'
        memberships:
          title: Memberships
      example:
        id: '34'
        type: dashboards
        attributes:
          name: Project Overview
          shared: false
          created_at: '2026-01-20T09:00:00.000+00:00'
          updated_at: '2026-03-01T10:00:00.000+00:00'
        relationships:
          owner:
            data:
              type: people
              id: '12'
