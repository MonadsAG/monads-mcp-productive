openapi: 3.1.0
info:
  title: Productive.io API – Survey Responses
  version: 2.0.0
description: Submitted survey responses. Each response links to a survey and contains field values for each survey field. Responses can trigger automations on submission.
x-filters:
  survey_response:
    created_at:
      description: Filter by creation date range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who submitted the response.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_fields:
      description: Filter by custom field values.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    survey_id:
      description: Filter by the associated survey.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/survey_responses:
    get:
      tags:
        - Survey Responses
      summary: Get survey responses
      operationId: survey_responses-index
      description: List all survey responses.
      parameters:
        - $ref: '#/components/parameters/filter_survey_response'
        - $ref: '#/components/parameters/sort_survey_response'
      responses:
        '200':
          $ref: '#/components/responses/collection_survey_response'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Survey Responses
      summary: Create a survey response
      operationId: survey_responses-create
      description: Create a new survey response.
      requestBody:
        $ref: '#/components/requestBodies/survey_response'
      responses:
        '201':
          $ref: '#/components/responses/single_survey_response'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_survey_response'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/survey_responses/{id}:
    get:
      tags:
        - Survey Responses
      summary: Gets a survey response
      operationId: survey_responses-show
      description: Retrieve a single survey response by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the survey response to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/single_survey_response'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Survey Responses
      summary: Deletes a survey response
      operationId: survey_responses-destroy
      description: Delete a survey response by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the survey response to delete.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    single_survey_response:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single survey_response record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned survey_response resource.
                properties:
                  attributes:
                    type: object
                    description: Survey response attributes.
                    properties:
                      created_at:
                        $ref: '#/components/schemas/resource_survey_response/properties/created_at'
                      survey_fields:
                        $ref: '#/components/schemas/resource_survey_response/properties/survey_fields'
                      updated_at:
                        $ref: '#/components/schemas/resource_survey_response/properties/updated_at'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Survey response relationships.
                    properties:
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      custom_field_attachments:
                        $ref: '#/components/schemas/_collection_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      survey:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '67'
                type: survey_responses
                attributes:
                  submitted_at: '2026-03-15T10:00:00.000+00:00'
                  answers:
                    '45': 5
                relationships:
                  survey:
                    data:
                      type: surveys
                      id: '7'
                  person:
                    data:
                      type: people
                      id: '12'
              included: []
      description: Single survey response
    unprocessable_content_survey_response:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_survey_response'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    collection_survey_response:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of survey response records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A survey response resource object.
                  properties:
                    attributes:
                      type: object
                      description: Survey response attributes.
                      properties:
                        created_at:
                          $ref: '#/components/schemas/resource_survey_response/properties/created_at'
                        survey_fields:
                          $ref: '#/components/schemas/resource_survey_response/properties/survey_fields'
                        updated_at:
                          $ref: '#/components/schemas/resource_survey_response/properties/updated_at'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Survey response relationships.
                      properties:
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        custom_field_attachments:
                          $ref: '#/components/schemas/_collection_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        survey:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of survey response resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '67'
                  type: survey_responses
                  attributes:
                    submitted_at: '2026-03-15T10:00:00.000+00:00'
                    answers:
                      '45': 5
                  relationships:
                    survey:
                      data:
                        type: surveys
                        id: '7'
                    person:
                      data:
                        type: people
                        id: '12'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection survey response
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_not_acceptable:
      enum:
        - bulk_extensions_headers_invalid
        - not_acceptable
        - read_only_mode_violation
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 406.
    error_code_not_found:
      enum:
        - not_found
        - record_not_found
        - route_not_found
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 404.
    error_code_forbidden:
      enum:
        - access_denied
        - account_inactive
        - agent_role_impersonation_denied
        - automatic_invoicing_not_manageable
        - billing_catalog_list_unavailable
        - booking_conflict_resolver_unavailable
        - budget_inaccessible
        - budgets_not_manageable
        - cascade_deletion_blocked
        - custom_roles_unavailable
        - deactivated_organization
        - deal_proposal_analytics_unavailable
        - deal_proposal_public_link_unavailable
        - document_styler_unavailable
        - document_templates_unavailable
        - email_inbox_unavailable
        - entry_not_editable
        - expense_not_editable
        - feature_unavailable
        - finalized_invoice_permission
        - financials_unavailable
        - impersonation_on_account_not_allowed
        - insufficient_automation_permission
        - insufficient_project_access
        - insufficient_seats
        - invalid_impersonate_role_id_header
        - invoices_unavailable
        - login_unavailable
        - mcp_access_disabled
        - mcp_connectors_disabled
        - mcp_provider_unavailable
        - missing_slack_integration
        - no_client_access
        - no_organization_id
        - no_person
        - no_sandbox_access
        - organization_red_flagged
        - other_timer_running
        - outgoing_emails_limit_exceeded
        - payment_reminders_unavailable
        - personal_access_token_limit_exceeded
        - pipelines_limit_exceeded
        - placeholders_limit_exceeded
        - plan_limit_exceeded
        - plan_unavailable
        - private_channel_forbidden
        - recipients_limit_exceeded
        - record_not_owned
        - report_templates_unavailable
        - restricted_email_in_trialing
        - role_bill_rate_unavailable
        - role_impersonate_denied
        - select_organization
        - service_inaccessible
        - service_type_inaccessible
        - single_sign_on_invalid
        - single_sign_on_login_only
        - single_sign_on_provision_failed
        - single_sign_on_unavailable
        - subscription_expired
        - subsidiaries_unavailable
        - subsidiary_out_of_scope
        - teams_limit_exceeded
        - two_factor_login
        - unallocated_expense_inaccessible
        - webooks_limit_exceeded
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 403.
    error_code_unauthorized:
      enum:
        - invalid_auth_token
        - invalid_password
        - invalid_proposal_token
        - invalid_token_signature
        - token_expired
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 401.
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_single_linkage_nullable'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          required:
            - included
          example:
            included: false
      required:
        - meta
      example:
        meta:
          included: false
    _single_linkage_nullable:
      type: object
      title: Single nullable linkage
      properties:
        data:
          anyOf:
            - $ref: '#/components/schemas/_resource'
            - type: 'null'
      required:
        - data
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: string
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      required:
        - id
        - type
      example:
        type: tasks
        id: '42'
    _collection_relationship:
      anyOf:
        - $ref: '#/components/schemas/_collection_linkage'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    _collection_linkage:
      type: object
      title: Collection linkage
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/_resource'
      required:
        - data
    resource_survey_response:
      type: object
      title: Survey response Resource
      description: Submitted form response for a survey. Contains field values keyed by survey_field_id. Triggers any automations configured on the parent survey.
      properties:
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this survey response was created.
          example:
            gt: '2026-01-01'
        creator:
          title: Creator
          description: The person who submitted this survey response.
          example:
            eq: value
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who submitted this survey response.
          example:
            - 123
        custom_field_attachments:
          title: Custom Field Attachments
          description: File attachments associated with custom field values in this response.
          example:
            gt: '2026-01-01'
        custom_fields:
          type: string
          title: Custom Fields
          description: The custom field values submitted as part of this response.
          example:
            eq: value
        id:
          type: integer
