openapi: 3.1.0
info:
  title: Productive.io API – Templates
  version: 2.0.0
description: Reusable starting points for projects, budgets, deals, and pages. Each template wraps a real entity (its `target`) created with template semantics; the `target_type` discriminator determines the per-target shape required when creating a new template.
x-filters:
  template:
    id:
      description: Numeric identifier of the template.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Project identifier — filterable to scope templates to a specific project context.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Free-text query — matches against the wrapped target name.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    target_id:
      description: Id of the wrapped target.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    target_type:
      description: Identifies which entity type the template wraps. On create, selects the per-target `model_attributes` shape. `task` is read-only.
      operators:
        - eq
        - not_eq
    task_project_id:
      description: Filter-only field — limits task templates (`target_type=task`) to those whose underlying task belongs to the given project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/templates/copy:
    post:
      tags:
        - Templates
      summary: Copies a template into a new template target
      operationId: templates-copy
      responses:
        '201':
          $ref: '#/components/responses/single_template'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_template'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/templates:
    get:
      tags:
        - Templates
      summary: Get templates
      operationId: templates-index
      description: List templates the requester has access to. Supports filtering by id, project, target type (with `deal`/`budget` discriminated via the underlying quote), free-text query, and a task-template-only `task_project_id` filter.
      parameters:
        - $ref: '#/components/parameters/filter_template'
        - $ref: '#/components/parameters/sort_template'
      responses:
        '200':
          $ref: '#/components/responses/collection_template'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Templates
      summary: Create a template
      operationId: templates-create
      description: |-
        Create a new template. The `attributes.target_type` field is a discriminator that selects one of four creation paths, each with its own required `model_attributes` shape and permission check.

        | target_type | Creates | Required `model_attributes` keys | Permission |
        |---|---|---|---|
        | `project` | Empty workspace (no copy support — see `/projects/copy`) | `client_id`, `project_manager_id`, `project_type_id`, `workflow_id` | `projects.manage` (project manager) |
        | `budget` | New quote (or copies one when `target_id` is set) | none required; optional `editor_config`, `tracking_type_id`, `color_id` | `can_manage_budgets?` |
        | `deal` | New quote (or copies one when `target_id` is set) | none required; optional `editor_config`, `color_id`, `retainer_interval` / `retainer_interval_count` (retainer feature only) | `can_manage_deals?` |
        | `page` | New page (or copies one when `target_id` is set); supports `copy_attributes.copy_memberships` and `copy_attributes.copy_subpages` | none | `can_manage_docs?` |

        ### Create a project template (fresh workspace)
        ```json
        {
          "data": {
            "type": "templates",
            "attributes": {
              "name": "Onboarding playbook",
              "description": "Standard intake project for new clients.",
              "target_type": "project",
              "model_attributes": {
                "client_id": 412,
                "project_manager_id": 13,
                "project_type_id": 2,
                "workflow_id": 1,
                "project_color_id": 5
              }
            }
          }
        }
        ```

        ### Create a budget template (fresh quote)
        ```json
        {
          "data": {
            "type": "templates",
            "attributes": {
              "name": "Standard retainer scaffold",
              "target_type": "budget",
              "model_attributes": {
                "tracking_type_id": 1,
                "color_id": 5
              }
            }
          }
        }
        ```

        ### Create a budget template by copying an existing budget
        ```json
        {
          "data": {
            "type": "templates",
            "attributes": {
              "name": "Q3 enterprise migration template",
              "target_type": "budget",
              "target_id": "98231",
              "model_attributes": { "color_id": 5 }
            }
          }
        }
        ```

        ### Create a deal template
        ```json
        {
          "data": {
            "type": "templates",
            "attributes": {
              "name": "Standard outbound deal",
              "target_type": "deal",
              "model_attributes": {
                "color_id": 5,
                "retainer_interval": "month",
                "retainer_interval_count": 12
              }
            }
          }
        }
        ```

        ### Create a page template by copying an existing page
        ```json
        {
          "data": {
            "type": "templates",
            "attributes": {
              "name": "Engineering RFC template",
              "target_type": "page",
              "target_id": "55421",
              "copy_attributes": { "copy_memberships": false, "copy_subpages": true }
            }
          }
        }
        ```

        **Save as Template** — to create a project template from an **existing** project (boards, tasks, settings copied), use [`POST /projects/copy`](#tag/Projects/operation/projects-copy) with `attributes.copy_as_template: true`. The `target_type=project` path on this endpoint only creates a **fresh, empty** template.
      requestBody:
        $ref: '#/components/requestBodies/template'
      responses:
        '201':
          $ref: '#/components/responses/single_template'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_template'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/templates/{id}:
    get:
      tags:
        - Templates
      summary: Gets a template
      operationId: templates-show
      description: Fetch a single template by id.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Numeric template id.
      responses:
        '200':
          $ref: '#/components/responses/single_template'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Templates
      summary: Update a template
      operationId: templates-update
      description: |-
        Update a template's name, description, and target-specific fields inside `model_attributes`. The dispatcher routes to a target-aware form: `deal` updates retainer fields (when the retainer feature is enabled), `budget` updates color (propagated to the underlying budget). Renaming a template also renames the wrapped target.

        ### Rename a template
        ```json
        { "data": { "type": "templates", "attributes": { "name": "Onboarding playbook v2" } } }
        ```

        ### Update a deal template's retainer cadence
        ```json
        {
          "data": {
            "type": "templates",
            "attributes": {
              "model_attributes": {
                "retainer_interval": "month",
                "retainer_interval_count": 6
              }
            }
          }
        }
        ```

        ### Update a budget template's color
        ```json
        {
          "data": {
            "type": "templates",
            "attributes": { "model_attributes": { "color_id": 7 } }
          }
        }
        ```
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Numeric template id.
      requestBody:
        $ref: '#/components/requestBodies/template'
      responses:
        '200':
          $ref: '#/components/responses/single_template'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_template'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Templates
      summary: Deletes a template
      operationId: templates-destroy
      description: Soft-delete a template and its wrapped target. The deletion is recorded in `deleted_items` and is recoverable from Trash.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Numeric template id.
      responses:
        '204':
          description: Template soft-deleted successfully.
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
