    single_template:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Top-level JSON:API document for a single template.
            properties:
              data:
                type: object
                description: Primary JSON:API resource(s) returned.
                properties:
                  attributes:
                    type: object
                    description: Template's serialized attributes.
                    properties:
                      color_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_template/properties/color_id'
                          - type: 'null'
                        description: Color label assigned to the template.
                      created_at:
                        $ref: '#/components/schemas/resource_template/properties/created_at'
                      deleted_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_template/properties/deleted_at'
                          - type: 'null'
                        description: Timestamp marking soft deletion. Non-null values mean the template is in Trash and recoverable via the `/deleted_items` endpoint.
                      description:
                        anyOf:
                          - $ref: '#/components/schemas/resource_template/properties/description'
                          - type: 'null'
                        description: Free-text note attached to the template.
                      name:
                        anyOf:
                          - $ref: '#/components/schemas/resource_template/properties/name'
                          - type: 'null'
                        description: Display name of the template. Required on create. Updates also rename the wrapped target.
                      target_id:
                        $ref: '#/components/schemas/resource_template/properties/target_id'
                      target_type:
                        $ref: '#/components/schemas/resource_template/properties/target_type'
                      updated_at:
                        $ref: '#/components/schemas/resource_template/properties/updated_at'
                    example:
                      name: 'Offboarding: General'
                      description: Popis stvari koje trebamo obaviti kada osoba odlazi iz firme
                      target_id: '258974'
                      target_type: project
                      color_id: null
                      created_at: '2023-01-24T14:08:06.857+01:00'
                      updated_at: '2026-04-29T12:27:06.627+02:00'
                      deleted_at: null
                  relationships:
                    type: object
                    description: Related resources, returned as JSON:API resource identifiers.
                    properties:
                      filter:
                        $ref: '#/components/schemas/_single_relationship'
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      page:
                        $ref: '#/components/schemas/_single_relationship'
                      project:
                        $ref: '#/components/schemas/_single_relationship'
                      task:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      project:
                        data:
                          type: projects
                          id: '258974'
                      deal:
                        data: null
                      page:
                        data: null
                      task:
                        data: null
                      creator:
                        data:
                          type: people
                          id: '13'
                example:
                  type: templates
                  id: '18'
                  attributes:
                    name: 'Offboarding: General'
                    description: Popis stvari koje trebamo obaviti kada osoba odlazi iz firme
                    target_id: '258974'
                    target_type: project
                    color_id: null
                    created_at: '2023-01-24T14:08:06.857+01:00'
                    updated_at: '2026-04-29T12:27:06.627+02:00'
                    deleted_at: null
                  relationships:
                    project:
                      data:
                        type: projects
                        id: '258974'
                    deal:
                      data: null
                    page:
                      data: null
                    task:
                      data: null
                    creator:
                      data:
                        type: people
                        id: '13'
              included:
                type: array
                items:
                  description: A sideloaded related resource for a template.
                description: Sideloaded related resources requested via `include`.
                example: []
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                type: templates
                id: '18'
                attributes:
                  name: 'Offboarding: General'
                  description: Popis stvari koje trebamo obaviti kada osoba odlazi iz firme
                  target_id: '258974'
                  target_type: project
                  color_id: null
                  created_at: '2023-01-24T14:08:06.857+01:00'
                  updated_at: '2026-04-29T12:27:06.627+02:00'
                  deleted_at: null
                relationships:
                  project:
                    data:
                      type: projects
                      id: '258974'
                  deal:
                    data: null
                  page:
                    data: null
                  task:
                    data: null
                  creator:
                    data:
                      type: people
                      id: '13'
              meta:
                current_page: 1
              included: []
      description: Successful response containing the requested template.
    collection_template:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Top-level JSON:API document for a paginated templates collection.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A single template in the collection.
                  properties:
                    attributes:
                      type: object
                      description: Template's serialized attributes.
                      properties:
                        color_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_template/properties/color_id'
                            - type: 'null'
                          description: Color label assigned to the template.
                        created_at:
