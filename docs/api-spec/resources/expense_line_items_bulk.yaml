                        tax_rate:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        expense:
                          data:
                            type: expenses
                            id: '17'
                        tax_rate:
                          data:
                            type: tax_rates
                            id: '3'
                  example:
                    id: '42'
                    type: expense_line_items
                    attributes:
                      name: AWS hosting
                      quantity: 2
