                      unit_price_default: 16500
                      unit_price_normalized: 16500
                      currency: EUR
                      currency_default: USD
                      currency_normalized: USD
                    relationships:
                      expense:
                        data:
                          type: expenses
                          id: '17'
                      tax_rate:
                        data:
                          type: tax_rates
                          id: '3'
                example:
                  - id: '42'
                    type: expense_line_items
                    attributes:
                      name: AWS hosting
                      quantity: 2
                      unit_price: 15000
                      unit_price_default: 16500
                      unit_price_normalized: 16500
                      currency: EUR
                      currency_default: USD
                      currency_normalized: USD
                    relationships:
                      expense:
