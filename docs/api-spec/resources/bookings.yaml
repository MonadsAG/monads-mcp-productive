          approved: false
          approved_at: null
          rejected: false
          rejected_reason: null
          rejected_at: null
          canceled: false
          canceled_at: null
          booking_method_id: 1
          autotracking: false
          draft: false
          custom_fields: null
          last_activity_at: '2026-03-01T09:00:00.000+00:00'
        relationships:
          person:
            data:
              type: people
              id: '12'
          service:
            data:
              type: services
              id: '1856422'
          event:
            data: null
          task:
            data: null
    _meta:
