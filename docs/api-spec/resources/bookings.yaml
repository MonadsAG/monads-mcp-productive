openapi: 3.1.0
info:
  title: Productive.io API – Bookings
  version: 2.0.0
description: |-
  The Booking object represents a scheduled time allocation for a person, serving as a core component for tracking time, managing availability, and organizing resource allocation. There are two main types of bookings:

  1. Budget bookings - where a person is allocated to work on a specific deal/budget. These bookings are linked to a [service](https://developer.productive.io/services.html#services) object, which represents the actual work being done.

  2. Absence bookings - which track time off and remote work absences. These bookings are linked to an [event](https://developer.productive.io/events.html#events) object, representing the type of absence (time off or remote work).

  Each booking method defines how time is allocated and requires specific attributes to be set: Per day (requires `hours` and `time` attributes to specify hours and time for each day), Percentage (requires `percentage` attribute to allocate a portion of a person's available time) and Total hours (requires `total_time` attribute to specify the total amount of hours for the selected period).

  Bookings can have different states depending on their type:
  - Budget bookings can be either Tentative (when there's a possibility of the time allocation but it's not yet confirmed, indicated by `draft: true`) or Confirmed
  - Absence bookings go through an approval workflow with the following states: Pending (waiting for approval), Approved, Rejected (with a reason), or Canceled (if cancelled after submitting for approval)

  Bookings can also be customized with custom fields to store additional information about booking. Custom fields allow you to add custom attributes or any other metadata relevant to your booking workflow. For more details on how to work with custom fields please refer to [Working with custom fields](https://developer.productive.io/working_with_custom_fields.html#working_with_custom_fields) guide.

  The following diagram shows bookings in our data hierarchy:

  ```d2
  ...@template
  # template cant import globs just yet
  *: {
    class: default
  }

  # Define actors
  person: Person
  service: Service
  event: Event
  booking: Booking {
    class: primary
  }

  # Define connections
  person -> booking
  service -> booking
  event -> booking
  ```
x-filters:
  booking:
    tags:
      description: Filter by tag.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    after:
      description: Filter bookings that overlap with or start after a given date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    approval_status:
      description: Filter by approval status. Use eq/not_eq to match a specific approval status value.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    approved_at:
      description: Filter by approval date range (approved_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    approver_id:
      description: Filter by the person who approved the booking.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    autotracking:
      description: Filter by whether the booking uses automatic time tracking.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    before:
      description: Filter bookings that overlap with or end before a given date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    billing_type_id:
      description: Filter by billing type.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    booking_type:
      description: Filter by booking type — project booking or absence booking.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_id:
      description: Filter by the ID of the budget (deal) associated with the booking's service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    canceled:
      description: Filter by whether the booking has been canceled (true = canceled, false = not canceled).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    canceled_at:
      description: Filter by cancellation date range (canceled_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by the client company associated with the booking's service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filter by booking creation date range (created_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_fields:
      description: Filter by custom field values.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    draft:
      description: Filter by whether the booking is a draft (tentative) or confirmed.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    ended_on:
      description: Filter by booking end date range (ended_on).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    event_id:
      description: Filter by the ID of the absence event category (e.g. vacation, sick leave).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by booking ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_activity_at:
      description: Filter by last activity date range (last_activity_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    note:
      description: Filter by booking note text content.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    origin_id:
      description: Filter by the origin booking ID (the source booking this was created from).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    people_custom_fields:
      description: Filter by custom field values on the booked person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter by the booked person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_subsidiary_id:
      description: Filter by the subsidiary the booked person belongs to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_type:
      description: Filter by the type of person assigned (e.g. employee, contractor, placeholder).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_type:
      description: Filter by project type (e.g. billable or internal).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    rejected_at:
      description: Filter by rejection date range (rejected_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    resource_request_id:
      description: Filter by the associated resource request.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    stage_type:
      description: Filter by the stage type of the booking's associated deal.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    started_on:
      description: Filter by booking start date range (started_on).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by booking status (e.g. pending, approved, rejected).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      description: Filter by the associated task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updated_at:
      description: Filter by booking last updated date range (updated_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    with_draft:
      description: When true, includes draft (tentative) bookings in results alongside confirmed bookings.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    parent_company_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/bookings:
    get:
      tags:
        - Bookings
      summary: Get bookings
      operationId: bookings-index
      description: List bookings with optional filters and pagination.
      parameters:
        - $ref: '#/components/parameters/filter_booking'
        - $ref: '#/components/parameters/sort_booking'
      responses:
        '200':
          $ref: '#/components/responses/collection_booking'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Bookings
      summary: Create a booking
      operationId: bookings-create
      description: Create a new booking.
      requestBody:
        $ref: '#/components/requestBodies/booking_create'
      responses:
        '201':
          $ref: '#/components/responses/single_booking'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_booking'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/bookings/{id}:
    get:
      tags:
        - Bookings
      summary: Gets a booking
      operationId: bookings-show
      description: Retrieve a single booking by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_booking'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Bookings
      summary: Update a booking
      operationId: bookings-update
      description: Update a booking.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/booking'
      responses:
        '200':
          $ref: '#/components/responses/single_booking'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_booking'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Bookings
      summary: Deletes a booking
      operationId: bookings-destroy
      description: Delete a booking.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_booking'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    unprocessable_content_booking:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_booking'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                      description: Extra detail about the error.
                      properties:
                        bulk_index:
                          type: integer
                          title: Bulk Index
                          description: In a bulk request, the zero-based position in `data` of the item that was rejected.
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    single_booking:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single booking record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned booking resource.
                properties:
                  attributes:
                    type: object
                    description: Booking attributes.
                    properties:
                      approved:
                        $ref: '#/components/schemas/resource_booking/properties/approved'
                      approved_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_booking/properties/approved_at'
                          - type: 'null'
                        description: The date and time when the booking was approved, or null if not yet approved.
                      autotracking:
                        $ref: '#/components/schemas/resource_booking/properties/autotracking'
                      booking_method_id:
                        $ref: '#/components/schemas/resource_booking/properties/booking_method_id'
                      canceled:
                        $ref: '#/components/schemas/resource_booking/properties/canceled'
                      canceled_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_booking/properties/canceled_at'
                          - type: 'null'
                        description: The date and time when the booking was canceled, or null if not canceled.
                      created_at:
                        $ref: '#/components/schemas/resource_booking/properties/created_at'
                      custom_fields:
                        anyOf:
                          - $ref: '#/components/schemas/resource_booking/properties/custom_fields'
                          - type: 'null'
                        description: Custom field values associated with this booking.
                      draft:
                        $ref: '#/components/schemas/resource_booking/properties/draft'
                      ended_on:
                        $ref: '#/components/schemas/resource_booking/properties/ended_on'
                      external_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_booking/properties/external_id'
                          - type: 'null'
                        description: The external ID of this booking from an external source.
                      hours:
                        $ref: '#/components/schemas/resource_booking/properties/hours'
                      last_activity_at:
                        $ref: '#/components/schemas/resource_booking/properties/last_activity_at'
                      note:
                        anyOf:
                          - $ref: '#/components/schemas/resource_booking/properties/note'
                          - type: 'null'
                        description: An optional note or description for this booking.
                      people_custom_fields:
                        anyOf:
                          - $ref: '#/components/schemas/resource_booking/properties/people_custom_fields'
                          - type: 'null'
                        description: Custom field values from the booked person's profile.
                      percentage:
                        anyOf:
                          - $ref: '#/components/schemas/resource_booking/properties/percentage'
                          - type: 'null'
                        description: The percentage of the person's working hours this booking covers.
                      rejected:
                        $ref: '#/components/schemas/resource_booking/properties/rejected'
                      rejected_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_booking/properties/rejected_at'
                          - type: 'null'
                        description: The date and time when the booking was rejected, or null if not rejected.
                      rejected_reason:
                        anyOf:
                          - $ref: '#/components/schemas/resource_booking/properties/rejected_reason'
                          - type: 'null'
                        description: The reason provided when rejecting the booking.
                      stage_type:
                        anyOf:
                          - $ref: '#/components/schemas/resource_booking/properties/stage_type'
                          - type: 'null'
                        description: The pipeline stage type of the booking's associated deal.
                      started_on:
                        $ref: '#/components/schemas/resource_booking/properties/started_on'
                      time:
                        $ref: '#/components/schemas/resource_booking/properties/time'
                      total_time:
                        $ref: '#/components/schemas/resource_booking/properties/total_time'
                      total_working_days:
                        anyOf:
                          - $ref: '#/components/schemas/resource_booking/properties/total_working_days'
                          - type: 'null'
                        description: The total number of working days in the booking period.
                      updated_at:
                        $ref: '#/components/schemas/resource_booking/properties/updated_at'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Booking relationships.
                    properties:
                      approval_statuses:
                        $ref: '#/components/schemas/_collection_relationship'
                      approver:
                        $ref: '#/components/schemas/_single_relationship'
                      attachments:
                        $ref: '#/components/schemas/_collection_relationship'
                      canceler:
