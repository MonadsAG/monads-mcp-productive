            example:
              data:
                id: '32234'
                type: project_preferences
                attributes:
                  tasks_layout_id: 104
                  created_at: '2026-01-20T10:00:00.000+00:00'
                  preferences: '{"project_last_tab":"tasks","default_tab_id":"1867-project-tasks"}'
                  watched: false
                relationships:
                  person:
                    data:
                      type: people
                      id: '12'
                  project:
                    data:
                      type: projects
                      id: '6899'
              included: []
      description: A single project preference.
