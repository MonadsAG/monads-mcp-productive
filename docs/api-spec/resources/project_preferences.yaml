    single_project_preference:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Single project preference record in JSON:API format.
            properties:
              data:
                type: object
                description: The project preference resource object.
                properties:
                  attributes:
                    type: object
                    description: Project preference attributes.
                    properties:
                      created_at:
                        $ref: '#/components/schemas/resource_project_preference/properties/created_at'
                      preferences:
                        anyOf:
                          - $ref: '#/components/schemas/resource_project_preference/properties/preferences'
                          - type: 'null'
                        description: Free-form personal view preferences for the project, as a JSON-encoded string.
                      tasks_layout_id:
                        anyOf:
                          - $ref: '#/components/schemas/resource_project_preference/properties/tasks_layout_id'
                          - type: 'null'
                        description: ID of the task layout this person uses for the project's tasks.
                      watched:
                        anyOf:
                          - $ref: '#/components/schemas/resource_project_preference/properties/watched'
                          - type: 'null'
                        description: Whether the person is automatically subscribed to new tasks created in the project.
                    example:
                      tasks_layout_id: 104
                      created_at: '2026-01-20T10:00:00.000+00:00'
                      preferences: '{"project_last_tab":"tasks","default_tab_id":"1867-project-tasks"}'
                      watched: false
                  relationships:
                    type: object
                    description: Project preference relationships.
                    properties:
                      person:
                        $ref: '#/components/schemas/_single_relationship'
                      project:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      person:
                        data:
                          type: people
                          id: '12'
                      project:
                        data:
                          type: projects
                          id: '6899'
                example:
                  id: '32234'
                  type: project_preferences
                  attributes:
                    tasks_layout_id: 104
                    created_at: '2026-01-20T10:00:00.000+00:00'
                    preferences: '{"project_last_tab":"tasks","default_tab_id":"1867-project-tasks"}'
                    watched: false
                  relationships:
                    person:
                      data:
                        type: people
                        id: '12'
                    project:
                      data:
                        type: projects
                        id: '6899'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    id: '12'
                    type: people
                    attributes:
                      first_name: Ana
                      last_name: Horvat
                      email: ana.horvat@example.com
                description: Sideloaded related resources.
                example:
                  - id: '12'
                    type: people
                    attributes:
                      first_name: Ana
                      last_name: Horvat
                      email: ana.horvat@example.com
              meta:
