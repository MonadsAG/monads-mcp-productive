                            type: people
                            id: '12'
                        project:
                          data:
                            type: projects
                            id: '6899'
                  example:
                    id: '32234'
                    type: project_preferences
                    attributes:
                      tasks_layout_id: 104
                      created_at: '2026-01-20T10:00:00.000+00:00'
                      preferences: '{"project_last_tab":"tasks","default_tab_id":"1867-project-tasks"}'
                      watched: false
                    relationships:
                      person:
                        data:
                          type: people
                          id: '12'
                      project:
                        data:
                          type: projects
                          id: '6899'
                description: Array of project preference resource objects.
                example:
                  - id: '32234'
                    type: project_preferences
                    attributes:
                      tasks_layout_id: 104
                      created_at: '2026-01-20T10:00:00.000+00:00'
                      preferences: '{"project_last_tab":"tasks","default_tab_id":"1867-project-tasks"}'
                      watched: false
                    relationships:
                      person:
                        data:
                          type: people
                          id: '12'
                      project:
                        data:
                          type: projects
                          id: '6899'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    id: '12'
                    type: people
                    attributes:
                      first_name: Ana
                      last_name: Horvat
                      email: ana.horvat@example.com
                description: Sideloaded related resources.
                example:
                  - id: '12'
                    type: people
                    attributes:
                      first_name: Ana
                      last_name: Horvat
                      email: ana.horvat@example.com
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '32234'
                  type: project_preferences
                  attributes:
                    tasks_layout_id: 104
                    created_at: '2026-01-20T10:00:00.000+00:00'
                    preferences: '{"project_last_tab":"tasks","default_tab_id":"1867-project-tasks"}'
                    watched: false
                  relationships:
                    person:
                      data:
                        type: people
                        id: '12'
                    project:
                      data:
                        type: projects
                        id: '6899'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Paginated list of project preferences.
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_request_timeout:
      enum:
