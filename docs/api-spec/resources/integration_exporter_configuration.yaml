openapi: 3.1.0
info:
  title: Productive.io API – Integration Exporter Configuration
  version: 2.0.0
description: |-
  **Integration exporter configurations** define how data is exported from Productive to external accounting and ERP systems, storing connection credentials, entity mappings, and export preferences per integration type.

  Use these endpoints to set up and maintain accounting sync pipelines for QuickBooks, Xero, or NetSuite.
x-filters:
  integration_exporter_configuration:
    company_id:
      description: Filter by client company.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/integration_exporter_configurations:
    get:
      tags:
        - Integration Exporter Configuration
      summary: Get integration exporter configurations
      operationId: integration_exporter_configurations-index
      description: List integration exporter configurations.
      parameters:
        - $ref: '#/components/parameters/filter_integration_exporter_configuration'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_integration_exporter_configuration'
      responses:
        '200':
          $ref: '#/components/responses/collection_integration_exporter_configuration'
    post:
      tags:
        - Integration Exporter Configuration
      summary: Create integration exporter configuration
      operationId: integration_exporter_configurations-create
      description: Create a new integration exporter configuration.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/integration_exporter_configuration'
      responses:
        '201':
          $ref: '#/components/responses/single_integration_exporter_configuration'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/integration_exporter_configurations/{id}:
    get:
      tags:
        - Integration Exporter Configuration
      summary: Get integration exporter configuration
      operationId: integration_exporter_configurations-show
      description: Retrieve a single integration exporter configuration.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the integration exporter configuration to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/single_integration_exporter_configuration'
    patch:
      tags:
        - Integration Exporter Configuration
      summary: Update integration exporter configuration
      operationId: integration_exporter_configurations-update
      description: Update an integration exporter configuration.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the integration exporter configuration to update.
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/integration_exporter_configuration'
      responses:
        '200':
          $ref: '#/components/responses/single_integration_exporter_configuration'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
    delete:
      tags:
        - Integration Exporter Configuration
      summary: Delete integration exporter configuration
      operationId: integration_exporter_configurations-destroy
      description: Delete an integration exporter configuration.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the integration exporter configuration to delete.
      responses:
        '204':
          description: No Content
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_integration_exporter_configuration:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - client_id
            - -client_id
            - company_type
            - -company_type
          type: string
        title: Sort integration exporter configuration
      explode: false
      required: false
      description: The sort integration exporter configuration.
    filter_integration_exporter_configuration:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.integration_exporter_configuration at the top of this file.
      required: false
      description: Filter parameter for querying integration exporter configurations.
  responses:
    single_integration_exporter_configuration:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Single integration exporter configuration record in JSON:API format.
            properties:
              data:
                type: object
                description: The integration exporter configuration resource object.
                properties:
                  attributes:
                    type: object
                    description: Integration exporter configuration attributes.
                    properties:
                      company_type:
                        $ref: '#/components/schemas/resource_integration_exporter_configuration/properties/company_type'
                      datev_client_account_code:
                        $ref: '#/components/schemas/resource_integration_exporter_configuration/properties/datev_client_account_code'
                      datev_vendor_account_code:
                        $ref: '#/components/schemas/resource_integration_exporter_configuration/properties/datev_vendor_account_code'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Integration exporter configuration relationships.
                    properties:
                      company:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                id: '11'
                type: integrations
                attributes:
                  name: Xero Accounting
                  integration_type_id: 2
                  connected_at: '2026-01-15T10:00:00.000+00:00'
                  deactivated_at: null
                  account_code: '200'
                  export_number: true
                  export_attachment: false
                  export_expense_attachment: false
                  payments_import: true
                  import_attachment: false
                  import_number: false
                  last_synced_at: '2026-03-15T08:00:00.000+00:00'
                  options: {}
                relationships:
                  subsidiary:
                    data:
                      type: subsidiaries
                      id: '2'
                  creator:
                    data:
                      type: people
                      id: '12'
              included: []
      description: Single integration exporter configuration
    collection_integration_exporter_configuration:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of integration exporter configuration records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: An integration exporter configuration resource object.
                  properties:
                    relationships:
                      type: object
                      description: Integration exporter configuration relationships.
                      properties:
                        company:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                    attributes:
                      type: object
                      description: Integration exporter configuration attributes.
                      properties:
                        datev_vendor_account_code:
                          $ref: '#/components/schemas/resource_integration_exporter_configuration/properties/datev_vendor_account_code'
                        company_type:
                          $ref: '#/components/schemas/resource_integration_exporter_configuration/properties/company_type'
                        datev_client_account_code:
                          $ref: '#/components/schemas/resource_integration_exporter_configuration/properties/datev_client_account_code'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of integration exporter configuration resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '11'
                  type: integrations
                  attributes:
                    name: Xero Accounting
                    integration_type_id: 2
                    connected_at: '2026-01-15T10:00:00.000+00:00'
                    deactivated_at: null
                    account_code: '200'
                    export_number: true
                    export_attachment: false
                    export_expense_attachment: false
                    payments_import: true
                    import_attachment: false
                    import_number: false
                    last_synced_at: '2026-03-15T08:00:00.000+00:00'
                    options: {}
                  relationships:
                    subsidiary:
                      data:
                        type: subsidiaries
                        id: '2'
                    creator:
                      data:
                        type: people
                        id: '12'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection integration exporter configuration
  schemas:
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    resource_integration_exporter_configuration:
      type: object
      title: Integration exporter configuration Resource
      description: The resource integration exporter configuration.
      properties:
        datev_vendor_account_code:
          title: Datev Vendor Account Code
          description: The datev vendor account code.
          example:
            gt: 0
        company_type:
          enum:
            - client
            - vendor
            - both
          type: string
          title: Company Type
          description: The type of company record used in the accounting integration, such as customer or vendor.
          example:
            eq: active
        organization:
          title: Organization
          description: The organization this exporter configuration belongs to.
          example:
            eq: value
        datev_client_account_code:
          title: Datev Client Account Code
          description: The datev client account code.
          example:
            gt: 0
        client_id:
          title: Client
          description: ID of the company (client) this exporter configuration applies to.
          example:
            - 123
        company:
          title: Company
          description: The company (client) this exporter configuration applies to.
          example:
            eq: value
        company_id:
          type: integer
          title: Company
          description: ID of the company (client) this exporter configuration applies to.
          example:
            - 123
      example:
        id: '123'
        type: integration_exporter_configurations
        attributes:
          provider: quickbooks
          enabled: true
          settings: {}
        relationships: {}
  requestBodies:
    integration_exporter_configuration:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating an integration exporter configuration.
            properties:
              data:
                type: object
                description: The integration exporter configuration resource object.
                properties:
                  attributes:
                    type: object
                    description: Integration exporter configuration attributes.
                    properties:
                      datev_client_account_code:
                        $ref: '#/components/schemas/resource_integration_exporter_configuration/properties/datev_client_account_code'
                      datev_vendor_account_code:
                        $ref: '#/components/schemas/resource_integration_exporter_configuration/properties/datev_vendor_account_code'
                      company_id:
                        $ref: '#/components/schemas/resource_integration_exporter_configuration/properties/company_id'
                      company_type:
                        $ref: '#/components/schemas/resource_integration_exporter_configuration/properties/company_type'
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: integrations
                attributes:
                  name: Xero Accounting
                  integration_type_id: 2
                relationships:
                  subsidiary:
                    data:
                      type: subsidiaries
                      id: '2'
      description: Request body for creating or updating an integration exporter configuration.
