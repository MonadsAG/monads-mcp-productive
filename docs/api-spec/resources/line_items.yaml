    resource_line_item:
      type: object
      title: Line item Resource
      description: An invoice line item with quantity, unit price, description, and tax. Line items can link to budget services or expenses for automatic billing.
      properties:
        amount:
          title: Amount
          description: The total line amount (unit price × quantity, minus discount) in the invoice's currency.
          example:
            gt: 0
        amount_default:
          title: Amount Default
          description: The total line amount converted to the organization's default currency.
          example:
            gt: 0
        amount_normalized:
          title: Amount Normalized
          description: The total line amount converted to the invoice currency.
          example:
            gt: 0
        amount_tax:
          title: Amount Tax
          description: The tax portion of this line item's amount in the invoice's currency.
          example:
            gt: 0
        amount_tax_default:
          title: Amount Tax Default
          description: The tax portion of this line item's amount converted to the organization's default currency.
          example:
            gt: 0
        amount_tax_normalized:
          title: Amount Tax Normalized
          description: The tax portion of this line item's amount converted to the invoice currency.
          example:
            gt: 0
        amount_with_tax:
          title: Amount With Tax
          description: The total line amount including tax in the invoice's currency.
          example:
            gt: 0
        amount_with_tax_default:
          title: Amount With Tax Default
          description: The amount with tax converted to the organization's default currency.
          example:
            gt: 0
        amount_with_tax_normalized:
          title: Amount With Tax Normalized
          description: The amount with tax converted to the invoice currency.
          example:
            gt: 0
        company_id:
          type: integer
          title: Company
          description: ID of the company (client) on the invoice this line item belongs to.
          example:
            - 123
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who created this line item.
          example:
            - 123
        currency:
          title: Currency
          description: The currency of this line item, inherited from the associated invoice.
          example:
            eq: value
        currency_default:
          title: Currency Default
          description: The organization's default currency for this line item.
          example:
            eq: value
        currency_normalized:
          title: Currency Normalized
          description: The invoice's currency for this line item.
          example:
            eq: value
        discount:
          type: number
          title: Discount
          description: The discount applied to this line item, expressed as a percentage (0–100).
          example:
            gt: 0
        expense:
          title: Expense
          description: The project expense linked to this line item, if this line item was generated from an expense.
          example:
            eq: value
        expense_id:
          type: integer
          title: Expense
          description: ID of the project expense linked to this line item, or null if not expense-based.
          example:
            - 123
        id:
          type: integer
          title: Id
          description: Unique identifier of this line item.
          example:
            - 123
        invoice:
          title: Invoice
          description: The invoice this line item belongs to.
          example:
            eq: value
        invoice_id:
          type: integer
          title: Invoice
          description: ID of the invoice this line item belongs to.
          example:
            - 123
        kpd_code:
          title: Kpd Code
          description: The KPD classification code assigned to this line item, used for e-invoicing compliance in Croatia.
          example:
            data:
              type: kpd_codes
              id: '42'
        kpd_code_id:
          type: integer
          title: Kpd Code
          description: ID of the KPD classification code assigned to this line item (used only in Croatia).
          example: '42'
        organization:
          title: Organization
          description: The organization this line item belongs to.
          example:
            eq: value
        position:
          type: integer
          title: Position
          description: The display order of this line item within the invoice.
          example:
            eq: value
        quantity:
          type: number
          title: Quantity
          description: The quantity of units for this line item; for percentage billing types, expressed as a percentage value.
          example:
            eq: value
        service:
          title: Service
          description: The budget service linked to this line item, if this line item was generated from a service.
          example:
            eq: value
        service_id:
          type: integer
          title: Service
          description: ID of the budget service linked to this line item, or null if not service-based.
          example:
            - 123
        service_type:
          title: Service Type
          description: The service type categorizing this line item.
          example:
            eq: active
        service_type_id:
          type: integer
          title: Service Type
          description: ID of the service type categorizing this line item.
          example:
            - 123
        tax_name:
          type: string
          title: Tax Name
          description: The display name of the tax applied to this line item (e.g. VAT).
          example:
            eq: value
        tax_rate:
          title: Tax Rate
          description: The tax rate applied to this line item.
          example:
            gt: 0
        tax_rate_id:
          type: integer
          title: Tax Rate
          description: ID of the tax rate applied to this line item, or null if tax is not applied.
          example:
            - 123
        tax_value:
          type: number
          title: Tax Value
          description: The computed tax amount for this line item (amount × tax_value).
          example:
            eq: value
        unit_id:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Unit
          description: ID of the unit of measure for this line item (e.g. hour, day, piece).
          example:
            - 123
        unit_price:
          type: integer
          title: Unit Price
          description: The price per unit for this line item in the invoice's currency.
          example:
            gt: 0
        unit_price_default:
          title: Unit Price Default
          description: The price per unit converted to the organization's default currency.
          example:
            gt: 0
        unit_price_normalized:
          title: Unit Price Normalized
          description: |+
            The price per unit for this line item in the invoice's currency.

          example:
            gt: 0
        updater_id:
          type: integer
          title: Updater
          description: ID of the person who last updated this line item.
          example:
            - 123
      example:
        id: '890'
        type: line_items
        attributes:
          name: Frontend Development
          quantity: 10
          unit: hours
          unit_price: '150.00'
          total_price: '1500.00'
          currency: USD
          position: 1
          tax_rate: '0.1'
        relationships:
          invoice:
            data:
              type: invoices
              id: '234'
          service:
            data:
              type: services
              id: '1856422'
