openapi: 3.1.0
info:
  title: Productive.io API – Line Items
  version: 2.0.0
description: |-
  A line item is a component of an invoice which represents an individual entry that details a specific good or service provided by the seller to the buyer.

  To find out more about managing invoices and line items, visit our Help documentation: [Creating and Managing Invoices](https://help.productive.io/en/collections/8956111-creating-and-managing-invoices).

  Following diagram shows line items in our data hierarchy:

  ```d2
  ...@template
  # template cant import globs just yet
  *: {
    class: default
  }

  # Define actors
  invoice1: Invoice
  line_item1: Line Item {
    class: primary
  }
  line_item2: Line Item {
    class: primary
  }
  tax_rate1: Tax Rate
  tax_rate2: Tax Rate
  service: Service
  service_type: Service Type

  # Define connections
  invoice1 -> line_item1 -> tax_rate1
  invoice1 -> line_item2 -> tax_rate2
  line_item2 -> service
  line_item2 -> service_type
  ```

  ### Setting tax data

  In an old workflow, adding tax data to a line item requires two values: `tax_name` and `tax_value`. For example, if you wanted to add a VAT 15%, you would send `tax_name: ‘VAT’` and `tax_value: 15`.

  In a new workflow (available for customers on our BETA program for now), you should send `tax_rate_id` instead, which points to a Tax rate object. So, in order to set VAT 15% to your line item, you would first need to have a tax rate object with those values and then send its ID to the desired line item.
x-filters:
  line_item:
    company_id:
      description: Filter by client company (via the associated invoice).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who created the line item.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    discount:
      description: Filter by discount percentage range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    expense_id:
      description: Filter by the associated expense.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by the line item's unique ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    invoice_id:
      description: Filter by the associated invoice.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_id:
      description: Filter by the associated service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_type_id:
      description: Filter by the service type of the associated service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    tax_name:
      description: Filter by tax name applied to the line item.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    tax_value:
      description: Filter by tax rate percentage range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    unit_id:
      description: Filter by the billing unit (e.g. hour, day, piece).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updater_id:
      description: Filter by the person who last updated the line item.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/line_items:
    get:
      tags:
        - Line Items
      summary: Get line items
      operationId: line_items-index
      description: List line items.
      parameters:
        - $ref: '#/components/parameters/filter_line_item'
        - $ref: '#/components/parameters/sort_line_item'
      responses:
        '200':
          $ref: '#/components/responses/collection_line_item'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/line_items/{id}:
    get:
      tags:
        - Line Items
      summary: Gets a line item
      operationId: line_items-show
      description: Retrieve a single line item.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_line_item'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Line Items
      summary: Update a line item
      operationId: line_items-update
      description: Update a line item.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/line_item'
      responses:
        '200':
          $ref: '#/components/responses/single_line_item'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Line Items
      summary: Deletes a line item
      operationId: line_items-destroy
      description: Delete a line item.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/line_items/generate:
    post:
      tags:
        - Line Items
      summary: Create line items
      operationId: line_items-generate-generate
      description: |
        The `generate` method provides a way to automatically create line items for an invoice based on the provided invoicing method.

        This [help article](https://help.productive.io/en/articles/4656350-understanding-invoicing-methods) explains the supported invoicing methods.
      responses:
        '200':
          $ref: '#/components/responses/single_line_item'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
