openapi: 3.1.0
info:
  title: Productive.io API – Time Tracking Policies
  version: 2.0.0
description: |-
  **Time tracking policies** define rules governing how and when time entries can be logged — restricting tracking to specific services, enforcing duration limits, or requiring prior approval.

  Policies are assigned to people or projects to ensure time tracking compliance across teams.
x-filters:
  time_tracking_policy:
    id:
      description: Filter by time tracking policy ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by policy name.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter by the people assigned to the policy.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter time tracking policies by archival status; active (1) or archived (2).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/time_tracking_policies/{id}/archive:
    patch:
      tags:
        - Time Tracking Policies
      summary: Archives a time tracking policy
      operationId: time_tracking_policies-archive-archive
      description: Archives a time tracking policy.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the time tracking policy.
      responses:
        '200':
          $ref: '#/components/responses/single_time_tracking_policy'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/time_tracking_policies:
    get:
      tags:
        - Time Tracking Policies
      summary: Get time tracking policies
      operationId: time_tracking_policies-index
      description: List all time tracking policies.
      parameters:
        - $ref: '#/components/parameters/filter_time_tracking_policy'
        - $ref: '#/components/parameters/sort_time_tracking_policy'
      responses:
        '200':
          $ref: '#/components/responses/collection_time_tracking_policy'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      tags:
        - Time Tracking Policies
      summary: Create a time tracking policy
      operationId: time_tracking_policies-create
      description: Create a new time tracking policy.
      requestBody:
        $ref: '#/components/requestBodies/time_tracking_policy'
      responses:
        '201':
          $ref: '#/components/responses/single_time_tracking_policy'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_time_tracking_policy'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/time_tracking_policies/{id}:
    get:
      tags:
        - Time Tracking Policies
      summary: Gets a time tracking policy
      operationId: time_tracking_policies-show
      description: Retrieve a single time tracking policy by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the time tracking policy to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/single_time_tracking_policy'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    patch:
      tags:
        - Time Tracking Policies
      summary: Update a time tracking policy
      operationId: time_tracking_policies-update
      description: Update a time tracking policy.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the time tracking policy to update.
      requestBody:
        $ref: '#/components/requestBodies/time_tracking_policy'
      responses:
        '200':
          $ref: '#/components/responses/single_time_tracking_policy'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '415':
          $ref: '#/components/responses/unsupported_media_type'
        '422':
          $ref: '#/components/responses/unprocessable_content_time_tracking_policy'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Time Tracking Policies
      summary: Deletes a time tracking policy
      operationId: time_tracking_policies-destroy
      description: Delete a time tracking policy by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the time tracking policy to delete.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/time_tracking_policies/{id}/restore:
    patch:
      tags:
        - Time Tracking Policies
      summary: Restores an archived time tracking policy
      operationId: time_tracking_policies-restore-restore
      description: Restores a previously archived time tracking policy.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the time tracking policy.
      responses:
        '200':
          $ref: '#/components/responses/single_time_tracking_policy'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    not_acceptable:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_acceptable'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Acceptable
    not_found:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_not_found'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Not Found
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    single_time_tracking_policy:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single time_tracking_policy record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned time_tracking_policy resource.
                properties:
                  attributes:
                    type: object
                    description: Time tracking policy attributes.
                    properties:
                      created_at:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/created_at'
                      disabled_tracking_message:
                        anyOf:
                          - $ref: '#/components/schemas/resource_time_tracking_policy/properties/disabled_tracking_message'
                          - type: 'null'
                        description: The message shown when time tracking is disabled by this policy.
                      full_day_absence_limit:
                        anyOf:
                          - $ref: '#/components/schemas/resource_time_tracking_policy/properties/full_day_absence_limit'
                          - type: 'null'
                        description: The maximum hours per day that can be tracked on full-day absence.
                      half_day_absence_limit:
                        anyOf:
                          - $ref: '#/components/schemas/resource_time_tracking_policy/properties/half_day_absence_limit'
                          - type: 'null'
                        description: The maximum hours per day that can be tracked on half-day absence.
                      holiday_limit:
                        anyOf:
                          - $ref: '#/components/schemas/resource_time_tracking_policy/properties/holiday_limit'
                          - type: 'null'
                        description: The maximum hours per day that can be tracked on a public holiday.
                      limited_tracking_message:
                        anyOf:
                          - $ref: '#/components/schemas/resource_time_tracking_policy/properties/limited_tracking_message'
                          - type: 'null'
                        description: The message shown when time tracking is restricted to a limited amount.
                      name:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/name'
                      non_working_day_limit:
                        anyOf:
                          - $ref: '#/components/schemas/resource_time_tracking_policy/properties/non_working_day_limit'
                          - type: 'null'
                        description: The maximum hours per day that can be tracked on a non-working day.
                      restrict_time_entry_overlap:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/restrict_time_entry_overlap'
                      updated_at:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/updated_at'
                      working_day_limit:
                        anyOf:
                          - $ref: '#/components/schemas/resource_time_tracking_policy/properties/working_day_limit'
                          - type: 'null'
                        description: The maximum hours per day that can be tracked on a regular working day.
                      archived_at:
                        anyOf:
                          - $ref: '#/components/schemas/resource_time_tracking_policy/properties/archived_at'
                          - type: 'null'
                        description: The timestamp when this time tracking policy was archived, or null if not archived.
                      assigned_people_count:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/assigned_people_count'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Time tracking policy relationships.
                    properties:
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      last_actor:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '3'
                type: time_tracking_policies
                attributes:
                  name: Standard Policy
                  track_method_ids:
                    - 1
                    - 2
                  default_track_method_id: 1
                  daily_limit: 720
                  requires_task: false
                  requires_service: true
              included: []
      description: Single time tracking policy
    unprocessable_content_time_tracking_policy:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_time_tracking_policy'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unprocessable Content
    unsupported_media_type:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unsupported_media_type'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unsupported Media Type
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    collection_time_tracking_policy:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of time tracking policy records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A time tracking policy resource object.
                  properties:
                    attributes:
                      type: object
                      description: Time tracking policy attributes.
                      properties:
                        created_at:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/created_at'
                        disabled_tracking_message:
                          anyOf:
                            - $ref: '#/components/schemas/resource_time_tracking_policy/properties/disabled_tracking_message'
                            - type: 'null'
                          description: Message shown when time tracking is disabled by this policy.
                        full_day_absence_limit:
                          anyOf:
                            - $ref: '#/components/schemas/resource_time_tracking_policy/properties/full_day_absence_limit'
                            - type: 'null'
                          description: Maximum hours that can be tracked on full-day absence events.
                        half_day_absence_limit:
                          anyOf:
                            - $ref: '#/components/schemas/resource_time_tracking_policy/properties/half_day_absence_limit'
                            - type: 'null'
                          description: Maximum hours that can be tracked on half-day absence events.
                        holiday_limit:
                          anyOf:
                            - $ref: '#/components/schemas/resource_time_tracking_policy/properties/holiday_limit'
                            - type: 'null'
                          description: Maximum hours that can be tracked on public holidays.
                        limited_tracking_message:
                          anyOf:
                            - $ref: '#/components/schemas/resource_time_tracking_policy/properties/limited_tracking_message'
                            - type: 'null'
                          description: Message shown when time tracking is limited by this policy.
                        name:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/name'
                        non_working_day_limit:
                          anyOf:
                            - $ref: '#/components/schemas/resource_time_tracking_policy/properties/non_working_day_limit'
                            - type: 'null'
                          description: Maximum hours that can be tracked on non-working days.
                        restrict_time_entry_overlap:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/restrict_time_entry_overlap'
                        updated_at:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/updated_at'
                        working_day_limit:
                          anyOf:
                            - $ref: '#/components/schemas/resource_time_tracking_policy/properties/working_day_limit'
                            - type: 'null'
                          description: Maximum hours that can be tracked on a regular working day.
                        archived_at:
                          anyOf:
                            - $ref: '#/components/schemas/resource_time_tracking_policy/properties/archived_at'
                            - type: 'null'
                          description: The timestamp when this time tracking policy was archived, or null if not archived.
                        assigned_people_count:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/assigned_people_count'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Time tracking policy relationships.
                      properties:
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        last_actor:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of time tracking policy resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '3'
                  type: time_tracking_policies
                  attributes:
                    name: Standard Policy
                    track_method_ids:
                      - 1
                      - 2
                    default_track_method_id: 1
                    daily_limit: 720
                    requires_task: false
                    requires_service: true
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection time tracking policy
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
