    resource_time_tracking_policy:
      type: object
      title: Time tracking policy Resource
      description: A time tracking policy defines rules for how time entries can be logged, including limits and mandatory fields.
      properties:
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when the time tracking policy was created.
          example:
            gt: '2026-01-01'
        creator:
          title: Creator
          description: The person who created this time tracking policy.
          example:
            eq: value
        disabled_tracking_message:
          type: string
          title: Disabled Tracking Message
          description: Message shown to people when time tracking is fully disabled for them.
          example:
            eq: value
        full_day_absence_limit:
          type: integer
          title: Full Day Absence Limit
          description: Maximum hours that can be tracked on a full day of absence.
          example:
            eq: value
        half_day_absence_limit:
          type: integer
          title: Half Day Absence Limit
          description: Maximum hours that can be tracked on a half day of absence.
          example:
            eq: value
        holiday_limit:
          type: integer
          title: Holiday Limit
          description: Maximum hours that can be tracked on a public holiday.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: Unique identifier for the time tracking policy.
          example:
            - 123
        last_actor:
          title: Last Actor
          description: The person who last modified this time tracking policy.
          example:
            eq: value
        limited_tracking_message:
          type: string
          title: Limited Tracking Message
          description: Message shown to people when time tracking is limited (not fully disabled) for them.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The display name of the time tracking policy.
          example:
            eq: value
        non_working_day_limit:
          type: integer
          title: Non Working Day Limit
          description: Maximum hours that can be tracked on a non-working day.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this time tracking policy belongs to.
          example:
            eq: value
        person_id:
          type: integer
          title: Person
          description: The ID of the person this policy applies to, if person-specific.
          example:
            - 123
        restrict_time_entry_overlap:
          type: boolean
          title: Restrict Time Entry Overlap
          description: When true, overlapping time entry ranges are not allowed.
          example:
            gt: 0
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when this time tracking policy was last updated.
          example:
            gt: '2026-01-01'
        working_day_limit:
          type: integer
          title: Working Day Limit
          description: Maximum hours that can be tracked on a standard working day.
          example:
            eq: value
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this policy was archived, or null if it is still active.
          example:
            gt: '2026-01-01'
        assigned_people_count:
          title: Assigned People Count
          description: The number of active people currently assigned to this time tracking policy.
          example:
            gt: 0
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
          description: The status of this policy, indicating whether it is active or archived.
          example:
            eq: active
      example:
        id: '123'
        type: time_tracking_policies
        attributes:
          name: Standard Policy
          requires_notes: true
          max_daily_hours: 12
        relationships: {}
