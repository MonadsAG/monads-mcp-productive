openapi: 3.1.0
info:
  title: Productive.io API – Time Tracking Policies
  version: 2.0.0
description: |-
  **Time tracking policies** define rules governing how and when time entries can be logged — restricting tracking to specific services, enforcing duration limits, or requiring prior approval.

  Policies are assigned to people or projects to ensure time tracking compliance across teams.
x-filters:
  time_tracking_policy:
    id:
      description: Filter by time tracking policy ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter time tracking policies by archival status; active (1) or archived (2).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter by the people assigned to the policy.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by policy name.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/time_tracking_policies/{id}/archive:
    patch:
      tags:
        - Time Tracking Policies
      summary: Archives a time tracking policy
      operationId: time_tracking_policies-archive-archive
      description: Archives a time tracking policy.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the time tracking policy.
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_time_tracking_policy'
  /api/v2/time_tracking_policies:
    get:
      tags:
        - Time Tracking Policies
      summary: Get time tracking policies
      operationId: time_tracking_policies-index
      description: List all time tracking policies.
      parameters:
        - $ref: '#/components/parameters/filter_time_tracking_policy'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_time_tracking_policy'
      responses:
        '200':
          $ref: '#/components/responses/collection_time_tracking_policy'
    post:
      tags:
        - Time Tracking Policies
      summary: Create a time tracking policy
      operationId: time_tracking_policies-create
      description: Create a new time tracking policy.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/time_tracking_policy'
      responses:
        '201':
          $ref: '#/components/responses/single_time_tracking_policy'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/time_tracking_policies/{id}:
    get:
      tags:
        - Time Tracking Policies
      summary: Gets a time tracking policy
      operationId: time_tracking_policies-show
      description: Retrieve a single time tracking policy by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the time tracking policy to retrieve.
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_time_tracking_policy'
    patch:
      tags:
        - Time Tracking Policies
      summary: Update a time tracking policy
      operationId: time_tracking_policies-update
      description: Update a time tracking policy.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the time tracking policy to update.
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/time_tracking_policy'
      responses:
        '200':
          $ref: '#/components/responses/single_time_tracking_policy'
    delete:
      tags:
        - Time Tracking Policies
      summary: Deletes a time tracking policy
      operationId: time_tracking_policies-destroy
      description: Delete a time tracking policy by ID.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the time tracking policy to delete.
      responses:
        '204':
          description: No Content
  /api/v2/time_tracking_policies/{id}/restore:
    patch:
      tags:
        - Time Tracking Policies
      summary: Restores an archived time tracking policy
      operationId: time_tracking_policies-restore-restore
      description: Restores a previously archived time tracking policy.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The numeric ID of the time tracking policy.
      responses:
        '200':
          $ref: '#/components/responses/single_time_tracking_policy'
components:
  responses:
    single_time_tracking_policy:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single time_tracking_policy record in JSON:API format.
            properties:
              meta:
                $ref: '#/components/schemas/_meta'
              data:
                type: object
                description: The JSON:API data object for the returned time_tracking_policy resource.
                properties:
                  relationships:
                    type: object
                    description: Time tracking policy relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      last_actor:
                        $ref: '#/components/schemas/_single_relationship'
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                  attributes:
                    type: object
                    description: Time tracking policy attributes.
                    properties:
                      created_at:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/created_at'
                      working_day_limit:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/working_day_limit'
                      restrict_time_entry_overlap:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/restrict_time_entry_overlap'
                      updated_at:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/updated_at'
                      holiday_limit:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/holiday_limit'
                      full_day_absence_limit:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/full_day_absence_limit'
                      limited_tracking_message:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/limited_tracking_message'
                      half_day_absence_limit:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/half_day_absence_limit'
                      archived_at:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/archived_at'
                      non_working_day_limit:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/non_working_day_limit'
                      assigned_people_count:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/assigned_people_count'
                      name:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/name'
                      note_mandatory:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/note_mandatory'
                      disabled_tracking_message:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/disabled_tracking_message'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                id: '3'
                type: time_tracking_policies
                attributes:
                  name: Standard Policy
                  track_method_ids:
                    - 1
                    - 2
                  default_track_method_id: 1
                  daily_limit: 720
                  requires_task: false
                  requires_service: true
              included: []
      description: Single time tracking policy
    collection_time_tracking_policy:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of time tracking policy records in JSON:API format.
            properties:
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              data:
                type: array
                items:
                  type: object
                  description: A time tracking policy resource object.
                  properties:
                    attributes:
                      type: object
                      description: Time tracking policy attributes.
                      properties:
                        updated_at:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/updated_at'
                        full_day_absence_limit:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/full_day_absence_limit'
                        holiday_limit:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/holiday_limit'
                        name:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/name'
                        limited_tracking_message:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/limited_tracking_message'
                        archived_at:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/archived_at'
                        disabled_tracking_message:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/disabled_tracking_message'
                        restrict_time_entry_overlap:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/restrict_time_entry_overlap'
                        assigned_people_count:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/assigned_people_count'
                        half_day_absence_limit:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/half_day_absence_limit'
                        note_mandatory:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/note_mandatory'
                        working_day_limit:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/working_day_limit'
                        non_working_day_limit:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/non_working_day_limit'
                        created_at:
                          $ref: '#/components/schemas/resource_time_tracking_policy/properties/created_at'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Time tracking policy relationships.
                      properties:
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        last_actor:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of time tracking policy resource objects.
                example:
                  eq: value
            example:
              data:
                - id: '3'
                  type: time_tracking_policies
                  attributes:
                    name: Standard Policy
                    track_method_ids:
                      - 1
                      - 2
                    default_track_method_id: 1
                    daily_limit: 720
                    requires_task: false
                    requires_service: true
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection time tracking policy
  schemas:
    resource_time_tracking_policy:
      type: object
      title: Time tracking policy Resource
      description: A time tracking policy defines rules for how time entries can be logged, including limits and mandatory fields.
      properties:
        name:
          type: string
          title: Name
          description: The display name of the time tracking policy.
          example:
            eq: value
        creator:
          title: Creator
          description: The person who created this time tracking policy.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this time tracking policy belongs to.
          example:
            eq: value
        disabled_tracking_message:
          type: string
          title: Disabled Tracking Message
          description: Message shown to people when time tracking is fully disabled for them.
          example:
            eq: value
        full_day_absence_limit:
          type: integer
          title: Full Day Absence Limit
          description: Maximum hours that can be tracked on a full day of absence.
          example:
            eq: value
        person_id:
          type: integer
          title: Person
          description: The ID of the person this policy applies to, if person-specific.
          example:
            - 123
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this policy was archived, or null if it is still active.
          example:
            gt: '2026-01-01'
        id:
          type: integer
          title: Id
          description: Unique identifier for the time tracking policy.
          example:
            - 123
        updated_at:
          type: string
          title: Updated At
          format: date-time
          description: Timestamp when this time tracking policy was last updated.
          example:
            gt: '2026-01-01'
        restrict_time_entry_overlap:
          type: boolean
          title: Restrict Time Entry Overlap
          description: When true, overlapping time entry ranges are not allowed.
          example:
            gt: 0
        working_day_limit:
          type: integer
          title: Working Day Limit
          description: Maximum hours that can be tracked on a standard working day.
          example:
            eq: value
        assigned_people_count:
          title: Assigned People Count
          description: The number of active people currently assigned to this time tracking policy.
          example:
            gt: 0
        holiday_limit:
          type: integer
          title: Holiday Limit
          description: Maximum hours that can be tracked on a public holiday.
          example:
            eq: value
        last_actor:
          title: Last Actor
          description: The person who last modified this time tracking policy.
          example:
            eq: value
        limited_tracking_message:
          type: string
          title: Limited Tracking Message
          description: Message shown to people when time tracking is limited (not fully disabled) for them.
          example:
            eq: value
        half_day_absence_limit:
          type: integer
          title: Half Day Absence Limit
          description: Maximum hours that can be tracked on a half day of absence.
          example:
            eq: value
        note_mandatory:
          type: boolean
          title: Note Mandatory
          description: When true, a note is required on every time entry submitted.
          example:
            eq: value
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
          description: The status of this policy, indicating whether it is active or archived.
          example:
            eq: active
        non_working_day_limit:
          type: integer
          title: Non Working Day Limit
          description: Maximum hours that can be tracked on a non-working day.
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when the time tracking policy was created.
          example:
            gt: '2026-01-01'
      example:
        id: '123'
        type: time_tracking_policies
        attributes:
          name: Standard Policy
          requires_notes: true
          max_daily_hours: 12
        relationships: {}
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_time_tracking_policy:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - name
            - -name
          type: string
        title: Sort time tracking policy
      explode: false
      required: false
      description: The sort time tracking policy.
    filter_time_tracking_policy:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.time_tracking_policy at the top of this file.
      required: false
      description: Filter parameter for querying time tracking policies.
  requestBodies:
    time_tracking_policy:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a time tracking policy.
            properties:
              data:
                type: object
                description: The time tracking policy resource object.
                properties:
                  attributes:
                    type: object
                    description: Time tracking policy attributes.
                    properties:
                      working_day_limit:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/working_day_limit'
                      limited_tracking_message:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/limited_tracking_message'
                      disabled_tracking_message:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/disabled_tracking_message'
                      note_mandatory:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/note_mandatory'
                      full_day_absence_limit:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/full_day_absence_limit'
                      holiday_limit:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/holiday_limit'
                      half_day_absence_limit:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/half_day_absence_limit'
                      non_working_day_limit:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/non_working_day_limit'
                      restrict_time_entry_overlap:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/restrict_time_entry_overlap'
                      name:
                        $ref: '#/components/schemas/resource_time_tracking_policy/properties/name'
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: time_tracking_policies
                attributes:
                  name: Standard Policy
                  requires_service: true
                  daily_limit: 720
      description: Request body for creating or updating a time tracking policy.
