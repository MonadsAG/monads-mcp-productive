    resource_email:
      type: object
      title: Email Resource
      description: A synced email message linked to deals, invoices, companies, or other resources in Productive.
      properties:
        after:
          type: string
          title: After
          format: date
          description: Filter emails created after this date.
          example:
            eq: value
        attachments:
          title: Attachments
          description: The file attachments associated with this email.
          example:
            eq: value
        auto_linked:
          type: boolean
          title: Auto Linked
          description: Whether this email was automatically linked to a deal or resource by the system.
          example:
            eq: value
        bcc_recipients:
          title: Bcc Recipients
          description: The BCC recipients of this email.
          example:
            eq: value
        before:
          type: string
          title: Before
          format: date
          description: Filter emails created before this date.
          example:
            eq: value
        body:
          title: Body
          description: The plain text body of this email.
          example:
            eq: value
        body_html:
          title: Body Html
          description: The raw HTML body of this email, available when the email inbox feature is enabled.
          example:
            eq: value
        body_truncated:
          title: Body Truncated
          description: A truncated version of the plain text body, used for preview purposes.
          example:
            eq: value
        cc_recipients:
          title: Cc Recipients
          description: The CC recipients of this email.
          example:
            eq: value
        company_id:
          type: integer
          title: Company
          description: Filter to return emails associated with a specific company, matched via recipients, deals, or invoices.
          example:
            - 123
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this email record was created in Productive.
          example:
            gt: '2026-01-01'
        creator:
          title: Creator
          description: The person who created or sent this email.
          example:
            eq: value
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who created or sent this email.
          example:
            - 123
        deal:
          title: Deal
          description: The deal or quote this email is linked to.
          example:
            eq: value
        delivered_at:
          type: string
          title: Delivered At
          format: date-time
          description: Timestamp when this email was successfully delivered, or null if not yet delivered.
          example:
            gt: '2026-01-01'
        dismissed_at:
          type: string
          title: Dismissed At
          format: date-time
          description: Timestamp when this email was dismissed from the inbox, or null if it has not been dismissed.
          example:
            gt: '2026-01-01'
        external_id:
          type: string
          title: External
          description: The external identifier of this email from the originating email provider.
          example:
            - 123
        failed_at:
          type: string
          title: Failed At
          format: date-time
          description: Timestamp when delivery of this email failed, or null if no failure occurred.
          example:
            gt: '2026-01-01'
        from:
          type: string
          title: From
          description: The sender's email address.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: The unique identifier of this email.
          example:
            - 123
        integration:
          title: Integration
          description: The email integration (inbox connection) through which this email was synced.
          example:
            eq: value
        invoice:
          title: Invoice
          description: The invoice this email is linked to.
          example:
            eq: value
        linked_id:
          type: integer
          title: Linked
          description: The ID of the polymorphic resource this email is linked to (deal, invoice, workspace, etc.).
          example:
            - 123
        linked_type:
          type: string
          title: Linked Type
          description: The type of resource this email is linked to (e.g. Quote, Invoice, Workspace).
          example:
            eq: active
        organization:
          title: Organization
          description: The organization this email belongs to.
          example:
            eq: value
        outgoing:
          type: boolean
          title: Outgoing
          description: Whether this email was sent outgoing from Productive, as opposed to an incoming received email.
          example:
            eq: value
        participants:
          title: Participants
          description: The people who participated in this email thread as senders or recipients.
          example:
            eq: value
        payment_reminder:
          title: Payment Reminder
          description: The payment reminder this email is associated with.
          example:
            eq: value
        received_at:
          type: string
          title: Received At
          format: date-time
          description: Timestamp when this email was received from the external provider.
          example:
            gt: '2026-01-01'
        recipient_id:
          type: integer
          title: Recipient
          description: Filter to return emails where this person is a recipient.
          example:
            - 123
        recipients:
          title: Recipients
          description: A grouped map of recipients by type (to, cc, bcc), each with address, person ID, and delivery status.
          example:
            eq: value
        sender_or_recipient_id:
          type: integer
          title: Sender Or Recipient
          description: The sender or recipient id.
          example:
            - 123
        snippet:
          type: string
          title: Snippet
          description: A short preview snippet of the email content.
          example:
            eq: value
        status:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Status
          description: 'The inbox status of this email: unresolved (1), resolved/linked (2), or dismissed (3).'
          example:
            eq: active
        subject:
          type: string
          title: Subject
          description: The subject line of this email.
          example:
            eq: value
        thread:
          title: Thread
          description: The email inbox thread this email belongs to.
          example:
            eq: value
        to_recipients:
          title: To Recipients
          description: The primary (To:) recipients of this email.
          example:
            eq: value
        unread:
          type: boolean
          title: Unread
          description: Whether this email has been marked as unread.
          example:
            eq: value
        thread_id:
          type: integer
          title: Thread
        deal_id:
          type: integer
          title: Deal
        invoice_id:
          type: integer
          title: Invoice
        project_id:
          type: integer
          title: Project
        proposal_id:
          type: integer
          title: Proposal
        purchase_order_id:
          type: integer
          title: Purchase Order
        task_id:
          type: integer
          title: Task
        source:
          enum:
            - outbox
            - null
          type: string
          title: Source
          nullable: true
          description: Where an email came from
        sent_from_mailbox:
          type: boolean
          title: Sent From Mailbox
      example:
        id: '123'
        type: emails
        attributes:
          subject: Project update
          from: client@example.com
          to: team@agency.com
          received_at: '2026-01-15T09:00:00Z'
          body: Hi, here is the latest update...
        relationships: {}
