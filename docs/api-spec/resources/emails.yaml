openapi: 3.1.0
info:
  title: Productive.io API – Emails
  version: 2.0.0
description: |-
  **Emails** synced from external providers (Gmail, Outlook) and linked to deals, contacts, projects, or tasks. They surface client communication history directly within Productive for CRM context.

  List and retrieve email threads associated with records through these endpoints.
x-filters:
  email:
    deal_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    thread_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who sent the email.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    purchase_order_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    before:
      description: Filter by before.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    recipient_id:
      description: Filter by a recipient person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    invoice_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by emails associated with a client company (via recipients, linked deal, invoice, or project).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by email resolution status (unresolved, resolved, or dismissed).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    proposal_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by email ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    after:
      description: Filter by after.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    sender_or_recipient_id:
      description: Filter by emails where the given person is the sender or a recipient.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/emails/{id}/attach:
    patch:
      tags:
        - Emails
      summary: Attach an email
      responses:
        '200':
          $ref: '#/components/responses/single_email'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: emails-attach-attach
      description: Attach an email to a resource.
  /api/v2/emails/{id}:
    get:
      tags:
        - Emails
      summary: Get an email
      responses:
        '200':
          $ref: '#/components/responses/single_email'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: emails-show
      description: Retrieve a single email.
    delete:
      tags:
        - Emails
      summary: Delete an email
      responses:
        '204':
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: emails-destroy
      description: Delete an email.
  /api/v2/emails/{id}/dismiss:
    patch:
      tags:
        - Emails
      summary: Dismiss an email
      responses:
        '200':
          $ref: '#/components/responses/single_email'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: emails-dismiss-dismiss
      description: Dismiss an email from the inbox.
  /api/v2/emails:
    get:
      tags:
        - Emails
      summary: Get emails
      responses:
        '200':
          $ref: '#/components/responses/collection_email'
      parameters:
        - $ref: '#/components/parameters/filter_email'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_email'
      operationId: emails-index
      description: List emails.
components:
  parameters:
    sort_email:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort email
      explode: false
      required: false
      description: Sort email
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_email:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.email at the top of this file.
      required: false
      description: Filters
  schemas:
    resource_email:
      type: object
      title: Email Resource
      properties:
        delivered_at:
          type: string
          title: Delivered At
          format: date-time
          description: Timestamp when this email was successfully delivered, or null if not yet delivered.
          example:
            gt: '2026-01-01'
        status:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Status
          description: 'The inbox status of this email: unresolved (1), resolved/linked (2), or dismissed (3).'
          example:
            eq: active
        payment_reminder:
          title: Payment Reminder
          description: The payment reminder this email is associated with.
          example:
            eq: value
        unread:
          type: boolean
          title: Unread
          description: Whether this email has been marked as unread.
          example:
            eq: value
        to_recipients:
          title: To Recipients
          description: The primary (To:) recipients of this email.
          example:
            eq: value
        before:
          type: string
          title: Before
          format: date
          description: Filter emails created before this date.
          example:
            eq: value
        participants:
          title: Participants
          description: The people who participated in this email thread as senders or recipients.
          example:
            eq: value
        from:
          type: string
          title: From
          description: The sender's email address.
          example:
            eq: value
        proposal_id:
          type: integer
          title: Proposal
        organization:
          title: Organization
          description: The organization this email belongs to.
          example:
            eq: value
        creator:
          title: Creator
          description: The person who created or sent this email.
          example:
            eq: value
        recipient_id:
          type: integer
          title: Recipient
          description: Filter to return emails where this person is a recipient.
          example:
            - 123
        outgoing:
          type: boolean
          title: Outgoing
          description: Whether this email was sent outgoing from Productive, as opposed to an incoming received email.
          example:
            eq: value
        task_id:
          type: integer
          title: Task
        company_id:
          type: integer
          title: Company
          description: Filter to return emails associated with a specific company, matched via recipients, deals, or invoices.
          example:
            - 123
        external_id:
          type: string
          title: External
          description: The external identifier of this email from the originating email provider.
          example:
            - 123
        snippet:
          type: string
          title: Snippet
          description: A short preview snippet of the email content.
          example:
            eq: value
        body_truncated:
          title: Body Truncated
          description: A truncated version of the plain text body, used for preview purposes.
          example:
            eq: value
        integration:
          title: Integration
          description: The email integration (inbox connection) through which this email was synced.
          example:
            eq: value
        project_id:
          type: integer
          title: Project
        body_html:
          title: Body Html
          description: The raw HTML body of this email, available when the email inbox feature is enabled.
          example:
            eq: value
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who created or sent this email.
          example:
            - 123
        body:
          title: Body
          description: The plain text body of this email.
          example:
            eq: value
        invoice:
          title: Invoice
          description: The invoice this email is linked to.
          example:
            eq: value
        sender_or_recipient_id:
          type: integer
          title: Sender Or Recipient
          description: The sender or recipient id.
          example:
            - 123
        recipients:
          title: Recipients
          description: A grouped map of recipients by type (to, cc, bcc), each with address, person ID, and delivery status.
          example:
            eq: value
        failed_at:
          type: string
          title: Failed At
          format: date-time
          description: Timestamp when delivery of this email failed, or null if no failure occurred.
          example:
            gt: '2026-01-01'
        linked_type:
          type: string
          title: Linked Type
          description: The type of resource this email is linked to (e.g. Quote, Invoice, Workspace).
          example:
            eq: active
        auto_linked:
          type: boolean
          title: Auto Linked
          description: Whether this email was automatically linked to a deal or resource by the system.
          example:
            eq: value
        invoice_id:
          type: integer
          title: Invoice
        received_at:
          type: string
          title: Received At
          format: date-time
          description: Timestamp when this email was received from the external provider.
          example:
            gt: '2026-01-01'
        linked_id:
          type: integer
          title: Linked
          description: The ID of the polymorphic resource this email is linked to (deal, invoice, workspace, etc.).
          example:
            - 123
        thread:
          title: Thread
          description: The email inbox thread this email belongs to.
          example:
            eq: value
        deal_id:
          type: integer
          title: Deal
        dismissed_at:
          type: string
          title: Dismissed At
          format: date-time
          description: Timestamp when this email was dismissed from the inbox, or null if it has not been dismissed.
          example:
            gt: '2026-01-01'
        thread_id:
          type: integer
          title: Thread
        after:
          type: string
          title: After
          format: date
          description: Filter emails created after this date.
          example:
            eq: value
        deal:
          title: Deal
          description: The deal or quote this email is linked to.
          example:
            eq: value
        attachments:
          title: Attachments
          description: The file attachments associated with this email.
          example:
            eq: value
        subject:
          type: string
          title: Subject
          description: The subject line of this email.
          example:
            eq: value
        purchase_order_id:
          type: integer
          title: Purchase Order
        bcc_recipients:
          title: Bcc Recipients
          description: The BCC recipients of this email.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: The unique identifier of this email.
          example:
            - 123
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this email record was created in Productive.
          example:
            gt: '2026-01-01'
        cc_recipients:
          title: Cc Recipients
          description: The CC recipients of this email.
          example:
            eq: value
      description: A synced email message linked to deals, invoices, companies, or other resources in Productive.
      example:
        id: '123'
        type: emails
        attributes:
          subject: Project update
          from: client@example.com
          to: team@agency.com
          received_at: '2026-01-15T09:00:00Z'
          body: Hi, here is the latest update...
        relationships: {}
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    _collection_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Collection data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          description: Included variant — related resource identifiers are present in `data`.
          example:
            data:
              - type: tasks
                id: '42'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
  responses:
    collection_email:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        body:
                          $ref: '#/components/schemas/resource_email/properties/body'
                        from:
                          $ref: '#/components/schemas/resource_email/properties/from'
                        unread:
                          $ref: '#/components/schemas/resource_email/properties/unread'
                        snippet:
                          $ref: '#/components/schemas/resource_email/properties/snippet'
                        subject:
                          $ref: '#/components/schemas/resource_email/properties/subject'
                        outgoing:
                          $ref: '#/components/schemas/resource_email/properties/outgoing'
                        body_html:
                          $ref: '#/components/schemas/resource_email/properties/body_html'
                        failed_at:
                          $ref: '#/components/schemas/resource_email/properties/failed_at'
                        linked_id:
                          $ref: '#/components/schemas/resource_email/properties/linked_id'
                        created_at:
                          $ref: '#/components/schemas/resource_email/properties/created_at'
                        recipients:
                          $ref: '#/components/schemas/resource_email/properties/recipients'
                        auto_linked:
                          $ref: '#/components/schemas/resource_email/properties/auto_linked'
                        external_id:
                          $ref: '#/components/schemas/resource_email/properties/external_id'
                        linked_type:
                          $ref: '#/components/schemas/resource_email/properties/linked_type'
                        received_at:
                          $ref: '#/components/schemas/resource_email/properties/received_at'
                        delivered_at:
                          $ref: '#/components/schemas/resource_email/properties/delivered_at'
                        dismissed_at:
                          $ref: '#/components/schemas/resource_email/properties/dismissed_at'
                        participants:
                          $ref: '#/components/schemas/resource_email/properties/participants'
                        body_truncated:
                          $ref: '#/components/schemas/resource_email/properties/body_truncated'
                    relationships:
                      type: object
                      properties:
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        thread:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        invoice:
                          $ref: '#/components/schemas/_single_relationship'
                        recipients:
                          $ref: '#/components/schemas/_collection_relationship'
                        attachments:
                          $ref: '#/components/schemas/_collection_relationship'
                        integration:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        participants:
                          $ref: '#/components/schemas/_collection_relationship'
                        cc_recipients:
                          $ref: '#/components/schemas/_collection_relationship'
                        to_recipients:
                          $ref: '#/components/schemas/_collection_relationship'
                        bcc_recipients:
                          $ref: '#/components/schemas/_collection_relationship'
                        payment_reminder:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection email
    single_email:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      body:
                        $ref: '#/components/schemas/resource_email/properties/body'
                      from:
                        $ref: '#/components/schemas/resource_email/properties/from'
                      unread:
                        $ref: '#/components/schemas/resource_email/properties/unread'
                      snippet:
                        $ref: '#/components/schemas/resource_email/properties/snippet'
                      subject:
                        $ref: '#/components/schemas/resource_email/properties/subject'
                      outgoing:
                        $ref: '#/components/schemas/resource_email/properties/outgoing'
                      body_html:
                        $ref: '#/components/schemas/resource_email/properties/body_html'
                      failed_at:
                        $ref: '#/components/schemas/resource_email/properties/failed_at'
                      linked_id:
                        $ref: '#/components/schemas/resource_email/properties/linked_id'
                      created_at:
                        $ref: '#/components/schemas/resource_email/properties/created_at'
                      recipients:
                        $ref: '#/components/schemas/resource_email/properties/recipients'
                      auto_linked:
                        $ref: '#/components/schemas/resource_email/properties/auto_linked'
                      external_id:
                        $ref: '#/components/schemas/resource_email/properties/external_id'
                      linked_type:
                        $ref: '#/components/schemas/resource_email/properties/linked_type'
                      received_at:
                        $ref: '#/components/schemas/resource_email/properties/received_at'
                      delivered_at:
                        $ref: '#/components/schemas/resource_email/properties/delivered_at'
                      dismissed_at:
                        $ref: '#/components/schemas/resource_email/properties/dismissed_at'
                      participants:
                        $ref: '#/components/schemas/resource_email/properties/participants'
                      body_truncated:
                        $ref: '#/components/schemas/resource_email/properties/body_truncated'
                  relationships:
                    type: object
                    properties:
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      thread:
                        $ref: '#/components/schemas/_single_relationship'
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      invoice:
                        $ref: '#/components/schemas/_single_relationship'
                      recipients:
                        $ref: '#/components/schemas/_collection_relationship'
                      attachments:
                        $ref: '#/components/schemas/_collection_relationship'
                      integration:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      participants:
                        $ref: '#/components/schemas/_collection_relationship'
                      cc_recipients:
                        $ref: '#/components/schemas/_collection_relationship'
                      to_recipients:
                        $ref: '#/components/schemas/_collection_relationship'
                      bcc_recipients:
                        $ref: '#/components/schemas/_collection_relationship'
                      payment_reminder:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single email
