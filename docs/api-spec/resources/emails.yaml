openapi: 3.1.0
info:
  title: Productive.io API – Emails
  version: 2.0.0
description: |-
  **Emails** synced from external providers (Gmail, Outlook) and linked to deals, contacts, projects, or tasks. They surface client communication history directly within Productive for CRM context.

  List and retrieve email threads associated with records through these endpoints.
x-filters:
  email:
    status:
      description: Filter by email resolution status (unresolved, resolved, or dismissed).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    recipient_id:
      description: Filter by a recipient person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who sent the email.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    sender_or_recipient_id:
      description: Filter by emails where the given person is the sender or a recipient.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by emails associated with a client company (via recipients, linked deal, invoice, or project).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    proposal_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by email ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    after:
      description: Filter by after.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    invoice_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    thread_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    before:
      description: Filter by before.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    purchase_order_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/emails/{id}/attach:
    patch:
      tags:
        - Emails
      summary: Attach an email
      operationId: emails-attach-attach
      description: Attach an email to a resource.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_email'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/emails/{id}:
    get:
      tags:
        - Emails
      summary: Get an email
      operationId: emails-show
      description: Retrieve a single email.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_email'
    delete:
      tags:
        - Emails
      summary: Delete an email
      operationId: emails-destroy
      description: Delete an email.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
  /api/v2/emails/{id}/dismiss:
    patch:
      tags:
        - Emails
      summary: Dismiss an email
      operationId: emails-dismiss-dismiss
      description: Dismiss an email from the inbox.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_email'
  /api/v2/emails:
    get:
      tags:
        - Emails
      summary: Get emails
      operationId: emails-index
      description: List emails.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_email'
        - $ref: '#/components/parameters/sort_email'
      responses:
        '200':
          $ref: '#/components/responses/collection_email'
components:
  responses:
    collection_email:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of email records in JSON:API format.
            properties:
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              data:
                type: array
                items:
                  type: object
                  description: An email resource object.
                  properties:
                    relationships:
                      type: object
                      description: Email relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        thread:
                          $ref: '#/components/schemas/_single_relationship'
                        bcc_recipients:
                          $ref: '#/components/schemas/_collection_relationship'
                        participants:
                          $ref: '#/components/schemas/_collection_relationship'
                        integration:
                          $ref: '#/components/schemas/_single_relationship'
                        to_recipients:
                          $ref: '#/components/schemas/_collection_relationship'
                        cc_recipients:
                          $ref: '#/components/schemas/_collection_relationship'
                        recipients:
                          $ref: '#/components/schemas/_collection_relationship'
                        invoice:
                          $ref: '#/components/schemas/_single_relationship'
                        payment_reminder:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        attachments:
                          $ref: '#/components/schemas/_collection_relationship'
                      example:
                        eq: value
                    attributes:
                      type: object
                      description: Email attributes.
                      properties:
                        subject:
                          $ref: '#/components/schemas/resource_email/properties/subject'
                        dismissed_at:
                          $ref: '#/components/schemas/resource_email/properties/dismissed_at'
                        delivered_at:
                          $ref: '#/components/schemas/resource_email/properties/delivered_at'
                        received_at:
                          $ref: '#/components/schemas/resource_email/properties/received_at'
                        linked_id:
                          $ref: '#/components/schemas/resource_email/properties/linked_id'
                        unread:
                          $ref: '#/components/schemas/resource_email/properties/unread'
                        created_at:
                          $ref: '#/components/schemas/resource_email/properties/created_at'
                        auto_linked:
                          $ref: '#/components/schemas/resource_email/properties/auto_linked'
                        from:
                          $ref: '#/components/schemas/resource_email/properties/from'
                        body:
                          $ref: '#/components/schemas/resource_email/properties/body'
                        external_id:
                          $ref: '#/components/schemas/resource_email/properties/external_id'
                        outgoing:
                          $ref: '#/components/schemas/resource_email/properties/outgoing'
                        body_truncated:
                          $ref: '#/components/schemas/resource_email/properties/body_truncated'
                        body_html:
                          $ref: '#/components/schemas/resource_email/properties/body_html'
                        recipients:
                          $ref: '#/components/schemas/resource_email/properties/recipients'
                        linked_type:
                          $ref: '#/components/schemas/resource_email/properties/linked_type'
                        participants:
                          $ref: '#/components/schemas/resource_email/properties/participants'
                        failed_at:
                          $ref: '#/components/schemas/resource_email/properties/failed_at'
                        snippet:
                          $ref: '#/components/schemas/resource_email/properties/snippet'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of email resource objects.
                example:
                  eq: value
            example:
              data:
                - id: '789'
                  type: emails
                  attributes:
                    subject: 'Re: Website Redesign — Updated timeline'
                    snippet: Hi Alex, I've reviewed the updated timeline and everything looks good. We can proceed with...
                    body_truncated: true
                    auto_linked: true
                    linked_type: deal
                    linked_id: 89
                    outgoing: false
                    from:
                      email: client@acmecorp.com
                      name: Jane Doe
                    recipients:
                      - email: alex.smith@example.com
                        name: Alex Smith
                        type: to
                    created_at: '2026-03-10T09:15:00.000+00:00'
                    received_at: '2026-03-10T09:15:00.000+00:00'
                    delivered_at: null
                    failed_at: null
                    unread: true
                    dismissed_at: null
                  relationships:
                    creator:
                      data: null
                    deal:
                      data:
                        type: deals
                        id: '89'
                    thread:
                      data:
                        type: emails
                        id: '785'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection email
    single_email:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single email record in JSON:API format.
            properties:
              data:
                type: object
                description: The JSON:API data object for the returned email resource.
                properties:
                  relationships:
                    type: object
                    description: Email relationships.
                    properties:
                      attachments:
                        $ref: '#/components/schemas/_collection_relationship'
                      bcc_recipients:
                        $ref: '#/components/schemas/_collection_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      participants:
                        $ref: '#/components/schemas/_collection_relationship'
                      deal:
                        $ref: '#/components/schemas/_single_relationship'
                      cc_recipients:
                        $ref: '#/components/schemas/_collection_relationship'
                      thread:
                        $ref: '#/components/schemas/_single_relationship'
                      recipients:
                        $ref: '#/components/schemas/_collection_relationship'
                      to_recipients:
                        $ref: '#/components/schemas/_collection_relationship'
                      integration:
                        $ref: '#/components/schemas/_single_relationship'
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      payment_reminder:
                        $ref: '#/components/schemas/_single_relationship'
                      invoice:
                        $ref: '#/components/schemas/_single_relationship'
                    example:
                      eq: value
                  attributes:
                    type: object
                    description: Email attributes.
                    properties:
                      external_id:
                        $ref: '#/components/schemas/resource_email/properties/external_id'
                      subject:
                        $ref: '#/components/schemas/resource_email/properties/subject'
                      failed_at:
                        $ref: '#/components/schemas/resource_email/properties/failed_at'
                      delivered_at:
                        $ref: '#/components/schemas/resource_email/properties/delivered_at'
                      linked_id:
                        $ref: '#/components/schemas/resource_email/properties/linked_id'
                      body_truncated:
                        $ref: '#/components/schemas/resource_email/properties/body_truncated'
                      from:
                        $ref: '#/components/schemas/resource_email/properties/from'
                      received_at:
                        $ref: '#/components/schemas/resource_email/properties/received_at'
                      snippet:
                        $ref: '#/components/schemas/resource_email/properties/snippet'
                      linked_type:
                        $ref: '#/components/schemas/resource_email/properties/linked_type'
                      body:
                        $ref: '#/components/schemas/resource_email/properties/body'
                      unread:
                        $ref: '#/components/schemas/resource_email/properties/unread'
                      body_html:
                        $ref: '#/components/schemas/resource_email/properties/body_html'
                      recipients:
                        $ref: '#/components/schemas/resource_email/properties/recipients'
                      created_at:
                        $ref: '#/components/schemas/resource_email/properties/created_at'
                      participants:
                        $ref: '#/components/schemas/resource_email/properties/participants'
                      dismissed_at:
                        $ref: '#/components/schemas/resource_email/properties/dismissed_at'
                      auto_linked:
                        $ref: '#/components/schemas/resource_email/properties/auto_linked'
                      outgoing:
                        $ref: '#/components/schemas/resource_email/properties/outgoing'
                    example:
                      eq: value
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '789'
                type: emails
                attributes:
                  subject: 'Re: Website Redesign — Updated timeline'
                  snippet: Hi Alex, I've reviewed the updated timeline and everything looks good. We can proceed with...
                  body_truncated: true
                  auto_linked: true
                  linked_type: deal
                  linked_id: 89
                  outgoing: false
                  from:
                    email: client@acmecorp.com
                    name: Jane Doe
                  recipients:
                    - email: alex.smith@example.com
                      name: Alex Smith
                      type: to
                  created_at: '2026-03-10T09:15:00.000+00:00'
                  received_at: '2026-03-10T09:15:00.000+00:00'
                  delivered_at: null
                  failed_at: null
                  unread: true
                  dismissed_at: null
                relationships:
                  creator:
                    data: null
                  deal:
                    data:
                      type: deals
                      id: '89'
                  thread:
                    data:
                      type: emails
                      id: '785'
              included: []
      description: Single email
  schemas:
    resource_email:
      type: object
      title: Email Resource
      description: A synced email message linked to deals, invoices, companies, or other resources in Productive.
      properties:
        before:
          type: string
          title: Before
          format: date
          description: Filter emails created before this date.
          example:
            eq: value
        payment_reminder:
          title: Payment Reminder
          description: The payment reminder this email is associated with.
          example:
            eq: value
        task_id:
          type: integer
          title: Task
        attachments:
          title: Attachments
          description: The file attachments associated with this email.
          example:
            eq: value
        sender_or_recipient_id:
          type: integer
          title: Sender Or Recipient
          description: The sender or recipient id.
          example:
            - 123
        dismissed_at:
          type: string
          title: Dismissed At
          format: date-time
          description: Timestamp when this email was dismissed from the inbox, or null if it has not been dismissed.
          example:
            gt: '2026-01-01'
        integration:
          title: Integration
          description: The email integration (inbox connection) through which this email was synced.
          example:
            eq: value
        subject:
          type: string
          title: Subject
          description: The subject line of this email.
          example:
            eq: value
        project_id:
          type: integer
          title: Project
        cc_recipients:
          title: Cc Recipients
          description: The CC recipients of this email.
          example:
            eq: value
        unread:
          type: boolean
          title: Unread
          description: Whether this email has been marked as unread.
          example:
            eq: value
        participants:
          title: Participants
          description: The people who participated in this email thread as senders or recipients.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: The unique identifier of this email.
          example:
            - 123
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who created or sent this email.
          example:
            - 123
        bcc_recipients:
          title: Bcc Recipients
          description: The BCC recipients of this email.
          example:
            eq: value
        body:
          title: Body
          description: The plain text body of this email.
          example:
            eq: value
        outgoing:
          type: boolean
          title: Outgoing
          description: Whether this email was sent outgoing from Productive, as opposed to an incoming received email.
          example:
            eq: value
        after:
          type: string
          title: After
          format: date
          description: Filter emails created after this date.
          example:
            eq: value
        linked_id:
          type: integer
          title: Linked
          description: The ID of the polymorphic resource this email is linked to (deal, invoice, workspace, etc.).
          example:
            - 123
        received_at:
          type: string
          title: Received At
          format: date-time
          description: Timestamp when this email was received from the external provider.
          example:
            gt: '2026-01-01'
        from:
          type: string
          title: From
          description: The sender's email address.
          example:
            eq: value
        deal_id:
          type: integer
          title: Deal
        to_recipients:
          title: To Recipients
          description: The primary (To:) recipients of this email.
          example:
            eq: value
        purchase_order_id:
          type: integer
          title: Purchase Order
        company_id:
          type: integer
          title: Company
          description: Filter to return emails associated with a specific company, matched via recipients, deals, or invoices.
          example:
            - 123
        status:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Status
          description: 'The inbox status of this email: unresolved (1), resolved/linked (2), or dismissed (3).'
          example:
            eq: active
        proposal_id:
          type: integer
          title: Proposal
        invoice_id:
          type: integer
          title: Invoice
        creator:
          title: Creator
          description: The person who created or sent this email.
          example:
            eq: value
        linked_type:
          type: string
          title: Linked Type
          description: The type of resource this email is linked to (e.g. Quote, Invoice, Workspace).
          example:
            eq: active
        snippet:
          type: string
          title: Snippet
          description: A short preview snippet of the email content.
          example:
            eq: value
        failed_at:
          type: string
          title: Failed At
          format: date-time
          description: Timestamp when delivery of this email failed, or null if no failure occurred.
          example:
            gt: '2026-01-01'
        recipient_id:
          type: integer
          title: Recipient
          description: Filter to return emails where this person is a recipient.
          example:
            - 123
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this email record was created in Productive.
          example:
            gt: '2026-01-01'
        body_html:
          title: Body Html
          description: The raw HTML body of this email, available when the email inbox feature is enabled.
          example:
            eq: value
        auto_linked:
          type: boolean
          title: Auto Linked
          description: Whether this email was automatically linked to a deal or resource by the system.
          example:
            eq: value
        thread_id:
          type: integer
          title: Thread
        deal:
          title: Deal
          description: The deal or quote this email is linked to.
          example:
            eq: value
        invoice:
          title: Invoice
          description: The invoice this email is linked to.
          example:
            eq: value
        delivered_at:
          type: string
          title: Delivered At
          format: date-time
          description: Timestamp when this email was successfully delivered, or null if not yet delivered.
          example:
            gt: '2026-01-01'
        recipients:
          title: Recipients
          description: A grouped map of recipients by type (to, cc, bcc), each with address, person ID, and delivery status.
          example:
            eq: value
        thread:
          title: Thread
          description: The email inbox thread this email belongs to.
          example:
            eq: value
        body_truncated:
          title: Body Truncated
          description: A truncated version of the plain text body, used for preview purposes.
          example:
            eq: value
        external_id:
          type: string
          title: External
          description: The external identifier of this email from the originating email provider.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this email belongs to.
          example:
            eq: value
      example:
        id: '123'
        type: emails
        attributes:
          subject: Project update
          from: client@example.com
          to: team@agency.com
          received_at: '2026-01-15T09:00:00Z'
          body: Hi, here is the latest update...
        relationships: {}
    _collection_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Collection data
          description: Included variant — related resource identifiers are present in `data`.
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          example:
            data:
              - type: tasks
                id: '42'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
  parameters:
    sort_email:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort email
      explode: false
      required: false
      description: Sort email
    filter_email:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.email at the top of this file.
      required: false
      description: Filters
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
