openapi: 3.1.0
info:
  title: Productive.io API – Emails
  version: 2.0.0
description: |-
  **Emails** synced from external providers (Gmail, Outlook) and linked to deals, contacts, projects, or tasks. They surface client communication history directly within Productive for CRM context.

  List and retrieve email threads associated with records through these endpoints.
x-filters:
  email:
    after:
      description: Filter by after.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    before:
      description: Filter by before.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by emails associated with a client company (via recipients, linked deal, invoice, or project).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who sent the email.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by email ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    recipient_id:
      description: Filter by a recipient person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    sender_or_recipient_id:
      description: Filter by emails where the given person is the sender or a recipient.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filter by email resolution status (unresolved, resolved, or dismissed).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    thread_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    invoice_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    proposal_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    purchase_order_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/emails/{id}/attach:
    patch:
      tags:
        - Emails
      summary: Attach an email
      operationId: emails-attach-attach
      description: Attach an email to a resource.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_email'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '422':
          $ref: '#/components/responses/unprocessable_content_email'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/emails/{id}:
    get:
      tags:
        - Emails
      summary: Get an email
      operationId: emails-show
      description: Retrieve a single email.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - in: query
          name: integration_id
          schema:
            type: string
          required: false
      responses:
        '200':
          $ref: '#/components/responses/single_email'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
    delete:
      tags:
        - Emails
      summary: Delete an email
      operationId: emails-destroy
      description: Delete an email.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/emails/{id}/dismiss:
    patch:
      tags:
        - Emails
      summary: Dismiss an email
      operationId: emails-dismiss-dismiss
      description: Dismiss an email from the inbox.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_email'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/not_acceptable'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v2/emails:
    get:
      tags:
        - Emails
      summary: Get emails
      operationId: emails-index
      description: List emails.
      parameters:
        - $ref: '#/components/parameters/filter_email'
        - $ref: '#/components/parameters/sort_email'
      responses:
        '200':
          $ref: '#/components/responses/collection_email'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
