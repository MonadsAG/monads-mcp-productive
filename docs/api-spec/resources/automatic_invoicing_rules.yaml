                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  - id: '456'
                    type: tasks
                    attributes: {}
                    relationships: {}
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '8'
                type: automatic_invoicing_rules
                attributes:
                  name: Monthly retainer invoicing
                  frequency: monthly
                  active: true
                  created_at: '2026-01-01T00:00:00.000+00:00'
                relationships:
                  deal:
                    data:
                      type: deals
                      id: '89'
                  invoice_template:
                    data:
                      type: invoice_templates
                      id: '5'
              included: []
      description: Single automatic invoicing rule
