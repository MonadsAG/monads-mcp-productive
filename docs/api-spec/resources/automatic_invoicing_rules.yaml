openapi: 3.1.0
info:
  title: Productive.io API – Automatic Invoicing Rules
  version: 2.0.0
description: |-
  **Automatic invoicing rules** define conditions under which invoices are generated automatically from budget services — on time-based schedules, milestone completion, or budget consumption thresholds.

  Use these endpoints to configure recurring or event-driven billing without manual invoice creation.
x-filters:
  automatic_invoicing_rule:
    id:
      description: Filter by automatic invoicing rule ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_id:
      description: Filter by the associated budget (deal).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter by the person who created the rule.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/automatic_invoicing_rules:
    get:
      tags:
        - Automatic Invoicing Rules
      summary: Get automatic invoicing rules
      responses:
        '200':
          $ref: '#/components/responses/collection_automatic_invoicing_rule'
      parameters:
        - $ref: '#/components/parameters/sort_automatic_invoicing_rule'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_automatic_invoicing_rule'
      operationId: automatic_invoicing_rules-index
      description: List automatic invoicing rules with optional filters and pagination.
    post:
      tags:
        - Automatic Invoicing Rules
      summary: Create an automatic invoicing rule
      responses:
        '201':
          $ref: '#/components/responses/single_automatic_invoicing_rule'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: automatic_invoicing_rules-create
      requestBody:
        $ref: '#/components/requestBodies/automatic_invoicing_rule'
      description: Create a new automatic invoicing rule.
  /api/v2/automatic_invoicing_rules/{id}:
    get:
      tags:
        - Automatic Invoicing Rules
      summary: Gets an automatic invoicing rule
      responses:
        '200':
          $ref: '#/components/responses/single_automatic_invoicing_rule'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the automatic invoicing rule to retrieve.
        - $ref: '#/components/parameters/header_organization'
      operationId: automatic_invoicing_rules-show
      description: Retrieve a single automatic invoicing rule by ID.
    patch:
      tags:
        - Automatic Invoicing Rules
      summary: Update an automatic invoicing rule
      responses:
        '200':
          $ref: '#/components/responses/single_automatic_invoicing_rule'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the automatic invoicing rule to update.
      operationId: automatic_invoicing_rules-update
      requestBody:
        $ref: '#/components/requestBodies/automatic_invoicing_rule'
      description: Update an automatic invoicing rule.
    delete:
      tags:
        - Automatic Invoicing Rules
      summary: Deletes an automatic invoicing rule
      responses:
        '204':
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the automatic invoicing rule to delete.
      operationId: automatic_invoicing_rules-destroy
      description: Delete an automatic invoicing rule.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_automatic_invoicing_rule:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.automatic_invoicing_rule at the top of this file.
      required: false
      description: Filter parameter for querying automatic invoicing rules.
    sort_automatic_invoicing_rule:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - created_at
            - -created_at
            - id
            - -id
          type: string
        title: Sort automatic invoicing rule
      explode: false
      required: false
      description: The sort automatic invoicing rule.
  requestBodies:
    automatic_invoicing_rule:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      budget_id:
                        $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/budget_id'
                      skip_weekends:
                        $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/skip_weekends'
                      reference_date:
                        $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/reference_date'
                      creation_offset:
                        $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/creation_offset'
                      creation_offset_unit:
                        $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/creation_offset_unit'
      description: Request body for creating or updating an automatic invoicing rule.
  schemas:
    resource_automatic_invoicing_rule:
      type: object
      title: Automatic invoicing rule Resource
      properties:
        next_invoice_date:
          type: string
          title: Next Invoice Date
          format: date
          description: The next scheduled date on which an invoice draft will be automatically created.
          example:
            gt: '2026-01-01'
        creator:
          title: Creator
          description: The person who created this automatic invoicing rule.
          example:
            eq: value
        reference_date:
          enum:
            - start_date
            - end_date
          type: string
          title: Reference Date
          description: The reference date used to calculate when invoices are created (e.g. period_start, period_end).
          example:
            gt: '2026-01-01'
        creation_offset:
          type: integer
          title: Creation Offset
          description: Number of time units to offset invoice creation from the reference date.
          example:
            eq: value
        created_at:
          title: Created At
          description: Timestamp when the automatic invoicing rule was created.
          example:
            gt: '2026-01-01'
        id:
          type: integer
          title: Id
          description: Unique identifier for the automatic invoicing rule.
          example:
            - 123
        skip_weekends:
          type: boolean
          title: Skip Weekends
          description: When true, invoice creation is shifted to the next working day if the scheduled date falls on a weekend.
          example:
            eq: value
        processed_at:
          type: string
          title: Processed At
          format: date-time
        creator_id:
          type: integer
          title: Creator
          description: The ID of the person who created this automatic invoicing rule.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this automatic invoicing rule belongs to.
          example:
            eq: value
        budget:
          title: Budget
          description: The budget this automatic invoicing rule applies to.
          example:
            gt: 0
        creation_offset_unit:
          enum:
            - day
            - week
            - month
          type: string
          title: Creation Offset Unit
          description: The time unit for the creation offset (e.g. days, weeks, months).
          example:
            eq: value
        budget_id:
          type: integer
          title: Budget
          description: The ID of the budget this automatic invoicing rule applies to.
          example:
            - 123
      description: An automatic invoicing rule defines when invoice drafts are automatically created for a budget.
      example:
        id: '7'
        type: automatic_invoicing_rules
        attributes:
          name: Monthly invoicing
          active: true
          created_at: '2023-06-01T00:00:00.000+02:00'
        relationships:
          organization:
            data:
              type: organizations
              id: '109'
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  responses:
    single_automatic_invoicing_rule:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      processed_at:
                        $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/processed_at'
                      skip_weekends:
                        $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/skip_weekends'
                      reference_date:
                        $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/reference_date'
                      creation_offset:
                        $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/creation_offset'
                      next_invoice_date:
                        $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/next_invoice_date'
                      creation_offset_unit:
                        $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/creation_offset_unit'
                  relationships:
                    type: object
                    properties:
                      budget:
                        $ref: '#/components/schemas/_single_relationship'
                      creator:
                        $ref: '#/components/schemas/_single_relationship'
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single automatic invoicing rule
    collection_automatic_invoicing_rule:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        processed_at:
                          $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/processed_at'
                        skip_weekends:
                          $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/skip_weekends'
                        reference_date:
                          $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/reference_date'
                        creation_offset:
                          $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/creation_offset'
                        next_invoice_date:
                          $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/next_invoice_date'
                        creation_offset_unit:
                          $ref: '#/components/schemas/resource_automatic_invoicing_rule/properties/creation_offset_unit'
                    relationships:
                      type: object
                      properties:
                        budget:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection automatic invoicing rule
