openapi: 3.1.0
info:
  title: Productive.io API – Workflows
  version: 2.0.0
description: |-
  The Workflow object enables organizing tasks into distinct phases or stages, each with its own set of statuses.

  This allows tracking the progress of tasks from initiation to completion.

  You can learn more about Workflows in our Help documentation:
  [Workflows](https://help.productive.io/en/articles/5813154-workflows)
x-filters:
  workflow:
    archived:
      description: Filter to include only archived or non-archived workflows.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Filter by workflow name using a partial text search.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by exact workflow name.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/workflows/{id}/archive:
    patch:
      tags:
        - Workflows
      summary: Archives a workflow
      responses:
        '200':
          $ref: '#/components/responses/single_workflow'
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: workflows-archive-archive
      description: Archive a workflow to deactivate it.
  /api/v2/workflows:
    get:
      tags:
        - Workflows
      summary: Get workflows
      responses:
        '200':
          $ref: '#/components/responses/collection_workflow'
      parameters:
        - $ref: '#/components/parameters/filter_workflow'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_workflow'
      operationId: workflows-index
      description: List all workflows.
    post:
      tags:
        - Workflows
      summary: Create an workflow
      responses:
        '201':
          $ref: '#/components/responses/single_workflow'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - $ref: '#/components/parameters/header_organization'
      operationId: workflows-create
      requestBody:
        $ref: '#/components/requestBodies/workflow'
      description: Create a new workflow.
  /api/v2/workflows/{id}:
    get:
      tags:
        - Workflows
      summary: Gets a workflow
      responses:
        '200':
          $ref: '#/components/responses/single_workflow'
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: workflows-show
      description: Retrieve a single workflow by ID.
    patch:
      tags:
        - Workflows
      summary: Update an workflow
      responses:
        '200':
          $ref: '#/components/responses/single_workflow'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: workflows-update
      requestBody:
        $ref: '#/components/requestBodies/workflow'
      description: Update a workflow.
    delete:
      tags:
        - Workflows
      summary: Deletes a workflow
      responses:
        '204':
          description: No Content
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      operationId: workflows-destroy
      description: Delete a workflow by ID.
  /api/v2/workflows/{id}/restore:
    patch:
      tags:
        - Workflows
      summary: Restores a workflow
      responses:
        '200':
          $ref: '#/components/responses/single_workflow'
        '201':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Created
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      operationId: workflows-restore-restore
      description: Restore an archived workflow.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_workflow:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - name
            - -name
          type: string
        title: Sort workflow
      explode: false
      required: false
      description: Sort workflow
    filter_workflow:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.workflow at the top of this file.
      required: false
      description: Filters
  responses:
    single_workflow:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_workflow/properties/name'
                      archived_at:
                        $ref: '#/components/schemas/resource_workflow/properties/archived_at'
                  relationships:
                    type: object
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      workflow_statuses:
                        $ref: '#/components/schemas/_collection_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Single workflow
    collection_workflow:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/resource_workflow/properties/name'
                        archived_at:
                          $ref: '#/components/schemas/resource_workflow/properties/archived_at'
                    relationships:
                      type: object
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        workflow_statuses:
                          $ref: '#/components/schemas/_collection_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection workflow
  schemas:
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _collection_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Collection data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          description: Included variant — related resource identifiers are present in `data`.
          example:
            data:
              - type: tasks
                id: '42'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    resource_workflow:
      type: object
      title: Workflow Resource
      properties:
        archived:
          type: boolean
          title: Archived
          description: When true, filter to include only archived workflows.
          example: true
        organization:
          title: Organization
          description: The organization this workflow belongs to.
          example:
            eq: value
        query:
          type: string
          title: Query
          description: Text search query to filter workflows by name.
          example:
            eq: value
        workflow_statuses:
          title: Workflow Statuses
          description: The list of statuses defined in this workflow.
          example:
            eq: active
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this workflow was archived, or null if still active.
          example:
            gt: '2026-01-01'
        name:
          type: string
          title: Name
          description: The display name of this workflow.
          example:
            eq: value
      description: Named group of workflow statuses assigned to a project. Workflows define the task lifecycle for a project. Each workflow contains ordered statuses in Not Started, Started, or Closed categories.
      example:
        id: '75'
        type: workflows
        attributes:
          name: Default Workflow
          archived_at: null
        relationships:
          workflow_statuses:
            data:
              - type: workflow_statuses
                id: '224'
              - type: workflow_statuses
                id: '225'
              - type: workflow_statuses
                id: '226'
  requestBodies:
    workflow:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  attributes:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_workflow/properties/name'
      description: Request body for creating or updating a workflow. Specify the name and optional archived_at. Workflow statuses are managed separately via the workflow_statuses endpoint.
