openapi: 3.1.0
info:
  title: Productive.io API – Workflows
  version: 2.0.0
description: |-
  The Workflow object enables organizing tasks into distinct phases or stages, each with its own set of statuses.

  This allows tracking the progress of tasks from initiation to completion.

  You can learn more about Workflows in our Help documentation:
  [Workflows](https://help.productive.io/en/articles/5813154-workflows)
x-filters:
  workflow:
    query:
      description: Filter by workflow name using a partial text search.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by exact workflow name.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    archived:
      description: Filter to include only archived or non-archived workflows.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/workflows/{id}/archive:
    patch:
      tags:
        - Workflows
      summary: Archives a workflow
      operationId: workflows-archive-archive
      description: Archive a workflow to deactivate it.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_workflow'
        '409':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Conflict
  /api/v2/workflows:
    get:
      tags:
        - Workflows
      summary: Get workflows
      operationId: workflows-index
      description: List all workflows.
      parameters:
        - $ref: '#/components/parameters/filter_workflow'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_workflow'
      responses:
        '200':
          $ref: '#/components/responses/collection_workflow'
    post:
      tags:
        - Workflows
      summary: Create an workflow
      operationId: workflows-create
      description: Create a new workflow.
      parameters:
        - $ref: '#/components/parameters/header_organization'
      requestBody:
        $ref: '#/components/requestBodies/workflow'
      responses:
        '201':
          $ref: '#/components/responses/single_workflow'
        '403':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Forbidden
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
  /api/v2/workflows/{id}:
    get:
      tags:
        - Workflows
      summary: Gets a workflow
      operationId: workflows-show
      description: Retrieve a single workflow by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '200':
          $ref: '#/components/responses/single_workflow'
    patch:
      tags:
        - Workflows
      summary: Update an workflow
      operationId: workflows-update
      description: Update a workflow.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      requestBody:
        $ref: '#/components/requestBodies/workflow'
      responses:
        '200':
          $ref: '#/components/responses/single_workflow'
        '422':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Unprocessable Entity
    delete:
      tags:
        - Workflows
      summary: Deletes a workflow
      operationId: workflows-destroy
      description: Delete a workflow by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
        - $ref: '#/components/parameters/header_organization'
      responses:
        '204':
          description: No Content
  /api/v2/workflows/{id}/restore:
    patch:
      tags:
        - Workflows
      summary: Restores a workflow
      operationId: workflows-restore-restore
      description: Restore an archived workflow.
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID
      responses:
        '200':
          $ref: '#/components/responses/single_workflow'
        '201':
          content:
            application/vnd.api+json: {}
          headers:
            Content-Type:
              schema:
                type: string
          description: Created
components:
  responses:
    single_workflow:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: A single workflow record in JSON:API format.
            properties:
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              data:
                type: object
                description: The JSON:API data object for the returned workflow resource.
                properties:
                  attributes:
                    type: object
                    description: Workflow attributes.
                    properties:
                      archived_at:
                        $ref: '#/components/schemas/resource_workflow/properties/archived_at'
                      name:
                        $ref: '#/components/schemas/resource_workflow/properties/name'
                    example:
                      eq: value
                  relationships:
                    type: object
                    description: Workflow relationships.
                    properties:
                      organization:
                        $ref: '#/components/schemas/_single_relationship'
                      workflow_statuses:
                        $ref: '#/components/schemas/_collection_relationship'
                    example:
                      eq: value
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                id: '75'
                type: workflows
                attributes:
                  name: Default Workflow
                  archived_at: null
                relationships:
                  workflow_statuses:
                    data:
                      - type: workflow_statuses
                        id: '224'
                      - type: workflow_statuses
                        id: '225'
                      - type: workflow_statuses
                        id: '226'
              included: []
      description: Single workflow
    collection_workflow:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of workflow records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A workflow resource object.
                  properties:
                    relationships:
                      type: object
                      description: Workflow relationships.
                      properties:
                        workflow_statuses:
                          $ref: '#/components/schemas/_collection_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                    attributes:
                      type: object
                      description: Workflow attributes.
                      properties:
                        archived_at:
                          $ref: '#/components/schemas/resource_workflow/properties/archived_at'
                        name:
                          $ref: '#/components/schemas/resource_workflow/properties/name'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of workflow resource objects.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
            example:
              data:
                - id: '75'
                  type: workflows
                  attributes:
                    name: Default Workflow
                    archived_at: null
                  relationships:
                    workflow_statuses:
                      data:
                        - type: workflow_statuses
                          id: '224'
                        - type: workflow_statuses
                          id: '225'
                        - type: workflow_statuses
                          id: '226'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection workflow
  schemas:
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _collection_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Collection data
          description: Included variant — related resource identifiers are present in `data`.
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/_resource'
              description: Array of resource identifier objects for the related resources.
              example:
                - type: tasks
                  id: '42'
          example:
            data:
              - type: tasks
                id: '42'
      description: A JSON:API collection relationship — links to zero or more related resources.
      example:
        data:
          - type: tasks
            id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    resource_workflow:
      type: object
      title: Workflow Resource
      description: Named group of workflow statuses assigned to a project. Workflows define the task lifecycle for a project. Each workflow contains ordered statuses in Not Started, Started, or Closed categories.
      properties:
        archived_at:
          type: string
          title: Archived At
          format: date-time
          description: Timestamp when this workflow was archived, or null if still active.
          example:
            gt: '2026-01-01'
        query:
          type: string
          title: Query
          description: Text search query to filter workflows by name.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this workflow belongs to.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: The display name of this workflow.
          example:
            eq: value
        workflow_statuses:
          title: Workflow Statuses
          description: The list of statuses defined in this workflow.
          example:
            eq: active
        archived:
          type: boolean
          title: Archived
          description: When true, filter to include only archived workflows.
          example: true
      example:
        id: '75'
        type: workflows
        attributes:
          name: Default Workflow
          archived_at: null
        relationships:
          workflow_statuses:
            data:
              - type: workflow_statuses
                id: '224'
              - type: workflow_statuses
                id: '225'
              - type: workflow_statuses
                id: '226'
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_workflow:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - name
            - -name
          type: string
        title: Sort workflow
      explode: false
      required: false
      description: Sort workflow
    filter_workflow:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.workflow at the top of this file.
      required: false
      description: Filters
  requestBodies:
    workflow:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Request body for creating or updating a workflow.
            properties:
              data:
                type: object
                description: The JSON:API data object containing the workflow resource attributes and relationships.
                properties:
                  attributes:
                    type: object
                    description: Workflow attributes.
                    properties:
                      name:
                        $ref: '#/components/schemas/resource_workflow/properties/name'
                    required:
                      - name
                    example:
                      eq: value
                example:
                  eq: value
            example:
              data:
                type: workflows
                attributes:
                  name: Development Workflow
      description: Request body for creating or updating a workflow. Specify the name and optional archived_at. Workflow statuses are managed separately via the workflow_statuses endpoint.
