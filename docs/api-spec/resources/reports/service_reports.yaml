openapi: 3.1.0
info:
  title: Productive.io API – Reports – service_reports
  version: 2.0.0
x-filters:
  service_report:
    after:
      description: Filter by the bookable date of the service — services bookable after this date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    before:
      description: Filter by the bookable date of the service — services bookable before this date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    billable:
      description: Filter by whether the service is billable (true) or non-billable (false).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    billable_time:
      description: Filter by total billable time logged against the service (in minutes).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    billing_type:
      description: Filter by billing type (hourly, fixed, non-billable, etc.).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookable_after:
      description: Filter to services bookable after the given date within the associated budget period.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookable_before:
      description: Filter to services whose budget period ends before the given date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookable_date:
      description: Filters services to those bookable on the specified date, based on the budget's active period. Services on deals are always included.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    booked_time:
      description: Filter by total time booked (scheduled) on the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    booking_tracking_enabled:
      description: Filter by whether booking tracking is enabled on the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_cap_enabled:
      description: Filter by whether a budget cap is enabled on the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_custom_fields:
      description: Filter by budget-level custom field values.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_date:
      description: Filter by the start date of the associated budget.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_id:
      description: Filter by the associated budget ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_remaining:
      description: Filter by remaining budget amount (budget total minus budget used) in the deal currency.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_status:
      description: Filter by the status of the budget the service belongs to — open or delivered.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_total:
      description: Filter by total budget amount range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_used:
      description: Filter by amount of budget already used.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budgeted_time:
      description: Filter by the service's budgeted time (in minutes).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budgets_and_deals:
      description: When true, includes services from both deals and budgets.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by client company.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    contract_id:
      description: Filter by the associated contract ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    cost:
      description: Filter by work cost (labor cost) range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_fields:
      description: Filter by service-level custom field values.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_custom_fields:
      description: Filter by deal-level custom field values.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      description: Filter by the associated deal or budget.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_stage_id:
      description: Filter by deal stage (deprecated; use deal_status_id instead).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_status_id:
      description: Filter by the associated deal status (pipeline stage).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    discount:
      description: Filter by the service's discount percentage range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    discount_amount:
      description: Filter by discount amount range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    estimated_cost:
      description: Filter by estimated cost range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    estimated_time:
      description: Filter by estimated time range (in minutes).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    expense_cost:
      description: Filter by total expense cost range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    expense_tracking_enabled:
      description: Filter by whether expense tracking is enabled on the service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    for_tracking:
      description: Filter to services that the current person is allowed to track time against.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    formulas:
      description: Filter by custom formula values defined for the report.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    future_booked_time:
      description: Filter by total future booked time (upcoming bookings) in minutes.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    future_budget_used:
      description: Filter by the total future budget spent on the service, calculated from resourcing.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter by service ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    initial_service_id:
      description: Filter by the ID of the original service this one was created from (retainer rollover).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    left_to_schedule_time:
      description: Filter by the time remaining to schedule on the service — estimated minus already scheduled.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    limitation_type:
      description: Filter by the limitation type of the service — e.g. hours, amount, or none.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    markup:
      description: Filter by the service's markup percentage range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    markup_amount:
      description: Filter by markup amount range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    name:
      description: Filter by service name (text search).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    origin_deal_id:
      description: Filter by the deal this service's budget originated from.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    origin_service_id:
      description: Filter by the service this service was copied or derived from.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter to services accessible to the specified person for time tracking.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    pipeline_id:
      description: Filter by the ID of the pipeline the service's deal belongs to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    price:
      description: Filter by service price range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    probability:
      description: Filter by the associated deal's probability of closing (as a percentage).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    profit:
      description: Filter by the profit of the service — revenue minus cost.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    profit_margin:
      description: Filter by the profit margin of the service — profit divided by revenue.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_type:
      description: Filter service report results by project type.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    projected_revenue:
      description: Filter service report results by projected revenue.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    projectless_budgets:
      description: Filter service report results by projectless budgets.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    quantity:
      description: Filter service report results by quantity.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Filter service report results by query.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    recognized_revenue:
      description: Filter service report results by recognized revenue.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    remaining_scheduled_time:
      description: Filter service report results by remaining scheduled time.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    responsible_id:
      description: Filter service report results by responsible id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    revamped_unit:
      description: Filter service report results by revamped unit.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    revenue:
      description: Filter service report results by revenue.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    rolled_over_time:
      description: Filter service report results by rolled over time.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    sales_status_id:
      description: Filter service report results by sales status id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    section_id:
      description: Filter service report results by section id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_type_id:
      description: Filter service report results by service type id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    stage_status_id:
      description: Filter service report results by stage status id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    stage_type:
      description: Filter service report results by stage type.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter service report results by subsidiary id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_id:
      description: Filter service report results by task id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    template:
      description: Filter service report results by template.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    time_tracking_enabled:
      description: Filter service report results by time tracking enabled.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    trackable_by_person_id:
      description: Filter service report results by trackable by person id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    type:
      description: Filter service report results by type.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    unapproved_time:
      description: Filter service report results by unapproved time.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    unit:
      description: Filter service report results by unit.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updated_at:
      description: Filter service report results by updated at.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    with_memberships:
      description: Filter service report results by with memberships.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    worked_cost:
      description: Filter service report results by worked cost.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    worked_time:
      description: Filter service report results by worked time.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookable_date_for_period:
      description: '**Deprecated — use `bookable_date` instead**, which now returns identical results. Filters services to those bookable on the specified date, based on the budget''s active period. This filter will be removed in a future API version.'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    explicit_access:
      description: Filter services to only those the current user has explicit (non-implicit) access permissions on.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    overtime_time:
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/reports/service_reports:
    get:
      tags:
        - Reports
      summary: Get service reports
      operationId: reports-service_reports-index
      description: Retrieve aggregated service report data grouped by configurable dimensions.
      parameters:
        - $ref: '#/components/parameters/filter_service_report'
        - $ref: '#/components/parameters/sort_service_report'
        - $ref: '#/components/parameters/group_service_report'
      responses:
        '200':
          $ref: '#/components/responses/collection_service_report'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    collection_service_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Collection of aggregated service report rows.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A single aggregated service report row.
                  properties:
                    attributes:
                      type: object
                      description: Attributes of a service report row.
                      properties:
                        average_actual_rate:
                          $ref: '#/components/schemas/resource_service_report/properties/average_actual_rate'
                        average_actual_rate_default:
                          $ref: '#/components/schemas/resource_service_report/properties/average_actual_rate_default'
                        average_actual_rate_normalized:
                          $ref: '#/components/schemas/resource_service_report/properties/average_actual_rate_normalized'
                        average_budget_usage:
                          anyOf:
                            - $ref: '#/components/schemas/resource_service_report/properties/average_budget_usage'
                            - type: 'null'
                          description: Average budget usage for this service report group.
                        average_budget_usage_default:
                          anyOf:
                            - $ref: '#/components/schemas/resource_service_report/properties/average_budget_usage_default'
                            - type: 'null'
                          description: Average budget usage in the organization's default currency for this service report group.
                        average_budget_usage_normalized:
                          $ref: '#/components/schemas/resource_service_report/properties/average_budget_usage_normalized'
                        average_discount:
                          anyOf:
                            - $ref: '#/components/schemas/resource_service_report/properties/average_discount'
                            - type: 'null'
                          description: Average discount for this service report group.
                        average_forecasted_budget_usage:
                          anyOf:
                            - $ref: '#/components/schemas/resource_service_report/properties/average_forecasted_budget_usage'
                            - type: 'null'
                          description: Average forecasted budget usage for this service report group.
                        average_forecasted_budget_usage_default:
                          anyOf:
                            - $ref: '#/components/schemas/resource_service_report/properties/average_forecasted_budget_usage_default'
                            - type: 'null'
                          description: Average forecasted budget usage in the organization's default currency for this service report group.
                        average_forecasted_budget_usage_normalized:
                          $ref: '#/components/schemas/resource_service_report/properties/average_forecasted_budget_usage_normalized'
                        average_forecasted_time_usage:
                          anyOf:
                            - $ref: '#/components/schemas/resource_service_report/properties/average_forecasted_time_usage'
                            - type: 'null'
                          description: Average forecasted time usage for this service report group.
                        average_markup:
                          anyOf:
                            - $ref: '#/components/schemas/resource_service_report/properties/average_markup'
                            - type: 'null'
                          description: Average markup for this service report group.
                        average_profit_margin:
                          anyOf:
                            - $ref: '#/components/schemas/resource_service_report/properties/average_profit_margin'
                            - type: 'null'
                          description: Average profit margin for this service report group.
                        average_profit_margin_default:
                          anyOf:
                            - $ref: '#/components/schemas/resource_service_report/properties/average_profit_margin_default'
                            - type: 'null'
                          description: Average profit margin in the organization's default currency for this service report group.
                        average_profit_margin_normalized:
                          $ref: '#/components/schemas/resource_service_report/properties/average_profit_margin_normalized'
                        billable:
                          $ref: '#/components/schemas/resource_service_report/properties/billable'
                        billing_type:
                          $ref: '#/components/schemas/resource_service_report/properties/billing_type'
                        booking_tracking_enabled:
                          type: boolean
                          description: Booking tracking enabled for this service report group.
                        budget_cap_enabled:
                          type: boolean
                          description: Budget cap enabled for this service report group.
                        budget_custom_fields:
                          type: object
                          description: Budget custom fields for this service report group.
                        budget_status:
                          $ref: '#/components/schemas/resource_service_report/properties/budget_status'
                        count:
                          $ref: '#/components/schemas/resource_service_report/properties/count'
                        currency:
                          $ref: '#/components/schemas/resource_service_report/properties/currency'
                        currency_default:
                          $ref: '#/components/schemas/resource_service_report/properties/currency_default'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_service_report/properties/currency_normalized'
                        custom_fields:
                          type: object
                          description: Custom fields for this service report group.
                        date_period:
                          $ref: '#/components/schemas/resource_service_report/properties/date_period'
                        deal_custom_fields:
                          type: object
                          description: Deal custom fields for this service report group.
                        expense_tracking_enabled:
                          type: boolean
                          description: Expense tracking enabled for this service report group.
                        formula_fields:
                          $ref: '#/components/schemas/resource_service_report/properties/formula_fields'
                        group:
