          type: integer
          title: Unit
          description: Unit for this service report group.
          example:
            eq: value
        updated_at:
          type: string
          title: Updated At
          format: date
          description: Updated at for this service report group.
          example:
            gt: '2026-01-01'
        with_memberships:
          type: boolean
