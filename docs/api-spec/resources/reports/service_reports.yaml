      description: Group service report
  schemas:
    resource_service_report:
      type: object
      title: Service report Resource
      properties:
        company:
          title: Company
          description: Company for this service report group.
          example:
            eq: value
        company_id:
          type: integer
          title: Company
          description: Company id for this service report group.
          example:
            - 123
        total_expense_cost:
          title: Total Expense Cost
          description: Sum of expense cost across all records in this service report group.
          example:
            eq: value
        total_estimated_cost:
          title: Total Estimated Cost
          description: Sum of estimated cost across all records in this service report group.
          example:
            gt: 0
        total_profit_default:
          title: Total Profit Default
          description: Sum of profit in the organization's default currency across all records in this service report group.
          example:
            eq: value
        total_projected_revenue:
          title: Total Projected Revenue
          description: Sum of projected revenue across all records in this service report group.
          example:
            eq: value
        estimated_time:
          type: integer
          title: Estimated Time
          description: Estimated time for this service report group.
          example:
            gt: 0
        total_future_tentative_booked_time:
          type: number
          title: Total Future Tentative Booked Time
        group:
          type: string
          title: Group
          description: The grouping dimension for this service report row.
          example:
            eq: value
        unapproved_time:
          type: integer
          title: Unapproved Time
          description: Unapproved time for this service report group.
          example: 1500
        average_actual_rate:
          title: Average Actual Rate
          description: Average actual rate for this service report group.
          example:
            gt: 0
        discount:
          type: number
          title: Discount
          description: Discount for this service report group.
          example:
            gt: 0
        average_profit_margin_normalized:
          title: Average Profit Margin Normalized
          description: Average profit margin in the normalized currency for this service report group.
          example:
            eq: value
        count:
          type: integer
          title: Count
          description: Number of services in this report group.
          example:
            gt: 0
        with_memberships:
          type: boolean
          title: With Memberships
          description: With memberships for this service report group.
          example:
            eq: value
        average_budget_usage_normalized:
          title: Average Budget Usage Normalized
          description: Average budget usage in the normalized currency for this service report group.
          example:
            gt: 0
        currency:
          type: string
          title: Currency
          description: Currency for this service report group.
          example:
            eq: value
        section_name:
          type: string
          title: Section Name
          description: Section name for this service report group.
          example:
            eq: value
        profit_margin:
          type: number
          title: Profit Margin
          description: Profit margin for this service report group.
          example:
            eq: value
        average_budget_usage:
          type: number
          title: Average Budget Usage
          description: Average budget usage for this service report group.
          example:
            gt: 0
        total_cost_default:
          title: Total Cost Default
          description: Sum of cost in the organization's default currency across all records in this service report group.
          example:
            eq: value
        name:
          type: string
          title: Name
          description: Name for this service report group.
          example:
            eq: value
        total_budget_remaining_default:
          title: Total Budget Remaining Default
          description: Sum of budget remaining in the organization's default currency across all records in this service report group.
          example:
            gt: 0
        unit:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Unit
          description: Unit for this service report group.
          example:
            eq: value
        expense_cost:
          title: Expense Cost
          description: Expense cost for this service report group.
          example:
            eq: value
        currency_normalized:
          title: Currency Normalized
          description: Currency in the normalized currency for this service report group.
          example:
            eq: value
        for_tracking:
          type: boolean
          title: For Tracking
          description: For tracking for this service report group.
          example:
            eq: value
        origin_deal:
          title: Origin Deal
          description: Origin deal for this service report group.
          example:
            eq: value
        billing_type:
          enum:
            - 1
            - 2
            - 3
            - 4
          type: integer
          title: Billing Type
          description: Billing type for this service report group.
          example:
            eq: active
        bookable_date:
          type: string
