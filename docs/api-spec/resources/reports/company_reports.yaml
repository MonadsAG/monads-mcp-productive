    resource_company_report:
      type: object
      title: Company report Resource
      description: An aggregated company report row grouping client companies by configurable dimensions with revenue, invoicing, and relationship metrics.
      properties:
        tags:
          type: string
          title: Tags
          description: List of tags applied to the company.
          example:
            eq: value
        archived_at:
          type: string
          title: Archived At
          format: date
          description: Archived at for this company report group.
          example:
            gt: '2026-01-01'
        billing_name:
          type: string
          title: Billing Name
          description: Billing name for this company report group.
          example:
            eq: value
        company:
