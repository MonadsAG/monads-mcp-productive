    collection_company_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of aggregated company report rows, each grouping client companies by configurable dimensions with revenue, invoicing, and relationship metrics.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A company report resource object.
                  properties:
                    attributes:
                      type: object
                      description: Company report attributes.
                      properties:
                        contact_address:
