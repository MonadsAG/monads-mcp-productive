                        contact_zipcode:
                          $ref: '#/components/schemas/resource_company_report/properties/contact_zipcode'
                        count:
                          $ref: '#/components/schemas/resource_company_report/properties/count'
                        created_at_period:
                          $ref: '#/components/schemas/resource_company_report/properties/created_at_period'
                        currency:
                          $ref: '#/components/schemas/resource_company_report/properties/currency'
                        currency_default:
                          $ref: '#/components/schemas/resource_company_report/properties/currency_default'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_company_report/properties/currency_normalized'
                        custom_fields:
                          type: object
                          description: Custom field values for this company report row.
                        formula_fields:
                          $ref: '#/components/schemas/resource_company_report/properties/formula_fields'
                        group:
                          $ref: '#/components/schemas/resource_company_report/properties/group'
                        last_activity_at_period:
                          $ref: '#/components/schemas/resource_company_report/properties/last_activity_at_period'
                        month:
                          $ref: '#/components/schemas/resource_company_report/properties/month'
                        payment_terms:
                          $ref: '#/components/schemas/resource_company_report/properties/payment_terms'
                        quarter:
                          $ref: '#/components/schemas/resource_company_report/properties/quarter'
                        status:
                          $ref: '#/components/schemas/resource_company_report/properties/status'
                        week:
                          $ref: '#/components/schemas/resource_company_report/properties/week'
                        year:
                          $ref: '#/components/schemas/resource_company_report/properties/year'
                        payment_terms_type:
                          type: string
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Company report relationships.
                      properties:
                        company:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        report:
                          $ref: '#/components/schemas/_single_relationship'
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                        parent_company:
                          $ref: '#/components/schemas/_single_relationship'
                        parent_company_report:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of company report resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: r-006
                  type: company_reports
                  attributes:
                    revenue: '250000.00'
                    invoiced: '175000.00'
                    payments: '140000.00'
                    outstanding: '35000.00'
                    billable_time: 120000
                    company_id: 65111
                    currency: USD
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection company report
