paths:
  /api/v2/reports/company_reports:
    get:
      tags:
        - Reports
      summary: Get company reports
      responses:
        '200':
          $ref: '#/components/responses/collection_company_report'
      parameters:
        - $ref: '#/components/parameters/group_company_report'
        - $ref: '#/components/parameters/sort_company_report'
        - $ref: '#/components/parameters/filter_company_report'
        - $ref: '#/components/parameters/header_organization'
      operationId: reports-company_reports-index
      description: Retrieve aggregated company report data grouped by configurable dimensions.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_company_report:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.company_report at the top of this file.
      required: false
      description: Filters
    sort_company_report:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - company
            - -company
            - company_billing_name
            - -company_billing_name
            - company_code
            - -company_code
            - company_created_at
            - -company_created_at
            - company_custom_fields
            - -company_custom_fields
            - company_last_activity_at
