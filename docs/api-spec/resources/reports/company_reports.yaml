        title: Sort company report
      explode: false
      required: false
      description: Sort company report
    group_company_report:
      in: query
      name: group
      style: form
      schema:
        enum:
          - company
          - contact_address
          - contact_city
          - contact_country
          - contact_email
          - contact_phone
          - contact_state
          - contact_website
          - contact_zipcode
          - created_at
          - custom_fields
          - last_activity_at
