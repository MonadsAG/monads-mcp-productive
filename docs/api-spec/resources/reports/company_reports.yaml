      explode: false
      required: false
      description: Group company report
  schemas:
    resource_company_report:
      type: object
      title: Company report Resource
      properties:
        project_id:
          type: integer
          title: Project
          description: ID of the project associated with this report row.
          example:
            - 123
        fuzzy_dates:
          type: string
          title: Fuzzy Dates
          description: Fuzzy date range values used in the report query for flexible date matching.
          example:
            gt: '2026-01-01'
        last_activity_at_period:
          title: Last Activity At Period
          description: Time period grouping for last activity date (e.g. week, month, quarter).
          example:
            gt: '2026-01-01'
        name:
          type: string
          title: Name
          description: Display name of the company.
          example:
            eq: value
        contact_address:
          title: Contact Address
          description: Street address of the company's primary contact.
          example:
            eq: value
        group:
          type: string
          title: Group
          description: The grouping dimension for this company report row.
          example:
            eq: value
        organization:
          title: Organization
          description: Relationship link to the organization this report belongs to.
          example:
            eq: value
        has_parent_company:
          type: boolean
          title: Has Parent Company
          description: When true, this company has a parent company in the hierarchy.
          example:
            eq: value
        default_subsidiary_id:
          type: integer
          title: Default Subsidiary
          description: ID of the default subsidiary associated with this company.
          example:
            - 123
        default_tax_rate_id:
          type: integer
          title: Default Tax Rate
          description: ID of the default tax rate applied to the company's invoices.
          example:
            - 123
        full_query:
          type: string
          title: Full Query
          description: Full query string used to generate this report row.
          example:
            eq: value
        subsidiary:
          title: Subsidiary
          description: Subsidiary for this company report group.
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date
          description: Created at for this company report group.
          example:
            gt: '2026-01-01'
        id:
          type: integer
          title: Id
          description: Unique identifier for this company report row.
          example:
            - 123
        company_id:
          type: integer
          title: Company
          description: Unique identifier of the company.
          example:
            - 123
        jump_query:
          type: string
          title: Jump Query
          description: Jump query string for navigating directly to the underlying records of this report row.
          example:
            eq: value
        contact_zipcode:
          title: Contact Zipcode
          description: Contact zipcode for this company report group.
          example:
            eq: value
        contact_state:
          title: Contact State
          description: State or province of the company's primary contact.
          example:
            eq: active
        subscriber_id:
          type: integer
          title: Subscriber
          description: Subscriber id for this company report group.
          example:
            - 123
        parent_company:
          title: Parent Company
          description: The parent company of this company in the hierarchy.
          example:
            eq: value
        quarter:
          type: string
          title: Quarter
          description: Quarter number (1–4) of the time dimension bucket for this report row.
          example:
            eq: value
        subsidiary_id:
          type: integer
          title: Subsidiary
          description: Subsidiary id for this company report group.
          example:
            - 123
        company_last_activity_at:
          title: Company Last Activity At
          description: Timestamp of the most recent activity on the company associated with this report row.
          example:
            gt: '2026-01-01'
        due_days:
          type: integer
          title: Due Days
          description: Payment due days — number of days after invoice date that payment is due.
          example:
            eq: value
        query:
          type: string
          title: Query
          description: Query parameters used to generate this report row.
          example:
            eq: value
        fuzzy_people:
          type: string
          title: Fuzzy People
          description: Fuzzy people references used in the report query for flexible person matching.
          example:
            eq: value
        month:
          type: string
          title: Month
          description: Month number of the time dimension bucket for this report row.
          example:
            eq: value
        parent_company_report:
          title: Parent Company Report
          description: Report object for the parent company of this company in the hierarchy.
          example:
            eq: value
        company_name:
          title: Company Name
          description: Display name of the company.
          example:
            eq: value
        report:
          title: Report
          description: Relationship link to the saved report filter this row is generated from.
          example:
            eq: value
        last_activity_at:
          type: string
          title: Last Activity At
          format: date
          description: Timestamp of the most recent activity on this company.
          example:
            gt: '2026-01-01'
        billing_name:
          type: string
          title: Billing Name
          description: Billing name for this company report group.
          example:
            eq: value
        company_custom_fields:
          title: Company Custom Fields
          description: Custom field values associated with the company.
          example:
            eq: value
        tags:
          type: string
          title: Tags
          description: List of tags applied to the company.
          example:
            eq: value
        contact_email:
          title: Contact Email
          description: Email address of the company's primary contact.
          example:
            eq: value
        company:
          title: Company
          description: Company for this company report group.
          example:
            eq: value
        status:
          enum:
            - 1
            - 2
          type: integer
          title: Status
          description: Status for this company report group.
          example:
            eq: active
        vat:
          type: string
          title: Vat
          description: Vat for this company report group.
          example:
            eq: value
        contact_phone:
          title: Contact Phone
          description: Phone number of the company's primary contact.
          example:
            eq: value
        created_at_period:
          title: Created At Period
          description: Time period grouping for created at (e.g. week, month, quarter).
          example:
            gt: '2026-01-01'
        currency_default:
          title: Currency Default
          description: Default currency code of the company.
          example:
            eq: value
        company_billing_name:
          title: Company Billing Name
          description: Company billing name for this company report group.
          example:
            eq: value
        custom_fields:
          type: string
          title: Custom Fields
          description: Custom field values associated with this report row.
          example:
            eq: value
        payment_terms_type:
          type: integer
          title: Payment Terms Type
        company_code:
          type: string
          title: Company Code
          description: Unique identifier code assigned to the company.
          example:
            eq: value
        contact_website:
          title: Contact Website
          description: Website URL of the company's primary contact.
          example:
            eq: value
        payment_terms:
          type: integer
          title: Payment Terms
          description: Payment terms in days — number of days after invoice issue that payment is due.
          example:
            eq: value
        contact_city:
          title: Contact City
          description: City of the company's primary contact.
          example:
            eq: value
        exclude_company_and_children:
          type: integer
          title: Exclude Company And Children
          description: When true, excludes this company and all its subsidiaries from results when filtering by parent company.
          example:
            eq: value
        count:
          type: integer
          title: Count
          description: Number of companys in this report group.
          example:
            gt: 0
        currency_normalized:
          title: Currency Normalized
          description: Currency code after normalization to the organization's reporting currency.
          example:
            eq: value
        week:
          type: string
          title: Week
          description: Week grouping for this company report row.
          example:
            eq: value
        company_created_at:
          title: Company Created At
          description: Date and time when the company was created.
          example:
            gt: '2026-01-01'
        default_currency:
          type: string
          title: Default Currency
          description: Default currency code configured for the company.
          example:
            eq: value
        formula_fields:
          title: Formula Fields
          description: Computed formula field values for this report row.
          example:
            eq: value
        parent_company_id:
          type: integer
          title: Parent Company
          description: ID of the parent company in the organizational hierarchy.
          example:
            - 123
        year:
          type: string
          title: Year
          description: Year grouping for this company report row.
          example:
            eq: value
        archived_at:
          type: string
          title: Archived At
          format: date
          description: Archived at for this company report group.
          example:
            gt: '2026-01-01'
        currency:
          title: Currency
          description: Currency code used for monetary values in this report row.
          example:
            eq: value
        contact_country:
          title: Contact Country
          description: Country of the company's primary contact.
          example:
            gt: 0
      description: An aggregated company report row grouping client companies by configurable dimensions with revenue, invoicing, and relationship metrics.
      example:
        id: '123'
        type: company_reports
        attributes:
          total_revenue: 250000
          invoiced: 175000
          payments: 140000
          company_id: 67
        relationships: {}
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
