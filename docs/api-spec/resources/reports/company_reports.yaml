                        formula_fields:
                          $ref: '#/components/schemas/resource_company_report/properties/formula_fields'
                        contact_address:
                          $ref: '#/components/schemas/resource_company_report/properties/contact_address'
                        contact_country:
                          $ref: '#/components/schemas/resource_company_report/properties/contact_country'
                        contact_website:
                          $ref: '#/components/schemas/resource_company_report/properties/contact_website'
                        contact_zipcode:
                          $ref: '#/components/schemas/resource_company_report/properties/contact_zipcode'
                        currency_default:
                          $ref: '#/components/schemas/resource_company_report/properties/currency_default'
                        created_at_period:
                          $ref: '#/components/schemas/resource_company_report/properties/created_at_period'
                        payment_terms_type:
                          $ref: '#/components/schemas/resource_company_report/properties/payment_terms_type'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_company_report/properties/currency_normalized'
                        last_activity_at_period:
