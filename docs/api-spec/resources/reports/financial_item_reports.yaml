paths:
  /api/v2/reports/financial_item_reports:
    get:
      tags:
        - Reports
      summary: Get financial item reports
      operationId: reports-financial_item_reports-index
      description: Retrieve aggregated financial item report data grouped by configurable dimensions.
      parameters:
        - $ref: '#/components/parameters/filter_financial_item_report'
        - $ref: '#/components/parameters/sort_financial_item_report'
        - $ref: '#/components/parameters/group_financial_item_report'
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_number'
        - $ref: '#/components/parameters/page_after'
      responses:
        '200':
          $ref: '#/components/responses/collection_financial_item_report'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
