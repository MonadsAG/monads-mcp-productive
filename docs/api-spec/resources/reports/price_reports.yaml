paths:
  /api/v2/reports/price_reports:
    get:
      tags:
        - Reports
      summary: Get price reports
      operationId: reports-price_reports-index
      description: Retrieve aggregated price report data grouped by configurable dimensions.
      parameters:
        - $ref: '#/components/parameters/filter_price_report'
        - $ref: '#/components/parameters/sort_price_report'
        - $ref: '#/components/parameters/group_price_report'
      responses:
        '200':
          $ref: '#/components/responses/collection_price_report'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
