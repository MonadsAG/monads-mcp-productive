                            - type: 'null'
                          description: Average markup for this price report group.
                        average_markup_amount:
                          $ref: '#/components/schemas/resource_price_report/properties/average_markup_amount'
                        average_markup_amount_default:
                          $ref: '#/components/schemas/resource_price_report/properties/average_markup_amount_default'
                        average_markup_amount_normalized:
                          $ref: '#/components/schemas/resource_price_report/properties/average_markup_amount_normalized'
                        average_rate:
