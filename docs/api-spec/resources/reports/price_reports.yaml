                        average_estimated_cost:
                          $ref: '#/components/schemas/resource_price_report/properties/average_estimated_cost'
                        average_discount_amount:
                          $ref: '#/components/schemas/resource_price_report/properties/average_discount_amount'
                        average_discounted_rate:
                          $ref: '#/components/schemas/resource_price_report/properties/average_discounted_rate'
                        average_rate_normalized:
                          $ref: '#/components/schemas/resource_price_report/properties/average_rate_normalized'
                        booking_tracking_enabled:
                          $ref: '#/components/schemas/resource_price_report/properties/booking_tracking_enabled'
                        expense_tracking_enabled:
                          $ref: '#/components/schemas/resource_price_report/properties/expense_tracking_enabled'
                        average_markup_amount_default:
                          $ref: '#/components/schemas/resource_price_report/properties/average_markup_amount_default'
                        average_estimated_cost_default:
                          $ref: '#/components/schemas/resource_price_report/properties/average_estimated_cost_default'
                        average_discount_amount_default:
                          $ref: '#/components/schemas/resource_price_report/properties/average_discount_amount_default'
