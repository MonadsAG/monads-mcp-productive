openapi: 3.1.0
info:
  title: Productive.io API – Reports – price_reports
  version: 2.0.0
x-filters:
  price_report:
    unit_id:
      description: Filter price report results by unit id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    time_tracking_enabled:
      description: Filter price report results by time tracking enabled.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_fields:
      description: Filter price report results by custom fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    expense_tracking_enabled:
      description: Filter price report results by expense tracking enabled.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    rate_card_id:
      description: Filter price report results by rate card id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_type_id:
      description: Filter price report results by service type id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter price report results by company id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    billing_type_id:
      description: Filter price report results by billing type id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter price report results by id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    rate_card_status:
      description: Filter price report results by rate card status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    booking_tracking_enabled:
      description: Filter price report results by booking tracking enabled.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/reports/price_reports:
    get:
      tags:
        - Reports
      summary: Get price reports
      responses:
        '200':
          $ref: '#/components/responses/collection_price_report'
      parameters:
        - $ref: '#/components/parameters/filter_price_report'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/group_price_report'
        - $ref: '#/components/parameters/sort_price_report'
      operationId: reports-price_reports-index
      description: Retrieve aggregated price report data grouped by configurable dimensions.
components:
  parameters:
    sort_price_report:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - average_discount
            - -average_discount
            - average_discount_amount
            - -average_discount_amount
            - average_discounted_rate
            - -average_discounted_rate
            - average_estimated_cost
            - -average_estimated_cost
            - average_markup
            - -average_markup
            - average_markup_amount
            - -average_markup_amount
            - average_rate
            - -average_rate
            - booking_tracking_enabled
            - -booking_tracking_enabled
            - company
            - -company
            - count
            - -count
            - expense_tracking_enabled
            - -expense_tracking_enabled
            - price
            - -price
            - price_description
            - -price_description
            - price_name
            - -price_name
            - price_quantity
            - -price_quantity
            - rate_card
            - -rate_card
            - rate_card_status
            - -rate_card_status
            - service_type
            - -service_type
            - time_tracking_enabled
            - -time_tracking_enabled
          type: string
        title: Sort price report
      explode: false
      required: false
      description: Sort price report
    group_price_report:
      in: query
      name: group
      style: form
      schema:
        enum:
          - booking_tracking_enabled
          - company
          - currency
          - expense_tracking_enabled
          - organization
          - price
          - rate_card
          - rate_card_status
          - service_type
          - time_tracking_enabled
        type: string
        title: Group price report
      explode: false
      required: false
      description: Group price report
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    filter_price_report:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.price_report at the top of this file.
      required: false
      description: Filters
  schemas:
    resource_price_report:
      type: object
      title: Price report Resource
      properties:
        average_estimated_cost:
          title: Average Estimated Cost
          description: Average estimated cost for this price report group.
          example:
            gt: 0
        average_rate_normalized:
          title: Average Rate Normalized
          description: Average rate in the normalized currency for this price report group.
          example:
            gt: 0
        currency_normalized:
          title: Currency Normalized
          description: Currency in the normalized currency for this price report group.
          example:
            eq: value
        count:
          type: integer
          title: Count
          description: Number of prices in this report group.
          example:
            gt: 0
        company:
          title: Company
          description: Company for this price report group.
          example:
            eq: value
        rate_card:
          title: Rate Card
          description: Rate card for this price report group.
          example:
            gt: 0
        average_estimated_cost_default:
          title: Average Estimated Cost Default
          description: Average estimated cost in the organization's default currency for this price report group.
          example:
            gt: 0
        average_discount_amount_default:
          title: Average Discount Amount Default
          description: Average discount amount in the organization's default currency for this price report group.
          example:
            gt: 0
        company_id:
          type: integer
          title: Company
          description: Company id for this price report group.
          example:
            - 123
        price_name:
          title: Price Name
          description: Price name for this price report group.
          example:
            gt: 0
        billing_type_id:
          enum:
            - 1
            - 2
            - 3
            - 4
          type: integer
          title: Billing Type
          description: Billing type id for this price report group.
          example:
            - 123
        formula_fields:
          title: Formula Fields
          description: Formula fields for this price report group.
          example:
            eq: value
        price_description:
          title: Price Description
          description: Price description for this price report group.
          example:
            gt: 0
        service_type:
          title: Service Type
          description: Service type for this price report group.
          example:
            eq: active
        expense_tracking_enabled:
          type: integer
          title: Expense Tracking Enabled
          description: Expense tracking enabled for this price report group.
          example:
            eq: value
        booking_tracking_enabled:
          type: integer
          title: Booking Tracking Enabled
          description: Booking tracking enabled for this price report group.
          example:
            eq: value
        average_discounted_rate_normalized:
          title: Average Discounted Rate Normalized
          description: Average discounted rate in the normalized currency for this price report group.
          example:
            gt: 0
        group:
          type: string
          title: Group
          description: The grouping dimension for this price report row.
          example:
            eq: value
        average_markup_amount_default:
          title: Average Markup Amount Default
          description: Average markup amount in the organization's default currency for this price report group.
          example:
            gt: 0
        currency_default:
          title: Currency Default
          description: Currency in the organization's default currency for this price report group.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: Unique identifier for this price report row.
          example:
            - 123
        company_report:
          title: Company Report
          description: Company report for this price report group.
          example:
            eq: value
        average_rate:
          title: Average Rate
          description: Average rate for this price report group.
          example:
            gt: 0
        unit_id:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Unit
          description: Unit id for this price report group.
          example:
            - 123
        service_type_id:
          type: integer
          title: Service Type
          description: Service type id for this price report group.
          example:
            - 123
        average_markup_amount_normalized:
          title: Average Markup Amount Normalized
          description: Average markup amount in the normalized currency for this price report group.
          example:
            gt: 0
        price:
          title: Price
          description: Price for this price report group.
          example:
            gt: 0
        average_markup_amount:
          title: Average Markup Amount
          description: Average markup amount for this price report group.
          example:
            gt: 0
        organization:
          title: Organization
          description: Organization for this price report group.
          example:
            eq: value
        average_rate_default:
          title: Average Rate Default
          description: Average rate in the organization's default currency for this price report group.
          example:
            gt: 0
        report:
          title: Report
          description: Report for this price report group.
          example:
            eq: value
        time_tracking_enabled:
          type: integer
          title: Time Tracking Enabled
          description: Time tracking enabled for this price report group.
          example:
            gt: 0
        custom_fields:
          type: string
          title: Custom Fields
          description: Custom fields for this price report group.
          example:
            eq: value
        average_discount_amount:
          title: Average Discount Amount
          description: Average discount amount for this price report group.
          example:
            gt: 0
        currency:
          type: string
          title: Currency
          description: Currency for this price report group.
          example:
            eq: value
        rate_card_status:
          enum:
            - 1
            - 2
          type: integer
          title: Rate Card Status
          description: Rate card status for this price report group.
          example:
            gt: 0
        rate_card_id:
          type: integer
          title: Rate Card
          description: Rate card id for this price report group.
          example:
            - 123
        price_quantity:
          title: Price Quantity
          description: Price quantity for this price report group.
          example:
            gt: 0
        average_discount_amount_normalized:
          title: Average Discount Amount Normalized
          description: Average discount amount in the normalized currency for this price report group.
          example:
            gt: 0
        average_estimated_cost_normalized:
          title: Average Estimated Cost Normalized
          description: Average estimated cost in the normalized currency for this price report group.
          example:
            gt: 0
        average_markup:
          type: number
          title: Average Markup
          description: Average markup for this price report group.
          example:
            eq: value
        average_discount:
          type: number
          title: Average Discount
          description: Average discount for this price report group.
          example:
            gt: 0
        average_discounted_rate_default:
          title: Average Discounted Rate Default
          description: Average discounted rate in the organization's default currency for this price report group.
          example:
            gt: 0
        average_discounted_rate:
          title: Average Discounted Rate
          description: Average discounted rate for this price report group.
          example:
            gt: 0
      description: An aggregated price report row grouping rate card prices by configurable dimensions.
      example:
        id: '123'
        type: price_reports
        attributes:
          total_price: 75000
          currency: USD
          project_id: 45
        relationships: {}
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  responses:
    collection_price_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
