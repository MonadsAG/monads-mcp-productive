                        formula_fields:
                          $ref: '#/components/schemas/resource_price_report/properties/formula_fields'
                        group:
                          $ref: '#/components/schemas/resource_price_report/properties/group'
                        rate_card_status:
                          $ref: '#/components/schemas/resource_price_report/properties/rate_card_status'
                        time_tracking_enabled:
                          type: boolean
                          description: Time tracking enabled for this price report group.
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Price Report row relationships.
                      properties:
                        company:
                          $ref: '#/components/schemas/_single_relationship'
                        company_report:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        price:
                          $ref: '#/components/schemas/_single_relationship'
                        rate_card:
                          $ref: '#/components/schemas/_single_relationship'
                        report:
