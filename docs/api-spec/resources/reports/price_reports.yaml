                  example:
                    eq: value
                description: Array of price report row resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: An included related resource object.
                  example:
                    eq: value
                description: Array of included related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: r-021
                  type: price_reports
                  attributes:
                    rate: '150.00'
                    total: '75000.00'
                    estimated_hours: 500
                    service_type_id: 5
                    company_id: 65111
                    currency: USD
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
