                        booking_tracking_enabled:
                          type: boolean
                          description: Booking tracking enabled for this price report group.
                        count:
                          $ref: '#/components/schemas/resource_price_report/properties/count'
                        currency:
                          $ref: '#/components/schemas/resource_price_report/properties/currency'
