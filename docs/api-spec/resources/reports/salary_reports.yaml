      summary: Get salary reports
      operationId: reports-salary_reports-index
      description: Retrieve aggregated salary report data grouped by configurable dimensions.
      parameters:
        - $ref: '#/components/parameters/filter_new_salary_report'
        - $ref: '#/components/parameters/sort_new_salary_report'
        - $ref: '#/components/parameters/group_new_salary_report'
