openapi: 3.1.0
info:
  title: Productive.io API – Reports – payment_reports
  version: 2.0.0
x-filters:
  payment_report:
    number:
      description: Filter payment report results by number.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_id:
      description: Filter by the associated budget (deal) ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    invoice_id:
      description: Filter payment report results by invoice id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    written_off_on:
      description: Filter payment report results by written off on.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    paid_after:
      description: Filter payment report results by paid after.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    amount:
      description: Filter by payment amount range.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    formulas:
      description: Filter payment report results by formulas.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subsidiary_id:
      description: Filter payment report results by subsidiary id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter payment report results by id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter payment report results by company id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Filter payment report results by query.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    external_id:
      description: Filter payment report results by external id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    paid_before:
      description: Filter payment report results by paid before.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter payment report results by project id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    paid_on:
      description: Filter payment report results by paid on.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/reports/payment_reports:
    get:
      tags:
        - Reports
      summary: Get payment reports
      responses:
        '200':
          $ref: '#/components/responses/collection_payment_report'
      parameters:
        - $ref: '#/components/parameters/filter_payment_report'
        - $ref: '#/components/parameters/sort_payment_report'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/group_payment_report'
      operationId: reports-payment_reports-index
      description: Retrieve aggregated payment report data grouped by configurable dimensions.
components:
  parameters:
    group_payment_report:
      in: query
      name: group
      style: form
      schema:
        enum:
          - company
          - date
          - invoice
          - month
          - organization
          - payment
          - quarter
          - subsidiary
          - week
          - year
        type: string
        title: Group payment report
      explode: false
      required: false
      description: Group payment report
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_payment_report:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - company
            - -company
            - count
            - -count
            - date
            - -date
            - deal
            - -deal
            - invoice
            - -invoice
            - month
            - -month
            - payment
            - -payment
            - payment_date
            - -payment_date
            - payment_external_id
            - -payment_external_id
            - payment_note
            - -payment_note
            - payment_paid_on
            - -payment_paid_on
            - payment_written_off_on
            - -payment_written_off_on
            - project
            - -project
            - quarter
            - -quarter
            - subsidiary
            - -subsidiary
            - total_amount
            - -total_amount
            - week
            - -week
            - year
            - -year
          type: string
        title: Sort payment report
      explode: false
      required: false
      description: Sort payment report
    filter_payment_report:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.payment_report at the top of this file.
      required: false
      description: Filters
  schemas:
    resource_payment_report:
      type: object
      title: Payment report Resource
      properties:
        count:
          type: integer
          title: Count
          description: Number of payments in this report group.
          example:
            gt: 0
        group:
          type: string
          title: Group
          description: The grouping dimension for this payment report row.
          example:
            eq: value
        currency:
          type: string
          title: Currency
          description: Currency for this payment report group.
          example:
            eq: value
        written_off_on:
          type: string
          title: Written Off On
          format: date
          description: Written off on for this payment report group.
          example:
            eq: value
        invoice_id:
          type: integer
          title: Invoice
          description: Invoice id for this payment report group.
          example:
            - 123
        invoice:
          title: Invoice
          description: Invoice for this payment report group.
          example:
            eq: value
        amount:
          title: Amount
          description: Amount for this payment report group.
          example:
            gt: 0
        subsidiary:
          title: Subsidiary
          description: Subsidiary for this payment report group.
          example:
            eq: value
        budget_id:
          type: integer
          title: Budget
          description: Budget id for this payment report group.
          example:
            - 123
        id:
          type: integer
          title: Id
          description: Unique identifier for this payment report row.
          example:
            - 123
        month:
          type: string
          title: Month
          description: Month grouping for this payment report row.
          example:
            eq: value
        company:
          title: Company
          description: Company for this payment report group.
          example:
            eq: value
        paid_after:
          type: string
          title: Paid After
          format: date
          description: Paid after for this payment report group.
          example:
            eq: value
        company_report:
          title: Company Report
          description: Company report for this payment report group.
          example:
            eq: value
        payment_note:
          title: Payment Note
          description: Payment note for this payment report group.
          example:
            eq: value
        payment_date:
          title: Payment Date
          description: Payment date for this payment report group.
          example:
            gt: '2026-01-01'
        query:
          type: string
          title: Query
          description: Query for this payment report group.
          example:
            eq: value
        formula_fields:
          title: Formula Fields
          description: Formula fields for this payment report group.
          example:
            eq: value
        project_id:
          type: integer
          title: Project
          description: Project id for this payment report group.
          example:
            - 123
        quarter:
          type: string
          title: Quarter
          description: Quarter grouping for this payment report row.
          example:
            eq: value
        year:
          type: string
          title: Year
          description: Year grouping for this payment report row.
          example:
            eq: value
        currency_default:
          title: Currency Default
          description: Currency in the organization's default currency for this payment report group.
          example:
            eq: value
        total_amount:
          title: Total Amount
          description: Sum of amount across all records in this payment report group.
          example:
            gt: 0
        company_id:
          type: integer
          title: Company
          description: Company id for this payment report group.
          example:
            - 123
        subsidiary_id:
          type: integer
          title: Subsidiary
          description: Subsidiary id for this payment report group.
          example:
            - 123
        paid_on:
          type: string
          title: Paid On
          format: date
          description: Paid on for this payment report group.
          example:
            eq: value
        external_id:
          type: string
          title: External
          description: External id for this payment report group.
          example:
            - 123
        total_amount_normalized:
          title: Total Amount Normalized
          description: Sum of amount in the normalized currency across all records in this payment report group.
          example:
            gt: 0
        date_period:
          title: Date Period
          description: Time period grouping for date (e.g. week, month, quarter).
          example:
            eq: value
        report:
          title: Report
          description: Report for this payment report group.
          example:
            eq: value
        organization:
          title: Organization
          description: Organization for this payment report group.
          example:
            eq: value
        total_amount_default:
          title: Total Amount Default
          description: Sum of amount in the organization's default currency across all records in this payment report group.
          example:
            gt: 0
        deal:
          title: Deal
          description: Deal for this payment report group.
          example:
            eq: value
        currency_normalized:
          title: Currency Normalized
          description: Currency in the normalized currency for this payment report group.
          example:
            eq: value
        payment_external_id:
          title: Payment External
          description: Payment external id for this payment report group.
          example:
            - 123
        paid_before:
          type: string
          title: Paid Before
          format: date
          description: Paid before for this payment report group.
          example:
            eq: value
        invoice_report:
          title: Invoice Report
          description: Invoice report for this payment report group.
          example:
            eq: value
        week:
          type: string
          title: Week
          description: Week grouping for this payment report row.
          example:
            eq: value
        payment_written_off_on:
          title: Payment Written Off On
          description: Payment written off on for this payment report group.
          example:
            eq: value
        payment_paid_on:
          title: Payment Paid On
          description: Payment paid on for this payment report group.
          example:
            eq: value
        project:
          title: Project
          description: Project for this payment report group.
          example:
            eq: value
        date:
          title: Date
          description: Date for this payment report group.
          example:
            gt: '2026-01-01'
        payment:
          title: Payment
          description: Payment for this payment report group.
          example:
            eq: value
        number:
          type: string
          title: Number
          description: Number for this payment report group.
          example:
            eq: value
        formulas:
          type: integer
          title: Formulas
          description: Formulas for this payment report group.
          example:
            eq: value
      description: An aggregated payment report row grouping invoices and payments by configurable dimensions with payment amount metrics.
      example:
        id: '123'
        type: payment_reports
        attributes:
          amount: 5000
          paid_on: '2026-01-15'
          invoice_id: 234
        relationships: {}
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  responses:
    collection_payment_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        week:
                          $ref: '#/components/schemas/resource_payment_report/properties/week'
                        year:
                          $ref: '#/components/schemas/resource_payment_report/properties/year'
                        count:
                          $ref: '#/components/schemas/resource_payment_report/properties/count'
                        group:
                          $ref: '#/components/schemas/resource_payment_report/properties/group'
                        month:
                          $ref: '#/components/schemas/resource_payment_report/properties/month'
                        quarter:
                          $ref: '#/components/schemas/resource_payment_report/properties/quarter'
                        currency:
                          $ref: '#/components/schemas/resource_payment_report/properties/currency'
                        date_period:
                          $ref: '#/components/schemas/resource_payment_report/properties/date_period'
                        total_amount:
                          $ref: '#/components/schemas/resource_payment_report/properties/total_amount'
                        formula_fields:
                          $ref: '#/components/schemas/resource_payment_report/properties/formula_fields'
                        currency_default:
                          $ref: '#/components/schemas/resource_payment_report/properties/currency_default'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_payment_report/properties/currency_normalized'
                        total_amount_default:
                          $ref: '#/components/schemas/resource_payment_report/properties/total_amount_default'
                        total_amount_normalized:
                          $ref: '#/components/schemas/resource_payment_report/properties/total_amount_normalized'
                    relationships:
                      type: object
                      properties:
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        report:
                          $ref: '#/components/schemas/_single_relationship'
                        company:
                          $ref: '#/components/schemas/_single_relationship'
                        invoice:
                          $ref: '#/components/schemas/_single_relationship'
                        payment:
                          $ref: '#/components/schemas/_single_relationship'
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        company_report:
                          $ref: '#/components/schemas/_single_relationship'
                        invoice_report:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection payment report
