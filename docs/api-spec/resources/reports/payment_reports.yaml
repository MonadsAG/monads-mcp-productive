    collection_payment_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of payment report records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A payment report row resource object.
                  properties:
                    attributes:
                      type: object
                      description: Payment Report row attributes.
                      properties:
                        count:
                          $ref: '#/components/schemas/resource_payment_report/properties/count'
                        currency:
                          anyOf:
