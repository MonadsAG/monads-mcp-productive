                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Payment Report row relationships.
                      properties:
                        company:
                          $ref: '#/components/schemas/_single_relationship'
                        company_report:
                          $ref: '#/components/schemas/_single_relationship'
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        invoice:
                          $ref: '#/components/schemas/_single_relationship'
                        invoice_report:
