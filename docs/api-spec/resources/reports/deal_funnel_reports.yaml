    collection_deal_funnel_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of deal funnel report records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A deal funnel report resource object.
                  properties:
                    attributes:
                      type: object
                      description: Deal funnel report attributes.
                      properties:
                        count:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/count'
                        currency:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/currency'
                        currency_default:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/currency_default'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/currency_normalized'
                        formula_fields:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/formula_fields'
                        group:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/group'
                        lost_count:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/lost_count'
                        total_budget_total:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/total_budget_total'
                        total_budget_total_default:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/total_budget_total_default'
                        total_budget_total_normalized:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/total_budget_total_normalized'
                        total_projected_revenue:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/total_projected_revenue'
                        total_projected_revenue_default:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/total_projected_revenue_default'
                        total_projected_revenue_normalized:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/total_projected_revenue_normalized'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Deal funnel report relationships.
                      properties:
                        deal_status:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        pipeline:
                          $ref: '#/components/schemas/_single_relationship'
                        report:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of deal funnel report resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: r-014
                  type: deal_funnel_reports
                  attributes:
                    stage: proposal
                    deal_count: 5
                    total_value: '125000.00'
                    pipeline_id: 1
                    currency: USD
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection deal funnel report
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
