        - type
      example:
        type: tasks
        id: '42'
    resource_deal_funnel_report:
      type: object
      title: Deal funnel report Resource
      description: An aggregated deal funnel report showing pipeline conversion rates, stage progression, and win/loss analysis. Each row represents deals grouped by pipeline stage (deal status), with counts of active and lost deals and total financial values. Used to visualize funnel drop-off and conversion across the sales pipeline.
      properties:
        budget_total:
          title: Budget Total
          description: Total contracted budget value for deals in this funnel stage.
          example:
            gt: 0
        count:
          type: integer
          title: Count
          description: Number of deals grouped into this report row.
          example:
            gt: 0
        created_at:
          type: string
          title: Created At
          format: date
          description: Timestamp when this report row was created.
          example:
            gt: '2026-01-01'
        currency:
          type: string
          title: Currency
          description: Currency code for this report row, reflecting the budget currency.
          example:
            eq: value
        currency_default:
          title: Currency Default
          description: Currency code for totals expressed in the organization's default currency.
          example:
            eq: value
        currency_normalized:
          title: Currency Normalized
          description: Currency code for totals expressed in the organization's normalized (common) currency.
          example:
            eq: value
        date:
          type: string
          title: Date
          format: date
          description: Date dimension for time-based filtering of the funnel report.
          example:
            gt: '2026-01-01'
        deal_funnel:
          title: Deal Funnel
          description: Related deal funnel data combining pipeline, deal status, and this report row — used by the UI to compute conversion metrics.
          example:
            eq: value
        deal_status:
          title: Deal Status
          description: The deal status (pipeline stage) this funnel row is grouped by.
          example:
            eq: active
        formula_fields:
          title: Formula Fields
          description: Formula fields — key-value hash of custom formula results for this report row.
          example:
            eq: value
        formulas:
          type: integer
          title: Formulas
          description: Custom formula results for this report row, keyed by formula identifier.
          example:
            eq: value
        group:
          type: string
          title: Group
          description: Dimension value used to group this report row (e.g. pipeline stage name or deal status label).
          example:
            eq: value
        lost_count:
          type: integer
          title: Lost Count
          description: Number of deals in this funnel stage that were marked as lost.
          example:
            gt: 0
        organization:
          title: Organization
          description: The organization this report row belongs to.
          example:
            eq: value
        pipeline:
          title: Pipeline
          description: The pipeline this report row belongs to.
          example:
            eq: value
        pipeline_id:
          type: integer
          title: Pipeline
          description: ID of the pipeline this funnel row is grouped by.
          example:
            - 123
        projected_revenue:
          title: Projected Revenue
          description: Projected revenue for deals in this funnel stage, based on budget forecasting.
          example:
            eq: value
        report:
          title: Report
          description: The parent report row for this funnel row, used in hierarchical grouping.
          example:
            eq: value
        total_budget_total:
          title: Total Budget Total
          description: Sum of total budget value for all deals in this funnel stage, in the budget currency.
          example:
            gt: 0
        total_budget_total_default:
          title: Total Budget Total Default
          description: Sum of total budget value for all deals in this funnel stage, in the organization's default currency.
          example:
            gt: 0
        total_budget_total_normalized:
          title: Total Budget Total Normalized
          description: Sum of total budget value for all deals in this funnel stage, in the normalized common currency.
          example:
            gt: 0
        total_projected_revenue:
          title: Total Projected Revenue
          description: Sum of projected revenue for all deals in this funnel stage, in the budget currency.
          example:
            eq: value
        total_projected_revenue_default:
          title: Total Projected Revenue Default
          description: Sum of projected revenue for all deals in this funnel stage, in the organization's default currency.
          example:
            eq: value
        total_projected_revenue_normalized:
          title: Total Projected Revenue Normalized
          description: Sum of projected revenue for all deals in this funnel stage, in the normalized common currency.
          example:
            eq: value
      example:
        id: '123'
        type: deal_funnel_reports
        attributes:
          stage: proposal
          deal_count: 5
          total_value: 125000
          win_rate: 0.6
        relationships: {}
  parameters:
    group_deal_funnel_report:
      in: query
      name: group
      style: form
      schema:
        enum:
          - deal_funnel
          - deal_status
          - organization
          - pipeline
        type: string
        title: Group deal funnel report
      explode: false
      required: false
      description: Group deal funnel report
    sort_deal_funnel_report:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort deal funnel report
      explode: false
      required: false
      description: Sort deal funnel report
    filter_deal_funnel_report:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.deal_funnel_report at the top of this file.
      required: false
      description: Filters
