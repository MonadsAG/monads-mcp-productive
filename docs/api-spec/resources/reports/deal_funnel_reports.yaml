openapi: 3.1.0
info:
  title: Productive.io API – Reports – deal_funnel_reports
  version: 2.0.0
x-filters:
  deal_funnel_report:
    created_at:
      description: Filter deal funnel report results by created at.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    formulas:
      description: Filter deal funnel report results by formulas.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_total:
      description: Filter deal funnel report results by budget total.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    projected_revenue:
      description: Filter deal funnel report results by projected revenue.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    date:
      description: Filter deal funnel report results by date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    pipeline_id:
      description: Filter deal funnel report results by pipeline id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/reports/deal_funnel_reports:
    get:
      tags:
        - Reports
      summary: Get funnel reports
      responses:
        '200':
          $ref: '#/components/responses/collection_deal_funnel_report'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_deal_funnel_report'
        - $ref: '#/components/parameters/sort_deal_funnel_report'
        - $ref: '#/components/parameters/group_deal_funnel_report'
      operationId: reports-deal_funnel_reports-index
      description: Retrieve aggregated deal funnel report data grouped by configurable dimensions.
components:
  parameters:
    group_deal_funnel_report:
      in: query
      name: group
      style: form
      schema:
        enum:
          - deal_funnel
          - deal_status
          - organization
          - pipeline
        type: string
        title: Group deal funnel report
      explode: false
      required: false
      description: Group deal funnel report
    sort_deal_funnel_report:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          type: string
        title: Sort deal funnel report
      explode: false
      required: false
      description: Sort deal funnel report
    filter_deal_funnel_report:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.deal_funnel_report at the top of this file.
      required: false
      description: Filters
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
  schemas:
    resource_deal_funnel_report:
      type: object
      title: Deal funnel report Resource
      properties:
        group:
          type: string
          title: Group
          description: Dimension value used to group this report row (e.g. pipeline stage name or deal status label).
          example:
            eq: value
        report:
          title: Report
          description: The parent report row for this funnel row, used in hierarchical grouping.
          example:
            eq: value
        deal_status:
          title: Deal Status
          description: The deal status (pipeline stage) this funnel row is grouped by.
          example:
            eq: active
        total_budget_total:
          title: Total Budget Total
          description: Sum of total budget value for all deals in this funnel stage, in the budget currency.
          example:
            gt: 0
        pipeline:
          title: Pipeline
          description: The pipeline this report row belongs to.
          example:
            eq: value
        total_projected_revenue_normalized:
          title: Total Projected Revenue Normalized
          description: Sum of projected revenue for all deals in this funnel stage, in the normalized common currency.
          example:
            eq: value
        lost_count:
          type: integer
          title: Lost Count
          description: Number of deals in this funnel stage that were marked as lost.
          example:
            gt: 0
        pipeline_id:
          type: integer
          title: Pipeline
          description: ID of the pipeline this funnel row is grouped by.
          example:
            - 123
        date:
          type: string
          title: Date
          format: date
          description: Date dimension for time-based filtering of the funnel report.
          example:
            gt: '2026-01-01'
        formula_fields:
          title: Formula Fields
          description: Formula fields — key-value hash of custom formula results for this report row.
          example:
            eq: value
        total_budget_total_normalized:
          title: Total Budget Total Normalized
          description: Sum of total budget value for all deals in this funnel stage, in the normalized common currency.
          example:
            gt: 0
        budget_total:
          title: Budget Total
          description: Total contracted budget value for deals in this funnel stage.
          example:
            gt: 0
        currency:
          type: string
          title: Currency
          description: Currency code for this report row, reflecting the budget currency.
          example:
            eq: value
        total_projected_revenue:
          title: Total Projected Revenue
          description: Sum of projected revenue for all deals in this funnel stage, in the budget currency.
          example:
            eq: value
        organization:
          title: Organization
          description: The organization this report row belongs to.
          example:
            eq: value
        total_projected_revenue_default:
          title: Total Projected Revenue Default
          description: Sum of projected revenue for all deals in this funnel stage, in the organization's default currency.
          example:
            eq: value
        projected_revenue:
          title: Projected Revenue
          description: Projected revenue for deals in this funnel stage, based on budget forecasting.
          example:
            eq: value
        formulas:
          type: integer
          title: Formulas
          description: Custom formula results for this report row, keyed by formula identifier.
          example:
            eq: value
        currency_normalized:
          title: Currency Normalized
          description: Currency code for totals expressed in the organization's normalized (common) currency.
          example:
            eq: value
        deal_funnel:
          title: Deal Funnel
          description: Related deal funnel data combining pipeline, deal status, and this report row — used by the UI to compute conversion metrics.
          example:
            eq: value
        total_budget_total_default:
          title: Total Budget Total Default
          description: Sum of total budget value for all deals in this funnel stage, in the organization's default currency.
          example:
            gt: 0
        created_at:
          type: string
          title: Created At
          format: date
          description: Timestamp when this report row was created.
          example:
            gt: '2026-01-01'
        count:
          type: integer
          title: Count
          description: Number of deals grouped into this report row.
          example:
            gt: 0
        currency_default:
          title: Currency Default
          description: Currency code for totals expressed in the organization's default currency.
          example:
            eq: value
      description: An aggregated deal funnel report showing pipeline conversion rates, stage progression, and win/loss analysis. Each row represents deals grouped by pipeline stage (deal status), with counts of active and lost deals and total financial values. Used to visualize funnel drop-off and conversion across the sales pipeline.
      example:
        id: '123'
        type: deal_funnel_reports
        attributes:
          stage: proposal
          deal_count: 5
          total_value: 125000
          win_rate: 0.6
        relationships: {}
    _meta:
      type: object
      title: Meta
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  responses:
    collection_deal_funnel_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        count:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/count'
                        group:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/group'
                        currency:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/currency'
                        lost_count:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/lost_count'
                        formula_fields:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/formula_fields'
                        currency_default:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/currency_default'
                        total_budget_total:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/total_budget_total'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/currency_normalized'
                        total_projected_revenue:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/total_projected_revenue'
                        total_budget_total_default:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/total_budget_total_default'
                        total_budget_total_normalized:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/total_budget_total_normalized'
                        total_projected_revenue_default:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/total_projected_revenue_default'
                        total_projected_revenue_normalized:
                          $ref: '#/components/schemas/resource_deal_funnel_report/properties/total_projected_revenue_normalized'
                    relationships:
                      type: object
                      properties:
                        report:
                          $ref: '#/components/schemas/_single_relationship'
                        pipeline:
                          $ref: '#/components/schemas/_single_relationship'
                        deal_status:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection deal funnel report
