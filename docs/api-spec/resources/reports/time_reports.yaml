info:
  title: Productive.io API – Reports – time_reports
  version: 2.0.0
x-filters:
  new_time_report:
    after:
      description: Filter by the report end date (exclusive upper bound). Accepts a date string or filter operators.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    before:
      description: Filter by the report start date (inclusive lower bound). Accepts a date string or filter operators.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    billing_type:
      description: Filter by billing type of the associated service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookings_after:
      description: Filter to time entries for bookings that end on or after this date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookings_before:
      description: Filter to time entries for bookings that start on or before this date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookings_custom_fields:
      description: Filter by custom field values on the associated booking.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_id:
      description: Filter by budget (deal) ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_tags:
      description: Filter by tags on the associated budget.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter by client company.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    date:
      description: Filter by specific date. Accepts a date string or filter operators.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    day:
      description: 'Deprecated: filter by a specific day (use date range filters instead).'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    event_id:
      description: Filter by absence category (event) ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    formulas:
      description: Filter using report formula expressions for computed metrics.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    future:
      description: Filter to include future or past data. When true, includes future scheduled data.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    month:
      description: 'Deprecated: filter by a specific month (use date range filters instead).'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    people_custom_fields:
      description: Filter by custom field values on the associated person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter by specific person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_tags:
      description: Filter by tags on the associated person.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_type:
      description: Filter by person type (employee, contractor, etc.).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter by the associated project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_type:
      description: Filter by project type (billable or internal).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    quarter:
      description: 'Deprecated: filter by a specific quarter (use date range filters instead).'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    role_id:
      description: Filter by the person's role.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_id:
      description: Filter by the associated service.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_type_id:
      description: Filter by the associated service type.
      operators:
        - contains
