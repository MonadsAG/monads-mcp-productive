paths:
  /api/v2/reports/timesheet_reports:
    get:
      tags:
        - Reports
      summary: Get timesheet reports
      responses:
        '200':
          $ref: '#/components/responses/collection_timesheet_report'
      parameters:
        - $ref: '#/components/parameters/filter_timesheet_report'
        - $ref: '#/components/parameters/group_timesheet_report'
        - $ref: '#/components/parameters/sort_timesheet_report'
        - $ref: '#/components/parameters/header_organization'
      operationId: reports-timesheet_reports-index
      description: Retrieve aggregated timesheet report data grouped by configurable dimensions.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_timesheet_report:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - count
            - -count
            - friday_capacity
            - -friday_capacity
            - friday_time
            - -friday_time
            - monday_capacity
            - -monday_capacity
            - monday_time
            - -monday_time
            - person
            - -person
            - saturday_capacity
            - -saturday_capacity
            - saturday_time
            - -saturday_time
            - sunday_capacity
            - -sunday_capacity
            - sunday_time
            - -sunday_time
            - thursday_capacity
            - -thursday_capacity
            - thursday_time
            - -thursday_time
            - tuesday_capacity
            - -tuesday_capacity
            - tuesday_time
            - -tuesday_time
            - wednesday_capacity
            - -wednesday_capacity
            - wednesday_time
            - -wednesday_time
            - week
            - -week
            - week_submission_status
            - -week_submission_status
          type: string
        title: Sort timesheet report
      explode: false
      required: false
      description: Sort timesheet report
    group_timesheet_report:
      in: query
      name: group
      style: form
      schema:
        enum:
          - organization
          - person
          - week
        type: string
        title: Group timesheet report
      explode: false
      required: false
      description: Group timesheet report
    filter_timesheet_report:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.timesheet_report at the top of this file.
      required: false
      description: Filters
