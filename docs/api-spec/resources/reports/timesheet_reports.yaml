    collection_timesheet_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of timesheet report records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A timesheet report row resource object.
                  properties:
                    attributes:
                      type: object
                      description: Timesheet Report row attributes.
                      properties:
                        count:
                          $ref: '#/components/schemas/resource_timesheet_report/properties/count'
                        currency:
                          $ref: '#/components/schemas/resource_timesheet_report/properties/currency'
                        currency_default:
                          $ref: '#/components/schemas/resource_timesheet_report/properties/currency_default'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_timesheet_report/properties/currency_normalized'
                        formula_fields:
                          $ref: '#/components/schemas/resource_timesheet_report/properties/formula_fields'
                        friday_available:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/friday_available'
                            - type: 'null'
                          description: Friday available for this timesheet report group.
                        friday_capacity:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/friday_capacity'
                            - type: 'null'
                          description: Friday capacity for this timesheet report group.
                        friday_time:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/friday_time'
                            - type: 'null'
                          description: Friday time for this timesheet report group.
                        group:
                          $ref: '#/components/schemas/resource_timesheet_report/properties/group'
                        monday_available:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/monday_available'
                            - type: 'null'
                          description: Monday available for this timesheet report group.
                        monday_capacity:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/monday_capacity'
                            - type: 'null'
                          description: Monday capacity for this timesheet report group.
                        monday_time:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/monday_time'
                            - type: 'null'
                          description: Monday time for this timesheet report group.
                        saturday_available:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/saturday_available'
                            - type: 'null'
                          description: Saturday available for this timesheet report group.
                        saturday_capacity:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/saturday_capacity'
                            - type: 'null'
                          description: Saturday capacity for this timesheet report group.
                        saturday_time:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/saturday_time'
                            - type: 'null'
                          description: Saturday time for this timesheet report group.
                        sunday_available:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/sunday_available'
                            - type: 'null'
                          description: Sunday available for this timesheet report group.
                        sunday_capacity:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/sunday_capacity'
                            - type: 'null'
                          description: Sunday capacity for this timesheet report group.
                        sunday_time:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/sunday_time'
                            - type: 'null'
                          description: Sunday time for this timesheet report group.
                        thursday_available:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/thursday_available'
                            - type: 'null'
                          description: Thursday available for this timesheet report group.
                        thursday_capacity:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/thursday_capacity'
                            - type: 'null'
                          description: Thursday capacity for this timesheet report group.
                        thursday_time:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/thursday_time'
                            - type: 'null'
                          description: Thursday time for this timesheet report group.
                        tuesday_available:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/tuesday_available'
                            - type: 'null'
                          description: Tuesday available for this timesheet report group.
                        tuesday_capacity:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/tuesday_capacity'
                            - type: 'null'
                          description: Tuesday capacity for this timesheet report group.
                        tuesday_time:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/tuesday_time'
                            - type: 'null'
                          description: Tuesday time for this timesheet report group.
                        wednesday_available:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/wednesday_available'
                            - type: 'null'
                          description: Wednesday available for this timesheet report group.
                        wednesday_capacity:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/wednesday_capacity'
                            - type: 'null'
                          description: Wednesday capacity for this timesheet report group.
                        wednesday_time:
                          anyOf:
                            - $ref: '#/components/schemas/resource_timesheet_report/properties/wednesday_time'
                            - type: 'null'
                          description: Wednesday time for this timesheet report group.
                        week:
                          $ref: '#/components/schemas/resource_timesheet_report/properties/week'
                        week_submission_status:
                          $ref: '#/components/schemas/resource_timesheet_report/properties/week_submission_status'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Timesheet Report row relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                        report:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of timesheet report row resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: An included related resource object.
                  example:
                    eq: value
                description: Array of included related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: '567'
                  type: timesheets
                  attributes:
                    status: submitted
                    week_starting: '2026-03-10'
                    total_time: 2400
                    submitted_at: '2026-03-17T09:00:00.000+00:00'
                    approved_at: null
                  relationships:
                    person:
                      data:
                        type: people
                        id: '12'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection timesheet report
  schemas:
    error:
