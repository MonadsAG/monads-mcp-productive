openapi: 3.1.0
info:
  title: Productive.io API – Reports – timesheet_reports
  version: 2.0.0
x-filters:
  timesheet_report:
    tags:
      description: Filter timesheet report results by tags.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    after:
      description: Filter timesheet report results by after.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    before:
      description: Filter timesheet report results by before.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    people_custom_fields:
      description: Filter timesheet report results by people custom fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter timesheet report results by person id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_status:
      description: Filter timesheet report results by person status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Filter timesheet report results by query.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    week_submission_status:
      description: Filter timesheet report results by week submission status.
      operators:
        - contains
        - eq
        - not_contain
