paths:
  /api/v2/reports/line_item_reports:
    get:
      tags:
        - Reports
      summary: Get line item reports
      responses:
        '200':
          $ref: '#/components/responses/collection_line_item_report'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_line_item_report'
        - $ref: '#/components/parameters/group_line_item_report'
        - $ref: '#/components/parameters/filter_line_item_report'
      operationId: reports-line_item_reports-index
      description: Retrieve aggregated line item report data grouped by configurable dimensions.
components:
  parameters:
    filter_line_item_report:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.line_item_report at the top of this file.
      required: false
      description: Filters
    group_line_item_report:
      in: query
      name: group
      style: form
      schema:
        enum:
          - company
          - creator
          - expense
          - invoice
          - kpd_code
          - line_item
          - organization
          - service
          - service_type
          - unit
          - updater
        type: string
        title: Group line item report
      explode: false
      required: false
      description: Group line item report
    sort_line_item_report:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - budget
            - -budget
            - company
            - -company
            - count
            - -count
            - creator
            - -creator
            - expense
            - -expense
            - invoice
            - -invoice
            - kpd_code
            - -kpd_code
            - service
            - -service
            - tax_rate
            - -tax_rate
            - total_amount
            - -total_amount
            - total_amount_tax
            - -total_amount_tax
            - total_amount_with_tax
            - -total_amount_with_tax
            - unit_id
            - -unit_id
            - unit_price
            - -unit_price
            - updater
            - -updater
          type: string
        title: Sort line item report
      explode: false
      required: false
      description: Sort line item report
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
  schemas:
    resource_line_item_report:
      type: object
      title: Line item report Resource
      properties:
        currency_default:
          title: Currency Default
          description: Currency in the organization's default currency for this line item report group.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: Unique identifier for this line item report row.
          example:
            - 123
        unit_price_normalized:
          title: Unit Price Normalized
          description: Unit price in the normalized currency for this line item report group.
          example:
            gt: 0
        unit_price:
          title: Unit Price
          description: Unit price for this line item report group.
          example:
            gt: 0
        service_id:
          type: integer
          title: Service
          description: Service id for this line item report group.
          example:
            - 123
        invoice:
          title: Invoice
          description: Invoice for this line item report group.
          example:
            eq: value
        total_amount_tax:
          title: Total Amount Tax
          description: Sum of amount tax across all records in this line item report group.
          example:
            gt: 0
        company:
          title: Company
          description: Company for this line item report group.
          example:
            eq: value
        creator_id:
          type: integer
          title: Creator
          description: Creator id for this line item report group.
          example:
            - 123
        kpd_code:
          title: Kpd Code
          description: Kpd code for this line item report group.
          example:
            data:
              type: kpd_codes
              id: '42'
        quantity:
          type: number
          title: Quantity
          description: Quantity for this line item report group.
          example:
            eq: value
        tax_rate:
          type: string
          title: Tax Rate
          description: Tax rate for this line item report group.
          example:
            gt: 0
        unit_price_default:
          title: Unit Price Default
          description: Unit price in the organization's default currency for this line item report group.
          example:
            gt: 0
        line_item:
          title: Line Item
          description: Line item for this line item report group.
          example:
            eq: value
        invoice_report:
          title: Invoice Report
          description: Invoice report for this line item report group.
          example:
            eq: value
        service_type_id:
          type: integer
          title: Service Type
          description: Service type id for this line item report group.
          example:
            - 123
        total_amount:
          title: Total Amount
          description: Sum of amount across all records in this line item report group.
          example:
            gt: 0
        organization:
          title: Organization
          description: Organization for this line item report group.
          example:
            eq: value
        total_amount_with_tax:
          title: Total Amount With Tax
          description: Sum of amount with tax across all records in this line item report group.
          example:
            gt: 0
        discount:
          type: number
          title: Discount
          description: Discount for this line item report group.
          example:
            gt: 0
        service:
          title: Service
          description: Service for this line item report group.
          example:
            eq: value
        formula_fields:
          title: Formula Fields
          description: Formula fields for this line item report group.
          example:
            eq: value
        invoice_id:
          type: integer
          title: Invoice
          description: Invoice id for this line item report group.
          example:
            - 123
        total_amount_default:
          title: Total Amount Default
          description: Sum of amount in the organization's default currency across all records in this line item report group.
          example:
            gt: 0
        expense:
          title: Expense
          description: Expense for this line item report group.
          example:
            eq: value
        company_id:
          type: integer
          title: Company
          description: Company id for this line item report group.
          example:
            - 123
        updater_id:
          type: integer
          title: Updater
          description: Updater id for this line item report group.
          example:
            - 123
        tax_value:
          type: number
          title: Tax Value
          description: Tax value for this line item report group.
          example:
            eq: value
        total_amount_normalized:
          title: Total Amount Normalized
          description: Sum of amount in the normalized currency across all records in this line item report group.
          example:
            gt: 0
        budget:
          title: Budget
          description: Budget for this line item report group.
          example:
            gt: 0
        tax_name:
          type: string
          title: Tax Name
          description: Tax name for this line item report group.
          example:
            eq: value
        report:
          title: Report
          description: Report for this line item report group.
          example:
            eq: value
        total_amount_with_tax_default:
          title: Total Amount With Tax Default
          description: Sum of amount with tax in the organization's default currency across all records in this line item report group.
          example:
            gt: 0
        expense_id:
          type: integer
          title: Expense
          description: Expense id for this line item report group.
          example:
            - 123
        total_amount_tax_default:
          title: Total Amount Tax Default
          description: Sum of amount tax in the organization's default currency across all records in this line item report group.
          example:
            gt: 0
        unit:
          title: Unit
          description: Unit for this line item report group.
          example:
            eq: value
        unit_id:
          type: integer
          title: Unit
          description: Unit id for this line item report group.
          example:
            - 123
        creator:
          title: Creator
          description: Creator for this line item report group.
          example:
            eq: value
        total_amount_tax_normalized:
          title: Total Amount Tax Normalized
          description: Sum of amount tax in the normalized currency across all records in this line item report group.
          example:
            gt: 0
        count:
          type: integer
          title: Count
          description: Number of line items in this report group.
          example:
            gt: 0
        currency:
          type: string
          title: Currency
          description: Currency for this line item report group.
          example:
            eq: value
        currency_normalized:
          title: Currency Normalized
          description: Currency in the normalized currency for this line item report group.
          example:
            eq: value
        updater:
          title: Updater
          description: Updater for this line item report group.
          example:
            eq: value
        service_type:
          title: Service Type
          description: Service type for this line item report group.
          example:
            eq: active
        total_amount_with_tax_normalized:
          title: Total Amount With Tax Normalized
          description: Sum of amount with tax in the normalized currency across all records in this line item report group.
          example:
            gt: 0
        group:
          type: string
          title: Group
          description: The grouping dimension for this line item report row.
          example:
            eq: value
      description: An aggregated line item report row grouping invoice line items by configurable dimensions with amount metrics.
      example:
        id: '123'
        type: line_item_reports
        attributes:
          quantity: 10
          unit_price: 1500
          total_price: 15000
          service_id: 34
        relationships: {}
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
