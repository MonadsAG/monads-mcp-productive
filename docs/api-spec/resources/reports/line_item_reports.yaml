    collection_line_item_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of line item report records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A line item report resource object.
                  properties:
                    attributes:
                      type: object
                      description: Line item report attributes.
                      properties:
                        count:
                          $ref: '#/components/schemas/resource_line_item_report/properties/count'
                        currency:
                          anyOf:
                            - $ref: '#/components/schemas/resource_line_item_report/properties/currency'
                            - type: 'null'
                          description: The line item currency code.
                        currency_default:
                          $ref: '#/components/schemas/resource_line_item_report/properties/currency_default'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_line_item_report/properties/currency_normalized'
                        discount:
                          anyOf:
                            - type: string
                            - type: 'null'
                          description: Discount percentage applied to line items in this group.
                        formula_fields:
                          $ref: '#/components/schemas/resource_line_item_report/properties/formula_fields'
                        group:
                          $ref: '#/components/schemas/resource_line_item_report/properties/group'
                        quantity:
                          type: string
                          description: Total quantity of line items in this group.
                        tax_rate:
                          anyOf:
                            - $ref: '#/components/schemas/resource_line_item_report/properties/tax_rate'
                            - type: 'null'
                          description: Tax rate percentage for line items in this group.
                        total_amount:
                          $ref: '#/components/schemas/resource_line_item_report/properties/total_amount'
                        total_amount_default:
                          $ref: '#/components/schemas/resource_line_item_report/properties/total_amount_default'
                        total_amount_normalized:
                          $ref: '#/components/schemas/resource_line_item_report/properties/total_amount_normalized'
                        total_amount_tax:
                          $ref: '#/components/schemas/resource_line_item_report/properties/total_amount_tax'
                        total_amount_tax_default:
                          $ref: '#/components/schemas/resource_line_item_report/properties/total_amount_tax_default'
                        total_amount_tax_normalized:
                          $ref: '#/components/schemas/resource_line_item_report/properties/total_amount_tax_normalized'
                        total_amount_with_tax:
                          $ref: '#/components/schemas/resource_line_item_report/properties/total_amount_with_tax'
                        total_amount_with_tax_default:
                          $ref: '#/components/schemas/resource_line_item_report/properties/total_amount_with_tax_default'
                        total_amount_with_tax_normalized:
                          $ref: '#/components/schemas/resource_line_item_report/properties/total_amount_with_tax_normalized'
                        unit_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_line_item_report/properties/unit_id'
                            - type: 'null'
                          description: The unit type identifier for line items in this group.
                        unit_price:
                          $ref: '#/components/schemas/resource_line_item_report/properties/unit_price'
                        unit_price_default:
                          $ref: '#/components/schemas/resource_line_item_report/properties/unit_price_default'
                        unit_price_normalized:
                          $ref: '#/components/schemas/resource_line_item_report/properties/unit_price_normalized'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Line item report relationships.
                      properties:
                        company:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        expense:
                          $ref: '#/components/schemas/_single_relationship'
                        invoice:
                          $ref: '#/components/schemas/_single_relationship'
                        invoice_report:
                          $ref: '#/components/schemas/_single_relationship'
                        kpd_code:
                          $ref: '#/components/schemas/_single_relationship'
                        line_item:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        report:
                          $ref: '#/components/schemas/_single_relationship'
                        service:
                          $ref: '#/components/schemas/_single_relationship'
                        service_type:
                          $ref: '#/components/schemas/_single_relationship'
                        updater:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of line item report resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: r-013
                  type: line_item_reports
                  attributes:
                    quantity: 10
                    unit_price: '150.00'
                    total_price: '1500.00'
                    service_id: 1856422
                    invoice_id: 234
                    currency: USD
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection line item report
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
