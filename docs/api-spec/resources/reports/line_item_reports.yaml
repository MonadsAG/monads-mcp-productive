        - not_eq
    company_id:
      description: Filter line item report results by company id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter line item report results by id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_type_id:
      description: Filter line item report results by service type id.
      operators:
        - contains
        - eq
