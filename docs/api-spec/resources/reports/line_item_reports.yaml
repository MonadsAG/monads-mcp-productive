openapi: 3.1.0
info:
  title: Productive.io API – Reports – line_item_reports
  version: 2.0.0
x-filters:
  line_item_report:
    creator_id:
      description: Filter line item report results by creator id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    expense_id:
      description: Filter line item report results by expense id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updater_id:
      description: Filter line item report results by updater id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    tax_name:
      description: Filter line item report results by tax name.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    discount:
      description: Filter line item report results by discount.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_id:
      description: Filter line item report results by service id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    tax_value:
      description: Filter line item report results by tax value.
      operators:
