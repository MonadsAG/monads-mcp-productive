        - $ref: '#/components/parameters/filter_budget_report'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_budget_report'
      operationId: reports-budget_reports-index
      description: Retrieve a paginated list of aggregated budget report rows. Supports filtering, grouping, and sorting by budget dimensions and metrics.
