openapi: 3.1.0
info:
  title: Productive.io API – Reports – survey_reports
  version: 2.0.0
x-filters:
  survey_report:
    title:
      description: Filter survey report results by title.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    editable:
      description: Filter survey report results by editable.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filter survey report results by created at.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter survey report results by project id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter survey report results by id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter survey report results by creator id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Filter survey report results by query.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/reports/survey_reports:
    get:
      tags:
        - Reports
      summary: Get survey reports
      operationId: reports-survey_reports-index
      description: Retrieve aggregated survey report data grouped by configurable dimensions.
      parameters:
        - $ref: '#/components/parameters/group_survey_report'
        - $ref: '#/components/parameters/sort_survey_report'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/filter_survey_report'
      responses:
        '200':
          $ref: '#/components/responses/collection_survey_report'
components:
  responses:
    collection_survey_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of survey report records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A survey report row resource object.
                  properties:
                    relationships:
                      type: object
                      description: Survey Report row relationships.
                      properties:
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        project:
                          $ref: '#/components/schemas/_single_relationship'
                        survey:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        report:
                          $ref: '#/components/schemas/_single_relationship'
                        updater:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                    attributes:
                      type: object
                      description: Survey Report row attributes.
                      properties:
                        title:
                          $ref: '#/components/schemas/resource_survey_report/properties/title'
                        currency:
                          $ref: '#/components/schemas/resource_survey_report/properties/currency'
                        created_at:
                          $ref: '#/components/schemas/resource_survey_report/properties/created_at'
                        formula_fields:
                          $ref: '#/components/schemas/resource_survey_report/properties/formula_fields'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_survey_report/properties/currency_normalized'
                        group:
                          $ref: '#/components/schemas/resource_survey_report/properties/group'
                        count:
                          $ref: '#/components/schemas/resource_survey_report/properties/count'
                        currency_default:
                          $ref: '#/components/schemas/resource_survey_report/properties/currency_default'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of survey report row resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: An included related resource object.
                  example:
                    eq: value
                description: Array of included related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: r-017
                  type: survey_reports
                  attributes:
                    response_count: 42
                    avg_score: 4.2
                    survey_id: 7
                    project_id: 6899
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection survey report
  schemas:
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    resource_survey_report:
      type: object
      title: Survey report Resource
      description: An aggregated survey report row grouping survey submissions by configurable dimensions.
      properties:
        currency_default:
          title: Currency Default
          description: Currency in the organization's default currency for this survey report group.
          example:
            eq: value
        query:
          type: string
          title: Query
          description: Query for this survey report group.
          example:
            eq: value
        currency_normalized:
          title: Currency Normalized
          description: Currency in the normalized currency for this survey report group.
          example:
            eq: value
        group:
          type: string
          title: Group
          description: The grouping dimension for this survey report row.
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date
          description: Created at for this survey report group.
          example:
            gt: '2026-01-01'
        survey_id:
          title: Survey
          description: Survey id for this survey report group.
          example:
            - 123
        formula_fields:
          title: Formula Fields
          description: Formula fields for this survey report group.
          example:
            eq: value
        survey:
          title: Survey
          description: Survey for this survey report group.
          example:
            eq: value
        organization:
          title: Organization
          description: Organization for this survey report group.
          example:
            eq: value
        editable:
          type: boolean
          title: Editable
          description: Editable for this survey report group.
          example:
            eq: value
        updater:
          title: Updater
          description: Updater for this survey report group.
          example:
            eq: value
        currency:
          title: Currency
          description: Currency for this survey report group.
          example:
            eq: value
        project_id:
          type: integer
          title: Project
          description: Project id for this survey report group.
          example:
            - 123
        project:
          title: Project
          description: Project for this survey report group.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: Unique identifier for this survey report row.
          example:
            - 123
        creator:
          title: Creator
          description: Creator for this survey report group.
          example:
            eq: value
        report:
          title: Report
          description: Report for this survey report group.
          example:
            eq: value
        title:
          type: string
          title: Title
          description: Title for this survey report group.
          example:
            eq: value
        count:
          type: integer
          title: Count
          description: Number of surveys in this report group.
          example:
            gt: 0
        creator_id:
          type: integer
          title: Creator
          description: Creator id for this survey report group.
          example:
            - 123
      example:
        id: '123'
        type: survey_reports
        attributes:
          response_count: 42
          avg_score: 4.2
          survey_id: 7
        relationships: {}
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_not_included'
        - type: object
          title: Single data
          description: Included variant — the related resource identifier is present in `data`.
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          example:
            data:
              type: tasks
              id: '42'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      example:
        type: tasks
        id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          example:
            included: false
      example:
        meta:
          included: false
  parameters:
    filter_survey_report:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.survey_report at the top of this file.
      required: false
      description: Filters
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_survey_report:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - count
            - -count
            - created_at
            - -created_at
            - creator
            - -creator
            - project
            - -project
            - survey
            - -survey
            - survey_id
            - -survey_id
            - title
            - -title
            - updater
            - -updater
          type: string
        title: Sort survey report
      explode: false
      required: false
      description: Sort survey report
    group_survey_report:
      in: query
      name: group
      style: form
      schema:
        enum:
          - creator
          - organization
          - project
          - survey
          - updater
        type: string
        title: Group survey report
      explode: false
      required: false
      description: Group survey report
