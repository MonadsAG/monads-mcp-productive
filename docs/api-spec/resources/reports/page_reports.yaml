                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        page:
                          $ref: '#/components/schemas/_single_relationship'
                        project:
                          $ref: '#/components/schemas/_single_relationship'
                        report:
                          $ref: '#/components/schemas/_single_relationship'
                        updater:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of page report row resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: An included related resource object.
                  example:
                    eq: value
                description: Array of included related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: r-016
                  type: page_reports
                  attributes:
                    page_id: 78
                    project_id: 6899
                    created_at: '2026-01-20T10:00:00.000+00:00'
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection page report
