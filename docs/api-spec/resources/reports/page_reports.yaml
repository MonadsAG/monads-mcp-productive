paths:
  /api/v2/reports/page_reports:
    get:
      tags:
        - Reports
      summary: Get page reports
      responses:
        '200':
          $ref: '#/components/responses/collection_page_report'
      parameters:
        - $ref: '#/components/parameters/filter_page_report'
        - $ref: '#/components/parameters/group_page_report'
        - $ref: '#/components/parameters/sort_page_report'
        - $ref: '#/components/parameters/header_organization'
      operationId: reports-page_reports-index
      description: Retrieve aggregated page report data grouped by configurable dimensions.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_page_report:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - count
            - -count
            - created_at
            - -created_at
            - creator
            - -creator
            - custom_fields
            - -custom_fields
            - edited_at
            - -edited_at
            - page
            - -page
            - page_id
            - -page_id
            - page_last_activity_at
            - -page_last_activity_at
            - project
            - -project
            - title
            - -title
            - updater
            - -updater
          type: string
        title: Sort page report
      explode: false
      required: false
      description: Sort page report
    group_page_report:
      in: query
      name: group
      style: form
      schema:
        enum:
          - creator
          - custom_fields
          - organization
          - page
          - project
          - updater
        type: string
        title: Group page report
      explode: false
      required: false
      description: Group page report
    filter_page_report:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.page_report at the top of this file.
      required: false
      description: Filters
  schemas:
    resource_page_report:
      type: object
      title: Page report Resource
      properties:
        parent_page_id:
          type: integer
          title: Parent Page
          description: Parent page id for this page report group.
          example:
            - 123
        person_type:
          type: integer
          title: Person Type
          description: Person type for this page report group.
          example:
            eq: active
        creator_id:
          type: integer
          title: Creator
          description: Creator id for this page report group.
          example:
            - 123
        id:
          type: integer
          title: Id
          description: Unique identifier for this page report row.
          example:
            - 123
        page:
          title: Page
          description: Page for this page report group.
          example:
            eq: value
        jump_query:
          type: string
          title: Jump Query
          description: Jump query for this page report group.
          example:
            eq: value
        count:
          type: integer
          title: Count
          description: Number of pages in this report group.
          example:
            gt: 0
        subscriber_id:
          type: integer
          title: Subscriber
          description: Subscriber id for this page report group.
          example:
            - 123
        page_last_activity_at:
          title: Page Last Activity At
          description: Timestamp of the most recent activity on the page associated with this report row.
          example:
            gt: '2026-01-01'
        project_id:
          type: integer
          title: Project
          description: Project id for this page report group.
          example:
            - 123
        page_id:
          title: Page
          description: Page id for this page report group.
          example:
            - 123
        title:
          type: string
          title: Title
          description: Title for this page report group.
          example:
            eq: value
        report:
          title: Report
          description: Report for this page report group.
          example:
            eq: value
        currency_default:
          title: Currency Default
          description: Currency in the organization's default currency for this page report group.
          example:
            eq: value
        organization:
          title: Organization
          description: Organization for this page report group.
          example:
            eq: value
        status:
          type: integer
          title: Status
          description: Status for this page report group.
          example:
            eq: active
        updater:
          title: Updater
          description: Updater for this page report group.
          example:
            eq: value
        project:
          title: Project
          description: Project for this page report group.
          example:
            eq: value
        currency_normalized:
          title: Currency Normalized
          description: Currency in the normalized currency for this page report group.
          example:
            eq: value
        project_status:
          enum:
            - 1
            - 2
          type: integer
          title: Project Status
          description: Project status for this page report group.
          example:
            eq: active
        creator:
          title: Creator
          description: Creator for this page report group.
          example:
            eq: value
        root_page_id:
          type: integer
          title: Root Page
          description: Root page id for this page report group.
          example:
            - 123
        formula_fields:
          title: Formula Fields
          description: Formula fields for this page report group.
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date
          description: Created at for this page report group.
          example:
            gt: '2026-01-01'
        currency:
          title: Currency
          description: Currency for this page report group.
          example:
            eq: value
        custom_fields:
          type: string
          title: Custom Fields
          description: Custom fields for this page report group.
          example:
            eq: value
        edited_at:
          type: string
          title: Edited At
          format: date
          description: Edited at for this page report group.
          example:
            gt: '2026-01-01'
        fuzzy_dates:
          type: string
          title: Fuzzy Dates
          format: date
          description: Fuzzy dates for this page report group.
          example:
            gt: '2026-01-01'
        template:
          type: string
          title: Template
          description: Template for this page report group.
          example:
            eq: value
        fuzzy_people:
          type: integer
          title: Fuzzy People
          description: Fuzzy people for this page report group.
          example:
            eq: value
        group:
          type: string
          title: Group
          description: The grouping dimension for this page report row.
          example:
            eq: value
        full_query:
          type: string
          title: Full Query
          description: Full query for this page report group.
          example:
            eq: value
        last_activity_at:
          type: string
          title: Last Activity At
          format: date
          description: Timestamp of the most recent activity on this page.
          example:
            gt: '2026-01-01'
        query:
          type: string
          title: Query
          description: Query for this page report group.
          example:
            eq: value
      description: An aggregated page report row grouping documentation pages by configurable dimensions with activity metrics.
      example:
        id: '123'
        type: page_reports
        attributes:
          views: 150
          page_id: 78
          date: '2026-01-15'
        relationships: {}
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  responses:
    collection_page_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        count:
                          $ref: '#/components/schemas/resource_page_report/properties/count'
                        group:
                          $ref: '#/components/schemas/resource_page_report/properties/group'
                        title:
                          $ref: '#/components/schemas/resource_page_report/properties/title'
                        currency:
                          $ref: '#/components/schemas/resource_page_report/properties/currency'
                        edited_at:
                          $ref: '#/components/schemas/resource_page_report/properties/edited_at'
                        created_at:
                          $ref: '#/components/schemas/resource_page_report/properties/created_at'
                        custom_fields:
                          $ref: '#/components/schemas/resource_page_report/properties/custom_fields'
                        formula_fields:
                          $ref: '#/components/schemas/resource_page_report/properties/formula_fields'
                        currency_default:
                          $ref: '#/components/schemas/resource_page_report/properties/currency_default'
                        last_activity_at:
                          $ref: '#/components/schemas/resource_page_report/properties/last_activity_at'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_page_report/properties/currency_normalized'
                    relationships:
                      type: object
                      properties:
                        page:
                          $ref: '#/components/schemas/_single_relationship'
                        report:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        project:
                          $ref: '#/components/schemas/_single_relationship'
                        updater:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection page report
