paths:
  /api/v2/reports/page_reports:
    get:
      tags:
        - Reports
      summary: Get page reports
      operationId: reports-page_reports-index
      description: Retrieve aggregated page report data grouped by configurable dimensions.
      parameters:
        - $ref: '#/components/parameters/filter_page_report'
        - $ref: '#/components/parameters/sort_page_report'
        - $ref: '#/components/parameters/group_page_report'
      responses:
        '200':
          $ref: '#/components/responses/collection_page_report'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
