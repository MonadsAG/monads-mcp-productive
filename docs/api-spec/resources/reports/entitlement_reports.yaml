openapi: 3.1.0
info:
  title: Productive.io API – Reports – entitlement_reports
  version: 2.0.0
x-filters:
  entitlement_report:
    absence_type:
      description: Filter entitlement report results by absence type.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    allocated:
      description: Filter entitlement report results by allocated.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    date:
      description: Filter entitlement report results by date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    end_date:
      description: Filter entitlement report results by end date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    event_id:
      description: Filter entitlement report results by event id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    formulas:
      description: Filter entitlement report results by formulas.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter entitlement report results by id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_id:
      description: Filter entitlement report results by person id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    start_date:
      description: Filter entitlement report results by start date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    used:
      description: Filter entitlement report results by used.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/reports/entitlement_reports:
    get:
      tags:
        - Reports
      summary: Get entitlement reports
      operationId: reports-entitlement_reports-index
      description: Retrieve aggregated entitlement report data grouped by configurable dimensions.
      parameters:
        - $ref: '#/components/parameters/filter_entitlement_report'
        - $ref: '#/components/parameters/sort_entitlement_report'
        - $ref: '#/components/parameters/group_entitlement_report'
      responses:
        '200':
          $ref: '#/components/responses/collection_entitlement_report'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    collection_entitlement_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated list of entitlement report records in JSON:API format.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: An entitlement report resource object.
                  properties:
                    attributes:
                      type: object
                      description: Entitlement report attributes.
                      properties:
                        absence_type:
                          $ref: '#/components/schemas/resource_entitlement_report/properties/absence_type'
                        count:
                          $ref: '#/components/schemas/resource_entitlement_report/properties/count'
                        currency:
                          $ref: '#/components/schemas/resource_entitlement_report/properties/currency'
                        currency_default:
                          $ref: '#/components/schemas/resource_entitlement_report/properties/currency_default'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_entitlement_report/properties/currency_normalized'
                        end_date_period:
                          $ref: '#/components/schemas/resource_entitlement_report/properties/end_date_period'
                        formula_fields:
                          $ref: '#/components/schemas/resource_entitlement_report/properties/formula_fields'
                        group:
                          $ref: '#/components/schemas/resource_entitlement_report/properties/group'
                        people_custom_fields:
                          $ref: '#/components/schemas/resource_entitlement_report/properties/people_custom_fields'
                        start_date_period:
                          $ref: '#/components/schemas/resource_entitlement_report/properties/start_date_period'
                        total_allocated:
                          anyOf:
                            - $ref: '#/components/schemas/resource_entitlement_report/properties/total_allocated'
                            - type: string
                          description: Total allocated time-off in hours for this entitlement.
                        total_allocated_minutes:
                          anyOf:
                            - $ref: '#/components/schemas/resource_entitlement_report/properties/total_allocated_minutes'
                            - type: string
                          description: Total allocated time-off in minutes for this entitlement.
                        total_available:
                          anyOf:
                            - $ref: '#/components/schemas/resource_entitlement_report/properties/total_available'
                            - type: string
                          description: Total available time-off hours remaining in this entitlement.
                        total_available_minutes:
                          anyOf:
                            - $ref: '#/components/schemas/resource_entitlement_report/properties/total_available_minutes'
                            - type: string
                          description: Total available time-off minutes remaining in this entitlement.
                        total_used:
                          anyOf:
                            - $ref: '#/components/schemas/resource_entitlement_report/properties/total_used'
                            - type: string
                          description: Total used time-off hours in this entitlement period.
                        total_used_minutes:
                          anyOf:
                            - $ref: '#/components/schemas/resource_entitlement_report/properties/total_used_minutes'
                            - type: string
                          description: Total used time-off minutes in this entitlement period.
                        total_pending:
                          anyOf:
                            - $ref: '#/components/schemas/resource_entitlement_report/properties/total_pending'
                            - type: string
                          description: The total number of pending leave entitlement days.
                        total_pending_minutes:
                          anyOf:
                            - $ref: '#/components/schemas/resource_entitlement_report/properties/total_pending_minutes'
                            - type: string
                          description: The total pending leave entitlement expressed in minutes.
                        description:
                          anyOf:
                            - $ref: '#/components/schemas/resource_entitlement_report/properties/description'
                            - type: 'null'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Entitlement report relationships.
                      properties:
                        entitlement:
                          $ref: '#/components/schemas/_single_relationship'
                        event:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                        person_report:
                          $ref: '#/components/schemas/_single_relationship'
                        report:
                          $ref: '#/components/schemas/_single_relationship'
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of entitlement report resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A sideloaded related resource object.
                  example:
                    eq: value
                description: Sideloaded related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: r-023
                  type: entitlement_reports
                  attributes:
                    allocated: 1200
                    used: 480
                    remaining: 720
                    person_id: 12
                    event_id: 10
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: Collection entitlement report
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_forbidden:
      enum:
        - access_denied
        - account_inactive
        - agent_role_impersonation_denied
        - automatic_invoicing_not_manageable
        - billing_catalog_list_unavailable
        - booking_conflict_resolver_unavailable
        - budget_inaccessible
        - budgets_not_manageable
        - cascade_deletion_blocked
        - custom_roles_unavailable
        - deactivated_organization
        - deal_proposal_analytics_unavailable
        - deal_proposal_public_link_unavailable
        - document_styler_unavailable
        - document_templates_unavailable
        - email_inbox_unavailable
        - entry_not_editable
        - expense_not_editable
        - feature_unavailable
        - finalized_invoice_permission
        - financials_unavailable
        - impersonation_on_account_not_allowed
        - insufficient_automation_permission
        - insufficient_project_access
        - insufficient_seats
        - invalid_impersonate_role_id_header
        - invoices_unavailable
        - login_unavailable
        - mcp_access_disabled
        - mcp_connectors_disabled
        - mcp_provider_unavailable
        - missing_slack_integration
        - no_client_access
        - no_organization_id
        - no_person
        - no_sandbox_access
        - organization_red_flagged
        - other_timer_running
        - outgoing_emails_limit_exceeded
        - payment_reminders_unavailable
        - personal_access_token_limit_exceeded
        - pipelines_limit_exceeded
        - placeholders_limit_exceeded
        - plan_limit_exceeded
        - plan_unavailable
        - private_channel_forbidden
        - recipients_limit_exceeded
        - record_not_owned
        - report_templates_unavailable
        - restricted_email_in_trialing
        - role_bill_rate_unavailable
        - role_impersonate_denied
        - select_organization
        - service_inaccessible
        - service_type_inaccessible
        - single_sign_on_invalid
        - single_sign_on_login_only
        - single_sign_on_provision_failed
        - single_sign_on_unavailable
        - subscription_expired
        - subsidiaries_unavailable
        - subsidiary_out_of_scope
        - teams_limit_exceeded
        - two_factor_login
        - unallocated_expense_inaccessible
        - webooks_limit_exceeded
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 403.
    error_code_unauthorized:
      enum:
        - invalid_auth_token
        - invalid_password
        - invalid_proposal_token
        - invalid_token_signature
        - token_expired
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 401.
    error_code_bad_request:
      enum:
        - account_owner_missing
        - authorization_failure
        - bad_filter_request
        - bad_request
        - bad_sort_request
        - budget_report_failed
        - bulk_export_failed
        - calendar_reauthorization_required
        - changed_since_conflict
        - changed_since_invalid
        - changed_since_unsupported
        - company_export_match_changed
        - company_not_exported
        - cross_invoice_bulk
        - data_not_array
        - datev_request_failed
        - datev_token_refresh_failed
        - datev_token_refresh_locked
        - einvoice_export_failed
        - empty_body
        - exchange_currency_invalid
        - exchange_date_invalid
        - export_error
        - export_failed
        - export_status_unavailable
        - fields_request_invalid
        - formulas_request_invalid
        - group_custom_field_unsupported
        - group_param_relationship_unsupported
        - group_request_invalid
        - include_request_invalid
        - integration_error
        - invalid_request_parameters
        - invalid_seats_allocations
        - json_format_invalid
        - keyset_conflict
        - keyset_invalid_cursor
        - keyset_unsupported_sort
        - missing_date_period
        - missing_relationship_field
        - multipart_body_invalid
        - netsuite_credit_note_form_missing
        - netsuite_discount_amount_missing
        - netsuite_discount_item_missing
        - parameter_missing
        - peppol_transaction_failed
        - query_parameters_invalid
        - relationship_depth_unsupported
        - report_keyset_requires_single_type
        - report_keyset_restricted_access
        - report_keyset_unsupported_filter
        - report_keyset_unsupported_group
        - sort_custom_field_unsupported
        - sort_param_relationship_unsupported
        - sort_param_unsupported
        - tax_id_unsupported
        - unsupported_currency
        - unsupported_date_period
        - unsupported_filter
        - unsupported_filter_level
        - unsupported_filter_operation
        - unsupported_filter_value
        - unsupported_filter_value_type
        - unsupported_formula
        - unsupported_formula_component
        - unsupported_formula_operator
        - unsupported_group
        - unsupported_group_param
        - unsupported_include
        - unsupported_number_of_group_params
        - unsupported_sort
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 400.
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_single_linkage_nullable'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          required:
            - included
          example:
            included: false
      required:
        - meta
      example:
        meta:
          included: false
    _single_linkage_nullable:
      type: object
      title: Single nullable linkage
      properties:
        data:
          anyOf:
            - $ref: '#/components/schemas/_resource'
            - type: 'null'
      required:
        - data
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: string
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      required:
        - id
        - type
      example:
        type: tasks
        id: '42'
    resource_entitlement_report:
      type: object
      title: Entitlement report Resource
      description: An aggregated entitlement report row combining a person's time-off allocation, usage, and availability for an absence category over a period.
      properties:
        absence_type:
          enum:
            - time_off
            - remote_work
          type: string
          title: Absence Type
          description: The type of absence (e.g. time off, remote work) for this entitlement report row.
          example:
            eq: active
        allocated:
          type: number
          title: Allocated
          description: Total hours allocated for the absence category in the reporting period.
          example:
            eq: value
        count:
          type: integer
          title: Count
          description: Number of entitlement records included in this aggregated report row.
          example:
            gt: 0
        currency:
          title: Currency
          description: The currency code of financial values in this report row.
          example:
            eq: value
        currency_default:
          title: Currency Default
          description: Financial values expressed in the organization's default currency.
          example:
            eq: value
        currency_normalized:
          title: Currency Normalized
          description: Financial values normalized for cross-currency comparison.
          example:
            eq: value
        date:
          type: string
          title: Date
          format: date
          description: The reporting date for this entitlement row.
          example:
            gt: '2026-01-01'
        end_date:
          type: string
          title: End Date
          format: date
          description: The end date of the entitlement period covered by this report row.
          example:
            gt: '2026-01-01'
        end_date_period:
          title: End Date Period
          description: The end date period descriptor used for grouping in time-based reports.
          example:
            gt: '2026-01-01'
        entitlement:
          title: Entitlement
          description: The linked entitlement record this report row is based on.
          example:
            eq: value
        entitlement_end_date:
          title: Entitlement End Date
          description: The end date of the entitlement record linked to this report row.
          example:
            gt: '2026-01-01'
        entitlement_start_date:
          title: Entitlement Start Date
          description: The start date of the entitlement record linked to this report row.
          example:
            gt: '2026-01-01'
        event:
          title: Event
          description: The absence category (event) this report row covers.
          example:
            eq: value
        event_id:
          type: integer
          title: Event
          description: The ID of the absence category (event) for this report row.
          example:
            - 123
        formula_fields:
          title: Formula Fields
          description: Custom formula field values computed for this report row.
          example:
            eq: value
        formulas:
          type: integer
          title: Formulas
          description: Saved formula definitions applied to generate calculated columns in this report.
          example:
            eq: value
        group:
          type: string
          title: Group
          description: The grouping key for this report row when results are aggregated by a dimension.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: The unique identifier of this entitlement report row.
          example:
            - 123
        organization:
          title: Organization
          description: The organization this entitlement report row belongs to.
          example:
            eq: value
        people_custom_fields:
          title: People Custom Fields
          description: Custom field values from the associated person record included for reporting context.
          example:
            eq: value
        person:
          title: Person
          description: The person this entitlement report row is for.
          example:
            eq: value
        person_id:
          type: integer
          title: Person
          description: The ID of the person this entitlement report row is for.
          example:
            - 123
        person_report:
          title: Person Report
          description: Summary person-level report data rolled up from individual entitlement records.
          example:
            eq: value
        report:
          title: Report
          description: The parent report record this row belongs to.
          example:
            eq: value
        start_date:
          type: string
          title: Start Date
          format: date
