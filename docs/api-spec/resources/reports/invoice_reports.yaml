    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
  schemas:
    resource_invoice_report:
      type: object
      title: Invoice report Resource
      properties:
        subsidiary_id:
          type: integer
          title: Subsidiary
          description: ID of the subsidiary this invoice is issued from.
          example:
            - 123
        automatically_created:
          type: integer
          title: Automatically Created
          description: Whether this invoice was automatically created from a recurring contract budget, rather than manually by a user.
          example:
            eq: value
        sent_on:
          type: string
          title: Sent On
          format: date
          description: Sent on for this invoice report group.
          example:
            eq: value
        last_activity_at_period:
          title: Last Activity At Period
          description: Time period grouping for last activity date (e.g. week, month, quarter).
          example:
            gt: '2026-01-01'
        count:
          type: integer
          title: Count
          description: Number of invoices in this report group.
          example:
            gt: 0
        total_amount_credited:
          title: Total Amount Credited
          description: Sum of all credited amounts (excluding tax) across invoices in this report group.
          example:
            gt: 0
        total_amount_paid_normalized:
          title: Total Amount Paid Normalized
          description: Sum of amount paid in the normalized currency across all records in this invoice report group.
          example:
            gt: 0
        amount_written_off:
          title: Amount Written Off
          description: Amount written off (marked as will never be paid) on this invoice, in the invoice's own currency.
          example:
            gt: 0
        invoice_created_at:
          title: Invoice Created At
          description: The invoice's creation timestamp, surfaced as a report column.
          example:
            gt: '2026-01-01'
        formula_fields:
          title: Formula Fields
          description: User-defined formula field values computed for this report row.
          example:
            eq: value
        total_amount_unpaid:
          title: Total Amount Unpaid
          description: Sum of amount unpaid across all records in this invoice report group.
          example:
            gt: 0
        year:
          type: string
          title: Year
          description: Year grouping for this invoice report row.
          example:
            eq: value
        currency_default:
          title: Currency Default
          description: Currency code of the organization's default currency, for normalized financial comparisons.
          example:
            eq: value
        responsible_id:
          type: integer
          title: Responsible
          description: Responsible id for this invoice report group.
          example:
            - 123
        pay_on_period:
          title: Pay On Period
          description: Time period grouping for the invoice due date (e.g. week, month, quarter).
          example:
            eq: value
        company:
          title: Company
          description: The client company this invoice is billed to.
          example:
            eq: value
        query:
          type: string
          title: Query
          description: Text search query applied to this report — matches by invoice number or content depending on the operator used.
          example:
            eq: value
        total_amount_written_off_normalized:
          title: Total Amount Written Off Normalized
          description: Sum of amount written off in the normalized currency across all records in this invoice report group.
          example:
            gt: 0
        month:
          type: string
          title: Month
          description: Month dimension for time-based report grouping (deprecated — use invoiced_on_period instead).
          example:
            eq: value
        tax_rates:
          type: string
          title: Tax Rates
          description: Tax rates applied to line items on this invoice.
          example:
            gt: 0
        currency_normalized:
          title: Currency Normalized
          description: Currency code of the organization's common normalized currency used for cross-currency reporting.
          example:
            eq: value
        invoiced_on_period:
          title: Invoiced On Period
          description: Time period grouping for the invoice issued date (e.g. week, month, quarter).
          example:
            eq: value
        formulas:
          type: integer
          title: Formulas
          description: Formula definitions used to compute custom calculated columns in this report.
          example:
            eq: value
        issuer:
          title: Issuer
          description: The person (subsidiary contact) who issued this invoice on behalf of the organization.
          example:
            eq: value
        invoice_subject:
          title: Invoice Subject
          description: Invoice subject for this invoice report group.
          example:
            eq: value
        invoicing_method:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Invoicing Method
          description: The method of invoicing used for this invoice (e.g. manual, automatic from services).
          example:
            eq: value
        amount_paid:
          title: Amount Paid
          description: Amount paid by the client on this invoice, in the invoice's own currency.
          example:
            gt: 0
        issuer_report:
          title: Issuer Report
          description: Related person report data for the invoice issuer in this report group.
          example:
            eq: value
        quarter:
          type: string
          title: Quarter
          description: Quarter dimension for time-based report grouping (deprecated — use invoiced_on_period instead).
          example:
            eq: value
        purchase_order_number:
          type: string
          title: Purchase Order Number
          description: The client's purchase order number associated with this invoice.
          example: PO-2024-017
        invoice_aging:
          enum:
            - 0
            - 1
            - 2
            - 3
            - 4
          type: integer
          title: Invoice Aging
          description: 'Aging status of this invoice — categorizes overdue invoices into time brackets: current, 1-15 days overdue, 16-45 days overdue, or 45+ days overdue.'
          example:
            eq: value
        invoice_state:
          enum:
            - 1
            - 2
          type: integer
          title: Invoice State
          description: Invoice state for this invoice report group.
          example:
            eq: active
        total_amount_tax_normalized:
          title: Total Amount Tax Normalized
          description: Sum of amount tax in the normalized currency across all records in this invoice report group.
          example:
            gt: 0
        amount_tax:
          title: Amount Tax
          description: Tax amount on this invoice, in the invoice's own currency.
          example:
            gt: 0
        export_status:
          enum:
            - 1
            - 2
          type: integer
          title: Export Status
          description: Export status of this invoice — whether it has been copied to an external accounting system (e.g. exported or unexported).
          example:
            eq: active
        credited:
          type: boolean
          title: Credited
          description: Whether this invoice has been credited (a credit note has been issued against it).
          example:
            eq: value
        sent_status:
          enum:
            - 1
            - 2
          type: integer
          title: Sent Status
          description: Whether this invoice has been sent to the client (sent or unsent).
          example:
            eq: active
        total_amount_default:
          title: Total Amount Default
          description: Sum of amount in the organization's default currency across all records in this invoice report group.
          example:
            gt: 0
        invoice_purchase_order_number:
          title: Invoice Purchase Order Number
          description: The client's purchase order number on this invoice, surfaced as a report column.
          example: PO-2024-017
        number:
          type: string
          title: Number
          description: The unique invoice number identifying this invoice.
          example:
            eq: value
        invoice_pay_on:
          title: Invoice Pay On
          description: The invoice's due date, surfaced as a report column.
          example:
            eq: value
        creator:
          title: Creator
          description: The person who created this invoice.
          example:
            eq: value
        total_amount_normalized:
          title: Total Amount Normalized
          description: Sum of amount in the normalized currency across all records in this invoice report group.
          example:
            gt: 0
        jump_query:
          type: string
          title: Jump Query
          description: A simplified query string for quick navigation or linking to this report's filtered view.
          example:
            eq: value
        issuer_id:
          type: integer
          title: Issuer
          description: ID of the person who issued this invoice.
          example:
            - 123
        total_amount_with_tax_default:
          title: Total Amount With Tax Default
          description: Sum of amount with tax in the organization's default currency across all records in this invoice report group.
          example:
            gt: 0
        total_amount_credited_normalized:
          title: Total Amount Credited Normalized
          description: Sum of amount credited in the normalized currency across all records in this invoice report group.
          example:
            gt: 0
        paid_on_period:
          title: Paid On Period
          description: Time period grouping for paid on (e.g. week, month, quarter).
          example:
            eq: value
        invoice_type:
          enum:
            - 1
            - 2
          type: integer
          title: Invoice Type
          description: The type of this invoice document — invoice or credit note, surfaced as a report column.
          example:
            eq: active
        tags:
          type: string
          title: Tags
          description: The tags applied to the invoice in this report row, for filtering or grouping by label.
          example:
            eq: value
        invoiced_on:
          type: string
          title: Invoiced On
          format: date
          description: Date this invoice was issued (the official invoice date).
          example:
            eq: value
        company_billing_name:
          title: Company Billing Name
          description: The billing name of the client company as it appears on this invoice.
          example:
            eq: value
        payment_status:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Payment Status
          description: Payment status of this invoice — indicates whether it is unpaid, partially paid, or fully paid.
          example:
            eq: active
        total_amount_credited_with_tax_default:
          title: Total Amount Credited With Tax Default
          description: Sum of amount credited with tax in the organization's default currency across all records in this invoice report group.
          example:
            gt: 0
        delivery_on_period:
          title: Delivery On Period
          description: Time period grouping for the delivery date (e.g. week, month, quarter).
          example:
            eq: value
        invoice_sent_on:
          title: Invoice Sent On
          description: Invoice sent on for this invoice report group.
          example:
            eq: value
        total_amount_credited_default:
          title: Total Amount Credited Default
          description: Sum of amount credited in the organization's default currency across all records in this invoice report group.
          example:
            gt: 0
        report:
          title: Report
          description: The saved report (filter view) this invoice report row belongs to.
          example:
            eq: value
        total_amount_with_tax:
          title: Total Amount With Tax
          description: Sum of amount with tax across all records in this invoice report group.
          example:
            gt: 0
        delivery_on:
          type: string
          title: Delivery On
          format: date
          description: Date when the goods or services on this invoice were delivered.
          example:
            eq: value
        invoice_last_activity_at:
          title: Invoice Last Activity At
          description: Timestamp of the most recent activity on the invoice associated with this report row.
          example:
            gt: '2026-01-01'
        invoice_delivery_on:
          title: Invoice Delivery On
          description: The invoice's delivery date, surfaced as a report column.
          example:
            eq: value
        currency_id:
          type: string
          title: Currency
          description: ID of the currency used on this invoice.
          example:
            - 123
        amount_with_tax:
          title: Amount With Tax
          description: Total invoice amount including tax, in the invoice's own currency.
          example:
            gt: 0
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who created this invoice.
          example:
            - 123
        full_query:
          type: string
          title: Full Query
          description: The full combined query string used to generate this report, including all filters and grouping dimensions.
          example:
            eq: value
        payment_terms_type:
          type: integer
          title: Payment Terms Type
        currency:
          type: string
          title: Currency
          description: Currency for this invoice report group.
          example:
            eq: value
        amount_unpaid:
          title: Amount Unpaid
          description: Amount still unpaid on this invoice, in the invoice's own currency.
          example:
            gt: 0
        company_report:
          title: Company Report
          description: Related company report data for the client in this report group.
          example:
            eq: value
        invoice_status:
          enum:
            - 0
            - 1
            - 2
            - 3
            - 4
