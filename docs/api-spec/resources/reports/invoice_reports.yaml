paths:
  /api/v2/reports/invoice_reports:
    get:
      tags:
        - Reports
      summary: Get invoice reports
      responses:
        '200':
          $ref: '#/components/responses/collection_invoice_report'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_invoice_report'
        - $ref: '#/components/parameters/filter_invoice_report'
        - $ref: '#/components/parameters/group_invoice_report'
      operationId: reports-invoice_reports-index
      description: Retrieve aggregated invoice report data grouped by configurable dimensions.
components:
  parameters:
    group_invoice_report:
      in: query
      name: group
      style: form
      schema:
        enum:
