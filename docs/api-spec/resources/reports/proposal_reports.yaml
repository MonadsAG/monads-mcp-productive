      title: Error Code
      description: Every error `code` an endpoint can return with a 400.
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_single_linkage_nullable'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          required:
            - included
          example:
            included: false
      required:
        - meta
      example:
        meta:
          included: false
    _single_linkage_nullable:
      type: object
      title: Single nullable linkage
      properties:
        data:
          anyOf:
            - $ref: '#/components/schemas/_resource'
            - type: 'null'
      required:
        - data
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: string
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      required:
        - id
        - type
      example:
        type: tasks
        id: '42'
    resource_proposal_report:
      type: object
      title: Proposal report Resource
      description: A single aggregated row in a proposal report, containing metrics and grouping fields for one or more proposals.
      properties:
        average_tax_rate_value:
          type: number
          title: Average Tax Rate Value
          description: Average tax rate percentage applied across proposals in this report row, computed from the tax rate component values.
          example:
            gt: 0
        budget_total:
          title: Budget Total
          description: Total budget amount of the proposal in the proposal's original currency.
          example:
            gt: 0
        company:
          title: Company
          description: The associated client company for this report row.
          example:
            eq: value
        company_id:
          type: integer
          title: Company
          description: ID of the client company associated with proposals in this report row.
          example:
            - 123
        company_report:
          title: Company Report
          description: Nested company report data for this report row, including company-level aggregates and attributes.
          example:
            eq: value
        count:
          type: integer
          title: Count
          description: Number of proposals aggregated into this report row.
          example:
            gt: 0
        created_at:
          type: string
          title: Created At
          format: date
          description: Creation timestamp of the proposals in this report row.
          example:
            gt: '2026-01-01'
        created_at_period:
          title: Created At Period
          description: The period label for the proposal creation date when the report is grouped by a creation date interval.
          example:
            gt: '2026-01-01'
        creator:
          title: Creator
          description: The person who created the proposals in this report row.
          example:
            eq: value
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who created the proposals in this report row.
          example:
            - 123
        creator_report:
          title: Creator Report
          description: Nested creator person report data for this report row.
          example:
            eq: value
        currency:
          type: string
          title: Currency
          description: Currency code of the proposal amounts in this report row.
          example:
            eq: value
        currency_default:
          title: Currency Default
          description: Budget total amount in the organization's default currency.
          example:
            eq: value
        currency_normalized:
          title: Currency Normalized
          description: Budget total amount normalized to the organization's reporting currency.
          example:
            eq: value
        date_signed:
          type: string
          title: Date Signed
          format: date
          description: Date the proposal was signed, computed as `status_changed_at` when a signature image is present.
          example:
            eq: value
        date_signed_period:
          title: Date Signed Period
          description: The period label for the date signed when the report is grouped by a signing date interval.
          example:
            eq: value
        deal:
          title: Deal
          description: The deal associated with the proposals in this report row.
          example:
            eq: value
        deal_id:
