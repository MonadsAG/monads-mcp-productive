openapi: 3.1.0
info:
  title: Productive.io API – Reports – proposal_reports
  version: 2.0.0
x-filters:
  proposal_report:
    budget_total:
      description: Filters proposal report rows by the proposal budget total amount.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filters proposal report rows by the associated company ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filters proposal report rows by the proposal creation date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filters proposal report rows by the creator person ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    date_signed:
      description: Filters proposal report rows by the date the proposal was signed.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      description: Filters proposal report rows by the associated deal ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    formulas:
      description: Filters proposal report rows by custom formula field values.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filters proposal report rows by their report entry ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    link_status:
      description: Filters proposal report rows by the proposal public link status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    responsible_id:
      description: Filters proposal report rows by the responsible person ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    sent_at:
      description: Filters proposal report rows by the date the proposal was sent.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: Filters proposal report rows by the proposal status (e.g. draft, sent, accepted).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status_changed_at:
      description: Filters proposal report rows by the date the proposal status last changed.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    tax_amount:
      description: Filters proposal report rows by the calculated tax amount.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updated_at:
      description: Filters proposal report rows by the last update date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/reports/proposal_reports:
    get:
      tags:
        - Reports
      summary: Get proposal reports
      operationId: reports-proposal_reports-index
      description: Returns a paginated list of proposal report records, suitable for building custom proposal analytics.
      parameters:
        - $ref: '#/components/parameters/filter_proposal_report'
        - $ref: '#/components/parameters/sort_proposal_report'
        - $ref: '#/components/parameters/group_proposal_report'
      responses:
        '200':
          $ref: '#/components/responses/collection_proposal_report'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    collection_proposal_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: JSON:API response schema for a collection of proposal reports.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A single proposal report resource object in the collection.
                  properties:
                    attributes:
                      type: object
                      description: The attributes of a proposal report resource.
                      properties:
                        average_tax_rate_value:
                          type: string
                          description: The average tax rate applied across line items in this proposal.
                        count:
                          $ref: '#/components/schemas/resource_proposal_report/properties/count'
                        created_at_period:
                          $ref: '#/components/schemas/resource_proposal_report/properties/created_at_period'
                        currency:
                          $ref: '#/components/schemas/resource_proposal_report/properties/currency'
                        currency_default:
                          $ref: '#/components/schemas/resource_proposal_report/properties/currency_default'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_proposal_report/properties/currency_normalized'
                        date_signed_period:
                          $ref: '#/components/schemas/resource_proposal_report/properties/date_signed_period'
                        formula_fields:
                          $ref: '#/components/schemas/resource_proposal_report/properties/formula_fields'
                        group:
                          $ref: '#/components/schemas/resource_proposal_report/properties/group'
                        link_status:
                          $ref: '#/components/schemas/resource_proposal_report/properties/link_status'
                        sent_at_period:
                          $ref: '#/components/schemas/resource_proposal_report/properties/sent_at_period'
                        signed:
                          type: boolean
                          description: Whether the proposal has been signed by the client.
                        signed_by_email:
                          anyOf:
                            - $ref: '#/components/schemas/resource_proposal_report/properties/signed_by_email'
                            - type: 'null'
                          description: The email address used when the proposal was electronically signed.
                        status:
                          $ref: '#/components/schemas/resource_proposal_report/properties/status'
                        status_changed_at_period:
                          $ref: '#/components/schemas/resource_proposal_report/properties/status_changed_at_period'
                        total_budget_total:
                          $ref: '#/components/schemas/resource_proposal_report/properties/total_budget_total'
                        total_budget_total_default:
                          $ref: '#/components/schemas/resource_proposal_report/properties/total_budget_total_default'
                        total_budget_total_normalized:
                          $ref: '#/components/schemas/resource_proposal_report/properties/total_budget_total_normalized'
                        total_tax_amount:
                          $ref: '#/components/schemas/resource_proposal_report/properties/total_tax_amount'
                        total_tax_amount_default:
                          $ref: '#/components/schemas/resource_proposal_report/properties/total_tax_amount_default'
                        total_tax_amount_normalized:
                          $ref: '#/components/schemas/resource_proposal_report/properties/total_tax_amount_normalized'
                        updated_at_period:
                          $ref: '#/components/schemas/resource_proposal_report/properties/updated_at_period'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: The relationships of a proposal report resource.
                      properties:
                        company:
                          $ref: '#/components/schemas/_single_relationship'
                        company_report:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        creator_report:
                          $ref: '#/components/schemas/_single_relationship'
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        deal_report:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        proposal:
                          $ref: '#/components/schemas/_single_relationship'
                        report:
                          $ref: '#/components/schemas/_single_relationship'
                        responsible:
                          $ref: '#/components/schemas/_single_relationship'
                        responsible_report:
                          $ref: '#/components/schemas/_single_relationship'
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: The JSON:API data array containing the list of proposal report resources.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: A single included related resource object.
                  example:
                    eq: value
                description: An array of included related resources (side-loaded data).
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: r-024
                  type: proposal_reports
                  attributes:
                    total: '45000.00'
                    status: sent
                    deal_id: 89
                    company_id: 65111
                    currency: USD
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
      description: A paginated collection of proposal report resources.
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_forbidden:
      enum:
        - access_denied
        - account_inactive
        - agent_role_impersonation_denied
        - automatic_invoicing_not_manageable
        - billing_catalog_list_unavailable
        - booking_conflict_resolver_unavailable
