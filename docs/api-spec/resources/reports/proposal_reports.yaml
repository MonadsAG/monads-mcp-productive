openapi: 3.1.0
info:
  title: Productive.io API – Reports – proposal_reports
  version: 2.0.0
x-filters:
  proposal_report:
    status:
      description: Filters proposal report rows by the proposal status (e.g. draft, sent, accepted).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    tax_amount:
      description: Filters proposal report rows by the calculated tax amount.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    link_status:
      description: Filters proposal report rows by the proposal public link status.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filters proposal report rows by the associated company ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    date_signed:
      description: Filters proposal report rows by the date the proposal was signed.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filters proposal report rows by their report entry ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    budget_total:
      description: Filters proposal report rows by the proposal budget total amount.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    deal_id:
      description: Filters proposal report rows by the associated deal ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    formulas:
      description: Filters proposal report rows by custom formula field values.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filters proposal report rows by the proposal creation date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    responsible_id:
      description: Filters proposal report rows by the responsible person ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    sent_at:
      description: Filters proposal report rows by the date the proposal was sent.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updated_at:
      description: Filters proposal report rows by the last update date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filters proposal report rows by the creator person ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status_changed_at:
      description: Filters proposal report rows by the date the proposal status last changed.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/reports/proposal_reports:
    get:
      tags:
        - Reports
      summary: Get proposal reports
      responses:
        '200':
          $ref: '#/components/responses/collection_proposal_report'
      parameters:
        - $ref: '#/components/parameters/filter_proposal_report'
        - $ref: '#/components/parameters/group_proposal_report'
        - $ref: '#/components/parameters/sort_proposal_report'
        - $ref: '#/components/parameters/header_organization'
      operationId: reports-proposal_reports-index
      description: Returns a paginated list of proposal report records, suitable for building custom proposal analytics.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    sort_proposal_report:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - average_tax_rate_value
            - -average_tax_rate_value
            - company
            - -company
            - count
            - -count
            - created_at
            - -created_at
            - creator
            - -creator
            - date_signed
            - -date_signed
            - deal
            - -deal
            - link_status
            - -link_status
            - name
            - -name
            - responsible
            - -responsible
            - sent_at
            - -sent_at
            - signed
            - -signed
            - signed_by_email
            - -signed_by_email
            - status
            - -status
            - status_changed_at
            - -status_changed_at
            - subsidiary
            - -subsidiary
            - total_budget_total
            - -total_budget_total
            - total_tax_amount
            - -total_tax_amount
            - updated_at
            - -updated_at
          type: string
        title: Sort proposal report
      explode: false
      required: false
      description: Sort proposal report results by one or more fields. Prefix a field name with a minus sign for descending order.
    group_proposal_report:
      in: query
      name: group
      style: form
      schema:
        enum:
          - company
          - created_at
          - creator
          - currency
          - date_signed
          - deal
          - link_status
          - organization
          - proposal
          - responsible
          - sent_at
          - signed
          - status
          - status_changed_at
          - subsidiary
          - updated_at
        type: string
        title: Group proposal report
      explode: false
      required: false
      description: Group proposal report results by one or more fields.
    filter_proposal_report:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.proposal_report at the top of this file.
      required: false
      description: Filter proposal reports by specific criteria. Accepts a filter object with field-value pairs.
  schemas:
    resource_proposal_report:
      type: object
      title: Proposal report Resource
      properties:
        company_report:
          title: Company Report
          description: Nested company report data for this report row, including company-level aggregates and attributes.
          example:
            eq: value
        sent_at:
          type: string
          title: Sent At
          format: date
          description: Timestamp when the proposals in this report row were sent to the client.
          example:
            gt: '2026-01-01'
        updated_at_period:
          title: Updated At Period
          description: The period label for the updated date when the report is grouped by an update date interval.
          example:
            gt: '2026-01-01'
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who created the proposals in this report row.
          example:
            - 123
        average_tax_rate_value:
          type: number
          title: Average Tax Rate Value
          description: Average tax rate percentage applied across proposals in this report row, computed from the tax rate component values.
          example:
            gt: 0
        responsible_report:
          title: Responsible Report
          description: Nested responsible person report data for this report row.
          example:
            eq: value
        link_status:
          enum:
            - active
            - inactive
          type: string
          title: Link Status
          description: Public link sharing status of the proposals in this report row.
          example:
            eq: active
        deal_report:
          title: Deal Report
          description: Nested deal report data for this report row, including deal-level aggregates and attributes.
          example:
            eq: value
        total_budget_total_default:
          title: Total Budget Total Default
          description: Sum of all proposal budget totals in this report row, in the organization's default currency.
          example:
            gt: 0
        currency_default:
          title: Currency Default
          description: Budget total amount in the organization's default currency.
          example:
            eq: value
        date_signed:
          type: string
          title: Date Signed
          format: date
          description: Date the proposal was signed, computed as `status_changed_at` when a signature image is present.
          example:
            eq: value
        proposal:
          title: Proposal
          description: The proposal associated with this report row (populated when grouped by proposal).
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: Unique identifier for this proposal report row.
          example:
            - 123
        currency_normalized:
          title: Currency Normalized
          description: Budget total amount normalized to the organization's reporting currency.
          example:
            eq: value
        created_at_period:
          title: Created At Period
          description: The period label for the proposal creation date when the report is grouped by a creation date interval.
          example:
            gt: '2026-01-01'
        status_changed_at:
          type: string
          title: Status Changed At
          format: date
          description: Timestamp when the proposal status last changed in this report row.
          example:
            gt: '2026-01-01'
        deal_id:
          type: integer
          title: Deal
          description: ID of the deal associated with the proposals in this report row.
          example:
            - 123
        signed_by_email:
          type: string
          title: Signed By Email
          description: Email address of the person who signed the proposal, populated only when the proposal is signed.
          example:
            eq: value
        total_tax_amount:
          title: Total Tax Amount
          description: Sum of calculated tax amounts across all proposals in this report row, in the proposal's original currency.
          example:
            gt: 0
        created_at:
          type: string
          title: Created At
          format: date
          description: Creation timestamp of the proposals in this report row.
          example:
            gt: '2026-01-01'
        name:
          title: Name
          description: Name of the proposal in this report row (populated when grouped by proposal).
          example:
            eq: value
        organization:
          title: Organization
          description: The organization that owns the proposals in this report row.
          example:
            eq: value
        creator:
          title: Creator
          description: The person who created the proposals in this report row.
          example:
            eq: value
        company:
          title: Company
          description: The associated client company for this report row.
          example:
            eq: value
        signed:
          type: integer
          title: Signed
          description: Whether the proposals in this report row have been signed by the client.
          example:
            eq: value
        subsidiary:
          title: Subsidiary
          description: The subsidiary company entity associated with the proposals in this report row.
          example:
            eq: value
        responsible:
          title: Responsible
          description: The responsible person for the proposals in this report row.
          example:
            eq: value
        tax_amount:
          title: Tax Amount
          description: Calculated tax amount for the proposals in this report row, based on the applied tax rate.
          example:
            gt: 0
        budget_total:
          title: Budget Total
          description: Total budget amount of the proposal in the proposal's original currency.
          example:
            gt: 0
        creator_report:
          title: Creator Report
          description: Nested creator person report data for this report row.
          example:
            eq: value
        currency:
          type: string
          title: Currency
          description: Currency code of the proposal amounts in this report row.
          example:
            eq: value
        report:
          title: Report
          description: The parent report configuration that this report row belongs to.
          example:
            eq: value
        total_budget_total_normalized:
          title: Total Budget Total Normalized
          description: Sum of all proposal budget totals in this report row, normalized to the organization's reporting currency.
          example:
            gt: 0
        updated_at:
          type: string
          title: Updated At
          format: date
          description: Timestamp of the most recent update to proposals in this report row.
          example:
            gt: '2026-01-01'
        formulas:
          type: integer
          title: Formulas
          description: Custom formula field definitions applied to this report row.
          example:
            eq: value
        total_tax_amount_default:
          title: Total Tax Amount Default
          description: Sum of calculated tax amounts across all proposals in this report row, in the organization's default currency.
          example:
            gt: 0
        deal:
          title: Deal
          description: The deal associated with the proposals in this report row.
          example:
            eq: value
        status_changed_at_period:
          title: Status Changed At Period
          description: The period label for the status change date when the report is grouped by a status change date interval.
          example:
            gt: '2026-01-01'
        total_budget_total:
          title: Total Budget Total
          description: Sum of all proposal budget totals in this report row, in the proposal's original currency.
          example:
            gt: 0
        company_id:
          type: integer
          title: Company
          description: ID of the client company associated with proposals in this report row.
          example:
            - 123
        formula_fields:
          title: Formula Fields
          description: Values of any custom formula fields defined for this report.
          example:
            eq: value
        sent_at_period:
          title: Sent At Period
          description: The period label for the sent date when the report is grouped by a sent date interval.
          example:
            gt: '2026-01-01'
        date_signed_period:
          title: Date Signed Period
          description: The period label for the date signed when the report is grouped by a signing date interval.
          example:
            eq: value
        count:
          type: integer
          title: Count
          description: Number of proposals aggregated into this report row.
          example:
            gt: 0
        status:
          enum:
            - draft
            - sent
            - accepted
            - declined
          type: string
          title: Status
          description: Current lifecycle status of the proposals in this report row (e.g. draft, sent, accepted, declined).
          example:
            eq: active
        total_tax_amount_normalized:
          title: Total Tax Amount Normalized
          description: Sum of calculated tax amounts across all proposals in this report row, normalized to the organization's reporting currency.
          example:
            gt: 0
        group:
          type: string
          title: Group
          description: The grouping dimension used to aggregate proposals into this report row (e.g. company, deal, status).
          example:
            eq: value
        responsible_id:
          type: integer
          title: Responsible
          description: ID of the responsible person for the proposals in this report row.
          example:
            - 123
      description: A single aggregated row in a proposal report, containing metrics and grouping fields for one or more proposals.
      example:
        id: '123'
        type: proposal_reports
        attributes:
          total_value: 25000
          status: sent
          deal_id: 89
        relationships: {}
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
  responses:
    collection_proposal_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        count:
                          $ref: '#/components/schemas/resource_proposal_report/properties/count'
                        group:
                          $ref: '#/components/schemas/resource_proposal_report/properties/group'
                        signed:
                          $ref: '#/components/schemas/resource_proposal_report/properties/signed'
                        status:
                          $ref: '#/components/schemas/resource_proposal_report/properties/status'
                        currency:
                          $ref: '#/components/schemas/resource_proposal_report/properties/currency'
                        link_status:
                          $ref: '#/components/schemas/resource_proposal_report/properties/link_status'
                        formula_fields:
                          $ref: '#/components/schemas/resource_proposal_report/properties/formula_fields'
                        sent_at_period:
                          $ref: '#/components/schemas/resource_proposal_report/properties/sent_at_period'
                        signed_by_email:
                          $ref: '#/components/schemas/resource_proposal_report/properties/signed_by_email'
                        currency_default:
                          $ref: '#/components/schemas/resource_proposal_report/properties/currency_default'
                        total_tax_amount:
                          $ref: '#/components/schemas/resource_proposal_report/properties/total_tax_amount'
                        created_at_period:
                          $ref: '#/components/schemas/resource_proposal_report/properties/created_at_period'
                        updated_at_period:
                          $ref: '#/components/schemas/resource_proposal_report/properties/updated_at_period'
                        date_signed_period:
                          $ref: '#/components/schemas/resource_proposal_report/properties/date_signed_period'
                        total_budget_total:
                          $ref: '#/components/schemas/resource_proposal_report/properties/total_budget_total'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_proposal_report/properties/currency_normalized'
                        average_tax_rate_value:
                          $ref: '#/components/schemas/resource_proposal_report/properties/average_tax_rate_value'
                        status_changed_at_period:
                          $ref: '#/components/schemas/resource_proposal_report/properties/status_changed_at_period'
                        total_tax_amount_default:
                          $ref: '#/components/schemas/resource_proposal_report/properties/total_tax_amount_default'
                        total_budget_total_default:
                          $ref: '#/components/schemas/resource_proposal_report/properties/total_budget_total_default'
                        total_tax_amount_normalized:
                          $ref: '#/components/schemas/resource_proposal_report/properties/total_tax_amount_normalized'
                        total_budget_total_normalized:
                          $ref: '#/components/schemas/resource_proposal_report/properties/total_budget_total_normalized'
                    relationships:
                      type: object
                      properties:
                        deal:
                          $ref: '#/components/schemas/_single_relationship'
                        report:
                          $ref: '#/components/schemas/_single_relationship'
                        company:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        proposal:
                          $ref: '#/components/schemas/_single_relationship'
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                        deal_report:
                          $ref: '#/components/schemas/_single_relationship'
                        responsible:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        company_report:
                          $ref: '#/components/schemas/_single_relationship'
                        creator_report:
                          $ref: '#/components/schemas/_single_relationship'
                        responsible_report:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: A paginated collection of proposal report resources.
