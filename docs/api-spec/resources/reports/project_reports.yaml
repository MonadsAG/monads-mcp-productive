paths:
  /api/v2/reports/project_reports:
    get:
      tags:
        - Reports
      summary: Get project reports
      responses:
        '200':
          $ref: '#/components/responses/collection_project_report'
      parameters:
        - $ref: '#/components/parameters/filter_project_report'
        - $ref: '#/components/parameters/sort_project_report'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/group_project_report'
      operationId: reports-project_reports-index
      description: Retrieve aggregated project report data grouped by configurable dimensions.
