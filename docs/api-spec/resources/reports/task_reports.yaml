    collection_task_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Paginated collection of task report rows.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A task report row item.
                  properties:
                    attributes:
                      type: object
                      description: Attributes of a task report row.
                      properties:
                        closed_at_period:
                          $ref: '#/components/schemas/resource_task_report/properties/closed_at_period'
                        count:
                          $ref: '#/components/schemas/resource_task_report/properties/count'
                        created_at_period:
                          $ref: '#/components/schemas/resource_task_report/properties/created_at_period'
                        currency:
                          $ref: '#/components/schemas/resource_task_report/properties/currency'
                        currency_default:
                          $ref: '#/components/schemas/resource_task_report/properties/currency_default'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_task_report/properties/currency_normalized'
                        custom_fields:
                          type: object
                          description: Custom field values for tasks in this report group.
                        due_date_period:
                          $ref: '#/components/schemas/resource_task_report/properties/due_date_period'
                        formula_fields:
                          $ref: '#/components/schemas/resource_task_report/properties/formula_fields'
                        group:
                          $ref: '#/components/schemas/resource_task_report/properties/group'
                        last_activity_at_period:
                          $ref: '#/components/schemas/resource_task_report/properties/last_activity_at_period'
                        month:
                          $ref: '#/components/schemas/resource_task_report/properties/month'
                        quarter:
                          $ref: '#/components/schemas/resource_task_report/properties/quarter'
                        repeating:
                          $ref: '#/components/schemas/resource_task_report/properties/repeating'
                        start_date_period:
                          $ref: '#/components/schemas/resource_task_report/properties/start_date_period'
                        status:
                          $ref: '#/components/schemas/resource_task_report/properties/status'
                        total_billable_time:
                          anyOf:
                            - $ref: '#/components/schemas/resource_task_report/properties/total_billable_time'
                            - type: string
                          description: Sum of billable time across all records in this task report group.
                        total_estimate_at_completion:
                          anyOf:
                            - $ref: '#/components/schemas/resource_task_report/properties/total_estimate_at_completion'
                            - type: string
                          description: Sum of estimate at completion across all records in this task report group.
                        total_estimation_offset_time:
                          $ref: '#/components/schemas/resource_task_report/properties/total_estimation_offset_time'
                        total_initial_estimate:
                          anyOf:
                            - $ref: '#/components/schemas/resource_task_report/properties/total_initial_estimate'
                            - type: string
                          description: Sum of initial estimates (in minutes) across all tasks in this group.
                        total_remaining_time:
                          anyOf:
                            - $ref: '#/components/schemas/resource_task_report/properties/total_remaining_time'
                            - type: string
                          description: Sum of remaining time (in minutes) across all tasks in this group.
                        total_worked_time:
                          anyOf:
                            - $ref: '#/components/schemas/resource_task_report/properties/total_worked_time'
                            - type: string
                          description: Sum of worked time (in minutes) across all tasks in this group.
                        week:
                          $ref: '#/components/schemas/resource_task_report/properties/week'
                        workflow_status_category_id:
                          $ref: '#/components/schemas/resource_task_report/properties/workflow_status_category_id'
                        year:
                          $ref: '#/components/schemas/resource_task_report/properties/year'
                        total_booked_time:
                          anyOf:
                            - $ref: '#/components/schemas/resource_task_report/properties/total_booked_time'
                            - type: string
                          description: Sum of `booked_time` across all tasks in the report, in minutes.
                        total_future_booked_time:
                          anyOf:
                            - $ref: '#/components/schemas/resource_task_report/properties/total_future_booked_time'
                            - type: string
                          description: Sum of `future_booked_time` across all tasks in the report, in minutes.
                        total_left_to_schedule_time:
                          anyOf:
                            - $ref: '#/components/schemas/resource_task_report/properties/total_left_to_schedule_time'
                            - type: string
                          description: Sum of `left_to_schedule_time` across all tasks in the report, in minutes.
                        total_net_unplanned_time:
                          anyOf:
                            - $ref: '#/components/schemas/resource_task_report/properties/total_net_unplanned_time'
                            - type: string
                          description: Sum of `net_unplanned_time` across all tasks in the report, in minutes.
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Relationships of a task report row.
                      properties:
                        assignee:
                          $ref: '#/components/schemas/_single_relationship'
                        assignee_report:
                          $ref: '#/components/schemas/_single_relationship'
                        company:
                          $ref: '#/components/schemas/_single_relationship'
                        company_report:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        creator_report:
                          $ref: '#/components/schemas/_single_relationship'
                        folder:
                          $ref: '#/components/schemas/_single_relationship'
                        last_actor:
                          $ref: '#/components/schemas/_single_relationship'
                        last_actor_report:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        parent_task:
                          $ref: '#/components/schemas/_single_relationship'
                        project:
                          $ref: '#/components/schemas/_single_relationship'
                        project_report:
                          $ref: '#/components/schemas/_single_relationship'
                        report:
                          $ref: '#/components/schemas/_single_relationship'
                        service:
                          $ref: '#/components/schemas/_single_relationship'
                        task:
                          $ref: '#/components/schemas/_single_relationship'
                        task_list:
                          $ref: '#/components/schemas/_single_relationship'
                        workflow:
                          $ref: '#/components/schemas/_single_relationship'
                        workflow_status:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
