openapi: 3.1.0
info:
  title: Productive.io API – Reports – task_reports
  version: 2.0.0
x-filters:
  task_report:
    folder_id:
      description: Filter task reports by the ID of the folder the task's task list belongs to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    booked_time:
      description: Filters tasks by booked time — minutes already scheduled through bookings.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    due_date_on:
      description: Filter task reports to tasks with a due date on the specified date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    type_id:
      description: Filter task reports by the ID of the task type definition.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    template_id:
      description: Filter tasks by the template they were created from.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    worked_time:
      description: Filter task report results by worked time.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_type:
      description: Filter task reports by the task type (task or issue).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    overdue_status:
      description: 'Filter task reports by the task''s overdue status. Values: overdue (past due date and not closed) or not_overdue.'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_type:
      description: Filter task reports by the type of the task's project (billable or internal).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    start_date:
      description: Filter task reports by the task's start date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    due_date_before:
      description: Filter task reports to tasks with a due date before the specified date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    billable_time:
      description: Filter task reports by billable time logged against the task, in seconds.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    tags:
      description: Filter task reports by tags assigned to the task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_activity_after:
      description: Return tasks with last activity after this timestamp.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    after:
      description: Filter task reports by the date/time after which the task's due date falls.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    created_at:
      description: Filter task reports by the date and time the task was created.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    before:
      description: Filter task reports by the date/time before which the task's due date falls.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    fuzzy_people:
      description: Filter task reports using fuzzy person matching for flexible people queries.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    fuzzy_dates:
      description: Filter task reports using fuzzy date matching for flexible date queries.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_list_id:
      description: Filter task reports by the ID of the task list the task belongs to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    board_status:
      description: 'Filter task reports by the status of the task list (board) the task belongs to. Values: open or closed.'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    closed_before:
      description: Filter task reports to tasks closed before the specified date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_actor_id:
      description: Filter task reports by the ID of the person who last acted on the task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_number:
      description: Filter task reports by the task's sequential number within its project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    dependency_type:
      description: Filter task reports by the dependency type relationship (blocking, waiting_on, or linked).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    repeating:
      description: Filter task reports by whether the task has a repeating schedule.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    template:
      description: Filter task reports by whether the task is a template.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    title:
      description: Filter task reports by the task's title.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subtask:
      description: Filter task reports to include only subtasks (tasks that have a parent task).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    due_date:
      description: Filter task reports by the task's due date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookable_before:
      description: Filter tasks whose linked service is bookable before this date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_activity:
      description: Filter by last activity date range (last_activity_at).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    updated_at:
      description: Filter task reports by the date and time the task was last updated.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    bookable_after:
      description: Filter tasks whose linked service becomes bookable on or after this date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_list_name:
      description: Filter task reports by the name of the task list the task belongs to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    jump_query:
      description: Filter task reports using a jump navigation query for quick task lookup.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    folder_name:
      description: Filter task reports by the name of the folder the task's task list belongs to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    workflow_status_category_id:
      description: Filter task report results by workflow status category id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    workflow_status_id:
      description: Filter task report results by workflow status id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    person_type:
      description: Filter task reports by the type of person assigned to the task (e.g. employee, client, placeholder).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    initial_estimate:
      description: Filter task reports by the task's initial time estimate, in seconds.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    company_id:
      description: Filter task reports by the ID of the client company linked to the task's project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    formulas:
      description: Filter task reports by computed formula field values on the task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    left_to_schedule_time:
      description: Filters tasks by time left to schedule — initial estimate minus booked time, in minutes.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query:
      description: Filter task reports using a text search query against task titles and descriptions.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    net_unplanned_time:
      description: Filters tasks by net unplanned time — initial estimate minus worked time and future booked time, in minutes.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    last_activity_before:
      description: Return tasks with last activity before this timestamp.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    folder_status:
      description: 'Filter task reports by the status of the folder the task''s task list belongs to. Values: open or closed.'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_manager_id:
      description: Filter task reports by the ID of the project manager of the task's project.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    service_id:
      description: Filter task reports by the ID of the service the task is tracked against.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    id:
      description: Filter task reports by the task's numeric ID.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    project_id:
      description: Filter task reports by the ID of the project the task belongs to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    start_date_before:
      description: Filter task reports to tasks with a start date before the specified date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    creator_id:
      description: Filter task reports by the ID of the person who created the task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    public_access:
      description: Filter task reports by whether the task is publicly accessible.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    workflow_id:
      description: Filter task report results by workflow id.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    board_name:
      description: Filter task reports by the name of the task list (board) the task belongs to.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    status:
      description: 'Filter task reports by the task''s workflow status category. Values: not_started, started, or closed.'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    assignee_id:
      description: Filter task reports by the ID of the person assigned to the task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    custom_fields:
      description: Filter task reports by custom field values defined on the task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    trackable_by_person_id:
      description: Filter tasks that the specified person is permitted to track time on.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    date_range:
      description: Filter task reports by a predefined date range (e.g. this_week, this_month, last_month).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    subscriber_id:
      description: Filter task reports by the ID of a person subscribed to the task.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    closed_at:
      description: Filter task reports by the date and time the task was closed.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    start_date_after:
      description: Filter task reports to tasks with a start date after the specified date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    due_date_after:
      description: Filter task reports to tasks with a due date after the specified date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    remaining_time:
      description: Filter task reports by the task's remaining time estimate, in seconds.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    task_list_status:
      description: 'Filter task reports by the status of the task list the task belongs to. Values: open or closed.'
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    due_date_new:
      description: Filter task reports by the task's due date using the newer date field format.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    future_booked_time:
      description: Filters tasks by future booked time — minutes scheduled for future dates.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    parent_task_id:
      description: Filter task reports by the ID of the parent task (for subtasks).
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    full_query:
      description: Filter task reports using a full-text search query across all task text fields.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    query_extended:
      description: Filter task reports using an extended text search query with additional field coverage.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
    closed_after:
      description: Filter task reports to tasks closed after the specified date.
      operators:
        - contains
        - eq
        - not_contain
        - not_eq
paths:
  /api/v2/reports/task_reports:
    get:
      tags:
        - Reports
      summary: Get task reports
      responses:
        '200':
          $ref: '#/components/responses/collection_task_report'
      parameters:
        - $ref: '#/components/parameters/sort_task_report'
        - $ref: '#/components/parameters/filter_task_report'
        - $ref: '#/components/parameters/group_task_report'
        - $ref: '#/components/parameters/header_organization'
      operationId: reports-task_reports-index
      description: Retrieve aggregated task report data grouped by configurable dimensions.
components:
  parameters:
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    group_task_report:
      in: query
      name: group
      style: form
      schema:
        enum:
          - assignee
          - closed_at
          - company
          - created_at
          - creator
          - custom_fields
          - due_date
          - folder
          - last_activity_at
          - last_actor
          - month
          - organization
          - parent_task
          - project
          - quarter
          - repeating
          - service
          - start_date
          - status
          - task
          - task_list
          - week
          - workflow
          - workflow_status
          - workflow_status_category_id
          - year
        type: string
        title: Group task report
      explode: false
      required: false
      description: Group task report
    filter_task_report:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.task_report at the top of this file.
      required: false
      description: Filters
    sort_task_report:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - assignee
            - -assignee
            - closed_at
            - -closed_at
            - company
            - -company
            - count
            - -count
            - created_at
            - -created_at
            - creator
            - -creator
            - custom_fields
            - -custom_fields
            - due_date
            - -due_date
            - folder
            - -folder
            - last_activity_at
            - -last_activity_at
            - last_actor
            - -last_actor
            - month
            - -month
            - parent_task
            - -parent_task
            - placement
            - -placement
            - project
            - -project
            - quarter
            - -quarter
            - service
            - -service
            - start_date
            - -start_date
            - status
            - -status
            - task
            - -task
            - task_closed_at
            - -task_closed_at
            - task_created_at
            - -task_created_at
            - task_custom_fields
            - -task_custom_fields
            - task_due_date
            - -task_due_date
            - task_last_activity_at
            - -task_last_activity_at
            - task_list
            - -task_list
            - task_number
            - -task_number
            - task_start_date
            - -task_start_date
            - title
            - -title
            - total_billable_time
            - -total_billable_time
            - total_booked_time
            - -total_booked_time
            - total_estimate_at_completion
            - -total_estimate_at_completion
            - total_estimation_offset_time
            - -total_estimation_offset_time
            - total_future_booked_time
            - -total_future_booked_time
            - total_initial_estimate
            - -total_initial_estimate
            - total_left_to_schedule_time
            - -total_left_to_schedule_time
            - total_net_unplanned_time
            - -total_net_unplanned_time
            - total_remaining_time
            - -total_remaining_time
            - total_worked_time
            - -total_worked_time
            - week
            - -week
            - workflow
            - -workflow
            - workflow_status
            - -workflow_status
            - workflow_status_category_id
            - -workflow_status_category_id
            - year
            - -year
          type: string
        title: Sort task report
      explode: false
      required: false
      description: Sort task report
  schemas:
    resource_task_report:
      type: object
      title: Task report Resource
      properties:
        workflow_id:
          type: integer
          title: Workflow
          description: Workflow id for this task report group.
          example:
            - 123
        month:
          type: string
          title: Month
          description: Month grouping for this task report row.
          example:
            eq: value
        formula_fields:
          title: Formula Fields
          description: Formula fields for this task report group.
          example:
            eq: value
        due_date_new:
          type: string
          title: Due Date New
          format: date
          description: Due date in a normalized format for grouping.
          example:
            gt: '2026-01-01'
        parent_task:
          title: Parent Task
          description: Parent task for this task report group.
          example:
            eq: value
        year:
          type: string
          title: Year
          description: Year grouping for this task report row.
          example:
            eq: value
        service_id:
          type: integer
          title: Service
          description: Service id for this task report group.
          example:
            - 123
        after:
          type: string
          title: After
          format: date
          description: After for this task report group.
          example:
            eq: value
        last_actor_id:
          type: integer
          title: Last Actor
          description: Last actor id for this task report group.
          example:
            - 123
        template_id:
          type: integer
          title: Template
          description: ID of the template that tasks in this report group were created from.
          example:
            - 123
        currency_normalized:
          title: Currency Normalized
          description: Whether monetary values are normalized to the default currency.
          example:
            eq: value
        company_report:
          title: Company Report
          description: Company report dimension record for the company.
          example:
            eq: value
        folder_name:
          type: string
          title: Folder Name
          description: Display name of the project folder.
          example:
            eq: value
        last_activity:
          type: string
          title: Last Activity
          format: date
          description: Timestamp of the most recent activity on this task.
          example:
            eq: value
        currency_default:
          title: Currency Default
          description: Whether this row uses the organization default currency.
          example:
            eq: value
        project:
          title: Project
          description: Project for this task report group.
          example:
            eq: value
        start_date:
          type: string
          title: Start Date
          format: date
          description: Start date for this task report group.
          example:
            gt: '2026-01-01'
        before:
          type: string
          title: Before
          format: date
          description: The bookable-before date used to scope this report.
          example:
            eq: value
        billable_time:
          type: integer
          title: Billable Time
          description: Total billable time (in minutes) tracked on tasks in this group.
          example:
            gt: 0
        closed_after:
          type: string
          title: Closed After
          format: date
          description: 'Lower bound date filter: tasks closed after this date.'
          example:
            eq: value
        task:
          title: Task
          description: Task for this task report group.
          example:
            eq: value
        workflow:
          title: Workflow
          description: Workflow for this task report group.
          example:
            eq: value
        total_estimation_offset_time:
          type: integer
          title: Total Estimation Offset Time
          description: Sum of estimation offset time across all records in this task report group.
          example:
            gt: 0
        currency:
          title: Currency
          description: Currency code used for monetary values in this row.
          example:
            eq: value
        formulas:
          type: integer
          title: Formulas
          description: Formulas for this task report group.
          example:
            eq: value
        total_billable_time:
          type: number
          title: Total Billable Time
          description: Sum of billable time across all records in this task report group.
          example:
            gt: 0
        subtask:
          type: boolean
          title: Subtask
          description: Subtask for this task report group.
          example:
            eq: value
        task_list:
          title: Task List
          description: Task list for this task report group.
          example:
            eq: value
        project_report:
          title: Project Report
          description: Project report for this task report group.
          example:
            eq: value
        repeating:
          type: integer
          title: Repeating
          description: Repeating for this task report group.
          example:
            eq: value
        company:
          title: Company
          description: Company for this task report group.
          example:
            eq: value
        remaining_time:
          type: integer
          title: Remaining Time
          description: Remaining time for this task report group.
          example:
            gt: 0
        person_type:
          type: integer
          title: Person Type
          description: Person type for this task report group.
          example:
            eq: active
        total_remaining_time:
          type: number
          title: Total Remaining Time
          description: Sum of remaining time across all records in this task report group.
          example:
            gt: 0
        company_id:
          type: integer
          title: Company
          description: Company id for this task report group.
          example:
            - 123
        workflow_status:
          title: Workflow Status
          description: Workflow status for this task report group.
          example:
            eq: active
        task_created_at:
          title: Task Created At
          description: Task created at for this task report group.
          example:
            gt: '2026-01-01'
        initial_estimate:
          type: integer
          title: Initial Estimate
          description: Initial estimate for this task report group.
          example:
            gt: 0
        jump_query:
          type: string
          title: Jump Query
          description: Jump query for this task report group.
          example:
            eq: value
        task_last_activity_at:
          title: Task Last Activity At
          description: Timestamp of the most recent activity on the task associated with this report row.
          example:
            gt: '2026-01-01'
        last_activity_before:
          type: string
          title: Last Activity Before
          format: date
          description: Return tasks with last activity before this date.
          example:
            eq: value
        created_at_period:
          title: Created At Period
          description: Period label for the created_at date grouping dimension.
          example:
            gt: '2026-01-01'
        date_range:
          type: string
          title: Date Range
          format: date
          description: Date range (start date / due date) of the tasks.
          example:
            eq: value
        subscriber_id:
          type: integer
          title: Subscriber
          description: Subscriber id for this task report group.
          example:
            - 123
        task_type:
          enum:
            - 1
            - 2
          type: integer
          title: Task Type
          description: Task type for this task report group.
          example:
            eq: active
        bookable_after:
          type: string
          title: Bookable After
          format: date
          description: Filter task report entries to those bookable after this date.
          example:
            eq: value
        start_date_after:
          type: string
          title: Start Date After
          format: date
          description: Start date after for this task report group.
          example:
            gt: '2026-01-01'
        creator_id:
          type: integer
          title: Creator
          description: ID of the person who created the task.
          example:
            - 123
        last_activity_after:
          type: string
          title: Last Activity After
          format: date
          description: Return tasks with last activity after this date.
