paths:
  /api/v2/reports/person_reports:
    get:
      tags:
        - Reports
      summary: Get person reports
      operationId: reports-person_reports-index
      description: Retrieve aggregated person report data grouped by configurable dimensions.
      parameters:
        - $ref: '#/components/parameters/filter_person_report'
        - $ref: '#/components/parameters/sort_person_report'
        - $ref: '#/components/parameters/group_person_report'
      responses:
        '200':
          $ref: '#/components/responses/collection_person_report'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
