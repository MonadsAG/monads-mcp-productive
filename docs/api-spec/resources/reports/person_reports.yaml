                          $ref: '#/components/schemas/resource_person_report/properties/contact_zipcode'
                        count:
                          $ref: '#/components/schemas/resource_person_report/properties/count'
                        created_at_period:
                          $ref: '#/components/schemas/resource_person_report/properties/created_at_period'
                        currency:
                          $ref: '#/components/schemas/resource_person_report/properties/currency'
                        currency_default:
                          $ref: '#/components/schemas/resource_person_report/properties/currency_default'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_person_report/properties/currency_normalized'
                        custom_fields:
                          type: object
                          description: Custom field values attached to this person.
                        deactivated_at_period:
                          $ref: '#/components/schemas/resource_person_report/properties/deactivated_at_period'
                        formula_fields:
                          $ref: '#/components/schemas/resource_person_report/properties/formula_fields'
                        group:
                          $ref: '#/components/schemas/resource_person_report/properties/group'
                        joined_at_period:
                          $ref: '#/components/schemas/resource_person_report/properties/joined_at_period'
                        last_activity_at_period:
                          $ref: '#/components/schemas/resource_person_report/properties/last_activity_at_period'
                        month:
                          $ref: '#/components/schemas/resource_person_report/properties/month'
                        offboarding_status:
                          $ref: '#/components/schemas/resource_person_report/properties/offboarding_status'
                        quarter:
                          $ref: '#/components/schemas/resource_person_report/properties/quarter'
                        role_id:
                          anyOf:
                            - $ref: '#/components/schemas/resource_person_report/properties/role_id'
                            - type: 'null'
                          description: The ID of the role assigned to this person.
                        status:
                          $ref: '#/components/schemas/resource_person_report/properties/status'
                        type:
                          $ref: '#/components/schemas/resource_person_report/properties/type'
                        week:
                          $ref: '#/components/schemas/resource_person_report/properties/week'
                        year:
                          $ref: '#/components/schemas/resource_person_report/properties/year'
                        shared_seat:
                          $ref: '#/components/schemas/resource_person_report/properties/shared_seat'
                      example:
                        eq: value
                    relationships:
                      type: object
                      description: Relationship links for this person report record.
                      properties:
                        approval_policy:
                          $ref: '#/components/schemas/_single_relationship'
                        company:
                          $ref: '#/components/schemas/_single_relationship'
                        company_report:
                          $ref: '#/components/schemas/_single_relationship'
                        custom_role:
                          $ref: '#/components/schemas/_single_relationship'
                        manager:
                          $ref: '#/components/schemas/_single_relationship'
                        manager_report:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        person:
                          $ref: '#/components/schemas/_single_relationship'
                        report:
                          $ref: '#/components/schemas/_single_relationship'
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                        job_role:
                          $ref: '#/components/schemas/_single_relationship'
                      example:
                        eq: value
                  example:
                    eq: value
                description: Array of person report row resource objects.
                example:
                  eq: value
              included:
                type: array
                items:
                  description: An included related resource object.
                  example:
                    eq: value
                description: Array of included related resources.
                example:
                  eq: value
              meta:
                $ref: '#/components/schemas/_meta'
            example:
              data:
                - id: r-005
                  type: person_reports
                  attributes:
                    billable_time: 14400
                    nonbillable_time: 1800
                    total_time: 16200
                    utilization: 0.85
                    capacity: 9600
                    revenue: '3600.00'
                    cost: '1620.00'
                    person_id: 12
                    currency: USD
              included: []
              meta:
                current_page: 1
                total_pages: 5
                total_count: 42
                page_size: 30
                max_page_size: 200
