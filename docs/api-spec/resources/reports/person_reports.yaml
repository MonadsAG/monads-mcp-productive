    collection_person_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            description: Collection of aggregated person report rows.
            properties:
              data:
                type: array
                items:
                  type: object
                  description: A single person report record in the collection response.
                  properties:
                    attributes:
                      type: object
                      description: The attribute fields of a person report record.
                      properties:
                        autotracking:
                          type: boolean
