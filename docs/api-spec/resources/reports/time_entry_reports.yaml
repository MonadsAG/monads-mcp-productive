      required: false
      description: Filters
  schemas:
    resource_time_entry_report:
      type: object
      title: Time entry report Resource
      properties:
        day:
          type: string
          title: Day
          description: The specific day for which time was tracked.
          example:
            eq: value
        total_work_cost_default:
          title: Total Work Cost Default
          description: Sum of work cost in the organization's default currency across all records in this time entry report group.
          example:
            eq: value
        overhead:
          type: integer
          title: Overhead
          description: Indicates whether this time entry is classified as overhead.
          example:
            eq: value
        total_recognized_revenue_normalized:
          title: Total Recognized Revenue Normalized
          description: Sum of recognized revenue in the normalized currency across all records in this time entry report group.
          example:
            eq: value
        billable_time:
          type: integer
          title: Billable Time
          description: Hours billable to the client for this time entry.
          example:
            gt: 0
        invoice_id:
          type: integer
          title: Invoice
          description: The ID of the invoice this time entry has been billed on.
          example:
            - 123
        total_cost_default:
          title: Total Cost Default
          description: Sum of cost in the organization's default currency across all records in this time entry report group.
          example:
            eq: value
        task_id:
          type: integer
          title: Task
          description: Task id for this time entry report group.
          example:
            - 123
        total_cost_normalized:
          title: Total Cost Normalized
          description: Sum of cost in the normalized currency across all records in this time entry report group.
          example:
            eq: value
        assigned_approver_id:
          type: integer
          title: Assigned Approver
          description: The ID of the approver currently assigned to this time entry.
          example:
            - 123
        month:
          type: string
          title: Month
          description: The month in which the time entry was tracked.
          example:
            eq: value
        section_name:
          type: string
          title: Section Name
          description: The name of the budget section the service belongs to.
          example:
            eq: value
        deal_subsidiary_id:
          type: integer
          title: Deal Subsidiary
          description: The ID of the subsidiary of the deal this time entry is tracked against.
          example:
            - 123
        billable:
          type: boolean
          title: Billable
          description: Indicates whether the time entry is billable to the client.
          example: true
        person_manager_id:
          type: integer
          title: Person Manager
        average_recognized_margin:
          type: number
          title: Average Recognized Margin
          description: Average profit margin calculated from recognized revenue and costs.
          example:
            eq: value
        budget_id:
          type: integer
          title: Budget
          description: The ID of the budget this time entry is tracked against.
          example:
            - 123
        project:
          title: Project
          description: The project this time entry is tracked on.
          example:
            eq: value
        created_at_period:
          title: Created At Period
          description: The time period (day, week, month) for the created_at grouping.
          example: '2026-01-15T10:00:00Z'
        jira_worklog_id:
          type: integer
          title: Jira Worklog
          description: The Jira worklog ID linked to this time entry.
          example:
            - 123
        internal_overhead_cost:
          title: Internal Overhead Cost
          description: Total internal overhead cost allocated to this time entry.
          example:
            eq: value
        created_before:
          type: string
          title: Created Before
          format: date
          description: Return time entries created before this datetime.
          example: value
        intercompany_hours:
          type: integer
          title: Intercompany Hours
          description: Indicates whether hours were tracked on a budget owned by another subsidiary.
          example:
            eq: value
        report:
          title: Report
          description: The report identifier for this time entry aggregation.
          example:
            eq: value
        company:
          title: Company
          description: The client company this time entry is tracked for.
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date
          description: Timestamp when the time entry was created.
          example: '2026-01-15T10:00:00Z'
        total_overhead_cost_default:
          title: Total Overhead Cost Default
          description: Sum of overhead cost in the organization's default currency across all records in this time entry report group.
          example:
            eq: value
        invoice_attribution_id:
          type: integer
          title: Invoice Attribution
          description: The ID of the invoice attribution linking this time entry to an invoice.
          example:
            - 123
        approval_policy:
          title: Approval Policy
          description: The approval policy governing this time entry.
          example:
            eq: value
        booking_id:
          type: integer
          title: Booking
          description: The ID of the booking this time entry is associated with.
          example:
            - 123
        people_custom_fields:
          type: string
          title: People Custom Fields
          description: Custom field values associated with the person who tracked time.
          example:
            eq: value
        total_billable_revenue:
          title: Total Billable Revenue
          description: Sum of billable revenue across all records in this time entry report group.
          example:
            eq: value
        task_list:
          title: Task List
          description: Task list for this time entry report group.
          example:
            eq: value
        total_recognized_time:
          type: number
          title: Total Recognized Time
          description: Sum of recognized time across all records in this time entry report group.
          example:
            gt: 0
        billing_type:
          type: integer
          title: Billing Type
          description: The billing type of the service (hourly, fixed price, etc.).
          example:
            eq: active
        total_recognized_revenue_default:
          title: Total Recognized Revenue Default
          description: Sum of recognized revenue in the organization's default currency across all records in this time entry report group.
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: Unique identifier of the time entry report record.
          example:
            - 123
        unit_id:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Unit
          description: Unit id for this time entry report group.
          example:
            - 123
        deal_subsidiary:
          title: Deal Subsidiary
          description: The subsidiary of the deal this time entry is tracked against.
          example:
            eq: value
        company_report:
          title: Company Report
          description: Report data for the associated company.
          example:
            eq: value
        task_report:
          title: Task Report
          description: Task report for this time entry report group.
          example:
            eq: value
        responsible_id:
          type: integer
          title: Responsible
          description: The ID of the budget owner responsible for approving this time entry.
          example:
            - 123
        approval_policy_id:
          type: integer
          title: Approval Policy
          description: The ID of the approval policy governing this time entry.
          example:
            - 123
        service_type:
          title: Service Type
          description: The type of service this time entry is tracked against.
          example:
            eq: active
        jira_issue_status:
          type: string
          title: Jira Issue Status
          description: The Jira issue status linked to this time entry.
          example:
            eq: active
        creator_id:
          type: integer
          title: Creator
          description: The ID of the person who created this time entry.
          example:
            - 123
        started_before:
          type: string
          title: Started Before
          format: date
          description: Started before for this time entry report group.
          example:
            eq: value
        parent_company_id:
          type: integer
          title: Parent Company
          description: ID of the parent company of the client linked to this time entry's budget, used for hierarchical company filtering.
          example:
            - 123
