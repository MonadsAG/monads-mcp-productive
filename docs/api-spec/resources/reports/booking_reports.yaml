        - Reports
      summary: Get booking reports
      responses:
        '200':
          $ref: '#/components/responses/collection_booking_report'
      parameters:
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/group_booking_report'
        - $ref: '#/components/parameters/sort_booking_report'
        - $ref: '#/components/parameters/filter_booking_report'
      operationId: reports-booking_reports-index
      description: Retrieve aggregated booking report data grouped by configurable dimensions.
