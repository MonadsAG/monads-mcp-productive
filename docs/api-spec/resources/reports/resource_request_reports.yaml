openapi: 3.1.0
info:
  title: Productive.io API – Reports – resource_request_reports
  version: 2.0.0
paths:
  /api/v2/reports/resource_request_reports:
    get:
      tags:
        - Reports
      summary: Get resource request reports
      responses:
        '200':
          $ref: '#/components/responses/collection_resource_request_report'
      parameters:
        - $ref: '#/components/parameters/group_resource_request_report'
        - $ref: '#/components/parameters/header_organization'
        - $ref: '#/components/parameters/sort_resource_request_report'
        - $ref: '#/components/parameters/filter_resource_request_report'
      operationId: reports-resource_request_reports-index
      description: Retrieve aggregated resource request report data grouped by configurable dimensions.
components:
  parameters:
    filter_resource_request_report:
      in: query
      name: filter
      style: deepObject
      schema:
        type: object
        description: Filter keys and their operators are listed under x-filters.resource_request_report at the top of this file.
      required: false
      description: Filters
    sort_resource_request_report:
      in: query
      name: sort
      style: form
      schema:
        type: array
        items:
          enum:
            - booking_method
            - -booking_method
            - created_at
            - -created_at
            - creator
            - -creator
            - custom_fields
            - -custom_fields
            - deal_or_budget_report.custom_fields
            - -deal_or_budget_report.custom_fields
            - ended_on
            - -ended_on
            - resolver
            - -resolver
            - resource_request
            - -resource_request
            - resource_request_created_at
            - -resource_request_created_at
            - resource_request_ended_on
            - -resource_request_ended_on
            - resource_request_started_on
            - -resource_request_started_on
            - service
            - -service
            - service_type
            - -service_type
            - started_on
            - -started_on
            - status
            - -status
            - subsidiary
            - -subsidiary
          type: string
        title: Sort resource request report
      explode: false
      required: false
      description: Sort resource request report
    header_organization:
      in: header
      name: X-Organization-Id
      schema:
        type: string
      required: true
      description: Organization ID
    group_resource_request_report:
      in: query
      name: group
      style: form
      schema:
        enum:
          - booking_method
          - created_at
          - creator
          - custom_fields
          - deal_or_budget_report.custom_fields
          - ended_on
          - organization
          - resolver
          - resource_request
          - service
          - service_type
          - started_on
          - status
          - subsidiary
        type: string
        title: Group resource request report
      explode: false
      required: false
      description: Group resource request report
  schemas:
    resource_resource_request:
      type: object
      title: Resource request Resource
      properties:
        service_id:
          type: integer
          title: Service
          description: The ID of the service this resource request is associated with.
          example:
            - 123
        ended_on:
          type: string
          title: Ended On
          format: date
          description: The end date of the requested resource allocation period.
          example:
            eq: value
        max_cost_per_hour_normalized:
          title: Max Cost Per Hour Normalized
          description: The maximum cost per hour converted to the normalized quote currency.
          example:
            eq: value
        deleted_at:
          type: string
          title: Deleted At
          format: date
          description: Timestamp when this resource request was soft-deleted, or null if active.
          example:
            gt: '2026-01-01'
        workplace_id:
          type: integer
          title: Workplace
          description: The workplace ID associated with the requested resource, as stored in the fields.
          example:
            - 123
        max_cost_per_hour_default:
          title: Max Cost Per Hour Default
          description: The maximum cost per hour converted to the default account currency.
          example:
            eq: value
        max_cost_per_hour:
          title: Max Cost Per Hour
          description: The maximum cost per hour for the requested resource in the request currency.
          example:
            eq: value
        organization:
          title: Organization
          description: The JSON:API relationship object for the organization this resource request belongs to.
          example:
            eq: value
        booking_method_id:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Booking Method
          description: The booking method ID specifying how the requested time is tracked.
          example:
            - 123
        custom_fields:
          type: object
          title: Custom Fields
          description: A JSON object containing custom field values for this resource request.
          example:
            eq: value
        service:
          title: Service
          description: The JSON:API relationship object for the service this resource request belongs to.
          example:
            eq: value
        total_time:
          type: integer
          title: Total Time
          description: The total requested time in minutes when using total-hours booking.
          example:
            gt: 0
        custom_field_attachments:
          title: Custom Field Attachments
          description: The JSON:API relationship objects for file attachments linked via custom fields.
          example:
            gt: '2026-01-01'
        percentage:
          type: integer
          title: Percentage
          description: The requested allocation percentage from 0 to 100 when using percentage-based booking.
          example:
            eq: value
        currency_normalized:
          title: Currency Normalized
          description: The normalized quote-level currency code used for cost calculations.
          example:
            eq: value
        exchange_date:
          type: string
          title: Exchange Date
          format: date
          description: The date used for the exchange rate lookup on this resource request.
          example:
            gt: '2026-01-01'
        job_title:
          type: string
          title: Job Title
          description: The requested job title for the resource, as stored in the resource request fields.
          example:
            eq: value
        resolver:
          title: Resolver
          description: The JSON:API relationship object for the person who resolved this resource request.
          example:
            eq: value
        currency:
          type: string
          title: Currency
          description: The currency code used for cost calculations on this resource request.
          example:
            eq: value
        currency_default:
          title: Currency Default
          description: The default account-level currency code used for cost calculations.
          example:
            eq: value
        subsidiary_id:
          type: integer
          title: Subsidiary
          description: The subsidiary ID associated with the requested resource, as stored in the fields.
          example:
            - 123
        time_to_close:
          type: integer
          title: Time To Close
          description: The number of minutes elapsed between creation and resolution of this resource request.
          example:
            gt: 0
        note:
          type: string
          title: Note
          description: An optional HTML note providing additional context for this resource request.
          example:
            eq: value
        custom_field_people:
          title: Custom Field People
          description: The JSON:API relationship objects for people linked via custom fields.
          example:
            eq: value
        canceled_at:
          type: string
          title: Canceled At
          format: date-time
          description: Timestamp when this resource request was canceled, or null if not canceled.
          example:
            gt: '2026-01-01'
        exchange_rate_normalized:
          type: number
          title: Exchange Rate Normalized
          description: The exchange rate from the resource request currency to the normalized quote currency.
          example:
            gt: 0
        status:
          enum:
            - pending
            - resolved
            - rejected
            - canceled
          type: string
          title: Status
          description: 'The current status of the resource request: pending, resolved, rejected, or canceled.'
          example:
            eq: active
        time:
          type: integer
          title: Time
          description: The requested time in minutes per day when using per-day booking.
          example:
            gt: 0
        title:
          type: string
          title: Title
          description: The title describing the resource being requested.
          example:
            eq: value
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this resource request was created.
          example:
            gt: '2026-01-01'
        fields:
          type: object
          title: Fields
          description: A JSON object containing additional structured fields such as job_title, subsidiary_id, team_ids, service_type_ids, and tags.
          example:
            eq: value
        exchange_rate:
          type: number
          title: Exchange Rate
          description: The exchange rate from the resource request currency to the default account currency.
          example:
            gt: 0
        tags:
          type: string
          title: Tags
          description: The list of tag labels associated with this resource request.
          example:
            eq: value
        query:
          type: string
          title: Query
          description: A full-text search string used for matching resource requests by title.
          example:
            eq: value
        team_id:
          type: integer
          title: Team
          description: The team IDs associated with the requested resource, as stored in the fields.
          example:
            - 123
        creator_id:
          type: integer
          title: Creator
          description: The ID of the person who created this resource request.
          example:
            - 123
        id:
          type: integer
          title: Id
          description: The unique identifier of this resource request.
          example:
            - 123
        resolved_at:
          type: string
          title: Resolved At
          format: date-time
          description: Timestamp when this resource request was resolved, or null if still open.
          example:
            gt: '2026-01-01'
        rejected_reason:
          type: string
          title: Rejected Reason
          description: The reason provided when the resource request was rejected.
          example:
            eq: value
        service_type_id:
          type: integer
          title: Service Type
          description: The service type IDs associated with the requested resource, as stored in the fields.
          example:
            - 123
        creator:
          title: Creator
          description: The JSON:API relationship object for the person who created this resource request.
          example:
            eq: value
        started_on:
          type: string
          title: Started On
          format: date
          description: The start date of the requested resource allocation period.
          example:
            eq: value
        resolver_id:
          type: integer
          title: Resolver
          description: The ID of the person who resolved this resource request.
          example:
            - 123
      description: Schema for a resource request resource object.
      example:
        id: '123'
        type: resource_requests
        attributes:
          status: pending
          requested_hours: 80
          start_date: '2026-02-01'
          end_date: '2026-02-28'
        relationships: {}
    _meta:
      type: object
      title: Meta
      properties:
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
      description: Pagination and response metadata returned with every collection endpoint.
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - type: object
          title: Single data
          properties:
            data:
              $ref: '#/components/schemas/_resource'
          description: Included variant — the related resource identifier is present in `data`.
          example:
            data:
              type: tasks
              id: '42'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      properties:
        meta:
          type: object
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          description: Metadata indicating the sideload status of this relationship.
          example:
            included: false
      description: Placeholder for a relationship that was not sideloaded in this response.
      example:
        meta:
          included: false
    _resource:
      type: object
      title: Resource Identifier
      properties:
        id:
          type: integer
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      description: A JSON:API resource identifier object containing the resource type and ID.
      example:
        type: tasks
        id: '42'
    resource_resource_request_report:
      type: object
      title: Resource request report Resource
      properties:
        ended_on_period:
          title: Ended On Period
          description: Bucketed end date, populated when grouping by ended_on over a period
        status:
          enum:
            - pending
            - resolved
            - rejected
            - canceled
          type: string
          title: Status
          description: 'The current status of the resource request: pending, resolved, rejected, or canceled.'
        creator:
          title: Creator
        creator_report:
          title: Creator Report
        created_at_period:
          title: Created At Period
          description: Bucketed creation date, populated when grouping by created_at over a period
        currency_normalized:
          title: Currency Normalized
          description: The normalized quote-level currency code used for cost calculations.
        subsidiary:
          title: Subsidiary
        total_max_cost_per_hour_default:
          title: Total Max Cost Per Hour Default
          description: Sum of the maximum cost per hour of the requests in this row, converted to the account's default currency
        started_on_period:
          title: Started On Period
          description: Bucketed start date, populated when grouping by started_on over a period
        count:
          type: integer
          title: Count
          description: Number of resource requests aggregated into this row
        service_report:
          title: Service Report
        total_max_cost_per_hour_normalized:
          title: Total Max Cost Per Hour Normalized
          description: Sum of the maximum cost per hour of the requests in this row, converted to the report's normalized currency
        group:
          type: string
          title: Group
          description: The dimension value each aggregated row represents; mirrors the group query parameter
        service:
          title: Service
        service_type:
          title: Service Type
        resolver:
          title: Resolver
        deal_or_budget_report:
          title: Deal or Budget Report
        total_max_cost_per_hour:
          title: Total Max Cost Per Hour
          description: Sum of the maximum cost per hour of the requests in this row, in the record currency
        resolver_report:
          title: Resolver Report
        currency_default:
          title: Currency Default
          description: The default account-level currency code used for cost calculations.
        booking_method:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Booking Method
          description: The booking method ID specifying how the requested time is tracked.
        resource_request:
          title: Resource Request
        currency:
          type: string
          title: Currency
          description: The currency code used for cost calculations on this resource request.
  responses:
    collection_resource_request_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        count:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/count'
                        group:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/group'
                        status:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/status'
                        currency:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/currency'
                        booking_method:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/booking_method'
                        ended_on_period:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/ended_on_period'
                        currency_default:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/currency_default'
                        created_at_period:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/created_at_period'
                        started_on_period:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/started_on_period'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/currency_normalized'
                        total_max_cost_per_hour:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/total_max_cost_per_hour'
                        total_max_cost_per_hour_default:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/total_max_cost_per_hour_default'
                        total_max_cost_per_hour_normalized:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/total_max_cost_per_hour_normalized'
                    relationships:
                      type: object
                      properties:
                        report:
                          $ref: '#/components/schemas/_single_relationship'
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        service:
                          $ref: '#/components/schemas/_single_relationship'
                        resolver:
                          $ref: '#/components/schemas/_single_relationship'
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        service_type:
                          $ref: '#/components/schemas/_single_relationship'
                        creator_report:
                          $ref: '#/components/schemas/_single_relationship'
                        service_report:
                          $ref: '#/components/schemas/_single_relationship'
                        resolver_report:
                          $ref: '#/components/schemas/_single_relationship'
                        resource_request:
                          $ref: '#/components/schemas/_single_relationship'
                        deal_or_budget_report:
                          $ref: '#/components/schemas/_single_relationship'
              meta:
                $ref: '#/components/schemas/_meta'
              included:
                type: array
                items: {}
      description: Collection resource request report
