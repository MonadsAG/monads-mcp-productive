openapi: 3.1.0
info:
  title: Productive.io API – Reports – resource_request_reports
  version: 2.0.0
paths:
  /api/v2/reports/resource_request_reports:
    get:
      tags:
        - Reports
      summary: Get resource request reports
      operationId: reports-resource_request_reports-index
      description: Retrieve aggregated resource request report data grouped by configurable dimensions.
      parameters:
        - $ref: '#/components/parameters/filter_resource_request_report'
        - $ref: '#/components/parameters/sort_resource_request_report'
        - $ref: '#/components/parameters/group_resource_request_report'
      responses:
        '200':
          $ref: '#/components/responses/collection_resource_request_report'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
          $ref: '#/components/responses/locked'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  responses:
    internal_server_error:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_server_error'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Internal Server Error
    too_many_requests:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    detail:
                      type: string
                    limit:
                      type: integer
                    period:
                      type: integer
                    status:
                      enum:
                        - 429
                      type: integer
                    title:
                      type: string
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
        X-RateLimit-Limit:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
      description: Too Many Requests
    locked:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_locked'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Locked
    request_timeout:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_request_timeout'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Request Timeout
    forbidden:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_forbidden'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    meta:
                      type: object
                      title: Meta
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Forbidden
    unauthorized:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_unauthorized'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Unauthorized
    bad_request:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  title: Error
                  properties:
                    code:
                      $ref: '#/components/schemas/error_code_bad_request'
                    detail:
                      $ref: '#/components/schemas/error/properties/detail'
                    source:
                      $ref: '#/components/schemas/error/properties/source'
                    status:
                      $ref: '#/components/schemas/error/properties/status'
                    title:
                      $ref: '#/components/schemas/error/properties/title'
                title: Errors
            required:
              - errors
      headers:
        Content-Type:
          schema:
            type: string
      description: Bad Request
    collection_resource_request_report:
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    attributes:
                      type: object
                      description: Attributes of a resource request report row.
                      properties:
                        booking_method:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/booking_method'
                        count:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/count'
                        created_at_period:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/created_at_period'
                        currency:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/currency'
                        currency_default:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/currency_default'
                        currency_normalized:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/currency_normalized'
                        ended_on_period:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/ended_on_period'
                        group:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/group'
                        started_on_period:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/started_on_period'
                        status:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/status'
                        total_max_cost_per_hour:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/total_max_cost_per_hour'
                        total_max_cost_per_hour_default:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/total_max_cost_per_hour_default'
                        total_max_cost_per_hour_normalized:
                          $ref: '#/components/schemas/resource_resource_request_report/properties/total_max_cost_per_hour_normalized'
                    relationships:
                      type: object
                      description: Resource request report relationships
                      properties:
                        creator:
                          $ref: '#/components/schemas/_single_relationship'
                        creator_report:
                          $ref: '#/components/schemas/_single_relationship'
                        deal_or_budget_report:
                          $ref: '#/components/schemas/_single_relationship'
                        organization:
                          $ref: '#/components/schemas/_single_relationship'
                        report:
                          $ref: '#/components/schemas/_single_relationship'
                        resolver:
                          $ref: '#/components/schemas/_single_relationship'
                        resolver_report:
                          $ref: '#/components/schemas/_single_relationship'
                        resource_request:
                          $ref: '#/components/schemas/_single_relationship'
                        service:
                          $ref: '#/components/schemas/_single_relationship'
                        service_report:
                          $ref: '#/components/schemas/_single_relationship'
                        service_type:
                          $ref: '#/components/schemas/_single_relationship'
                        subsidiary:
                          $ref: '#/components/schemas/_single_relationship'
                description: Array of resource request report row resource objects.
              included:
                type: array
                items: {}
                description: Array of included related resources.
              meta:
                $ref: '#/components/schemas/_meta'
      description: Collection resource request report
  schemas:
    error:
      type: object
      title: Error
      description: One JSON:API error object. `code` is the stable, machine-readable identifier a client branches on; `title` and `detail` are human-facing and may be reworded without notice. Each resource publishes the codes its own endpoints can return as an `error_code_<resource>` schema.
      properties:
        code:
          type: string
          title: Code
          description: The stable identifier for this kind of error.
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
        source:
          type: object
          title: Source
          description: What in the request caused the error.
          properties:
            pointer:
              type: string
              title: Pointer
              description: The path to the member of the request document that caused the error, as `data/attributes/<name>`. Note that it carries no leading slash, so it is not an RFC 6901 JSON Pointer.
        status:
          type: string
          title: Status
          description: The HTTP status code for this error, as a string.
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem.
    error_code_server_error:
      enum:
        - bad_decimal_format
        - non_finite_number
        - null_bytes_in_params
        - recaptcha_browser_error
        - server_error
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 500.
    error_code_locked:
      enum:
        - locked
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 423.
    error_code_request_timeout:
      enum:
        - db_max_execution_time
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 408.
    error_code_forbidden:
      enum:
        - access_denied
        - account_inactive
        - agent_role_impersonation_denied
        - automatic_invoicing_not_manageable
        - billing_catalog_list_unavailable
        - booking_conflict_resolver_unavailable
        - budget_inaccessible
        - budgets_not_manageable
        - cascade_deletion_blocked
        - custom_roles_unavailable
        - deactivated_organization
        - deal_proposal_analytics_unavailable
        - deal_proposal_public_link_unavailable
        - document_styler_unavailable
        - document_templates_unavailable
        - email_inbox_unavailable
        - entry_not_editable
        - expense_not_editable
        - feature_unavailable
        - finalized_invoice_permission
        - financials_unavailable
        - impersonation_on_account_not_allowed
        - insufficient_automation_permission
        - insufficient_project_access
        - insufficient_seats
        - invalid_impersonate_role_id_header
        - invoices_unavailable
        - login_unavailable
        - mcp_access_disabled
        - mcp_connectors_disabled
        - mcp_provider_unavailable
        - missing_slack_integration
        - no_client_access
        - no_organization_id
        - no_person
        - no_sandbox_access
        - organization_red_flagged
        - other_timer_running
        - outgoing_emails_limit_exceeded
        - payment_reminders_unavailable
        - personal_access_token_limit_exceeded
        - pipelines_limit_exceeded
        - placeholders_limit_exceeded
        - plan_limit_exceeded
        - plan_unavailable
        - private_channel_forbidden
        - recipients_limit_exceeded
        - record_not_owned
        - report_templates_unavailable
        - restricted_email_in_trialing
        - role_bill_rate_unavailable
        - role_impersonate_denied
        - select_organization
        - service_inaccessible
        - service_type_inaccessible
        - single_sign_on_invalid
        - single_sign_on_login_only
        - single_sign_on_provision_failed
        - single_sign_on_unavailable
        - subscription_expired
        - subsidiaries_unavailable
        - subsidiary_out_of_scope
        - teams_limit_exceeded
        - two_factor_login
        - unallocated_expense_inaccessible
        - webooks_limit_exceeded
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 403.
    error_code_unauthorized:
      enum:
        - invalid_auth_token
        - invalid_password
        - invalid_proposal_token
        - invalid_token_signature
        - token_expired
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 401.
    error_code_bad_request:
      enum:
        - account_owner_missing
        - authorization_failure
        - bad_filter_request
        - bad_request
        - bad_sort_request
        - budget_report_failed
        - bulk_export_failed
        - calendar_reauthorization_required
        - changed_since_conflict
        - changed_since_invalid
        - changed_since_unsupported
        - company_export_match_changed
        - company_not_exported
        - cross_invoice_bulk
        - data_not_array
        - datev_request_failed
        - datev_token_refresh_failed
        - datev_token_refresh_locked
        - einvoice_export_failed
        - empty_body
        - exchange_currency_invalid
        - exchange_date_invalid
        - export_error
        - export_failed
        - export_status_unavailable
        - fields_request_invalid
        - formulas_request_invalid
        - group_custom_field_unsupported
        - group_param_relationship_unsupported
        - group_request_invalid
        - include_request_invalid
        - integration_error
        - invalid_request_parameters
        - invalid_seats_allocations
        - json_format_invalid
        - keyset_conflict
        - keyset_invalid_cursor
        - keyset_unsupported_sort
        - missing_date_period
        - missing_relationship_field
        - multipart_body_invalid
        - netsuite_credit_note_form_missing
        - netsuite_discount_amount_missing
        - netsuite_discount_item_missing
        - parameter_missing
        - peppol_transaction_failed
        - query_parameters_invalid
        - relationship_depth_unsupported
        - report_keyset_requires_single_type
        - report_keyset_restricted_access
        - report_keyset_unsupported_filter
        - report_keyset_unsupported_group
        - sort_custom_field_unsupported
        - sort_param_relationship_unsupported
        - sort_param_unsupported
        - tax_id_unsupported
        - unsupported_currency
        - unsupported_date_period
        - unsupported_filter
        - unsupported_filter_level
        - unsupported_filter_operation
        - unsupported_filter_value
        - unsupported_filter_value_type
        - unsupported_formula
        - unsupported_formula_component
        - unsupported_formula_operator
        - unsupported_group
        - unsupported_group_param
        - unsupported_include
        - unsupported_number_of_group_params
        - unsupported_sort
      type: string
      title: Error Code
      description: Every error `code` an endpoint can return with a 400.
    _meta:
      type: object
      title: Meta
      description: Pagination and response metadata returned with every collection endpoint.
      properties:
        current_page:
          type: integer
          description: The current page number in this paginated response (1-based).
          example: 1
        max_page_size:
          type: integer
          description: Maximum number of records allowed per page for this endpoint.
          example: 200
        organization_features:
          type: object
          description: Feature flags and capabilities enabled for the current organization, used for UI rendering.
          example: []
        page_size:
          type: integer
          description: Number of records returned per page in this response.
          example: 30
        settings:
          type: object
          description: Organization or user settings relevant to this resource's display.
          example:
            feature_x: true
            notifications:
              email: true
        total_count:
          type: integer
          description: Total number of records matching the current query across all pages.
          example: 42
        total_pages:
          type: integer
          description: Total number of pages available for the current query and page size.
          example: 5
      example:
        current_page: 1
        total_pages: 5
        total_count: 42
        page_size: 30
        max_page_size: 200
    _single_relationship:
      anyOf:
        - $ref: '#/components/schemas/_single_linkage_nullable'
        - $ref: '#/components/schemas/_not_included'
      description: A JSON:API single relationship — links to one related resource or `null`.
      example:
        data:
          type: tasks
          id: '42'
    _not_included:
      type: object
      title: Not included
      description: Placeholder for a relationship that was not sideloaded in this response.
      properties:
        meta:
          type: object
          description: Metadata indicating the sideload status of this relationship.
          properties:
            included:
              enum:
                - false
              type: boolean
              description: Whether the related resource was included in the sideloaded data. Always `false` for this variant.
              example: false
          required:
            - included
          example:
            included: false
      required:
        - meta
      example:
        meta:
          included: false
    _single_linkage_nullable:
      type: object
      title: Single nullable linkage
      properties:
        data:
          anyOf:
            - $ref: '#/components/schemas/_resource'
            - type: 'null'
      required:
        - data
    _resource:
      type: object
      title: Resource Identifier
      description: A JSON:API resource identifier object containing the resource type and ID.
      properties:
        id:
          type: string
          description: The unique identifier of the resource.
          example: 42
        type:
          type: string
          description: The resource type name (e.g. `tasks`, `people`, `deals`).
          example: tasks
      required:
        - id
        - type
      example:
        type: tasks
        id: '42'
    resource_resource_request_report:
      type: object
      title: Resource request report Resource
      properties:
        booking_method:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Booking Method
          description: The booking method ID specifying how the requested time is tracked.
        count:
          type: integer
          title: Count
          description: Number of resource requests aggregated into this row
        created_at_period:
          title: Created At Period
          description: Bucketed creation date, populated when grouping by created_at over a period
        creator:
          title: Creator
        creator_report:
          title: Creator Report
        currency:
          type: string
          title: Currency
          description: The currency code used for cost calculations on this resource request.
        currency_default:
          title: Currency Default
          description: The default account-level currency code used for cost calculations.
        currency_normalized:
          title: Currency Normalized
          description: The normalized quote-level currency code used for cost calculations.
        deal_or_budget_report:
          title: Deal or Budget Report
        ended_on_period:
          title: Ended On Period
          description: Bucketed end date, populated when grouping by ended_on over a period
        group:
          type: string
          title: Group
          description: The dimension value each aggregated row represents; mirrors the group query parameter
        resolver:
          title: Resolver
        resolver_report:
          title: Resolver Report
        resource_request:
          title: Resource Request
        service:
          title: Service
        service_report:
          title: Service Report
        service_type:
          title: Service Type
        started_on_period:
          title: Started On Period
          description: Bucketed start date, populated when grouping by started_on over a period
        status:
          enum:
            - pending
            - resolved
            - rejected
            - canceled
          type: string
          title: Status
          description: 'The current status of the resource request: pending, resolved, rejected, or canceled.'
        subsidiary:
          title: Subsidiary
        total_max_cost_per_hour:
          title: Total Max Cost Per Hour
          description: Sum of the maximum cost per hour of the requests in this row, in the record currency
        total_max_cost_per_hour_default:
          title: Total Max Cost Per Hour Default
          description: Sum of the maximum cost per hour of the requests in this row, converted to the account's default currency
        total_max_cost_per_hour_normalized:
          title: Total Max Cost Per Hour Normalized
          description: Sum of the maximum cost per hour of the requests in this row, converted to the report's normalized currency
    resource_resource_request:
      type: object
      title: Resource request Resource
      description: Schema for a resource request resource object.
      properties:
        tags:
          type: string
          title: Tags
          description: The list of tag labels associated with this resource request.
          example:
            eq: value
        booking_method_id:
          enum:
            - 1
            - 2
            - 3
          type: integer
          title: Booking Method
          description: The booking method ID specifying how the requested time is tracked.
          example:
            - 123
        canceled_at:
          type: string
          title: Canceled At
          format: date-time
          description: Timestamp when this resource request was canceled, or null if not canceled.
          example:
            gt: '2026-01-01'
        created_at:
          type: string
          title: Created At
          format: date-time
          description: Timestamp when this resource request was created.
          example:
            gt: '2026-01-01'
        creator:
          title: Creator
          description: The JSON:API relationship object for the person who created this resource request.
          example:
            eq: value
        creator_id:
          type: integer
          title: Creator
          description: The ID of the person who created this resource request.
          example:
            - 123
        currency:
          type: string
          title: Currency
          description: The currency code used for cost calculations on this resource request.
          example:
            eq: value
        currency_default:
          title: Currency Default
          description: The default account-level currency code used for cost calculations.
          example:
            eq: value
        currency_normalized:
          title: Currency Normalized
          description: The normalized quote-level currency code used for cost calculations.
          example:
            eq: value
        custom_field_attachments:
          title: Custom Field Attachments
          description: The JSON:API relationship objects for file attachments linked via custom fields.
          example:
            gt: '2026-01-01'
        custom_field_people:
          title: Custom Field People
          description: The JSON:API relationship objects for people linked via custom fields.
          example:
            eq: value
        custom_fields:
          type: object
          title: Custom Fields
          description: A JSON object containing custom field values for this resource request.
          example:
            eq: value
        deleted_at:
          type: string
          title: Deleted At
          format: date
          description: Timestamp when this resource request was soft-deleted, or null if active.
          example:
            gt: '2026-01-01'
        ended_on:
          type: string
          title: Ended On
          format: date
          description: The end date of the requested resource allocation period.
          example:
            eq: value
        exchange_date:
          type: string
          title: Exchange Date
          format: date
          description: The date used for the exchange rate lookup on this resource request.
          example:
            gt: '2026-01-01'
        exchange_rate:
          type: number
          title: Exchange Rate
          description: The exchange rate from the resource request currency to the default account currency.
          example:
            gt: 0
        exchange_rate_normalized:
          type: number
          title: Exchange Rate Normalized
          description: The exchange rate from the resource request currency to the normalized quote currency.
          example:
            gt: 0
        fields:
          type: object
          title: Fields
          description: A JSON object containing additional structured fields such as job_title, subsidiary_id, team_ids, service_type_ids, and tags.
          properties:
            tags:
              type: array
              items:
                type: string
              title: Tags
            job_title:
              type: string
              title: Job Title
            preferred_person_ids:
              type: array
              items:
                type: string
              title: Preferred Person Ids
            service_type_ids:
              type: array
              items:
                type: string
              title: Service Type Ids
            subsidiary_id:
              type: string
              title: Subsidiary Id
            team_ids:
              type: array
              items:
                type: string
              title: Team Ids
            job_role_id:
              type: string
              title: Job Role Id
          example:
            eq: value
        id:
          type: integer
          title: Id
          description: The unique identifier of this resource request.
          example:
            - 123
        job_title:
          type: string
          title: Job Title
          description: The requested job title for the resource, as stored in the resource request fields.
          example:
            eq: value
        max_cost_per_hour:
          title: Max Cost Per Hour
          description: The maximum cost per hour for the requested resource in the request currency.
          example:
            eq: value
        max_cost_per_hour_default:
          title: Max Cost Per Hour Default
          description: The maximum cost per hour converted to the default account currency.
          example:
            eq: value
        max_cost_per_hour_normalized:
          title: Max Cost Per Hour Normalized
          description: The maximum cost per hour converted to the normalized quote currency.
          example:
            eq: value
        note:
          type: string
          title: Note
          description: An optional HTML note providing additional context for this resource request.
          example:
            eq: value
        organization:
          title: Organization
          description: The JSON:API relationship object for the organization this resource request belongs to.
          example:
            eq: value
        percentage:
