paths:
  /api/v2/reports/payroll_item_reports:
    get:
      tags:
        - Reports
      summary: Get payroll item reports
      operationId: reports-payroll_item_reports-index
      description: Retrieve aggregated payroll item report data grouped by configurable dimensions.
      parameters:
        - $ref: '#/components/parameters/filter_payroll_item_report'
        - $ref: '#/components/parameters/sort_payroll_item_report'
        - $ref: '#/components/parameters/group_payroll_item_report'
      responses:
        '200':
          $ref: '#/components/responses/collection_payroll_item_report'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '408':
          $ref: '#/components/responses/request_timeout'
        '423':
